[project]
# One entry per directory that declares Catala modules (module resolution is not
# recursive, so cross-directory `> Using` needs each module dir listed here).
include_dirs = [
  "rules/estg/p32a",
  "rules/estg/p04_arbeitszimmer_homeoffice",
  "rules/estg/p09_entfernungspauschale",
  "rules/estg/p32_kinderfreibetrag",
  "rules/estg/p33a_unterhalt",
  "rules/estg/p33",
  "rules/estg/p35a",
  "rules/estg/p10b",
  "rules/estg/p10",
  "rules/estg/p31",
  "rules/estg/p24a",
  "rules/estg/p24b",
  "rules/estg/p21_2",
  "rules/estg/p10_1_3_3a",
  "rules/estg/p10_1_7",
  "rules/estg/p16_4_freibetrag",
  "rules/estg/p4_3_gewinn",
  "rules/estg/p6_2_gwg_sofortabzug",
  "rules/estg/p10d_2_verlustvortrag_abzug",
  "rules/estg/p15_1_2_mitunternehmer",
  "rules/estg/p34_3_ermaessigter_durchschnittssatz",
  "rules/estg/solzg",
  "rules/estg/arbeitnehmerfall",
  "rules/estg/integration",
]
build_dir = "_build"
target_dir = "_target"

# Self-contained Python export of the § 32a tariff module (+ Teilregeln), consumed by the
# GETTSIM differential-test harness (nur Einkommensteuertarif) und den golden/produkt-Accessor
# (via oracle/gettsim/assemble_catala.sh -> oracle/gettsim/_catala/pkg/). Haushaltsnahe (§ 35a) +
# SpendenAbzug (§ 10b) sind reine Teilregeln, vom Accessor aufgerufen und in p32a eingespeist.
[[target]]
name = "p32a-python"
modules = ["Einkommensteuertarif", "Entfernungspauschale", "Arbeitszimmer_homeoffice", "Haushaltsnahe", "SpendenAbzug", "AgbAbzug", "Kirchensteuerabzug", "ZumutbareBelastung", "Familienleistungsausgleich", "Altersentlastungsbetrag", "Entlastungsbetrag", "VerbilligteVermietungWk", "KrankenPflegeVorsorge", "Berufsausbildungsaufwendungen", "BetriebsFreibetrag", "EuerGewinn", "GwgSofortabzug", "Verlustvortrag", "MitunternehmerEinkuenfte", "ErmaessigterDurchschnittssatz"]
backends = ["python"]
include_sources = true
