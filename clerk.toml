[project]
# One entry per directory that declares Catala modules (module resolution is not
# recursive, so cross-directory `> Using` needs each module dir listed here).
include_dirs = [
  "rules/estg/p32a",
  "rules/estg/p04_arbeitszimmer_homeoffice",
  "rules/estg/p09_entfernungspauschale",
  "rules/estg/solzg",
  "rules/estg/arbeitnehmerfall",
  "rules/estg/integration",
]
build_dir = "_build"
target_dir = "_target"

# Self-contained Python export of the § 32a tariff module, consumed by the
# GETTSIM differential-test harness (oracle/gettsim/).
[[target]]
name = "p32a-python"
modules = ["Einkommensteuertarif", "Entfernungspauschale", "Arbeitszimmer_homeoffice"]
backends = ["python"]
include_sources = true
