  Norm-Text-Fragmente (Hebesatz 8/9 %, § 51a-Basis) = nicht_material_backlog (wirkt_hinein,
  scope_gap informativ). KEINE bedingung_neu: Kirchensteuerpflicht steckt in satz=0.'
