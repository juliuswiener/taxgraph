  - id: p33b-stufe-2
    titel: "§ 33b — Doppelabzug Pauschbetrag neben § 33"
    status: analysiert
    bericht: reports/adjudikation/p33b-abs5-s4-analyse.md
    bauanleitung: reports/adjudikation/p33b_stufe2_bauanleitung_2026-08-07.md
    achse_geklaert: |
      2026-08-07: behinderungsbedingte_aufwendungen gehoert FALLWEIT, nicht per Kind.
      Beleg: agb_aufwendungen (bindung_sonder_agb_35a.yaml:68) hat keine instanz_gruppe;
      eine "davon"-Teilmenge muss auf derselben Achse liegen wie ihr Obermengen-Feld.
      Die Uebertragung nach S. 1 ist zwar per Kind, die ausgeschlossenen Aufwendungen
      nach S. 4 sind aber die des Steuerpflichtigen. Damit entfaellt die
      EM.instanzen-Schleife — kein kind_kv/kind_pv-Muster, einfaches Zusatzfeld.
    einheiten_falle: |
      _c(...) liefert CENT, die Senke (catala_p33_agb) will EURO. In CENT rechnen,
      genau EINMAL am Ende // 100. Der erste Entwurf zog EURO von CENT ab.
    aufwand_h: 2
    richtung: under-tax
    messung: |
      40.000 Lohn, einzel, GdB 100, 3.000 EUR agB:
        nur Pauschbetrag        880,00 Wirkung
        nur agB                 259,00 Wirkung
        beides                1.131,00 Wirkung   -> praktisch additiv
      ~251 EUR zu wenig Steuer, WENN die Aufwendungen behinderungsbedingt sind.
    fundstellen:
      - stelle: "§ 33b Abs. 5 S. 4"
        art: "automatischer Ausschluss bei Uebertragung"
        ring: "kann kuerzen"
      - stelle: "§ 33b Abs. 1 S. 1 (anstelle einer Steuerermaessigung nach § 33)"
        art: "WAHLRECHT, S. 2 einheitlich auszuueben"
        ring: "kann es NICHT erzwingen — braucht eine Nutzerfrage"
    blocker: |
      agb_aufwendungen ist ein ungetrennter Topf. Pauschal kuerzen waere Over-tax
      (Krankheitskosten, Beerdigung fielen mit raus), gar nicht kuerzen ist Under-tax.
      Loesung: ein Feld behinderungsbedingte_aufwendungen als "davon"-Teilmenge,
      additiv (absent = 0 = heutiges Verhalten). Praezedenz: kind_kv/kind_pv.
    belegt_negativ: |
      KEIN Kz im E10-XSD fuer diese Teilmenge. Gegenprobe ueber xs:documentation nach
      Waeschebedarf / taeglichem Leben / Einzelnachweis: 6 Treffer, alle
      "Kilometersatz bei Einzelnachweis", unbeteiligt. Das Feld bleibt rein rechnerisch.
    kein_default_moeglich: |
      Bei unbeantworteter Wahlrechts-Frage gibt es KEINEN over-tax-sicheren Default:
        kleiner Aufwand  PB 880 > agB 259   -> PB waere zu hoch
        grosser Aufwand  PB 880 < agB 3157  -> PB waere zu niedrig
      Der Nutzer MUSS gefragt werden.
    reihenfolge: "Abs. 5 zuerst (Ring erzwingt), dann Abs. 1 (Nutzerfrage)"

  - id: vpf-frist-null-plausibilitaet
    titel: "§ 9 Abs. 4a S. 6/7 — >3 Monate erklaert, aber 0 Tage nach Frist"
    status: entschieden
    aufwand_h: 1.5
    richtung: under-tax
    entdeckt: "2026-08-07, als Nebenbefund beim Schliessen von vpf-dreimonatsfrist"
    messung: |
      monate=5, tage_24h=60, alle drei NACH_FRIST=0 bestaetigt
        -> voller Abzug 1680 EUR WK, keine S.6-Kuerzung
      identisch zum Fall ohne jede Monatsangabe. Der Ring kann "wirklich 0 Tage
      nach Fristablauf" nicht von "Nutzer hat 0 hingeschrieben" unterscheiden.
    warum_keine_harte_sperre: |
      0 ist eine legitime Antwort. § 9 Abs. 4a S. 7 laesst die Frist bei laengerer
      Unterbrechung neu anlaufen — wer 5 Monate auf Montage gemeldet ist, aber nur
      in den ersten Wochen hinfaehrt, hat korrekt 0 Tage nach Frist. Schlamper und
      Sonderfall tippen dieselbe 0.
    entscheidung_julius: "2026-08-07: sperren MIT Rueckfrage, nicht hart ablehnen"
    plan: |
      Bool-Feld vpf_frist_unterbrochen (askable, fallweit), Sperrgrund solange
      unbeantwortet. Die Antwort ist eine Bestaetigung, kein Rechenparameter —
      sie aendert das Ergebnis nicht, sie holt die Erklaerung ein.

