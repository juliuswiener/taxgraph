  - id: llm-vorschlag-abweisung-ohne-grund
    titel: "Abgewiesener LLM-Vorschlag verschwindet still — abgelehnt nennt nur die feld_id"
    status: offen
    aufwand_h: null
    entdeckt: "2026-08-12, beim Beantworten von Julius' Frage 'kann das LLM die Felder ausfuellen?'"
    richtung: "kein Geldfehler — Vertrauens- und Bedienbarkeitsluecke im Kernpfad des Produkts"
    messung: |
      Der Pfad IST gebaut und funktioniert: chat() (api.py:2972) nimmt Freitext, das LLM
      schlaegt Feldwerte vor, jeder Vorschlag wird als VORLAEUFIGES Event geschrieben
      (schreiber="llm:chat", zustand="vorlaeufig", signal_2=None). Vier Sperren greifen:
        store.py:200  Katalog-Check — nur Felder mit vorschlagbar_von: [llm]
        store.py:219  Magnitude-Bound F2 — >= 10^10 Cent (EUR-statt-Cent)
        store.py:225  Typ-Zwang — zustand=bestaetigt braucht signal_2, das LLM setzt None
        store.py:228  Auflage B — hoechstens EIN aktives Event je feld_id; Ueberschreiben
                      braucht ersetzt=<event_id>, und chat() uebergibt ersetzt NICHT
      Aus Auflage B folgt: das LLM kann ein vom Nutzer gesetztes Feld strukturell NICHT
      ueberschreiben. Das von Julius gewuenschte Permission-Gate existiert also bereits —
      strenger als gefordert, denn es fragt nicht, es verweigert.
    der_eigentliche_befund: |
      api.py:3012 faengt (ValueError, KeyError) und ueberspringt STILL. Die Antwort fuehrt
      den Vorschlag nur als feld_id in `abgelehnt` — OHNE Grund und OHNE den Wert, den das
      LLM vorgeschlagen hatte. Damit fallen zwei voellig verschiedene Faelle in dieselbe
      Liste:
        (1) "dieses Feld darf ein LLM nie setzen"      -> korrekt, endgueltig
        (2) "du hast dieses Feld schon selbst gesetzt" -> genau hier will der Nutzer gefragt
                                                          werden, und genau hier schweigt es
      Nutzersicht: langer Freitext, das LLM erkennt zehn Felder, drei davon hat der Nutzer
      vorher selbst getippt. Die drei verschwinden lautlos. Er sieht drei feld_ids ohne
      Erklaerung und erfaehrt nie, was das LLM dort vorgeschlagen haette.
    bauvarianten: |
      (a) `abgelehnt` von list[feld_id] auf list[{feld_id, grund, wert}] heben. Klein,
          aber ein Schema-Bruch an einem oeffentlichen Endpunkt.
      (b) Fall (2) gar nicht ablehnen, sondern als Konflikt-Vorschlag zurueckgeben, den der
          Nutzer im Fluss annehmen kann (dann schreibt die HAUT das ersetzt-Event, nicht
          das LLM). Das ist der eigentlich gewuenschte Permission-Dialog.
          Auflage B bleibt unangetastet — das LLM bekommt kein ersetzt-Recht.
      (c) Beides: (a) als Sofortmassnahme (Sichtbarkeit), (b) als Produktschritt.
    achtung: |
      Auflage B NICHT aufweichen. Ein ersetzt-Recht fuer den Schreiber "llm:chat" waere
      genau der stille Ueberschreib-Pfad, den Julius verhindert haben will. Der Dialog
      gehoert in die Haut, die Sperre bleibt im Store.
    julius: "Frage kam von ihm (2026-08-12); Variante noch nicht entschieden."

  - id: rentner-praefix-rename-bricht-den-store
    titel: "rentner_-Praefix umbenennen ist kein Rename, sondern eine Datenmigration"
    status: analysiert
    aufwand_h: null
    entdeckt: "2026-08-12, Blast-Radius-Messung vor einem beauftragten Rename"
    ersetzt_einschaetzung: |
      Fund 7 aus commit-nur-defer-sweep-2026-08-10 fuehrte das als "rein STRUKTUR
      (Lesbarkeit/Wartung), kein Geldeffekt". Das stimmt fuer die WIRKUNG, unterschaetzt
      aber die KOSTEN erheblich. Diese Messung ersetzt die Aufwandseinschaetzung.
    messung: |
      Ausgangspunkt ist der Kommentar api.py:903: der "rentner_"-Feldname ist NICHT
      rentner-spezifisch. Stimmt inhaltlich — rentner_veraeusserungsgewinn betrifft jeden
      mit § 16-Gewinn, rentner_grad_der_behinderung jeden mit GdB.
      Gemessen 2026-08-12:
        produkt/ + tests/ + golden/   ueber 30 verschiedene rentner_-Feld-IDs
        produkt/haut/faelle/          295 Dateien, davon 89 mit rentner_-Feld-IDs
      Der Store ist append-only und event_id ist ein Hash UEBER das Event inklusive
      feld_id (store.py:246, event_id(event)). Ein Rename aendert damit jeden betroffenen
      event_id und reisst die ersetzt-Ketten, die auf die alten IDs zeigen (store.py:235-241
      loest ersetzt gegen event_id auf).
    folge: |
      Ein Rename braucht eine Migration, die (1) feld_id umschreibt, (2) alle event_ids neu
      berechnet, (3) alle ersetzt-Referenzen nachzieht, (4) snapshot_ids invalidiert oder
      neu bildet — plus ein Gate, das beweist, dass die materialisierten felder vor und nach
      der Migration identisch sind. Das ist kein Aufraeumen, das ist ein eigenes Vorhaben.
    empfehlung: |
      LIEGENLASSEN. Der Nutzen ist Lesbarkeit, der Preis ist eine Migration auf dem
      Event-Log — dem einzigen Artefakt im Repo, das echte Nutzerdaten traegt und nicht
      reproduzierbar ist. Falls es doch gemacht wird: NICHT waehrend anderer Arbeit an
      api.py, und mit einem Vorher/Nachher-Vergleich der materialisierten felder als Gate.
    julius: "Auftrag zum Umbenennen kam 2026-08-12; nach dieser Messung zurueckgestellt, Entscheidung offen."

  - id: vorjahr-kategorie-ohne-verhalten
    titel: "vorjahr-Flag uebernehmbar/vorschlag ist deklariert, aber verhaltensgleich"
    status: offen
    entdeckt: |
      2026-08-12, im Zuge des §10d-Sweeps (rechenluecken: commit-nur-defer-sweep-2026-08-10,
      Fund 3 — verlustvortrag_bestand + zwei weitere Felder derselben Klasse).
    befund: |
      schema.json:70-71 deklariert zwei Kategorien mit unterschiedlicher Bedeutung:
      uebernehmbar = Stammdaten/kohorten-fix (direkter Vorschlag), vorschlag =
      jahres-spezifischer Betrag (Nutzer aktualisiert). produkt/import/vorjahr_writer.py
      behandelt beide IDENTISCH: uebertragbare_felder() sammelt {fid: kategorie} nur als
      Metadatum, uebernehme_vorjahr() kopiert `wert = vf["wert"]` (Zeile 47) unterschiedslos
      fuer beide Kategorien. `kat` landet ausschliesslich in signal_1["kategorie"] — ohne
      Einfluss auf zustand, Praesentation oder irgendeine Verzweigung im Code. Betrifft alle
      228 Felder mit gesetztem vorjahr-Flag repo-weit (18 bindung_*.yaml-Dateien, gezaehlt
      2026-08-12).
    klasse: |
      Versprochene Unterscheidung, nicht materialisiert — das Schema erklaert ein Verhalten,
      der Code liefert es nicht. Dieselbe Fehlerklasse ist an anderer Stelle im Repo bereits
      vorgekommen (Hinweis team-lead, 2026-08-12) — hier nicht neu recherchiert, nur uebernommen.
    wirkung: |
      Aktuell FOLGENLOS, kein Rechenfehler: das Zwei-Signal-Prinzip stuft jede Vorjahres-
      Uebernahme ohnehin als vorlaeufig ein, traverser.py:77-78 (_unbeantwortet) fuehrt sie
      unabhaengig von der Kategorie in naechste_fragen, der Nutzer bestaetigt jeden Wert selbst.
      Die Luecke wird erst wirksam, wenn die Unterscheidung tatsaechlich GENUTZT werden soll
      (z.B. vorschlag-Felder auffaelliger markieren, oder uebernehmbar-Felder ohne Ruecknachfrage
      uebernehmen) — dann muss zuerst geklaert werden, was jede Kategorie tun soll, bevor an
      228 Feldern etwas gebaut wird.
    entscheidung_noetig: "Julius — was soll uebernehmbar vs. vorschlag tatsaechlich unterschiedlich tun? Kein Bau ohne diese Entscheidung."
    aufwand_h: unbeziffert

