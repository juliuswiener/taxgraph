        AUDIT_DIR = os.environ.get("TAXGRAPH_AUDIT_DIR") or os.path.join(_HIER, "haut", "faelle")
      append() macht fsync pro Zeile.

      Inhalt (nur gelesen): user_id fast nur dev/testuser, fall_id u.a. p101a,
      test_fall_id — Fixture-Namen aus dem Testcode. Bewertung: Testmuell, KEINE echten
      Falldaten. Stichprobe 2000 Zeilen ab Kopf plus head/tail.
    rest_offen: |
      Regressionssperre fehlt. Ohne Gate schreibt der naechste Test, der AUDIT_DIR
      vergisst, wieder ins echte Log — und niemand merkt es, weil die Datei gitignored
      ist. Genau so ist sie auf 582 MB gewachsen. Laeuft bei dev-b: conftest-Autouse
      gegen Zeilenzahl-Vergleich, mit Pflicht-Mutationsprobe (Patch entfernen -> rot
      mit Testnamen).
      Offene Nebenfrage: wenn die conftest-Variante traegt, koennten die 32
      Einzelpatches zurueckgebaut werden. Nur gemessen, nicht gemacht — separater
      Aufraeumschritt.
    nicht_gemessen: |
      Laufzeit-Ersparnis durch den wegfallenden fsync. Die Vorher-Laeufe schwankten
      193s/407s unter Fremdlast, die Nachher-Laeufe liegen stabil bei ~225s — das ist
      NICHT auf fsync zurueckfuehrbar. Keine Zahl behauptet.
    entscheidung_julius: |
      Die 582-MB-Datei selbst wird NICHT angefasst. Loeschen oder rotieren ist Julius'
      Entscheidung. Sie waechst ab jetzt nicht weiter (delta=0 gemessen), der Druck ist
      also raus — es ist Plattenplatz, kein Datenrisiko (Testmuell, keine Falldaten).

  - id: sys-path-zu-paketen
    titel: "sys.path-Injektion durch echte Pakete ersetzen"
    status: analysiert
    bericht: reports/adjudikation/sys_path_messung_2026-08-07.md
    aufwand_h: null
    messung: |
      2026-08-07 nachgemessen, die alte Zahl war falsch:
        133 Dateien, 187 sys.path.insert-Aufrufe (andere Formen: 0)
        tests/   123 Dateien / 174 Aufrufe  = 92 % des Problems
        produkt/  10 Dateien /  13 Aufrufe
      Die alte Angabe "35 in Produktion" war um Faktor 3,5 zu hoch.
    wirkung: |
      Was am AST-Resolver scheitert, scheitert genauso an mypy/pyright, IDE-Navigation,
      automatischem Rename und Import-Zyklus-Checks. Beides im Report belegt
      (mypy und pyright koennen die Injektionen nicht aufloesen).
    zwei_stufen: |
      Weil die Produktion fast sauber ist, zerfaellt der Umbau in zwei unabhaengige
      Vorhaben, die einzeln entschieden werden koennen:
        Stufe 1  produkt/, 10 Dateien — ~0,5 Tage. Echtes Laufzeitrisiko (ein
                 falsch aufgeloester Import bricht Ring oder Server erst zur
                 Laufzeit), braucht ein Gate. Lohnt sich auch allein.
                 api_llm.py hat keinen eigenen Aufruf und erbt den Pfad von api.py —
                 muss mit api.py zusammen umgestellt werden.
        Stufe 2  tests/, 123 Dateien — ~2,5-4 Tage. Mechanisch, kein Produktions-
                 risiko: ein Fehler ist sofort ein roter Test.
    reihenfolge: |
      Stufe 1 NACH dem api.py-Split — beide fassen api.py/api_llm.py/server.py an,
      und der Split legt die Modulgrenzen fest, an denen sich die Importe danach
      ausrichten. Stufe 2 blockiert nichts und kann jederzeit laufen.

