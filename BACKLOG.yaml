                        60 Tage, 15 nach Fristablauf   1260 EUR   -> S.6 kuerzt 420 EUR
      grep nach_drei_monaten in produkt/haut/api.py:   0 Treffer
      in SCHEIBEN["gesamt"]["felder"]:                 alle drei gelistet
    loecher:
      - "Guard (_an_gesamt_sperrgrund) verlangt bei gesetzten Verpflegungstagen eine
         beantwortete Mahlzeiten-Frage — die Testfaelle setzen sie nie, der Assert lief nie"
      - "api.py liest VERPFLEGUNG_TAGE_NACH_FRIST nie aus f in gesamt_wk_input —
