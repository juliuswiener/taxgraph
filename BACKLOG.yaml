           Zeitraum) und Elt_k_ZV/Kosten (E0506604 Eigenanteil-Summe + Einz-Paar E0506605
           Betrag/E0506606 Zeitraum — Summe ohne Einzelposten wurde beanstandet).
      kind_geburtsjahr (int, kein Kz) umbenannt zu kind_geburtsdatum (typ text, TT.MM.JJJJ,
      E0500701) — 0 Produktions-Leser gemessen vor der Umbenennung, keine Zweit-Repraesentation.
