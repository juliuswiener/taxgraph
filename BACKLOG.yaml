    status: erledigt
    erledigt_in: "6562c52 + 03aa10b + 3cdbede (2026-08-10)"
    erledigt_wie: |
      Einzelaufstellung fuer alle drei Toepfe (Minijob, Dienstleistung, Handwerker) ueber
      den vorhandenen instanz_gruppe-Mechanismus, Form Einz[99]+Sum[1]. Die Summen werden
      jetzt AUS den Instanzen berechnet statt zusaetzlich erfragt (askable:false) — zwei
      Repraesentationen derselben Sache waren hier mehrfach Geld.
      Zwei Nebenbefunde aus derselben Arbeit: ein Uebergangstest fuer alte Flat-Werte
      (03aa10b) und ein Ring, der den Bestandswert 0 statt des Flat-Werts las (3cdbede).
