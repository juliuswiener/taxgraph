    status: erledigt
    erledigt_in: "69a53d9 + 81c552b (2026-08-10)"
    erledigt_wie: |
      Julius-Freigabe. stammdaten_iban (Wert-Praefix-Routing DE -> E0102102, sonst E0102603),
      stammdaten_bic -> E0102201, Kontoinhaber E0101601 automatisch. Exklusivitaet zweigeteilt:
      Widerspruch faengt deklariere() praesenzsicher, Schweigen faengt der Abgabepfad.
      GEMESSEN und damit zwei Annahmen widerlegt: Person B braucht KEIN eigenes Feld, und
      BIC ist bei Auslands-IBAN NICHT Pflicht (checkESt prueft nur die Laender-Konsistenz,
      wenn einer mitkommt). Der vorab als fail-closed gebaute BIC-Zwang wurde nach der
      Messung wieder entfernt.
    richtung: "kein Rechenfehler — aber eine Erstattung koennte nicht ausgezahlt werden"
    entdeckt: "2026-08-10, beim Stammdaten-Bau"
    messung: |
      Gebaut wurde nur stammdaten_keine_bankverbindung (bool -> E0102002). Ein IBAN/BIC-Feld
      existiert nicht; IBAN kommt im Produkt bisher ausschliesslich als PII-Maskierungsziel
      vor, nie als Sachverhaltsfeld.
      Fuer rc=0 reicht das Bool — checkESt verlangt nur, dass EINES von beidem da ist.
    warum_es_trotzdem_zaehlt: |
      "Keine Bankverbindung vorhanden" ist keine technische Fuellangabe, sondern eine
      Erklaerung gegenueber dem Finanzamt. Wer sie abgibt und eine Erstattung erwartet,
      bekommt sie nicht ueberwiesen. Unser Testfall und damit jeder heutige Durchstich
      erklaert genau das.
    kopplung_gemessen: |
      IBAN allein -> "Kontoinhaber fehlt" (Kto_Inh faktisch Pflicht trotz minOccurs=0).
      IBAN UND Sonderfeld gleichzeitig -> harter Exklusivitaetsfehler.
      Ein IBAN-Baustein braucht also mindestens IBAN + Kontoinhaber + eine Weiche, die
      genau eines von beidem deklariert.
    entscheidung_julius: |
      OFFEN. Fuer den ersten Durchstich nicht noetig. Vor einer ECHTEN Abgabe zu klaeren,
      weil die Antwort daran haengt, ob eine Erstattung erwartet wird.

  - id: rc-null-erreichbar-belegt
    titel: "rc=0 ist erreicht — das amtliche Plugin akzeptiert eine TaxGraph-Erklaerung"
    status: erledigt
    erledigt_in: "70614c2 (2026-08-10)"
    erledigt_wie: |
      Nicht mehr nur erreichbar, sondern ERREICHT. Nach Julius' drei Entscheiden
      (KAP-Nullwerte filtern, echte Lohnsteuer deklarieren, VZ 2025) meldet checkESt
      auf ALLEN Pfaden rc=0, von main unabhaengig nachgemessen:

        einzel     rc=0 [plausibel]  0 Fehler
        zusammen   rc=0 [plausibel]  0 Fehler
        Endpunkt   rc=0
        Delta-Wache Endpunkt/Funktion: 0

      Kirchensteuerpflichtig mitgemessen (einzel evangelisch, zusammen evangelisch +
      roemisch-katholisch) — beide rc=0. Das war der Fall, an dem die Religion-
      Lohnsteuer-Kopplung haette scheitern koennen.

      Volle Suite 1741 passed, 4 skipped, 0 failed.

      DAMIT IST DIE ABGABEACHSE OHNE OFFENE BAUAUFGABE. Was bleibt, sind Entscheidungen
      (testversand, bankverbindung-nur-bool) und Punkte ausserhalb dieser Achse.
    entdeckt: "2026-08-10"
    bericht: reports/adjudikation/entscheidungsvorlage_restfehler_2026-08-10.md
    messung: |
      Erstmals in der Projektgeschichte hat checkESt eine vom Produkt erzeugte
      Einkommensteuererklaerung vollstaendig angenommen. Von main unabhaengig
      nachgemessen, Schritt fuer Schritt, ERiC 44.2.4.0 / ESt_2025, einzel:

        Ausgangslage (committet)   rc=610001002   3 Fehler
        + KAP-Kz entfernt          rc=610001002   2
        + Steuerklasse "1"         rc=610001002   1
        + Lohnsteuer "0,00"        rc=0           0   [plausibel]

      Damit ist der Weg zum Ziel nicht mehr geschaetzt, sondern vermessen: DREI
      Entscheidungen trennen das Produkt von einer amtlich plausiblen Erklaerung.
    wichtige_abgrenzung: |
      rc=0 heisst "besteht die amtliche Plausibilitaetspruefung", NICHT "eingereicht".
      Der Versand ist ein eigener Schritt (Zertifikat, PIN, ERIC_SENDE statt
      ERIC_VALIDIERE, echter Netzpfad) und im Code bewusst nirgends verdrahtet.
      Er gehoert zu Julius, nicht in einen Automatismus. Siehe testversand.
    zusammenveranlagung_belegt: |
      NACHGETRAGEN 2026-08-10: zusammen erreicht rc=0 ebenfalls, unter denselben drei
      Entscheidungen auf beide Personen angewandt. In ALLEN drei Konfessions-Konstellationen
      gemessen — das ist wichtig, weil unsere Testfaelle bisher auf "keine" standen:

        beide konfessionslos              6 -> 0
        beide kirchensteuerpflichtig      8 -> 0   (Kirchensteuer 0,00 fuer beide)
        gemischt (A pflichtig, B nicht)   7 -> 0   (Kirchensteuer nur fuer A)

      Damit ist der Zielfall der Roadmap (M6.1: Zusammenveranlagung) belegt, nicht nur
      der einfachere Einzelfall. Kirchensteuerpflicht koppelt strikt pro Person, keine
      person-uebergreifende Kopplung gefunden.
    zwei_bau_konsequenzen: |
      Beide beim Messen gefunden, nicht vorher bekannt:

      (1) Die KAP-Entfernung muss ATOMAR ueber beide Personen laufen. Wird sie nur fuer
          Person A gemacht und B behaelt kap_*=0, bleibt die Fehlerzahl bei 6 — aber die
          Meldung wechselt auf einen NEUEN Typ: "Sie haben angegeben, dass Sie Angaben
          fuer 'PersonA' machen moechten, haben aber ausser der Angabe im Feld
          $/KAP[1]/Person[1]$ keine weiteren Angaben getaetigt." Ein halber Umbau
          durchlaeuft also einen Zwischenzustand mit eigener Fehlerklasse.

      (2) Die Komma-Dezimal-Falle betrifft Person B identisch (dieselben Kz-Elemente
          E0200301/E0200501, nur mit Person-Diskriminator). Ein Fix, der NUR die
          1:1-Stelle (est_mapping.py:350) korrigiert und die PARTNER_INSTANZ-Stelle
          (est_mapping.py:340) auslaesst, laesst Person B falsch formatiert zurueck.
    nicht_gefunden: |
      Erwartet und WIDERLEGT: eine Steuerklassen-Kombinationsregel fuer Verheiratete.
      Steuerklasse 1/1 laeuft in allen drei Konfessions-Faellen sauber bis rc=0 durch —
      checkESt kennt diese Plausibilitaet nicht. Negativbefund, damit niemand danach sucht.
    was_noch_fehlt: |
      - der Produktivpfad (/einreichen) faehrt weiter abgabefaehig=False, siehe
        endpunkt-naht-abgabepfad; die Messung oben lief ueber erzeuge_xml direkt
      - die drei Entscheidungen sind offen, die Messung nimmt sie nur vorweg

  - id: testversand
    titel: "Testversand gegen die ELSTER-Testumgebung (Roadmap M4.4)"
    status: erledigt
    erledigt_in: "durchgefuehrt 2026-08-12 (kein Code-Commit — der Pfad stand seit a1e8e0f)"
    erledigt_wie: |
      TESTVERSAND ERFOLGREICH: rc=0, Telenummer KS1, Testmerker 700000004
      (ERIC_TESTMERKER_CLEARINGSTELLE — der Fall wird dort aussortiert und verworfen,
      erreicht das Finanzamt nicht). Gesendet wurde der Ratschen-Testfall (Hans Maier),
      NICHT Julius' eigene Daten. Damit ist die Uebertragungsstrecke zum ersten Mal
      ende-zu-ende bewiesen, nicht nur die Plausibilitaet des XML.
      Das alte Zertifikat war seit 538 Tagen abgelaufen (notAfter 2025-02-20;
      ELSTER-Softwarezertifikate laufen 3 Jahre). Julius hat ein neues gezogen, Pfad und
      PIN stehen in .env (gitignored, .gitignore:25).
    einordnung_wichtig: |
      checkest_gate.py ruft EricBearbeiteVorgang mit ERIC_VALIDIERE und uebergibt
      Zertifikat-Handle und PIN als None. Die gesamte Test-Infrastruktur (Ratsche,
      Feld-Matrix, Block-Matrix) lief also NIE ueber das Zertifikat. Ein abgelaufenes
      Zertifikat blockiert allein den Versand und entwertet keine einzige rc=0-Aussage.
    vorbereitet_in: "a1e8e0f (2026-08-10)"
    vorbereitet_wie: |
      Der Sendepfad ist gebaut, aber NIE ausgeloest worden — kein einziger ERiC-Sendeaufruf,
      auch nicht testweise. elster/versand.py als eigenstaendiges Modul, checkest_gate.py
      unangetastet. 19 Tests, ERiC vollstaendig gemockt.

      Kein versehentlicher Sendeweg (von main nachgeprueft, alle Zaehler 0): kein Import in
      produkt/, kein Makefile-Target, KEINE HTTP-Route, nicht in Fixtures. ERIC_SENDE wird
      an genau EINER Stelle im Repo gesetzt (versand.py:226). Eine /versenden-Route wurde
      bewusst NICHT gebaut — sie haette einen ueber HTTP erreichbaren Sendepfad geschaffen.

      Drei unabhaengige Sperren, jede fail-closed VOR jedem ERiC-Aufruf:
        1. Echtversand verlangt die woertliche Phrase ECHTVERSAND_FREIGABE — kein Bool,
           kein Default.
        2. versand.py liest das XML SELBST und prueft den Testmerker gegen den behaupteten
           Modus. Es vertraut weder dem Aufrufer noch dem Writer.
        3. CLI verlangt zusaetzlich eine interaktiv getippte Zweitbestaetigung (nicht aus
           der History kopierbar).
      Von main unabhaengig mutationsgeprueft: Sperre 1 ausgebaut -> 2 Tests rot, zurueck ->
      19 gruen, git diff leer.

      Ohne Zertifikat bricht es dreistufig ab (kein Pfad / Datei fehlt / keine PIN), jeweils
      BEVOR ERiC kontaktiert wird; ein Test belegt das ueber fake.calls == [].
      Anleitung: elster/VERSAND.md.
    blockade_rest: |
      Nur noch das Zertifikat + PIN (Julius, 2026-08-10 nachmittags). Der Versand selbst
      bleibt eine ausgehende Aktion und wird ausschliesslich von Julius ausgeloest —
      Testmerker 700000004 heisst amtlich: in der Clearingstelle aussortiert und verworfen,
      keine Verarbeitung im Finanzamt.
    blockade: "setzt rc==0 auf dem echten Fall voraus (alle Punkte dieser Sektion)"
    hinweis: |
      Erst wenn checkESt rc=0 meldet, ist ein Versand ueberhaupt sinnvoll. Versand
      ist ausgehende Aktion -> Julius, nie automatisch. Testmerker 700000004 ist im
      Writer gesetzt und wird nie ans Finanzamt zugestellt.

