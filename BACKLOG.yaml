abgabe:

  - id: hersteller-id-namens-naht
    titel: ".env fuehrt HERSTELLER_ID, die Gates lesen ELSTER_HERSTELLER_ID"
    status: teil_erledigt
    richtung: "kein Geldfehler — blinder Fleck im Gate"
    entdeckt: "2026-08-09"
    messung: |
      .env (gitignored, .gitignore:25) fuehrt den Schluessel HERSTELLER_ID.
      elster/eric_gate.py und elster/checkest_gate.py lesen ELSTER_HERSTELLER_ID.
      Wegen des Namens-Mismatch lief Stufe B (checkESt) NIE:
        ohne Export   rc=610301202 hersteller_id_gesperrt -> Gate wertet das als
                      "erwartete credential-freie Grenze" und meldet GRUEN
        mit  Export   rc=0 plausibel
      Die ID ist also seit jeher gueltig und registriert. Das Gate hat jahrelang
      seine eigene Blindheit als erwartetes Ergebnis gemeldet.
    wirkung: |
      Ohne Stufe B blieb als einzige Pruefung des Abgabe-XML die XSD-Validierung —
      und die ist nachweislich blind fuer das, was ERiC ablehnt (siehe
      ns-praefix-am-elster-root). Der gesamte Abgabepfad war ungeprueft.
    rest_offen: |
      Der deterministische .env-Loader (conftest + Makefile) ist noch nicht gebaut;
      heute muss man von Hand exportieren. tests/test_checkest_durchstich.py liest
      .env bereits selbst als Notnagel.
    lehre: "Ein Gate, das seine eigene Nicht-Ausfuehrung als erwartetes Ergebnis meldet, ist kein Gate."

  - id: ns-praefix-am-elster-root
    titel: "ERiC wies JEDES Produkt-XML ab — Namespace-Praefix am Elster-Root"
    status: erledigt
    erledigt_in: "cebb228 (2026-08-09)"
    richtung: "kein Geldfehler — Abgabe war unmoeglich"
    messung: |
      ElementTree kennt nur EINEN Default-Namespace. register_namespace("", NS_ELSTER)
      belegt den Rahmen, der E10-Teilbaum bekam ein generiertes Praefix, dessen
      Deklaration am <Elster>-Root landete.
        rc=610301200 ERIC_IO_READER_SCHEMA_VALIDIERUNGSFEHLER
        eric.log: EDS-XML Zeile 2 Spalte 130: 'Der XML-Datensatz enthaelt an einer
        nicht erlaubten Stelle eine Namespace-Praefix-Definition: xmlns:ns1'
      Bisektion Header/Nutzdaten (4 Kombinationen aus Referenz- und Produkt-XML)
      hat den Fehler auf genau diese eine Zeile eingegrenzt.
    warum_niemand_es_sah: |
      Das XSD faengt es NICHT — beide Fassungen validieren gegen
      elster11_E10_2025_extern.xsd. Gemessen mit xmllint, beide "validates".
      Damit war die einzige laufende Pruefung des Abgabepfads strukturell blind.
    erledigt_wie: |
      _serialisiere() haengt den E10-Namespace lokal ans <E10>, wie im amtlichen
      Referenz-XML. 2 Tests, beide per Mutation rot gemacht.
    folge: |
      Erst dadurch wurde die amtliche Plausibilitaetspruefung ueberhaupt erreichbar —
      und lieferte die 18/24 Beanstandungen, die diese Sektion jetzt abarbeitet.

