      catala_einkuenfte_versorgung (inputs: ['versorgung_jahresrente']), nicht den
      Freibetrag-Accessor. Anschliessen hiesse, eine Namensuebersetzung in den Test zu bauen —
      das ist eine Entscheidung, keine Mechanik. Deshalb dokumentiert stehengelassen.
    aufwand_h: 1
    entdeckt: "2026-08-07 beim Bau von test_n (34198c9)"
    messung: |
