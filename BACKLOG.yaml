      Mutationsprobe: Eintrag entfernen -> rot mit Namen p10_1_9_schulgeld.
      Liste damit 9 -> 7. Suite 1650 gruen.
    rest_offen: |
      5 der 7 sind mit Grund drin und brauchen erst eine Entscheidung, keinen Anschluss:
        p2_festzusetzung_einzel/_zusammen  Catala-Scope ist SCHMALER als die Bindung
                                          (4 Inputs vs +veranlagung/gewst_*/einkuenfte_gewinn,
                                          bei _zusammen ~34 Partner-Slots). Naiver Anschluss
