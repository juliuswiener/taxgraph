      input {'versorgung_jahresrente': 30000, 'versorgung_bemessungsgrundlage': 30000,
      'versorgung_beginn_jahr': 2005} -> 3900.

      Die Zahl stimmt. Von main gegen sources/gesetze-im-internet/estg_p19_2026-07-17.txt
      geprueft — die Kohortentabelle steht dort woertlich ("bis 2005 40,0 3 000 900"):
        Kohorte 2005  (40.0, 3000, 900)   amtlich 40,0 / 3 000 / 900
        Kohorte 2006  (38.4, 2880, 864)   amtlich 38,4 / 2 880 / 864
        Kohorte 2025  (13.2,  990, 297)   amtlich 13,2 /   990 / 297
        Kohorte 2058  ( 0.0,    0,   0)   amtlich  0,0 /     0 /   0
      BG 30.000 / Beginn 2005 -> 3900 (= HB 3.000 + Zuschlag 900).
      Zuschlag-Deckel nach S. 5 greift nachweislich: BG 1.000 -> 1000, nicht 1300
      (VFB 400, Deckel 1000-400=600, Zuschlag min(900,600)=600).
      einkuenfte_versorgung 30.000 -> 25998 (= 30000 - 3900 - 102 Pauschbetrag § 9a).
      Differential (dev-a): dieselben 30k als Versorgung 318500 ct Steuer, als normaler
      Bruttolohn ohne VFB 394600 ct. Der Freibetrag wirkt numerisch, kein stiller No-op.
