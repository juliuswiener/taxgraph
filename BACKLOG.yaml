    richtung: "war ABGABE-BLOCKER (rc=610001002), sobald eine Kind-Instanz angelegt wurde"
    entdeckt: "2026-08-11, Block-Matrix-Sweep (checkest-blockmatrix)"
    messung: |
      Ratschen-Fixtur gesamt, Abgabe-XML scharf gegen ERiC:
        A) nur fam_anzahl_kinder=1              rc=0          0 Beanstandungen
        B) + kind_idnr                          rc=610001002  "Tragen Sie bitte den Vornamen
                                                               des Kindes ein (1. Anlage Kind)."
        C) + kinderbetreuungskosten             rc=610001002  4 Beanstandungen
      Der Kinderfreibetrag laeuft also OHNE Anlage Kind durch (A). Sobald aber eine
      Kind-INSTANZ entsteht, verlangt checkESt den Vornamen — und den gibt es bei uns nicht.
    ursache: |
      `kind_vorname` existiert weder in der Bindungstabelle noch in einem Scheiben-Kegel —
      0 Treffer repo-weit. Zusaetzlich sind fuenf gebundene Kind-Felder nicht im
      gesamt-Kegel und damit nicht setzbar:
        kind_geburtsjahr, kind_kindschaftsverhaeltnis_a/b, kind_kindschaftsverh_zeitraum_a/b
