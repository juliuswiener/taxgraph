                               Bindung umbenennen ODER Ausnahmeliste. Die Uebersetzung
                               selbst ist mechanisch, der Weg ist die Entscheidung.
      Verbraucher-Frage GEMESSEN 2026-08-08 (dev-a, Bericht
      reports/adjudikation/p19_2_signatur_slot_naming_2026-08-08.md, 86b3d4a):
