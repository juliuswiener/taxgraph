      bindung_kap_vv_familie.yaml: kap_zusammenveranlagung wurde gestrichen, weil es
      dieselbe Frage ein zweites Mal stellte und ihr widersprechen konnte (250 EUR
      Under-tax, gemessen 2026-07-30). Wenn Nutzer Summe UND Einzelposten liefern, ist
