struktur:

  - id: api-py-datei-split
    titel: "api.py in Ring und Endpunkte trennen"
    status: blockiert
    aufwand_h: 1
    voraussetzung_erfuellt: "_bescheid_fn-Umbau ist durch (7b1d59a, 1396 -> 1301 Zeilen)"
    messung: |
      api.py 2539 Zeilen, _bescheid_fn 1301 (51 %), 14 HTTP-Endpunkte je 40-60 Zeilen.
      Modul-Globals: 6. Tests, die api-Interna patchen: 0.
    plan: "api_ring.py + api_endpunkte.py, api.py als Fassade mit Re-Exports"
    gate: "Aequivalenz-Collector (tests/test_bescheid_fn_collector.py), diff MUSS leer sein"
    blockiert_seit: "2026-08-07"
    blockade: |
      Zwei Gruende, beide gemessen, keiner davon geraten:

      1. Das Gate deckt die Naht nicht ab, an der der Split zuerst bricht.
         Der Aequivalenz-Collector vergleicht den RECHENpfad. Der Fehler, den ein
         Split hier baut, sitzt aber im AUTH-Pfad: `from api import _AUTH_USER`
         bindet den WERT beim Import, nicht den Namen. Eine spaetere Zuweisung an
         api._AUTH_USER erreicht das ausgelagerte Modul dann nicht mehr — stiller
         Auth-Bypass, gruener Collector. Genau dieses Muster wurde in fffd7c8
         entschaerft (Zugriff jetzt als Modul-Attribut), die Falle ist damit aber
         nur an einer Stelle zu, nicht als Klasse.
         -> Voraussetzung: ein zweiter deterministischer Gate-Test, der die
            Auth-Naht nach dem Split prueft (Zuweisung an das Attribut MUSS im
            ausgelagerten Modul ankommen; Mutationsprobe muss ihn rot machen).

      2. Die Messung oben ist unvollstaendig, nicht falsch. "Modul-Globals: 6"
         zaehlt die Definitionen, nicht die IMPORTEURE — wer `from api import X`
         macht und damit an einem der 6 haengt. Ohne diese Liste ist nicht
         entscheidbar, welche Namen die Fassade re-exportieren muss.
         -> Voraussetzung: Importeur-Inventar (je Global: alle from-api-Importe).
    voraussetzung_2_erledigt: |
      2026-08-07, reports/adjudikation/api_importeur_inventar_2026-08-07.md (dev-b,
      von main nachgemessen). Ergebnis: 6 top-level Assigns in api.py, KEINER wird zur
      Laufzeit neu zugewiesen, 0 global-Statements, 0 Treffer fuer `from api import
      <name>` repo-weit. Die Fassade muss also KEINEN dieser 6 re-exportieren.
      _AUTH_USER liegt gar nicht in api.py, sondern in api_auth.py; alle 45 Zugriffe
      laufen als Modul-Attribut. Die aus fffd7c8 gelernte Regel ist durchgaengig
      angewandt, nicht nur an der einen Stelle.
    blockade_verschoben: |
      Die Sorge aus Punkt 1 (_AUTH_USER) ist damit ENTKRAEFTET — an dieser Stelle
      bricht der Split nicht. Der Blocker bleibt aber, weil dieselbe Fehlerklasse an
      einer ANDEREN Stelle sitzt, die im Inventar zuerst durchgerutscht war:

        api.py:43   from api_constants import *

      Ein Star-Import ist eine Wert-Bindung fuer 84 Namen auf einmal. Darunter FAELLE
      (das Fall-Store-Verzeichnis), das in 32 Testdateien 46x per
      monkeypatch.setattr(API, "FAELLE", tmp_path) umgebogen wird — die einzige
      api-Attribut-Patch-Stelle im ganzen Repo, dafuer die haeufigste.
      Nach dem Split liest ein ausgelagerter api_ring seine EIGENE star-importierte
      Kopie; setattr auf die Fassade erreicht ihn nicht mehr.
      Im Kleinen nachgebaut (2026-08-07): Roundtrip-Assert bleibt GRUEN, das
      tmp_path-Verzeichnis wird nie angelegt, geschrieben wird in den echten Store.
      Der Test kann das nicht merken, weil Lesen UND Schreiben denselben falschen
      Pfad nehmen. produkt/haut/faelle/ enthaelt 289 Fall-Dateien.
      -> Voraussetzung 1 praezisiert: das Gate muss die STAR-IMPORT-Naht pruefen,
         nicht die Auth-Naht. Zwei Haelften, je mit Mutationsbeweis:
         (a) statisch — kein zweiter `from X import *` unter produkt/ (benannte
             Ausnahmeliste fuer api.py:43, Bauart wie REGELN_OHNE_GROUND_TRUTH),
         (b) dynamisch — setattr(FAELLE) auf tmp, schreiben, und auf die DATEI im
             tmp-Verzeichnis asserten (nicht auf den Roundtrip).
         Laeuft bei dev-b, Ablage tests/test_split_naht_gate.py.
    voraussetzung_1_erledigt: |
      2026-08-07, tests/test_split_naht_gate.py (da6eeeb, dev-b, beide Mutationen von
      main selbst nachgemessen und per cp zurueckgesetzt, git diff --stat danach leer):
        (a) zusaetzlicher `from os import *` in produkt/traverser/traverser.py ->
            AssertionError: neuer ungeprüfter Star-Import:
            [('produkt/traverser/traverser.py', 'os')]
        (b) FAELLE per Wert statt per Attribut gehalten ->
            AssertionError: fall_anlegen hat NICHT in .../faelle geschrieben —
            FAELLE-Mutation kam nicht an   (2 failed, 1 passed)
      Damit sind BEIDE Voraussetzungen erfuellt. Der Split ist nicht mehr blockiert,
      sondern wartet nur noch auf Julius' Startwort.
    reihenfolge: "loest sys-path-zu-paketen Stufe 1 aus, blockiert sie also mit"

  - id: p23-instanzen-accessor
    titel: "§ 23 Ring crasht mit TypeError — inst['felder'] ohne .get('wert')"
    status: erledigt
    erledigt_in: "63bce6f (2026-08-07)"
    erledigt_wie: |
      Es waren ZWEI Bugs an derselben Stelle, nicht einer. Beide gefixt, beide Mutationen
      von main nachgemessen, Suite 1655 passed / 4 skipped.

      (1) Der hier gemeldete TypeError: .get(fid, {}).get("wert") + isinstance-Guard,
          Idiom der 13 anderen inst["felder"]-Stellen. Handrechnung § 23 Abs. 3
          (200.000 - 150.000 - 5.000 = 45.000 EUR, ueber der 1.000-EUR-Freigrenze S. 5)
          deckt sich exakt mit dem Ring.

      (2) Beim Fixen gefunden und SCHWERER: nur_bestaetigt wurde entgegengenommen, aber
          nie ausgewertet. Eine p23-Instanz im Zustand "vorlaeufig" bewegte die
          FESTGESETZTE Steuer, als waere sie bestaetigt:
            ohne p23                     1.392.400 ct
            mit VORLAEUFIGER p23-Instanz 3.265.600 ct
          18.732 EUR aus einer unbestaetigten Angabe, grund blieb "bestaetigt".
          K2-Zwei-Signal-Verletzung, dieselbe Klasse wie
          ring-liest-vorlaeufig-parallel-pfad-luecke.
          Fix: `if nur_bestaetigt and inst["zustand"] != "bestaetigt": continue`.

      Vollstaendigkeitspruefung: 11 EM.instanzen(-Aufrufstellen in api.py, 9 mit Filter,
      2 Guards mit eigener Zustandspruefung. p23 war die einzige Luecke.

      Warum die 12 bestehenden Tests nichts merkten: alle rufen die Catala-Funktionen
      DIREKT mit Hand-Dicts, keiner geht ueber EM.instanzen()/Store/api.py. Die zwei neuen
      Tests laufen den echten /fall -> /event -> /ergebnis-Pfad und asserten auf die
      gemessene Zahl.
    berichte:
      - reports/adjudikation/p23_bugfix_2026-08-07.md
      - reports/adjudikation/p23_nur_bestaetigt_2026-08-07.md
    rest_offen: |
      nur_bestaetigt=False-Pfad (/stand, /fragen) hat keinen eigenen Test — nur
      nachvollzogen, dass die Bedingung symmetrisch zu den 9 anderen Stellen ist.
      Multi-Instanz-Guard fuer p23 (wie vv_objekt/rente bei index>=2) existiert nicht;
      falls er kommt, separat pruefen.
    aufwand_h: 0.5
    entdeckt: "2026-08-07"
    messung: |
      produkt/haut/api.py:231-236 in _p23_ansonsten_einkuenfte liest die Instanz-Felder
      als Rohwert:
        preis = int(inst["felder"].get("p23_veraeusserungspreis", 0)) // 100
        ak    = int(inst["felder"].get("p23_anschaffung_herstellungskosten", 0)) // 100
        wk    = int(inst["felder"].get("p23_werbungskosten", 0)) // 100
      EM.instanzen() (produkt/mapping/est_mapping.py:451-481) liefert felder[fid] aber als
      {"wert":..., "zustand":..., "herkunft":...}. int() laeuft also ueber ein dict.

      Von main unabhaengig reproduziert (Direktaufruf nach ST.materialisiere(store)):
        File ".../produkt/haut/api.py", line 234, in _p23_ansonsten_einkuenfte
            preis = int(inst["felder"].get("p23_veraeusserungspreis", 0)) // 100
        TypeError: int() argument must be a string, a bytes-like object or a real number,
                   not 'dict'

      Alle 13 ANDEREN inst["felder"]-Stellen in api.py machen .get(fid, {}).get("wert").
      Nur diese drei nicht.
    warum_nicht_gefangen: |
      tests/test_p23_accessor.py existiert (17 passed, 1 skipped) und ist trotzdem gruen.
      Warum, ist noch nicht beantwortet — laeuft bei dev-a als Teil des Fix-Auftrags.
    wirkung: |
      Blockiert die 3 p23_*-Felder in der kegel-Vollmessung. Ob ein echter Nutzer den
      Pfad erreicht, ist NICHT gemessen — der Kegel-Guard ("input_kegel_nicht_bestaetigt")
      greift bei den Standardfaellen vorher.
    aufwand_begruendung: |
      3 Zeilen Fix. Der Aufwand steckt im Nachweis, dass die Zahl danach STIMMT:
      § 23 Abs. 3 (Preis - AK - WK) plus Freigrenze 1.000 EUR nach § 23 Abs. 3 S. 5.
