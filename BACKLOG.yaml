    offene_frage_p19_2: |
      GEMESSEN 2026-08-08 (dev-a, Bericht
      reports/adjudikation/p19_2_versorgungsfreibetrag_2026-08-07.md; main hat die
      Geldfrage unabhaengig gegen den Gesetzestext nachgerechnet).
      Der Punkt ist KLEINER als er hier stand: KEIN Geldfehler, reine test_n-Sichtbarkeit.

      Der Namens-Mismatch besteht: Bindung fuehrt signatur_slot jahresrente/
      bemessungsgrundlage (bindung_an_gesamt.yaml:33,51), der Accessor liest die Feld-IDs
      versorgung_jahresrente/versorgung_bemessungsgrundlage (golden/runner.py:946-947).

      Aber der Accessor ist NICHT tot. api.py:868 ruft catala_einkuenfte_versorgung, und
      die ruft catala_p19_2_versorgungsfreibetrag intern mit demselben Feld-ID-Dict
      (runner.py:992). Spy-Wrapper waehrend eines echten /ergebnis-Laufs: 1 Aufruf,
      input {'versorgung_jahresrente': 30000, 'versorgung_bemessungsgrundlage': 30000,
      'versorgung_beginn_jahr': 2005} -> 3900.

      Die Zahl stimmt. Von main gegen sources/gesetze-im-internet/estg_p19_2026-07-17.txt
      geprueft — die Kohortentabelle steht dort woertlich ("bis 2005 40,0 3 000 900"):
        Kohorte 2005  (40.0, 3000, 900)   amtlich 40,0 / 3 000 / 900
        Kohorte 2006  (38.4, 2880, 864)   amtlich 38,4 / 2 880 / 864
        Kohorte 2025  (13.2,  990, 297)   amtlich 13,2 /   990 / 297
        Kohorte 2058  ( 0.0,    0,   0)   amtlich  0,0 /     0 /   0
      BG 30.000 / Beginn 2005 -> 3900 (= HB 3.000 + Zuschlag 900).
      Zuschlag-Deckel nach S. 5 greift nachweislich: BG 1.000 -> 1000, nicht 1300
      (VFB 400, Deckel 1000-400=600, Zuschlag min(900,600)=600).
      einkuenfte_versorgung 30.000 -> 25998 (= 30000 - 3900 - 102 Pauschbetrag § 9a).
      Differential (dev-a): dieselben 30k als Versorgung 318500 ct Steuer, als normaler
      Bruttolohn ohne VFB 394600 ct. Der Freibetrag wirkt numerisch, kein stiller No-op.
    anschlusskosten_p19_2: |
      Hookup-Simulation (dev-a, _n_gefundene_verstoesse direkt aufgerufen): exakt 5 neue
      Verstoesse, identisch egal ob Ziel catala_p19_2_versorgungsfreibetrag oder
      catala_einkuenfte_versorgung.
        3x geltungsbedingung — strukturell, RUNNER_ACCESSOR kennt nie geltungsbedingungen.
                               Anwendung einer bereits getroffenen Entscheidung
                               (Ausnahmeliste), wie bei den 2 existierenden Hookups.
        2x signatur_slot     — der echte Naming-Mismatch. Kleine Entscheidung:
                               Bindung umbenennen ODER Ausnahmeliste. Die Uebersetzung
                               selbst ist mechanisch, der Weg ist die Entscheidung.
      Verbraucher-Frage GEMESSEN 2026-08-08 (dev-a, Bericht
      reports/adjudikation/p19_2_signatur_slot_naming_2026-08-08.md, 86b3d4a):
        bemessungsgrundlage  genau 1 Treffer (bindung_an_gesamt.yaml:51). Der Near-Miss
                             bemessungsgrundlage_durchschnitt ist ein unabhaengiges
                             §2-Ring-Output-Feld, kein Konflikt.
        jahresrente          ECHTE Namenskollision (p19_2 in bindung_an_gesamt.yaml:33
                             vs p22_1 in bindung_rentner.yaml:13) — aber FOLGENLOS:
                             keiner der beiden Rechenwege liest seinen Slot ueber den
                             generischen Mechanismus. p19_2 laeuft ueber Feld-IDs
                             (api.py:829-873), p22_1 ueber _ci() in _rente_instanz();
                             die umschliessende slot_fn (api.py:1315-1628) enthaelt
                             null slots[...]-Zugriffe.
        Einziger echter Rechen-Konsument von signatur_slot ueberhaupt:
        intervall.py:185 (bescheid_via_slots). Die anderen drei sind Kommentar,
        Trace-Echo und Schluessel-Praesenz — nicht wertabhaengig.
        Kz-Naht sauber: versorgung_jahresrente hat elster_kz: null, die Kz-Vergabe
        laeuft ueber b["elster_kz"] bzw. die versorgung_art-Weiche, nie ueber den
        Slot-Namen.
      Damit kostet Umbenennen 2 YAML-Zeilen. Die Entscheidung "umbenennen vs
      Ausnahmeliste" bleibt reine Stilfrage — Praezedenz p7_1_lineare_afa liegt vor.
      NICHT nachgeprueft von main: die Konsumenten-Tabelle und die Kz-Naht selbst
      (Negativbefunde, folgenlos solange nichts umbenannt wird). Wird die Umbenennung
      beschlossen, gehoeren beide vorher nachgemessen.
    aufwand_h: 1
    entdeckt: "2026-08-07 beim Bau von test_n (34198c9)"
    messung: |
      test_n_bindung_zeigt_auf_existierende_bedingung braucht eine Ground Truth pro Regel
      (rules.yaml-signature oder Catala-inputs). 9 Regeln haben keine und werden
      UEBERSPRUNGEN, ohne dass irgendetwas rot wird.

      NEUMESSUNG 2026-08-08 (dev-a, von main unabhaengig reproduziert — eigenes Skript,
      alle 8 regel_id-Zeilen und beide Summen deckungsgleich). Sie ERSETZT die alten
      Zahlen "33 / 50 / 17+13" dieses Feldes:
        aktueller Gate-Zustand:  gb=19  slot=13  uebersprungen=7
        ohne Skip (Simulation):  gb=41  slot=49
      gb=19 statt 17, weil 0469d38 die Ausnahmeliste durch die 2 Hookups vergroessert
      hat. slot 49 statt 50: Differenz von 1 nicht rekonstruiert, andere Ursprungs-
      methodik der historischen Messung — offen benannt, nicht weggerechnet.

      Verteilung der 49 slot-Verstoesse nach regel_id:
        p2_festzusetzung_zusammen        21   Catala-Scope schmaler als Bindung
        p9_4a_verpflegungsmehraufwand    11   bewusste Ring-Zusatz-Inputs (34198c9), gelistet
        p2_festzusetzung_einzel           7   dieselbe Ursache wie oben
        p19_2_versorgungsfreibetrag       2   echter Naming-Mismatch, NEU
        p10_1_3_kv_pv_kind                2   Kind- vs Fallachse
        p33b_abs5_kind_uebertragung       2   Kind- vs Fallachse
        p22_3_leistungen                  2   positionale Signatur
        p7_1_lineare_afa                  2   Naming-Mismatch, bereits gelistet (Praezedenz)
      KEIN systematisches Muster: ~5 klar verschiedene Ursachen, davon 39 von 49 bereits
      dokumentiert. p19_2 ist der einzige neue Fall einer schon geloesten Klasse — keine
      neue Fallklasse.

      OFFEN daraus: die 28 Verstoesse von p2_festzusetzung_zusammen/_einzel (57 %) sind
