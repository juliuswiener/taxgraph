      GELTUNGSBEDINGUNG_ZEIGT_INS_LEERE (test_bindungstabelle.py) statt einer erfundenen
      geltungsbedingung — gleiches Muster wie kind_vorname.
    tests: |
      Mutationsprobe je Gate: kind_anderer_elternteil_name aus BLOECKE["anlage_kind_instanz"]
      entfernt -> rc=610001002 ("nur ein Kindschaftsverhaeltnis... zum anderen Elternteil");
      kind_betreuung_eigenanteil_betrag aus BLOECKE["kinderbetreuung"] entfernt ->
      rc=610001002 ("Summe... die einzelnen Aufwendungen wurden jedoch nicht angegeben");
      kind_betreuung_eigenanteil_zeitraum aus KINDERBETREUUNG-Kegel entfernt -> test_kind_
      formalien_sind_deklarierbar faellt auf E0506606. Alle drei danach zurueckgebaut, gruen.
