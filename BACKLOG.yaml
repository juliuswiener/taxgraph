  - id: kontoauszug-pdf-test-vergleicht-ganz-tmp
    titel: "test_pdf_base64_upload_verworfen_feld ist flaky durch Fremdprozesse"
    status: erledigt
    erledigt_in: "c487ad0 (2026-08-07)"
    erledigt_wie: |
      _tmp_pdfs() filtert jetzt auf tempfile.gettempprefix() + ".pdf" — genau die Form,
      die api.py:2552 selbst anlegt. Mutationsprobe: os.unlink(pfad) -> pass ergab
      "Extra items in the left set: tmpx5bhkx90.pdf". Gegenprobe mit einer fremden
      /tmp-Datei waehrend des Laufs: gruen. Der PII-Guard ist dadurch schaerfer, nicht
      schwaecher.
    aufwand_h: 0.25
    entdeckt: "2026-08-07"
    messung: |
      Der Test macht os.listdir(tempfile.gettempdir()) vor und nach dem Call und verlangt
      `nach - vor == set()`. Er sieht damit JEDEN Fremdprozess, der waehrenddessen etwas in
      /tmp anlegt. Einmal rot mit:
        AssertionError: assert {'go-build2607090677'} == set()
      Ein paralleler Go-Compiler, nicht der Kontoauszug-Endpunkt. Danach 3x hintereinander
      gruen, auf HEAD ohne Aenderungen ebenfalls gruen.
    fix: |
      Statt ganz /tmp zu vergleichen nur auf das Praefix filtern, das der Endpunkt selbst
      benutzt. Der PII-Leck-Guard bleibt damit erhalten und wird sogar schaerfer.

  - id: klasse3-fail-open
    titel: "{k: slots[k] ... if k in slots} — fail-open, das fail-closed aussieht"
    status: erledigt
    erledigt_in: "4966726 (2026-08-09)"
    aufwand_h: 1
    entdeckt: "2026-08-08, im slot_fn_fail_open_sweep als Nebenbefund"
    bericht: reports/adjudikation/klasse3_fail_open_2026-08-09.md
    richtung: over-tax
    messung: |
      Der Blast-Radius war beim Aufnehmen NICHT gemessen. Jetzt ist er es — und der
      Punkt war groesser als der Sweep vermuten liess. Zwei unabhaengige Wege:

      (1) HTTP-Mutationsprobe (bindung_n_vor_gwg.yaml:28, signatur_slot
          entfernung_km_roh -> _x, echter Server, danach zurueckkopiert,
          git diff --stat leer):
            gesamt      1.310.100 -> 1.345.200 ct   = 351 EUR verschwinden lautlos,
                        grund bleibt "bestaetigt"
            an_gesamt   crasht stattdessen mit HTTP 500 KeyError — ein ko-lozierter
                        bare-Subscript-Read im §101-Block faengt es VOR dem stillen
                        Pfad ab, aber NUR wenn extras is not None (gilt fuer /ergebnis,
                        NICHT fuer /stand, wo extras=None Default ist)
      (2) Direkter Unit-Aufruf von _bescheid_fn mit UNVERAENDERTER Bindung, nur
          feld_werte ohne den Key ep_entfernung_km:
            an_gesamt 323 EUR, gesamt 351 EUR
          Das ist der eigentliche Befund: Klasse 3 braucht GAR KEINE kaputte Bindung.
          Jeder Aufrufer, der ein Kegel-Feld weglaesst, verliert lautlos Geld.
    legitime_aufrufer_geprueft: |
      Pflichtschritt vor jedem fail-closed. Alle 4 EP-Keys stehen im Pflicht-Kegel
      BEIDER Scheiben (EP_FELDER, an_gesamt + gesamt). _feste_zahl und IV.intervall
      koennen strukturell nie ein Kegel-Feld weglassen (Meet-Gate bzw.
      nicht_fix-Fruehausstieg). catala_werbungskosten_n hat genau 2 Aufrufer, beide
      Klasse-3-Stellen. Kein legitimer Weglass-Fall gefunden -> fail-closed vertretbar.
    zweite_ebene_bewusst_offen: |
      golden/runner.py::catala_werbungskosten_n behaelt ihr eigenes `if "X" in s:`.
      Das ist dort der KORREKTE generelle Mechanismus fuer die echt optionalen
      WK-Komponenten (dHf, Verpflegung, Uebernachtung, Arbeitsmittel). Mit dem
      Ebene-1-Fix sieht sie die 4 EP-Keys nie mehr fehlend — Ebene 1 wirft vorher.
      Ein reflexhaftes "beide Ebenen dicht" haette den optionalen Pfad gebrochen.
    gate: |
      tests/test_klasse3_dictcomp_wk_fail_open.py (3 Tests). Von main unabhaengig
      nachgemessen: fail-open an beiden Stellen wieder eingebaut -> 2 failed
      ("DID NOT RAISE KeyError"), zurueckgesetzt -> 3 passed, git diff leer.

  - id: stille-null-klasse-c
    titel: "Vorlaeufige Instanz faellt still aus der Rechnung — gwg, kind x3, p23"
    status: erledigt
    erledigt_in: "42c2c99 (2026-08-08)"
    erledigt_wie: |
      Variante (b) gebaut, wie von main empfohlen: die vorlaeufigen Felder stehen jetzt
      im bereits vorhandenen "offen"-Feld der /ergebnis-Antwort. grund und zahl_cent
      bleiben unveraendert, die dokumentierte Additiv-Entscheidung fuer gwg/kind wird
      nicht gebrochen. Nachgemessen 2026-08-09: api.py:2287 setzt im Erfolgspfad
      "offen": offen_c statt der frueheren harten leeren Liste.
    aufwand_h: 1
    entdeckt: "2026-08-07, beim p23-Fix (63bce6f) als Folgefrage"
    bericht: reports/adjudikation/instanz_stille_null_2026-08-07.md
    messung: |
      Frage war: faellt eine vorlaeufige Instanz an ALLEN 9 gefilterten Aggregat-Stellen
      still durch, wie bei p23? Antwort: nein, nur an 4 von 9. Es gibt drei Klassen.

      Klasse A — Basis-Instanz (index 1) von vv_objekt und rente: sind Kegel-Pflichtfelder.
      ergebnis() prueft das VOR der Zahl -> grund="input_kegel_nicht_bestaetigt",
      zahl_cent=None, offen listet das Feld. Fail-closed, gemeldet. KEIN Bug.

      Klasse B — Zusatz-Instanz (index >=2) von vv_objekt und rente: Guard in
      _an_gesamt_sperrgrund (api.py:1930/1948) prueft inst["zustand"] != "bestaetigt"
      unbedingt -> grund="vv_instanz_offen"/"rente_instanz_offen", zahl_cent=None.
      Fail-closed, gemeldet. KEIN Bug.
      Beide Zusatz-Instanzen einzeln gemessen: vv_objekt index 2 (von main)
      grund="vv_instanz_offen", zahl_cent=None. rente index 2 in rentner_gesamt (dev-a,
      echte Werte aus der test_p3_vor_partner-Fixture) grund="rente_instanz_offen",
      zahl_cent=None, stand.ring_gesperrt="rente_instanz_offen".

      Klasse C — gwg, alle drei kind-Aufrufer, p23: kein Kegel-Gate, kein Sperrgrund.
      Der Filter tut, was er soll (die Zahl bleibt korrekt), aber nichts in der Antwort
      sagt, dass eine Nutzereingabe ignoriert wurde. Alle 6 Klasse-C-Funktionen einzeln
      gemessen, je dreifach — Referenz ohne Feld / vorlaeufig / bestaetigt:

        _schulgeld_summe            1392400 / 1392400 / 1359200   (D = 33200 ct)
        _kind_kv_pv_summe           1392400 / 1392400 / 1336300   (D = 56100 ct)
        _kind_behinderten_pb_daten  1392400 / 1392400 / 1311400   (D = 81000 ct)

      Die bestaetigt-Kontrolle ist der Punkt: ohne sie belegt "gleich wie Referenz" nur,
      dass das Feld folgenlos ist — nicht, dass ein Filter greift. Der Delta beweist, dass
      das Feld sehr wohl wirkt, wenn es bestaetigt ist. grund bleibt in allen Faellen
      "bestaetigt", offen bleibt [].
      main hat die schulgeld-Zeile unabhaengig nachgerechnet und exakt reproduziert.

      Es gibt KEINE fuenfte Klasse-C-Stelle. Die Vermutung, die gesamt-Scheibe koenne
      wegen multi_rente=None eine ungeschuetzte rente-Zusatz-Instanz aufnehmen, ist
      widerlegt: event() lehnt rentner_jahresrente__2 in gesamt mit
      ApiError "feld_id 'rentner_jahresrente__2' nicht in dieser Scheibe" ab, weil die
      RENTNER_22-Kernfelder gar nicht in der gesamt-Bindung stehen (api.py:2197).
      Von dev-a gemessen, von main unabhaengig nachgestellt.
    wirkung: |
      Kein Geldfehler — die Zahl ist nach dem p23-Fix korrekt. Der Schaden ist
      Vertrauensschaden: der Nutzer traegt etwas ein, sieht es in /fragen, und die
      festgesetzte Zahl enthaelt es trotzdem nicht, ohne Hinweis. /fragen zeigt das Feld
      zwar (traverser._unbeantwortet behandelt vorlaeufig als offen), aber das ist ein
      SEPARATER Endpunkt, den der Nutzer aktiv abrufen muss.
    bauvarianten: |
      (a) Neuer Sperrgrund instanz_vorlaeufig_offen, Parität zu vv_objekt/rente.
          Nutzer kommt nicht weiter, bis er bestaetigt oder loescht.
          Aufwand mittel. GEGENARGUMENT: der Docstring von _gwg_sofortabzug_summe sagt
          ausdruecklich "gwg ist OPTIONAL -> KEIN Kegel-/Sperr-Gate (anders als vv/rente)".
          (a) wuerde eine bewusste Entscheidung umkehren.
      (b) Die vorlaeufigen Felder in das bereits vorhandene "offen"-Feld der Antwort.
          Nutzer sieht es, kann aber weitermachen. grund und zahl_cent bleiben.
          Aufwand klein. api.py:2277 setzt "offen": [] im Erfolgspfad hart —
          von main nachgelesen, das ist die einzige Stelle, die sich aendern muss.
          Die Antwortstruktur bleibt gleich, das Schema (api_schema/ergebnis.json)
          fuehrt "offen" bereits als required.
      (c) Pro Gruppe verschieden — faellt unter der jetzigen Faktenlage mit (b) zusammen,
          weil keine der vier Gruppen ein Argument fuer (a) hat.
    empfehlung_main: |
      (b). Sie macht die stille Null sichtbar, ohne die dokumentierte Additiv-Entscheidung
      fuer gwg/kind zu brechen, und sie ist billiger als der Bericht schaetzt: das
      offen-Feld existiert bereits in JEDER /ergebnis-Antwort und ist im Erfolgspfad
      leer. Es geht um eine Sammelstelle in ergebnis() plus 4 Tests.
    entscheidung_julius: |
      OFFEN. Nichts gebaut. Welche Variante — und ob ueberhaupt, denn es ist kein
      Geldfehler, sondern eine Sichtbarkeitsluecke.

  - id: gettsim-crosscheck-g32a-52150
    titel: "g32a_52150: amtlich 6.430 vs GETTSIM 6.431 — 1 EUR blockiert den Crosscheck-CI-Job"
    status: analysiert
    aufwand_h: 0.5
    entdeckt: "vor 2026-08-07, bisher NUR im Gedaechtnis gefuehrt, nicht im BACKLOG"
    warum_hier: |
      Der Punkt stand ausschliesslich als Gedaechtnis-Eintrag (adjudikation-offen-g32a-52150)
      und tauchte in keiner BACKLOG-Durchsicht auf. Genau die Bauart, die der
      commit-nur-defer-sweep bei Commit-Texten gefunden hat — Wissen an einem Ort, an dem
      niemand danach sucht.
    messung: |
      Ein Tarif-Stuetzpunkt bei zvE 52.150: der amtliche Programmablaufplan ergibt 6.430 EUR,
      GETTSIM 6.431 EUR. Differenz 1 EUR. Der Diff liegt im Klartext gesichert.
    wirkung: |
      Blockiert den gettsim-crosscheck-CI-Job, weil der auf Deckungsgleichheit prueft.
      Kein Produktfehler: unsere Zahl folgt dem amtlichen Ablaufplan.
    empfehlung_main: |
      AMTLICH GEWINNT. Der Programmablaufplan ist die Norm, gegen die das Finanzamt rechnet;
      GETTSIM ist ein Forschungsmodell und hier Zweitmeinung, nicht Referenz. Der Crosscheck
      bekommt eine DOKUMENTIERTE Einzelausnahme fuer diesen Stuetzpunkt — mit dem gemessenen
      Diff daneben, damit die Ausnahme nicht zur stillen Dauer-Toleranz wird. KEINE Anpassung
      unserer Zahl an GETTSIM.
      Vorher pruefen: ist es wirklich EIN Stuetzpunkt oder der Rand einer ganzen Zone? Eine
      Einzelausnahme auf einem Zonenrand waere die falsche Bauform.
    entscheidung_julius: "OFFEN (Vorschlag 2026-08-12 vorgelegt)."

  - id: feldmatrix-21-unklassifiziert
    titel: "21 rote Felder aus dem generierten Einzelfeld-Matrix-Lauf sind nie klassifiziert worden"
    status: offen
    aufwand_h: null
    entdeckt: "2026-08-10, beim Bau von tests/test_checkest_feldmatrix.py (c2848cd)"
    messung: |
      Der GENERIERTE Lauf ueber alle Felder ergab 29 rote Felder. Beim Durchsehen erwiesen
      sich die meisten als Testartefakt statt Befund — zwei Ursachen:
        (a) das Feld braucht seinen BLOCK (Anlage Kind ohne Vorname, Anlage V ohne
            Laufende Nummer) -> dafuer wurde test_checkest_blockmatrix.py gebaut
        (b) unzulaessige Probewerte (GdB=5 gibt es nicht)
      Die kuratierte Liste in test_checkest_feldmatrix.py deckt nur die Felder ab, die
      ALLEIN eine sinnvolle Erklaerung ergeben. 21 Felder aus dem Rohlauf sind bis heute
      weder als Befund noch als Artefakt eingeordnet.
    warum_es_zaehlt: |
      Unter 21 unklassifizierten Meldungen kann ein Abgabe-Blocker liegen — die zwei
      bekannten (Anlage KAP, § 35a) kamen aus genau diesem Lauf. Sie NICHT durchzusehen
      heisst, das schaerfste Werkzeug des Projekts zur Haelfte ungenutzt zu lassen.
    plan: |
      Jedes der 21 Felder in eine von drei Klassen: BEFUND (echter Blocker/Fehler),
      BLOCK-ARTEFAKT (gehoert in die Blockmatrix), PROBEWERT-ARTEFAKT (Testdatum falsch).
      Ergebnis gehoert in eine der beiden Matrix-Dateien, nicht in einen Bericht — sonst
      steht es in einem Jahr wieder hier.
