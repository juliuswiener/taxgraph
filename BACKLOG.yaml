  - id: kontoauszug-pdf-test-vergleicht-ganz-tmp
    titel: "test_pdf_base64_upload_verworfen_feld ist flaky durch Fremdprozesse"
    status: erledigt
    erledigt_in: "c487ad0 (2026-08-07)"
    erledigt_wie: |
      _tmp_pdfs() filtert jetzt auf tempfile.gettempprefix() + ".pdf" — genau die Form,
      die api.py:2552 selbst anlegt. Mutationsprobe: os.unlink(pfad) -> pass ergab
      "Extra items in the left set: tmpx5bhkx90.pdf". Gegenprobe mit einer fremden
      /tmp-Datei waehrend des Laufs: gruen. Der PII-Guard ist dadurch schaerfer, nicht
      schwaecher.
    aufwand_h: 0.25
    entdeckt: "2026-08-07"
    messung: |
      Der Test macht os.listdir(tempfile.gettempdir()) vor und nach dem Call und verlangt
      `nach - vor == set()`. Er sieht damit JEDEN Fremdprozess, der waehrenddessen etwas in
      /tmp anlegt. Einmal rot mit:
        AssertionError: assert {'go-build2607090677'} == set()
      Ein paralleler Go-Compiler, nicht der Kontoauszug-Endpunkt. Danach 3x hintereinander
      gruen, auf HEAD ohne Aenderungen ebenfalls gruen.
    fix: |
      Statt ganz /tmp zu vergleichen nur auf das Praefix filtern, das der Endpunkt selbst
      benutzt. Der PII-Leck-Guard bleibt damit erhalten und wird sogar schaerfer.

  - id: klasse3-fail-open
    titel: "{k: slots[k] ... if k in slots} — fail-open, das fail-closed aussieht"
    status: erledigt
    erledigt_in: "4966726 (2026-08-09)"
    aufwand_h: 1
    entdeckt: "2026-08-08, im slot_fn_fail_open_sweep als Nebenbefund"
    bericht: reports/adjudikation/klasse3_fail_open_2026-08-09.md
    richtung: over-tax
    messung: |
      Der Blast-Radius war beim Aufnehmen NICHT gemessen. Jetzt ist er es — und der
      Punkt war groesser als der Sweep vermuten liess. Zwei unabhaengige Wege:

      (1) HTTP-Mutationsprobe (bindung_n_vor_gwg.yaml:28, signatur_slot
          entfernung_km_roh -> _x, echter Server, danach zurueckkopiert,
          git diff --stat leer):
            gesamt      1.310.100 -> 1.345.200 ct   = 351 EUR verschwinden lautlos,
                        grund bleibt "bestaetigt"
            an_gesamt   crasht stattdessen mit HTTP 500 KeyError — ein ko-lozierter
                        bare-Subscript-Read im §101-Block faengt es VOR dem stillen
                        Pfad ab, aber NUR wenn extras is not None (gilt fuer /ergebnis,
                        NICHT fuer /stand, wo extras=None Default ist)
      (2) Direkter Unit-Aufruf von _bescheid_fn mit UNVERAENDERTER Bindung, nur
          feld_werte ohne den Key ep_entfernung_km:
            an_gesamt 323 EUR, gesamt 351 EUR
          Das ist der eigentliche Befund: Klasse 3 braucht GAR KEINE kaputte Bindung.
          Jeder Aufrufer, der ein Kegel-Feld weglaesst, verliert lautlos Geld.
    legitime_aufrufer_geprueft: |
      Pflichtschritt vor jedem fail-closed. Alle 4 EP-Keys stehen im Pflicht-Kegel
      BEIDER Scheiben (EP_FELDER, an_gesamt + gesamt). _feste_zahl und IV.intervall
      koennen strukturell nie ein Kegel-Feld weglassen (Meet-Gate bzw.
      nicht_fix-Fruehausstieg). catala_werbungskosten_n hat genau 2 Aufrufer, beide
      Klasse-3-Stellen. Kein legitimer Weglass-Fall gefunden -> fail-closed vertretbar.
    zweite_ebene_bewusst_offen: |
      golden/runner.py::catala_werbungskosten_n behaelt ihr eigenes `if "X" in s:`.
      Das ist dort der KORREKTE generelle Mechanismus fuer die echt optionalen
      WK-Komponenten (dHf, Verpflegung, Uebernachtung, Arbeitsmittel). Mit dem
      Ebene-1-Fix sieht sie die 4 EP-Keys nie mehr fehlend — Ebene 1 wirft vorher.
      Ein reflexhaftes "beide Ebenen dicht" haette den optionalen Pfad gebrochen.
    gate: |
      tests/test_klasse3_dictcomp_wk_fail_open.py (3 Tests). Von main unabhaengig
      nachgemessen: fail-open an beiden Stellen wieder eingebaut -> 2 failed
      ("DID NOT RAISE KeyError"), zurueckgesetzt -> 3 passed, git diff leer.

