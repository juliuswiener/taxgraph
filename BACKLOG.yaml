  - id: anlage-kap-folgeangabe
    titel: "Anlage KAP: Pflichtangabe bei inlaendischem Steuerabzug"
    status: offen
    messung: |
      Woertlich: "Auf den Anlagen KAP und / oder KAP-BET wurden Kapitalertraege
      erklaert, die dem inlaendischen Steuerabzug unterlegen haben. Bitte geben Sie
      auf der Anlage KAP auch ... an."
    verdacht_nicht_gemessen: |
      Die Testfaelle setzen kap_* durchgaengig auf 0. Moeglicherweise deklariert der
      Writer die 0-Werte trotzdem und loest damit erst die Pflichtangabe aus, die er
      dann nicht erfuellt. Waere das so, verschwindet die Meldung durch Weglassen
