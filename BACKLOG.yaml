        p10_1_3_kv_pv_kind / p33b_abs5_kind_uebertragung  Aggregationsbruch Kind- vs Fallachse.
        p22_3_leistungen                  positionale Signatur (betrag_cent: int), kein dict.
      p19_2_versorgungsfreibetrag ist der einzige echte Rest-Kandidat, siehe unten.
      p2_einkunftsarten hat wirklich keine Ground Truth (Pseudoregel-Scope).
    offene_frage_p19_2: |
      catala_p19_2_versorgungsfreibetrag(s: dict) existiert (golden/runner.py:916) und hat die
      richtige Form — aber der Accessor liest FELD-IDs (versorgung_bemessungsgrundlage),
