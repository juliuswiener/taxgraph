  - id: verpflegung-kuerzung-fehlt-auf-gesamt
    titel: "E0205508 war auf der Abgabe-Scheibe nicht gebunden — Erklaerung fiel zu hoch aus"
    status: erledigt
    erledigt: "2026-08-10, Commit 3ce178c"
    richtung: under-tax
    entdeckt: "2026-08-10, als die Scheiben-Pruefung die Tests von n_vor_gwg auf gesamt zwang"
    messung: |
      10 Tage, 5 Fruehstuecke, 5 Mittagessen:
        Ring rechnet   8400 Cent Kuerzung   (auf BEIDEN Scheiben identisch)
        gesamt         deklariert   0       <- Tage voll, Kuerzung verschwiegen
        n_vor_gwg      deklariert E0205508
      84 EUR zu viel Werbungskosten in der Erklaerung. Haftung beim Nutzer.
    ursache: |
      Zwei Wege, wie eine Scheibe zu ihren Feldern kommt. n_vor_gwg zieht sie ueber
      felder_datei aus der YAML, wo p9_4a_kuerzung_nach_entgelt gebunden ist. gesamt
      baut seine Feldliste aus den Tupeln in api_constants.py — und dort stand das
      Feld in keinem einzigen, also filtert _scheibe_bindung() es heraus.
      P9.4a (826bfdf) war auf der Entwicklungs-Scheibe fertig und auf der
      Abgabe-Scheibe nie angekommen. Der Ring war nie falsch, nur die Deklaration schwieg.
    nicht_betroffen: "rentner_gesamt hat keine Tage-Kz und ist damit konsistent."
    gate: |
      tests/test_abgabescheibe_gate.py prueft die REGEL, nicht den Einzelfall: wo ein
      Abzugs-Kz gebunden ist, MUSS sein Kuerzungs-Kz mitkommen — auf jeder Scheibe,
      die Stammdaten fuehrt. KUERZUNGS_PAARE ist die erweiterbare Liste.

  - id: einreichen-ohne-scheiben-pruefung
    titel: "/einreichen prueft nicht, ob die Scheibe eine vollstaendige Erklaerung tragen kann"
    status: erledigt
    erledigt: |
      2026-08-10, Commit f90a817. Kriterium ist NICHT gesamt_guard (der meint
      Rechen-Vollstaendigkeit), sondern ob die STAMMDATEN_FELDER im Kegel liegen —
      das ist, was Abgabefaehigkeit ausmacht. Gemessen:
        an_gesamt        69 Felder,  0/12 Stammdaten  -> 409
        n_vor_gwg        61 Felder,  0/12             -> 409
        gesamt          201 Felder, 12/12             -> durch
        rentner_gesamt  148 Felder, 12/12             -> durch
      Die Antwort nennt die Scheibe, listet die fehlenden Felder und sagt, dass die
      Berechnung auf der Teilrechnung nutzbar bleibt.
      Gate: tests/test_abgabescheibe_gate.py, 2 Mutationen (Check entfernt -> rot;
      Check lehnt alles ab -> Gegenprobe rot).
    nebenbefund: |
      Die noetige Test-Migration (8 Faelle von an_gesamt/n_vor_gwg auf gesamt) hat
      einen GELDFEHLER aufgedeckt, der sonst in die Abgabe gelaufen waere — siehe
      Eintrag verpflegung-kuerzung-fehlt-auf-gesamt.
    entdeckt: "2026-08-09, beim Bau der Endpunkt-Ratsche"
    richtung: "kein Geldfehler — Fehlermeldung zeigt auf den Nutzer statt auf die Scheibenwahl"
    messung: |
      Ein Fall auf scheibe="an_gesamt" laeuft in die Einreichung hinein und scheitert erst
      an checkESt — mit Beanstandungen ueber fehlende Stammdaten, die der Nutzer auf dieser
      Scheibe STRUKTURELL nie haette beantworten koennen:

        scheibe          gesamt_guard   Ring                        Stammdaten-Felder
        an_gesamt        None           festzusetzende_est                   0
        gesamt           True           festzusetzende_est_gesamt           12
        rentner_gesamt   True           festzusetzende_est_rentner          12

      an_gesamt ist die Arbeitnehmer-TEILRECHNUNG, keine vollstaendige Erklaerung — es fehlt
      nicht nur STAMMDATEN_FELDER im Kegel (api_constants.py:361-369), sondern auch der
      gesamt_guard. Beides zusammen ist Absicht, kein Versehen.
      POST /fall/<id>/event mit feld_id stammdaten_nachname auf an_gesamt:
        400 "feld_id 'stammdaten_nachname' nicht in dieser Scheibe"
    verworfene_variante: |
      STAMMDATEN_FELDER in den an_gesamt-Kegel aufnehmen wurde VERWORFEN: das haette eine
      Scheibe abgabefaehig aussehen lassen, die es inhaltlich nicht ist. Der Worker hat die
      Entscheidung vorgelegt statt sie zu treffen — richtig so.
    plan: |
      /einreichen soll frueh und mit klarer Meldung ablehnen, wenn die Scheibe des Falls
      keine vollstaendige Erklaerung tragen kann (Kriterium: gesamt_guard). Heute ist das
      fail-closed, aber die Meldung beschuldigt den Nutzer unvollstaendiger Angaben, statt
      die Scheibenwahl zu benennen.

  - id: relevanz-nicht-bool-gate
    titel: "34 von 74 askable-Feldern koennen ihre Regel strukturell nie ausschliessen"
    status: erledigt
    erledigt_in: "f886768 (2026-08-10)"
    entdeckt: "2026-08-09, als Nebenbefund der Dialog-Luecken-Messung"
    bericht: reports/adjudikation/dialog_luecke_abgabe_2026-08-09.md
    richtung: "Ueberangebot im Dialog — kein Geldfehler, aber falsche Fragen"
    messung: |
      traverser.relevanz() schliesst eine Regel nur aus, wenn ein Gate-Feld ein
      BESTAETIGTES False traegt (`ev.get("wert") is False`). Bei typ enum/text/datum
      trifft das nie zu — solche Felder koennen ihre Regel damit strukturell nie
      abschalten, egal was der Nutzer antwortet.

      NACHGEMESSEN 2026-08-10, und der Punkt ist KLEINER und SCHAERFER als die erste
      Zahl. Sie ERSETZT das frueher hier stehende "34 von 74":

        real faelschlich angeboten:  26 Felder (Einzel), 28 (Rentner)
        Kontrolle Zusammenveranlagung: 21 davon dort legitim
        -> die Differenz ist echtes Ueberangebot, kein Messartefakt

      Der Grund fuer die Diskrepanz ist die eigentliche Erkenntnis: von den 5
      "strukturell gefangenen" Regeln hat nur p2_festzusetzung_zusammen ueberhaupt eine
      echte OB-Bedingung. Die anderen vier — p10_1_3_3a_kv_pv, p19_2_versorgungsfreibetrag,
      p22_1_leibrente_besteuerungsanteil, p23_veraeusserungsgewinn — sind RECHEN-WEICHEN
      (Kz-Verzweigung, Kohortentabelle, Alter-Parameter), keine Eligibility-Gates. Sie
      SOLLEN nicht ausschliessbar sein; ihre Inline-Kommentare sagen das selbst
      ("Kein Betragsfeld", "gb-Weiche aa/bb"). Sie kosten nichts, auch nicht nach einem Fix.

      Die erste Zahl warf beides in einen Topf und hat den Punkt dadurch groesser
      aussehen lassen als er ist.
    bauart_der_fehlerklasse: |
      Dieselbe Bauart wie die Gate-Polaritaets-Falle, die den ganzen Verpflegungsmehraufwand
      gekostet hat (519199e): ein Gate, das im Normalfall nie greift, sieht aus wie ein
      Gate und ist keins. Hier faellt es harmloser aus — der Dialog fragt zu viel statt zu
      wenig —, aber die Ursache ist identisch und die Zahl (34 von 74) gross.
    offene_frage: |
      Ob das ein Fix-Kandidat ist, ist NICHT entschieden. Denkbar waere, relevanz() um
      einen typ-abhaengigen Ausschluss zu erweitern (enum-Wert x schliesst Regel y aus),
      das ist aber ein Eingriff in die Relevanzpropagation und braucht eine eigene
      Messung des Blast-Radius. Zuerst: lohnt es sich? Ein Ueberangebot im Dialog ist
      laestig, kein Rechenfehler.
    fix: |
      2026-08-10, scharf gemessen statt geschaetzt. Von den 5 strukturell gefangenen Regeln
      hat NUR p2_festzusetzung_zusammen eine echte Ob-Bedingung (die anderen 4 sind
      Rechen-Weichen, unangetastet). Statt relevanz() typ-abhaengig zu erweitern (Blast-Radius
      auf ALLE Regeln), neuer regel-weiter Mechanismus additiv zum Schema: `regel_bedingungen[]`
      (schema.json $defs/regel_bedingung: {regel_id, feld, wert, grund}) in eigener Datei
      `bindung_regel_bedingungen.yaml`, ausgewertet in relevanz() VOR dem alten Gate-Loop
      (produkt/traverser/traverser.py, lade_regel_bedingungen()). `feld` muss kein eigenes
      Feld der Regel sein — das war der Blocker, relevanz() iterierte nur Bindungen der
      eigenen rid. Fail-closed erhalten: unbeantwortet/vorlaeufig schliesst NICHT aus.

      Ein Eintrag: p2_festzusetzung_zusammen ← veranlagung == "zusammen" (§ 26 Abs. 2 S. 2
      EStG, Anker verifiziert). Gemessen (naechste_fragen, Store leer vs. veranlagung
      bestaetigt): 34 Partner-Felder fallen bei veranlagung=einzel weg, 0 bei zusammen
      (Kontrolle: kein Overshoot). Gegenprobe ohne den Fix (lade_regel_bedingungen
      gemonkeypatcht auf leer): 0 Felder fallen weg — Bug reproduziert, Fix nicht vakuos.

      5 neue Tests (test_traverser.py): ausgeschlossen bei einzel, bleibt relevant bei
      zusammen, faengt nicht bei unbeantwortet, faengt nicht bei vorlaeufig, Mutations-
      Gegenprobe. Vollsuite +5 gruen, keine Regression (Abgabeachse rc=0 auf allen vier
      Ratschen: RESTFEHLER_EINZEL/ZUSAMMEN/ENDPUNKT_EINZEL = 0).

