    entdeckt: "2026-08-10, tests/test_checkest_feldmatrix.py, erster Lauf"
    messung: |
      Je Feld einzeln auf der Ratschen-Fixtur, alle rc=610001002:
        hh_handwerker_arbeitskosten  "...es wurde aber keine Einzelaufstellung der
                                      Handwerkerleistungen vorgenommen."
        hh_dienstleistungen          "...haushaltsnahe Dienstleistungen, Hilfe im eigenen
