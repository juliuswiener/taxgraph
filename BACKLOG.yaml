      reports/adjudikation/p19_2_versorgungsfreibetrag_2026-08-07.md; main hat die
      Geldfrage unabhaengig gegen den Gesetzestext nachgerechnet).
      Der Punkt ist KLEINER als er hier stand: KEIN Geldfehler, reine test_n-Sichtbarkeit.

      Der Namens-Mismatch besteht: Bindung fuehrt signatur_slot jahresrente/
      bemessungsgrundlage (bindung_an_gesamt.yaml:33,51), der Accessor liest die Feld-IDs
      versorgung_jahresrente/versorgung_bemessungsgrundlage (golden/runner.py:946-947).

      Aber der Accessor ist NICHT tot. api.py:868 ruft catala_einkuenfte_versorgung, und
      die ruft catala_p19_2_versorgungsfreibetrag intern mit demselben Feld-ID-Dict
