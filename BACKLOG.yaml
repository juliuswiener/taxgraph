  - id: vorsatz-block
    titel: "Vorsatz-Block fehlt komplett — 9 der 18 Beanstandungen"
    status: erledigt
    erledigt_in: "e365a37 (2026-08-09)"
    erledigt_wie: |
      Eigene Funktion _vorsatz(), analog _transfer_header(), letztes Kind von <E10>.
      Flag abgabefaehig=False als Default haelt alle ~68 bestehenden erzeuge_xml-Aufrufe
      unveraendert; bei True sind die 5 absender_*-Parameter fail-closed Pflicht.
      Gemessen: einzel 18 -> 9, zusammen 24 -> 15, in beiden Faellen exakt die
      erwarteten 9 Meldungen. 8 Tests, alle per Mutation rot gefahren (5 Mutationen).
    schema_quelle_korrigiert: |
      WICHTIG fuer kuenftige Arbeit: Vorsatz steht NICHT in elster11_E10_2025_extern.xsd
      (0 Treffer), sondern in der Schwesterdatei E10-2025.xsd im selben Verzeichnis
      (1 Treffer). Von main nachgeprueft. Das Briefing hatte die falsche Datei genannt;
      der Worker hat es beim Bauen korrigiert.
    empirischer_fallstrick: |
      NICHT aus dem XSD ableitbar, nur durch scharfe Messung gefunden: OrdNrArt="S" ohne
      konsistente Steuernummer ersetzt die 9 Fehler nicht durch 0, sondern durch 2 NEUE
      ("Bundesfinanzamtsnummer ... unterscheiden sich"). Daher ein fuenfter Pflicht-
      parameter absender_steuernummer plus Praefix-Check gegen empfaenger_finanzamt.
      Lehre: die amtliche Pruefung kennt Konsistenzregeln zwischen Feldern, die kein
      Schema ausdrueckt. Jeder neue Block muss scharf gemessen werden, nicht nur
      schema-valide gebaut.
    abweichung_dokumentiert: |
      Copyright wird mit dem datenlieferant-Parameter belegt ("TaxGraph"), nicht mit dem
      Referenz-Literal "ELSTER" — laut Schema-Doku bezeichnet das Feld den Software-
      Hersteller, und "ELSTER" ist dort der Autor der amtlichen Beispieldatei.
      checkESt beanstandet den Wert nicht.
    aufwand_h: 2
    messung: |
      Amtliche Meldungen, woertlich:
        Der Absendername muss im Feld $/Vorsatz[1]/AbsName[1]$ angegeben werden.
        ... AbsStr, AbsOrt, Unterfallart, Vorgang, Zeitraum, Copyright, OrdNrArt
        Im Feld $/Vorsatz[1]/Rueckuebermittlung[1]/Bescheid[1]$ ist anzugeben, ob
        die Bereitstellung der Bescheiddaten zur elektronischen Abholung
        gewuenscht wird.
      Strukturbefund (nachgemessen): der Vorsatz-Block traegt KEIN einziges Kz.
        len([1 for v in kz_pfade(2025).values() if 'Vorsatz' in v]) == 0
      kz_pfade() indiziert nur E\d{7}. Der uebliche Weg (Kz in deklaration ->
      Schema-Walk -> _einhaengen legt Container an) kann diesen Block deshalb
      strukturell NIE erzeugen. Er braucht einen eigenen Schreibpfad, gebaut wie
      _transfer_header().
    bericht: reports/adjudikation/stammdaten_inventur_2026-08-09.md

