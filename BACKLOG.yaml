    status: analysiert
    bericht: reports/adjudikation/sys_path_messung_2026-08-07.md
    aufwand_h: null
    messung: |
      2026-08-07 nachgemessen, die alte Zahl war falsch:
        133 Dateien, 187 sys.path.insert-Aufrufe (andere Formen: 0)
        tests/   123 Dateien / 174 Aufrufe  = 92 % des Problems
        produkt/  10 Dateien /  13 Aufrufe
      Die alte Angabe "35 in Produktion" war um Faktor 3,5 zu hoch.
    wirkung: |
      Was am AST-Resolver scheitert, scheitert genauso an mypy/pyright, IDE-Navigation,
      automatischem Rename und Import-Zyklus-Checks. Beides im Report belegt
      (mypy und pyright koennen die Injektionen nicht aufloesen).
    zwei_stufen: |
      Weil die Produktion fast sauber ist, zerfaellt der Umbau in zwei unabhaengige
      Vorhaben, die einzeln entschieden werden koennen:
        Stufe 1  produkt/, 10 Dateien — ~0,5 Tage. Echtes Laufzeitrisiko (ein
                 falsch aufgeloester Import bricht Ring oder Server erst zur
                 Laufzeit), braucht ein Gate. Lohnt sich auch allein.
                 api_llm.py hat keinen eigenen Aufruf und erbt den Pfad von api.py —
                 muss mit api.py zusammen umgestellt werden.
        Stufe 2  tests/, 123 Dateien — ~2,5-4 Tage. Mechanisch, kein Produktions-
                 risiko: ein Fehler ist sofort ein roter Test.
    reihenfolge: |
      Stufe 1 NACH dem api.py-Split — beide fassen api.py/api_llm.py/server.py an,
      und der Split legt die Modulgrenzen fest, an denen sich die Importe danach
      ausrichten. Stufe 2 blockiert nichts und kann jederzeit laufen.

