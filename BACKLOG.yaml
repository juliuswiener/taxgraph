  - id: kap-antragsgrund-fehlt
    titel: "Anlage KAP ohne Antragsgrund — Erklaerung mit Kapitalertraegen ist nicht einreichbar"
    status: erledigt
    erledigt_in: "02614c6 + 71996a8 (Stufe 1) + ac2989a (Stufe 2) + 9801efc/5760ff7 (Stufe 3)"
    erledigt_wie: |
      Alle drei Bausteine gebaut. Stufe 1 Antragsgrund E1900401 + Sparer-Pauschbetrag
      E1901401 (gemessen: KEINES der beiden reicht allein, checkESt verlangt beide).
      Stufe 2 KapESt/SolZ/KiSt-Anrechnung Zeilen 37-39 nach § 36 Abs. 2 Nr. 2 EStG.
      Stufe 3 q (auslaendische Quellensteuer, E1905101) — dabei fiel auf, dass das Kz im
      Dezimalformat "N,NN" geschrieben werden muss und als "1000" statt "1000,00" nicht
      einreichbar war (5760ff7, _KOMMA_OHNE_E60_KZ in est_mapping.py).
    richtung: "war ABGABE-BLOCKER, jetzt geschlossen — Anlage KAP ist vollstaendig"
    entdeckt: "2026-08-10, tests/test_checkest_feldmatrix.py, erster Lauf"
    messung: |
      Ratschen-Fixtur einzel, nur kap_kapitalertraege veraendert:
        kap = 0       -> rc=0          0 Beanstandungen   E1900701 nicht im XML
        kap = 5.000 € -> rc=610001002  1 Beanstandung     E1900701 im XML
      "Auf den Anlagen KAP und / oder KAP-BET wurden Kapitalertraege erklaert, die dem
       inlaendischen Steuerabzug unterlegen haben. Bitte geben Sie auf der Anlage KAP auch
       einen Grund fuer die Angabe der Kapitalertraege an."
    fehlende_kz: |
      Sektion Ant der Anlage KAP (Zeilen 4-5), einer davon MUSS gesetzt sein:
        E1900401  "Ich beantrage die Guenstigerpruefung fuer saemtliche Kapitalertraege"  (§ 32d Abs. 6)
        E1900501  "Ich beantrage eine Ueberpruefung des Steuereinbehalts fuer bestimmte
                   Kapitalertraege"                                                       (§ 32d Abs. 4)
    zweiter_befund: |
      Der Ring rechnet die Guenstigerpruefung heute AUTOMATISCH (Golden Case
      kapital_guenstiger_2025_einzel, festzusetzende_est 902). § 32d Abs. 6 S. 1 sagt aber
      "Auf Antrag des Steuerpflichtigen". Ohne E1900401 in der Erklaerung macht das Finanzamt
      sie nicht — unsere Berechnung verspricht dann etwas, was der Bescheid nicht liefert.
      Gleiche Naht wie die Verpflegungskuerzung: Ring rechnet, Deklaration schweigt.
      Bindungswirkung beachten: Abs. 6 S. 3 nur einheitlich fuer saemtliche Kapitalertraege,
      S. 4 bei Zusammenveranlagung fuer beide Ehegatten.
    dritter_befund: |
      Von 164 E19-Kz (Anlage KAP) im E10-2025.xsd sind 5 gebunden, alle in Sektion
      Betr_lt_StBesch (die Ertraege-Seite). Die gesamte Steuerabzugsbetraege-Seite fehlt:
      es gibt kein Feld fuer einbehaltene Kapitalertragsteuer, SolZ oder KiSt. Wer Ertraege
      erklaert, ohne die darauf gezahlte Steuer zu erklaeren, bekommt sie nicht angerechnet.
    baustein_1_geloest: |
      2026-08-10, produkt/haut/api.py::_mit_ring_werten + produkt/bindung/bindung_kap_vv_familie.yaml.
      Entscheidung (praezisiert 2026-08-10, ersetzt die vorsichtigere Mittags-Vorgabe): E1900401
      wird IMMER gesetzt, sobald irgendein KAP-Betragsfeld > 0 erklaert wird (eigen ODER — bei
      Zusammenveranlagung — Partner) — NICHT an den vom Ring beim Rechnen gewaehlten Zweig
      (kap_st < abgeltung) gekoppelt. Begruendung: § 32d Abs. 6 S. 1 kann strukturell nicht
      schlechterstellen ("wenn dies zu einer niedrigeren Einkommensteuer ... fuehrt"); die
      Ring-Kopplung blockierte genau den haeufigeren Fall (Abgeltung guenstiger) weiter mit
      rc=610001002.
      Zusaetzlich gemessen: E1900401 allein reicht NICHT. checkESt verlangt zusaetzlich Kz
      E1901401 (§ 20 Abs. 9, in Anspruch genommener Sparer-Pauschbetrag, Anlage KAP Zeile 16,
      Vordruck erlaubt ausdruecklich "(ggf. 0)"), sonst rc=610001002 mit anderer Meldung
      ("...jedoch keine Angabe zum in Anspruch genommenen Sparer-Pauschbetrag"). Truth-table
      (Basisfall + kap_kapitalertraege=5.000):
        ohne beides                rc=610001002  "...einen Grund fuer die Angabe ... angeben"
        nur E1901401                rc=610001002  derselbe Blocker
        nur E1900401                rc=610001002  "...keine Angabe zum in Anspruch genommenen
                                                    Sparer-Pauschbetrag"
        E1900401 + E1901401         rc=0          einreichbar
      E1901401-Wert = (rohe/verrechnete Kapitalertraege) - (catala_sparer_pb-Ergebnis), floor 0.
      offen_bei_julius (b) unten damit beantwortet: NICHT an den Ring-Gewinnzweig koppeln.
    reihenfolge: |
      1. Antrags-Kz (hebt den Blocker auf, bringt Guenstigerpruefung in Deckung) — GEBAUT,
         s. baustein_1_geloest. Gate: tests/test_kap_antrag_kz.py (Bindung) +
         tests/test_checkest_feldmatrix.py::test_kap_antrag_ist_inert_ohne_kapitalertraege
         (Gegenprobe: beide Kz aus ohne Kapitalertraege, beide an mit).
      2. Steuerabzugsbetraege (die grosse Anrechnung) — weiter offen
      3. p32d-q-auslandssteuer (die auslaendische Anrechnung, kleinster Betrag) — weiter offen
    offen_bei_julius: |
      (a) Formularsatz fuer Baustein 2/3 (Steuerabzugsbetraege, Zeilen 37-42): amtlicher Vordruck
