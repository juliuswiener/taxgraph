      kind_hilflos_blind_taubblind, kind_hinterbliebenen_uebertragung,
      kind_behinderten_pb_antrag, kind_pb_nicht_selbst_genutzt, kinderbetreuungskosten.
    betroffen: |
      Alle kindbezogenen Abzuege AUSSER dem Freibetrag sind heute nicht einreichbar:
        § 10 Abs. 1 Nr. 5   Kinderbetreuungskosten
        § 10 Abs. 1 Nr. 3   KV/PV-Beitraege des Kindes
        § 33b Abs. 5        Uebertragung des Kind-Pauschbetrags
      Der reine Kinderfreibetrag (fam_anzahl_kinder) ist NICHT betroffen — er kommt ohne
      Anlage Kind aus.
    fall_c_weitere_beanstandungen: |
      Bei gesetzten Betreuungskosten kamen VIER Beanstandungen, u. a.: "Die Eltern des
      Kindes werden nicht zusammen veranlagt. Bitte geben Sie daher auch die Hoehe der
      Kinderbetreuungskosten an, die von der [anderen Person getragen wurden]". Vor dem Bau
      alle vier einzeln aufnehmen — der Vorname ist nur die erste.
    zusammenhang: |
      Verwandt mit dem DEFER-Fund "Kinderbetreuung ohne Alters-/Ausschlusspruefung"
      (commit-nur-defer-sweep-2026-08-10): dort fehlt die Qualifikationspruefung nach
      § 10 Abs. 1 Nr. 5 (unter 14 bzw. Behinderung), hier die Deklarierbarkeit. Beide
      betreffen denselben Block und sollten zusammen gebaut werden.

