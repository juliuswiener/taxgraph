    status: erledigt
    erledigt_in: "9801efc + 5760ff7 (2026-08-10/11)"
    erledigt_wie: |
      q (Zeile 41, E1905101) gebaut, § 32d Abs. 1 S. 2/4-5. Zwei Korrekturen am Briefing
      durch die Messung: § 32d Abs. 1 S. 2 gilt AUCH OHNE Kirchensteuerpflicht (das
