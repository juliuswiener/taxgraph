  - id: kontoauszug-pdf-test-vergleicht-ganz-tmp
    titel: "test_pdf_base64_upload_verworfen_feld ist flaky durch Fremdprozesse"
    status: erledigt
    erledigt_in: "c487ad0 (2026-08-07)"
    erledigt_wie: |
      _tmp_pdfs() filtert jetzt auf tempfile.gettempprefix() + ".pdf" — genau die Form,
      die api.py:2552 selbst anlegt. Mutationsprobe: os.unlink(pfad) -> pass ergab
      "Extra items in the left set: tmpx5bhkx90.pdf". Gegenprobe mit einer fremden
      /tmp-Datei waehrend des Laufs: gruen. Der PII-Guard ist dadurch schaerfer, nicht
      schwaecher.
    aufwand_h: 0.25
    entdeckt: "2026-08-07"
    messung: |
      Der Test macht os.listdir(tempfile.gettempdir()) vor und nach dem Call und verlangt
      `nach - vor == set()`. Er sieht damit JEDEN Fremdprozess, der waehrenddessen etwas in
      /tmp anlegt. Einmal rot mit:
        AssertionError: assert {'go-build2607090677'} == set()
      Ein paralleler Go-Compiler, nicht der Kontoauszug-Endpunkt. Danach 3x hintereinander
      gruen, auf HEAD ohne Aenderungen ebenfalls gruen.
    fix: |
      Statt ganz /tmp zu vergleichen nur auf das Praefix filtern, das der Endpunkt selbst
      benutzt. Der PII-Leck-Guard bleibt damit erhalten und wird sogar schaerfer.

  - id: stille-null-klasse-c
    titel: "Vorlaeufige Instanz faellt still aus der Rechnung — gwg, kind x3, p23"
    status: analysiert
    aufwand_h: 1
    entdeckt: "2026-08-07, beim p23-Fix (63bce6f) als Folgefrage"
    bericht: reports/adjudikation/instanz_stille_null_2026-08-07.md
    messung: |
      Frage war: faellt eine vorlaeufige Instanz an ALLEN 9 gefilterten Aggregat-Stellen
      still durch, wie bei p23? Antwort: nein, nur an 4 von 9. Es gibt drei Klassen.

      Klasse A — Basis-Instanz (index 1) von vv_objekt und rente: sind Kegel-Pflichtfelder.
      ergebnis() prueft das VOR der Zahl -> grund="input_kegel_nicht_bestaetigt",
      zahl_cent=None, offen listet das Feld. Fail-closed, gemeldet. KEIN Bug.

      Klasse B — Zusatz-Instanz (index >=2) von vv_objekt und rente: Guard in
      _an_gesamt_sperrgrund (api.py:1930/1948) prueft inst["zustand"] != "bestaetigt"
      unbedingt -> grund="vv_instanz_offen"/"rente_instanz_offen", zahl_cent=None.
      Fail-closed, gemeldet. KEIN Bug.
      Beide Zusatz-Instanzen einzeln gemessen: vv_objekt index 2 (von main)
      grund="vv_instanz_offen", zahl_cent=None. rente index 2 in rentner_gesamt (dev-a,
      echte Werte aus der test_p3_vor_partner-Fixture) grund="rente_instanz_offen",
      zahl_cent=None, stand.ring_gesperrt="rente_instanz_offen".

      Klasse C — gwg, alle drei kind-Aufrufer, p23: kein Kegel-Gate, kein Sperrgrund.
      Der Filter tut, was er soll (die Zahl bleibt korrekt), aber nichts in der Antwort
      sagt, dass eine Nutzereingabe ignoriert wurde. Alle 6 Klasse-C-Funktionen einzeln
      gemessen, je dreifach — Referenz ohne Feld / vorlaeufig / bestaetigt:

        _schulgeld_summe            1392400 / 1392400 / 1359200   (D = 33200 ct)
        _kind_kv_pv_summe           1392400 / 1392400 / 1336300   (D = 56100 ct)
        _kind_behinderten_pb_daten  1392400 / 1392400 / 1311400   (D = 81000 ct)

      Die bestaetigt-Kontrolle ist der Punkt: ohne sie belegt "gleich wie Referenz" nur,
      dass das Feld folgenlos ist — nicht, dass ein Filter greift. Der Delta beweist, dass
      das Feld sehr wohl wirkt, wenn es bestaetigt ist. grund bleibt in allen Faellen
      "bestaetigt", offen bleibt [].
      main hat die schulgeld-Zeile unabhaengig nachgerechnet und exakt reproduziert.

      Es gibt KEINE fuenfte Klasse-C-Stelle. Die Vermutung, die gesamt-Scheibe koenne
      wegen multi_rente=None eine ungeschuetzte rente-Zusatz-Instanz aufnehmen, ist
      widerlegt: event() lehnt rentner_jahresrente__2 in gesamt mit
      ApiError "feld_id 'rentner_jahresrente__2' nicht in dieser Scheibe" ab, weil die
      RENTNER_22-Kernfelder gar nicht in der gesamt-Bindung stehen (api.py:2197).
      Von dev-a gemessen, von main unabhaengig nachgestellt.
    wirkung: |
      Kein Geldfehler — die Zahl ist nach dem p23-Fix korrekt. Der Schaden ist
      Vertrauensschaden: der Nutzer traegt etwas ein, sieht es in /fragen, und die
      festgesetzte Zahl enthaelt es trotzdem nicht, ohne Hinweis. /fragen zeigt das Feld
      zwar (traverser._unbeantwortet behandelt vorlaeufig als offen), aber das ist ein
      SEPARATER Endpunkt, den der Nutzer aktiv abrufen muss.
    bauvarianten: |
      (a) Neuer Sperrgrund instanz_vorlaeufig_offen, Parität zu vv_objekt/rente.
          Nutzer kommt nicht weiter, bis er bestaetigt oder loescht.
          Aufwand mittel. GEGENARGUMENT: der Docstring von _gwg_sofortabzug_summe sagt
          ausdruecklich "gwg ist OPTIONAL -> KEIN Kegel-/Sperr-Gate (anders als vv/rente)".
          (a) wuerde eine bewusste Entscheidung umkehren.
      (b) Die vorlaeufigen Felder in das bereits vorhandene "offen"-Feld der Antwort.
          Nutzer sieht es, kann aber weitermachen. grund und zahl_cent bleiben.
          Aufwand klein. api.py:2277 setzt "offen": [] im Erfolgspfad hart —
          von main nachgelesen, das ist die einzige Stelle, die sich aendern muss.
          Die Antwortstruktur bleibt gleich, das Schema (api_schema/ergebnis.json)
          fuehrt "offen" bereits als required.
      (c) Pro Gruppe verschieden — faellt unter der jetzigen Faktenlage mit (b) zusammen,
          weil keine der vier Gruppen ein Argument fuer (a) hat.
    empfehlung_main: |
      (b). Sie macht die stille Null sichtbar, ohne die dokumentierte Additiv-Entscheidung
      fuer gwg/kind zu brechen, und sie ist billiger als der Bericht schaetzt: das
      offen-Feld existiert bereits in JEDER /ergebnis-Antwort und ist im Erfolgspfad
      leer. Es geht um eine Sammelstelle in ergebnis() plus 4 Tests.
    entscheidung_julius: |
      OFFEN. Nichts gebaut. Welche Variante — und ob ueberhaupt, denn es ist kein
      Geldfehler, sondern eine Sichtbarkeitsluecke.
