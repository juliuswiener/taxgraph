        hh_minijob_aufwendungen      "...wurde der Gesamtbetrag der Aufwendungen angegeben,
                                      es wurde aber kein(e Einzelaufstellung)..."
      Kein Einzelfall, sondern dieselbe Anforderung an allen drei § 35a-Toepfen.
    zu_klaeren: |
      Welche Struktur die Einzelaufstellung im XSD hat (Instanz je Leistung mit Erbringer/
      Betrag/Art?) und ob sie damit eine Instanz-Achse braucht wie kind/vv_objekt.
    struktur_analysiert: |
      2026-08-10, reports/adjudikation/anlage-haushaltsnahe-einzelaufstellung-2026-08-10.md
      (gegen E10-2025.xsd Z.10026-10137 direkt gegengelesen). Alle drei Toepfe sind
      Einz[99]+Sum[1]-Paare (St_Erm_1426027020_CType); heutige Bindung fuellt nur Sum, nie
      Einz — erklaert rc=610001002 identisch fuer alle drei. Einzelposten-Kz:
        Minijob:      E0104206 (Art) + E0104108 (Betrag)
        Dienstl.:     E0107206 (Art) + E0107207 (Betrag)
        Handwerker:   E0111217 (Art) + E0170601 (Rechnungsbetrag) + E0111214 (Lohnanteil)
      Praezedenz existiert bereits produktiv: instanz_gruppe-Mechanismus (est_mapping.py:294),
      heute genutzt von vv_objekt/kind/Multi-Rente, Kz-Reuse je Instanz. §35a waere vierter
      Konsument, kein Neubau. Anleitung-PDF (014_Anleitung_Anlage_Haushaltsnahe...) liefert
      keine zusaetzliche Aussage.
      Offene Bau-Frage war: die drei Sum-Kz weiter direkt erfragen oder aus den Instanzen
      berechnen, damit Summe und Einzelaufstellung nicht auseinanderlaufen koennen —
      Produktentscheidung, nicht Teil der Struktur-Analyse.
    entschieden: |
      2026-08-10: die Sum-Felder werden AUS DEN INSTANZEN BERECHNET, askable:false. Zwei
      Repraesentationen desselben Sachverhalts, die auseinanderlaufen koennen, waren in
