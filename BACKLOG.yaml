  - id: vpf-frist-null-plausibilitaet
    titel: "§ 9 Abs. 4a S. 6/7 — >3 Monate erklaert, aber 0 Tage nach Frist"
    status: erledigt
    erledigt_in: "519199e (2026-08-07)"
    aufwand_h: 1.5
    richtung: under-tax
    entdeckt: "2026-08-07, als Nebenbefund beim Schliessen von vpf-dreimonatsfrist"
    messung: |
      monate=5, tage_24h=60, alle drei NACH_FRIST=0 bestaetigt
        -> voller Abzug 1680 EUR WK, keine S.6-Kuerzung
      identisch zum Fall ohne jede Monatsangabe. Der Ring kann "wirklich 0 Tage
      nach Fristablauf" nicht von "Nutzer hat 0 hingeschrieben" unterscheiden.
    warum_keine_harte_sperre: |
      0 ist eine legitime Antwort. § 9 Abs. 4a S. 7 laesst die Frist bei laengerer
      Unterbrechung neu anlaufen — wer 5 Monate auf Montage gemeldet ist, aber nur
      in den ersten Wochen hinfaehrt, hat korrekt 0 Tage nach Frist. Schlamper und
      Sonderfall tippen dieselbe 0.
    entscheidung_julius: "2026-08-07: sperren MIT Rueckfrage, nicht hart ablehnen"
    plan: |
      Bool-Feld vpf_frist_unterbrochen (askable, fallweit), Sperrgrund solange
      unbeantwortet. Die Antwort ist eine Bestaetigung, kein Rechenparameter —
      sie aendert das Ergebnis nicht, sie holt die Erklaerung ein.
    gebaut_2026_08_07: |
      Guard steht (api.py:1721, Sperrgrund verpflegung_dreimonatsfrist_unterbrechung_offen),
      das Feld heisst aber vpf_frist_NICHT_unterbrochen. Grund: der erste Entwurf hatte die
      Gate-Polaritaet verdreht.
      Ein askable bool an einer geltungsbedingung ist ein GATE — traverser.py:96 setzt
      `ausgeschlossen`, sobald es `false` ist. Die Frage lautete "War die Taetigkeit
      unterbrochen?", also antwortete der NORMALFALL wahrheitsgemaess `false` und verlor den
      gesamten Verpflegungsmehraufwand. Gemessen:
        unbeantwortet -> unentschieden,  16 offene vpf-Fragen
        false         -> ausgeschlossen,  0 offene vpf-Fragen
        true          -> relevant,       15 offene vpf-Fragen
      S. 7 ist eine Ausnahme ZUGUNSTEN des Steuerpflichtigen und taugt so nicht als Gate.
      Muster uebernommen von uebernachtung_keine_lange_unterbrechung (§ 9 Abs. 1 S. 3 Nr. 5a
      S. 5): Name und Frage zielen aufs Nicht-Unterbrochensein, Normalfall antwortet "ja".
      Verworfene Alternative: askable: false. Schliesst die Polaritaetsfalle, oeffnet aber
      einen Deadlock — der Guard liest das Feld direkt und sperrt weiter, waehrend
      naechste_fragen es nicht mehr anbietet. Gemessen, jetzt als Test festgehalten.
      Zwei Nebenbefunde mit erledigt: die Bindung zeigte auf die nicht existierende Bedingung
      vpf_frist_unterbrochen_erklaert, und vpf_keine_unterbrechung band dasselbe
      Tatbestandsmerkmal ein zweites Mal an dieselbe Bedingung.
    lehre: |
      Ein askable bool an einer geltungsbedingung ist IMMER ein Gate. Vor dem Formulieren der
      Frage pruefen: welche Antwort gibt der Normalfall, und heisst diese Antwort "Regel gilt"?
      Wenn die Norm eine Ausnahme ZUGUNSTEN des Steuerpflichtigen ist, muss die Frage negiert
      werden, sonst schliesst der Normalfall die Regel aus.

