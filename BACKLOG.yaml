    erledigt_wie: |
      Alle drei Loecher zu. L1: NACH_FRIST in beiden Zweigen verdrahtet, an_gesamt-Scheibe
      um die Felder erweitert (vorher 400). L3: Alles-oder-Nichts bei >3 Monaten aufgeloest.
      L2: Guard fail-closed, kategorie-weise — NACH_FRIST_i nur Pflicht wenn TAGE_i > 0.
      Sperrgrund verpflegung_dreimonatsfrist_aufteilung_offen. xfail(strict) entfernt,
      Assert auf gemessene -14700 Cent (Fenster +/- 100). Julius-Entscheid: Scope
      gesamt + an_gesamt, fail-closed statt stiller 0.
    julius_offene_frage_beantwortet: "an_gesamt JA mit aufgenommen (2026-08-07)"
    bericht: reports/adjudikation/vpf_dreimonatsfrist_tote_naht_2026-08-06.md
    aufwand_h: 1.5
    richtung: under-tax
    wirkung: "420 EUR zu viel Werbungskosten je Fall, bei 42 % rund 176 EUR zu wenig Steuer"
    betrifft: "jeden mit mehr als drei Monaten Taetigkeit am selben Ort"
    messung: |
