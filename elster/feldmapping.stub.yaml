# Feldmapping-Tabelle - STUB.
# RICHTUNG (Instructor 2026-07-12, Auflage a): das Feldmapping bildet DEKLARATIONS-
# Groessen (Sachverhalts-Inputs und deklarierte Summen, die der Steuerpflichtige in
# ESt1A/Anlagen eintraegt) auf die amtlichen ELSTER-Kz ab. BERECHNETE Groessen
# (tarifliche/festzusetzende Steuer) gehoeren NICHT in die Deklaration und stehen
# daher NICHT hier - checkESt validiert die Deklaration; unsere Berechnung wird
# anders gegengecheckt (GETTSIM-Differential offline; ERiC hat KEINE Offline-
# Steuerberechnung, s. reports/review/2026-07-12-eric-smoke-befund.md).
#
# Kz-Quelle liegt jetzt vor: E10-2025.html (ESt-Schemadok, 3948 Kz). Die amtlichen
# Kz je Zeile werden schrittweise gesetzt (status stub -> mapped) und laufen
# VOLLSTAENDIG durch Instructor-Review (Kz-Kandidaten je Regel-Input, da Labels nicht
# 1:1 mappen - z.B. Kirchensteuer hat Sonderausgabe-/KapESt-/Lohnsteuer-Varianten).

