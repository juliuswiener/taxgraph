# G2-Bake-off Task-Liste. Start gibt Julius separat frei (nur Vorbereitung).
#
# Zwei Gruppen:
#  A) blind_repro: die vier handformalisierten Regeln. Die Hand-Referenz existiert,
#     wird der Pipeline aber vorenthalten. LEAKAGE-SCHUTZ: `exclude_rule_ids` nimmt
#     die eigene rule_id (und alle Teilregeln) aus dem Few-Shot-Set der Laeufe
#     heraus, die sie reproduzieren sollen. pipeline/bakeoff/check_leakage.py
#     erzwingt das vor jedem Lauf.
#  B) neu: zehn neue Regeln aus dem Anlage-N-Umfeld (Phase-3-Liste), ohne Referenz;
#     bewertet ueber Gates + Eskalationsrate.
#
# Paarungen und Judge stehen in pipeline/models.yaml (bakeoff.pairings).

blind_repro:
  - rule_id: p32a_einkommensteuertarif
    norm_source: sources/gesetze-im-internet/estg_p32a_2026-07-09.txt
    reference: rules/estg/p32a/einkommensteuertarif.catala_en
    # Referenzdatei enthaelt die co-lozierte § 9a/§ 10c-Kette -> deren Few-Shots
    # muessen fuer diese Blind-Reproduktion ebenfalls raus.
    exclude_rule_ids: [p32a_einkommensteuertarif, p9a_arbeitnehmerpauschbetrag, p10c_sonderausgabenpauschbetrag]
    output_field: tarifliche_steuer
    input_types: {zu_versteuerndes_einkommen: money}
    raster_hint: "zvE 0..300000, Zonengrenzen +-1 (siehe golden/cases/g32a_*)"

  - rule_id: p9a_p10c_kette
    norm_source: sources/gesetze-im-internet/estg_p9a_2026-07-09.txt
    reference: rules/estg/p32a/einkommensteuertarif.catala_en   # Kette co-loziert
    # Beide Teilregeln raus: sie stehen als Few-Shot-Beispiele im Basis-Set.
    exclude_rule_ids: [p9a_arbeitnehmerpauschbetrag, p10c_sonderausgabenpauschbetrag, p9a_p10c_kette]
    output_field: einkuenfte
    input_types: {bruttoarbeitslohn: money, werbungskosten: money}
    raster_hint: "brutto 0..200000, WK 0/2000/5000 (inkl. WK > Brutto)"

  - rule_id: p09_entfernungspauschale
    norm_source: sources/gesetze-im-internet/estg_p9_abs1nr4_abs2_2026-07-09.txt
    reference: rules/estg/p09_entfernungspauschale/entfernungspauschale.catala_en
    exclude_rule_ids: [p09_entfernungspauschale]
    output_field: abziehbarer_betrag
    input_types:
      entfernung_km_roh: decimal
      arbeitstage: int
      eigenes_oder_ueberlassenes_kfz: bool
      oepnv_kosten_jahr: money
      satz_bis_20_km: money
      satz_ab_21_km: money
      staffelgrenze_km: int
      hoechstbetrag: money
    raster_hint: "km 10.6/20/30/100, AT 200/220, Kfz an/aus, OePNV 0/1380"

  - rule_id: p04_arbeitszimmer_homeoffice
    norm_source: sources/gesetze-im-internet/estg_p04_abs5_2026-07-09.txt
    reference: rules/estg/p04_arbeitszimmer_homeoffice/arbeitszimmer_homeoffice.catala_en
    exclude_rule_ids: [p04_arbeitszimmer_homeoffice]
    output_field: abzug_gesamt
    input_types:
      arbeitszimmer_vorhanden: bool
      ist_mittelpunkt: bool
      tatsaechliche_aufwendungen: money
      jahrespauschale_gewaehlt: bool
      monate_ohne_mittelpunkt: int
      homeoffice_tage: int
      jahrespauschale: money
      tagespauschale_pro_tag: money
      tagespauschale_hoechstbetrag: money
    raster_hint: "Mittelpunkt an/aus, Jahrespauschale an/aus, Tage 0/100/250 (Cap), Ausschluss 6c S.3"

# Zehn neue Regeln. Norm-Texte eingefroren (sources/, sha256-verifiziert; siehe
# `make sources-check`). Keine Referenz -> Bewertung ueber Gates.
#
# Bewusst strukturell gemischt statt 10x Anlage-N-Monokultur: eine Tabellen-/
# Staffelregel (§ 33 Abs. 3) und eine Prozent+Cap-Regel (§ 35a Abs. 2/3) kommen
# hinzu. Das testet die Formalisierer breiter: 2D-Tabellen-Lookup, Prozent-
# rechnung, Caps, Fristen, Praedikate/Abgrenzung.
#
# `test_seed`: Rechenbeispiele aus EStH/BMF als Test-Seeds mit Zitatanker. Wo
# keine existieren -> `test_seed: none`; das Clerk-Test-Gate wird fuer diese Task
# als n/a gewertet, Aequivalenz + Round-Trip tragen. Keine LLM-erfundenen
# Erwartungswerte als Testreferenz.
neu:
  - rule_id: p9_1_3_nr5_doppelte_haushaltsfuehrung
    norm: "§ 9 Abs. 1 S. 3 Nr. 5 EStG"
    norm_source: sources/gesetze-im-internet/estg_p9_abs1nr5_2026-07-09.txt
    struktur: [monats_cap_1000, bedingungen, inland_ausland_fallunterscheidung]
    test_seed: none

  - rule_id: p9_1_3_nr5a_uebernachtung
    norm: "§ 9 Abs. 1 S. 3 Nr. 5a EStG"
    norm_source: sources/gesetze-im-internet/estg_p9_abs1nr5a_2026-07-09.txt
    struktur: [ist_kosten, 48_monats_grenze, neubeginn_regel]
    test_seed: none

  - rule_id: p9_4a_verpflegungsmehraufwand
    norm: "§ 9 Abs. 4a EStG"
    norm_source: sources/gesetze-im-internet/estg_p9_abs4a_2026-07-09.txt
    struktur: [staffel_nach_abwesenheit, dreimonatsfrist, prozentuale_kuerzung]
    test_seed: none

  - rule_id: p9_1_3_nr6_arbeitsmittel
    norm: "§ 9 Abs. 1 S. 3 Nr. 6 EStG"
    norm_source: sources/gesetze-im-internet/estg_p9_abs1nr6_2026-07-09.txt
    struktur: [einfacher_abzug, verweis_auf_nr7]
    test_seed: none

  - rule_id: p9_1_3_nr7_afa
    norm: "§ 9 Abs. 1 S. 3 Nr. 7 EStG"
    norm_source: sources/gesetze-im-internet/estg_p9_abs1nr7_2026-07-09.txt
    struktur: [verweisregel, gwg_grenze_ueber_p6]
    test_seed: none

  - rule_id: p9_6_erstausbildung_abgrenzung
    norm: "§ 9 Abs. 6 EStG"
    norm_source: sources/gesetze-im-internet/estg_p9_abs6_2026-07-09.txt
    struktur: [praedikat_definition, mindestdauer_12_monate, abgrenzung]
    test_seed: none

  - rule_id: p10_1_7_berufsausbildung
    norm: "§ 10 Abs. 1 Nr. 7 EStG"
    norm_source: sources/gesetze-im-internet/estg_p10_abs1nr7_2026-07-09.txt
    struktur: [jahres_cap_6000, verdopplung_ehegatten, verweiskette]
    test_seed: none

  - rule_id: p24b_entlastungsbetrag
    norm: "§ 24b EStG"
    norm_source: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    struktur: [grundbetrag_4260, kindstaffel_240, zwoelftelung, praedikat_alleinstehend]
    test_seed: none

  # Strukturvielfalt (Julius, 2026-07-09): Tabellen-/Staffelregel ...
  - rule_id: p33_3_zumutbare_belastung
    norm: "§ 33 Abs. 3 EStG"
    norm_source: sources/gesetze-im-internet/estg_p33_abs3_2026-07-09.txt
    struktur: [tabellen_lookup_2d, gde_stufen, kinderzahl_stufen, prozent_des_gde]
    test_seed: none

  # ... und Prozent+Cap-Regel.
  - rule_id: p35a_2_3_haushaltsnahe
    norm: "§ 35a Abs. 2 und 3 EStG"
    norm_source: sources/gesetze-im-internet/estg_p35a_abs2_3_2026-07-09.txt
    struktur: [prozent_20, cap_4000, cap_1200, nur_arbeitskosten]
    test_seed: none

# Metriken je Paarung (Nachtrag Abschnitt 5). Entscheid: niedrigste
# Eskalationsrate gewinnt; Kosten nur als Tiebreaker.
metriken:
  - syntaxvaliditaet          # nach Syntax-Gate + Compiler-Typecheck
  - aequivalenz_divergenzrate # A vs B auf dem Input-Raster
  - roundtrip_abweichungsrate # Judge: faithful=false
  - stille_zusatzannahmen     # Anteil Laeufe mit nichtleerem Feld
  - blind_reproduktion        # extensionale Uebereinstimmung mit Hand-Referenz
  - eskalationsrate           # queue_status == flagged_for_review
  - kosten_pro_approved
  - wanduhrzeit_pro_approved

# Worker-Stufe laeuft mit V4 Flash mit. Zitatanker-Rejectrate > 10 % -> Eskalation
# und separater Mini-Bake-off der Worker-Rolle.
worker_gate:
  zitatanker_rejectrate_schwelle: 0.10
