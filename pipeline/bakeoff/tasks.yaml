# G2-Bake-off Task-Liste.
#
# Signaturen sind vorgegeben, damit A, B und (bei blind_repro) die Hand-Referenz
# extensional vergleichbar sind. Bewusst enthalten die Signaturen NUR Sachverhalts-
# Eingaben, keine Norm-Konstanten: Betraege, Prozentsaetze, Caps und Fristen muss
# das Modell selbst aus dem Norm-Text holen. Sonst waere das Aequivalenz-Gate trivial.
#
# Signaturen sind ausserdem VZ-agnostisch. Die Hand-Referenzen sind je VZ
# parametrisiert; die Parameterwerte des VZ, dessen Norm-Fassung eingefroren ist,
# stehen in `ref.fixed_inputs` und werden nur der Referenz zugefuehrt, nie dem
# Modell. Beispiel p09: die eingefrorene Fassung 2026 kennt einheitlich 0,38 Euro
# ab km 1 (StAendG 2025), also faehrt die Referenz mit satz_bis_20_km = 0,38.
# `fixed_inputs` ist getypt: {value, type} bzw. {enum, code} fuer Aufzaehlungen.

