    zitatanker: bestimmt sich nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes
    herkunft: synthetisch
    rechenweg: 'Reiner Slot ohne Korrekturen: einkommen = 500.000 + 0 - 0 = 500.000,00 (nach EStG ermittelter Gewinn, § 8 Abs. 1).'
    inputs:
      gewinn_estg: 500000
