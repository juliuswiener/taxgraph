- rule_id: p10d_2_verlustvortrag_abzug
  hinweis: sockel = wenn zusammenveranlagung dann 2000000 sonst 1000000 (Norm-Konstante nach Veranlagung). verlustabzug = wenn gesamtbetrag_einkuenfte <= 0 dann 0, sonst min(verlustvortrag_bestand, min(gesamtbetrag_einkuenfte, sockel + (70 / 100) * max(0, gesamtbetrag_einkuenfte - sockel))). WICHTIG - der Hoechstbetrag ist auf den gesamtbetrag_einkuenfte GEKAPPT (min(GdE, ...)), NICHT der Sockel pauschal (§ 10d Abs. 2 'bis zu einem GdE ... UNBESCHRAENKT' meint der GdE selbst ist die Grenze) - ein Bestand groesser als der GdE wird auf den GdE gekappt, der Rest wird vorgetragen (Abs 4, nicht Gegenstand dieser Regel). 70 ist ein PROZENTWERT -> Division durch 100 in decimal rechnen, Cent-Schnitt zuletzt. Bestand ist Input/State; Mehrjahres-Fortschreibung (Abs 4) gehoert NICHT in diese Regel.
  norm: § 10d Abs. 2 EStG (Verlustvortrag-Hoechstbetrag)
  quellen:
  - typ: gesetz
    label: § 10d Abs. 2 S. 1-2 EStG (Verlustvortrag, 1/2 Mio Sockel + 70 %)
    datei: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    auszug: Nicht ausgeglichene negative Einkünfte, die nicht nach Absatz 1 abgezogen worden sind, sind in den folgenden Veranlagungszeiträumen bis zu einem Gesamtbetrag der Einkünfte von 1 Million Euro unbeschränkt, darüber hinaus bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte vorrangig vor Sonderausgaben, außergewöhnlichen Belastungen und sonstigen Abzugsbeträgen abzuziehen (Verlustvortrag).
  geltungsbedingungen:
  - bedingung: verlustvortrag_bestand_festgestellt
    deckt_ab: Nicht ausgeglichene negative Einkünfte, die nicht nach Absatz 1 abgezogen worden sind
    quelle: § 10d Abs. 2 i.V.m. Abs. 4 EStG
    beschreibung: verlustvortrag_bestand ist der zum Schluss des Vorjahres gesondert festgestellte verbleibende Verlustvortrag (Abs 4) - kommt als State-Input aus der § 2/VZ-Integration; die Fortschreibung selbst ist nicht Gegenstand dieser Regel. Bestand >= 0 vorausgesetzt. Verlustruecktrag (Abs 1) = Nicht-Gegenstand (fremder VZ-Bescheid, Verfahren/State). GUELTIGKEIT 70-Prozent-Staffel - WachstumschancenG (27.03.2024), gilt VZ 2024 bis 2027; ab VZ 2028 Rueckfall auf 60 Prozent (dann VZ-parametrisieren nach K5-Muster). Aktueller VZ-Scope 2024-2026 liegt komplett im 70-Prozent-Fenster; p10d_2 rechnet bereits 70 Prozent (kein 60-auf-70-Fix noetig). Amtl. Zweitbeleg corpus/vwv/esth2025/paragraf-10d-index.txt (EStH-2025-Abdruck zeigt 70 Prozent).
  rundung: []
  signature:
    scope: VerlustvortragAbzug
    inputs:
      gesamtbetrag_einkuenfte: money
      verlustvortrag_bestand: money
      zusammenveranlagung: bool
    output: verlustabzug
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    herkunft: synthetisch
    rechenweg: 'GdE 500.000 < Sockel 1 Mio (single): cap = min(GdE 500.000, 1.000.000) = 500.000 (§ 10d Abs. 2: bis zum GdE UNBESCHRÄNKT, nicht 1 Mio pauschal). min(800.000, 500.000) = 500.000,00 (Bestand > GdE -> auf GdE gekappt, Rest vorgetragen §10d Abs.4). [Fix 2026-07-19: alt fälschlich 800.000, cap-Defekt.]'
    inputs:
      gesamtbetrag_einkuenfte: 500000
      verlustvortrag_bestand: 800000
      zusammenveranlagung: false
    expected: 500000.0
