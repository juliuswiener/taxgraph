  - quelle: sources/gesetze-im-internet/kstg_p8b_2026-07-16.txt
    zitatanker: Gewinne aus der Veräußerung eines Anteils an einer Körperschaft
    herkunft: synthetisch
    rechenweg: 'Veräußerungsgewinn 200.000 (Abs. 2, KEINE Streubesitz-Ausnahme): ausser_ansatz = 200.000; nichtabzug = 200.000 * 5/100 = 10.000; netto = 190.000,00.'
    inputs:
      dividende_bezuege: 0
      beteiligung_prozent: 0
      veraeusserungsgewinn: 200000
    expected: 190000.0
  - quelle: sources/gesetze-im-internet/kstg_p8b_2026-07-16.txt
    zitatanker: gelten 5 Prozent als Ausgaben, die nicht als Betriebsausgaben abgezogen werden dürfen
    herkunft: synthetisch
    rechenweg: 'Kombi Schachtel-Div 100.000 + Veräußerung 200.000: ausser_ansatz = 300.000; nichtabzug = 300.000 * 5/100 = 15.000; netto = 285.000,00.'
    inputs:
      dividende_bezuege: 100000
      beteiligung_prozent: 25
      veraeusserungsgewinn: 200000
    expected: 285000.0
  geltungsbedingungen:
  - bedingung: dividende_bezuege_ausser_ansatz_abs1
    deckt_ab: bleiben bei der Ermittlung des Einkommens außer Ansatz
    quelle: § 8b Abs. 1 Satz 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8b_2026-07-16.txt
    beschreibung: 'Kern-Scope: Bezuege i.S.d. § 20 Abs. 1 Nr. 1/2/9/10a EStG (Dividenden) bleiben bei der Einkommensermittlung ausser Ansatz (100 %, Abs. 1 S. 1) - materialisiert als steuerfrei_dividende (vor 5-%-Pauschale und vor Streubesitz-Ausnahme). Abs. 1 S. 2-6 (Korrespondenz, DBA-Freistellung, Dividendenscheine) = Nachtrag.'
  - bedingung: streubesitz_unter_10_prozent
    deckt_ab: wenn die Beteiligung zu Beginn des Kalenderjahres unmittelbar weniger als 10 Prozent des Grund- oder Stammkapitals betragen hat
    quelle: § 8b Abs. 4 Satz 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8b_2026-07-16.txt
    beschreibung: 'STREUBESITZ ist BEDINGUNG, kein Betrag: Beteiligung zu Beginn des Kalenderjahres unmittelbar < 10 % -> Dividende (Abs. 1) NICHT ausser Ansatz, sondern voll steuerpflichtig; zugleich keine 5-%-Pauschale (Abs. 4 S. 7). beteiligung_prozent >= 10 -> Schachtel (95 % frei). Materialisiert als Geltungsbedingung mit Verzweigung, nicht als Konstante. Mittelbare Beteiligung / Mitunternehmer-Zurechnung (Abs. 4 S. 4-5) = Nachtrag.'
  - bedingung: veraeusserung_ausser_ansatz_5_prozent
    deckt_ab: Gewinne aus der Veräußerung eines Anteils an einer Körperschaft
    quelle: § 8b Abs. 2 Satz 1 i.V.m. Abs. 3 Satz 1 KStG
    beschreibung: 'Veraeusserungsgewinn (Abs. 2) bleibt ausser Ansatz, 5 % gelten als nichtabziehbar (Abs. 3 S. 1) -> netto 95 % frei; KEINE Streubesitz-Ausnahme fuer Veraeusserungsgewinne. Gewinnminderungen/Teilwert (Abs. 3 S. 3 ff.) = Nachtrag.'
  - bedingung: fuenf_prozent_pauschale_nichtabzug
    deckt_ab: gelten 5 Prozent als Ausgaben, die nicht als Betriebsausgaben abgezogen werden dürfen
    quelle: § 8b Abs. 5 Satz 1 / Abs. 3 Satz 1 KStG
    beschreibung: '5 % der ausser Ansatz bleibenden Bezuege/Gewinne gelten pauschal als nichtabziehbare Betriebsausgaben (= faktische Minderung der Steuerbefreiung auf 95 %). 5/100 EXAKT. Der 95-%-Netto-Effekt ist NUR die Kombination 100 % (Abs. 1/2) minus 5 % (Abs. 5/3), nie eine eigene Konstante.'
- rule_id: p9_spenden_hoechstbetrag
  norm: § 9 Abs. 1 Nr. 2 i.V.m. Abs. 2 Satz 1 KStG (Spendenabzug, Höchstbetrag 20 % Einkommen / 4 ‰ Umsätze+Löhne)
  hinweis: 'hoechstbetrag = max(einkommen_vor_spenden * 20 / 100, (umsaetze + loehne_gehaelter) * 4 / 1000). spendenabzug = min(zuwendungen, hoechstbetrag). Das "oder" in Nr. 2 (a) 20 % ODER b) 4 Promille) bedeutet den HOEHEREN der beiden Hoechstbetraege -> max. KLASSE-5: 20 % = 20/100 = 1/5 EXAKT, 4 Promille = 4/1000 = 1/250 EXAKT (NICHT 0,2 / 0,004 vorrunden); Division durch 100 bzw. 1000 in decimal, Cent-Schnitt ZULETZT. einkommen_vor_spenden = "Einkommen im Sinne dieser Vorschrift" (Abs. 2 S. 1): das Einkommen VOR Abzug der Zuwendungen nach Abs. 1 Nr. 2 UND vor dem Verlustabzug nach § 10d EStG -> INPUT (nicht hier gerechnet). VORTRAG ueberschiessender Zuwendungen (Nr. 2 S. 9 i.V.m. § 10d Abs. 4 EStG) = Nachtrag, NICHT hier. Nr. 1 (KGaA-Gewinnanteil an persoenlich haftende Gesellschafter), Sachzuwendungen/Wertermittlung (Abs. 2 S. 2-3), Mitgliedsbeitrags-Ausschluesse (Nr. 2 S. 7-8) = Nachtrag. FORMALISIERUNG: EINE unbedingte Definition mit min/max (spendenabzug equals ... min ... max ...), KEINE bedingten exceptions/Fallunterscheidungen.'
  quellen:
  - typ: gesetz
    label: § 9 Abs. 1 Nr. 2 KStG (Höchstbetrag 20 % Einkommen / 4 ‰ Umsätze+Löhne)
    datei: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    zitatanker: bis zur Höhe von insgesamt a) 20 Prozent des Einkommens oder b) 4 Promille der Summe der gesamten Umsätze und der im Kalenderjahr aufgewendeten Löhne und Gehälter
    auszug: 'vorbehaltlich des § 8 Absatz 3 Zuwendungen (Spenden und Mitgliedsbeiträge) zur Förderung steuerbegünstigter Zwecke im Sinne der §§ 52 bis 54 der Abgabenordnung bis zur Höhe von insgesamt a) 20 Prozent des Einkommens oder b) 4 Promille der Summe der gesamten Umsätze und der im Kalenderjahr aufgewendeten Löhne und Gehälter.'
  - typ: gesetz
    label: § 9 Abs. 2 Satz 1 KStG (Einkommen vor Spenden und vor Verlustabzug)
    datei: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    zitatanker: Als Einkommen im Sinne dieser Vorschrift gilt das Einkommen vor Abzug der in Absatz 1 Nr. 2 bezeichneten Zuwendungen und vor dem Verlustabzug nach § 10d
    auszug: Als Einkommen im Sinne dieser Vorschrift gilt das Einkommen vor Abzug der in Absatz 1 Nr. 2 bezeichneten Zuwendungen und vor dem Verlustabzug nach § 10d des Einkommensteuergesetzes.
  signature:
    scope: SpendenHoechstbetrag
    inputs:
      zuwendungen: money
      einkommen_vor_spenden: money
      umsaetze: money
      loehne_gehaelter: money
    output: spendenabzug
  raster:
  - zuwendungen: 300000
    einkommen_vor_spenden: 1000000
    umsaetze: 500000
    loehne_gehaelter: 300000
  - zuwendungen: 300000
    einkommen_vor_spenden: 100000
    umsaetze: 50000000
    loehne_gehaelter: 10000000
  - zuwendungen: 50000
    einkommen_vor_spenden: 1000000
    umsaetze: 500000
    loehne_gehaelter: 300000
  test_seed:
  - quelle: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    zitatanker: bis zur Höhe von insgesamt a) 20 Prozent des Einkommens oder b) 4 Promille der Summe der gesamten Umsätze und der im Kalenderjahr aufgewendeten Löhne und Gehälter
    herkunft: synthetisch
    rechenweg: '20-%-Grenze bindet: hoechst = max(1.000.000 * 20/100 = 200.000; (500.000+300.000) * 4/1000 = 3.200) = 200.000. min(300.000, 200.000) = 200.000,00.'
    inputs:
      zuwendungen: 300000
      einkommen_vor_spenden: 1000000
      umsaetze: 500000
      loehne_gehaelter: 300000
    expected: 200000.0
  - quelle: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    zitatanker: bis zur Höhe von insgesamt a) 20 Prozent des Einkommens oder b) 4 Promille der Summe der gesamten Umsätze und der im Kalenderjahr aufgewendeten Löhne und Gehälter
    herkunft: synthetisch
    rechenweg: '4-Promille-Grenze bindet (hoher Umsatz, niedriges Einkommen): hoechst = max(100.000 * 20/100 = 20.000; (50.000.000+10.000.000) * 4/1000 = 240.000) = 240.000. min(300.000, 240.000) = 240.000,00.'
    inputs:
      zuwendungen: 300000
      einkommen_vor_spenden: 100000
      umsaetze: 50000000
      loehne_gehaelter: 10000000
    expected: 240000.0
  - quelle: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    zitatanker: Als Einkommen im Sinne dieser Vorschrift gilt das Einkommen vor Abzug der in Absatz 1 Nr. 2 bezeichneten Zuwendungen und vor dem Verlustabzug nach § 10d
    herkunft: synthetisch
    rechenweg: 'Zuwendungen unter Hoechstbetrag: hoechst = max(200.000; 3.200) = 200.000. min(50.000, 200.000) = 50.000,00 (voller Spendenabzug).'
    inputs:
      zuwendungen: 50000
      einkommen_vor_spenden: 1000000
      umsaetze: 500000
      loehne_gehaelter: 300000
    expected: 50000.0
  geltungsbedingungen:
  - bedingung: hoechstbetrag_20prozent_oder_4promille
    deckt_ab: bis zur Höhe von insgesamt a) 20 Prozent des Einkommens oder b) 4 Promille der Summe der gesamten Umsätze und der im Kalenderjahr aufgewendeten Löhne und Gehälter
    quelle: § 9 Abs. 1 Nr. 2 KStG
    datei: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    beschreibung: 'Hoechstbetrag = der HOEHERE aus 20 % des Einkommens (Buchst. a) und 4 Promille der Summe aus Umsaetzen + Loehnen/Gehaeltern (Buchst. b); "oder" = max. Spendenabzug = min(Zuwendungen, Hoechstbetrag). 20/100 und 4/1000 EXAKT.'
  - bedingung: einkommen_vor_spenden_und_verlustabzug
    deckt_ab: Als Einkommen im Sinne dieser Vorschrift gilt das Einkommen vor Abzug der in Absatz 1 Nr. 2 bezeichneten Zuwendungen und vor dem Verlustabzug nach § 10d
    quelle: § 9 Abs. 2 Satz 1 KStG
    beschreibung: 'einkommen_vor_spenden = das "Einkommen im Sinne dieser Vorschrift" (Abs. 2 S. 1): Einkommen VOR Spendenabzug (Nr. 2) UND vor Verlustabzug § 10d EStG -> Bemessungsbasis fuer die 20-%-Grenze, kommt als INPUT aus der § 8-Kette (nicht hier gerechnet).'
  - bedingung: rechtsform_kapitalgesellschaft
    deckt_ab: bis zur Höhe von insgesamt a) 20 Prozent des Einkommens oder b) 4 Promille der Summe der gesamten Umsätze und der im Kalenderjahr aufgewendeten Löhne und Gehälter
    quelle: § 1 Abs. 1 Nr. 1 i.V.m. § 9 KStG
    datei: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    beschreibung: 'rechtsform = Kapitalgesellschaft (§ 1 Abs. 1 Nr. 1); Spendenabzug der KapGes. Abgrenzung gegen PersGes-Kern (C24, § 15 EStG) - keine Doppel-Feuerung. Nr. 1 (KGaA-Gewinnanteil) betrifft nur KGaA, hier Standard-KapGes.'
  - bedingung: zuwendungen_steuerbeguenstigte_zwecke
    deckt_ab: vorbehaltlich des § 8 Absatz 3 Zuwendungen (Spenden und Mitgliedsbeiträge) zur Förderung steuerbegünstigter Zwecke im Sinne der §§ 52 bis 54 der Abgabenordnung
    quelle: § 9 Abs. 1 Nr. 2 KStG
    datei: sources/gesetze-im-internet/kstg_p9_2026-07-16.txt
    beschreibung: 'Input-Qualifikation: zuwendungen sind NUR die abziehbaren Zuwendungen (Spenden/Mitgliedsbeitraege) zur Foerderung steuerbeguenstigter Zwecke i.S.d. §§ 52-54 AO, an qualifizierte Empfaenger (Nr. 2 S. 2-6: jur. Person oeff. Rechts / § 5 Abs. 1 Nr. 9 steuerbefreite Koerperschaft / EU-/EWR-Empfaenger + Amtshilfe). ZUGLEICH: "vorbehaltlich des § 8 Absatz 3" = vGA-Vorrang - eine als vGA zu wertende Zuwendung ist KEINE abziehbare Spende (mindert das Einkommen nicht, § 8 Abs. 3 S. 2). Beides Sachverhalts-Vorfrage: der Input-Betrag ist bereits der qualifizierte, nicht-vGA Zuwendungsbetrag. Mitgliedsbeitrags-Ausschluesse (Nr. 2 S. 7-8: Sport/Freizeit/Heimat) = Nachtrag.'
- rule_id: p10_nichtabziehbar_addback
  norm: § 10 Nr. 2 und Nr. 3 KStG (nichtabziehbare Aufwendungen — Personensteuern + Geldstrafen, Hinzurechnung)
  hinweis: 'nichtabziehbare_aufwendungen = personensteuern + geldstrafen. § 10 Nr. 2: die Steuern vom Einkommen und sonstige Personensteuern (sowie USt auf Entnahmen/vGA + darauf entfallende Nebenleistungen) sind NICHTABZIEHBAR -> soweit sie den Steuerbilanzgewinn gemindert haben, dem Einkommen wieder HINZURECHNEN (Add-back). Nr. 3: in einem Strafverfahren festgesetzte Geldstrafen + strafaehnliche Rechtsfolgen vermoegensrechtlicher Art NICHTABZIEHBAR -> Add-back. Beide sind INPUT-Betraege (Sachverhalt, bereits als nichtabziehbar qualifiziert), reine Summe: money + money, EXAKT, keine Rundung, keine Prozente. Nr. 1 (satzungsmaessige Zweck-Aufwendungen; § 9 Abs. 1 Nr. 2 bleibt unberuehrt) + Nr. 4 (die HAELFTE der Aufsichtsrats-/Verwaltungsratsverguetungen - eigene Halbierung, /2) = Nachtrag, NICHT hier. FORMALISIERUNG: EINE unbedingte Definition (nichtabziehbare_aufwendungen equals personensteuern + geldstrafen), KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 10 Nr. 2 KStG (Steuern vom Einkommen / Personensteuern nichtabziehbar)
    datei: sources/gesetze-im-internet/kstg_p10_2026-07-16.txt
    zitatanker: die Steuern vom Einkommen und sonstige Personensteuern
    auszug: die Steuern vom Einkommen und sonstige Personensteuern sowie die Umsatzsteuer für Umsätze, die Entnahmen oder verdeckte Gewinnausschüttungen sind, und die Vorsteuerbeträge auf Aufwendungen
  - typ: gesetz
    label: § 10 Nr. 3 KStG (Geldstrafen nichtabziehbar)
    datei: sources/gesetze-im-internet/kstg_p10_2026-07-16.txt
    zitatanker: in einem Strafverfahren festgesetzte Geldstrafen
    auszug: 'in einem Strafverfahren festgesetzte Geldstrafen, sonstige Rechtsfolgen vermögensrechtlicher Art, bei denen der Strafcharakter überwiegt, und Leistungen zur Erfüllung von Auflagen oder Weisungen'
  signature:
    scope: NichtabziehbareAufwendungen
    inputs:
      personensteuern: money
      geldstrafen: money
    output: nichtabziehbare_aufwendungen
  raster:
  - personensteuern: 100000
    geldstrafen: 20000
  - personensteuern: 100000
    geldstrafen: 0
  - personensteuern: 0
    geldstrafen: 0
  test_seed:
  - quelle: sources/gesetze-im-internet/kstg_p10_2026-07-16.txt
    zitatanker: die Steuern vom Einkommen und sonstige Personensteuern
    herkunft: synthetisch
    rechenweg: 'Personensteuern 100.000 (Nr. 2) + Geldstrafe 20.000 (Nr. 3) = 120.000,00 Add-back.'
