    quelle: "§ 36 Abs. 2 Satz 1 Nr. 2 EStG"
    beschreibung: "LSt entfaellt auf veranlagte Einkuenfte, Bescheinigung (§ 45a) liegt vor. Input-Semantik."
  - bedingung: keine_weiteren_anrechnungsbetraege
