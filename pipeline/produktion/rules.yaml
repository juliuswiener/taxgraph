- rule_id: p23_3_verlusttopf
  hinweis: 'Topf-Trennung wie § 20 Abs 6 (p20_6-Praezedenz): gewinn_pvg und verlust_pvg sind beide NICHT-NEGATIVE Summen (verlust_pvg als positiver Betrag). Rechenkern: anzusetzende_einkuenfte = max(0 Euro; gewinn_pvg - verlust_pvg). Ein Netto-Verlust wird NICHT durchgereicht (S7 Hs1: Verluste nur bis zur Hoehe des gleichjaehrigen PVG-Gewinns; S7 Hs2: kein § 10d-Abzug). Der quarantaenisierte Rest (S8 Vor-/Ruecktrag) ist NICHT Gegenstand. Keine Division, keine Rundung.'
  norm: § 23 Abs. 3 S. 7 EStG (privater Veraeusserungs-Verlusttopf, gleichjaehrig)
  quellen:
  - typ: gesetz
    label: § 23 Abs. 3 S. 7 EStG (Verlustausgleich nur bis Gewinnhoehe desselben Jahres)
    datei: sources/gesetze-im-internet/estg_p23_2026-07-13.txt
    zitatanker: Verluste dürfen nur bis zur Höhe des Gewinns
    auszug: 'Verluste dürfen nur bis zur Höhe des Gewinns, den der Steuerpflichtige im gleichen Kalenderjahr aus privaten Veräußerungsgeschäften erzielt hat, ausgeglichen werden; sie dürfen nicht nach § 10d abgezogen werden.'
  geltungsbedingungen:
  - bedingung: verlust_nur_gleichjaehriger_pvg_gewinn
    deckt_ab: nur bis zur Höhe des Gewinns
    quelle: § 23 Abs. 3 S. 7 Hs. 1 EStG
    beschreibung: 'Kernmechanik: PVG-Verluste werden nur mit PVG-Gewinnen DESSELBEN Kalenderjahres verrechnet. gewinn_pvg / verlust_pvg sind die Jahressummen der positiven bzw. negativen § 23-Ergebnisse (die § 2-Integration bildet sie).'
  - bedingung: kein_ausgleich_mit_anderen_einkunftsarten
    deckt_ab: sie dürfen nicht nach § 10d abgezogen werden
    quelle: § 23 Abs. 3 S. 7 Hs. 2 EStG
    beschreibung: 'Ein PVG-Netto-Verlust mindert NICHT andere Einkuenfte (kein § 10d-Abzug, keine Verrechnung mit anderen Einkunftsarten) - Ausdruck des max(0)-Bodens: ein Netto-Verlust geht mit 0 in den GdE ein.'
  - bedingung: kein_verlustvor_ruecktrag_s8
    deckt_ab: mindern jedoch nach Maßgabe des § 10d die Einkünfte
    quelle: § 23 Abs. 3 S. 8 EStG
    beschreibung: 'S8 (Vor-/Ruecktrag des quarantaenisierten PVG-Verlusts nach § 10d-Massgabe in andere VZ, nur gegen kuenftige/vergangene PVG-Gewinne) ist Mehrjahres-State (§ 2-Integration + § 10d Abs4), hier ausgeklammert - wie § 10d Abs1 Ruecktrag Nicht-Gegenstand.'
