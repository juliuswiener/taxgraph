- rule_id: p24b_entlastungsbetrag
  norm: § 24b EStG
  norm_source: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
  struktur:
  - grundbetrag_4260
  - kindstaffel_240
  - zwoelftelung
  - praedikat_alleinstehend
  # Herkunft `abgeleitet`, kein synthetischer Fall. Das BMF-Schreiben v. 23.11.2022
  # rechnet die Zwoelftelung mit dem Grundbetrag 4.008 EUR der Jahre 2020-2022 vor;
  # sein Volltext ist zudem weder ueber esth/lsth.bundesfinanzministerium.de
  # (Bot-Sperre) noch ueber den frueheren Landes-Spiegel woertlich abrufbar. Zitiert
  # wird deshalb die Rechenmechanik dort, wo sie woertlich und eingefroren vorliegt:
  # im Gesetz selbst. Die Parameter stammen aus der geltenden Fassung (4.260 / 240).
  # Jeder Erwartungswert traegt seinen `rechenweg`; nichts ist geraten.
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "beträgt der Entlastungsbetrag im Kalenderjahr 4 260 Euro"
    herkunft: abgeleitet
    rechenweg: "Abs. 2 Satz 1: ein Kind, keine Ausfallmonate -> Grundbetrag 4.260,00 EUR."
    inputs: {alleinstehend: true, anzahl_kinder: 1, monate_ohne_voraussetzung: 0}
    expected: 4260.00
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "erhöht sich der Betrag nach Satz 1 um 240 Euro je weiterem Kind"
    herkunft: abgeleitet
    rechenweg: "Abs. 2 Satz 2: drei Kinder = Grundbetrag + 2 x 240 EUR = 4.260 + 480 = 4.740,00 EUR."
    inputs: {alleinstehend: true, anzahl_kinder: 3, monate_ohne_voraussetzung: 0}
    expected: 4740.00
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "ermäßigt sich der Entlastungsbetrag nach Absatz 2 um ein Zwölftel"
    herkunft: abgeleitet
    rechenweg: "Abs. 4: sechs volle Kalendermonate ohne Voraussetzungen -> 4.260 EUR x 6/12 = 2.130,00 EUR. Dies ist die Mechanik des BMF-Beispiels (dort 4.008 EUR x 9/12), mit den Parametern der geltenden Fassung."
    inputs: {alleinstehend: true, anzahl_kinder: 1, monate_ohne_voraussetzung: 6}
    expected: 2130.00
  signature:
    scope: Entlastungsbetrag
    inputs:
      alleinstehend: bool
      anzahl_kinder: int
      monate_ohne_voraussetzung: int
    output: entlastungsbetrag
  raster:
  - alleinstehend: true
    anzahl_kinder: 1
    monate_ohne_voraussetzung: 0
  - alleinstehend: true
    anzahl_kinder: 3
    monate_ohne_voraussetzung: 0
  - alleinstehend: true
    anzahl_kinder: 1
    monate_ohne_voraussetzung: 6
  - alleinstehend: false
    anzahl_kinder: 2
    monate_ohne_voraussetzung: 0
  exclude_rule_ids:
  - p24b_entlastungsbetrag
- rule_id: p33_3_zumutbare_belastung
  norm: § 33 Abs. 3 EStG
  # Multi-Source: der Wortlaut allein laesst beide Lesarten zu. Charge 1 zeigte,
  # dass Formalisierer A die vom BFH verworfene Auslegung waehlt, wenn nur das
  # Gesetz im Input steht. Der Leitsatz kommt als GETRENNTE, etikettierte Quelle
  # dazu - der Normtext bleibt unangetastet.
  quellen:
  - typ: gesetz
    label: "§ 33 Abs. 3 EStG"
    datei: sources/gesetze-im-internet/estg_p33_abs3_2026-07-09.txt
  - typ: rechtsprechung
    label: "BFH, Urteil v. 19.01.2017 - VI R 75/14, Leitsatz 1"
    datei: sources/bfh/bfh_vi_r_75-14_2017-01-19.txt
    ecli: "ECLI:DE:BFH:2017:U.190117.VIR75.14.0"
    zitatanker: "nur der Teil des Gesamtbetrags der Einkünfte, der den im Gesetz genannten Grenzbetrag übersteigt, mit dem jeweils höheren Prozentsatz belastet wird"
    auszug: "Abweichend von der bisherigen (durch die Rechtsprechung gebilligten) Verwaltungsauffassung, wonach sich die Höhe der zumutbaren Belastung ausschließlich nach dem höheren Prozentsatz richtet, sobald der Gesamtbetrag der Einkünfte eine der in § 33 Abs. 3 Satz 1 EStG genannten Grenzen überschreitet, ist die Regelung so zu verstehen, dass nur der Teil des Gesamtbetrags der Einkünfte, der den im Gesetz genannten Grenzbetrag übersteigt, mit dem jeweils höheren Prozentsatz belastet wird."
  norm_source: sources/gesetze-im-internet/estg_p33_abs3_2026-07-09.txt
  struktur:
  - tabellen_lookup_2d
  - gde_stufen
  - kinderzahl_stufen
  - prozent_des_gde
  test_seed:
  # BFH, Urteil v. 19.01.2017 - VI R 75/14: die stufenweise Berechnung ist im
  # Urteil vollstaendig vorgerechnet. Die Staffel 2/3/4 % gilt laut der im selben
  # Urteil zitierten Tabelle fuer "einem Kind oder zwei Kindern"; der Familienstand
  # ist fuer diese Zeile ohne Bedeutung.
  - quelle: sources/bfh/bfh_vi_r_75-14_2017-01-19.txt
    zitatanker: "zumutbare Belastung 1.408,70 \u20ac"
    inputs: {gesamtbetrag_der_einkuenfte: 51835, anzahl_kinder: 1, splitting: false}
    expected: 1408.70
  signature:
    scope: ZumutbareBelastung
    inputs:
      gesamtbetrag_der_einkuenfte: money
      anzahl_kinder: int
      splitting: bool
    output: zumutbare_belastung
  raster:
  - gesamtbetrag_der_einkuenfte: 15000
    anzahl_kinder: 0
    splitting: false
  - gesamtbetrag_der_einkuenfte: 30000
    anzahl_kinder: 0
    splitting: true
  - gesamtbetrag_der_einkuenfte: 60000
    anzahl_kinder: 1
    splitting: false
  - gesamtbetrag_der_einkuenfte: 60000
    anzahl_kinder: 3
    splitting: false
  - gesamtbetrag_der_einkuenfte: 15340
    anzahl_kinder: 0
    splitting: false
  exclude_rule_ids:
  - p33_3_zumutbare_belastung
