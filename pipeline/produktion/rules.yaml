- rule_id: p15a_3_haftungsminderung
  norm: § 15a Abs. 3 S. 3 EStG (Haftungsminderung-Gewinnhinzurechnung, 11-Jahres-Deckel)
  hinweis: 'gewinnhinzurechnung = min(max(0, haftungsminderung - geleistete_haftungsbetraege), deckel_verluste_abs1s2_11j). Wird der Haftungsbetrag iSd Abs. 1 S. 2 (erweiterte Außenhaftung) gemindert (Haftungsminderung), ist der Minderungsbetrag - vermindert um auf Grund der Haftung tatsächlich geleistete Beträge - als Gewinn hinzuzurechnen (Abs. 3 S. 3), GEDECKELT (Satz 2 sinngemäß) auf die im Wirtschaftsjahr der Haftungsminderung UND in den zehn vorangegangenen Wirtschaftsjahren nach Abs. 1 S. 2 ausgleichs-/abzugsfähig gewesenen Verluste (11-Jahres-Fenster). haftungsminderung, geleistete_haftungsbetraege und das 11-J-Aggregat kommen als Sachverhalts-/State-Inputs herein. NACHTRAG Abs. 3 S. 4 - die Folgeverrechnung der zugerechneten Beträge (sie mindern die Gewinne im Wirtschaftsjahr der Zurechnung oder in späteren Wirtschaftsjahren) ist NICHT im Formel-Scope (nur S. 3) und ist ein benannter Nachtrag (Mehrjahres-State, §10d-Muster). NACHTRAG mehrjährige Verfolgung des 11-J-Fensters ebenfalls benannter Nachtrag. ABGRENZUNG - HAFTUNGsminderung (Haftsummen-Herabsetzung), NICHT Einlageminderung (Entnahme = p15a_3_einlageminderung); getrenntes Bezugs-Fenster (Abs. 1 S. 2- statt Abs. 1 S. 1-Verluste). Cent-genau, keine Norm-Konstante im Code.'
  quellen:
  - typ: gesetz
    label: § 15a Abs. 3 S. 3 EStG (Haftungsminderung + 11-J-Deckel sinngemäß)
    datei: sources/gesetze-im-internet/estg_p15a_2026-07-14.txt
    zitatanker: ist dem Kommanditisten der Betrag der Haftungsminderung, vermindert um auf Grund der Haftung tatsächlich geleistete Beträge, als Gewinn zuzurechnen
    auszug: Wird der Haftungsbetrag im Sinne des Absatzes 1 Satz 2 gemindert (Haftungsminderung) und sind im Wirtschaftsjahr der Haftungsminderung und den zehn vorangegangenen Wirtschaftsjahren Verluste nach Absatz 1 Satz 2 ausgleichs- oder abzugsfähig gewesen, so ist dem Kommanditisten der Betrag der Haftungsminderung, vermindert um auf Grund der Haftung tatsächlich geleistete Beträge, als Gewinn zuzurechnen; Satz 2 gilt sinngemäß.
  signature:
    scope: Haftungsminderung
    inputs:
      haftungsminderung: money
      geleistete_haftungsbetraege: money
      deckel_verluste_abs1s2_11j: money
    output: gewinnhinzurechnung
