- rule_id: p7_2a_ekfz_75
  norm: § 7 Abs. 2a EStG (E-Kfz-Sonderabschreibung, feste %-Staffel)
  hinweis: 'jahres_afa = anschaffungskosten * prozent_jahr / 100. Für Elektrofahrzeuge (§ 9 Abs. 2 KraftStG) im Anlagevermögen, Anschaffung 30.6.2025-1.1.2028, abweichend von Abs. 1/2: FESTE Beträge in Prozent der Anschaffungskosten (NICHT Restbuchwert). prozent_jahr aus der Jahr-nach-Anschaffung-Staffel-Kohorte (params): Jahr 0=75, +1=10, +2=5, +3=5, +4=3, +5=2 (Summe 100%). KLASSE-5: /100-Encoding, Cent-Schnitt zuletzt. Keine Norm-Konstante im Code (Staffel-Wert = Input).'
  quellen:
  - typ: gesetz
    label: § 7 Abs. 2a S. 1 EStG (E-Kfz-Staffel 75/10/5/5/3/2)
    datei: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: 75 Prozent, im ersten darauf folgenden Jahr zehn Prozent, im zweiten und dritten darauf folgenden Jahr jeweils fünf Prozent
    auszug: 'Bei Elektrofahrzeugen nach § 9 Absatz 2 des Kraftfahrzeugsteuergesetzes, die zum Anlagevermögen gehören und nach dem 30. Juni 2025 und vor dem 1. Januar 2028 angeschafft worden sind, können abweichend von Absatz 1 oder 2 als Absetzung für Abnutzung die folgenden Beträge in Prozent der Anschaffungskosten abgezogen werden: im Jahr der Anschaffung 75 Prozent, im ersten darauf folgenden Jahr zehn Prozent, im zweiten und dritten darauf folgenden Jahr jeweils fünf Prozent, im vierten darauf folgenden Jahr drei Prozent und im fünften darauf folgenden Jahr zwei Prozent'
