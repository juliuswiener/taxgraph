- rule_id: p20_9_sparer_pauschbetrag
  norm: § 20 Abs. 9 EStG (Sparer-Pauschbetrag 1.000/2.000)
  quellen:
  - typ: gesetz
    label: § 20 Abs. 9 EStG (Sparer-Pauschbetrag)
    datei: sources/gesetze-im-internet/estg_p20_2026-07-13.txt
    zitatanker: als Werbungskosten ein Betrag von 1 000 Euro abzuziehen
    auszug: Bei der Ermittlung der Einkünfte aus Kapitalvermögen ist als Werbungskosten ein Betrag von 1 000 Euro abzuziehen (Sparer-Pauschbetrag); der Abzug der tatsächlichen Werbungskosten ist ausgeschlossen. 2 Ehegatten, die zusammen veranlagt werden, wird ein gemeinsamer Sparer-Pauschbetrag von 2 000 Euro gewährt.
  geltungsbedingungen:
  - bedingung: sparer_pb_1000_2000_konstante
    deckt_ab: als Werbungskosten ein Betrag von 1 000 Euro abzuziehen
    quelle: § 20 Abs. 9 EStG
    beschreibung: Sparer-Pauschbetrag = Norm-Konstante 1.000 (einzeln) bzw. 2.000 (Zusammenveranlagung), Werte aus dem Wortlaut (Konstanten-Doktrin, nicht Input). einkuenfte_nach_sparer_pb = max(0, kapitalertraege - sparer_pb). zusammenveranlagung ist bool-INPUT (Sachverhalts-Verzweigung, p32_6-Muster). Der Abzug der tatsaechlichen WK ist ausgeschlossen (Pauschbetrag ersetzt WK).
