- rule_id: p23_freigrenze
  hinweis: 'steuerpflichtiger_gewinn = wenn gesamtgewinn >= 1000 dann gesamtgewinn sonst 0. Das 1000 ist eine FREIGRENZE, KEIN Freibetrag: bei gesamtgewinn >= 1000 ist der VOLLE Gewinn steuerpflichtig (NICHT gesamtgewinn - 1000). Unter 1000 ist der ganze Gewinn steuerfrei. Schwelle 1000 so, dass "weniger als 1000" (< 1000) steuerfrei ist -> >= 1000 voll. Gilt nur fuer positiven Gesamtgewinn (gesamtgewinn = aggregierte Summe aller § 23-Gewinne des KJ, § 2-Integration).'
  norm: § 23 Abs. 3 S. 5 EStG (1000-Euro-Freigrenze private Veraeusserungsgeschaefte)
  quellen:
  - typ: gesetz
    label: § 23 Abs. 3 S. 5 EStG (Freigrenze 1000)
    datei: sources/gesetze-im-internet/estg_p23_2026-07-13.txt
    zitatanker: weniger als 1 000 Euro betragen hat
    auszug: Gewinne bleiben steuerfrei, wenn der aus den privaten Veräußerungsgeschäften erzielte Gesamtgewinn im Kalenderjahr weniger als 1 000 Euro betragen hat.
  geltungsbedingungen:
  - bedingung: gesamtgewinn_nicht_negativ
    deckt_ab: Verluste dürfen nur bis zur Höhe des Gewinns, den der Steuerpflichtige im gleichen Kalenderjahr aus privaten Veräußerungsgeschäften erzielt hat, ausgeglichen werden
    quelle: § 23 Abs. 3 S. 7-8 EStG
    beschreibung: 'Freigrenze gilt fuer positiven Gesamtgewinn. Verluste: S7 (Ausgleich nur bis zur Hoehe der § 23-Gewinne DESSELBEN Kalenderjahres) = BENANNTER NACHTRAG, formalisierbar (p20_6-Praezedenz Topf-Trennung); S8 (Vor-/Ruecktrag nach § 10d-Massgabe) = Nicht-Gegenstand/Mehrjahres-State.'
  rundung: []
  signature:
    scope: VeraeusserungFreigrenze
    inputs:
      gesamtgewinn: money
    output: steuerpflichtiger_gewinn
  test_seed:
