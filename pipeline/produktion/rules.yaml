- rule_id: p9_1_kuerzung_grundbesitz_ez2024
  norm: § 9 Nr. 1 Satz 1 GewStG i.d.F. bis EZ 2024 (einfache Grundbesitzkuerzung, 1,2 % Einheitswert)
  hinweis: 'kuerzung_grundbesitz = einheitswert_grundbesitz * 0,012 (= 1,2 Prozent). ALTFASSUNG bis EZ 2024; JStG 2024 fasst Satz 1 ab EZ 2025 neu (tatsaechliche Grundsteuer) -> eigene Regel G3b. 1,2 % = 0,012 EXAKT (terminierend), money*decimal, Cent-Schnitt zuletzt. Der 140-%-Ansatz des Einheitswerts (§ 121a BewG) ist benannter Nachtrag (einheitswert_grundbesitz traegt bereits den massgeblichen Wert). NUR Satz 1 (einfache Kuerzung); erweiterte Kuerzung Satz 2-3 = G3b/Nachtrag. HINWEIS Synopse-Freeze: die Quelle traegt alte UND neue Fassung nebeneinander (buzer-Synopse) -> der Judge misst PLANBAR gegen die Neufassung (faithful=False erwartbar, Altfassungs-Aenderungsbefehl-Muster); Code bildet die EZ-2024-Altfassung ab.'
  quellen:
  - typ: gesetz
    label: § 9 Nr. 1 Satz 1 GewStG a.F. (bis EZ 2024, 1,2 % Einheitswert)
    datei: sources/bgbl/gewstg_p9_altfassung_ez2024.txt
    zitatanker: 1,2 Prozent des Einheitswerts des zum Betriebsvermögen des Unternehmers gehörenden
    auszug: 1,2 Prozent des Einheitswerts des zum Betriebsvermögen des Unternehmers gehörenden und nicht von der Grundsteuer befreiten Grundbesitzes
  signature:
    scope: KuerzungGrundbesitzEz2024
    inputs:
      einheitswert_grundbesitz: money
    output: kuerzung_grundbesitz
  raster:
