- rule_id: p10a_gewerbeverlust
  norm: § 10a S. 1-2 GewStG (Gewerbeverlust, 1-Mio-Sockel + 60 %)
  hinweis: 'gewerbeverlust_abzug = min(fehlbetrag_bestand, 1000000 + (60 / 100) * max(0, massgebender_gewerbeertrag - 1000000)). Mindestbesteuerung wie § 10d Abs. 2 EStG (p10d_2), ABER: (a) 60 PROZENT statt 70 - die WtChancenG-Anhebung auf 70 gilt NUR EStG/KStG, NICHT die Gewerbesteuer (§ 10a unveraendert); (b) KEIN Zusammenveranlagungs-Sockel (2 Mio) - GewSt ist betriebsbezogen, immer 1-Mio-Sockel. 60 = PROZENTWERT -> /100 in decimal, Cent-Schnitt zuletzt. fehlbetrag_bestand = zum Schluss des Vorjahres gesondert festgestellter vortragsfaehiger Fehlbetrag (S. 6-7) = State-Input; die EZ-Fortschreibung selbst gehoert NICHT in diese Regel (Backlog-Grenze, wie p10d_2). Mitunternehmer-Zurechnung S. 4-5, § 8c/8d KStG S. 9-12 = Nachtrag. Bestand >= 0.'
  quellen:
  - typ: gesetz
    label: § 10a S. 1-2 GewStG (1-Mio-Sockel + 60 %)
    datei: sources/gesetze-im-internet/gewstg_p10a_2026-07-16.txt
    zitatanker: bis zu 60 Prozent
    auszug: Der maßgebende Gewerbeertrag wird bis zu einem Betrag in Höhe von 1 Million Euro um die Fehlbeträge gekürzt, die sich bei der Ermittlung des maßgebenden Gewerbeertrags für die vorangegangenen Erhebungszeiträume nach den Vorschriften der §§ 7 bis 10 ergeben haben, soweit die Fehlbeträge nicht bei der Ermittlung des Gewerbeertrags für die vorangegangenen Erhebungszeiträume berücksichtigt worden sind. 2 Der 1 Million Euro übersteigende maßgebende Gewerbeertrag ist bis zu 60 Prozent um nach Satz 1 nicht berücksichtigte Fehlbeträge der vorangegangenen Erhebungszeiträume zu kürzen.
  signature:
    scope: GewerbeverlustAbzug
    inputs:
      massgebender_gewerbeertrag: money
      fehlbetrag_bestand: money
    output: gewerbeverlust_abzug
  raster:
  - massgebender_gewerbeertrag: 500000
    fehlbetrag_bestand: 800000
  - massgebender_gewerbeertrag: 3000000
    fehlbetrag_bestand: 5000000
  - massgebender_gewerbeertrag: 500000
    fehlbetrag_bestand: 0
  test_seed:
  - quelle: sources/gesetze-im-internet/gewstg_p10a_2026-07-16.txt
