    zitatanker: Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen
    herkunft: synthetisch
    rechenweg: 'WAECHTER VERLUST (Negativ-Durchreichung): Einnahmen 8.000 - (AfA 6.000 + Zinsen 4.000) = 8.000 - 10.000 = -2.000,00. KEIN max(0)-Boden - Verlust wird durchgereicht.'
    inputs: {einnahmen: 8000, gebaeude_afa: 6000, schuldzinsen: 4000, erhaltungsaufwand: 0, sonstige_werbungskosten: 0}
    expected: -2000.0
  - quelle: sources/gesetze-im-internet/estg_p21_2026-07-13.txt
