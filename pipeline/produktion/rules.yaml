- rule_id: p6a_pension_hoechstbetrag
  norm: § 6a Abs. 3 S. 1 EStG (Pensionsrückstellung Höchstbetrag = Teilwert-Deckel)
  hinweis: 'pensionsrueckstellung = min(bilanzieller_ansatz, teilwert_pensionsverpflichtung) - NICHTS SONST. Abs. 3 S. 1 ''darf höchstens mit dem Teilwert ... angesetzt werden'' = reiner Höchstbetrags-Deckel (min). Die jahresbezogene Zuführungsgrenze/Nachholverbot (Abs. 4 S. 1) ist NICHT modelliert = benannter Nachtrag. teilwert_pensionsverpflichtung ist ein FERTIG berechneter Input (extern versicherungsmathematisch, Abs. 3). Im Catala-Code KEINE interne Zins-/Rechnungszinsfuß-Variable, KEINE 0.06-Konstante, KEINE Teilwert-Berechnung - der 6-%-Zinsfuß ist NICHT Teil der Rechnung, er steht ausschließlich in der Geltungsbedingung als Herkunft des Inputs (Konstanten-Doktrin: nicht Signatur, nicht Code). Cent-genau.'
  quellen:
  - typ: gesetz
    label: § 6a Abs. 3 S. 1 EStG (Höchstbetrag = Teilwert)
    datei: sources/gesetze-im-internet/estg_p6a_2026-07-14.txt
    zitatanker: darf höchstens mit dem Teilwert der Pensionsverpflichtung angesetzt werden
    auszug: Eine Pensionsrückstellung darf höchstens mit dem Teilwert der Pensionsverpflichtung angesetzt werden
  - typ: gesetz
    label: '§ 6a Abs. 3 S. 3 EStG (Teilwert: 6 % + Versicherungsmathematik)'
    datei: sources/gesetze-im-internet/estg_p6a_2026-07-14.txt
    zitatanker: ein Rechnungszinsfuß von 6 Prozent und die anerkannten Regeln der Versicherungsmathematik
    auszug: Bei der Berechnung des Teilwerts der Pensionsverpflichtung sind ein Rechnungszinsfuß von 6 Prozent und die anerkannten Regeln der Versicherungsmathematik anzuwenden
  signature:
    scope: PensionHoechstbetrag
    inputs:
      bilanzieller_ansatz: money
      teilwert_pensionsverpflichtung: money
    output: pensionsrueckstellung
  raster:
  - bilanzieller_ansatz: 100000
    teilwert_pensionsverpflichtung: 90000
  - bilanzieller_ansatz: 80000
    teilwert_pensionsverpflichtung: 90000
