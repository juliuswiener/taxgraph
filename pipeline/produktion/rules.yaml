- rule_id: p21_vermietung_einkuenfte
  # hinweis-Kanal: Vermietungsverluste sind mit anderen Einkunftsarten verrechenbar (§2 Abs3),
  # anders als KAP (Topf-Boden) -> das Ergebnis KANN NEGATIV sein, KEIN max(0)-Boden.
  hinweis: 'vermietung_einkuenfte = einnahmen - (gebaeude_afa + schuldzinsen + erhaltungsaufwand + sonstige_werbungskosten). Das Ergebnis KANN NEGATIV sein (Vermietungsverlust) - KEIN max(0)-Boden, kein Null-Abschneiden: das Vorzeichen wird durchgereicht (§ 2 Abs. 3: Vermietungsverluste sind mit anderen Einkunftsarten verrechenbar, anders als Kapitalvermoegen).'
  norm: § 21 i.V.m. § 2 Abs. 2 Nr. 2 EStG (Einkuenfte aus Vermietung und Verpachtung)
  quellen:
  - typ: gesetz
    label: § 21 Abs. 1 EStG (Einkuenfte aus Vermietung und Verpachtung)
    datei: sources/gesetze-im-internet/estg_p21_2026-07-13.txt
    zitatanker: Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen
    auszug: 'Einkünfte aus Vermietung und Verpachtung sind 1. Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen'
  geltungsbedingungen:
  - bedingung: einkuenfte_ueberschuss_einnahmen_ueber_wk
    deckt_ab: Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen
    quelle: § 21 i.V.m. § 2 Abs. 2 Nr. 2, § 9 EStG
    beschreibung: 'Einkuenfte = Ueberschuss der Einnahmen ueber die Werbungskosten (§ 2 Abs. 2 Nr. 2). WK-Summe = gebaeude_afa + schuldzinsen + erhaltungsaufwand + sonstige_werbungskosten (in der § 2-Integration aggregiert, keine eigene Rechtsfolge). Das Ergebnis kann NEGATIV sein (Verlust, § 2 Abs. 3 verrechenbar) - kein max(0)-Boden, anders als KAP.'
  rundung: []
  signature:
    scope: VermietungEinkuenfte
    inputs:
      einnahmen: money
      gebaeude_afa: money
      schuldzinsen: money
      erhaltungsaufwand: money
      sonstige_werbungskosten: money
    output: vermietung_einkuenfte
  test_seed:
