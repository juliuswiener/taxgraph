  - bedingung: kuerzung_1_2_prozent_einheitswert
    deckt_ab: 1,2 Prozent des Einheitswerts des zum Betriebsvermögen des Unternehmers gehörenden
    quelle: § 9 Nr. 1 Satz 1 GewStG a.F.
    beschreibung: 'EZ-2024-Altfassung: Kuerzung = 1,2 % (= 0,012) des Einheitswerts des Betriebsgrundbesitzes. Ab EZ 2025 ersetzt durch tatsaechliche Grundsteuer (JStG 2024, G3b). 140-%-Ansatz (§ 121a BewG) = Nachtrag.'
- rule_id: p9_kuerzungen_ez2025
  norm: § 9 Nr. 1 S. 1 (n.F.) + Nr. 2 + Nr. 2a GewStG (Kuerzungen ab EZ 2025)
  hinweis: 'kuerzung_gesamt = grundsteuer_betriebsausgabe + gewinnanteile_mitunternehmer + schachteldividenden. NEUFASSUNG ab EZ 2025 (JStG 2024): Nr. 1 S. 1 = die im Erhebungszeitraum als Betriebsausgabe erfasste Grundsteuer (kein 1,2-%-Einheitswert mehr - das ist G3a/EZ 2024). Nr. 2 = Gewinnanteile aus Mitunternehmerschaft (soweit im Gewinn angesetzt). Nr. 2a = Schachteldividenden inlaendische Kapitalges. (Beteiligung >= 15 % zu Beginn EZ). money-Summe, keine Rundung, exakt. Nr. 1 S. 3 erweiterte Kuerzung (20-%-Unschaedlichkeit Grundstuecksunternehmen) = ALTERNATIVE auf Antrag, benannter Nachtrag. Schachtel-Schwelle 15 % + Aufwands-Minderung Nr. 2a S. 3 = Nachtrag.'
  quellen:
  - typ: gesetz
    label: § 9 Nr. 1 S. 1 GewStG n.F. (ab EZ 2025, tatsaechliche Grundsteuer)
    datei: sources/gesetze-im-internet/gewstg_p9_2026-07-16.txt
    zitatanker: die im Erhebungszeitraum als Betriebsausgabe erfasste Grundsteuer
    auszug: Die Summe des Gewinns und der Hinzurechnungen wird gekürzt um 1. die im Erhebungszeitraum als Betriebsausgabe erfasste Grundsteuer für zum Betriebsvermögen des Unternehmers gehörenden Grundbesitz.
  - typ: gesetz
    label: § 9 Nr. 2 GewStG (Gewinnanteile Mitunternehmerschaft) + Nr. 2a (Schachtel >= 15 %)
    datei: sources/gesetze-im-internet/gewstg_p9_2026-07-16.txt
    zitatanker: die Gewinne aus Anteilen an einer nicht steuerbefreiten inländischen Kapitalgesellschaft
    auszug: die Gewinne aus Anteilen an einer nicht steuerbefreiten inländischen Kapitalgesellschaft im Sinne des § 2 Abs. 2, einer Kredit- oder Versicherungsanstalt des öffentlichen Rechts, einer Genossenschaften oder einer Unternehmensbeteiligungsgesellschaft im Sinne des § 3 Nr. 23, wenn die Beteiligung zu Beginn des Erhebungszeitraums mindestens 15 Prozent des Grund- oder Stammkapitals beträgt
  signature:
    scope: KuerzungenEz2025
    inputs:
      grundsteuer_betriebsausgabe: money
      gewinnanteile_mitunternehmer: money
      schachteldividenden: money
    output: kuerzung_gesamt
