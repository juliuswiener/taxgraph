- rule_id: p9_1_3_nr7_afa
  norm: § 9 Abs. 1 S. 3 Nr. 7 EStG
  # Zurueckgestellt (Julius, 2026-07-09). Zwei Gruende:
  #  1. Die 800-Euro-GWG-Grenze steht nicht in § 9, sondern folgt aus dem Verweis
  #     in Satz 2 auf § 6 Abs. 2 EStG -> Neuschnitt als Multi-Source-Task mit
  #     § 6 Abs. 2 als zweiter Quelle (eingefroren:
  #     sources/gesetze-im-internet/estg_p6_abs2_2026-07-09.txt).
  #  2. Der Anschaffungsmonat fehlt in der Signatur. Die AfA ist im
  #     Anschaffungsjahr zeitanteilig; ohne den Monat braeuchte die Regel eine
  #     stille Volljahr-Annahme - genau das, was der Round-Trip-Judge zu Recht
  #     als stille_zusatzannahme meldet.
  # Charge 2, gemeinsam mit Nr. 6.
  status: zuschnitt_offen
  norm_source: sources/gesetze-im-internet/estg_p9_abs1nr7_2026-07-09.txt
  struktur:
  - verweisregel
  - gwg_grenze_ueber_p6
  test_seed: none
  signature:
    scope: Absetzungfuerabnutzung
    inputs:
      anschaffungskosten: money
      nutzungsdauer_jahre: int
    output: afa_jahresbetrag
  raster:
  - anschaffungskosten: 1200
    nutzungsdauer_jahre: 3
  - anschaffungskosten: 800
    nutzungsdauer_jahre: 1
  - anschaffungskosten: 5000
    nutzungsdauer_jahre: 5
  exclude_rule_ids:
  - p9_1_3_nr7_afa
- rule_id: p9_6_erstausbildung_abgrenzung
  norm: § 9 Abs. 6 EStG
  # Erstbefuellung der Registry (Julius, 2026-07-11). Muster Rechtspraedikat wie
  # p24b/p33: erstausbildung_abgeschlossen traegt die Legaldefinition.
  geltungsbedingungen:
  - bedingung: erstausbildung_nach_legaldefinition
    deckt_ab: "geordnete Ausbildung mit einer Mindestdauer"
    quelle: "§ 9 Abs. 6 Saetze 2 bis 5 EStG"
    beschreibung: "Input-Semantik: erstausbildung_abgeschlossen entspricht der Legaldefinition (geordnete Ausbildung >= 12 Monate mit Abschlusspruefung bzw. gleichgestellte Faelle)."
  norm_source: sources/gesetze-im-internet/estg_p9_abs6_2026-07-09.txt
  struktur:
  - praedikat_definition
  - mindestdauer_12_monate
  - abgrenzung
  # Absegnung Julius 2026-07-09 (reports/review/2026-07-09-synthetische-testfaelle.md), Antwort 1.
  test_seed:
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "Aufwendungen des Steuerpflichtigen für seine Berufsausbildung oder für sein Studium sind nur dann Werbungskosten"
    herkunft: synthetisch
    rechenweg: "Erstausbildung abgeschlossen -> kein Abzugsverbot; 3.000 EUR voll abziehbar."
    inputs: {erstausbildung_abgeschlossen: true, im_dienstverhaeltnis: false, aufwendungen: 3000}
    expected: 3000.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "wenn der Steuerpflichtige zuvor bereits eine Erstausbildung"
    herkunft: synthetisch
    rechenweg: "Erstausbildung nicht abgeschlossen, kein Dienstverhaeltnis -> Abzugsverbot, 0,00 EUR (Abzug nur als Sonderausgabe, § 10 Abs. 1 Nr. 7)."
    inputs: {erstausbildung_abgeschlossen: false, im_dienstverhaeltnis: false, aufwendungen: 3000}
    expected: 0.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "im Rahmen eines Dienstverhältnisses stattfindet"
    herkunft: synthetisch
    rechenweg: "Ausbildungsdienstverhaeltnis -> Abzugsverbot greift nicht; 3.000 EUR voll abziehbar."
    inputs: {erstausbildung_abgeschlossen: false, im_dienstverhaeltnis: true, aufwendungen: 3000}
    expected: 3000.00
  signature:
    scope: Erstausbildung
    inputs:
      erstausbildung_abgeschlossen: bool
      im_dienstverhaeltnis: bool
      aufwendungen: money
    output: abziehbare_werbungskosten
  raster:
  - erstausbildung_abgeschlossen: true
    im_dienstverhaeltnis: false
    aufwendungen: 3000
  - erstausbildung_abgeschlossen: false
    im_dienstverhaeltnis: false
    aufwendungen: 3000
  - erstausbildung_abgeschlossen: false
    im_dienstverhaeltnis: true
    aufwendungen: 3000
  exclude_rule_ids:
  - p9_6_erstausbildung_abgrenzung
- rule_id: p10_1_7_berufsausbildung
  norm: § 10 Abs. 1 Nr. 7 EStG
  norm_source: sources/gesetze-im-internet/estg_p10_abs1nr7_2026-07-09.txt
  struktur:
  - jahres_cap_6000
  - verdopplung_ehegatten
  - verweiskette
  # Geltungsbedingung (Julius, 2026-07-09): Satz 2 gewaehrt den Hoechstbetrag jedem
  # Ehegatten einzeln. Die Signatur bildet EINE Person ab; die
  # Zusammenveranlagungs-Mechanik kommt bei der § 2-Integration.
  geltungsbedingungen:
  - bedingung: hoechstbetrag_gilt_je_person
    deckt_ab: "Bei Ehegatten, die die Voraussetzungen des § 26 Absatz 1 Satz 1 erfüllen, gilt Satz 1 für jeden Ehegatten"
    quelle: "§ 10 Abs. 1 Nr. 7 Satz 2 EStG"
    beschreibung: "Der Scope berechnet den Hoechstbetrag fuer eine Person. Bei Zusammenveranlagung steht er jedem Ehegatten einzeln zu."
  # Absegnung Julius 2026-07-09 (reports/review/2026-07-09-synthetische-testfaelle.md), Antwort 1.
  test_seed:
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "bis zu 6 000 Euro im Kalenderjahr"
    herkunft: synthetisch
    rechenweg: "Unterhalb des Hoechstbetrags: 2.000 EUR voll abziehbar."
    inputs: {aufwendungen: 2000}
    expected: 2000.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "bis zu 6 000 Euro im Kalenderjahr"
    herkunft: synthetisch
    rechenweg: "Genau am Hoechstbetrag: 6.000 EUR voll abziehbar."
    inputs: {aufwendungen: 6000}
    expected: 6000.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "bis zu 6 000 Euro im Kalenderjahr"
    herkunft: synthetisch
    rechenweg: "Oberhalb des Hoechstbetrags: Kappung auf 6.000,00 EUR."
    inputs: {aufwendungen: 9000}
    expected: 6000.00
  signature:
    scope: Berufsausbildung
    inputs:
      aufwendungen: money
    output: abziehbare_sonderausgaben
  raster:
