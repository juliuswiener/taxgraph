  - nur_arbeitskosten
  geltungsbedingungen:
  - bedingung: rechnung_und_unbare_zahlung
    deckt_ab: eine Rechnung erhalten hat und die Zahlung auf das Konto des Erbringers der Leistung erfolgt ist
    quelle: § 35a Abs. 5 Satz 3 EStG
    beschreibung: Ohne Rechnung und unbare Zahlung entfaellt die Ermaessigung fuer Abs. 2 und 3 vollstaendig.
  - bedingung: haushalt_in_eu_ewr
    deckt_ab: Europäischen Union oder dem Europäischen Wirtschaftsraum liegenden Haushalt
    quelle: § 35a Abs. 4 Satz 1 EStG
    beschreibung: Die Ermaessigung setzt einen Haushalt in der EU oder im EWR voraus.
  - bedingung: keine_beruecksichtigung_als_wk_sa_agb
    deckt_ab: nicht Betriebsausgaben oder Werbungskosten darstellen
    quelle: § 35a Abs. 5 Satz 1 EStG
    beschreibung: Dieselben Aufwendungen duerfen nicht schon als Betriebsausgaben, Werbungskosten, Sonderausgaben oder aussergewoehnliche Belastungen beruecksichtigt sein.
  - bedingung: handwerker_keine_oeffentliche_foerderung
    deckt_ab: nicht für öffentlich geförderte Maßnahmen
    quelle: § 35a Abs. 3 Satz 2 EStG
    beschreibung: Fuer oeffentlich gefoerderte Massnahmen (zinsverbilligte Darlehen, steuerfreie Zuschuesse) gibt es keine Ermaessigung nach Abs. 3.
  - bedingung: handwerkerbetrag_enthaelt_nur_arbeitskosten
    deckt_ab: gilt nur für Arbeitskosten
    quelle: § 35a Abs. 5 Satz 2 EStG
    beschreibung: 'Input-Semantik: der uebergebene Handwerkerbetrag enthaelt nur Arbeits-, Fahrt- und Maschinenkosten, kein Material.'
  - bedingung: dienstleistungsbetrag_enthaelt_nur_arbeitskosten
    deckt_ab: nach den Absätzen 2 und 3 gilt nur für Arbeitskosten
    quelle: § 35a Abs. 5 Satz 2 EStG
    beschreibung: 'Input-Semantik: der uebergebene Betrag fuer haushaltsnahe Dienstleistungen enthaelt nur Arbeitskosten, kein Material.'
  - bedingung: kein_gemeinsamer_haushalt_zweier_alleinstehender
    deckt_ab: Höchstbeträge nach den Absätzen 1 bis 3 insgesamt jeweils nur einmal
    quelle: § 35a Abs. 5 Satz 4 EStG
    beschreibung: Leben zwei Alleinstehende zusammen, stehen die Hoechstbetraege insgesamt nur einmal zu. Der Scope rechnet fuer einen Haushalt.
  - bedingung: antrag_gestellt
    deckt_ab:
    - auf Antrag um 20 Prozent, höchstens 510 Euro
    - auf Antrag um 20 Prozent, höchstens 4 000 Euro
    - auf Antrag um 20 Prozent der Aufwendungen des Steuerpflichtigen
    datei: sources/gesetze-im-internet/estg_p35a_2026-07-09.txt
    quelle: § 35a Abs. 1, 2 und 3 EStG
    beschreibung: Die Ermaessigung wird nur auf Antrag gewaehrt (je Absatz eigener Satz - D1-Multi-Fragment, diskriminierend statt mehrdeutigem "auf Antrag"). Ohne Antrag gaebe der Scope dennoch einen Betrag aus.
  - bedingung: minijob_ist_geringfuegige_beschaeftigung_nach_8a_sgb4
    deckt_ab: bei denen es sich um eine geringfügige Beschäftigung im Sinne des § 8a des Vierten Buches Sozialgesetzbuch handelt
    quelle: § 35a Abs. 1 EStG
    beschreibung: 'Input-Semantik: `minijob_aufwendungen` sind nur Aufwendungen fuer ein haushaltsnahes Beschaeftigungsverhaeltnis nach § 8a SGB IV.'
  - bedingung: dienstleistungen_sind_keine_handwerkerleistungen
    deckt_ab: die nicht Dienstleistungen nach Absatz 3 sind
    quelle: § 35a Abs. 2 Satz 1 EStG
    beschreibung: 'Input-Semantik: `haushaltsnahe_dienstleistungen` enthaelt keine Handwerkerleistungen; die gehoeren in den Abs.-3-Topf.'
  - bedingung: keine_pflege_oder_heimkosten
    deckt_ab:
    - für die Inanspruchnahme von Pflege- und Betreuungsleistungen
    - dass das Heim oder der Ort der dauernden Pflege in der Europäischen Union oder dem Europäischen Wirtschaftsraum liegt
    quelle: § 35a Abs. 2 Satz 2 und Abs. 4 Satz 2 EStG
    beschreibung: Pflege-, Betreuungs- und Heimkosten sind ein eigener Abzweig mit eigener Voraussetzung (Heim in EU/EWR). Der Scope modelliert sie nicht.
  - bedingung: handwerker_nur_renovierung_erhaltung_modernisierung
    deckt_ab: für Renovierungs-, Erhaltungs- und Modernisierungsmaßnahmen
    quelle: § 35a Abs. 3 Satz 1 EStG
    beschreibung: 'Input-Semantik: `handwerker_arbeitskosten` betrifft nur Renovierungs-, Erhaltungs- und Modernisierungsmassnahmen.'
