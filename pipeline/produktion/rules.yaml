- rule_id: p32d_1_abgeltung
  # hinweis-Kanal (Instructor-Freigabe 2026-07-13): Andockung wie § 31 - die tariflichen
  # Vergleichswerte kommen als Inputs, kein Selbst-Tarif. Guenstigerpruefung = min-Mechanik.
  hinweis: 'Andockung wie § 31/§ 32b: est_regulaer_mit_kap und est_regulaer_ohne_kap sind p32a-Tarifergebnisse aus der § 2-Integration, hier NICHT selbst rechnen. Rechenkern: abgeltung = (25 / 100) * kapitaleinkuenfte (Prozent in decimal, Cent-Schnitt zuletzt); guenstiger_delta = est_regulaer_mit_kap - est_regulaer_ohne_kap; kapital_steuer = min(abgeltung, guenstiger_delta). Der glatte 25-Prozent-Satz gilt (keine Kirchensteuer-Ermaessigung, das ist Scope-Grenze).'
  norm: § 32d Abs. 1, 6 EStG (25-%-Abgeltung + Guenstigerpruefung)
  quellen:
  - typ: gesetz
    label: § 32d Abs. 1 S. 1 EStG (25-%-Satz)
    datei: sources/gesetze-im-internet/estg_p32d_2026-07-13.txt
    zitatanker: beträgt 25 Prozent
    auszug: 'Die Einkommensteuer für Einkünfte aus Kapitalvermögen, die nicht unter § 20 Absatz 8 fallen, beträgt 25 Prozent.'
  - typ: gesetz
    label: § 32d Abs. 6 S. 1 EStG (Guenstigerpruefung auf Antrag)
    datei: sources/gesetze-im-internet/estg_p32d_2026-07-13.txt
    zitatanker: Auf Antrag des Steuerpflichtigen werden anstelle
    auszug: 'Auf Antrag des Steuerpflichtigen werden anstelle der Anwendung der Absätze 1, 3 und 4 die nach § 20 ermittelten Kapitaleinkünfte den Einkünften im Sinne des § 2 hinzugerechnet und der tariflichen Einkommensteuer unterworfen'
  geltungsbedingungen:
  - bedingung: tarifwerte_sind_p2_ergebnis
    deckt_ab: den Einkünften im Sinne des § 2 hinzugerechnet und der tariflichen Einkommensteuer unterworfen
    quelle: § 32d Abs. 6 i.V.m. § 2, § 32a EStG
    beschreibung: 'est_regulaer_mit_kap / est_regulaer_ohne_kap sind p32a-Tarifergebnisse (mit/ohne Hinzurechnung der Kapitaleinkuenfte), aus der § 2-Integration. Andockung wie § 31 (kein Selbst-Tarif). guenstiger_delta = Differenz = persoenliche Steuer AUF die Kapitaleinkuenfte.'
  - bedingung: guenstigerpruefung_beantragt
    deckt_ab: Auf Antrag des Steuerpflichtigen werden anstelle
    quelle: § 32d Abs. 6 S. 1 EStG
    beschreibung: 'Anwendbarkeit (p35a-antrag_gestellt-Praezedenz): die Guenstigerpruefung (min mit dem persoenlichen Tarif) greift NUR AUF ANTRAG. Ohne Antrag gilt stur die 25-%-Abgeltung, auch wenn schlechter. Die min-Mechanik ist die Rechenform bei gestelltem Antrag. Phase-5-Vorgriff: die min-Differenz ist spaeter der automatische Antrags-HINWEIS an den Nutzer (Antrag lohnt X Euro).'
  - bedingung: keine_kirchensteuer_auf_kapitalertraege
    deckt_ab: beträgt 25 Prozent
    quelle: § 32d Abs. 1 S. 1 (Umkehr S. 3)
    beschreibung: 'MVP-Linie (a): glatter 25-%-Satz. Die Kirchensteuer-Ermaessigung (§ 32d Abs. 1 S. 3, e/(4+k)-Mechanik) ist ausgeklammert - der KiSt-Fall ist Scope-Grenze (Nachtrag b), nicht still falsch gerechnet.'
  rundung: []
  signature:
    scope: KapitalAbgeltung
    inputs:
      kapitaleinkuenfte: money
      est_regulaer_mit_kap: money
      est_regulaer_ohne_kap: money
    output: kapital_steuer
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p32d_2026-07-13.txt
    zitatanker: beträgt 25 Prozent
    herkunft: synthetisch
    rechenweg: 'Abgeltung guenstiger: Kapitaleink. 10.000 -> 0,25 x 10.000 = 2.500. delta = 8.000 - 5.000 = 3.000. min(2.500; 3.000) = 2.500,00.'
    inputs: {kapitaleinkuenfte: 10000, est_regulaer_mit_kap: 8000, est_regulaer_ohne_kap: 5000}
    expected: 2500.0
  - quelle: sources/gesetze-im-internet/estg_p32d_2026-07-13.txt
    zitatanker: Auf Antrag des Steuerpflichtigen werden anstelle
    herkunft: synthetisch
    rechenweg: 'WAECHTER Guenstigerpruefung greift: Kapitaleink. 10.000 -> Abgeltung 2.500. delta = 6.500 - 5.000 = 1.500 (persoenlicher Satz 15 %). min(2.500; 1.500) = 1.500,00.'
    inputs: {kapitaleinkuenfte: 10000, est_regulaer_mit_kap: 6500, est_regulaer_ohne_kap: 5000}
