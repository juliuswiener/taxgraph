- rule_id: p36_2_anrechnung
  norm: § 36 Abs. 2 EStG
  quellen:
  - typ: gesetz
    label: § 36 Abs. 2-4 EStG (Anrechnung, Abschlusszahlung/Erstattung)
    datei: sources/gesetze-im-internet/estg_p36_2026-07-11.txt
    zitatanker: Auf die Einkommensteuer werden angerechnet
    auszug: 'Auf die Einkommensteuer werden angerechnet: 1. die für den Veranlagungszeitraum entrichteten Einkommensteuer-Vorauszahlungen (§ 37); 2. die durch Steuerabzug erhobene Einkommensteuer, soweit sie entfällt auf a) die bei der Veranlagung erfassten Einkünfte oder b) die nach § 3 Nummer 40 dieses Gesetzes, nach § 8b Absatz 1, 2 und 6 Satz 2 des Körperschaftsteuergesetzes oder nach einem Abkommen zur Vermeidung der Doppelbesteuerung bei der Ermittlung des Einkommens außer Ansatz bleibenden Bezüge und keine Erstattung beantragt oder durchgeführt worden ist.'
  - typ: gesetz
    label: § 36 Abs. 3 Satz 1 EStG (Steuerabzugsbeträge auf volle Euro aufgerundet)
    datei: sources/gesetze-im-internet/estg_p36_2026-07-11.txt
    zitatanker: auf volle Euro aufzurunden
    auszug: Die Steuerbeträge nach Absatz 2 Nummer 2 sind auf volle Euro aufzurunden
  geltungsbedingungen:
  - bedingung: lohnsteuer_ist_anrechenbar
    deckt_ab: die durch Steuerabzug erhobene Einkommensteuer
    quelle: § 36 Abs. 2 Satz 1 Nr. 2 EStG
    beschreibung: LSt entfaellt auf veranlagte Einkuenfte, Bescheinigung (§ 45a) liegt vor. Input-Semantik. NACHTRAG Erstattungsausschluss - keine Anrechnung, soweit eine Erstattung der durch Steuerabzug erhobenen ESt beantragt oder durchgefuehrt worden ist (§ 36 Abs. 2 Nr. 2 letzter Halbsatz) = benannter Nachtrag, nicht modelliert.
  - bedingung: keine_weiteren_anrechnungsbetraege
    deckt_ab: die für den Veranlagungszeitraum entrichteten Einkommensteuer-Vorauszahlungen
    quelle: § 36 Abs. 2 Satz 1 EStG
    beschreibung: 'MVP-AN: nur LSt + VZ. Keine KapESt darueber, keine Forschungszulage (Nr. 3), kein § 32c (Nr. 4).'
  - bedingung: ein_dienstverhaeltnis
    deckt_ab: auf volle Euro aufzurunden
    quelle: § 36 Abs. 3 Satz 2 EStG
    beschreibung: lohnsteuer aus EINEM Dienstverhaeltnis; der 1-DV-Wert wird auf volle Euro aufgerundet (Abs. 3 S. 1). NACHTRAG Mehrfachfall - amtlich Abs. 3 S. 2 - bei mehreren Abzugsbetraegen DERSELBEN Abzugsteuer ist die SUMME der Betraege je einzelner Abzugsteuer aufzurunden (Summe-dann-Runden), NICHT je Betrag einzeln aufrunden-dann-summieren.
  rundung:
  - deckt_ab: auf volle Euro aufzurunden
    zitatanker: auf volle Euro aufzurunden
    quelle: § 36 Abs. 3 Satz 1 EStG
