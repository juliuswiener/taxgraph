  - quelle: sources/gesetze-im-internet/kstg_p8b_2026-07-16.txt
    zitatanker: wenn die Beteiligung zu Beginn des Kalenderjahres unmittelbar weniger als 10 Prozent des Grund- oder Stammkapitals betragen hat
    herkunft: synthetisch
    rechenweg: 'STREUBESITZ 5 % (< 10 %, Abs. 4): steuerfrei_dividende = 0 -> Dividende voll steuerpflichtig, keine 5-%-Pauschale (Abs. 4 S. 7). ausseransatz_netto = 0 + 0 - 0 = 0,00.'
    inputs:
