- rule_id: p6_1_3a_abzinsung
  norm: § 6 Abs. 1 Nr. 3a Buchst. e EStG (Rückstellungs-Abzinsung 5,5 %)
  hinweis: 'abgezinster_wert = wenn abzinsung_ausgenommen dann nominalwert sonst nominalwert * abzinsungsfaktor_amtlich. Rückstellungen sind mit 5,5 % abzuzinsen (Barwert); AUSGENOMMEN wenn Laufzeit < 12 Monate ODER verzinslich ODER Anzahlung/Vorausleistung (drei disjunktive Ausnahmen, als EIN bool abzinsung_ausgenommen). abzinsungsfaktor_amtlich (= 1/1,055^Restlaufzeit) kommt als Input aus der amtlichen BMF-Tabelle - Catala hat keinen Potenz-Op; die 5,5-%-Konstante bleibt via Geltungsbedingung faktor_nach_zinssatz_5_5_prozent referenziert (Faktor-Tabelle als params/kohorten = benannter Nachtrag). KLASSE-5: money * decimal, Cent-Schnitt ZULETZT, Faktor NICHT vorrunden. Grenzfall: ''weniger als zwölf Monate'' = < 12 M ausgenommen; genau 12 M -> Abzinsung greift.'
  quellen:
  - typ: gesetz
    label: § 6 Abs. 1 Nr. 3a Buchst. e EStG (5,5-%-Abzinsung + drei Ausnahmen)
    datei: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: mit einem Zinssatz von 5,5 Prozent abzuzinsen
    auszug: Rückstellungen für Verpflichtungen sind mit einem Zinssatz von 5,5 Prozent abzuzinsen; ausgenommen von der Abzinsung sind Rückstellungen für Verpflichtungen, deren Laufzeit am Bilanzstichtag weniger als zwölf Monate beträgt, und Rückstellungen für Verpflichtungen, die verzinslich sind oder auf einer Anzahlung oder Vorausleistung beruhen
  signature:
    scope: AbzinsungRueckstellung
    inputs:
      nominalwert: money
      abzinsungsfaktor_amtlich: decimal
      abzinsung_ausgenommen: bool
    output: abgezinster_wert
  raster:
  - nominalwert: 10000
    abzinsungsfaktor_amtlich: 0.9
    abzinsung_ausgenommen: false
  - nominalwert: 10000
    abzinsungsfaktor_amtlich: 0.9
    abzinsung_ausgenommen: true
  - nominalwert: 10000
