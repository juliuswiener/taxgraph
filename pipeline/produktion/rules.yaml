    quelle: "§ 36 Abs. 2 Satz 1 EStG"
    beschreibung: "MVP-AN: nur LSt + VZ. Keine KapESt darueber, keine Forschungszulage (Nr. 3), kein § 32c (Nr. 4)."
  - bedingung: ein_dienstverhaeltnis
    deckt_ab: "auf volle Euro aufzurunden"
    quelle: "§ 36 Abs. 3 Satz 2 EStG"
    beschreibung: "lohnsteuer aus EINEM Dienstverhaeltnis; mehrere Abzugsbetraege sind vor Aufruf je einzeln aufzurunden und zu summieren (Abs. 3 rundet je Betrag einzeln)."
  rundung:
  - deckt_ab: "auf volle Euro aufzurunden"
    zitatanker: "auf volle Euro aufzurunden"
