- rule_id: p34c_1_anrechnung_hoechstbetrag
  norm: § 34c Abs. 1 EStG (Anrechnung ausländischer Steuer, Höchstbetrag)
  hinweis: 'hoechstbetrag = deutsche_est_inkl_ausl * (auslaendische_einkuenfte_staat / zu_versteuerndes_einkommen) [= durchschnittlicher Steuersatz S2 auf die ausl. Einkünfte, §34-Abs3-Muster]. anrechnung = min(gezahlte_auslaendische_steuer, hoechstbetrag). ANDOCKUNG (kein Selbst-Tarif): deutsche_est_inkl_ausl + zu_versteuerndes_einkommen aus §2-Integration (Veranlagung inkl. ausl. Einkünfte nach §§32a/32b/34/34a/34b). PER-COUNTRY: nur EIN Staat je Aufruf (Mehr-Staaten = Integration). Klasse-5: money * decimal-Anteil (ausl/zve), Cent-Schnitt ZULETZT, Anteil nicht vorrunden.'
  quellen:
  - typ: gesetz
    label: § 34c Abs. 1 S. 1 EStG (Anrechnung, per-country, KapESt-Ausnahme)
    datei: sources/gesetze-im-internet/estg_p34c_2026-07-14.txt
    zitatanker: auf die deutsche Einkommensteuer anzurechnen
    auszug: gezahlte und um einen entstandenen Ermäßigungsanspruch gekürzte ausländische Steuer auf die deutsche Einkommensteuer anzurechnen, die auf die Einkünfte aus diesem Staat entfällt; das gilt nicht für Einkünfte aus Kapitalvermögen, auf die § 32d Absatz 1 und 3 bis 6 anzuwenden ist
  - typ: gesetz
    label: § 34c Abs. 1 S. 2 EStG (Durchschnittssatz-Höchstbetrag)
    datei: sources/gesetze-im-internet/estg_p34c_2026-07-14.txt
    zitatanker: durchschnittliche Steuersatz auf die ausländischen Einkünfte
    auszug: entfallende deutsche Einkommensteuer ist in der Weise zu ermitteln, dass der sich bei der Veranlagung des zu versteuernden Einkommens, einschließlich der ausländischen Einkünfte, nach den §§ 32a, 32b, 34, 34a und 34b ergebende durchschnittliche Steuersatz auf die ausländischen Einkünfte anzuwenden ist.
  signature:
    scope: AnrechnungHoechstbetrag
    inputs:
      gezahlte_auslaendische_steuer: money
      deutsche_est_inkl_ausl: money
      zu_versteuerndes_einkommen: money
      auslaendische_einkuenfte_staat: money
    output: anrechnung
