    herkunft: synthetisch
    rechenweg: 'Basisfall: ebitda_basis = massgebliches_einkommen 1.000.000 + zinsaufwand 500.000 + abschreibungen 300.000 - zinsertrag 100.000 = 1.700.000,00.'
