- rule_id: p34_3_ermaessigter_durchschnittssatz
  hinweis: 'Andockung wie § 34 Abs 1 / § 32d (Tarifwerte sind INPUTS, KEIN Selbst-Tarif): est_gesamt_zzgl_progression ist das p32a-Tarifergebnis auf bemessungsgrundlage_durchschnitt (= gesamtes zvE inkl. der ao-Einkuenfte, zuzueglich Progressionseinkuenfte). Rechenkern: durchschnittssatz = est_gesamt_zzgl_progression / bemessungsgrundlage_durchschnitt (money/money = decimal); ermaessigter_satz = max(0,56 * durchschnittssatz; 0,14); est_ao = ermaessigter_satz * min(ao_einkuenfte; 5.000.000 Euro). 0,56 und 0,14 sind exakte Konstanten (NICHT /100 - Prozentwert bereits als Dezimal). Cap 5 Mio als min. Cent-Schnitt zuletzt.'
  norm: § 34 Abs. 3 EStG (ermaessigter Durchschnittssatz 56 %, ao-Einkuenfte bis 5 Mio)
  quellen:
  - typ: gesetz
    label: § 34 Abs. 3 S. 1-2 EStG (56 % des Durchschnittssatzes, mind. 14 %, 5-Mio-Cap)
    datei: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: 56 Prozent des durchschnittlichen Steuersatzes
    auszug: 'Sind in dem zu versteuernden Einkommen außerordentliche Einkünfte im Sinne des Absatzes 2 Nummer 1 enthalten, so kann auf Antrag abweichend von Absatz 1 die auf den Teil dieser außerordentlichen Einkünfte, der den Betrag von insgesamt 5 Millionen Euro nicht übersteigt, entfallende Einkommensteuer nach einem ermäßigten Steuersatz bemessen werden, wenn der Steuerpflichtige das 55. Lebensjahr vollendet hat oder wenn er im sozialversicherungsrechtlichen Sinne dauernd berufsunfähig ist. 2 Der ermäßigte Steuersatz beträgt 56 Prozent des durchschnittlichen Steuersatzes, der sich ergäbe, wenn die tarifliche Einkommensteuer nach dem gesamten zu versteuernden Einkommen zuzüglich der dem Progressionsvorbehalt unterliegenden Einkünfte zu bemessen wäre, mindestens jedoch 14 Prozent.'
  geltungsbedingungen:
  - bedingung: antrag_gestellt
    deckt_ab: so kann auf Antrag
    quelle: § 34 Abs. 3 S. 1 EStG
    beschreibung: 'Der ermaessigte Durchschnittssatz greift NUR auf Antrag (p32d/p35a-antrag-Praezedenz). Ohne Antrag: regulaerer Tarif bzw. Fuenftelregelung.'
  - bedingung: persoenliche_voraussetzung_erfuellt
    deckt_ab: das 55. Lebensjahr vollendet hat oder wenn er im sozialversicherungsrechtlichen Sinne dauernd berufsunfähig ist
    quelle: § 34 Abs. 3 S. 1 EStG
    beschreibung: 'Anwendbarkeit setzt voraus: 55. Lebensjahr vollendet ODER dauernd berufsunfaehig (sozialversicherungsrechtlich). Bool-Applikabilitaet, variiert den Betrag nicht.'
  - bedingung: ao_einkuenfte_abs2_nr1
    deckt_ab: außerordentliche Einkünfte im Sinne des Absatzes 2 Nummer 1
    quelle: § 34 Abs. 3 S. 1 i.V.m. Abs. 2 Nr. 1 EStG
    beschreibung: 'Nur ao-Einkuenfte nach Abs 2 Nr 1 (Betriebs-/Anteilsveraeusserungsgewinne). Nr 2-4 (Abfindungen, Nachzahlungen, mehrjaehrige Verguetungen) laufen ueber die Fuenftelregelung (p34_fuenftel_ao_est), NICHT hier.'
  - bedingung: einmal_im_leben
    deckt_ab: nur einmal im Leben
    quelle: § 34 Abs. 3 S. 4 EStG
    beschreibung: 'Der ermaessigte Satz kann nur EINMAL im Leben in Anspruch genommen werden (Einmaligkeits-State, wie Riester-Berufseinsteiger/§ 35c-40k - bool-Input aus der Integration, hier vorausgesetzt).'
  - bedingung: tarifwerte_sind_p2_ergebnis
    deckt_ab: wenn die tarifliche Einkommensteuer nach dem gesamten zu versteuernden Einkommen
    quelle: § 34 Abs. 3 S. 2 i.V.m. § 2, § 32a EStG
    beschreibung: 'est_gesamt_zzgl_progression und bemessungsgrundlage_durchschnitt sind p32a-Tarifergebnis bzw. dessen Bemessungsgroesse (gesamtes zvE inkl. ao zzgl. Progressionseinkuenfte), aus der § 2-Integration. Andockung wie § 34 Abs 1 / § 31 - kein Selbst-Tarif.'
  - bedingung: bemessungsgrundlage_positiv
    deckt_ab: des durchschnittlichen Steuersatzes
    quelle: § 34 Abs. 3 S. 2 EStG
    beschreibung: 'bemessungsgrundlage_durchschnitt > 0 (Nenner der Durchschnittssatz-Division). Bei ao-Antrag konstruktiv erfuellt (positive ao-Einkuenfte enthalten).'
  rundung: []
  signature:
    scope: ErmaessigterDurchschnittssatz
    inputs:
      ao_einkuenfte: money
      est_gesamt_zzgl_progression: money
      bemessungsgrundlage_durchschnitt: money
    output: est_ao
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: 56 Prozent des durchschnittlichen Steuersatzes
    herkunft: synthetisch
    rechenweg: 'Durchschnittssatz 60.000/200.000 = 0,30; ermaessigt 0,56 x 0,30 = 0,168; ao 100.000 (< 5 Mio) -> 0,168 x 100.000 = 16.800,00.'
    inputs: {ao_einkuenfte: 100000, est_gesamt_zzgl_progression: 60000, bemessungsgrundlage_durchschnitt: 200000}
    expected: 16800.0
  - quelle: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: 56 Prozent des durchschnittlichen Steuersatzes
    herkunft: synthetisch
    rechenweg: 'WAECHTER 14-%-Boden: Durchschnitt 20.000/100.000 = 0,20; 0,56 x 0,20 = 0,112 < 0,14 -> Boden 0,14; ao 50.000 -> 0,14 x 50.000 = 7.000,00.'
    inputs: {ao_einkuenfte: 50000, est_gesamt_zzgl_progression: 20000, bemessungsgrundlage_durchschnitt: 100000}
    expected: 7000.0
  - quelle: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: 56 Prozent des durchschnittlichen Steuersatzes
    herkunft: synthetisch
    rechenweg: 'WAECHTER 5-Mio-Cap: Durchschnitt 0,30 -> 0,168; ao 6.000.000 -> min(6.000.000; 5.000.000) = 5.000.000; 0,168 x 5.000.000 = 840.000,00.'
    inputs: {ao_einkuenfte: 6000000, est_gesamt_zzgl_progression: 60000, bemessungsgrundlage_durchschnitt: 200000}
    expected: 840000.0
  - quelle: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: 56 Prozent des durchschnittlichen Steuersatzes
    herkunft: synthetisch
    rechenweg: 'WAECHTER Null: ao 0 -> 0,168 x 0 = 0,00.'
    inputs: {ao_einkuenfte: 0, est_gesamt_zzgl_progression: 60000, bemessungsgrundlage_durchschnitt: 200000}
    expected: 0.0
  raster:
  - {ao_einkuenfte: 100000, est_gesamt_zzgl_progression: 60000, bemessungsgrundlage_durchschnitt: 200000}
  - {ao_einkuenfte: 50000, est_gesamt_zzgl_progression: 20000, bemessungsgrundlage_durchschnitt: 100000}
  - {ao_einkuenfte: 6000000, est_gesamt_zzgl_progression: 60000, bemessungsgrundlage_durchschnitt: 200000}
  - {ao_einkuenfte: 0, est_gesamt_zzgl_progression: 60000, bemessungsgrundlage_durchschnitt: 200000}

# --- Charge 15 (EÜR-Kern): §4 Abs3, §11 (handgeschrieben), §6 Abs2/2a ---
- rule_id: p11_zufluss_abfluss
  norm: § 11 Abs. 1/2 EStG (Zufluss-/Abfluss-Prinzip, Zurechnungsjahr)
  status: handgeschrieben
  quellen:
  - typ: gesetz
    label: § 11 Abs. 1 S. 1/2 EStG (Zufluss, wiederkehrend kurze Zeit)
    datei: sources/gesetze-im-internet/estg_p11_2026-07-14.txt
    zitatanker: gelten als in diesem Kalenderjahr bezogen
    auszug: Regelmäßig wiederkehrende Einnahmen, die dem Steuerpflichtigen kurze Zeit vor Beginn oder kurze Zeit nach Beendigung des Kalenderjahres, zu dem sie wirtschaftlich gehören, zugeflossen sind, gelten als in diesem Kalenderjahr bezogen.
  geltungsbedingungen:
  - bedingung: kurze_zeit_ist_h11_nicht_wortlaut
    deckt_ab: kurze Zeit vor Beginn oder kurze Zeit nach Beendigung des Kalenderjahres
    quelle: § 11 Abs. 1 S. 2 EStG / H 11 EStH
    beschreibung: Die 10-Tage-Schwelle ('kurze Zeit') ist H 11 EStH/Rechtsprechung, KEIN Norm-Wortlaut. innerhalb_kurze_zeit_fenster ist bool-Input (nicht aus Tagen gerechnet); nur die Wenn-Struktur + gilt-als-Fiktion ist formalisiert.
  - bedingung: keine_vorauszahlungs_verteilung_abs2s3
    deckt_ab: Werden Ausgaben für eine Nutzungsüberlassung von mehr als fünf Jahren im Voraus geleistet
    quelle: § 11 Abs. 2 S. 3 EStG
    beschreibung: Vorauszahlung Nutzungsüberlassung > 5 J = gleichmäßige Verteilung (eigene Mehrjahres-Mechanik, benannter Nachtrag), hier nicht gerechnet.
- rule_id: p4_3_gewinn
  norm: § 4 Abs. 3 EStG (Einnahmenüberschussrechnung)
  hinweis: gewinn = betriebseinnahmen - betriebsausgaben. Reine Differenz, kann NEGATIV sein (Verlust-Passthrough, KEINE max(0)-Kappung). Cent-genau.
  quellen:
  - typ: gesetz
    label: § 4 Abs. 3 S. 1 EStG (Überschuss BE über BA)
    datei: sources/gesetze-im-internet/estg_p4_2026-07-14.txt
    zitatanker: Überschuss der Betriebseinnahmen über die Betriebsausgaben
    auszug: können als Gewinn den Überschuss der Betriebseinnahmen über die Betriebsausgaben ansetzen.
  signature:
    scope: EuerGewinn
    inputs:
      betriebseinnahmen: money
      betriebsausgaben: money
    output: gewinn
  raster:
  - betriebseinnahmen: 100000
    betriebsausgaben: 60000
  - betriebseinnahmen: 50000
    betriebsausgaben: 70000
  - betriebseinnahmen: 0
    betriebsausgaben: 0
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p4_2026-07-14.txt
    zitatanker: Überschuss der Betriebseinnahmen über die Betriebsausgaben
    herkunft: synthetisch
    rechenweg: 'BE - BA: 100.000 - 60.000 = 40.000,00.'
    inputs:
      betriebseinnahmen: 100000
      betriebsausgaben: 60000
    expected: 40000.0
  - quelle: sources/gesetze-im-internet/estg_p4_2026-07-14.txt
    zitatanker: Überschuss der Betriebseinnahmen über die Betriebsausgaben
    herkunft: synthetisch
    rechenweg: 'Verlust-Passthrough (keine Kappung): 50.000 - 70.000 = -20.000,00.'
    inputs:
      betriebseinnahmen: 50000
      betriebsausgaben: 70000
    expected: -20000.0
  - quelle: sources/gesetze-im-internet/estg_p4_2026-07-14.txt
    zitatanker: Überschuss der Betriebseinnahmen über die Betriebsausgaben
    herkunft: synthetisch
    rechenweg: 'Null: 0 - 0 = 0,00.'
    inputs:
      betriebseinnahmen: 0
      betriebsausgaben: 0
    expected: 0.0
  geltungsbedingungen:
  - bedingung: nicht_buchfuehrungspflichtig_und_keine_buecher
    deckt_ab: nicht auf Grund gesetzlicher Vorschriften verpflichtet sind, Bücher zu führen
    quelle: § 4 Abs. 3 S. 1 EStG
    beschreibung: EÜR-Wahlrecht nur bei fehlender Buchführungspflicht UND tatsächlich keiner Buchführung (S. 1).
  - bedingung: durchlaufende_posten_ausgeschieden
    deckt_ab: im Namen und für Rechnung eines anderen vereinnahmt und verausgabt werden
    quelle: § 4 Abs. 3 S. 2 EStG
    beschreibung: Durchlaufende Posten (S. 2) sind aus BE/BA ausgeschieden - Inputs bereits bereinigt.
  - bedingung: keine_lebensfuehrungskosten_p12_nr1
    deckt_ab: die für den Haushalt des Steuerpflichtigen und für den Unterhalt seiner Familienangehörigen aufgewendeten Beträge
    quelle: § 12 Nr. 1 S. 1 EStG
    beschreibung: '§12-Bedingungs-Paket (Charge 16, Zeile 6): der BA-Input schliesst Lebensfuehrungs-/Haushaltskosten (§12 Nr1 S1) aus - keine BA.'
  - bedingung: keine_repraesentation_gemischt_p12_nr1s2
    deckt_ab: Aufwendungen für die Lebensführung, die die wirtschaftliche oder gesellschaftliche Stellung des Steuerpflichtigen mit sich bringt
    quelle: § 12 Nr. 1 S. 2 EStG
    beschreibung: Gemischte Repraesentationsaufwendungen (§12 Nr1 S2) sind aus dem BA-Input ausgeschieden.
  - bedingung: keine_personensteuern_p12_nr3
    deckt_ab: die Steuern vom Einkommen und sonstige Personensteuern
    quelle: § 12 Nr. 3 EStG
    beschreibung: Personensteuern (ESt + sonstige) sind keine BA (§12 Nr3) - im BA-Input nicht enthalten.
  - bedingung: einkunftsart_gewerbe_p15_abs2
    deckt_ab: selbständige nachhaltige Betätigung, die mit der Absicht, Gewinn zu erzielen, unternommen wird und sich als Beteiligung am allgemeinen wirtschaftlichen Verkehr darstellt
    quelle: § 15 Abs. 2 EStG
    beschreibung: '§15/§18-Einkunftsart-Paket (Charge 18, Zeilen 11-12): EÜR-Gewinn ist Einkünfte aus Gewerbebetrieb (§15 Abs2: selbständig+nachhaltig+Gewinnabsicht+Verkehrsteilnahme) ODER aus selbständiger Arbeit (§18). Abfärbung §15 Abs3 = benannter Nachtrag, NICHT formalisiert (PersGes/Struktur).'
  - bedingung: einkunftsart_selbstaendige_arbeit_p18_abs1
    deckt_ab: Einkünfte aus selbständiger Arbeit sind
    quelle: § 18 Abs. 1 Nr. 1 EStG
    beschreibung: Alternativ zu §15 Gewerbe - freiberufliche/selbständige Taetigkeit (§18 Abs1 Nr1). Beide Einkunftsarten nutzen dieselbe EÜR-Grundmechanik (§4 Abs3).
- rule_id: p6_2_gwg_sofortabzug
  norm: § 6 Abs. 2 EStG (GWG-Sofortabzug, 800 Euro netto)
  hinweis: 'sofortabzug = wenn anschaffungskosten_netto <= 800 dann anschaffungskosten_netto sonst 0. 800 ist NETTO-Grenze (Vorsteuer §9b bereits heraus, kommt bereinigt als Input). ''nicht übersteigen'' = <= (bei genau 800,00: Sofortabzug JA). Bewegliches abnutzbares AV + selbständige Nutzbarkeit = Geltungsbedingung, nicht gerechnet. Cent-genau.'
  quellen:
  - typ: gesetz
    label: § 6 Abs. 2 S. 1 EStG (Sofortabzug bis 800 netto)
    datei: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: 800 Euro nicht übersteigen
    auszug: in voller Höhe als Betriebsausgaben abgezogen werden, wenn die Anschaffungs- oder Herstellungskosten, vermindert um einen darin enthaltenen Vorsteuerbetrag (§ 9b Absatz 1), oder der nach Absatz 1 Nummer 5 bis 6 an deren Stelle tretende Wert für das einzelne Wirtschaftsgut 800 Euro nicht übersteigen.
  signature:
    scope: GwgSofortabzug
    inputs:
      anschaffungskosten_netto: money
    output: sofortabzug
  raster:
  - anschaffungskosten_netto: 800
  - anschaffungskosten_netto: 800.01
  - anschaffungskosten_netto: 500
  - anschaffungskosten_netto: 900
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: 800 Euro nicht übersteigen
    herkunft: synthetisch
    rechenweg: 'Boundary <= 800: netto 800,00 -> voller Sofortabzug 800,00.'
    inputs:
      anschaffungskosten_netto: 800
    expected: 800.0
  - quelle: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: 800 Euro nicht übersteigen
    herkunft: synthetisch
    rechenweg: 'Boundary: netto 800,01 > 800 -> kein Sofortabzug, 0.'
    inputs:
      anschaffungskosten_netto: 800.01
    expected: 0.0
  - quelle: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: 800 Euro nicht übersteigen
    herkunft: synthetisch
    rechenweg: 'Innerhalb: netto 500,00 -> 500,00.'
    inputs:
      anschaffungskosten_netto: 500
    expected: 500.0
  - quelle: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: 800 Euro nicht übersteigen
    herkunft: synthetisch
    rechenweg: 'Darüber: netto 900,00 -> 0.'
    inputs:
      anschaffungskosten_netto: 900
    expected: 0.0
  geltungsbedingungen:
  - bedingung: netto_ist_9b_bereinigt
    deckt_ab: vermindert um einen darin enthaltenen Vorsteuerbetrag (§ 9b Absatz 1)
    quelle: § 6 Abs. 2 S. 1 EStG
    beschreibung: anschaffungskosten_netto = AK vermindert um abziehbare Vorsteuer (§9b Abs1). Bei Nicht-Vorsteuerabzugsberechtigten ist netto = brutto.
  - bedingung: bewegliches_abnutzbares_anlagevermoegen_selbstaendig_nutzbar
    deckt_ab: abnutzbaren beweglichen Wirtschaftsgütern des Anlagevermögens, die einer selbständigen Nutzung fähig sind
    quelle: § 6 Abs. 2 S. 1/2 EStG
    beschreibung: WG ist bewegliches abnutzbares AV UND selbständig nutzbar (S. 2/3) - Qualifikation, nicht gerechnet.
  - bedingung: verzeichnis_ab_250_gefuehrt
    deckt_ab: in ein besonderes, laufend zu führendes Verzeichnis aufzunehmen
    quelle: § 6 Abs. 2 S. 4 EStG
    beschreibung: 'WG > 250 netto: Aufnahme ins laufende Verzeichnis (Dokumentationspflicht; entfällt, wenn aus Buchführung ersichtlich, S. 5).'
- rule_id: p6_2a_sammelposten_zufuehrung
  norm: § 6 Abs. 2a EStG (Sammelposten-Zuführung, 250 < netto <= 1000)
  hinweis: 'zufuehrung = wenn (anschaffungskosten_netto > 250 und anschaffungskosten_netto <= 1000) dann anschaffungskosten_netto sonst 0. NETTO-Grenzen (§9b heraus). ''250 Euro übersteigen'' = > 250 (bei genau 250,00: 0); ''nicht 1000 Euro übersteigen'' = <= 1000 (bei genau 1000,00: durchgereicht). Symmetrisch zum GWG-Muster (§6 Abs2). Cent-genau.'
  quellen:
  - typ: gesetz
    label: § 6 Abs. 2a S. 1 EStG (Sammelposten-Band 250-1000 netto)
    datei: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: 250 Euro, aber nicht 1 000 Euro übersteigen
