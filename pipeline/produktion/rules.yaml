- rule_id: p5_5_aktiver_rap
  norm: § 5 Abs. 5 S. 1 Nr. 1 EStG (aktiver Rechnungsabgrenzungsposten, Zeitanteiligkeit)
  hinweis: 'aktiver_rap = ausgabe * monate_nach_stichtag / monate_gesamt. Der auf die Zeit NACH dem Abschlussstichtag entfallende, abzugrenzende Teil einer Ausgabe vor dem Stichtag (Aufwand fuer eine bestimmte Zeit danach). KLASSE-5-Vermeidung: Division durch monate_gesamt ZULETZT (/12-Lehre), Cent-Schnitt am Ende, KEINE vorgerundete Monatsrate. Monate als int-Inputs (ganzzahlige Perioden). MONATSGRANULARITAET ist eine KONVENTION (Wortlaut sagt ''bestimmte Zeit'', nicht ''Monat''); Tagesgenauigkeit = benannter Nachtrag. Boundary: monate_nach_stichtag = 0 -> 0 (kein RAP). Keine Norm-Konstante im Code.'
