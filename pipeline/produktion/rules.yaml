- rule_id: estr_4_6_uebergangsgewinn_verteilung
  norm: R 4.6 S. 2 EStR (Übergangsgewinn-Verteilung, verwaltungs-basierte Billigkeitsregel)
  hinweis: 'jahresbetrag = uebergangsgewinn / verteilungsjahre. VERWALTUNGS-BASIERTE REGEL: das Gesetz regelt die Verteilung nicht, R 4.6 (EStR, Billigkeit ''zur Vermeidung von Härten auf Antrag'') ist die einzige Quelle. Übergangsgewinn (Saldo aus Zu-/Abrechnungen) gleichmäßig auf 1, 2 oder 3 Jahre. KLASSE-5-Vermeidung: money / int, ein Cent-Schnitt. NUR POSITIVER Übergangsgewinn (Verlust-Fall NICHT durch die Verteilung - H 4.6, Geltungsbedingung uebergangsgewinn_positiv). KEINE Norm-Konstante im Code. Cent-genau.'
