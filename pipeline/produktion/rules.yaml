- rule_id: p24b_entlastungsbetrag
  norm: § 24b EStG
  norm_source: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
  struktur:
  - grundbetrag_4260
  - kindstaffel_240
  - zwoelftelung
  - praedikat_alleinstehend
  # Vom Judge im Annahme-Mapping erzwungen: drei Eingaben tragen Semantik, die die
  # Norm definiert und der Scope nicht pruefen kann. Klasse (2) der
  # Abgrenzungsregel - sie variieren den Betrag nicht, sie schalten die Regel.
  geltungsbedingungen:
  - bedingung: alleinstehend_im_sinne_des_absatzes_3
    deckt_ab: "Allein stehend im Sinne des Absatzes 1 sind Steuerpflichtige"
    quelle: "§ 24b Abs. 3 EStG"
    beschreibung: "Input-Semantik: `alleinstehend` traegt die Legaldefinition des Abs. 3 (kein Splitting, nicht verwitwet mit Splitting, keine Haushaltsgemeinschaft mit einer anderen volljaehrigen Person)."
  - bedingung: kinder_mit_freibetrag_oder_kindergeld_im_haushalt
    deckt_ab: "Freibetrag nach § 32 Absatz 6 oder Kindergeld zusteht"
    quelle: "§ 24b Abs. 1 Satz 1 EStG"
    beschreibung: "Input-Semantik: `anzahl_kinder` zaehlt nur Kinder, die zum Haushalt gehoeren und fuer die Kinderfreibetrag oder Kindergeld zusteht."
  - bedingung: monate_ohne_voraussetzung_sind_volle_kalendermonate
    deckt_ab: "Für jeden vollen Kalendermonat, in dem die Voraussetzungen des Absatzes 1 nicht vorgelegen haben"
    quelle: "§ 24b Abs. 4 EStG"
    beschreibung: "Input-Semantik: `monate_ohne_voraussetzung` zaehlt volle Kalendermonate ohne die Voraussetzungen des Abs. 1."
  # Herkunft `abgeleitet`, kein synthetischer Fall. Das BMF-Schreiben v. 23.11.2022
  # rechnet die Zwoelftelung mit dem Grundbetrag 4.008 EUR der Jahre 2020-2022 vor;
  # sein Volltext ist zudem weder ueber esth/lsth.bundesfinanzministerium.de
  # (Bot-Sperre) noch ueber den frueheren Landes-Spiegel woertlich abrufbar. Zitiert
  # wird deshalb die Rechenmechanik dort, wo sie woertlich und eingefroren vorliegt:
  # im Gesetz selbst. Die Parameter stammen aus der geltenden Fassung (4.260 / 240).
  # Jeder Erwartungswert traegt seinen `rechenweg`; nichts ist geraten.
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "beträgt der Entlastungsbetrag im Kalenderjahr 4 260 Euro"
    herkunft: abgeleitet
    rechenweg: "Abs. 2 Satz 1: ein Kind, keine Ausfallmonate -> Grundbetrag 4.260,00 EUR."
    inputs: {alleinstehend: true, anzahl_kinder: 1, monate_ohne_voraussetzung: 0}
    expected: 4260.00
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "erhöht sich der Betrag nach Satz 1 um 240 Euro je weiterem Kind"
    herkunft: abgeleitet
    rechenweg: "Abs. 2 Satz 2: drei Kinder = Grundbetrag + 2 x 240 EUR = 4.260 + 480 = 4.740,00 EUR."
    inputs: {alleinstehend: true, anzahl_kinder: 3, monate_ohne_voraussetzung: 0}
    expected: 4740.00
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "ermäßigt sich der Entlastungsbetrag nach Absatz 2 um ein Zwölftel"
    herkunft: abgeleitet
    rechenweg: "Abs. 4: sechs volle Kalendermonate ohne Voraussetzungen -> 4.260 EUR x 6/12 = 2.130,00 EUR. Dies ist die Mechanik des BMF-Beispiels (dort 4.008 EUR x 9/12), mit den Parametern der geltenden Fassung."
    inputs: {alleinstehend: true, anzahl_kinder: 1, monate_ohne_voraussetzung: 6}
    expected: 2130.00
  signature:
    scope: Entlastungsbetrag
    inputs:
      alleinstehend: bool
      anzahl_kinder: int
      monate_ohne_voraussetzung: int
    output: entlastungsbetrag
  raster:
  - alleinstehend: true
    anzahl_kinder: 1
    monate_ohne_voraussetzung: 0
  - alleinstehend: true
    anzahl_kinder: 3
    monate_ohne_voraussetzung: 0
  - alleinstehend: true
    anzahl_kinder: 1
    monate_ohne_voraussetzung: 6
  - alleinstehend: false
    anzahl_kinder: 2
    monate_ohne_voraussetzung: 0
  exclude_rule_ids:
  - p24b_entlastungsbetrag
- rule_id: p33_3_zumutbare_belastung
  norm: § 33 Abs. 3 EStG
  # FREIGABE BLOCKIERT (Julius, 2026-07-09). Der Rechtsfehler aus Charge 1 ist
  # behoben: mit dem BFH-Leitsatz als zweiter Quelle formalisiert B die
  # stufenweise Berechnung und besteht den amtlichen Testfall.
  #
  # A baut inzwischen (Numeric-Tower-Cheatsheet, typecheck beim ersten Versuch),
  # aber die Aequivalenz traegt nicht: A rundet das Ergebnis auf volle Euro ab
  # (Decimal.truncate), die Norm tut das nicht. Drei unabhaengige Gates sagen
  # dasselbe - equivalence (A $1,346.00 vs B $1,346.60), der Judge benennt die
  # stille Zusatzannahme, und der amtliche Testfall (1.408,70) faellt bei A.
  #
  # Kein stilles Durchwinken. Freigabe erst, wenn entweder A und B extensional
  # uebereinstimmen, oder wir dokumentiert auf Einzel-Formalisierung mit
  # verschaerftem Review fuer diese eine Regel ausweichen.
  freigabe: blockiert
  freigabe_grund: "Redundanz-Gate hat gefeuert: A rundet ab, B nicht. Aequivalenz traegt nicht."
  # Erstbefuellung der Registry (Julius, 2026-07-11). Muster "Input ist ein
  # vorgepruefte Rechtspraedikat": die booleschen/gezaehlten Eingaben spiegeln ein
  # bereits geprueftes Ergebnis; Phase 5 stellt die Teilfragen.
  geltungsbedingungen:
  - bedingung: kinder_sind_anspruchskinder
    deckt_ab: "Anspruch auf einen Freibetrag nach § 32 Absatz 6 oder auf Kindergeld hat"
    quelle: "§ 33 Abs. 3 Satz 2 EStG"
    beschreibung: "Input-Semantik: anzahl_kinder zaehlt nur Kinder mit Anspruch auf Freibetrag (§ 32 Abs. 6) oder Kindergeld. Phase 5 fragt das ab."
  - bedingung: splitting_ist_veranlagungsergebnis
    deckt_ab: "nach § 32a Absatz 5 oder 6 (Splitting-Verfahren)"
    quelle: "§ 33 Abs. 3 Satz 1 Nr. 1 Buchst. b EStG"
    beschreibung: "Input-Semantik: splitting spiegelt die tatsaechliche Tarifberechnung. Kommt bei der § 2-Integration aus der Veranlagungsart, nicht vom Nutzer."
  # Multi-Source: der Wortlaut allein laesst beide Lesarten zu. Charge 1 zeigte,
  # dass Formalisierer A die vom BFH verworfene Auslegung waehlt, wenn nur das
  # Gesetz im Input steht. Der Leitsatz kommt als GETRENNTE, etikettierte Quelle
  # dazu - der Normtext bleibt unangetastet.
  quellen:
  - typ: gesetz
    label: "§ 33 Abs. 3 EStG"
    datei: sources/gesetze-im-internet/estg_p33_abs3_2026-07-09.txt
  - typ: rechtsprechung
    label: "BFH, Urteil v. 19.01.2017 - VI R 75/14, Leitsatz 1"
    datei: sources/bfh/bfh_vi_r_75-14_2017-01-19.txt
    ecli: "ECLI:DE:BFH:2017:U.190117.VIR75.14.0"
    zitatanker: "nur der Teil des Gesamtbetrags der Einkünfte, der den im Gesetz genannten Grenzbetrag übersteigt, mit dem jeweils höheren Prozentsatz belastet wird"
    auszug: "Abweichend von der bisherigen (durch die Rechtsprechung gebilligten) Verwaltungsauffassung, wonach sich die Höhe der zumutbaren Belastung ausschließlich nach dem höheren Prozentsatz richtet, sobald der Gesamtbetrag der Einkünfte eine der in § 33 Abs. 3 Satz 1 EStG genannten Grenzen überschreitet, ist die Regelung so zu verstehen, dass nur der Teil des Gesamtbetrags der Einkünfte, der den im Gesetz genannten Grenzbetrag übersteigt, mit dem jeweils höheren Prozentsatz belastet wird."
  norm_source: sources/gesetze-im-internet/estg_p33_abs3_2026-07-09.txt
  struktur:
  - tabellen_lookup_2d
  - gde_stufen
  - kinderzahl_stufen
  - prozent_des_gde
  test_seed:
  # BFH, Urteil v. 19.01.2017 - VI R 75/14: die stufenweise Berechnung ist im
  # Urteil vollstaendig vorgerechnet. Die Staffel 2/3/4 % gilt laut der im selben
  # Urteil zitierten Tabelle fuer "einem Kind oder zwei Kindern"; der Familienstand
  # ist fuer diese Zeile ohne Bedeutung.
  - quelle: sources/bfh/bfh_vi_r_75-14_2017-01-19.txt
    zitatanker: "zumutbare Belastung 1.408,70 \u20ac"
    inputs: {gesamtbetrag_der_einkuenfte: 51835, anzahl_kinder: 1, splitting: false}
    expected: 1408.70
  signature:
    scope: ZumutbareBelastung
    inputs:
      gesamtbetrag_der_einkuenfte: money
      anzahl_kinder: int
      splitting: bool
    output: zumutbare_belastung
  raster:
  - gesamtbetrag_der_einkuenfte: 15000
    anzahl_kinder: 0
    splitting: false
  - gesamtbetrag_der_einkuenfte: 30000
    anzahl_kinder: 0
    splitting: true
  - gesamtbetrag_der_einkuenfte: 60000
    anzahl_kinder: 1
    splitting: false
  - gesamtbetrag_der_einkuenfte: 60000
    anzahl_kinder: 3
    splitting: false
  - gesamtbetrag_der_einkuenfte: 15340
    anzahl_kinder: 0
    splitting: false
  exclude_rule_ids:
  - p33_3_zumutbare_belastung
- rule_id: p35a_2_3_haushaltsnahe
  norm: § 35a EStG (Abs. 1 bis 3, Voraussetzungen Abs. 5)
  # Neu geschnitten nach der Abgrenzungsregel (Julius, 2026-07-09).
  # Die Signatur traegt die drei Aufwandskategorien, weil jede ihren eigenen Cap
  # selektiert und damit den Betrag variiert. Der 20-%-Satz und die Caps (510 /
  # 4.000 / 1.200) kommen aus der Norm, nicht aus der Signatur.
  #
  # Quelle ist jetzt der volle § 35a: die alte Fassung (nur Abs. 2/3) enthielt
  # weder Abs. 1 (Minijob-Cap 510) noch Abs. 5 (Rechnung, unbare Zahlung,
  # Arbeitskosten). Ohne Abs. 5 waeren drei der fuenf Geltungsbedingungen nicht
  # zitierfaehig.
  #
  # ANDOCKPUNKT: § 35a mindert die festzusetzende Einkommensteuer (§ 2 Abs. 6),
  # nicht die Einkuenfte. Bei der Integration gehoert die Regel an die
  # tarifliche_est -> festzusetzende_est-Stufe des Stufen-Refactorings, nicht in
  # die Werbungskosten.
  #
  # REIHENFOLGE (Julius, 2026-07-11): Abs. 3 ermaessigt die tarifliche ESt,
  # "vermindert um die sonstigen Steuerermaessigungen" (§ 35a Abs. 3 Satz 1). Die
  # Reihenfolge der Ermaessigungen ist damit NICHT Aufgabe dieser Regel, sondern der
  # Stufenfolge in der § 2-Integration. Der entsprechende Registry-Fund ist
  # nicht_material und mappt hierher, nicht in eine Regel-Bedingung.
  norm_source: sources/gesetze-im-internet/estg_p35a_2026-07-09.txt
  struktur:
  - prozent_20
  - cap_510
  - cap_4000
  - cap_1200
  - nur_arbeitskosten
  # Vorschlag zur Absegnung im naechsten Review-Paket. Jede Bedingung ist eine
  # binaere Anwendbarkeitsvoraussetzung: im Standardfall erfuellt, veraendert den
  # Betrag nicht, schaltet die Regel an oder aus.
  geltungsbedingungen:
  - bedingung: rechnung_und_unbare_zahlung
    deckt_ab: "eine Rechnung erhalten hat und die Zahlung auf das Konto des Erbringers der Leistung erfolgt ist"
    quelle: "§ 35a Abs. 5 Satz 3 EStG"
    beschreibung: "Ohne Rechnung und unbare Zahlung entfaellt die Ermaessigung fuer Abs. 2 und 3 vollstaendig."
  - bedingung: haushalt_in_eu_ewr
    deckt_ab: "Europäischen Union oder dem Europäischen Wirtschaftsraum liegenden Haushalt"
    quelle: "§ 35a Abs. 4 Satz 1 EStG"
    beschreibung: "Die Ermaessigung setzt einen Haushalt in der EU oder im EWR voraus."
  - bedingung: keine_beruecksichtigung_als_wk_sa_agb
    deckt_ab: "nicht Betriebsausgaben oder Werbungskosten darstellen"
    quelle: "§ 35a Abs. 5 Satz 1 EStG"
    beschreibung: "Dieselben Aufwendungen duerfen nicht schon als Betriebsausgaben, Werbungskosten, Sonderausgaben oder aussergewoehnliche Belastungen beruecksichtigt sein."
  - bedingung: handwerker_keine_oeffentliche_foerderung
    deckt_ab: "nicht für öffentlich geförderte Maßnahmen"
    quelle: "§ 35a Abs. 3 Satz 2 EStG"
    beschreibung: "Fuer oeffentlich gefoerderte Massnahmen (zinsverbilligte Darlehen, steuerfreie Zuschuesse) gibt es keine Ermaessigung nach Abs. 3."
  - bedingung: handwerkerbetrag_enthaelt_nur_arbeitskosten
    deckt_ab: "gilt nur für Arbeitskosten"
    quelle: "§ 35a Abs. 5 Satz 2 EStG"
    beschreibung: "Input-Semantik: der uebergebene Handwerkerbetrag enthaelt nur Arbeits-, Fahrt- und Maschinenkosten, kein Material."
  # Vom Judge im Annahme-Mapping erzwungen: er weigerte sich, die Annahme ueber
  # `haushaltsnahe_dienstleistungen` auf die Handwerker-Bedingung zu mappen. Zu
  # Recht - § 35a Abs. 5 Satz 2 spricht von den Absaetzen 2 UND 3. Die Bedingung
  # oben deckte nur Abs. 3 ab; das hier ist die fehlende Haelfte.
  - bedingung: dienstleistungsbetrag_enthaelt_nur_arbeitskosten
    deckt_ab: "nach den Absätzen 2 und 3 gilt nur für Arbeitskosten"
    quelle: "§ 35a Abs. 5 Satz 2 EStG"
    beschreibung: "Input-Semantik: der uebergebene Betrag fuer haushaltsnahe Dienstleistungen enthaelt nur Arbeitskosten, kein Material."
  - bedingung: kein_gemeinsamer_haushalt_zweier_alleinstehender
    deckt_ab: "Höchstbeträge nach den Absätzen 1 bis 3 insgesamt jeweils nur einmal"
    quelle: "§ 35a Abs. 5 Satz 4 EStG"
    beschreibung: "Leben zwei Alleinstehende zusammen, stehen die Hoechstbetraege insgesamt nur einmal zu. Der Scope rechnet fuer einen Haushalt."
  # Vom Judge zusaetzlich als `wirkt_hinein` gemeldet. Alles Input-Semantik bzw.
  # binaere Anwendbarkeit - Klasse (2) der Abgrenzungsregel, nicht (1):
  # sie variieren den Betrag nicht, sie schalten die Regel an oder aus.
  - bedingung: antrag_gestellt
    deckt_ab: "auf Antrag"
    quelle: "§ 35a Abs. 1, 2 und 3 EStG"
    beschreibung: "Die Ermaessigung wird nur auf Antrag gewaehrt. Ohne Antrag gaebe der Scope dennoch einen Betrag aus."
  - bedingung: minijob_ist_geringfuegige_beschaeftigung_nach_8a_sgb4
    deckt_ab: "bei denen es sich um eine geringfügige Beschäftigung im Sinne des § 8a des Vierten Buches Sozialgesetzbuch handelt"
    quelle: "§ 35a Abs. 1 EStG"
    beschreibung: "Input-Semantik: `minijob_aufwendungen` sind nur Aufwendungen fuer ein haushaltsnahes Beschaeftigungsverhaeltnis nach § 8a SGB IV."
  - bedingung: dienstleistungen_sind_keine_handwerkerleistungen
    deckt_ab: "die nicht Dienstleistungen nach Absatz 3 sind"
    quelle: "§ 35a Abs. 2 Satz 1 EStG"
    beschreibung: "Input-Semantik: `haushaltsnahe_dienstleistungen` enthaelt keine Handwerkerleistungen; die gehoeren in den Abs.-3-Topf."
  - bedingung: keine_pflege_oder_heimkosten
    deckt_ab:
    - "für die Inanspruchnahme von Pflege- und Betreuungsleistungen"
    - "dass das Heim oder der Ort der dauernden Pflege in der Europäischen Union oder dem Europäischen Wirtschaftsraum liegt"
    quelle: "§ 35a Abs. 2 Satz 2 und Abs. 4 Satz 2 EStG"
    beschreibung: "Pflege-, Betreuungs- und Heimkosten sind ein eigener Abzweig mit eigener Voraussetzung (Heim in EU/EWR). Der Scope modelliert sie nicht."
  - bedingung: handwerker_nur_renovierung_erhaltung_modernisierung
    deckt_ab: "für Renovierungs-, Erhaltungs- und Modernisierungsmaßnahmen"
    quelle: "§ 35a Abs. 3 Satz 1 EStG"
    beschreibung: "Input-Semantik: `handwerker_arbeitskosten` betrifft nur Renovierungs-, Erhaltungs- und Modernisierungsmassnahmen."
  # Amtliche Testfaelle, Zitatanker gegen die eingefrorene BMF-Quelle geprueft.
  # Fuer den 4.000-Euro-Cap des Abs. 2 gibt es im BMF-Schreiben KEIN Beispiel;
  # ein Erwartungswert waere dort geraten. Der Fall fehlt bewusst.
  test_seed:
  - quelle: sources/bmf/bmf_p35a_2016-11-09.txt
    zitatanker: "Steuerermäßigung 2015 1.410 €"
    inputs: {minijob_aufwendungen: 2800, haushaltsnahe_dienstleistungen: 0, handwerker_arbeitskosten: 4500}
    expected: 1410.00
  - quelle: sources/bmf/bmf_p35a_2016-11-09.txt
    zitatanker: "20 % von 10.000 € (§ 35a Absatz 3 EStG) = 2.000 €, höchstens 1.200 €"
    inputs: {minijob_aufwendungen: 0, haushaltsnahe_dienstleistungen: 0, handwerker_arbeitskosten: 10000}
    expected: 1200.00
  signature:
    scope: Haushaltsnahe
    inputs:
      minijob_aufwendungen: money
      haushaltsnahe_dienstleistungen: money
      handwerker_arbeitskosten: money
    output: steuerermaessigung
  raster:
  - minijob_aufwendungen: 0
    haushaltsnahe_dienstleistungen: 1000
    handwerker_arbeitskosten: 0
  - minijob_aufwendungen: 0
    haushaltsnahe_dienstleistungen: 25000
    handwerker_arbeitskosten: 0
  - minijob_aufwendungen: 0
    haushaltsnahe_dienstleistungen: 0
    handwerker_arbeitskosten: 10000
  - minijob_aufwendungen: 2800
    haushaltsnahe_dienstleistungen: 0
    handwerker_arbeitskosten: 4500
  - minijob_aufwendungen: 3000
    haushaltsnahe_dienstleistungen: 5000
    handwerker_arbeitskosten: 3000
  exclude_rule_ids:
  - p35a_2_3_haushaltsnahe
