- rule_id: p101_mobilitaetspraemie
  hinweis: mobilitaetspraemie = (14 / 100) * min(entfernungspauschale_ab_21km, max(0, grundfreibetrag - zu_versteuerndes_einkommen)). 14 ist PROZENTWERT -> /100 in decimal, Cent-Schnitt zuletzt (Klasse 5 money x decimal). Bemessungsgrundlage = die Entfernungspauschale ab dem 21. km, BEGRENZT auf den Betrag um den das zvE den Grundfreibetrag unterschreitet (max(0, GFB - zvE)). grundfreibetrag = Andockung (§ 32a, VZ-versioniert; bei Ehegatten doppelter GFB + gemeinsames zvE in § 2-Integration).
  norm: § 101 EStG (Mobilitaetspraemie, 14 % der Bemessungsgrundlage)
