- rule_id: solzg_solidaritaetszuschlag
  norm: § 3, § 4 SolzG 1995
  status: handgeschrieben
  quellen:
  - typ: gesetz
    label: § 3 SolzG 1995 (Bemessungsgrundlage, Freigrenze)
    datei: sources/gesetze-im-internet/solzg_1995_p3_2026-07-11.txt
    zitatanker: unter Berücksichtigung von Freibeträgen nach § 32 Abs. 6 des Einkommensteuergesetzes
    auszug: Der Solidaritätszuschlag ist von einkommensteuerpflichtigen Personen nur zu erheben, wenn die Bemessungsgrundlage nach Absatz 1 Nummer 1 und 2, vermindert um die Einkommensteuer nach § 32d Absatz 3 und 4 des Einkommensteuergesetzes, 1. in den Fällen des § 32a Absatz 5 und 6 des Einkommensteuergesetzes 40 700 Euro, 2. in anderen Fällen 20 350 Euro übersteigt.
  - typ: gesetz
    label: § 4 SolzG 1995 (Zuschlagssatz 5,5 %, Milderungszone)
    datei: sources/gesetze-im-internet/solzg_1995_p4_2026-07-11.txt
    zitatanker: Der Solidaritätszuschlag beträgt 5,5 Prozent der Bemessungsgrundlage
    auszug: Der Solidaritätszuschlag beträgt 5,5 Prozent der Bemessungsgrundlage. Er beträgt nicht mehr als 11,9 Prozent des Unterschiedsbetrages zwischen der Bemessungsgrundlage, vermindert um die Einkommensteuer nach § 32d Absatz 3 und 4 des Einkommensteuergesetzes, und der nach § 3 Absatz 3, 4 und 5 jeweils maßgebenden Freigrenze. Bruchteile eines Cents bleiben außer Ansatz.
  geltungsbedingungen:
  - bedingung: veranlagung_zur_einkommensteuer
    deckt_ab: nur zu erheben, wenn die Bemessungsgrundlage
    quelle: § 3 Abs. 3 SolzG 1995
    beschreibung: MVP-Veranlagungsfall; Lohnsteuerabzug/Jahresausgleich/KapESt (Abs. 2a/4/4a/5) nicht modelliert.
  - bedingung: bemessungsgrundlage_ist_est_mit_kinderfreibetraegen
    deckt_ab: unter Berücksichtigung von Freibeträgen nach § 32 Abs. 6 des Einkommensteuergesetzes
    quelle: § 3 Abs. 2 SolzG 1995
    beschreibung: Input = ESt, die mit § 32 Abs. 6-Kinderfreibetraegen festzusetzen waere (SolZ-eigene Bemessung). Von der § 2-Integration.
  - bedingung: splitting_ist_veranlagungsergebnis
    deckt_ab: 40 700 Euro
    quelle: § 3 Abs. 3 Satz 1 Nr. 1 SolzG 1995
    beschreibung: splitting = Ergebnis des Veranlagungsverfahrens (§ 32a Abs. 5/6). Gleiche Ziel-ID wie p33.
  - bedingung: keine_abgeltungsteuer_nach_32d
    deckt_ab: nur zu erheben, wenn die Bemessungsgrundlage
    quelle: § 3 Abs. 3 / § 4 Satz 2 SolzG 1995
    beschreibung: MVP-AN ohne Kapitalertraege; § 32d-Abs-3/4-Sonderbehandlung entfaellt.
  rundung:
  - deckt_ab: Bruchteile eines Cents bleiben außer Ansatz
    zitatanker: Bruchteile eines Cents bleiben außer Ansatz
    quelle: § 4 Satz 3 SolzG 1995
    richtung: floor
  signature:
    scope: Solidaritaetszuschlag
    inputs:
      bemessungsgrundlage: money
      splitting: bool
    output: solidaritaetszuschlag
  test_seed:
  - quelle: sources/gesetze-im-internet/solzg_1995_p3_2026-07-11.txt
    zitatanker: 20 350 Euro
    herkunft: synthetisch
    rechenweg: BMG 20.350 = Freigrenze (nicht splitting), uebersteigt nicht -> 0.
    inputs:
      bemessungsgrundlage: 20350
      splitting: false
    expected: 0.0
  - quelle: sources/gesetze-im-internet/solzg_1995_p4_2026-07-11.txt
    zitatanker: nicht mehr als 11,9 Prozent des Unterschiedsbetrages
    herkunft: synthetisch
    rechenweg: 'BMG 20.351: Milderung 11,9 % x (20.351-20.350) = 0,119; Bruchteile Cent abgeschnitten -> 0,11.'
    inputs:
      bemessungsgrundlage: 20351
      splitting: false
    expected: 0.11
  - quelle: sources/gesetze-im-internet/solzg_1995_p4_2026-07-11.txt
