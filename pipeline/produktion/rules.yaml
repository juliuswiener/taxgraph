- rule_id: p15a_1_ausgleichsfaehiger_verlust
  norm: § 15a Abs. 1 S. 1 EStG (ausgleichsfähiger Verlust = Kapitalkonto-Grenze)
  hinweis: 'ausgleichsfaehiger_verlust = min(verlustanteil, max(kapitalkonto, 0)). Der Verlustanteil ist nur ausgleichsfähig, SOWEIT dadurch kein negatives Kapitalkonto entsteht oder sich erhöht - also nur bis zur Höhe des POSITIVEN Kapitalkontos. max(kapitalkonto, 0) floort ein bereits negatives Kapitalkonto auf 0 (dann nichts ausgleichsfähig); min kappt auf das positive Kapitalkonto. BOUNDARY (Klasse-2): die Doppel-Bedingung ''entsteht ODER sich erhöht'' ist KEIN Split, sondern das Floor+Cap-Encoding selbst (''entsteht'' = KK>=0 wird <0; ''erhöht sich'' = KK schon <0). ''soweit'' = graduell -> min, kein bool. kapitalkonto ist signiert (kann negativ hereinkommen). verlustanteil = positiver Betrag des Verlustanteils. Cent-genau. max darf als max-Operator ODER als ''wenn kapitalkonto > 0 dann kapitalkonto sonst 0'' formalisiert werden.'
  quellen:
  - typ: gesetz
    label: § 15a Abs. 1 S. 1 EStG (Verlustausgleich nur bis Kapitalkonto)
    datei: sources/gesetze-im-internet/estg_p15a_2026-07-14.txt
    zitatanker: darf weder mit anderen Einkünften aus Gewerbebetrieb noch mit Einkünften aus anderen Einkunftsarten ausgeglichen werden, soweit ein negatives Kapitalkonto des Kommanditisten entsteht oder sich erhöht
    auszug: Der einem Kommanditisten zuzurechnende Anteil am Verlust der Kommanditgesellschaft darf weder mit anderen Einkünften aus Gewerbebetrieb noch mit Einkünften aus anderen Einkunftsarten ausgeglichen werden, soweit ein negatives Kapitalkonto des Kommanditisten entsteht oder sich erhöht
  signature:
    scope: AusgleichsfaehigerVerlust
    inputs:
      verlustanteil: money
      kapitalkonto: money
    output: ausgleichsfaehiger_verlust
  raster:
  - verlustanteil: 6000
    kapitalkonto: 10000
