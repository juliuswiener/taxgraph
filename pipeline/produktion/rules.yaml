  # Doktrin: Signaturen tragen nur Sachverhalts-Inputs; eine Norm-Konstante darf der Aufrufer nie
  # verstellen. Der Wert kommt aus der §32a-Quelle (Verweis-Anker), nicht als Signatur-Input.
