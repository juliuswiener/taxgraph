- rule_id: p33b_pflege_pauschbetrag
  # hinweis-Kanal (Instructor-Freigabe 2026-07-13, Stufe-B Lauf 1): der hilflos-Override
  # (Abs. 6 S. 4 "auch") ist ein Konditional-VORRANG, kein Tabellenwert -> Hunger-Risiko
  # (Tabelle trug sich selbst, der Vorrang nicht). Ohne Pin prueft A die Pflegegrad-Staffel
  # VOR ist_hilflos und maskiert den Override (PG3+hilflos -> 1.100 statt 1.800).
  hinweis: 'ist_hilflos hat VORRANG vor der Pflegegrad-Staffel: bei ist_hilflos = wahr immer 1.800, unabhaengig vom Pflegegrad; die Pflegegrad-Staffel (PG2 600, PG3 1.100, PG4/5 1.800, sonst 0) gilt nur, wenn NICHT hilflos.'
  norm: § 33b Abs. 6 EStG (Pflege-Pauschbetrag, Pflegegrad-Staffel)
  quellen:
  - typ: gesetz
    label: § 33b Abs. 6 S. 3-4 EStG (Pflege-Pauschbetrag)
    datei: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    auszug: 'Als Pflege-Pauschbetrag wird gewährt: 1. bei Pflegegrad 2 600 Euro, 2. bei Pflegegrad 3 1 100 Euro, 3. bei Pflegegrad 4 oder 5 1 800 Euro. 4 Ein Pflege-Pauschbetrag nach Satz 3 Nummer 3 wird auch gewährt, wenn die gepflegte Person hilflos im Sinne des § 33b Absatz 3 Satz 4 ist.'
  geltungsbedingungen:
  - bedingung: pflegegrad_staffel
    deckt_ab: Als Pflege-Pauschbetrag wird gewährt
    quelle: § 33b Abs. 6 S. 3-4 EStG
    beschreibung: 'Lookup Pflegegrad -> Betrag: PG2 600, PG3 1.100, PG4/5 1.800. Pflegegrad unter 2 -> 0. ist_hilflos (Satz 4) -> 1.800 (Betrag wie PG4/5), auch bei niedrigerem/keinem Pflegegrad.'
  rundung: []
  signature:
    scope: PflegePauschbetrag
    inputs:
      pflegegrad: int
      ist_hilflos: bool
    output: pflege_pauschbetrag
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'Pflegegrad 2 -> 600.'
    inputs: {pflegegrad: 2, ist_hilflos: false}
    expected: 600.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'Pflegegrad 3 -> 1.100.'
    inputs: {pflegegrad: 3, ist_hilflos: false}
    expected: 1100.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'Pflegegrad 5 -> Stufe 4/5 -> 1.800.'
    inputs: {pflegegrad: 5, ist_hilflos: false}
    expected: 1800.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'WAECHTER hilflos-Override (Satz 4), Legal-Edge: Pflegegrad 1 aber hilflos -> 1.800 (beweist Unabhaengigkeit vom Pflegegrad).'
    inputs: {pflegegrad: 1, ist_hilflos: true}
    expected: 1800.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'WAECHTER hilflos-Override ueber echtem Staffelwert: Pflegegrad 3 (Staffel 1.100) + hilflos -> 1.800 (Override hebt an, nicht additiv).'
