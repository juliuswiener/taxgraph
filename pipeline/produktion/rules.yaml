- rule_id: p5_5_passiver_rap
  norm: § 5 Abs. 5 S. 1 Nr. 2 EStG (passiver Rechnungsabgrenzungsposten, Zeitanteiligkeit)
  hinweis: 'passiver_rap = einnahme * monate_nach_stichtag / monate_gesamt. SPIEGEL-Regel zu p5_5_aktiver_rap (C23), Passivseite: Einnahme VOR dem Abschlussstichtag, die Ertrag für eine bestimmte Zeit NACH dem Stichtag ist, wird zeitanteilig als passiver RAP abgegrenzt. KLASSE-5-Vermeidung: Division durch monate_gesamt ZULETZT (/12-Lehre), Cent-Schnitt am Ende, keine vorgerundete Monatsrate. Monate als int-Inputs. MONATSGRANULARITAET = KONVENTION (Wortlaut ''bestimmte Zeit'', nicht ''Monat''); Tagesgenauigkeit = Nachtrag. Boundary: monate_nach_stichtag = 0 -> 0. Keine Norm-Konstante im Code.'
  quellen:
  - typ: gesetz
    label: § 5 Abs. 5 S. 1 Nr. 2 EStG (passiver RAP, Ertrags-Zeitbezug)
    datei: sources/gesetze-im-internet/estg_p5_2026-07-14.txt
    zitatanker: Einnahmen vor dem Abschlussstichtag, soweit sie Ertrag für eine bestimmte Zeit nach diesem Tag darstellen
    auszug: Als Rechnungsabgrenzungsposten sind nur anzusetzen 1. auf der Aktivseite Ausgaben vor dem Abschlussstichtag, soweit sie Aufwand für eine bestimmte Zeit nach diesem Tag darstellen; 2. auf der Passivseite Einnahmen vor dem Abschlussstichtag, soweit sie Ertrag für eine bestimmte Zeit nach diesem Tag darstellen
