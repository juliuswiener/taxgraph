# Charge-8 Vermietung (Instructor-Freigabe 2026-07-13, reports/review/2026-07-13-charge8-vermietung-zuschnitt.md).
- rule_id: p7_4_gebaeude_afa
  # hinweis-Kanal (%-Wert-Leitlinie, §24a/§22-Praezedenz): der auszug nennt "Prozent", pinnt die
  # /100-Division nicht -> ohne Pin rechnet das Modell ak * satz ohne /100.
  hinweis: 'afa_satz_prozent ist ein PROZENTWERT (2 bedeutet 2 %, 3 bedeutet 3 %, 2,5 bedeutet 2,5 %). Die Gebaeude-AfA ist (afa_satz_prozent / 100) * gebaeude_ak; die Division durch 100 in decimal rechnen, Cent-Schnitt zuletzt.'
  norm: § 7 Abs. 4 EStG (lineare Gebaeude-AfA, Wohngebaeude-Saetze)
  quellen:
  - typ: gesetz
    label: § 7 Abs. 4 S. 1 Nr. 2 EStG (Wohngebaeude-AfA-Saetze 3/2/2,5 %)
    datei: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: nach dem 31. Dezember 2022 fertiggestellt worden sind, jährlich 3 Prozent
    auszug: 'bei Gebäuden, soweit sie die Voraussetzungen der Nummer 1 nicht erfüllen und die a) nach dem 31. Dezember 2022 fertiggestellt worden sind, jährlich 3 Prozent, b) vor dem 1. Januar 2023 und nach dem 31. Dezember 1924 fertiggestellt worden sind, jährlich 2 Prozent, c) vor dem 1. Januar 1925 fertiggestellt worden sind, jährlich 2,5 Prozent der Anschaffungs- oder Herstellungskosten'
  geltungsbedingungen:
  - bedingung: afa_satz_aus_fertigstellungskategorie
    deckt_ab: nach dem 31. Dezember 2022 fertiggestellt worden sind, jährlich 3 Prozent
    quelle: § 7 Abs. 4 S. 1 Nr. 2 EStG
    beschreibung: 'afa_satz_prozent ergibt sich aus der Fertigstellungs-Kategorie des Wohngebaeudes: nach 2022-12-31 = 3 %, 1925-2022 = 2 %, vor 1925 = 2,5 % (§ 7 Abs. 4 S. 1 Nr. 2 a/b/c). Die Kategorie-Zuordnung erfolgt in der § 2-Integration; hier kommt der Satz als Input (Andockung). gebaeude_afa = (afa_satz_prozent / 100) x gebaeude_ak. Betriebsgebaeude (Nr. 1, 3 %) = ausserhalb AN-nah/Vermietung.'
  rundung: []
  signature:
    scope: GebaeudeAfa
    inputs:
      gebaeude_ak: money
      afa_satz_prozent: decimal
    output: gebaeude_afa
  test_seed:
