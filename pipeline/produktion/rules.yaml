    auszug: Dieser beträgt jährlich 4 Prozent der Summe der in dem dem Kalenderjahr vorangegangenen Kalenderjahr
  - typ: gesetz
    label: § 86 Abs. 1 S. 2 EStG (Deckel 2100 minus Zulage)
    datei: sources/gesetze-im-internet/estg_p86_2026-07-13.txt
    zitatanker: jedoch nicht mehr als der in § 10a Absatz 1 Satz 1 genannte Höchstbetrag, vermindert um die Zulage nach den §§ 84 und 85
    auszug: jedoch nicht mehr als der in § 10a Absatz 1 Satz 1 genannte Höchstbetrag, vermindert um die Zulage nach den §§ 84 und 85
  - typ: gesetz
    label: § 86 Abs. 1 S. 4-5 EStG (Sockel 60, Sockel-hoeher)
    datei: sources/gesetze-im-internet/estg_p86_2026-07-13.txt
    zitatanker: Als Sockelbetrag sind ab dem Jahr 2005 jährlich 60 Euro zu leisten.
    auszug: Als Sockelbetrag sind ab dem Jahr 2005 jährlich 60 Euro zu leisten. 5 Ist der Sockelbetrag höher als der Mindesteigenbeitrag nach Satz 2, so ist der Sockelbetrag als Mindesteigenbeitrag zu leisten.
  geltungsbedingungen:
  - bedingung: vorjahres_einnahmen_beitragspflichtig
    deckt_ab: 4 Prozent der Summe der in dem dem Kalenderjahr vorangegangenen Kalenderjahr
    quelle: § 86 Abs. 1 S. 2 EStG
    beschreibung: 'vorjahres_einnahmen = die SUMME der vier Posten nach § 86 Abs1 S2 Nr1-4 (beitragspflichtige Einnahmen SGB VI + bezogene Besoldung/Amtsbezuege + Einnahmen § 10a Abs1 S1 Nr3/4 + bezogene Erwerbsminderungs-/Dienstunfaehigkeitsrente) des Vorjahres. Die Aggregation der vier Posten erfolgt in der § 2-Integration; vorjahres_einnahmen ist der bereits aggregierte Summenwert (die Regel summiert nicht selbst - konv, Instructor-Adjudikation msg1687 Item 4). Landwirte (Abs3), Auslandsbezug (Abs5), Entgelt-Sonderfaelle (Abs2 S2-3) = Nicht-Gegenstand.'
