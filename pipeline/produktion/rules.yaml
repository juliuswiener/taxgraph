- rule_id: p32d_1_kirchensteuer
  hinweis: 'KiSt-ermaessigte Abgeltung (§ 32d Abs 1 S 3-5), NICHT der glatte 25-%-Satz (das ist p32d_1_abgeltung). Rechenkern: kapital_steuer = (kapitaleinkuenfte - 4 * anrechenbare_auslaendische_steuer) / (4 + kirchensteuersatz). kirchensteuersatz ist bereits ein Dezimalsatz (0,09 bzw. 0,08 - Landessatz), NICHT durch 100 teilen. Die beiden 4er sind exakte Strukturkonstanten (NICHT /100). Cent-Schnitt zuletzt. Verwandter, hier NICHT abgebildeter Degenerationsfall (k=0, keine Kirchensteuerpflicht): § 32d Abs 1 S 2 laesst die q-Anrechnung unabhaengig von S 3-5 zu (kapital_steuer = kapitaleinkuenfte - anrechenbare_auslaendische_steuer); zu klein fuer eine eigene rule_id, seit KAP Stufe 3 adjazent in produkt/haut/api.py implementiert.'
  norm: § 32d Abs. 1 S. 3-5 EStG (KiSt-ermaessigte Abgeltungsteuer, Formel e-4q durch 4+k)
  quellen:
  - typ: gesetz
    label: § 32d Abs. 1 S. 4 EStG (Formel e-4q durch 4+k)
    datei: sources/gesetze-im-internet/estg_p32d_2026-07-13.txt
    zitatanker: e – 4 q
    auszug: Im Fall der Kirchensteuerpflicht ermäßigt sich die Steuer nach den Sätzen 1 und 2 um 25 Prozent der auf die Kapitalerträge entfallenden Kirchensteuer. 4 Die Einkommensteuer beträgt damit e – 4 q 4 + k . 5 Dabei sind „e“ die nach den Vorschriften des § 20 ermittelten Einkünfte, „q“ die nach Maßgabe des Absatzes 5 anrechenbare ausländische Steuer und „k“ der für die Kirchensteuer erhebende Religionsgesellschaft (Religionsgemeinschaft) geltende Kirchensteuersatz.
  geltungsbedingungen:
  - bedingung: kirchensteuerpflicht_besteht
    deckt_ab: Im Fall der Kirchensteuerpflicht
    quelle: § 32d Abs. 1 S. 3 EStG
    beschreibung: Die Formel (e-4q)/(4+k) gilt NUR bei Kirchensteuerpflicht des Steuerpflichtigen. Ohne KiSt-Pflicht gilt der glatte 25-%-Satz (p32d_1_abgeltung). Komplementaer zu dessen Bedingung keine_kirchensteuer_auf_kapitalertraege.
  - bedingung: keine_guenstigerpruefung_beantragt
    deckt_ab: beträgt 25 Prozent
    quelle: § 32d Abs. 1 i.V.m. Abs. 6 EStG
    beschreibung: Die Abgeltung (Abs 1) gilt, solange nicht die Guenstigerpruefung (Abs 6) beantragt ist (p32d_1_abgeltung-Praezedenz). Wird sie beantragt, unterliegen die Kapitaleinkuenfte dem tariflichen Verfahren.
  - bedingung: kapitaleinkuenfte_nicht_negativ
    deckt_ab: die nach den Vorschriften des § 20 ermittelten Einkünfte
    quelle: § 32d Abs. 1 S. 5 EStG i.V.m. § 20 Abs. 6
    beschreibung: e (= § 20-Einkuenfte) wird als nicht-negativ angenommen; negative Kapitaleinkuenfte laufen in den § 20-Abs6-Verlusttopf (p20_6), nicht in die Abgeltung.
  rundung: []
  signature:
    scope: KapitalAbgeltungKirchensteuer
    inputs:
      kapitaleinkuenfte: money
      anrechenbare_auslaendische_steuer: money
      kirchensteuersatz: decimal
    output: kapital_steuer
