- rule_id: p35c_sanierung_ermaessigung
  hinweis: 'satz = wenn ist_uebernaechstes_foerderjahr dann 6 sonst 7 (Prozentwert -> /100). hoechst = wenn ist_uebernaechstes_foerderjahr dann 12000 sonst 14000. sanierung_ermaessigung = min((satz/100) * sanierungsaufwendungen, hoechst). Division durch 100 in decimal, Cent-Schnitt zuletzt. Die Ermaessigung mindert die tarifliche ESt vermindert um sonstige Steuerermaessigungen (§ 35a-Andock-Reihenfolge) - Verrechnung ist § 2-Integration, NICHT diese Regel. WICHTIG: sanierungsaufwendungen enthaelt AUCH die Kosten der Bescheinigung nach Satz 7 (Abs1 S4 "gehoeren auch"), aber NICHT die Energieberater-Kosten (die kriegen 50 %, eigene Regel p35c_energieberater_ermaessigung).'
  norm: § 35c Abs. 1 EStG (Steuerermaessigung energetische Massnahmen, 7/6-Prozent-Staffel)
  quellen:
  - typ: gesetz
    label: § 35c Abs. 1 S. 1 EStG (7 %/7 %/6 %, Hoechst 14k/14k/12k)
    datei: sources/gesetze-im-internet/estg_p35c_2026-07-13.txt
    zitatanker: höchstens jedoch um je 14 000 Euro
    auszug: Für energetische Maßnahmen an einem in der Europäischen Union oder dem Europäischen Wirtschaftsraum belegenen zu eigenen Wohnzwecken genutzten eigenen Gebäude (begünstigtes Objekt) ermäßigt sich auf Antrag die tarifliche Einkommensteuer, vermindert um die sonstigen Steuerermäßigungen, im Kalenderjahr des Abschlusses der energetischen Maßnahme und im nächsten Kalenderjahr um je 7 Prozent der Aufwendungen des Steuerpflichtigen, höchstens jedoch um je 14 000 Euro und im übernächsten Kalenderjahr um 6 Prozent der Aufwendungen des Steuerpflichtigen, höchstens jedoch um 12 000 Euro für das begünstigte Objekt.
  geltungsbedingungen:
  - bedingung: objekt_aelter_zehn_jahre
    deckt_ab: bei der Durchführung der energetischen Maßnahme älter als zehn Jahre
    quelle: § 35c Abs. 1 S. 2 EStG
    beschreibung: Begünstigtes Objekt muss bei Massnahmen-Durchfuehrung aelter als 10 Jahre sein (Herstellungsbeginn massgebend).
  - bedingung: ausschliesslich_eigene_wohnzwecke
    deckt_ab: ausschließlich zu eigenen Wohnzwecken nutzt
    quelle: § 35c Abs. 2 EStG
    beschreibung: Gebaeude im jeweiligen Kalenderjahr ausschliesslich zu eigenen Wohnzwecken genutzt (unentgeltliche Teilueberlassung unschaedlich).
  - bedingung: kein_doppelabzug_ba_wk_sa_agb
    deckt_ab: als Betriebsausgaben, Werbungskosten, Sonderausgaben oder außergewöhnliche Belastungen berücksichtigt worden sind
    quelle: § 35c Abs. 3 S. 1 EStG
    beschreibung: Keine Ermaessigung soweit Aufwendungen bereits als BA/WK/SA/agB beruecksichtigt.
  - bedingung: keine_10f_35a_oeffentliche_foerderung
    deckt_ab: eine Steuerbegünstigung nach § 10f oder eine Steuerermäßigung nach § 35a in Anspruch genommen wird
    quelle: § 35c Abs. 3 S. 2 EStG
    beschreibung: 'Doppelfoerderungs-Sperre: kein § 10f/§ 35a, keine oeffentlich gefoerderte Massnahme (zinsverbilligte Darlehen/steuerfreie Zuschuesse).'
  - bedingung: rechnung_und_zahlung_aufs_konto
    deckt_ab: die Zahlung auf das Konto des Erbringers der Leistung erfolgt ist
    quelle: § 35c Abs. 4 EStG
    beschreibung: Rechnung (deutsch, Massnahme+Arbeitsleistung+Objektadresse) + unbare Zahlung aufs Konto des Leistungserbringers.
  - bedingung: fachunternehmen_bescheinigung
    deckt_ab: nach amtlich vorgeschriebenem Muster erstellte Bescheinigung des ausführenden Fachunternehmens
    quelle: § 35c Abs. 1 S. 6-7 EStG
    beschreibung: Ausfuehrung durch Fachunternehmen + Bescheinigung nach amtlichem Muster (Voraussetzungen S1-3 + Rechtsverordnung Abs7 dem Grunde+Hoehe nach).
  - bedingung: objekt_hoechstbetrag_40k_nicht_ausgeschoepft
    deckt_ab: je begünstigtes Objekt beträgt der Höchstbetrag der Steuerermäßigung 40 000 Euro
    quelle: § 35c Abs. 1 S. 5 EStG
    beschreibung: 'Objekt-Lebensdauer-Deckel 40.000 EUR ueber alle Massnahmen + alle Jahre. Kumulation = § 2/VZ-State (analog § 10d Abs4), hier als Vorbedingung deklariert: der 40k-Deckel darf durch die VZ-Ermaessigung nicht ueberschritten werden. Rechnerisch im Einzelfall redundant (14+14+12=40).'
