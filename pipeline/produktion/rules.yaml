- rule_id: p34_1_s3_fuenftel_negativ
  hinweis: 'est_ao = 5 * est_ein_fuenftel_zve. est_ein_fuenftel_zve = die auf ein Fünftel des zu versteuernden Einkommens entfallende ESt (Tarif-Andockung § 31/§ 32b-Muster, INPUT - KEIN Selbst-Tarif, KEINE Tariffunktion in dieser Regel). Faktor 5 = exakte Struktur-Konstante (NICHT /100). SONDERPFAD § 34 Abs. 1 S. 3 - verbleibendes zvE (zvE minus ao-Einkuenfte) negativ UND zvE positiv; komplementaer zu p34_fuenftel_ao_est (S. 2, verbleibendes zvE >= 0), Dispatch in der § 2-Integration nach Vorzeichen. WICHTIG - im S.-3-Fall ist die TARIFLICHE ESt bereits das Fuenffache GESAMT (kein est_verbleibendes-Summand daneben, da verbleibendes zvE negativ -> Grundbetrag 0); die Integration setzt est_gesamt = est_ao ohne Addition. § 6b/§ 6c-Ausschluss (S. 4) = benannter Nachtrag.'
  norm: § 34 Abs. 1 S. 3 EStG (Fuenftelregelung Sonderpfad - negatives verbleibendes zvE)
  quellen:
  - typ: gesetz
    label: § 34 Abs. 1 S. 3 EStG (Sonderpfad negatives verbleibendes zvE)
    datei: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: so beträgt die Einkommensteuer das Fünffache der auf ein Fünftel des zu versteuernden Einkommens entfallenden Einkommensteuer
    auszug: Ist das verbleibende zu versteuernde Einkommen negativ und das zu versteuernde Einkommen positiv, so beträgt die Einkommensteuer das Fünffache der auf ein Fünftel des zu versteuernden Einkommens entfallenden Einkommensteuer.
  geltungsbedingungen:
  - bedingung: verbleibendes_zve_negativ_zve_positiv
    deckt_ab: Ist das verbleibende zu versteuernde Einkommen negativ und das zu versteuernde Einkommen positiv
    quelle: § 34 Abs. 1 S. 3 EStG
    beschreibung: 'Anwendungsfall S.3 - verbleibendes zvE (zvE minus ao) negativ UND zvE positiv. Komplementaer zu p34_fuenftel_ao_est (verbleibendes zvE >= 0); Dispatch nach Vorzeichen in der § 2-Integration.'
  - bedingung: fuenffaches_ein_fuenftel_zve
    deckt_ab: beträgt die Einkommensteuer das Fünffache der auf ein Fünftel des zu versteuernden Einkommens entfallenden Einkommensteuer
    quelle: § 34 Abs. 1 S. 3 EStG
    beschreibung: 'est_ao = 5 x der auf ein Fuenftel des zvE entfallenden ESt; est_ein_fuenftel_zve = Tarif(zvE/5) kommt als Input aus der Tarif-Andockung. Im S.3-Fall ist dies die tarifliche Gesamt-ESt (Grundbetrag 0).'
