    auszug: Vorsorgeaufwendungen im Sinne des Absatzes 1 Nummer 3 und 3a können je Kalenderjahr insgesamt bis 2 800 Euro abgezogen werden. 2 Der Höchstbetrag beträgt 1 900 Euro bei Steuerpflichtigen, die ganz oder teilweise ohne eigene Aufwendungen einen Anspruch auf vollständige oder teilweise Erstattung oder Übernahme von Krankheitskosten haben oder für deren Krankenversicherung Leistungen im Sinne des § 3 Nummer 9, 14, 57 oder 62 erbracht werden.
