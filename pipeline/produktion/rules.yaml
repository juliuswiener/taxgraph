    rechenweg: 'vGA + verdeckte Einlage: 500.000 + 80.000 (vGA, Abs. 3 S. 2 hinzu) - 30.000 (verd. Einlage, Abs. 3 S. 3 ab) = 550.000,00.'
    inputs:
      gewinn_estg: 500000
