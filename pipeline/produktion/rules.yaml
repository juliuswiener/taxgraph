  geltungsbedingungen:
  - bedingung: einkommen_statt_gewinn
    deckt_ab: anstelle des maßgeblichen Gewinns das maßgebliche Einkommen tritt
    quelle: § 8a Abs. 1 Satz 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8a_2026-07-16.txt
    beschreibung: 'Fuer Koerperschaften tritt in § 4h Abs. 1 Satz 2 EStG das maßgebliche EINKOMMEN an die Stelle des maßgeblichen Gewinns. Die EBITDA-Basis wird daher aus dem Einkommen (nicht dem Gewinn) hergeleitet.'
  - bedingung: massgebliches_einkommen_ohne_4h_10d_und_spenden
    deckt_ab: Maßgebliches Einkommen ist das nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes ermittelte Einkommen mit Ausnahme der §§ 4h und 10d des Einkommensteuergesetzes und des § 9 Abs. 1 Nr. 2 dieses Gesetzes
    quelle: § 8a Abs. 1 Satz 2 KStG
    datei: sources/gesetze-im-internet/kstg_p8a_2026-07-16.txt
    beschreibung: 'massgebliches_einkommen = nach EStG/KStG ermitteltes Einkommen OHNE §§ 4h und 10d EStG und OHNE § 9 Abs. 1 Nr. 2 KStG (Spenden) = einkommen_vor_spenden der K-Kette (nach § 8b/§ 10, vor § 9/§ 10d/§ 4h). State-Input; die Ausnahmen sind bereits beruecksichtigt und duerfen hier nicht erneut abgezogen werden.'
  - bedingung: ebitda_bemessungsgrundlage_hinzurechnung
    deckt_ab: verrechenbare EBITDA ist 30 Prozent des um die Zinsaufwendungen und um die nach § 6 Absatz 2 Satz 1 abzuziehenden, nach § 6 Absatz 2a Satz 2 gewinnmindernd aufzulösenden und nach § 7 abgesetzten Beträge erhöhten und um die Zinserträge verminderten maßgeblichen Gewinns
    quelle: § 4h Abs. 1 Satz 2 EStG (via § 8a KStG)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'ebitda_basis = massgebliches_einkommen + Zinsaufwendungen + AfA/GWG/Sammelposten (§ 6 Abs. 2/2a, § 7) - Zinsertraege. Nur die Bemessungsgrundlage; die 30-%-Multiplikation und der Abzugstest sind N1 (§ 4h Abs. 1). abschreibungen als Input (Herleitung der AfA nicht Gegenstand).'
  - bedingung: gesellschafter_fremdfinanzierung_abs3_nachtrag
    deckt_ab: § 4h Absatz 2 Satz 1 Buchstabe c des Einkommensteuergesetzes ist nur anzuwenden, wenn die Vergütungen für Fremdkapital
    quelle: § 8a Abs. 3 KStG
    datei: sources/gesetze-im-internet/kstg_p8a_2026-07-16.txt
