- rule_id: p7_2_degressive_afa
  norm: § 7 Abs. 2 EStG (degressive AfA, fallende Jahresbeträge, Fenster-Kohorten)
  hinweis: 'jahres_afa = restbuchwert * min(faktor_max * (100 / nutzungsdauer), prozent_cap) / 100. Degressive AfA in fallenden Jahresbeträgen (Wahlrecht ''statt'' linearer AfA). linear_prozent = 100 / nutzungsdauer WIRD IN DER REGEL gerechnet (nutzungsdauer = int-Input, kein linear_prozent-Schmuggel zum Caller; C17-ND-Präzedenz). degressive_prozent = min(faktor_max * linear_prozent, prozent_cap). faktor_max (2 oder 3) und prozent_cap (20 oder 30) kommen aus der Anschaffungsfenster-Kohorte (params) als Inputs (Konstanten-Doktrin). KLASSE-5: /100-Encoding, Cent-Schnitt ZULETZT (money * decimal). restbuchwert = Buchwert zu Jahresbeginn (State-Input, Mehrjahres-Fortschreibung + §7 Abs3 Wechsel = Nachtrag). Keine Norm-Konstante im Code.'
