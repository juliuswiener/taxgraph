- rule_id: p34c_2_abzug_statt_anrechnung
  norm: § 34c Abs. 2 EStG (Abzug ausländischer Steuer statt Anrechnung)
  hinweis: abzug = auslaendische_steuer_auf_ausl_einkuenfte. Statt der Anrechnung (Abs1) wird die ausl. Steuer auf Antrag bei der Ermittlung der Einkünfte abgezogen, soweit sie auf ausl. (nicht steuerfreie) Einkünfte entfällt. Der Abzugsbetrag = die auf ausl. Einkünfte entfallende ausl. Steuer (Input bereits so bemessen); das Wahlrecht (Abzug STATT Anrechnung) ist Geltungsbedingung, schliesst Regel 1 aus. Cent-genau.
