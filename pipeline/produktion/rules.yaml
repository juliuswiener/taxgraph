# Phase-3 Produktions-Manifest, erste Charge.
#
# Die 10 Regeln aus dem G2-Task-Set, jetzt als echte Regeln: Norm-Texte sind
# eingefroren (sha256, `make sources-check`), Signaturen existieren, und die
# scope_gaps der Kaskade liefern den Zuschnitt-Backlog fuer die naechste Charge
# gleich mit (reports/formalisierungs-backlog.md).
#
# Besetzung: eingefroren nach G2 (pipeline/models.yaml). Keine Paarungen mehr.
#
# DoD je Regel (unveraendert):
#   1. Norm-Text eingefroren, Zitatanker verifizierbar
#   2. Doppelformalisierung A/B, extensionale Aequivalenz auf dem Raster
#   3. Round-Trip-Diff ohne Abweichung und ohne stille Zusatzannahme
#   4. scope_gap: kein Norm-Teil der Klasse `wirkt_hinein`
#   5. Clerk-Test-Gate GRUEN. Das Gate ist Pflicht. `test_seed: none` laesst es
#      fallen. Entweder EStH/BMF-Rechenbeispiel mit Zitatanker, oder synthetische
#      Faelle, die Julius im Review abgesegnet hat (`quelle: review/<datum>.md`).
#      Nie LLM-erfundene Erwartungswerte.
#   6. Human-Review durch Julius, dann Merge nach rules/estg/
#
# `test_seed: none` heisst hier NICHT "n/a" wie im Bake-off, sondern
# "noch offen -> Gate faellt". Genau so soll es sein, bis die Seeds da sind.
#
# ---------------------------------------------------------------------------
# ABGRENZUNGSREGEL: Signatur vs. Geltungsbedingung vs. Backlog
# (Julius, 2026-07-09. Gilt fuer jeden Zuschnitt, nicht nur fuer diese Charge.)
#
# 1. SIGNATUR
#    Alles, was den berechneten Betrag VARIIERT: Betraege, Kategorien, die Caps
#    oder Saetze selektieren, Zeitraeume.
#
# 2. GELTUNGSBEDINGUNG
#    Binaere Anwendbarkeitsvoraussetzungen, die im Standardfall erfuellt sind und
#    den Betrag nicht variieren, sondern die Regel an- und ausschalten.
#    Maschinenlesbar (`bedingung`, `deckt_ab`, `quelle`); Phase 5 fragt sie ab,
#    und die Engine darf die Regel nicht feuern, wenn eine verletzt ist.
#
# 3. BACKLOG
#    Verzweigungen mit eigener Tabellen- oder Fremdquellen-Logik. Muster: die
#    Auslandspauschalen des § 9 Abs. 4a, fuer die das BMF laenderweise eigene
#    Betraege bekanntgibt.
#
# Die Grenze zwischen 2 und 3 verlaeuft dort, wo eine externe Datenquelle noetig
# wuerde. Deshalb bleibt `im_inland` bei § 9 Abs. 1 S. 3 Nr. 5 in der Signatur
# (ein einzelner Cap im selben Normsatz), waehrend es bei § 9 Abs. 4a eine
# Geltungsbedingung ist (BMF-Laendertabellen).
# ---------------------------------------------------------------------------
#
# Stand der Seed-Recherche (2026-07-09), Quellen eingefroren und sha256-geprueft:
#
#   amtliches Rechenbeispiel gefunden, Zitatanker gegen den eingefrorenen Text
#   verifiziert:
#     p9_4a_verpflegungsmehraufwand  BMF Reisekosten 25.11.2020, Bsp. 48
#     p33_3_zumutbare_belastung      BFH 19.01.2017 - VI R 75/14
#     p35a_2_3_haushaltsnahe         BMF zu § 35a 09.11.2016
#
#   KEIN amtliches Rechenbeispiel auffindbar -> synthetische Faelle noetig, die
#   Julius im Review absegnet (`quelle: review/<datum>.md`). Bis dahin faellt das
#   Test-Gate, und das ist die richtige Anzeige:
#     p9_1_3_nr5_doppelte_haushaltsfuehrung   (BMF Bsp. 63/64 rechnen mit
#         unterjaehrig wechselnder Miete bzw. Ehegatten - passt nicht auf die
#         Signatur, die eine konstante Monatsmiete kennt)
#     p9_1_3_nr5a_uebernachtung               (BMF Bsp. 68 ist szenariobasiert,
#         ohne Euro-Rechnung)
#     p9_1_3_nr6_arbeitsmittel                (R 9.12 LStR nur qualitativ)
#     p9_1_3_nr7_afa                          (nur Verweis auf § 6 Abs. 2 EStG)
#     p9_6_erstausbildung_abgrenzung          (nur Legaldefinition)
#     p10_1_7_berufsausbildung                (BMF nur qualitativ)
#     p24b_entlastungsbetrag                  (BMF 23.11.2022 rechnet mit dem
#         Grundbetrag 4.008 EUR der Jahre 2020-2022, nicht mit den heute
#         geltenden 4.260 EUR - als Erwartungswert unbrauchbar)

regeln:
- rule_id: p9_1_3_nr5_doppelte_haushaltsfuehrung
  norm: § 9 Abs. 1 S. 3 Nr. 5 EStG
  norm_source: sources/gesetze-im-internet/estg_p9_abs1nr5_2026-07-09.txt
  struktur:
  - monats_cap_1000
  - bedingungen
  - inland_ausland_fallunterscheidung
  # `im_inland` bleibt in der Signatur: anders als bei § 9 Abs. 4a, wo Ausland
  # ganze BMF-Laendertabellen erfordert, ist es hier ein einzelner Cap im selben
  # Normsatz. Die Ausnahme von der Auslandsgrenze (Dienst-/Werkswohnung) und die
  # Tatbestandsvoraussetzungen bleiben ausserhalb -> Geltungsbedingungen.
  geltungsbedingungen:
  - bedingung: beruflich_veranlasste_doppelte_haushaltsfuehrung
    deckt_ab: "notwendige Mehraufwendungen, die einem Arbeitnehmer wegen einer beruflich veranlassten doppelten Haushaltsführung entstehen"
    quelle: "§ 9 Abs. 1 S. 3 Nr. 5 Satz 1 EStG"
    beschreibung: "Der Scope setzt voraus, dass eine beruflich veranlasste doppelte Haushaltsfuehrung dem Grunde nach vorliegt."
  - bedingung: eigener_hausstand_ausserhalb_des_taetigkeitsorts
    deckt_ab: "Eine doppelte Haushaltsführung liegt nur vor, wenn der Arbeitnehmer außerhalb des Ortes seiner ersten Tätigkeitsstätte einen eigenen Hausstand unterhält"
    quelle: "§ 9 Abs. 1 S. 3 Nr. 5 Satz 2 EStG"
    beschreibung: "Tatbestandsvoraussetzung, die der Scope nicht modelliert."
  - bedingung: finanzielle_beteiligung_an_lebensfuehrungskosten
    deckt_ab: "Das Vorliegen eines eigenen Hausstandes setzt das Innehaben einer Wohnung sowie eine finanzielle Beteiligung an den Kosten der Lebensführung voraus"
    quelle: "§ 9 Abs. 1 S. 3 Nr. 5 Satz 3 EStG"
    beschreibung: "Tatbestandsvoraussetzung, die der Scope nicht modelliert."
  - bedingung: keine_verpflichtende_dienst_oder_werkswohnung
    deckt_ab: "die Grenze von 2 000 Euro bei einer Unterkunft im Ausland gilt nicht, wenn eine Dienst- oder Werkswohnung verpflichtend"
    quelle: "§ 9 Abs. 1 S. 3 Nr. 5 Satz 4 Halbsatz 2 EStG"
    beschreibung: "Bei verpflichtend und zweckgebunden genutzter Dienst-/Werkswohnung entfaellt die 2.000-Euro-Kappung im Ausland. Der Scope kennt die Wohnungsart nicht."
  # Absegnung Julius 2026-07-09 (reports/review/2026-07-09-synthetische-testfaelle.md),
  # Antwort 1, alle vier Faelle. Auflage: Zitatanker der Auslandsgrenze verlaengert -
  # "2 000 Euro" allein kommt im Normtext zweimal vor (Cap und Ausnahmesatz) und
  # haette auf die falsche Stelle zeigen koennen.
  test_seed:
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "höchstens 1 000 Euro im Monat bei einer Unterkunft im Inland"
    herkunft: synthetisch
    rechenweg: "Monatsmiete 800 EUR liegt unter der Kappungsgrenze; 800 x 12 = 9.600,00 EUR."
    inputs: {unterkunftskosten_monat: 800, monate: 12, im_inland: true}
    expected: 9600.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "höchstens 1 000 Euro im Monat bei einer Unterkunft im Inland"
    herkunft: synthetisch
    rechenweg: "Monatsmiete 1.400 EUR wird auf 1.000 EUR gekappt; 1.000 x 12 = 12.000,00 EUR."
    inputs: {unterkunftskosten_monat: 1400, monate: 12, im_inland: true}
    expected: 12000.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "höchstens 1 000 Euro im Monat bei einer Unterkunft im Inland"
    herkunft: synthetisch
    rechenweg: "Kappung wirkt je Monat, nicht auf das Jahr: 1.000 x 6 = 6.000,00 EUR."
    inputs: {unterkunftskosten_monat: 1400, monate: 6, im_inland: true}
    expected: 6000.00
  - quelle: reports/review/2026-07-09-synthetische-testfaelle.md
    zitatanker: "höchstens 2 000 Euro im Monat bei einer Unterkunft im Ausland"
    herkunft: synthetisch
    rechenweg: "Auslandsunterkunft: Kappung bei 2.000 EUR je Monat; 2.000 x 12 = 24.000,00 EUR."
    inputs: {unterkunftskosten_monat: 2500, monate: 12, im_inland: false}
    expected: 24000.00
  signature:
    scope: DoppelteHaushaltsfuehrung
    inputs:
      unterkunftskosten_monat: money
      monate: int
      im_inland: bool
    output: abziehbare_unterkunftskosten
  raster:
  - unterkunftskosten_monat: 800
    monate: 12
    im_inland: true
  - unterkunftskosten_monat: 1400
    monate: 12
    im_inland: true
  - unterkunftskosten_monat: 1400
    monate: 6
    im_inland: false
  - unterkunftskosten_monat: 2500
    monate: 12
    im_inland: false
  exclude_rule_ids:
  - p9_1_3_nr5_doppelte_haushaltsfuehrung
- rule_id: p9_1_3_nr5a_uebernachtung
  norm: § 9 Abs. 1 S. 3 Nr. 5a EStG
  # Charge 1: 5 wirkt_hinein-Norm-Teile bei null unabhaengigen. Der Judge sagt
  # damit, dass die Signatur den Ausschnitt verfehlt, nicht dass das Modell
  # schlecht formalisiert. Kein Approval-Versuch; Neuschnitt in Charge 2.
  status: zuschnitt_offen
  norm_source: sources/gesetze-im-internet/estg_p9_abs1nr5a_2026-07-09.txt
  struktur:
  - ist_kosten
  - 48_monats_grenze
  - neubeginn_regel
  test_seed: none
  signature:
    scope: Uebernachtungskosten
    inputs:
      uebernachtungskosten: money
      monate_taetigkeit: int
    output: abziehbare_uebernachtungskosten
  raster:
  - uebernachtungskosten: 3000
    monate_taetigkeit: 12
  - uebernachtungskosten: 3000
    monate_taetigkeit: 60
  - uebernachtungskosten: 500
    monate_taetigkeit: 48
  exclude_rule_ids:
  - p9_1_3_nr5a_uebernachtung
- rule_id: p9_4a_verpflegungsmehraufwand
  norm: § 9 Abs. 4a EStG
  # FREIGABE BLOCKIERT (2026-07-10, Befund der Stabilitaetsmessung).
  # Der gespeicherte Report zeigt roundtrip=PASS bei 5/5 gemappten Annahmen. Drei
  # frische Judge-Laeufe mit IDENTISCHEM Input liefern das nicht wieder: einmal
  # Truncation am 12288-Token-Limit, einmal 2 Abweichungen / 3 undeklarierte
  # Annahmen, einmal 1 Abweichung / 1 undeklarierte. Kein einziger Lauf ergab
  # roundtrip=PASS.
  #
  # Der gruene Zustand dieser Regel war ein Zufallstreffer der Judge-Streuung, kein
  # Befund ueber die Formalisierung. Er wird nicht stehengelassen, bis entschieden
  # ist, wie mit der Streuung umzugehen ist (reports/nachtschicht/entscheidungen-offen.md).
  # Messdaten: reports/nachtschicht/judge-stabilitaet.json
  freigabe: blockiert
  freigabe_grund: "Judge-Verdikt nicht reproduzierbar: 3 Laeufe, 3 verschiedene Ergebnisse, kein roundtrip=PASS."
  norm_source: sources/gesetze-im-internet/estg_p9_abs4a_2026-07-09.txt
  struktur:
  - staffel_nach_abwesenheit
  - dreimonatsfrist
  - prozentuale_kuerzung
  test_seed:
  # BMF-Schreiben Reisekosten v. 25.11.2020, Rz 73-77, Beispiel 48 (dreitaegige
  # Auswaertstaetigkeit). Die Kuerzung wegen Mahlzeitengestellung liegt ausserhalb
  # der Signatur; die ungekuerzten Tagesbetraege sind woertlich belegt.
  - quelle: sources/bmf/bmf_reisekosten_2020-11-25.txt
    zitatanker: "Zwischentag: 28,00 \u20ac"
    inputs: {abwesenheit_stunden: 24, mit_uebernachtung: true, an_oder_abreisetag: false, monate_am_ort: 1}
    expected: 28.00
  - quelle: sources/bmf/bmf_reisekosten_2020-11-25.txt
    zitatanker: "Anreisetag: 14,00 \u20ac"
    inputs: {abwesenheit_stunden: 8, mit_uebernachtung: true, an_oder_abreisetag: true, monate_am_ort: 1}
    expected: 14.00
  # Geltungsbereich der Teilformalisierung, maschinenlesbar. Jeder Norm-Teil, den
  # der Judge als `wirkt_hinein` meldet, muss hier abgedeckt sein - sonst faellt
  # das geltungsbereich-Gate. Die Relevanzpropagation (Phase 5) stellt diese
  # Bedingungen als Fragen; die Engine darf die Regel nicht feuern, wenn eine
  # verletzt ist. Die Freigabe gilt NUR mit diesen Bedingungen.
  geltungsbedingungen:
  - bedingung: auswaertige_berufliche_taetigkeit
    deckt_ab: "Wird der Arbeitnehmer außerhalb seiner Wohnung und ersten Tätigkeitsstätte beruflich tätig"
    quelle: "§ 9 Abs. 4a Satz 2 EStG"
    beschreibung: "Die Regel gilt nur, wenn ueberhaupt eine auswaertige berufliche Taetigkeit vorliegt."
  - bedingung: uebernachtung_oder_eintaegig_ueber_acht_stunden
    deckt_ab:
    - "beginnt die auswärtige berufliche Tätigkeit an einem Kalendertag und endet am nachfolgenden Kalendertag ohne Übernachtung"
    - "wenn der Arbeitnehmer an diesem, einem anschließenden oder vorhergehenden Tag außerhalb seiner Wohnung übernachtet"
    quelle: "§ 9 Abs. 4a Satz 3 Nr. 2 und Satz 5 EStG"
    beschreibung: "Der Scope kennt An-/Abreisetag und Abwesenheitsdauer, aber nicht die Mitternachtsregel fuer eintaegige Reisen ohne Uebernachtung."
  - bedingung: taetigkeit_im_inland
    deckt_ab: "Bei einer Tätigkeit im Ausland treten an die Stelle der Pauschbeträge"
    quelle: "§ 9 Abs. 4a Satz 5 EStG"
    beschreibung: "Nur Inlandspauschalen. Auslandspauschbetraege werden vom BMF laenderweise bekanntgemacht und sind nicht modelliert."
  - bedingung: keine_mahlzeitengestellung
    deckt_ab:
    - "eine Mahlzeit zur Verfügung gestellt"
    - "Hat der Arbeitnehmer für die Mahlzeit ein Entgelt gezahlt"
    quelle: "§ 9 Abs. 4a Saetze 8 bis 10 EStG"
    beschreibung: "Bei Mahlzeitengestellung ist die Pauschale zu kuerzen (20/40/40 %). Der Scope kennt die Mahlzeiten nicht."
  - bedingung: keine_unterbrechung_mit_neubeginn
    deckt_ab: "Eine Unterbrechung der beruflichen Tätigkeit an derselben Tätigkeitsstätte führt zu einem Neubeginn"
    quelle: "§ 9 Abs. 4a Satz 7 EStG"
    beschreibung: "Eine Unterbrechung von mindestens vier Wochen setzt die Dreimonatsfrist neu in Gang. Der Scope kennt nur `monate_am_ort`, nicht die Unterbrechungshistorie."
  - bedingung: keine_steuerfreien_verpflegungserstattungen
    deckt_ab: "Erhält der Arbeitnehmer steuerfreie Erstattungen für Verpflegung"
    quelle: "§ 9 Abs. 4a Satz 12 EStG"
    beschreibung: "Steuerfreie Erstattungen schliessen den Werbungskostenabzug insoweit aus."
  signature:
    scope: Verpflegungsmehraufwand
    inputs:
      abwesenheit_stunden: int
      mit_uebernachtung: bool
      an_oder_abreisetag: bool
      monate_am_ort: int
    output: verpflegungspauschale
  raster:
  - abwesenheit_stunden: 24
    mit_uebernachtung: true
    an_oder_abreisetag: false
    monate_am_ort: 1
  - abwesenheit_stunden: 10
    mit_uebernachtung: false
    an_oder_abreisetag: false
    monate_am_ort: 1
  - abwesenheit_stunden: 6
    mit_uebernachtung: false
    an_oder_abreisetag: false
    monate_am_ort: 1
  - abwesenheit_stunden: 24
    mit_uebernachtung: true
    an_oder_abreisetag: false
    monate_am_ort: 5
  exclude_rule_ids:
  - p9_4a_verpflegungsmehraufwand
- rule_id: p9_1_3_nr6_arbeitsmittel
  norm: § 9 Abs. 1 S. 3 Nr. 6 EStG
  # Zurueckgestellt (Julius, 2026-07-09). Isoliert eine Identitaetsfunktion: kein
  # Cap, keine Schwelle. Ein Test darauf prueft nichts. Nr. 6 verweist auf Nr. 7
  # ("Nummer 7 bleibt unberuehrt"); Neuschnitt in Charge 2 als gemeinsame Regel.
  status: zuschnitt_offen
  norm_source: sources/gesetze-im-internet/estg_p9_abs1nr6_2026-07-09.txt
  struktur:
  - einfacher_abzug
  - verweis_auf_nr7
  test_seed: none
  signature:
    scope: Arbeitsmittel
    inputs:
      aufwendungen: money
    output: abziehbar
  raster:
