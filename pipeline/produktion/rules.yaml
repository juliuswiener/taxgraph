    quelle: § 4h Abs. 2 Satz 1 lit. a EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'FREIGRENZE (nicht Freibetrag): nettozinsaufwand < 3.000.000 schaltet § 4h Abs. 1 komplett aus (voller Abzug). Strikt "<" ("weniger als"). Alles-oder-nichts: bei Erreichen/Ueberschreiten der 3 Mio unterliegt der GESAMTE Nettozinsaufwand dem Mechanismus (abziehbar_kern), es wird kein 3-Mio-Freibetrag abgezogen. Kante 2.999.999 (voll) vs. 3.000.000 (Mechanismus).'
  - bedingung: ausnahme_b_keine_nahestehende_person
    deckt_ab: keiner Person im Sinne des § 1 Absatz 2
    quelle: § 4h Abs. 2 Satz 1 lit. b EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'lit b als bool-Input keine_konzern_oder_nahestehende_b: der Betrieb steht keiner Person iSd § 1 Abs. 2 AStG nahe und hat keine Auslands-Betriebsstaette -> Ausnahme. Qualifikation = Sachverhalts-Vorfrage, keine Nahestehenden-/Betriebsstaetten-Pruefung modelliert.'
  - bedingung: ausnahme_c_eigenkapital_escape
    deckt_ab: gleich hoch oder höher ist als die des Konzerns (Eigenkapitalvergleich)
    quelle: § 4h Abs. 2 Satz 1 lit. c EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'lit c als bool-Input eigenkapital_escape_c: Escape-Klausel, EK-Quote des Betriebs >= EK-Quote des Konzerns (2-Prozentpunkte-Toleranz). Als Vorfrage-bool; die EK-Quoten-/IFRS-/Ueberleitungs-Ermittlung (Abs. 2 S. 2-16) + § 8a-KStG-Modifikation (N3) = Nachtrag.'
  - bedingung: kern_abziehbar_aus_n1
    deckt_ab: sind abziehbar in Höhe des Zinsertrags, darüber hinaus nur bis zur Höhe des verrechenbaren EBITDA
    quelle: § 4h Abs. 1 Satz 1 EStG (via N1)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'abziehbar_kern = Ergebnis der Charge N1 (§ 4h Abs. 1 Zinsschranke-Kern) als Input. Greift keine Ausnahme des Abs. 2, gilt abziehbar_final = abziehbar_kern; die Kern-Berechnung selbst ist N1 (nicht hier).'
  - bedingung: freigrenze_zinsvortrag_anteiligkeit_s7_nachtrag
    deckt_ab: Absatz 2 findet keine Anwendung, soweit Zinsaufwendungen aufgrund eines Zinsvortrags erhöht wurden
    quelle: § 4h Abs. 1 Satz 7 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: '§ 4h Abs. 1 Satz 7: die Ausnahmen des Abs. 2 (Freigrenze < 3 Mio, Konzern lit b, Escape lit c) finden KEINE Anwendung, SOWEIT die Zinsaufwendungen aufgrund eines Zinsvortrags erhoeht wurden (Anteiligkeit). Benannter Nachtrag - die anteilige S.-7-Rechnung ist nicht modelliert. Die Freigrenzen-Pruefung nutzt nettozins = zinsaufwand - zinsertrag (gebuchter Jahresaufwand OHNE Zinsvortrag), was korrekt ist, solange Ausnahme und zins_vortrag_bestand > 0 nicht kombiniert werden; im Golden-Scope (N6) ist diese Kombination ausgeschlossen.'

- rule_id: p8a_massgebliches_einkommen
  norm: § 8a Abs. 1 KStG i.V.m. § 4h Abs. 1 Satz 2 EStG (Zinsschranke-Brücke — maßgebliches Einkommen statt Gewinn, EBITDA-Basis der Körperschaft)
  hinweis: 'EXAKTE FORMEL - EINE unbedingte Definition, KEINE exceptions: (1) ebitda_basis = massgebliches_einkommen + zinsaufwand + abschreibungen - zinsertrag. Das ist die vollstaendige Regel - NICHTS hinzufuegen. § 8a-BRUECKE: § 4h Abs. 1 Satz 2 EStG (verrechenbares EBITDA = 30 % der um Zinsaufwendungen und AfA erhoehten, um Zinsertraege verminderten Bemessungsgrundlage) ist fuer Koerperschaften mit der Maßgabe anzuwenden, dass ANSTELLE des maßgeblichen GEWINNS das maßgebliche EINKOMMEN tritt (§ 8a Abs. 1 Satz 1). massgebliches_einkommen (§ 8a Abs. 1 Satz 2) = das nach EStG und KStG ermittelte Einkommen MIT AUSNAHME der §§ 4h und 10d EStG und des § 9 Abs. 1 Nr. 2 KStG -> das entspricht dem einkommen_vor_spenden der K-Kette (nach § 8b/§ 10, VOR § 9-Spenden, VOR § 10d-Verlustabzug, VOR § 4h). Es kommt als INPUT (hier NICHT neu gerechnet). Diese Regel liefert NUR die EBITDA-Basis (die um Zinsen/AfA bereinigte Groesse als Bemessungsgrundlage); die 30-%-Multiplikation und der Abzugstest sind N1 (§ 4h Abs. 1) - HIER NICHT mit 30 % multiplizieren. abschreibungen = die nach § 6 Abs. 2/2a und § 7 EStG abgesetzten Betraege (AfA/GWG/Sammelposten), als Input. VERBOT: massgebliches_einkommen NICHT nochmals um § 9-Spenden, § 10d-Verlust oder § 4h mindern (diese Ausnahme steckt bereits im Input); zinsaufwand/abschreibungen werden ADDIERT (Hinzurechnung), zinsertrag SUBTRAHIERT. § 8a Abs. 3 (Gesellschafter-Fremdfinanzierung, 10-%-Rueckgriffsgrenze fuer den Escape lit c) und Abs. 2 (weggefallen) = benannter Nachtrag. FORMALISIERUNG: EINE unbedingte Definition, KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 8a Abs. 1 Satz 1 KStG (EBITDA — maßgebliches Einkommen statt Gewinn)
    datei: sources/gesetze-im-internet/kstg_p8a_2026-07-16.txt
    zitatanker: anstelle des maßgeblichen Gewinns das maßgebliche Einkommen tritt
    auszug: § 4h Abs. 1 Satz 2 des Einkommensteuergesetzes ist mit der Maßgabe anzuwenden, dass anstelle des maßgeblichen Gewinns das maßgebliche Einkommen tritt.
  - typ: gesetz
    label: § 8a Abs. 1 Satz 2 KStG (Definition maßgebliches Einkommen — ohne §§ 4h/10d EStG, § 9 Abs. 1 Nr. 2 KStG)
    datei: sources/gesetze-im-internet/kstg_p8a_2026-07-16.txt
    zitatanker: Maßgebliches Einkommen ist das nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes ermittelte Einkommen mit Ausnahme der §§ 4h und 10d des Einkommensteuergesetzes und des § 9 Abs. 1 Nr. 2 dieses Gesetzes
    auszug: Maßgebliches Einkommen ist das nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes ermittelte Einkommen mit Ausnahme der §§ 4h und 10d des Einkommensteuergesetzes und des § 9 Abs. 1 Nr. 2 dieses Gesetzes.
  - typ: gesetz
    label: § 4h Abs. 1 Satz 2 EStG (EBITDA-Bemessungsgrundlage — um Zinsaufwand/AfA erhöht, um Zinsertrag vermindert)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: verrechenbare EBITDA ist 30 Prozent des
    auszug: Das verrechenbare EBITDA ist 30 Prozent des um die Zinsaufwendungen und um die nach § 6 Absatz 2 Satz 1 abzuziehenden, nach § 6 Absatz 2a Satz 2 gewinnmindernd aufzulösenden und nach § 7 abgesetzten Beträge erhöhten und um die Zinserträge verminderten maßgeblichen Gewinns.
  signature:
    scope: MassgeblichesEinkommenBruecke
    inputs:
      massgebliches_einkommen: money
      zinsaufwand: money
      abschreibungen: money
      zinsertrag: money
    output: ebitda_basis
  raster:
