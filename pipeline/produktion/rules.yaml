  # Vom Judge im Annahme-Mapping erzwungen: drei Eingaben tragen Semantik, die die
  # Norm definiert und der Scope nicht pruefen kann. Klasse (2) der
  # Abgrenzungsregel - sie variieren den Betrag nicht, sie schalten die Regel.
  geltungsbedingungen:
  - bedingung: alleinstehend_im_sinne_des_absatzes_3
    deckt_ab: "Allein stehend im Sinne des Absatzes 1 sind Steuerpflichtige"
    quelle: "§ 24b Abs. 3 EStG"
    beschreibung: "Input-Semantik: `alleinstehend` traegt die Legaldefinition des Abs. 3 (kein Splitting, nicht verwitwet mit Splitting, keine Haushaltsgemeinschaft mit einer anderen volljaehrigen Person)."
  - bedingung: kinder_mit_freibetrag_oder_kindergeld_im_haushalt
    deckt_ab: "Freibetrag nach § 32 Absatz 6 oder Kindergeld zusteht"
    quelle: "§ 24b Abs. 1 Satz 1 EStG"
    beschreibung: "Input-Semantik: `anzahl_kinder` zaehlt nur Kinder, die zum Haushalt gehoeren und fuer die Kinderfreibetrag oder Kindergeld zusteht."
  - bedingung: monate_ohne_voraussetzung_sind_volle_kalendermonate
    deckt_ab: "Für jeden vollen Kalendermonat, in dem die Voraussetzungen des Absatzes 1 nicht vorgelegen haben"
    quelle: "§ 24b Abs. 4 EStG"
    beschreibung: "Input-Semantik: `monate_ohne_voraussetzung` zaehlt volle Kalendermonate ohne die Voraussetzungen des Abs. 1."
  # Herkunft `abgeleitet`, kein synthetischer Fall. Das BMF-Schreiben v. 23.11.2022
  # rechnet die Zwoelftelung mit dem Grundbetrag 4.008 EUR der Jahre 2020-2022 vor;
  # sein Volltext ist zudem weder ueber esth/lsth.bundesfinanzministerium.de
  # (Bot-Sperre) noch ueber den frueheren Landes-Spiegel woertlich abrufbar. Zitiert
  # wird deshalb die Rechenmechanik dort, wo sie woertlich und eingefroren vorliegt:
  # im Gesetz selbst. Die Parameter stammen aus der geltenden Fassung (4.260 / 240).
  # Jeder Erwartungswert traegt seinen `rechenweg`; nichts ist geraten.
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p24b_2026-07-09.txt
    zitatanker: "beträgt der Entlastungsbetrag im Kalenderjahr 4 260 Euro"
