- rule_id: p8_1_hinzurechnung
  norm: § 8 Nr. 1 GewStG (Hinzurechnung Finanzierungsanteile, 200.000-Freibetrag, Viertel)
  hinweis: 'summe = entgelte_schulden + renten_dauernde_lasten + gewinnanteile_stille + (miet_pacht_beweglich / 5) + (miet_pacht_unbeweglich / 2) + (aufwendungen_rechte / 4). hinzurechnungsbetrag = max(0, summe - 200000) / 4. KLASSE-5: die Quoten sind EXAKTE Brueche - ein Fuenftel = /5, die Haelfte = /2, ein Viertel = /4 (NICHT 0,2 / 0,5 / 0,25); die End-Quote ein Viertel = /4. REIHENFOLGE zwingend: erst je-Buchstabe-Quote + Summe, DANN Freibetrag 200.000 abziehen, DANN Viertel (nicht: erst Viertel, dann Freibetrag). money/int bzw. money*decimal, Cent-Schnitt ZULETZT, keine Quote vorrunden. a/b/c = volle Betraege (100%); Freibetrag greift nur bei positiver Summe (max(0, summe - 200000)). GRENZFALL: Summe genau 200.000 -> nichts uebersteigt -> 0. E-/Hybrid-/Fahrrad-Halbierung von Buchst. d (1/10 statt 1/5) + KSA-Ausnahme (§ 25 KSVG) = benannter Nachtrag, hier Standardfall.'
  quellen:
  - typ: gesetz
    label: § 8 Nr. 1 GewStG (Viertel der Summe a-f, 200.000-Freibetrag)
    datei: sources/gesetze-im-internet/gewstg_p8_2026-07-16.txt
