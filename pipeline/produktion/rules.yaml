- rule_id: p33_3_zumutbare_belastung
  norm: § 33 Abs. 3 EStG
  norm_source: sources/gesetze-im-internet/estg_p33_abs3_2026-07-09.txt
  struktur:
  - tabellen_lookup_2d
  - gde_stufen
  - kinderzahl_stufen
  - prozent_des_gde
  test_seed:
  # BFH, Urteil v. 19.01.2017 - VI R 75/14: die stufenweise Berechnung ist im
  # Urteil vollstaendig vorgerechnet. Die Staffel 2/3/4 % gilt laut der im selben
  # Urteil zitierten Tabelle fuer "einem Kind oder zwei Kindern"; der Familienstand
  # ist fuer diese Zeile ohne Bedeutung.
  - quelle: sources/bfh/bfh_vi_r_75-14_2017-01-19.txt
    zitatanker: "zumutbare Belastung 1.408,70 \u20ac"
    inputs: {gesamtbetrag_der_einkuenfte: 51835, anzahl_kinder: 1, splitting: false}
    expected: 1408.70
  signature:
    scope: ZumutbareBelastung
    inputs:
      gesamtbetrag_der_einkuenfte: money
      anzahl_kinder: int
      splitting: bool
    output: zumutbare_belastung
  raster:
  - gesamtbetrag_der_einkuenfte: 15000
    anzahl_kinder: 0
    splitting: false
  - gesamtbetrag_der_einkuenfte: 30000
    anzahl_kinder: 0
    splitting: true
  - gesamtbetrag_der_einkuenfte: 60000
    anzahl_kinder: 1
    splitting: false
  - gesamtbetrag_der_einkuenfte: 60000
    anzahl_kinder: 3
    splitting: false
  - gesamtbetrag_der_einkuenfte: 15340
    anzahl_kinder: 0
    splitting: false
  exclude_rule_ids:
  - p33_3_zumutbare_belastung
- rule_id: p35a_2_3_haushaltsnahe
  norm: § 35a Abs. 2 und 3 EStG
  norm_source: sources/gesetze-im-internet/estg_p35a_abs2_3_2026-07-09.txt
  struktur:
  - prozent_20
  - cap_4000
  - cap_1200
  - nur_arbeitskosten
  test_seed:
  # BMF-Anwendungsschreiben zu § 35a EStG v. 09.11.2016, Beispiel zur
  # Einzelveranlagung: voller Handwerker-Hoechstbetrag.
  - quelle: sources/bmf/bmf_p35a_2016-11-09.txt
    zitatanker: "20 % von 10.000 \u20ac (§ 35a Absatz 3 EStG) = 2.000 \u20ac, h\u00f6chstens 1.200 \u20ac"
    inputs: {aufwendungen_dienstleistungen: 0, aufwendungen_handwerker: 10000}
    expected: 1200.00
  signature:
    scope: Haushaltsnahe
    inputs:
      aufwendungen_dienstleistungen: money
      aufwendungen_handwerker: money
    output: steuerermaessigung
  raster:
  - aufwendungen_dienstleistungen: 1000
    aufwendungen_handwerker: 0
  - aufwendungen_dienstleistungen: 25000
    aufwendungen_handwerker: 0
  - aufwendungen_dienstleistungen: 0
    aufwendungen_handwerker: 10000
  - aufwendungen_dienstleistungen: 5000
    aufwendungen_handwerker: 3000
  exclude_rule_ids:
  - p35a_2_3_haushaltsnahe
