    zitatanker: die Angabe „4.000 Euro"
    herkunft: synthetisch
    rechenweg: 'WAECHTER Deckelung: Aufwendungen 9.000. 2/3 x 9.000 = 6.000 > 4.000 -> 4.000,00.'
