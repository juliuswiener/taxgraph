    quelle: § 6 Abs. 1 Nr. 4 S. 2 EStG / H 6.12 (Verwaltung)
    beschreibung: BLP auf volle 100 EUR abgerundet - H-Konvention (kein Norm-Wortlaut, verwaltung); Input bereits gerundet.
  - bedingung: bruchteils_teiler_aus_e_katalog
    deckt_ab: nur zur Hälfte anzusetzen
