  - bedingung: messbetrag_gewst_sachverhalt
    deckt_ab: Gewerbesteuermessbetrags
    quelle: § 35 Abs. 1 S. 1 EStG
    beschreibung: Messbetrag + tatsächlich zu zahlende GewSt = Sachverhalts-Inputs (GewStG = Nicht-Gegenstand).
  - bedingung: summe_positive_einkuenfte_positiv
    deckt_ab: Summe aller positiven Einkünfte
    quelle: § 35 Abs. 1 S. 2 EStG
    beschreibung: 'Division definiert: Summe aller positiven Einkünfte > 0.'
- rule_id: p16_4_freibetrag
  norm: § 16 Abs. 4 EStG (Betriebsveräußerungs-Freibetrag 45k, Abschmelzung 136k)
  hinweis: 'freibetrag = max(0, 45000 - max(0, veraeusserungsgewinn - 136000)). 45000 = Freibetrag (S1), 136000 = Abschmelz-Schwelle (S3 ''ermäßigt sich um den Betrag, um den ... 136 000 Euro übersteigt'') - beide NORM-KONSTANTEN in der Regel. §24a-Abschmelz-Muster: voll ab veraeusserungsgewinn > 181000 (136k+45k). Der steuerpflichtige Rest (gewinn - freibetrag) geht in die §34-Verzahnung (Integration). Cent-genau.'
  quellen:
  - typ: gesetz
