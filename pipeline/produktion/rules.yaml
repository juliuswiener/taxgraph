    rechenweg: 'NEGATIV: 20.000 + 0 - 50.000 = -30.000,00 (verdeckte Einlage uebersteigt Gewinn -> negatives Einkommen, § 10d-Andock, KEIN Boden bei 0).'
    inputs:
      gewinn_estg: 20000
