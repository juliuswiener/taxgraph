  geltungsbedingungen:
  - bedingung: suspension_des_8c_auf_antrag
    deckt_ab: § 8c ist nach einem schädlichen Beteiligungserwerb auf Antrag nicht anzuwenden, wenn die Körperschaft seit ihrer Gründung
    quelle: § 8d Abs. 1 Satz 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    beschreibung: 'Auf Antrag wird § 8c nach einem schädlichen Beteiligungserwerb NICHT angewandt, wenn die Körperschaft seit Gründung (oder 3 VZ) ausschliesslich denselben Geschäftsbetrieb unterhält -> der Verlust bleibt erhalten (verlustbestand_nach_8d = verlustvortrag_bestand). Setzt schaedlicher_erwerb voraus.'
  - bedingung: antrag_und_fortfuehrung_bool_vorfrage
    deckt_ab: § 8c ist nach einem schädlichen Beteiligungserwerb auf Antrag nicht anzuwenden, wenn die Körperschaft seit ihrer Gründung
    quelle: § 8d Abs. 1 Satz 1/5 KStG
    datei: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    beschreibung: 'antrag_8d (Antrag in der Steuererklärung des Erwerbs-VZ, Satz 5) und fortfuehrungs_voraussetzungen (seit Gründung/3 VZ derselbe Geschäftsbetrieb, kein Abs.-2-Ereignis; qualitative Gesamtbetrachtung Satz 3/4) sind bool-Inputs = Sachverhalts-Vorfrage, nicht modelliert.'
  - bedingung: fortfuehrungsgebundener_verlustvortrag_kennzeichnung
    deckt_ab: wird zum fortführungsgebundenen Verlust (fortführungsgebundener Verlustvortrag)
    quelle: § 8d Abs. 1 Satz 6 KStG
    datei: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    beschreibung: 'Der erhaltene Verlust wird zum fortführungsgebundenen Verlustvortrag (Satz 6). Stufe A liefert nur den erhaltenen Betrag; die Kennzeichnung/gesonderte Feststellung (Satz 7) und der Vorrang vor dem regulären § 10d-Verlust (Satz 8) = N6-Verdrahtungs-Vermerk bzw. Nachtrag, kein eigener Rechenpfad.'
  - bedingung: untergang_bei_einstellung_abs2_nachtrag
    deckt_ab: Wird der Geschäftsbetrieb im Sinne des Absatzes 1 eingestellt, geht der nach Absatz 1 zuletzt festgestellte fortführungsgebundene Verlustvortrag unter
    quelle: § 8d Abs. 2 KStG
    datei: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    beschreibung: 'Abs. 2: wird der Geschäftsbetrieb eingestellt (oder ruhend gestellt, Zweckänderung, zusätzlicher Betrieb, Mitunternehmerschaft, Organträger, Übertragung unter gemeinem Wert), geht der fortführungsgebundene Verlustvortrag unter (§ 8c Abs. 1 S. 5-8 stille Reserven entsprechend). Benannter Nachtrag, hier nicht modelliert (setzt Mehrjahres-Tracking voraus).'
- rule_id: p51a_kirchensteuer
  norm: § 51a EStG i.V.m. Art. 8 KirchStG (Bayern) / Landes-KiStG — Kirchensteuer-Festsetzung auf die Maßstabsteuer (Zuschlagsteuer)
  hinweis: 'kist = est_mit_fb * satz. satz ist KEIN Input, sondern aus zwei int-kodierten Inputs abgeleitet: konfession (0=keine, 1=evangelisch, 2=roemisch-katholisch, 3=andere) und bundesland (1=Bayern, 2=Baden-Wuerttemberg -> 0,08 ; jeder andere Wert -> 0,09). Ableitung: wenn konfession = 0 oder konfession = 3 dann satz = 0 ; sonst wenn bundesland = 1 oder bundesland = 2 dann satz = 0,08 ; sonst satz = 0,09. est_mit_fb ist die Massstabsteuer nach § 51a EStG (Einkommensteuer mit Kinderfreibetrag), in EURO als money. Cent-Schnitt zuletzt (Klasse 5 money x decimal). Die Saetze 0,08/0,09 sind Landes-KiStG-Hebesaetze (Beschluss), KEINE EStG-Konstante.'
  quellen:
  - typ: gesetz
    label: Landes-KiStG Hebesatz übrige Länder (9 v.H., FinMin-NRW-Erlass 18.04.2024)
    datei: sources/kirchensteuer/kist_hebesatz_2026-07-22.txt
    zitatanker: 9 v. H.
    auszug: Zuschlag zur Einkommen-, Lohn- und Kapitalertragsteuer „9 v. H."
  - typ: gesetz
    label: Landes-KiStG Hebesatz Bayern (8 %, Erzbistum München / Art. 8 KirchStG)
    datei: sources/kirchensteuer/kist_hebesatz_2026-07-22.txt
    zitatanker: Der Umlagesatz beträgt in Bayern derzeit 8 %
    auszug: „Der Umlagesatz beträgt in Bayern derzeit 8 % der Einkommen-, Lohn- und Kapitalertragsteuer
  - typ: gesetz
    label: § 51a-Bemessungsgrundlage (ESt mit Kinderfreibetrag)
    datei: sources/kirchensteuer/kist_hebesatz_2026-07-22.txt
    zitatanker: Maßgabe des § 51a des Einkommensteuergesetzes
    auszug: Vor Anwendung der Kirchensteuerhebesätze ist die Bemessungsgrundlage nach Maßgabe des § 51a des Einkommensteuergesetzes
  rundung: []
  signature:
    scope: Kirchensteuer
    inputs:
      est_mit_fb: money
      konfession: int
      bundesland: int
    output: kist
