    rechenweg: 'Boundary 136k: max(0,45000-max(0,0))=45.000,00.'
    inputs:
      veraeusserungsgewinn: 136000
    expected: 45000.0
  - quelle: sources/gesetze-im-internet/estg_p16_2026-07-14.txt
    zitatanker: 136 000 Euro übersteigt
