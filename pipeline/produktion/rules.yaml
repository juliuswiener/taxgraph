- rule_id: p9_1_3_nr5a_uebernachtung_vor_48
  norm: § 9 Abs. 1 S. 3 Nr. 5a EStG (Zeitraum vor Ablauf 48 Monate)
  quellen:
  - typ: gesetz
    label: § 9 Abs. 1 S. 3 Nr. 5a Satz 1-3 EStG (ungekappt)
    datei: sources/gesetze-im-internet/estg_p9_2026-07-10.txt
    zitatanker: notwendige Mehraufwendungen eines Arbeitnehmers für beruflich veranlasste Übernachtungen
    auszug: notwendige Mehraufwendungen eines Arbeitnehmers für beruflich veranlasste Übernachtungen an einer Tätigkeitsstätte, die nicht erste Tätigkeitsstätte ist. 2 Übernachtungskosten sind die tatsächlichen Aufwendungen für die persönliche Inanspruchnahme einer Unterkunft zur Übernachtung. 3 Soweit höhere Übernachtungskosten anfallen, weil der Arbeitnehmer eine Unterkunft gemeinsam mit Personen nutzt, die in keinem Dienstverhältnis zum selben Arbeitgeber stehen, sind nur diejenigen Aufwendungen anzusetzen, die bei alleiniger Nutzung durch den Arbeitnehmer angefallen wären.
  geltungsbedingungen:
  - bedingung: zeitraum_vollstaendig_vor_48_monate
    deckt_ab: bis zur Höhe des Betrags nach Nummer 5
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 4 EStG
    beschreibung: 'Binaere Auswahlbedingung: gilt nur, wenn der Abrechnungszeitraum vollstaendig vor Ablauf der 48 Monate liegt (monate_bisher_am_ort < 48). Auswahl macht die § 2-Integration; ueberspannende Zeitraeume splittet der Aufrufer.'
  - bedingung: erste_taetigkeitsstaette_liegt_nicht_am_ort
    deckt_ab: an einer Tätigkeitsstätte, die nicht erste Tätigkeitsstätte ist
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 1 EStG
    beschreibung: Uebernachtung an einer Taetigkeitsstaette, die nicht erste Taetigkeitsstaette ist. Migriert aus Split-Report (Instructor msg 1273).
  - bedingung: kosten_bei_alleiniger_nutzung
    deckt_ab: die bei alleiniger Nutzung durch den Arbeitnehmer angefallen wären
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 3 EStG
    beschreibung: Bei gemeinsamer Nutzung nur Kosten bei alleiniger Nutzung. Input-Semantik von uebernachtungskosten_monat. Migriert (msg 1273).
  - bedingung: keine_unterbrechung_mit_neubeginn
    deckt_ab: wenn die Unterbrechung mindestens sechs Monate dauert
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 5 EStG
    beschreibung: 'Eigene Neubeginn-Regel Nr. 5a: sechs Monate. Scope kennt die Unterbrechungshistorie nicht. Migriert (msg 1273).'
