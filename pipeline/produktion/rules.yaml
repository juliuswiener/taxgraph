- rule_id: p8x_zulage_anspruch
  hinweis: zulage_anspruch = 175 + (wenn ist_berufseinsteiger_erstjahr dann 200 sonst 0) + anzahl_kinder_geboren_vor_2008 * 185 + anzahl_kinder_geboren_ab_2008 * 300. Alle Betraege sind feste Norm-Konstanten (Grundzulage 175 § 84 S1, Berufseinsteiger 200 § 84 S2, Kinderzulage 185 § 85 S1 / 300 § 85 S2 fuer nach 31.12.2007 geborene Kinder). Zulage VOR § 86-Kuerzung.
  norm: '§§ 83, 84, 85 EStG (Altersvorsorgezulage: Grund- + Kinderzulage vor Kuerzung)'
  quellen:
  - typ: gesetz
    label: § 84 S. 1 EStG (Grundzulage 175)
    datei: sources/gesetze-im-internet/estg_p84_2026-07-13.txt
    zitatanker: Jeder Zulageberechtigte erhält eine Grundzulage; diese beträgt ab dem Beitragsjahr 2018 jährlich 175 Euro.
    auszug: Jeder Zulageberechtigte erhält eine Grundzulage; diese beträgt ab dem Beitragsjahr 2018 jährlich 175 Euro.
  - typ: gesetz
    label: § 84 S. 2 EStG (Berufseinsteiger +200)
    datei: sources/gesetze-im-internet/estg_p84_2026-07-13.txt
    zitatanker: erhöht sich die Grundzulage nach Satz 1 um einmalig 200 Euro
    auszug: Für Zulageberechtigte nach § 79 Satz 1, die zu Beginn des Beitragsjahres (§ 88) das 25. Lebensjahr noch nicht vollendet haben, erhöht sich die Grundzulage nach Satz 1 um einmalig 200 Euro.
  - typ: gesetz
    label: § 85 Abs. 1 S. 1-2 EStG (Kinderzulage 185/300)
    datei: sources/gesetze-im-internet/estg_p85_2026-07-13.txt
    zitatanker: jährlich 185 Euro
    auszug: Die Kinderzulage beträgt für jedes Kind, für das gegenüber dem Zulageberechtigten Kindergeld festgesetzt wird, jährlich 185 Euro. 2 Für ein nach dem 31. Dezember 2007 geborenes Kind erhöht sich die Kinderzulage nach Satz 1 auf 300 Euro.
  geltungsbedingungen:
  - bedingung: unmittelbar_zulageberechtigt_p79s1
    deckt_ab: Jeder Zulageberechtigte erhält eine Grundzulage
    quelle: § 79 S. 1 i.V.m. § 10a Abs. 1 EStG
    beschreibung: 'Nur unmittelbar Zulageberechtigte (§ 79 S1: rentenversicherungspflichtige AN/Beamte etc. nach § 10a Abs1). Mittelbar Zulageberechtigte (§ 79 S2 Ehegatte) + Ehegatten-Uebertragung = Nicht-Gegenstand.'
  - bedingung: berufseinsteiger_erstmalig
    deckt_ab: das 25. Lebensjahr noch nicht vollendet haben
    quelle: § 84 S. 2-3 EStG
    beschreibung: 'Berufseinsteiger-Erhoehung 200 setzt voraus, dass der Zulageberechtigte zu Beginn des Beitragsjahres das 25. Lebensjahr noch nicht vollendet hat (§ 84 S2 woertlich); nur einmalig im ersten beantragten Beitragsjahr (§ 84 S3). Beide Voraussetzungen = Input-Semantik/State (Einmaligkeit ueber Lebenszeit = Nicht-Gegenstand, 40k-Praezedenz); hier als bool-Input ist_berufseinsteiger_erstjahr gekapselt, die Regel prueft Alter/Erstjahr nicht selbst.'
  - bedingung: kindergeld_festgesetzt_nicht_zurueckgefordert
    deckt_ab: für das gegenüber dem Zulageberechtigten Kindergeld festgesetzt wird
    quelle: § 85 Abs. 1 S. 1/3 EStG
    beschreibung: Kinderzulage nur fuer Kinder mit festgesetztem Kindergeld; entfaellt bei Kindergeld-Rueckforderung (S3). Zuordnung Elternteil (§ 85 Abs2) = Integration.
  rundung: []
  signature:
    scope: ZulageAnspruch
    inputs:
      anzahl_kinder_geboren_vor_2008: decimal
      anzahl_kinder_geboren_ab_2008: decimal
      ist_berufseinsteiger_erstjahr: bool
    output: zulage_anspruch
  test_seed:
