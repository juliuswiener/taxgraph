- rule_id: p21_2_verbilligte_vermietung_wk
  hinweis: entgelt_quote_prozent ist ein PROZENTWERT (vereinbarte Miete / ortsuebliche Miete x 100) -> /100 in decimal. abziehbare_werbungskosten = wenn entgelt_quote_prozent >= 66 dann werbungskosten sonst (entgelt_quote_prozent / 100) * werbungskosten. Schwelle 66 INKLUSIV (>=). Bei quote < 50 volle anteilige Kuerzung. Der Korridor 50 <= quote < 66 ist NICHT Gegenstand (Totalueberschussprognose, BMF, kein Wortlaut). Cent-Schnitt zuletzt.
  norm: § 21 Abs. 2 EStG (verbilligte Wohnungsueberlassung, anteilige WK-Kuerzung)
  quellen:
  - typ: gesetz
    label: § 21 Abs. 2 S. 1-2 EStG (50-%-Aufteilung / 66-%-Vollentgeltlichkeit)
    datei: sources/gesetze-im-internet/estg_p21_2026-07-13.txt
    zitatanker: mindestens 66 Prozent der ortsüblichen Miete, gilt die Wohnungsvermietung als entgeltlich
    auszug: Beträgt das Entgelt für die Überlassung einer Wohnung zu Wohnzwecken weniger als 50 Prozent der ortsüblichen Marktmiete, so ist die Nutzungsüberlassung in einen entgeltlichen und einen unentgeltlichen Teil aufzuteilen. 2 Beträgt das Entgelt bei auf Dauer angelegter Wohnungsvermietung mindestens 66 Prozent der ortsüblichen Miete, gilt die Wohnungsvermietung als entgeltlich.
  geltungsbedingungen:
  - bedingung: entgelt_quote_ausserhalb_prognosekorridor
    deckt_ab: weniger als 50 Prozent der ortsüblichen Marktmiete
    quelle: § 21 Abs. 2 S. 1-2 EStG
    beschreibung: Regel gilt nur fuer quote < 50 (S1 anteilige Aufteilung zwingend) ODER quote >= 66 (S2 voll entgeltlich). Korridor 50 <= quote < 66 = Totalueberschussprognose (BMF, kein Norm-Wortlaut), ausgeklammert.
  - bedingung: wohnung_zu_wohnzwecken_ueberlassen
    deckt_ab: Überlassung einer Wohnung zu Wohnzwecken
    quelle: § 21 Abs. 2 S. 1 EStG
    beschreibung: Regel gilt nur fuer Ueberlassung einer WOHNUNG zu WOHNzwecken - nicht Gewerberaum/Sachinbegriffe/§ 21 Abs1 Nr2-4.
  - bedingung: auf_dauer_angelegte_wohnungsvermietung
    deckt_ab: bei auf Dauer angelegter Wohnungsvermietung
    quelle: § 21 Abs. 2 S. 2 EStG
    beschreibung: Die 66-%-Vollentgeltlichkeits-Fiktion (S2) gilt nur bei auf Dauer angelegter Wohnungsvermietung (nicht Ferienwohnung/kurzfristige Vermietung).
  rundung: []
