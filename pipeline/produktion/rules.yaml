    quelle: § 4h Abs. 1 Satz 1 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'Kern-Mechanismus: Zinsaufwendungen abziehbar in Hoehe des Zinsertrags, darueber hinaus (= Nettozinsaufwendungen) nur bis zur Hoehe des verrechenbaren EBITDA (zzgl. EBITDA-Vortrag). abziehbar = zinsertrag + min(zinssaldo_eff, deckel).'
  - bedingung: verrechenbares_ebitda_30_prozent_massgeblicher_gewinn
    deckt_ab: verrechenbare EBITDA ist 30 Prozent des
    quelle: § 4h Abs. 1 Satz 2 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'verrechenbares_ebitda = 30 % (= 30/100 exakt) der ebitda_basis. ebitda_basis (maßgeblicher Gewinn erhoeht um Zinsaufwendungen/§6/§7-AfA, vermindert um Zinsertraege) kommt als INPUT; die detaillierte Herleitung der Basis ist nicht Gegenstand (fuer KapGes: maßgebliches Einkommen statt Gewinn = N3).'
  - bedingung: zins_vortrag_bestand_state_input
    deckt_ab: Sie erhöhen die Zinsaufwendungen dieser Wirtschaftsjahre, nicht aber den maßgeblichen Gewinn
    quelle: § 4h Abs. 1 Satz 5/6 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'zins_vortrag_bestand = zum Vorjahresschluss festgestellter Zinsvortrag (State-Input, >= 0). Satz 6: erhoeht die Zinsaufwendungen dieses Jahres (zinsaufwand_eff), NICHT aber den maßgeblichen Gewinn -> darf die 30-%-Bemessungsgrundlage ebitda_basis NICHT beeinflussen (kein Doppeleffekt). Fortschreibung/Roll-Forward des Zinsvortrags = benannter Nachtrag (Abs. 4 gesonderte Feststellung).'
  - bedingung: ebitda_vortrag_bestand_deckelerhoehung
    deckt_ab: sind bis zur Höhe der EBITDA-Vorträge aus vorangegangenen Wirtschaftsjahren abziehbar
    quelle: § 4h Abs. 1 Satz 4 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'ebitda_vortrag_bestand = fortgetragenes verrechenbares EBITDA vorangegangener Wirtschaftsjahre (State-Input, >= 0). Satz 4: erhoeht den Abzugsdeckel (deckel = 30 % ebitda_basis + ebitda_vortrag_bestand). Verbrauchsreihenfolge (erst laufendes EBITDA, dann Vortrag) und Roll-Forward = benannter Nachtrag, im Jahres-Summen-Deckel implizit.'
  - bedingung: nichtabziehbar_wird_zinsvortrag
    deckt_ab: Danach verbleibende nicht abziehbare Zinsaufwendungen sind in die folgenden Wirtschaftsjahre vorzutragen (Zinsvortrag)
    quelle: § 4h Abs. 1 Satz 5 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'Der nach dem Deckel nicht abziehbare Teil (= zinsaufwand_eff - abziehbare_zinsaufwendungen) wird zum Zinsvortrag der Folgejahre und ist auf der K1-Slot-Seite hinzuzurechnen (N6, Add-back erhoeht den Gewinn). Die Entstehung wird hier gerechnet; die Feststellung/Fortschreibung = Nachtrag.'
  - bedingung: ausnahmen_abs2_freigrenze_separater_scope
    deckt_ab: Absatz 1 Satz 1 ist nicht anzuwenden, wenn
    quelle: § 4h Abs. 2 EStG
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    beschreibung: 'N1 modelliert den Kern-Mechanismus unter der Annahme, dass Abs. 1 Satz 1 anwendbar ist. Die Ausnahmen des Abs. 2 (a Freigrenze Nettozinsaufwand < 3 Mio, b keine schaedliche Konzern-/Nahestehenden-Zugehoerigkeit, c Escape-Eigenkapitalvergleich) = eigene Charge N2 (Geltungsbedingungen + Freigrenze, Alles-oder-nichts).'

- rule_id: p4h_ausnahmen_freigrenze
  norm: § 4h Abs. 2 EStG (Zinsschranke-Ausnahmen — Freigrenze 3 Mio EUR, Konzern-/Nahestehenden-Ausnahme, Escape-Eigenkapitalvergleich)
  hinweis: 'EXAKTE FORMEL - GENAU DREI unbedingte Definitionen, in dieser Reihenfolge, KEINE catala-exceptions: (1) freigrenze_greift = nettozinsaufwand < 3.000.000 [bool] ; (2) ausnahme_greift = freigrenze_greift or keine_konzern_oder_nahestehende_b or eigenkapital_escape_c [bool] ; (3) abziehbare_zinsaufwendungen_final = if ausnahme_greift then zinsaufwand else abziehbar_kern. Das ist die vollstaendige Regel - NICHTS hinzufuegen. § 4h Abs. 2 Satz 1: Absatz 1 Satz 1 ist NICHT anzuwenden, wenn a) die Nettozinsaufwendungen weniger als drei Millionen Euro betragen (Freigrenze), b) der Betrieb keiner Person iSd § 1 Abs. 2 AStG nahesteht und keine Auslands-Betriebsstaette hat, ODER c) Escape-Eigenkapitalvergleich (EK-Quote >= Konzern). a/b/c sind ALTERNATIV -> logisches ODER; greift eine, ist der volle Zinsaufwand abziehbar. ZU (1) FREIGRENZE, NICHT FREIBETRAG - KRITISCH: Schwelle exakt "weniger als drei Millionen Euro" => strikt nettozinsaufwand < 3.000.000. Bei nettozinsaufwand >= 3.000.000 unterliegt der GESAMTE Nettozinsaufwand dem § 4h-Mechanismus (abziehbar_final = abziehbar_kern aus N1). Es wird NIEMALS ein Betrag von 3.000.000 vom Nettozinsaufwand abgezogen - das waere ein Freibetrag und ist VERBOTEN. ALLES-ODER-NICHTS an der 3-Mio-Schwelle: nettozinsaufwand 2.999.999 -> Ausnahme greift -> voller Abzug (= zinsaufwand); nettozinsaufwand 3.000.000 -> keine Ausnahme -> Mechanismus greift voll (= abziehbar_kern), NICHT abziehbar_kern zzgl. 3.000.000. ZU (2) keine_konzern_oder_nahestehende_b (lit b) und eigenkapital_escape_c (lit c) sind bool-INPUTS = Sachverhalts-Vorfrage; KEINE Konzern-Bilanz-, IFRS- oder EK-Quoten-Logik hier (§ 8a KStG modifiziert lit c fuer KapGes = N3; Abs. 2 Saetze 2-16 EK-Ermittlung/IFRS/Zuschlag = Nachtrag). ZU (3) zinsaufwand = voller Zinsaufwand des Jahres (bei Ausnahme voll abziehbar); abziehbar_kern = Ergebnis aus N1 (§ 4h Abs. 1). Die if-then-else in (3) ist EINE totale Definition (beide Zweige belegt), KEINE catala-exception under condition. FORMALISIERUNG: drei unbedingte Definitionen, KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 4h Abs. 2 Satz 1 lit. a EStG (Freigrenze — Nettozinsaufwendungen < 3 Mio EUR)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: die Nettozinsaufwendungen des Betriebs weniger als drei Millionen Euro betragen
    auszug: Absatz 1 Satz 1 ist nicht anzuwenden, wenn a) die Nettozinsaufwendungen des Betriebs weniger als drei Millionen Euro betragen
  - typ: gesetz
    label: § 4h Abs. 2 Satz 1 lit. b EStG (keine nahestehende Person / keine Auslands-Betriebsstätte)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: keiner Person im Sinne des § 1 Absatz 2
    auszug: der Steuerpflichtige keiner Person im Sinne des § 1 Absatz 2 (gegebenenfalls in Verbindung mit § 1 Absatz 1 Satz 2) des Außensteuergesetzes nahesteht und über keine Betriebsstätte außerhalb des Staates verfügt
  - typ: gesetz
    label: § 4h Abs. 2 Satz 1 lit. c EStG (Escape — Eigenkapitalvergleich)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: gleich hoch oder höher ist als die des Konzerns (Eigenkapitalvergleich)
    auszug: der Betrieb zu einem Konzern gehört und seine Eigenkapitalquote am Schluss des vorangegangenen Abschlussstichtages gleich hoch oder höher ist als die des Konzerns (Eigenkapitalvergleich)
