# Charge-7 Renten (Instructor-Freigabe 2026-07-13, reports/review/2026-07-13-charge7-renten-zuschnitt.md).
- rule_id: p22_1_leibrente_besteuerungsanteil
  # hinweis-Kanal (§24a-Praezedenz): der auszug nennt "Prozentsatz", sagt aber nicht, dass ein
  # Prozentwert (50 = 50%) durch 100 zu teilen ist. Ohne Pin rechnete A/B jahresrente * prozent
  # ohne /100 (12.000 x 50 = 600.000). Encoding-Pin wie bei §24a-prozentsatz.
  hinweis: 'besteuerungsanteil_prozent ist ein PROZENTWERT (z.B. 50 bedeutet 50 %, 80 bedeutet 80 %). Der steuerpflichtige Anteil ist (besteuerungsanteil_prozent / 100) * jahresrente; die Division durch 100 in decimal rechnen, Cent-Schnitt zuletzt.'
  norm: § 22 Nr. 1 S. 3 a aa EStG (Leibrente, Besteuerungsanteil nach Rentenbeginn-Kohorte)
  quellen:
  - typ: gesetz
    label: § 22 Nr. 1 S. 2-3 EStG (Besteuerungsanteil = Prozentsatz x Jahresrente)
    datei: sources/gesetze-im-internet/estg_p22_2026-07-13.txt
    zitatanker: maßgebenden Prozentsatz aus der nachstehenden Tabelle
    auszug: 'Bemessungsgrundlage für den der Besteuerung unterliegenden Anteil ist der Jahresbetrag der Rente. 3 Der der Besteuerung unterliegende Anteil ist nach dem Jahr des Rentenbeginns und dem in diesem Jahr maßgebenden Prozentsatz aus der nachstehenden Tabelle zu entnehmen'
  geltungsbedingungen:
  - bedingung: besteuerungsanteil_aus_kohortentabelle
    deckt_ab: maßgebenden Prozentsatz aus der nachstehenden Tabelle
    quelle: § 22 Nr. 1 S. 3 a aa EStG
    beschreibung: 'besteuerungsanteil_prozent ist der Kohorten-Tabelle (§ 22 Nr. 1 S. 3 a aa, params/kohorten/rente_besteuerungsanteil_p22.yaml) zu entnehmen, Schluessel = Jahr des Rentenbeginns (lebenslang fix). Der Lookup erfolgt in der § 2-Integration; hier kommt der Prozentsatz als Input (Andockung wie § 24a). steuerpflichtiger_rentenanteil = (besteuerungsanteil_prozent / 100) x jahresrente.'
  - bedingung: rentenfreibetrag_fixierung_ist_folgejahr_state
    deckt_ab: Bemessungsgrundlage für den der Besteuerung unterliegenden Anteil ist der Jahresbetrag der Rente
    quelle: § 22 Nr. 1 S. 4-5 EStG
    beschreibung: 'Diese Regel liefert den ERSTJAHR-Besteuerungsanteil (Prozentsatz x Jahresrente). Der steuerfreie EURO-Rentenfreibetrag wird daraus abgeleitet und ab dem zweiten Rentenjahr FIXIERT (S. 4-5, lebenslang unveraendert) - mehrjaehriger State, § 2-Integration, NICHT in dieser Erstjahr-Regel (Backlog-Grenze).'
