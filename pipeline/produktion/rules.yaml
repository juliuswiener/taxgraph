  geltungsbedingungen:
  - bedingung: faktor_nach_zinssatz_5_5_prozent
    deckt_ab: mit einem Zinssatz von 5,5 Prozent abzuzinsen
    quelle: § 6 Abs. 1 Nr. 3a Buchst. e EStG
    beschreibung: 'AUFLAGE A: abzinsungsfaktor_amtlich trägt die 5,5-%-Norm-Konstante (= 1/1,055^Restlaufzeit, amtliche BMF-Tabelle) - Catala ohne Potenz-Op, Faktor-Arithmetik steht nicht im Wortlaut (Klasse-3-artig). AUFLAGE B: Faktor-Tabelle als params/kohorten nach BMF-Tabellen-Freeze (§22-Kohorten-Muster, Restlaufzeit->Faktor) = benannter Nachtrag, hebt den Schmuggel später auf.'
