  - bedingung: kuerzung_grundsteuer_ez2025
    deckt_ab: die im Erhebungszeitraum als Betriebsausgabe erfasste Grundsteuer
    quelle: § 9 Nr. 1 S. 1 GewStG n.F.
    beschreibung: 'Nr. 1 S. 1 ab EZ 2025 (JStG 2024): Kuerzung = tatsaechlich als Betriebsausgabe erfasste Grundsteuer (ersetzt 1,2-%-Einheitswert der Altfassung G3a). Nr. 1 S. 3 20-%-erweiterte Kuerzung = Nachtrag.'
  - bedingung: kuerzung_gewinnanteile_mitunternehmer
