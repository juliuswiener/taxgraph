- rule_id: p35a_2_3_haushaltsnahe
  norm: § 35a EStG (Abs. 1 bis 3, Voraussetzungen Abs. 5)
  norm_source: sources/gesetze-im-internet/estg_p35a_2026-07-09.txt
  struktur:
  - prozent_20
