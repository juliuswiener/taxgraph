- rule_id: p86_mindesteigenbeitrag
  hinweis: 'mindesteigenbeitrag = max( min((4/100) * vorjahres_einnahmen, 2100) - zulage_anspruch, 60 ). 4 ist PROZENTWERT -> /100 in decimal, Cent-Schnitt zuletzt. 2100 = Hoechstbetrag § 10a Abs1 S1 (Deckel auf die 4%-Bemessung). Abzug der Zulage nach §§ 84/85 (= zulage_anspruch). Aeusseres max(...,60) = Sockelbetrag-hoeher-Regel (§ 86 Abs1 S5, an-die-Stelle-Sondersatz): Mindesteigenbeitrag ist nie kleiner als 60. vorjahres_einnahmen = Sachverhalts-Input (Vorjahres-Faktum, kein State).'
  norm: '§ 86 Abs. 1 EStG (Mindesteigenbeitrag: 4 % Vorjahr, Deckel 2100, minus Zulage, Sockel 60)'
