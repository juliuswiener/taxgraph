    herkunft: synthetisch
    rechenweg: 'Abgeltung guenstiger: Kapitaleink. 10.000 -> 0,25 x 10.000 = 2.500. delta = 8.000 - 5.000 = 3.000. min(2.500; 3.000) = 2.500,00.'
