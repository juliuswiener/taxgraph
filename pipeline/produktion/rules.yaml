- rule_id: p20_6_verlustverrechnung
  hinweis: 'Zwei GETRENNTE Verlust-Toepfe, jeder mit Boden bei 0 (kein negativer Saldo): saldo_aktien = wenn (gewinn_aktien - verlust_aktien) < 0 dann 0 sonst (gewinn_aktien - verlust_aktien); saldo_sonstige = wenn (gewinn_sonstige - verlust_sonstige) < 0 dann 0 sonst (gewinn_sonstige - verlust_sonstige); verrechnete_kapitaleinkuenfte = saldo_aktien + saldo_sonstige. KEINE topfuebergreifende Verrechnung (Aktienverlust mindert NUR Aktiengewinn, nie den sonstigen Topf); ein negativer Topf ist Verlustvortrag (ausserhalb dieser Regel) und wird hier als 0 behandelt.'
  norm: § 20 Abs. 6 EStG (Verlustverrechnung, getrennte Toepfe Aktien/sonstige)
  quellen:
  - typ: gesetz
    label: § 20 Abs. 6 S. 1 EStG (kein Ausgleich mit anderen Einkunftsarten)
    datei: sources/gesetze-im-internet/estg_p20_2026-07-13.txt
    zitatanker: nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden
    auszug: Verluste aus Kapitalvermögen dürfen nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden; sie dürfen auch nicht nach § 10d abgezogen werden.
  - typ: gesetz
    label: § 20 Abs. 6 EStG (Aktien-Sondertopf)
    datei: sources/gesetze-im-internet/estg_p20_2026-07-13.txt
    zitatanker: aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen
    auszug: die aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen im Sinne des Absatzes 2 Satz 1 Nummer 1 Satz 1
  geltungsbedingungen:
  - bedingung: aktienverlust_nur_gegen_aktiengewinn
    deckt_ab: aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen
    quelle: § 20 Abs. 6 EStG (Aktien-Sondertopf)
    beschreibung: 'Aktienverluste sind NUR mit Aktiengewinnen verrechenbar (eigener Topf): aktien_netto = max(0, gewinn_aktien - verlust_aktien). Sonstige KAP-Verluste im eigenen Topf: sonstige_netto = max(0, gewinn_sonstige - verlust_sonstige). Kein topfuebergreifender Ausgleich.'
  - bedingung: verlustvortrag_ist_10d_grenze
    deckt_ab: nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden
    quelle: § 20 Abs. 6 S. 1-2 EStG
    beschreibung: 'Nur INNERJAEHRLICHE Verrechnung. Ein nicht ausgeglichener Verlust (Topf negativ) geht als Verlustvortrag in Folge-VZ (S. 2ff) - mehrjaehrig, § 10d-analog, NICHT in dieser Regel formalisiert (Backlog-Grenze). Hier: Topf-Boden bei 0 (max(0, ...)).'
  rundung: []
  signature:
    scope: Verlustverrechnung
    inputs:
      gewinn_aktien: money
      verlust_aktien: money
      gewinn_sonstige: money
      verlust_sonstige: money
    output: verrechnete_kapitaleinkuenfte
  test_seed:
