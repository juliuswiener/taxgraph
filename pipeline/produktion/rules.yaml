  - unterkunftskosten_monat: 1400
    monate: 6
    im_inland: false
  - unterkunftskosten_monat: 2500
    monate: 12
    im_inland: false
  exclude_rule_ids:
  - p9_1_3_nr5_doppelte_haushaltsfuehrung
- rule_id: p9_1_3_nr5a_uebernachtung
  status: zuschnitt_ersetzt
  norm: § 9 Abs. 1 S. 3 Nr. 5a EStG
  quellen:
  - typ: gesetz
    label: § 9 Abs. 1 S. 3 Nr. 5a EStG
    datei: sources/gesetze-im-internet/estg_p9_2026-07-10.txt
    zitatanker: bis zur Höhe des Betrags nach Nummer 5
    auszug: notwendige Mehraufwendungen eines Arbeitnehmers für beruflich veranlasste Übernachtungen an einer Tätigkeitsstätte, die nicht erste Tätigkeitsstätte ist. 2 Übernachtungskosten sind die tatsächlichen Aufwendungen für die persönliche Inanspruchnahme einer Unterkunft zur Übernachtung. 3 Soweit höhere Übernachtungskosten anfallen, weil der Arbeitnehmer eine Unterkunft gemeinsam mit Personen nutzt, die in keinem Dienstverhältnis zum selben Arbeitgeber stehen, sind nur diejenigen Aufwendungen anzusetzen, die bei alleiniger Nutzung durch den Arbeitnehmer angefallen wären. 4 Nach Ablauf von 48 Monaten einer längerfristigen beruflichen Tätigkeit an derselben Tätigkeitsstätte, die nicht erste Tätigkeitsstätte ist, können Unterkunftskosten nur noch bis zur Höhe des Betrags nach Nummer 5 angesetzt werden.
  - typ: gesetz
    label: § 9 Abs. 1 S. 3 Nr. 5 Satz 4 EStG (1.000-Euro-Kappung, via Verweis Nr. 5a Satz 4)
    datei: sources/gesetze-im-internet/estg_p9_2026-07-10.txt
    zitatanker: 1 000 Euro im Monat
    auszug: höchstens 1 000 Euro im Monat bei einer Unterkunft im Inland
  geltungsbedingungen:
  - bedingung: keine_unterbrechung_mit_neubeginn
    deckt_ab: wenn die Unterbrechung mindestens sechs Monate dauert
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 5 EStG
    beschreibung: 'Eigene Neubeginn-Regel des Nr. 5a: sechs Monate (nicht die vier Wochen aus § 9 Abs. 4a S. 7). Der Scope kennt die Unterbrechungshistorie nicht.'
  - bedingung: unterkunft_im_inland
    deckt_ab: 2 000 Euro im Monat bei einer Unterkunft im Ausland
    quelle: § 9 Abs. 1 S. 3 Nr. 5 Satz 4 EStG (via Verweis Nr. 5a Satz 4)
    beschreibung: MVP-Linie Inland. Der Verweis auf Nr. 5 zieht die 2.000-Euro-Auslandsgrenze mit; Auslandsfall zurueckgestellt.
  - bedingung: kosten_bei_alleiniger_nutzung
    deckt_ab: die bei alleiniger Nutzung durch den Arbeitnehmer angefallen wären
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 3 EStG
    beschreibung: Bei gemeinsamer Nutzung nur die Kosten bei alleiniger Nutzung ansetzbar. Input-Semantik von uebernachtungskosten_monat.
  - bedingung: erste_taetigkeitsstaette_liegt_nicht_am_ort
    deckt_ab: an einer Tätigkeitsstätte, die nicht erste Tätigkeitsstätte ist
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 1 EStG
    beschreibung: Uebernachtung an einer Taetigkeitsstaette, die nicht erste Taetigkeitsstaette ist.
  - bedingung: zeitraum_ohne_schwellenuebertritt
    deckt_ab: bis zur Höhe des Betrags nach Nummer 5
    quelle: § 9 Abs. 1 S. 3 Nr. 5a Satz 4 EStG
    beschreibung: Der Abrechnungszeitraum liegt vollstaendig VOR oder vollstaendig NACH Ablauf der 48 Monate. Ueberspannende Zeitraeume (z.B. monate_bisher_am_ort 45, monate 6 = 3 ungekappt + 3 gekappt) bildet die Signatur nicht ab; der Aufrufer muss an der Schwelle splitten. Ehrliche Teilformalisierung (Instructor msg 1185).
  test_seed:
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: bis zur Höhe des Betrags nach Nummer 5
    herkunft: synthetisch
    rechenweg: monate_bisher_am_ort 10 <= 48 -> keine Kappung; 800 x 12 = 9.600,00.
    inputs:
      uebernachtungskosten_monat: 800
      monate: 12
      monate_bisher_am_ort: 10
    expected: 9600.0
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: 1 000 Euro im Monat
    herkunft: synthetisch
    rechenweg: monate_bisher_am_ort 47 = 47 volle Monate abgelaufen, laufender Monat ist der 48. -> Ablauf von 48 Monaten noch nicht erreicht, keine Kappung; 1.400 x 12 = 16.800,00. Randfall 47 (ungekappt).
    inputs:
      uebernachtungskosten_monat: 1400
      monate: 12
      monate_bisher_am_ort: 47
    expected: 16800.0
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: 1 000 Euro im Monat
    herkunft: synthetisch
    rechenweg: monate_bisher_am_ort 48 = 48 volle Monate abgelaufen, laufender Monat ist der 49. -> Nach Ablauf von 48 Monaten, Kappung auf 1.000/Monat; 1.000 x 12 = 12.000,00. Randfall 48 (gekappt).
    inputs:
      uebernachtungskosten_monat: 1400
      monate: 12
      monate_bisher_am_ort: 48
    expected: 12000.0
  signature:
    scope: Uebernachtungskosten
    inputs:
      uebernachtungskosten_monat: money
      monate: int
      monate_bisher_am_ort: int
    output: abziehbare_uebernachtungskosten
  raster:
  - uebernachtungskosten_monat: 800
    monate: 12
    monate_bisher_am_ort: 10
  - uebernachtungskosten_monat: 1400
    monate: 12
    monate_bisher_am_ort: 10
  - uebernachtungskosten_monat: 1400
    monate: 12
    monate_bisher_am_ort: 47
  - uebernachtungskosten_monat: 1400
    monate: 12
    monate_bisher_am_ort: 48
