- rule_id: p10_1_3_3a_kv_pv
  norm: § 10 Abs. 1 Nr. 3 und 3a, Abs. 4 EStG
  quellen:
  - typ: gesetz
    label: "§ 10 Abs. 1 Nr. 3/3a, Abs. 4 EStG (KV/PV + sonstige Vorsorge, Höchstbetrag)"
    datei: sources/gesetze-im-internet/estg_p10_2026-07-11.txt
    zitatanker: "Beiträge zu Kranken- und Pflegeversicherungen, soweit diese nicht nach Nummer 3 zu berücksichtigen sind"
    auszug: "Vorsorgeaufwendungen im Sinne des Absatzes 1 Nummer 3 und 3a können je Kalenderjahr insgesamt bis 2 800 Euro abgezogen werden. 2 Der Höchstbetrag beträgt 1 900 Euro bei Steuerpflichtigen, die ganz oder teilweise ohne eigene Aufwendungen einen Anspruch auf vollständige oder teilweise Erstattung oder Übernahme von Krankheitskosten haben oder für deren Krankenversicherung Leistungen im Sinne des § 3 Nummer 9, 14, 57 oder 62 erbracht werden."
  - typ: gesetz
    label: "§ 10 Abs. 4 Satz 4 EStG (Basis-Durchbruch: Nr-3 ueber Hoechstbetrag voll, Nr-3a scheidet aus)"
    datei: sources/gesetze-im-internet/estg_p10_2026-07-11.txt
    zitatanker: "ein Abzug von Vorsorgeaufwendungen im Sinne des Absatzes 1 Nummer 3a scheidet aus"
    auszug: "Übersteigen die Vorsorgeaufwendungen im Sinne des Absatzes 1 Nummer 3 die nach den Sätzen 1 bis 3 zu berücksichtigenden Vorsorgeaufwendungen, sind diese abzuziehen und ein Abzug von Vorsorgeaufwendungen im Sinne des Absatzes 1 Nummer 3a scheidet aus."
