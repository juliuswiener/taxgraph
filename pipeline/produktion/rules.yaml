      est_verbleibendes_zve_plus_fuenftel_ao: 9200
    expected: 6000.0
  - quelle: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: beträgt das Fünffache des Unterschiedsbetrags
    herkunft: synthetisch
    rechenweg: 'WAECHTER keine ao-Einkuenfte (Differenz 0): est_ao = 5 x (8.000-8.000) = 0,00.'
