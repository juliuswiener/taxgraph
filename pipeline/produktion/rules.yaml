  - quelle: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: ein Zwölftel für jeden vollen Monat
    herkunft: synthetisch
    rechenweg: 'Altfall USt-frei: netto 801 > 800, Monat1 -> AfA voll brutto 801/3 = 267.'
    inputs:
      anschaffungskosten_netto: 801
