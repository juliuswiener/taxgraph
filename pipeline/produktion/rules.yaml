- rule_id: p34_fuenftel_ao_est
  hinweis: est_ao = 5 * (est_verbleibendes_zve_plus_fuenftel_ao - est_verbleibendes_zve). BEIDE ESt-Werte sind INPUTS (Tarif-Andockung § 31/§ 32b-Muster) - KEIN Selbst-Tarif, KEINE Tariffunktion in dieser Regel. Faktor 5 ist eine exakte Struktur-Konstante (NICHT /100). Kein max(0)-Boden noetig (Differenz konstruktiv >= 0 bei verbleibendem zvE >= 0).
  norm: § 34 Abs. 1 EStG (Fuenftelregelung, ausserordentliche Einkuenfte)
  quellen:
  - typ: gesetz
    label: § 34 Abs. 1 S. 2 EStG (Fuenftelregelung)
    datei: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
    zitatanker: beträgt das Fünffache des Unterschiedsbetrags
    auszug: Die für die außerordentlichen Einkünfte anzusetzende Einkommensteuer beträgt das Fünffache des Unterschiedsbetrags zwischen der Einkommensteuer für das um diese Einkünfte verminderte zu versteuernde Einkommen (verbleibendes zu versteuerndes Einkommen) und der Einkommensteuer für das verbleibende zu versteuernde Einkommen zuzüglich eines Fünftels dieser Einkünfte.
  geltungsbedingungen:
  - bedingung: ao_einkuenfte_zusammengeballt
    deckt_ab: Als außerordentliche Einkünfte kommen nur in Betracht
    quelle: § 34 Abs. 2 EStG
    beschreibung: 'Nur qualifizierte ao-Einkuenfte (Abs 2: Veraeusserungsgewinne Nr1, Entschaedigungen § 24 Nr1 = Abfindungen Nr2, Nachzahlungen >3J Nr3, mehrjaehrige Verguetungen Nr4). Die Zusammenballungs-/ao-Qualifikation erfolgt in der § 2-Integration; hier sind beide ESt-Vergleichswerte bereits Inputs (Andockung).'
  - bedingung: verbleibendes_zve_nicht_negativ
    deckt_ab: Ist das verbleibende zu versteuernde Einkommen negativ und das zu versteuernde Einkommen positiv
    quelle: § 34 Abs. 1 S. 3 EStG
    beschreibung: Sonderpfad Abs1 S3 (verbleibendes zvE negativ, zvE positiv -> est_ao = 5 x est(zvE/5)) ausgeklammert; braucht dritten Tarif-Input, Verlust-Sonderfall AN-fern. Diese Regel deckt den Kernfall verbleibendes zvE >= 0.
  rundung: []
  signature:
    scope: FuenftelAoEst
    inputs:
      est_verbleibendes_zve: money
      est_verbleibendes_zve_plus_fuenftel_ao: money
    output: est_ao
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p34_2026-07-13.txt
