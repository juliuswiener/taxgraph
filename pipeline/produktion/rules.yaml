- rule_id: p33_1_2_agb_abzug
  norm: § 33 Abs. 1, 2 EStG
  quellen:
  - typ: gesetz
    label: "§ 33 Abs. 1, 2 EStG (agB-Abzug, Zwangslaeufigkeit)"
    datei: sources/gesetze-im-internet/estg_p33_2026-07-11.txt
    zitatanker: "zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag der Einkünfte abgezogen"
    auszug: "Erwachsen einem Steuerpflichtigen zwangsläufig größere Aufwendungen als der überwiegenden Mehrzahl der Steuerpflichtigen gleicher Einkommensverhältnisse, gleicher Vermögensverhältnisse und gleichen Familienstands (außergewöhnliche Belastung), so wird auf Antrag die Einkommensteuer dadurch ermäßigt, dass der Teil der Aufwendungen, der die dem Steuerpflichtigen zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag der Einkünfte abgezogen wird."
  geltungsbedingungen:
  - bedingung: agb_ist_zwangslaeufig
    deckt_ab: "wenn er sich ihnen aus rechtlichen, tatsächlichen oder sittlichen Gründen nicht entziehen kann"
    quelle: "§ 33 Abs. 2 Satz 1 EStG"
    beschreibung: "agB zwangslaeufig i.S.d. Abs. 2 S. 1. Input-Semantik."
  - bedingung: agb_notwendig_und_angemessen
    deckt_ab: "den Umständen nach notwendig sind und einen angemessenen Betrag nicht übersteigen"
    quelle: "§ 33 Abs. 2 Satz 1 EStG"
    beschreibung: "Nur der notwendige und angemessene Teil. Input-Semantik."
  - bedingung: keine_ausgeschlossenen_aufwendungen
    deckt_ab: "Aufwendungen, die zu den Betriebsausgaben, Werbungskosten oder Sonderausgaben gehören, bleiben dabei außer Betracht"
    quelle: "§ 33 Abs. 2 Satz 2-4 EStG"
    beschreibung: "BA/WK/SA, Diaetverpflegung, Prozesskosten ausser Betracht. Input enthaelt sie nicht."
  - bedingung: keine_behinderungsbedingten_fahrtkosten
    deckt_ab: "behinderungsbedingte Fahrtkostenpauschale"
    quelle: "§ 33 Abs. 2a EStG"
    beschreibung: "Behinderungs-Fahrtkosten laufen ueber die Pauschale (900/4.500), eigener Zweig - MVP ausgeklammert."
  - bedingung: zumutbare_belastung_ist_p33_3_ergebnis
    deckt_ab: "zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag der Einkünfte abgezogen"
    quelle: "§ 33 Abs. 1 EStG"
    beschreibung: "zumutbare_belastung = Ergebnis von p33_3 (Abs. 3). Von der § 2-Integration."
  rundung: []
  signature:
    scope: AgbAbzug
    inputs:
      aussergewoehnliche_belastungen: money
      zumutbare_belastung: money
    output: abzug_agb
  test_seed:
