    expected: 0.0
  geltungsbedingungen:
  - bedingung: personensteuern_nichtabziehbar
    deckt_ab: die Steuern vom Einkommen und sonstige Personensteuern
    quelle: § 10 Nr. 2 KStG
    datei: sources/gesetze-im-internet/kstg_p10_2026-07-16.txt
    beschreibung: 'personensteuern = INPUT-Betrag der nach § 10 Nr. 2 nichtabziehbaren Steuern vom Einkommen + sonstigen Personensteuern (KSt selbst, SolZ, auslaend. Personensteuern; USt auf Entnahmen/vGA + Nebenleistungen), soweit sie den Steuerbilanzgewinn gemindert haben -> Add-back. Betrag ist Sachverhalt, keine Bewertung hier.'
  - bedingung: geldstrafen_nichtabziehbar
    deckt_ab: in einem Strafverfahren festgesetzte Geldstrafen
    quelle: § 10 Nr. 3 KStG
    datei: sources/gesetze-im-internet/kstg_p10_2026-07-16.txt
    beschreibung: 'geldstrafen = INPUT-Betrag der nach § 10 Nr. 3 nichtabziehbaren, in einem Strafverfahren festgesetzten Geldstrafen + strafaehnlichen Rechtsfolgen vermoegensrechtlicher Art (Strafcharakter ueberwiegt) + Auflagen/Weisungen (soweit nicht Schadenswiedergutmachung). Abgrenzung Geldbussen/EU-Kartellbussen (§ 4 Abs. 5 S. 1 Nr. 8 EStG) = Nachtrag.'
  - bedingung: rechtsform_kapitalgesellschaft
    deckt_ab: die Steuern vom Einkommen und sonstige Personensteuern
    quelle: § 1 Abs. 1 Nr. 1 i.V.m. § 10 KStG
    datei: sources/gesetze-im-internet/kstg_p10_2026-07-16.txt
    beschreibung: 'rechtsform = Kapitalgesellschaft (§ 1 Abs. 1 Nr. 1); Hinzurechnung nichtabziehbarer Aufwendungen im KSt-Einkommen. Abgrenzung gegen PersGes-Kern (C24).'

- rule_id: p10d_kst_verlustabzug
  norm: § 8 Abs. 1 KStG i.V.m. § 10d Abs. 2 EStG (Verlustvortrag Kapitalgesellschaft, 1-Mio-Sockel + 70 %)
  hinweis: 'verlustabzug = min(verlustvortrag_bestand, 1000000 + (70 / 100) * max(0, gesamtbetrag_einkuenfte - 1000000)). Die Koerperschaftsteuer bemisst sich nach dem Einkommen, das sich nach den Vorschriften des EStG bestimmt (§ 8 Abs. 1 KStG) -> der Verlustvortrag laeuft ueber § 10d Abs. 2 EStG. Kapitalgesellschaft kennt KEINE Zusammenveranlagung -> Sockel FIX 1.000.000 (nicht 2.000.000). 70 ist ein PROZENTWERT -> Division durch 100 in decimal rechnen, Cent-Schnitt ZULETZT. verlustvortrag_bestand = zum Schluss des Vorjahres gesondert festgestellter verbleibender Verlustvortrag (State-Input, >= 0), Mehrjahres-Fortschreibung (§ 10d Abs. 4) NICHT hier. WICHTIG 60/70: hier 70 % wie § 10d EStG (KSt-Verweis ueber § 8 Abs. 1), NICHT 60 % wie § 10a GewStG - die 60/70-Trennung ist spiegelbildlich zum GewSt-Korpus im Golden zu verankern (bei GdE 5 Mio / Bestand 5 Mio ergibt 70 % -> 3.800.000, 60 % ergaebe 3.400.000). Verlustruecktrag (§ 10d Abs. 1), § 8c/§ 8d (Verlustuntergang bei Anteilseignerwechsel) = Nachtrag. FORMALISIERUNG: EINE unbedingte Definition (min/max), KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 10d Abs. 2 S. 1 EStG (Verlustvortrag, 1-Mio-Sockel + 70 %)
    datei: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    auszug: Nicht ausgeglichene negative Einkünfte, die nicht nach Absatz 1 abgezogen worden sind, sind in den folgenden Veranlagungszeiträumen bis zu einem Gesamtbetrag der Einkünfte von 1 Million Euro unbeschränkt, darüber hinaus bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte vorrangig vor Sonderausgaben, außergewöhnlichen Belastungen und sonstigen Abzugsbeträgen abzuziehen (Verlustvortrag).
  - typ: gesetz
    label: § 8 Abs. 1 Satz 1 KStG (Einkommen nach EStG-Vorschriften — § 10d anwendbar)
    datei: sources/gesetze-im-internet/kstg_p8_2026-07-16.txt
    zitatanker: bestimmt sich nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes
    auszug: Was als Einkommen gilt und wie das Einkommen zu ermitteln ist, bestimmt sich nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes.
  signature:
    scope: VerlustabzugKoerperschaft
    inputs:
      gesamtbetrag_einkuenfte: money
      verlustvortrag_bestand: money
    output: verlustabzug
  raster:
  - gesamtbetrag_einkuenfte: 900000
    verlustvortrag_bestand: 700000
  - gesamtbetrag_einkuenfte: 5000000
    verlustvortrag_bestand: 5000000
  - gesamtbetrag_einkuenfte: 5000000
    verlustvortrag_bestand: 2000000
  - gesamtbetrag_einkuenfte: 5000000
    verlustvortrag_bestand: 0
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    herkunft: synthetisch
    rechenweg: 'Sockel bindet nicht: GdE 900.000 < 1 Mio -> cap = 1.000.000. min(700.000, 1.000.000) = 700.000,00 (voller Bestand).'
    inputs:
      gesamtbetrag_einkuenfte: 900000
      verlustvortrag_bestand: 700000
    expected: 700000.0
  - quelle: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    herkunft: synthetisch
    rechenweg: '70-%-DECKEL bindet (60/70-Kontrast!): cap = 1.000.000 + 0,70 x (5.000.000 - 1.000.000) = 1.000.000 + 2.800.000 = 3.800.000. min(5 Mio, 3,8 Mio) = 3.800.000,00. Mit 60 % (§ 10a GewStG) waeren es 3.400.000 - hier NICHT.'
    inputs:
      gesamtbetrag_einkuenfte: 5000000
      verlustvortrag_bestand: 5000000
    expected: 3800000.0
  - quelle: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    herkunft: synthetisch
    rechenweg: 'Bestand kappt: cap = 3.800.000, aber Bestand nur 2.000.000. min(2.000.000, 3.800.000) = 2.000.000,00.'
    inputs:
      gesamtbetrag_einkuenfte: 5000000
      verlustvortrag_bestand: 2000000
    expected: 2000000.0
  - quelle: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    zitatanker: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    herkunft: synthetisch
    rechenweg: 'GRENZFALL kein Vortrag: min(0, 3.800.000) = 0,00.'
    inputs:
      gesamtbetrag_einkuenfte: 5000000
      verlustvortrag_bestand: 0
    expected: 0.0
  geltungsbedingungen:
  - bedingung: verlustvortrag_bestand_festgestellt
    deckt_ab: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    quelle: § 10d Abs. 2 i.V.m. Abs. 4 EStG
    datei: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    beschreibung: 'verlustvortrag_bestand = der zum Schluss des Vorjahres gesondert festgestellte verbleibende Verlustvortrag (Abs. 4), State-Input aus der VZ-Integration; die Fortschreibung selbst ist NICHT Gegenstand. Bestand >= 0. Verlustruecktrag (Abs. 1) = Nicht-Gegenstand (fremder VZ).'
  - bedingung: sockel_1mio_plus_70prozent
    deckt_ab: bis zu 70 Prozent des 1 Million Euro übersteigenden Gesamtbetrags der Einkünfte
    quelle: § 10d Abs. 2 Satz 1 EStG
    datei: sources/gesetze-im-internet/estg_p10d_2026-07-13.txt
    beschreibung: 'Hoechstbetrag = 1.000.000 unbeschraenkt + 70 % (= 70/100 exakt) des 1 Mio uebersteigenden Gesamtbetrags der Einkuenfte; Abzug = min(Bestand, Hoechstbetrag). 70 % wie § 10d EStG, NICHT 60 % wie § 10a GewStG. GUELTIGKEITS-FENSTER (Gueltigkeits-Direktive): die 70-%-Quote gilt fuer VZ 2024-2027 (WtChancenG v. 27.03.2024, i.V.m. § 52 EStG); ab VZ 2028 Rueckfall auf 60 % = benannter Nachtrag. Im Bau-Scope VZ 2024-2026 einfassig konstant 70 %; die 2028-Schwelle ist NICHT still, sondern hier ausgewiesen und bei einem kuenftigen VZ-2028-Schnitt neu zu formalisieren.'
  - bedingung: rechtsform_kapitalgesellschaft_kein_splitting
    deckt_ab: bestimmt sich nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes
    quelle: § 1 Abs. 1 Nr. 1 i.V.m. § 8 Abs. 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8_2026-07-16.txt
    beschreibung: 'rechtsform = Kapitalgesellschaft (§ 1 Abs. 1 Nr. 1): kennt KEINE Zusammenveranlagung/Splitting -> Sockel FIX 1.000.000 (nicht 2 Mio wie bei zusammenveranlagten natuerlichen Personen). § 8 Abs. 1 KStG traegt den § 10d-EStG-Verweis. Abgrenzung gegen PersGes-Kern (C24).'

- rule_id: p23_koerperschaftsteuer_satz
  norm: § 23 Abs. 1 Nr. 1 KStG (Körperschaftsteuer-Satz 15 % des zvE, VZ 2024-2026)
  hinweis: 'koerperschaftsteuer = zu_versteuerndes_einkommen * 15 / 100. § 23 Abs. 1 Nr. 1: "Veranlagungszeiträume bis 2027 15 Prozent" -> im Scope VZ 2024-2026 KONSTANT 15 %. 15 % = 15/100 = 3/20 EXAKT (nicht 0,15 vorrunden); Division durch 100 in decimal, Cent-Schnitt ZULETZT. BOUNDS-ASSERTION PFLICHT: der Catala-Code MUSS die Zeile "assertion veranlagungszeitraum >= 2024 and veranlagungszeitraum <= 2026" enthalten (int-VZ-Muster). OHNE diese Assertion bleibt der veranlagungszeitraum-Input UNBENUTZT und die 15-%-Definition gilt faelschlich fuer ALLE VZ (auch 2028+, wo 14 % gaelten) - das ist ein Fehler. Die Assertion schneidet die Regel auf VZ 2024-2026 zu, wo 15 % konstant korrekt ist. WICHTIG (toter-Code-Verbot): die Staffel 14/13/12/11/10 % (VZ 2028-2032+, StInvSofortPG) ist NICHT zu kodieren und NICHT als toter Code / VZ-Fallunterscheidung zu materialisieren - sie belegt nur die Aktualitaet des Freezes; im Scope 15 % konstant, KEINE Staffel-Logik, KEINE Jahres-exceptions. zvE = das dem Satz zugrunde liegende zu versteuernde Einkommen (§ 7 Abs. 2: Einkommen § 8 Abs. 1 vermindert um Freibetraege §§ 24/25; fuer KapGes ist der § 24-Freibetrag = 0, Ausschluss § 24 S. 2 Nr. 1 -> zvE = Einkommen) - kommt als INPUT aus der Nenner-B-Kette (nicht hier gerechnet). Abs. 2 (§ 51 Abs. 3 EStG-Ermaechtigung) = Nachtrag. FORMALISIERUNG: EINE unbedingte Definition + Bounds-Assertion, KEINE Staffel-/Jahres-exceptions.'
  quellen:
  - typ: gesetz
    label: § 23 Abs. 1 Nr. 1 KStG (15 Prozent, Veranlagungszeiträume bis 2027)
    datei: sources/gesetze-im-internet/kstg_p23_2026-07-16.txt
    zitatanker: Veranlagungszeiträume bis 2027 15 Prozent
    auszug: Die Körperschaftsteuer beträgt für 1. Veranlagungszeiträume bis 2027 15 Prozent, 2. den Veranlagungszeitraum 2028 14 Prozent
  signature:
    scope: KoerperschaftsteuerSatz
    inputs:
      zu_versteuerndes_einkommen: money
      veranlagungszeitraum: int
    output: koerperschaftsteuer
  raster:
  - zu_versteuerndes_einkommen: 603000
    veranlagungszeitraum: 2026
  - zu_versteuerndes_einkommen: 1000000
    veranlagungszeitraum: 2024
  - zu_versteuerndes_einkommen: 0
    veranlagungszeitraum: 2025
  test_seed:
  - quelle: sources/gesetze-im-internet/kstg_p23_2026-07-16.txt
    zitatanker: Veranlagungszeiträume bis 2027 15 Prozent
    herkunft: synthetisch
    rechenweg: 'VZ 2026 (<= 2027 -> 15 %): koerperschaftsteuer = 603.000 * 15/100 = 90.450,00.'
    inputs:
      zu_versteuerndes_einkommen: 603000
      veranlagungszeitraum: 2026
    expected: 90450.0
  - quelle: sources/gesetze-im-internet/kstg_p23_2026-07-16.txt
    zitatanker: Veranlagungszeiträume bis 2027 15 Prozent
    herkunft: synthetisch
    rechenweg: 'VZ 2024 (15 % konstant): 1.000.000 * 15/100 = 150.000,00.'
    inputs:
      zu_versteuerndes_einkommen: 1000000
      veranlagungszeitraum: 2024
    expected: 150000.0
  - quelle: sources/gesetze-im-internet/kstg_p23_2026-07-16.txt
    zitatanker: Veranlagungszeiträume bis 2027 15 Prozent
    herkunft: synthetisch
    rechenweg: 'GRENZFALL zvE 0: 0 * 15/100 = 0,00.'
    inputs:
      zu_versteuerndes_einkommen: 0
      veranlagungszeitraum: 2025
    expected: 0.0
  geltungsbedingungen:
  - bedingung: satz_15_prozent_vz_bis_2027
    deckt_ab: Veranlagungszeiträume bis 2027 15 Prozent
    quelle: § 23 Abs. 1 Nr. 1 KStG
    datei: sources/gesetze-im-internet/kstg_p23_2026-07-16.txt
    beschreibung: 'KSt-Satz 15 % (= 15/100) fuer Veranlagungszeitraeume bis 2027; im Scope VZ 2024-2026 konstant. Bounds-Assertion veranlagungszeitraum in [2024, 2026]. GUELTIGKEITS-VERMERK (Gueltigkeits-Direktive): 15 % gilt fuer VZ <= 2027; die StInvSofortPG-Staffel 14/13/12/11/10 % ab VZ 2028 (= benannter Nachtrag) ist NICHT kodiert und darf NIE als stille Fortschreibung ueber 2026 hinaus angenommen werden - ein kuenftiger VZ-2028-Schnitt erfordert Bounds-Erweiterung + Staffel-Formalisierung.'
  - bedingung: rechtsform_kapitalgesellschaft
    deckt_ab: Veranlagungszeiträume bis 2027 15 Prozent
    quelle: § 1 Abs. 1 Nr. 1 i.V.m. § 23 KStG
    datei: sources/gesetze-im-internet/kstg_p23_2026-07-16.txt
    beschreibung: 'rechtsform = Kapitalgesellschaft (§ 1 Abs. 1 Nr. 1); der KSt-Satz 15 % trifft das zvE der KapGes. Abgrenzung gegen PersGes-Kern (C24, § 15 EStG - dort ESt-Tarif § 32a, nicht 15 %).'

- rule_id: p4h_zinsschranke_kern
  norm: § 4h Abs. 1 EStG (Zinsschranke — abziehbare Zinsaufwendungen, verrechenbares EBITDA 30 %, Zins-/EBITDA-Vortrag)
  hinweis: 'EXAKTE FORMEL - GENAU FUENF unbedingte Definitionen, in dieser Reihenfolge, KEINE zusaetzlichen Terme, KEINE Jahres-/Fall-exceptions: (1) verrechenbares_ebitda = ebitda_basis * 30 / 100 ; (2) zinsaufwand_eff = zinsaufwand + zins_vortrag_bestand ; (3) deckel = verrechenbares_ebitda + ebitda_vortrag_bestand ; (4) zinssaldo_eff = zinsaufwand_eff - zinsertrag ; (5) abziehbare_zinsaufwendungen = zinsertrag + min(zinssaldo_eff, deckel). Das ist die vollstaendige Regel - NICHTS hinzufuegen. § 4h Abs. 1 Satz 1: Zinsaufwendungen abziehbar in Hoehe des Zinsertrags, darueber hinaus bis zur Hoehe des verrechenbaren EBITDA. 30 % = 30/100 (Catala-decimal 0.30 ist exakt), Cent-Schnitt zuletzt. ZU (1) - KRITISCH: ebitda_basis IST EIN FERTIG BERECHNETER INPUT, die vollstaendige Bemessungsgrundlage des verrechenbaren EBITDA (Satz 2). verrechenbares_ebitda = ebitda_basis * 30/100 DIREKT, sonst NICHTS. STRIKTES VERBOT: NIEMALS zinsaufwand, zinsertrag, zinsaufwand_eff, AfA, § 6/§ 7-Betraege oder einen Gewinn zu ebitda_basis addieren oder davon abziehen - die Basis enthaelt all diese Groessen bereits (der Satz-2-Wortlaut "erhoeht um die Zinsaufwendungen ... vermindert um die Zinsertraege" beschreibt, was IN ebitda_basis schon steckt, und ist KEINE hier auszufuehrende Rechnung). ebitda_basis erscheint AUSSCHLIESSLICH in Definition (1). (Fuer KapGes tritt gemaess § 8a das maßgebliche Einkommen an die Stelle des Gewinns = N3, ausserhalb dieser Regel.) ZU (2)/(3) BESTAND-MUSTER (analog p10d, State-Inputs >= 0): zins_vortrag_bestand (Satz 6) erhoeht NUR zinsaufwand_eff; ebitda_vortrag_bestand (Satz 4) erhoeht NUR deckel. AUFLAGE a KEIN DOPPELEFFEKT (Satz 6 Hs. 2 "nicht aber den maßgeblichen Gewinn"): der Zinsvortrag beeinflusst ebitda_basis / verrechenbares_ebitda NICHT. ZU (4) KEIN KLEMMEN: zinssaldo_eff = zinsaufwand_eff - zinsertrag DARF NEGATIV SEIN; VERBOTEN ist "if zinsaufwand_eff > zinsertrag then ... else 0" oder max(0, ...). Bei Zinsueberschuss (zinsertrag > zinsaufwand_eff) ist zinssaldo_eff negativ, min(zinssaldo_eff, deckel) = zinssaldo_eff, also abziehbar = zinsertrag + (zinsaufwand_eff - zinsertrag) = zinsaufwand_eff (voller Abzug). Klemmen bei 0 liefert faelschlich abziehbar > zinsaufwand_eff. Der nicht abziehbare Teil (= zinsaufwand_eff - abziehbare_zinsaufwendungen = neuer Zinsvortrag, Satz 5) wird NICHT hier ausgegeben, sondern von N6/Golden auf der K1-Slot-Seite hinzugerechnet (Add-back erhoeht den Gewinn). AUFLAGE b Verbrauchsreihenfolge Satz 4/5 (erst laufendes EBITDA, dann Vortrag) + Roll-Forward = benannter Nachtrag, NICHT kodieren. Abs. 2 Ausnahmen/Freigrenze < 3 Mio = eigene Charge N2. Abs. 3 Definitionen, Abs. 4 Feststellung, Abs. 5 Betriebsaufgabe, Abs. 6 Infrastruktur = Nachtrag. FORMALISIERUNG: fuenf unbedingte Definitionen (min ok), KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 4h Abs. 1 Satz 1 EStG (abziehbar in Höhe Zinsertrag + verrechenbares EBITDA)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: sind abziehbar in Höhe des Zinsertrags, darüber hinaus nur bis zur Höhe des verrechenbaren EBITDA
    auszug: Zinsaufwendungen eines Betriebs sind abziehbar in Höhe des Zinsertrags, darüber hinaus nur bis zur Höhe des verrechenbaren EBITDA.
  - typ: gesetz
    label: § 4h Abs. 1 Satz 2 EStG (verrechenbares EBITDA = 30 % des maßgeblichen Gewinns)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: verrechenbare EBITDA ist 30 Prozent des
    auszug: Das verrechenbare EBITDA ist 30 Prozent des um die Zinsaufwendungen und um die nach § 6 Absatz 2 Satz 1 abzuziehenden, nach § 6 Absatz 2a Satz 2 gewinnmindernd aufzulösenden und nach § 7 abgesetzten Beträge erhöhten und um die Zinserträge verminderten maßgeblichen Gewinns.
  - typ: gesetz
    label: § 4h Abs. 1 Satz 4 EStG (EBITDA-Vortrag erhöht den Abzugsdeckel)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: sind bis zur Höhe der EBITDA-Vorträge aus vorangegangenen Wirtschaftsjahren abziehbar
    auszug: Zinsaufwendungen, die nach Satz 1 nicht abgezogen werden können, sind bis zur Höhe der EBITDA-Vorträge aus vorangegangenen Wirtschaftsjahren abziehbar und mindern die EBITDA-Vorträge in ihrer zeitlichen Reihenfolge.
  - typ: gesetz
    label: § 4h Abs. 1 Satz 5/6 EStG (Zinsvortrag; erhöht Zinsaufwand, nicht den Gewinn)
    datei: sources/gesetze-im-internet/estg_p4h_2026-07-16.txt
    zitatanker: Sie erhöhen die Zinsaufwendungen dieser Wirtschaftsjahre, nicht aber den maßgeblichen Gewinn
    auszug: Danach verbleibende nicht abziehbare Zinsaufwendungen sind in die folgenden Wirtschaftsjahre vorzutragen (Zinsvortrag). 6 Sie erhöhen die Zinsaufwendungen dieser Wirtschaftsjahre, nicht aber den maßgeblichen Gewinn.
