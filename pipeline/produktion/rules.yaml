# NICHT-GEGENSTAND: p9_1_3_nr6_7_afa_ueberhangsjahr entfaellt als Formalisierungsregel
# (Instructor msg 1256, Option 2). Der Terminal-/Ueberhangsjahr-Rest bei unterjaehrigem
# Beginn = AK minus Summe der laufend-Jahre = arithmetischer Abschluss der linearen AfA,
