- rule_id: p10a_guenstigerpruefung
  hinweis: 'zusaetzliche_steuerermaessigung = max(0, (est_ohne_sonderausgabenabzug - est_mit_sonderausgabenabzug) - zulageanspruch_guenstigerpruefung). BEIDE ESt-Werte sind INPUTS (Tarif-Andockung § 31/§ 34-Muster) - KEIN Selbst-Tarif. Wenn SA-Vorteil > Zulageanspruch: Differenz gewaehrt (SA guenstiger, § 10a Abs2 S1); sonst 0 (nur Zulage, Abs2 S2). Die Hinzurechnung des Zulageanspruchs zur tariflichen ESt = § 2-Integration. zulageanspruch_guenstigerpruefung = Zulage OHNE § 84-S2-Erhoehung (§ 10a Abs1 S5, kommt bereinigt als Input). BMF Rn 106 (verwaltung, Freeze 2026-07-14): die HINZURECHNUNG Abs2 erfolgt BEREINIGT (ohne § 84-S2-200-Euro-Erhoehungsbetrag) - bestaetigt dieses bereinigte Design; Festlegung an der § 2-Integration (Abs 6 hinzurechnung_zulage). Nachtrag erledigt.'
  norm: § 10a Abs. 2 + Abs. 4 S. 1 EStG (Guenstigerpruefung, hinausgehende Steuerermaessigung)
  quellen:
  - typ: gesetz
    label: § 10a Abs. 2 S. 1-2 EStG (Guenstigerpruefung)
