  hinweis: abziehbar = 0,70 * angemessene_bewirtungsaufwendungen. Nur der Teil, der 70% der ANGEMESSENEN Aufwendungen UEBERsteigt, ist nicht abziehbar -> abziehbar = 70% des angemessenen Betrags. 0,70 als decimal. KEINE deklarierte Rundung (der Wortlaut nennt keine); Cent-Schnitt zuletzt ist Pipeline-Konvention (konv). 'angemessen' = allgemeine Verkehrsauffassung -> Input ist der bereits als angemessen bewertete Betrag, nicht gerechnet.
