    zitatanker: bis zu 60 Prozent
    herkunft: synthetisch
    rechenweg: '60-%-STAFFEL: cap = 1 Mio + 0,60 x (3 Mio - 1 Mio) = 1.000.000 + 1.200.000 = 2.200.000. min(5 Mio, 2,2 Mio) = 2.200.000,00 (60 %, NICHT 70 % wie § 10d -> waere 2.400.000).'
    inputs:
      massgebender_gewerbeertrag: 3000000
      fehlbetrag_bestand: 5000000
    expected: 2200000.0
  - quelle: sources/gesetze-im-internet/gewstg_p10a_2026-07-16.txt
    zitatanker: bis zu einem Betrag in Höhe von 1 Million Euro um die Fehlbeträge gekürzt
    herkunft: synthetisch
    rechenweg: 'Kein Fehlbetrag-Bestand: min(0, ...) = 0,00 (Kante).'
    inputs:
      massgebender_gewerbeertrag: 500000
      fehlbetrag_bestand: 0
    expected: 0.0
  geltungsbedingungen:
  - bedingung: sockel_1_mio_unbeschraenkt
    deckt_ab: bis zu einem Betrag in Höhe von 1 Million Euro um die Fehlbeträge gekürzt
    quelle: § 10a S. 1 GewStG
    beschreibung: 'S. 1: bis 1 Mio Gewerbeertrag unbeschraenkte Fehlbetrag-Kuerzung. Kein Splitting-Sockel (betriebsbezogen).'
  - bedingung: staffel_60_prozent
    deckt_ab: bis zu 60 Prozent
    quelle: § 10a S. 2 GewStG
    beschreibung: 'S. 2: der 1 Mio uebersteigende Gewerbeertrag nur zu 60 % um Fehlbetraege kuerzbar. 60 %, NICHT 70 % - WtChancenG-Anhebung gilt nur § 10d EStG/KStG, § 10a unveraendert.'
  - bedingung: fehlbetrag_bestand_festgestellt
    deckt_ab: Der maßgebende Gewerbeertrag wird bis zu einem Betrag
    quelle: § 10a S. 6-7 GewStG
    beschreibung: 'fehlbetrag_bestand = gesondert festgestellter vortragsfaehiger Fehlbetrag zum Schluss des Vorjahres (S. 6-7) = State-Input; EZ-Fortschreibung nicht Gegenstand dieser Regel (Backlog-Grenze, wie p10d_2). Mitunternehmer-Zurechnung S. 4-5 / § 8c-8d KStG = Nachtrag.'
- rule_id: p11_steuermessbetrag
  norm: § 11 Abs. 1 S. 3 Nr. 1 + Abs. 2 GewStG (Steuermessbetrag, Freibetrag 24.500 + 3,5 %)
  hinweis: 'abgerundet = gewerbeertrag auf volle 100 Euro nach unten (Abrundung). nach_freibetrag = max(0, abgerundet - 24500). steuermessbetrag = nach_freibetrag * (35 / 1000) (= 3,5 %). Reihenfolge zwingend: erst abrunden auf 100, DANN Freibetrag 24.500 (natuerliche Person/PersG), DANN Steuermesszahl 3,5 %. 3,5 % = 0,035 EXAKT; money*decimal, Cent-Schnitt zuletzt. Freibetrag hoechstens bis zum abgerundeten Gewerbeertrag (max(0, ...)). 5.000-Freibetrag (§ 2 Abs. 3 / juristische Person oeff. Rechts) + Hausgewerbe-Ermaessigung 56 % (Abs. 3) = benannter Nachtrag.'
  quellen:
  - typ: gesetz
    label: § 11 Abs. 1 S. 3 Nr. 1 + Abs. 2 GewStG (Abrundung 100, Freibetrag 24.500, Messzahl 3,5 %)
    datei: sources/gesetze-im-internet/gewstg_p11_2026-07-16.txt
    zitatanker: Freibetrag in Höhe von 24 500 Euro
    auszug: Der Gewerbeertrag ist auf volle 100 Euro nach unten abzurunden und 1. bei natürlichen Personen sowie bei Personengesellschaften um einen Freibetrag in Höhe von 24 500 Euro
  - typ: gesetz
    label: § 11 Abs. 2 GewStG (Steuermesszahl 3,5 %)
    datei: sources/gesetze-im-internet/gewstg_p11_2026-07-16.txt
    zitatanker: Steuermesszahl für den Gewerbeertrag beträgt 3,5 Prozent
    auszug: Die Steuermesszahl für den Gewerbeertrag beträgt 3,5 Prozent.
  signature:
    scope: Steuermessbetrag
    inputs:
      gewerbeertrag: money
    output: steuermessbetrag
  raster:
  - gewerbeertrag: 603000
  - gewerbeertrag: 24500
  - gewerbeertrag: 100050
  - gewerbeertrag: 0
  test_seed:
  - quelle: sources/gesetze-im-internet/gewstg_p11_2026-07-16.txt
    zitatanker: Steuermesszahl für den Gewerbeertrag beträgt 3,5 Prozent
    herkunft: synthetisch
    rechenweg: 'GE 603.000 (schon volle 100): -24.500 = 578.500; * 3,5 % = 578.500 * 0,035 = 20.247,50 (Basis-Messbetrag).'
    inputs:
      gewerbeertrag: 603000
    expected: 20247.5
  - quelle: sources/gesetze-im-internet/gewstg_p11_2026-07-16.txt
    zitatanker: Freibetrag in Höhe von 24 500 Euro
    herkunft: synthetisch
    rechenweg: 'GE 24.500 = Freibetrag: max(0, 24.500 - 24.500) = 0; * 3,5 % = 0,00 (Kante, Freibetrag deckt alles).'
    inputs:
      gewerbeertrag: 24500
    expected: 0.0
  - quelle: sources/gesetze-im-internet/gewstg_p11_2026-07-16.txt
    zitatanker: auf volle 100 Euro nach unten abzurunden
    herkunft: synthetisch
    rechenweg: 'ABRUNDUNG: 100.050 -> volle 100 nach unten = 100.000; -24.500 = 75.500; * 0,035 = 2.642,50.'
    inputs:
      gewerbeertrag: 100050
    expected: 2642.5
  rundung:
  - deckt_ab: auf volle 100 Euro nach unten abzurunden
    zitatanker: auf volle 100 Euro nach unten abzurunden
    quelle: § 11 Abs. 1 S. 3 GewStG
  geltungsbedingungen:
  - bedingung: freibetrag_24500_natperson_persges
    deckt_ab: Freibetrag in Höhe von 24 500 Euro
    quelle: § 11 Abs. 1 S. 3 Nr. 1 GewStG
    beschreibung: 'Freibetrag 24.500 fuer natuerliche Personen + Personengesellschaften (nicht Kapitalges.), hoechstens bis zum abgerundeten Gewerbeertrag. 5.000-Freibetrag (§ 2 Abs. 3 u.a.) = Nachtrag.'
  - bedingung: steuermesszahl_3_5_prozent
    deckt_ab: Steuermesszahl für den Gewerbeertrag beträgt 3,5 Prozent
    quelle: § 11 Abs. 2 GewStG
    beschreibung: 'Steuermesszahl 3,5 % (= 0,035) auf den um Abrundung + Freibetrag geminderten Gewerbeertrag. Hausgewerbe-Ermaessigung 56 % (Abs. 3) = Nachtrag.'
- rule_id: p8_1_einkommen_koerperschaft
  norm: § 8 Abs. 1 i.V.m. Abs. 3 Satz 2/3 KStG (Einkommensermittlung Kapitalgesellschaft, Slot + vGA + verdeckte Einlagen)
  hinweis: 'einkommen = gewinn_estg + verdeckte_gewinnausschuettung - verdeckte_einlage. § 8 Abs. 1: was als Einkommen gilt/wie es zu ermitteln ist, bestimmt sich nach den Vorschriften des EStG UND dieses Gesetzes -> SLOT-Regel wie § 7 GewStG: gewinn_estg = der nach EStG-Vorschriften ermittelte Gewinn ist INPUT (nicht hier gerechnet). § 8 Abs. 3 Satz 2: verdeckte Gewinnausschuettungen (vGA) mindern das Einkommen NICHT -> als Betrag wieder HINZURECHNEN (+). Satz 3: verdeckte Einlagen erhoehen das Einkommen NICHT -> als Betrag ABZIEHEN (-). BEIDE sind reine SACHVERHALTS-/INPUT-Betraege (vorab bewertet), KEINE Bewertungslogik hier (Fremdvergleich/Angemessenheit ist Sachverhalt). money + money - money, EXAKT, keine Rundung. NEGATIVES Einkommen ZULAESSIG (Verlust -> § 10d, KEIN Boden bei 0). § 8b (Beteiligungsertraege), § 9 (Spenden), § 10 (nichtabziehbar), § 10d (Verlust) = eigene nachgelagerte Regeln, NICHT hier. rechtsform = Kapitalgesellschaft (Geltungsbedingung § 1 Abs. 1 Nr. 1); Betriebe gewerblicher Art / oeffentl.-rechtl. Rundfunk (Abs. 1 Saetze 2-3) = Nachtrag. FORMALISIERUNG: EINE unbedingte Definition (einkommen equals gewinn_estg + verdeckte_gewinnausschuettung - verdeckte_einlage), KEINE bedingten exceptions / Fallunterscheidungen auf > 0 - vGA und verdeckte Einlage sind vorzeichenbehaftete Summanden, die IMMER (auch bei Betrag 0) addiert bzw. subtrahiert werden.'
  quellen:
  - typ: gesetz
    label: § 8 Abs. 1 Satz 1 KStG (Einkommen bestimmt sich nach EStG + KStG)
    datei: sources/gesetze-im-internet/kstg_p8_2026-07-16.txt
    zitatanker: bestimmt sich nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes
    auszug: Was als Einkommen gilt und wie das Einkommen zu ermitteln ist, bestimmt sich nach den Vorschriften des Einkommensteuergesetzes und dieses Gesetzes.
  - typ: gesetz
    label: § 8 Abs. 3 Satz 2 KStG (vGA mindern das Einkommen nicht)
    datei: sources/gesetze-im-internet/kstg_p8_2026-07-16.txt
    zitatanker: mindern das Einkommen nicht
    auszug: Auch verdeckte Gewinnausschüttungen sowie Ausschüttungen jeder Art auf Genussrechte, mit denen das Recht auf Beteiligung am Gewinn und am Liquidationserlös der Kapitalgesellschaft verbunden ist, mindern das Einkommen nicht.
  - typ: gesetz
    label: § 8 Abs. 3 Satz 3 KStG (verdeckte Einlagen erhöhen das Einkommen nicht)
    datei: sources/gesetze-im-internet/kstg_p8_2026-07-16.txt
    zitatanker: Verdeckte Einlagen erhöhen das Einkommen nicht
    auszug: Verdeckte Einlagen erhöhen das Einkommen nicht.
  signature:
    scope: EinkommenKoerperschaft
    inputs:
      gewinn_estg: money
      verdeckte_gewinnausschuettung: money
      verdeckte_einlage: money
    output: einkommen
