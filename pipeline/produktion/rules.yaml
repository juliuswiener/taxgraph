    zinsaufwand: 500000
    abschreibungen: 300000
    zinsertrag: 100000
  - massgebliches_einkommen: 2000000
    zinsaufwand: 200000
    abschreibungen: 100000
    zinsertrag: 400000
  - massgebliches_einkommen: 500000
    zinsaufwand: 1000000
    abschreibungen: 0
    zinsertrag: 200000
  - massgebliches_einkommen: 0
