    zitatanker: aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen
    herkunft: synthetisch
    rechenweg: Aktien 5.000 - 2.000 = 3.000; sonstige 0. Summe 3.000,00.
    inputs:
      gewinn_aktien: 5000
      verlust_aktien: 2000
      gewinn_sonstige: 0
      verlust_sonstige: 0
    expected: 3000.0
  - quelle: sources/gesetze-im-internet/estg_p20_2026-07-13.txt
    zitatanker: aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen
    herkunft: synthetisch
    rechenweg: 'WAECHTER Topf-Boden: Aktienverlust 8.000 > Gewinn 5.000 -> aktien_netto 0 (Rest = Vortrag, ausserhalb). Summe 0,00.'
    inputs:
      gewinn_aktien: 5000
      verlust_aktien: 8000
      gewinn_sonstige: 0
      verlust_sonstige: 0
    expected: 0.0
  - quelle: sources/gesetze-im-internet/estg_p20_2026-07-13.txt
