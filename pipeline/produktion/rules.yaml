- rule_id: p15a_1_erweiterte_aussenhaftung
  norm: § 15a Abs. 1 S. 2 EStG (erweiterte Außenhaftung § 171 Abs. 1 HGB)
  hinweis: 'haftungsbetrag = max(0, eingetragene_einlage - geleistete_einlage); ausgleichsfaehiger_verlust_erweitert = min(verlustanteil, max(kapitalkonto, 0) + haftungsbetrag). ABWEICHEND von Satz 1 (P2) sind Verluste bis zur Höhe des Haftungsbetrags (Betrag, um den die eingetragene die geleistete Einlage übersteigt, § 171 Abs. 1 HGB) zusätzlich ausgleichsfähig, auch wenn negatives KK entsteht/sich erhöht. SUBSUMTION: bei haftungsbetrag=0 (geleistete >= eingetragene) IDENTISCH zu p15a_1_ausgleichsfaehiger_verlust (P2); die Integration wählt EINE Regel (P2 ohne erweiterte Haftung, diese mit). max(...,0) als max-Op oder if>0. KEINE Norm-Konstante im Code. Cent-genau.'
  quellen:
  - typ: gesetz
    label: § 15a Abs. 1 S. 2 EStG (erweiterte Außenhaftung)
    datei: sources/gesetze-im-internet/estg_p15a_2026-07-14.txt
    zitatanker: bis zur Höhe des Betrags, um den die im Handelsregister eingetragene Einlage des Kommanditisten seine geleistete Einlage übersteigt
    auszug: Haftet der Kommanditist am Bilanzstichtag den Gläubigern der Gesellschaft auf Grund des § 171 Absatz 1 des Handelsgesetzbuchs, so können abweichend von Satz 1 Verluste des Kommanditisten bis zur Höhe des Betrags, um den die im Handelsregister eingetragene Einlage des Kommanditisten seine geleistete Einlage übersteigt, auch ausgeglichen oder abgezogen werden, soweit durch den Verlust ein negatives Kapitalkonto entsteht oder sich erhöht
