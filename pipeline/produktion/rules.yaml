  - typ: gesetz
    label: § 33a Abs. 1 S. 5 EStG (Anrechnung eigener Einkuenfte ueber 624 Euro)
    datei: sources/gesetze-im-internet/estg_p33a_2026-07-13.txt
    zitatanker: den Betrag von 624 Euro im Kalenderjahr übersteigen
    auszug: so vermindert sich die Summe der nach Satz 1 und Satz 2 ermittelten Beträge um den Betrag, um den diese Einkünfte und Bezüge den Betrag von 624 Euro im Kalenderjahr übersteigen
  - typ: gesetz
