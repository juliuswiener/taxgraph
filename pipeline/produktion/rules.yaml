- rule_id: p33b_pflege_pauschbetrag
  hinweis: 'ist_hilflos hat VORRANG vor der Pflegegrad-Staffel: bei ist_hilflos = wahr immer 1.800, unabhaengig vom Pflegegrad; die Pflegegrad-Staffel (PG2 600, PG3 1.100, PG4/5 1.800, sonst 0) gilt nur, wenn NICHT hilflos.'
  norm: § 33b Abs. 6 EStG (Pflege-Pauschbetrag, Pflegegrad-Staffel)
  quellen:
  - typ: gesetz
    label: § 33b Abs. 6 S. 3-4 EStG (Pflege-Pauschbetrag)
    datei: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    auszug: 'Als Pflege-Pauschbetrag wird gewährt: 1. bei Pflegegrad 2 600 Euro, 2. bei Pflegegrad 3 1 100 Euro, 3. bei Pflegegrad 4 oder 5 1 800 Euro. 4 Ein Pflege-Pauschbetrag nach Satz 3 Nummer 3 wird auch gewährt, wenn die gepflegte Person hilflos im Sinne des § 33b Absatz 3 Satz 4 ist.'
  geltungsbedingungen:
  - bedingung: pflegegrad_staffel
    deckt_ab: Als Pflege-Pauschbetrag wird gewährt
    quelle: § 33b Abs. 6 S. 3-4 EStG
    beschreibung: 'Lookup Pflegegrad -> Betrag: PG2 600, PG3 1.100, PG4/5 1.800. Pflegegrad unter 2 -> 0. ist_hilflos (Satz 4) -> 1.800 (Betrag wie PG4/5), auch bei niedrigerem/keinem Pflegegrad.'
  # Drei Tatbestandsmerkmale des Satzes 1 bzw. der Saetze 8-9, die die Staffel NICHT abdeckt.
  # Sie aendern den BETRAG nicht (den bestimmen Pflegegrad und Merkzeichen H), sind aber
  # Voraussetzung dafuer, dass es den Pauschbetrag ueberhaupt gibt — und amtlich zu erklaeren:
  # ohne sie lehnt checkESt den Pflege-Pauschbetrag ab (gemessen 2026-08-14, rc=610001002, in
  # DREI Schichten: erst Wohnsitz+Helferzahl, dann IdNr+Personenangaben+"durch wen").
  # Bis dahin trug die Regel nur die Staffel, weil nur sie eine Rechenwirkung hat. Genau daran
  # scheiterte der Bau: das Bindungsmodell laesst kein Feld ohne Slot ODER Bedingung zu (gemessen:
  # 0 von allen gebundenen Feldern kaeme ohne aus), und eine Pflichtangabe ohne Rechenwirkung
  # hatte damit keinen Platz. Julius-Entscheid 2026-08-15: Deklarations-Pflichtfelder duerfen eine
  # eigene Bedingung bekommen — mit Ankerpflicht, also einem woertlichen Gesetzeszitat, das das
  # deckt_ab-Freeze-Gate (tests/test_deckt_ab_freeze.py) gegen die Quelldatei prueft.
  - bedingung: pflege_persoenlich_in_eu_ewr
    deckt_ab: die Pflege entweder in seiner Wohnung oder in der Wohnung des Pflegebedürftigen persönlich durchführt und diese Wohnung in einem Mitgliedstaat der Europäischen Union oder in einem Staat gelegen ist, auf den das Abkommen über den Europäischen Wirtschaftsraum anzuwenden ist
    quelle: § 33b Abs. 6 S. 1 EStG
    beschreibung: 'Tatbestand des Satzes 1: die Pflege muss PERSOENLICH erfolgen (durch wen von Person A/B) und die Wohnung im EU-/EWR-Raum liegen. Keine Betragswirkung; ohne beide Angaben ist die Erklaerung nicht einreichbar.'
  - bedingung: idnr_der_gepflegten_person
    deckt_ab: Voraussetzung für die Gewährung des Pflege-Pauschbetrags ist die Angabe der erteilten Identifikationsnummer (§ 139b der Abgabenordnung) der gepflegten Person in der Einkommensteuererklärung des Steuerpflichtigen
    quelle: § 33b Abs. 6 S. 8 EStG
    beschreibung: 'Identifikation der gepflegten Person (IdNr sowie Name/Anschrift/Geburtsdatum/Verwandtschaftsverhaeltnis). Das Gesetz macht die IdNr ausdruecklich zur VORAUSSETZUNG der Gewaehrung, nicht bloss zur Formalie.'
  - bedingung: teilung_bei_mehreren_pflegepersonen
    deckt_ab: Wird ein Pflegebedürftiger von mehreren Steuerpflichtigen im Veranlagungszeitraum gepflegt, wird der Pflege-Pauschbetrag nach der Zahl der Pflegepersonen
    quelle: § 33b Abs. 6 S. 9 EStG
    beschreibung: 'Anzahl weiterer an der Pflege beteiligter Personen. Der Ring teilt heute NICHT (er kennt die Zahl nicht) — die Angabe ist die Voraussetzung dafuer, dass er es koennte; bis dahin reine Deklaration. Bei Alleinpflege ist 0 zu erklaeren.'
  rundung: []
  signature:
    scope: PflegePauschbetrag
    inputs:
      pflegegrad: int
      ist_hilflos: bool
    output: pflege_pauschbetrag
  test_seed:
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: Pflegegrad 2 -> 600.
    inputs:
      pflegegrad: 2
      ist_hilflos: false
    expected: 600.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: Pflegegrad 3 -> 1.100.
    inputs:
      pflegegrad: 3
      ist_hilflos: false
    expected: 1100.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: Pflegegrad 5 -> Stufe 4/5 -> 1.800.
    inputs:
      pflegegrad: 5
      ist_hilflos: false
    expected: 1800.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'WAECHTER hilflos-Override (Satz 4), Legal-Edge: Pflegegrad 1 aber hilflos -> 1.800 (beweist Unabhaengigkeit vom Pflegegrad).'
    inputs:
      pflegegrad: 1
      ist_hilflos: true
    expected: 1800.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'WAECHTER hilflos-Override ueber echtem Staffelwert: Pflegegrad 3 (Staffel 1.100) + hilflos -> 1.800 (Override hebt an, nicht additiv).'
    inputs:
      pflegegrad: 3
      ist_hilflos: true
    expected: 1800.0
  - quelle: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    zitatanker: Als Pflege-Pauschbetrag wird gewährt
    herkunft: synthetisch
    rechenweg: 'WAECHTER Untergrenze: Pflegegrad 1, nicht hilflos -> 0 (kein Pauschbetrag unter PG2).'
    inputs:
      pflegegrad: 1
      ist_hilflos: false
    expected: 0.0
  raster:
