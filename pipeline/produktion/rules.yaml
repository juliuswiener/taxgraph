- rule_id: p10_1a_realsplitting
  norm: § 10 Abs. 1a Nr. 1 EStG (Realsplitting, Unterhalt Ex-Ehegatte, 13.805-Euro-Deckel)
  quellen:
  - typ: gesetz
    label: § 10 Abs. 1a Nr. 1 S. 1 EStG (Unterhalt bis 13.805 Euro)
    datei: sources/gesetze-im-internet/estg_p10_2026-07-11.txt
    zitatanker: bis zu 13 805 Euro im Kalenderjahr
    auszug: Unterhaltsleistungen an den geschiedenen oder dauernd getrennt lebenden unbeschränkt einkommensteuerpflichtigen Ehegatten, wenn der Geber dies mit Zustimmung des Empfängers beantragt, bis zu 13 805 Euro im Kalenderjahr.
  - typ: gesetz
    label: § 10 Abs. 1a Nr. 1 S. 2 EStG (Erhoehung um KV/PV-Beitraege)
    datei: sources/gesetze-im-internet/estg_p10_2026-07-11.txt
    zitatanker: Der Höchstbetrag nach Satz 1 erhöht sich um den Betrag der im jeweiligen Veranlagungszeitraum nach Absatz 1 Nummer 3
    auszug: Der Höchstbetrag nach Satz 1 erhöht sich um den Betrag der im jeweiligen Veranlagungszeitraum nach Absatz 1 Nummer 3 für die Absicherung des geschiedenen oder dauernd g
  - typ: gesetz
    label: § 10 Abs. 1 Nr. 3 Buchst. a S. 4 EStG (4-Prozent-Kuerzung bei Krankengeldanspruch)
    datei: sources/gesetze-im-internet/estg_p10_2026-07-11.txt
    zitatanker: ist der jeweilige Beitrag um 4 Prozent zu vermindern
    auszug: Wenn sich aus den Krankenversicherungsbeiträgen nach Satz 2 ein Anspruch auf Krankengeld oder ein Anspruch auf eine Leistung, die anstelle von Krankengeld gewährt wird, ergeben kann, ist der jeweilige Beitrag um 4 Prozent zu vermindern
  geltungsbedingungen:
  - bedingung: deckel_13805_plus_kv_pv
    deckt_ab: bis zu 13 805 Euro im Kalenderjahr
    quelle: § 10 Abs. 1a Nr. 1 S. 1-2 EStG
    beschreibung: Abzug = min(unterhaltsleistungen, 13.805 + kv_pv_beitraege). Der 13.805-Hoechstbetrag ist Norm-Konstante (Wortlaut), erhoeht um KV/PV-Beitraege fuer den Ex-Ehegatten (S. 2).
  # Hand-Fix 2026-08-16 (Provenance s. hand_fix unten): S. 2 verweist auf "Beitraege nach Absatz 1
  # Nummer 3", und Nummer 3 Buchst. a S. 4 vermindert Krankenversicherungsbeitraege mit
  # Krankengeldanspruch um 4 Prozent. Die Verweisung zieht die Kuerzung mit — der Hoechstbetrag
  # erhoeht sich also um die GEKUERZTEN Beitraege. Vorher rechnete die Regel ungekuerzt: Deckel zu
  # hoch, Abzug ggf. zu gross, Steuer zu niedrig.
  - bedingung: kuerzung_krankengeld_4_prozent
    deckt_ab: ist der jeweilige Beitrag um 4 Prozent zu vermindern
    quelle: § 10 Abs. 1 Nr. 3 Buchst. a S. 4 EStG
    beschreibung: 'Der Teil der KV/PV-Beitraege, aus dem ein Anspruch auf Krankengeld folgen kann, geht nur zu 96 Prozent in die Hoechstbetrags-Erhoehung ein. Eingabe kv_krankengeld ist eine TEILMENGE von kv_pv_beitraege, kein zusaetzlicher Summand: beruecksichtigt = kv_pv_beitraege - kv_krankengeld * 0.04.'
  - bedingung: antrag_mit_zustimmung
    deckt_ab: wenn der Geber dies mit Zustimmung des Empfängers beantragt
    quelle: § 10 Abs. 1a Nr. 1 S. 1 EStG
    beschreibung: 'Anwendbarkeit (nicht output-variierend): Antrag des Gebers + Zustimmung des Empfaengers; der Empfaenger versteuert korrespondierend (§ 22 Nr. 1a). Auswahl in der § 2-Integration.'
  - bedingung: empfaenger_geschieden_getrennt_unbeschraenkt
    deckt_ab: geschiedenen oder dauernd getrennt lebenden unbeschränkt einkommensteuerpflichtigen Ehegatten
    quelle: § 10 Abs. 1a Nr. 1 S. 1 EStG
    beschreibung: 'Anwendbarkeitsvoraussetzung (binaer): der Empfaenger der Unterhaltsleistungen ist der geschiedene oder dauernd getrennt lebende, unbeschraenkt einkommensteuerpflichtige Ehegatte (und der Geber ist als Steuerpflichtiger unbeschraenkt stpfl.). Auswahl in der § 2-Integration. Nachdeklariert nach mistral-Judge-Nachzug (Bucket B, Instructor-Adjudikation msg 1639: Anwendbarkeit = Geltungsbedingung).'
  # PROVENANCE, ausdruecklich: diese Regel wurde am 2026-08-16 VON HAND korrigiert, nicht neu
  # durch die Modell-Kaskade gefahren. Das gespeicherte judge_verdict im Snapshot stammt vom
  # urspruenglichen Lauf und bezieht sich auf die Fassung OHNE die 4-Prozent-Kuerzung — es ist
  # also kein Beleg fuer die heutige Fassung. Der Beleg sind die zwei woertlich zitierten
  # Gesetzessaetze (§ 10 Abs. 1a Nr. 1 S. 2 verweist auf Absatz 1 Nummer 3; § 10 Abs. 1 Nr. 3
  # Buchst. a S. 4 vermindert um 4 Prozent) plus die deterministischen Gates: syntax, typecheck,
  # equivalence A==B auf 6 Rasterpunkten (davon 2 mit aktiver Kuerzung) und 6 clerk-Seeds
  # (davon 2 differenzierend). Kein Modellaufruf, keine Kosten.
  hand_fix:
    datum: '2026-08-16'
    was: 4-Prozent-Kuerzung nach § 10 Abs. 1 Nr. 3 Buchst. a S. 4 ergaenzt (neuer Input kv_krankengeld)
    judge_verdict_gilt_fuer: Fassung vor dem Hand-Fix
    beleg: deterministische Gates + Zitatanker; NICHT modellverifiziert
  rundung: []
