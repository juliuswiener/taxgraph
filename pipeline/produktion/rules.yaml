- rule_id: p7_gewerbeertrag
  norm: § 7 Satz 1 i.V.m. § 6 GewStG (Gewerbeertrag = Besteuerungsgrundlage)
  hinweis: 'gewerbeertrag = gewinn_gewerbebetrieb + hinzurechnungen_p8 - kuerzungen_p9. § 6: Besteuerungsgrundlage der Gewerbesteuer IST der Gewerbeertrag (Identitaet, output dieser Regel). Slot-/Andock-Regel ohne eigenen Rechenkern jenseits der Summe: gewinn_gewerbebetrieb = der nach EStG ermittelte Gewinn aus Gewerbebetrieb (KSt-Nenner zurueckgestellt = Paket-4-Entscheidung A; §15/W2, bereits formalisiert); hinzurechnungen_p8 = Ergebnis § 8 (p8_1_hinzurechnung); kuerzungen_p9 = Ergebnis § 9. Negativer Gewerbeertrag ZULAESSIG (Gewerbeverlust -> § 10a, KEIN Boden bei 0). money + money - money, keine Rundung, exakt. § 7 Saetze 2-8 (Veraeusserungsgewinn, § 5a, Organschaft, § 8b KStG, AStG) = Nicht-Gegenstand/Nachtrag.'
  quellen:
  - typ: gesetz
