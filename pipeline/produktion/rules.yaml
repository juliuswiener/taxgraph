    auszug: 'Dem Gewinn aus Gewerbebetrieb (§ 7) werden folgende Beträge wieder hinzugerechnet, soweit sie bei der Ermittlung des Gewinns abgesetzt worden sind: 1. Ein Viertel der Summe aus a) Entgelten für Schulden'
