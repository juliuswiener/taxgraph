  - typ: gesetz
    label: § 16 Abs. 4 S. 3 EStG (Abschmelzung ab 136 000 Euro)
    datei: sources/gesetze-im-internet/estg_p16_2026-07-14.txt
    zitatanker: 136 000 Euro übersteigt
    auszug: Er ermäßigt sich um den Betrag, um den der Veräußerungsgewinn 136 000 Euro übersteigt
  signature:
    scope: BetriebsFreibetrag
    inputs:
      veraeusserungsgewinn: money
    output: freibetrag
