    auszug: Erwachsen einem Steuerpflichtigen Aufwendungen für den Unterhalt und eine etwaige Berufsausbildung einer dem Steuerpflichtigen oder seinem Ehegatten gegenüber gesetzlich unterhaltsberechtigten Person, so wird auf Antrag die Einkommensteuer dadurch ermäßigt, dass die Aufwendungen bis zur Höhe des Grundfreibetrags nach § 32a Absatz 1 Satz 2 Nummer 1 im Kalenderjahr vom Gesamtbetrag der Einkünfte abgezogen werden.
  - typ: gesetz
