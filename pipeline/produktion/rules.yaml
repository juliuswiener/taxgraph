- rule_id: p31_familienleistungsausgleich
  norm: § 31 EStG
  quellen:
  - typ: gesetz
    label: "§ 31 EStG (Günstigerprüfung Freibeträge vs. Kindergeld)"
    datei: sources/gesetze-im-internet/estg_p31_2026-07-11.txt
    zitatanker: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    auszug: "Bewirkt der Anspruch auf Kindergeld für den gesamten Veranlagungszeitraum die nach Satz 1 gebotene steuerliche Freistellung nicht vollständig und werden deshalb bei der Veranlagung zur Einkommensteuer die Freibeträge nach § 32 Absatz 6 vom Einkommen abgezogen, erhöht sich die unter Abzug dieser Freibeträge ermittelte tarifliche Einkommensteuer um den Anspruch auf Kindergeld für den gesamten Veranlagungszeitraum; bei nicht zusammenveranlagten Eltern wird der Kindergeldanspruch im Umfang des Kinderfreibetrags angesetzt."
  - typ: gesetz
    label: "§ 31 Satz 1 EStG (Günstiger-Wahl Freibeträge oder Kindergeld)"
    datei: sources/gesetze-im-internet/estg_p31_2026-07-11.txt
    zitatanker: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    auszug: "Die steuerliche Freistellung eines Einkommensbetrags in Höhe des Existenzminimums eines Kindes einschließlich der Bedarfe für Betreuung und Erziehung oder Ausbildung wird im gesamten Veranlagungszeitraum entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld nach Abschnitt X bewirkt."
  geltungsbedingungen:
  - bedingung: tarifwerte_sind_p32a_ergebnis
    deckt_ab: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    quelle: "§ 31 Satz 1 EStG"
    beschreibung: "est_ohne/est_mit sind Tarifergebnisse (p32a) mit/ohne § 32-Abs-6-Abzug. Kein Tarif hier."
  - bedingung: kindergeld_ist_anspruchsbetrag
    deckt_ab: "erhöht sich die unter Abzug dieser Freibeträge ermittelte tarifliche Einkommensteuer um den Anspruch auf Kindergeld"
    quelle: "§ 31 Satz 4 EStG"
    beschreibung: "Input kindergeld = ANSPRUCH fuer den gesamten VZ (Hinzurechnung), nicht Auszahlung."
  - bedingung: zusammenveranlagte_eltern
    deckt_ab: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    quelle: "§ 31 Satz 4 EStG"
    beschreibung: "MVP: zusammenveranlagt -> voller KG-Ansatz. Halbteilung bei nicht zusammenveranlagten Eltern ausgeklammert."
  - bedingung: keine_kindergeld_sonderfaelle
    deckt_ab: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    quelle: "§ 31 Satz 5-7 EStG"
    beschreibung: "Nicht ausgezahltes festgesetztes KG (§ 70 Abs. 1 S. 2), vergleichbare/auslaendische Leistungen ausgeklammert."
  rundung: []
  signature:
    scope: Familienleistungsausgleich
    inputs:
      est_ohne_freibetraege: money
      est_mit_freibetraegen: money
      kindergeld: money
    output: est_nach_familienausgleich
  test_seed:
  - quelle: reports/review/2026-07-11-charge2-teil2-p31.md
    zitatanker: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    herkunft: synthetisch
    rechenweg: "Entlastung 8.000-6.500 = 1.500 < KG 3.000 -> KG guenstiger -> min(8.000; 6.500+3.000=9.500) = 8.000,00."
    inputs: {est_ohne_freibetraege: 8000, est_mit_freibetraegen: 6500, kindergeld: 3000}
    expected: 8000.00
  - quelle: reports/review/2026-07-11-charge2-teil2-p31.md
    zitatanker: "erhöht sich die unter Abzug dieser Freibeträge ermittelte tarifliche Einkommensteuer um den Anspruch auf Kindergeld"
    herkunft: synthetisch
    rechenweg: "Entlastung 12.000-8.000 = 4.000 > KG 3.000 -> Freibetraege guenstiger, Hinzurechnung -> min(12.000; 8.000+3.000=11.000) = 11.000,00."
    inputs: {est_ohne_freibetraege: 12000, est_mit_freibetraegen: 8000, kindergeld: 3000}
    expected: 11000.00
  - quelle: reports/review/2026-07-11-charge2-teil2-p31.md
    zitatanker: "entweder durch die Freibeträge nach § 32 Absatz 6 oder durch Kindergeld"
    herkunft: synthetisch
    rechenweg: "Entlastung 3.000 = KG 3.000 -> gleich -> min(10.000; 10.000) = 10.000,00."
    inputs: {est_ohne_freibetraege: 10000, est_mit_freibetraegen: 7000, kindergeld: 3000}
    expected: 10000.00
  raster:
