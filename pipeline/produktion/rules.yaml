- rule_id: p9_4a_verpflegungsmehraufwand
  norm: § 9 Abs. 4a EStG
  # BLOCK AUFGEHOBEN (2026-07-11, Dekret Nicht-Saettigungs-Steuer, Punkt 1).
  # Der urspruengliche Grund war "Judge-Verdikt nicht reproduzierbar: 3 Laeufe, 3
  # Ergebnisse" (2026-07-10). Genau diese Streuung ist durch die Registry-Ratsche
  # (Stufe 4) strukturell geloest: die Gates haengen jetzt an der Registry, nicht
  # am frischen Lauf; identischer Registry-Stand -> identisches Verdikt. Ein Block
  # mit ueberholtem Grund ist selbst ein Protokollfehler (falsches Rot). Die Regel
  # wird dadurch nicht gruen - sie laeuft normal in die Ratsche, Coverage
  # entscheidet. Historie: reports/nachtschicht/entscheidungen-offen.md.
  norm_source: sources/gesetze-im-internet/estg_p9_abs4a_2026-07-09.txt
  struktur:
  - staffel_nach_abwesenheit
  - dreimonatsfrist
  - prozentuale_kuerzung
  test_seed:
  # BMF-Schreiben Reisekosten v. 25.11.2020, Rz 73-77, Beispiel 48 (dreitaegige
  # Auswaertstaetigkeit). Die Kuerzung wegen Mahlzeitengestellung liegt ausserhalb
  # der Signatur; die ungekuerzten Tagesbetraege sind woertlich belegt.
  - quelle: sources/bmf/bmf_reisekosten_2020-11-25.txt
    zitatanker: "Zwischentag: 28,00 \u20ac"
    inputs: {abwesenheit_stunden: 24, mit_uebernachtung: true, an_oder_abreisetag: false, monate_am_ort: 1}
    expected: 28.00
  - quelle: sources/bmf/bmf_reisekosten_2020-11-25.txt
    zitatanker: "Anreisetag: 14,00 \u20ac"
    inputs: {abwesenheit_stunden: 8, mit_uebernachtung: true, an_oder_abreisetag: true, monate_am_ort: 1}
    expected: 14.00
  # Geltungsbereich der Teilformalisierung, maschinenlesbar. Jeder Norm-Teil, den
  # der Judge als `wirkt_hinein` meldet, muss hier abgedeckt sein - sonst faellt
  # das geltungsbereich-Gate. Die Relevanzpropagation (Phase 5) stellt diese
  # Bedingungen als Fragen; die Engine darf die Regel nicht feuern, wenn eine
  # verletzt ist. Die Freigabe gilt NUR mit diesen Bedingungen.
  geltungsbedingungen:
  - bedingung: auswaertige_berufliche_taetigkeit
    deckt_ab: "Wird der Arbeitnehmer außerhalb seiner Wohnung und ersten Tätigkeitsstätte beruflich tätig"
    quelle: "§ 9 Abs. 4a Satz 2 EStG"
    beschreibung: "Die Regel gilt nur, wenn ueberhaupt eine auswaertige berufliche Taetigkeit vorliegt."
  - bedingung: uebernachtung_oder_eintaegig_ueber_acht_stunden
    deckt_ab:
    - "beginnt die auswärtige berufliche Tätigkeit an einem Kalendertag und endet am nachfolgenden Kalendertag ohne Übernachtung"
    - "wenn der Arbeitnehmer an diesem, einem anschließenden oder vorhergehenden Tag außerhalb seiner Wohnung übernachtet"
    quelle: "§ 9 Abs. 4a Satz 3 Nr. 2 und Nr. 3 EStG"
    beschreibung: "Der Scope kennt An-/Abreisetag und Abwesenheitsdauer, aber nicht die Mitternachtsregel fuer eintaegige Reisen ohne Uebernachtung."
  - bedingung: taetigkeit_im_inland
    deckt_ab: "Bei einer Tätigkeit im Ausland treten an die Stelle der Pauschbeträge"
    quelle: "§ 9 Abs. 4a Satz 5 EStG"
    beschreibung: "Nur Inlandspauschalen. Auslandspauschbetraege werden vom BMF laenderweise bekanntgemacht und sind nicht modelliert."
  - bedingung: keine_mahlzeitengestellung
    deckt_ab:
    - "eine Mahlzeit zur Verfügung gestellt"
    - "Hat der Arbeitnehmer für die Mahlzeit ein Entgelt gezahlt"
    quelle: "§ 9 Abs. 4a Saetze 8 bis 10 EStG"
    beschreibung: "Bei Mahlzeitengestellung ist die Pauschale zu kuerzen (20/40/40 %). Der Scope kennt die Mahlzeiten nicht."
  - bedingung: keine_unterbrechung_mit_neubeginn
    deckt_ab: "Eine Unterbrechung der beruflichen Tätigkeit an derselben Tätigkeitsstätte führt zu einem Neubeginn"
    quelle: "§ 9 Abs. 4a Satz 7 EStG"
    beschreibung: "Eine Unterbrechung von mindestens vier Wochen setzt die Dreimonatsfrist neu in Gang. Der Scope kennt nur `monate_am_ort`, nicht die Unterbrechungshistorie."
  - bedingung: keine_steuerfreien_verpflegungserstattungen
    deckt_ab: "Erhält der Arbeitnehmer steuerfreie Erstattungen für Verpflegung"
    quelle: "§ 9 Abs. 4a Satz 11 EStG"
    beschreibung: "Steuerfreie Erstattungen schliessen den Werbungskostenabzug insoweit aus."
  signature:
    scope: Verpflegungsmehraufwand
    inputs:
      abwesenheit_stunden: int
      mit_uebernachtung: bool
      an_oder_abreisetag: bool
      monate_am_ort: int
    output: verpflegungspauschale
  raster:
  - abwesenheit_stunden: 24
    mit_uebernachtung: true
    an_oder_abreisetag: false
    monate_am_ort: 1
  - abwesenheit_stunden: 10
    mit_uebernachtung: false
    an_oder_abreisetag: false
    monate_am_ort: 1
  - abwesenheit_stunden: 6
    mit_uebernachtung: false
    an_oder_abreisetag: false
    monate_am_ort: 1
  - abwesenheit_stunden: 24
    mit_uebernachtung: true
    an_oder_abreisetag: false
    monate_am_ort: 5
  exclude_rule_ids:
  - p9_4a_verpflegungsmehraufwand
- rule_id: p9_1_3_nr6_7_arbeitsmittel_afa
  # ERSETZT durch p9_1_3_nr6_7_afa_{laufend,ueberhangsjahr} (2026-07-12: § 7-auszug-Weitung
  # bewegte A 0->400 auf dem Letztjahr-Rest, aber "Summe=AK" ist arithmetische Folge, nicht
  # im Gesetzestext -> strukturell geloest via Split, Ueberhangsjahr = eine Formel. defekt-Historie bleibt hier.
  status: zuschnitt_ersetzt
  norm: § 9 Abs. 1 S. 3 Nr. 6 und Nr. 7 EStG
  # Charge-2-Neuschnitt (2026-07-11, reports/review/2026-07-11-charge2-zuschnitt-teil1.md,
  # Instructor-Freigabe msg 1163). Ersetzt p9_1_3_nr6_arbeitsmittel + p9_1_3_nr7_afa.
  # Multi-Source: Nr. 6 verweist auf Nr. 7 ("Nummer 7 bleibt unberuehrt"); die
  # 800-Euro-GWG-Grenze folgt aus Nr. 7 S. 2 -> § 6 Abs. 2; die zeitanteilige
  # AfA-Zwoelftelung aus § 7 Abs. 1 S. 4.
  quellen:
  - typ: gesetz
    label: "§ 9 Abs. 1 S. 3 Nr. 6 und Nr. 7 EStG"
    datei: sources/gesetze-im-internet/estg_p9_2026-07-10.txt
    zitatanker: "Nummer 7 bleibt unberührt"
    auszug: "Aufwendungen für Arbeitsmittel"
  - typ: gesetz
    label: "§ 6 Abs. 2 EStG (geringwertige Wirtschaftsgüter, 800-Euro-Grenze)"
    datei: sources/gesetze-im-internet/estg_p6_2026-07-10.txt
    zitatanker: "800 Euro nicht übersteigen"
    auszug: "an deren Stelle tretende Wert für das einzelne Wirtschaftsgut 800 Euro nicht übersteigen"
  # auszug-Leitlinie (Instructor 2026-07-12): das Modell braucht die GESAMTVERTEILUNG
  # (S. 1-2), sonst droppt es den Letztjahr-Rest bei unterjaehrigem Beginn (Bake-off:
  # 5/6 Seeds richtig, nur Ueberhang-Jahr -> 0). S. 3 (Firmenwert) ausgelassen (variiert
  # den Output nicht). S. 4 pro-rata als voller Satz (nicht nur das Fragment).
  - typ: gesetz
    label: "§ 7 Abs. 1 S. 1-2 EStG (lineare AfA, gleiche Jahresbeträge über die Nutzungsdauer)"
    datei: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: "Absetzung für Abnutzung in gleichen Jahresbeträgen"
    auszug: "Bei Wirtschaftsgütern, deren Verwendung oder Nutzung durch den Steuerpflichtigen zur Erzielung von Einkünften sich erfahrungsgemäß auf einen Zeitraum von mehr als einem Jahr erstreckt, ist jeweils für ein Jahr der Teil der Anschaffungs- oder Herstellungskosten abzusetzen, der bei gleichmäßiger Verteilung dieser Kosten auf die Gesamtdauer der Verwendung oder Nutzung auf ein Jahr entfällt (Absetzung für Abnutzung in gleichen Jahresbeträgen). 2 Die Absetzung bemisst sich hierbei nach der betriebsgewöhnlichen Nutzungsdauer des Wirtschaftsguts."
  - typ: gesetz
    label: "§ 7 Abs. 1 S. 4 EStG (zeitanteilige AfA im Anschaffungsjahr)"
    datei: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: "ein Zwölftel für jeden vollen Monat"
    auszug: "Im Jahr der Anschaffung oder Herstellung des Wirtschaftsguts vermindert sich für dieses Jahr der Absetzungsbetrag nach Satz 1 um jeweils ein Zwölftel für jeden vollen Monat, der dem Monat der Anschaffung oder Herstellung vorangeht"
  geltungsbedingungen:
  - bedingung: gwg_sofortabzug_gewaehlt
    deckt_ab: "in voller Höhe als Betriebsausgaben abgezogen werden"
    quelle: "§ 6 Abs. 2 Satz 1 EStG"
    beschreibung: "GWG-Sofortabzug ist ein Wahlrecht (koennen); der Scope nimmt an, dass es ausgeuebt wird."
  - bedingung: anschaffungskosten_sind_massgebliche_ak
    deckt_ab: "an deren Stelle tretende Wert für das einzelne Wirtschaftsgut 800 Euro nicht übersteigen"
    quelle: "§ 6 Abs. 2 Satz 1 EStG (Verweis § 9b Abs. 1)"
    beschreibung: "Input = massgebliche AK i.S.d. § 6 Abs. 2 S. 1. Netto/Brutto nicht still festgelegt (§ 9b Abs. 1: Vorsteuer nur raus, soweit bei USt abziehbar - beim AN i.d.R. nicht). Grenzfall -> Morgen-Paket Julius."
  test_seed:
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: "800 Euro nicht übersteigen"
    herkunft: synthetisch
    rechenweg: "GWG: 500 <= 800 -> Sofortabzug in voller Hoehe = 500,00 (Anschaffungsjahr)."
    inputs: {anschaffungskosten: 500, nutzungsdauer_jahre: 3, anschaffungsmonat: 1, jahre_seit_anschaffung: 0}
    expected: 500.00
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: "800 Euro nicht übersteigen"
    herkunft: synthetisch
    rechenweg: "GWG-Grenze: 800 <= 800 (nicht uebersteigen) -> Sofortabzug 800,00. Randfall <=."
    inputs: {anschaffungskosten: 800, nutzungsdauer_jahre: 3, anschaffungsmonat: 1, jahre_seit_anschaffung: 0}
    expected: 800.00
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: "ein Zwölftel für jeden vollen Monat"
    herkunft: synthetisch
    rechenweg: "801 > 800 -> AfA: 801/3 = 267,00/Jahr; Anschaffungsmonat 1 -> voller Jahresbetrag = 267,00. Randfall 801."
    inputs: {anschaffungskosten: 801, nutzungsdauer_jahre: 3, anschaffungsmonat: 1, jahre_seit_anschaffung: 0}
    expected: 267.00
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: "ein Zwölftel für jeden vollen Monat"
    herkunft: synthetisch
    rechenweg: "1200/3 = 400/Jahr; Anschaffung Monat 7 -> 6/12 (ein Zwoelftel je vollem Monat davor) = 200,00 (Anschaffungsjahr)."
    inputs: {anschaffungskosten: 1200, nutzungsdauer_jahre: 3, anschaffungsmonat: 7, jahre_seit_anschaffung: 0}
    expected: 200.00
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: "ein Zwölftel für jeden vollen Monat"
    herkunft: synthetisch
    rechenweg: "Folgejahr (jahre_seit_anschaffung 1) -> voller Jahresbetrag 400,00."
    inputs: {anschaffungskosten: 1200, nutzungsdauer_jahre: 3, anschaffungsmonat: 7, jahre_seit_anschaffung: 1}
    expected: 400.00
  - quelle: reports/review/2026-07-11-charge2-zuschnitt-teil1.md
    zitatanker: "ein Zwölftel für jeden vollen Monat"
    herkunft: synthetisch
    rechenweg: "Letztjahr (jahre_seit_anschaffung 3): Rest = 1200 - 200 (Jahr 0) - 400 - 400 = 200,00 (Gegenstueck zur 6/12-Kuerzung)."
    inputs: {anschaffungskosten: 1200, nutzungsdauer_jahre: 3, anschaffungsmonat: 7, jahre_seit_anschaffung: 3}
    expected: 200.00
  signature:
    scope: ArbeitsmittelUndAfa
    inputs:
      anschaffungskosten: money
      nutzungsdauer_jahre: int
      anschaffungsmonat: int
      jahre_seit_anschaffung: int
    output: abziehbar
  raster:
  - {anschaffungskosten: 500, nutzungsdauer_jahre: 3, anschaffungsmonat: 1, jahre_seit_anschaffung: 0}
  - {anschaffungskosten: 800, nutzungsdauer_jahre: 3, anschaffungsmonat: 1, jahre_seit_anschaffung: 0}
  - {anschaffungskosten: 801, nutzungsdauer_jahre: 3, anschaffungsmonat: 1, jahre_seit_anschaffung: 0}
  - {anschaffungskosten: 1200, nutzungsdauer_jahre: 3, anschaffungsmonat: 7, jahre_seit_anschaffung: 0}
  - {anschaffungskosten: 1200, nutzungsdauer_jahre: 3, anschaffungsmonat: 7, jahre_seit_anschaffung: 1}
  - {anschaffungskosten: 1200, nutzungsdauer_jahre: 3, anschaffungsmonat: 7, jahre_seit_anschaffung: 3}
  - {anschaffungskosten: 5000, nutzungsdauer_jahre: 5, anschaffungsmonat: 12, jahre_seit_anschaffung: 0}
  exclude_rule_ids:
  - p9_1_3_nr6_7_arbeitsmittel_afa
