- rule_id: p9_1_3_nr6_7_afa_laufend
  # ERSETZT durch p9_1_3_nr6_7_afa_laufend_nb (Charge-3-Neuschnitt 2026-07-12,
  # reports/review/2026-07-12-charge3-gwg-neuschnitt.md). Der Monolith trug EINEN Input
  # anschaffungskosten fuer Grenzpruefung UND Abzug/AfA - Netto/Brutto nicht trennbar. Der
  # Neuschnitt splittet in ak_netto (800-Grenze, § 6 Abs. 2 S. 1 i.V.m. § 9b Abs. 1) und
  # ak_brutto (Abzug/AfA). Deterministisch belegt (--skip-judge): A und B clerk 7/7 grün,
  # equivalence PASS; Kreuz-Waechter (netto800/brutto952->952; netto850/brutto1011,50->202,30)
  # gruen. Die drei Interim-Bedingungen (anschaffungskosten_sind_massgebliche_ak,
  # grenzwert_und_abzugsbetrag_fallen_zusammen) erloeschen mit dem Split. verified_bedingt
  # zieht der Neuschnitt beim Judge-Nachzug (--redo-judge); bis dahin strukturgeprueft_judge_offen.
  status: zuschnitt_ersetzt
  norm: § 9 Abs. 1 S. 3 Nr. 6/7 i.V.m. § 6 Abs. 2, § 7 Abs. 1 EStG (laufende Jahre, jahre_seit < Nutzungsdauer)
  quellen:
  - typ: gesetz
    label: § 9 Abs. 1 S. 3 Nr. 6/7 EStG (Arbeitsmittel)
    datei: sources/gesetze-im-internet/estg_p9_2026-07-10.txt
    zitatanker: Nummer 7 bleibt unberührt
    auszug: Aufwendungen für Arbeitsmittel
  - typ: gesetz
    label: § 6 Abs. 2 EStG (GWG 800-Euro-Sofortabzug)
    datei: sources/gesetze-im-internet/estg_p6_2026-07-10.txt
    zitatanker: 800 Euro nicht übersteigen
    auszug: an deren Stelle tretende Wert für das einzelne Wirtschaftsgut 800 Euro nicht übersteigen
  - typ: gesetz
    label: § 7 Abs. 1 S. 1-2 EStG (lineare AfA, gleiche Jahresbeträge)
    datei: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: Absetzung für Abnutzung in gleichen Jahresbeträgen
    auszug: Bei Wirtschaftsgütern, deren Verwendung oder Nutzung durch den Steuerpflichtigen zur Erzielung von Einkünften sich erfahrungsgemäß auf einen Zeitraum von mehr als einem Jahr erstreckt, ist jeweils für ein Jahr der Teil der Anschaffungs- oder Herstellungskosten abzusetzen, der bei gleichmäßiger Verteilung dieser Kosten auf die Gesamtdauer der Verwendung oder Nutzung auf ein Jahr entfällt (Absetzung für Abnutzung in gleichen Jahresbeträgen). 2 Die Absetzung bemisst sich hierbei nach der betriebsgewöhnlichen Nutzungsdauer des Wirtschaftsguts.
  - typ: gesetz
    label: § 7 Abs. 1 S. 4 EStG (pro-rata Anschaffungsjahr)
    datei: sources/gesetze-im-internet/estg_p7_2026-07-11.txt
    zitatanker: ein Zwölftel für jeden vollen Monat
    auszug: Im Jahr der Anschaffung oder Herstellung des Wirtschaftsguts vermindert sich für dieses Jahr der Absetzungsbetrag nach Satz 1 um jeweils ein Zwölftel für jeden vollen Monat, der dem Monat der Anschaffung oder Herstellung vorangeht
  geltungsbedingungen:
  - bedingung: gwg_sofortabzug_gewaehlt
    deckt_ab: 800 Euro nicht übersteigen
    quelle: § 6 Abs. 2 Satz 1 EStG
    beschreibung: 'AK <= 800: Sofortabzug in voller Hoehe (GWG). Sonst lineare AfA.'
  - bedingung: zeitraum_laufend
    deckt_ab: Absetzung für Abnutzung in gleichen Jahresbeträgen
    quelle: § 7 Abs. 1 S. 1 EStG
    beschreibung: 'Binaere Auswahlbedingung: gilt fuer laufende Jahre (jahre_seit_anschaffung < nutzungsdauer_jahre): Jahr0 anteilig, Volljahre voll. Das Ueberhangsjahr (jahre_seit == nutzungsdauer) ist eine eigene Teilregel; Auswahl macht die § 2-Integration.'
  - bedingung: anschaffungskosten_sind_massgebliche_ak
    deckt_ab: an deren Stelle tretende Wert für das einzelne Wirtschaftsgut 800 Euro nicht übersteigen
    quelle: § 6 Abs. 2 Satz 1 EStG (Verweis § 9b Abs. 1)
    beschreibung: 'Input = massgebliche AK i.S.d. § 6 Abs. 2 S. 1. Netto/Brutto nicht still festgelegt (§ 9b Abs. 1). Migriert aus Monolith (Triage-Praezedenz A1, msg 1266). Grenzfall -> Julius-Morgen.'
  - bedingung: grenzwert_und_abzugsbetrag_fallen_zusammen
    deckt_ab: 800 Euro nicht übersteigen
    quelle: § 6 Abs. 2 Satz 1 EStG i.V.m. R 9b Abs. 2 EStR
