    beschreibung: Diese Regel liefert den ERSTJAHR-Besteuerungsanteil (Prozentsatz x Jahresrente). Der steuerfreie EURO-Rentenfreibetrag wird daraus abgeleitet und ab dem zweiten Rentenjahr FIXIERT (S. 4-5, lebenslang unveraendert) - mehrjaehriger State, § 2-Integration, NICHT in dieser Erstjahr-Regel (Backlog-Grenze).
