    anzahl_kinder: 1
    monate_ohne_voraussetzung: 0
  - alleinstehend: true
    anzahl_kinder: 3
    monate_ohne_voraussetzung: 0
  - alleinstehend: true
    anzahl_kinder: 1
    monate_ohne_voraussetzung: 6
  - alleinstehend: false
