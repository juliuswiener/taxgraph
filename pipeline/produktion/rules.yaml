- rule_id: p35c_energieberater_ermaessigung
  hinweis: 'energieberater_ermaessigung = (50 / 100) * energieberater_aufwendungen. 50 ist ein PROZENTWERT -> /100 in decimal, Cent-Schnitt zuletzt. Sondersatz "abweichend von Satz 1" (Abs1 S4) - gilt NUR fuer BAFA-zugelassene Energieberater-Kosten, NICHT fuer sonstige Sanierungsaufwendungen. BMF Rn 56 (verwaltung, Freeze 2026-07-14): (a) die 50 % wirken IM ABSCHLUSSJAHR der energetischen Massnahme, NICHT auf drei Jahre gedrittelt; (b) die 50 % zaehlen gegen den gemeinsamen 14k/12k-Jahreshoechstbetrag (Kombination rules/estg/p35c/energetische_massnahmen.catala_en, Scope P35cJahresdeckel) UND den 40k-Objektdeckel (Mehrjahres-State). Nachtrag erledigt.'
  norm: § 35c Abs. 1 S. 4 EStG (Energieberater-Sondersatz 50 %)
  quellen:
  - typ: gesetz
    label: § 35c Abs. 1 S. 4 EStG (Energieberater 50 %, abweichend von Satz 1)
    datei: sources/gesetze-im-internet/estg_p35c_2026-07-13.txt
    zitatanker: abweichend von Satz 1 um 50 Prozent der Aufwendungen für den Energieberater
    auszug: die tarifliche Einkommensteuer vermindert sich abweichend von Satz 1 um 50 Prozent der Aufwendungen für den Energieberater.
  geltungsbedingungen:
  - bedingung: eigenes_gebaeude
    deckt_ab: zu eigenen Wohnzwecken genutzten eigenen Gebäude
    quelle: § 35c Abs. 1 S. 1 EStG
    beschreibung: 'Eigentuemer-Erfordernis - anspruchsberechtigt ist nur der Eigentuemer des Gebaeudes (Abs. 1 S. 1 eigenen Gebaeude, iVm Abs. 6 Wohnungseigentum). Gilt auch fuer den Energieberater-Sondersatz (Abs. 1 S. 4) am selben beguenstigten Objekt. Nicht-Eigentuemer mit blosser Eigennutzung faellt raus. Sachverhalts-Vorfrage der §2-Integration.'
  - bedingung: energieberater_bafa_zugelassen_und_beauftragt
    deckt_ab: vom Bundesamt für Wirtschaft und Ausfuhrkontrolle (BAFA) als fachlich qualifiziert
    quelle: § 35c Abs. 1 S. 4 EStG
    beschreibung: Energieberater BAFA-zugelassen (Foerderprogramm Energieberatung fuer Wohngebaeude) UND vom Steuerpflichtigen mit planerischer Begleitung/Beaufsichtigung der Massnahmen beauftragt.
  - bedingung: objekt_hoechstbetrag_40k_nicht_ausgeschoepft
    deckt_ab: je begünstigtes Objekt beträgt der Höchstbetrag der Steuerermäßigung 40 000 Euro
    quelle: § 35c Abs. 1 S. 5 EStG
    beschreibung: 'Objekt-Lebensdauer-Deckel 40.000 EUR (§ 2/VZ-State, analog § 10d Abs4). BMF Rn 56 (Freeze 2026-07-14): die Energieberater-50 % zaehlen gegen diesen Deckel (Mehrjahres-State, hier vorausgesetzt).'
