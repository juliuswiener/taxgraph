    zitatanker: § 8c ist nach einem schädlichen Beteiligungserwerb auf Antrag nicht anzuwenden, wenn die Körperschaft seit ihrer Gründung
    herkunft: synthetisch
    rechenweg: 'Kein schädlicher Erwerb: § 8d gegenstandslos -> verlustbestand_nach_8d = verlustbestand_nach_8c = 3.000.000,00 (voller Bestand, N4 unverändert).'
    inputs:
      verlustvortrag_bestand: 3000000
      verlustbestand_nach_8c: 3000000
      schaedlicher_erwerb: false
      antrag_8d: false
      fortfuehrungs_voraussetzungen: false
    expected: 3000000.0
  - quelle: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    zitatanker: § 8c ist nach einem schädlichen Beteiligungserwerb auf Antrag nicht anzuwenden, wenn die Körperschaft seit ihrer Gründung
    herkunft: synthetisch
    rechenweg: 'GATING-GRENZFALL: kein schädlicher Erwerb, aber Antrag+Voraussetzungen true -> suspension_greift=false (schaedlicher_erwerb ist Vorbedingung) -> verlustbestand_nach_8d = verlustbestand_nach_8c = 3.000.000,00 (kein Doppel-Erhalt).'
