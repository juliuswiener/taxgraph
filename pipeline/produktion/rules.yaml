- rule_id: p23_veraeusserungsgewinn
  hinweis: veraeusserungsgewinn = veraeusserungspreis - anschaffungs_herstellungskosten - werbungskosten. Das Ergebnis KANN NEGATIV sein (Veraeusserungsverlust) - KEIN max(0)-Boden. Die AfA-Minderung der Anschaffungs-/Herstellungskosten (§ 23 Abs3 S4) erfolgt in der § 2-Integration; anschaffungs_herstellungskosten kommt bereits AfA-gemindert als Input. Verlustverrechnung § 23 Abs3 S7 (nur mit § 23-Gewinnen desselben Jahres) = benannter Nachtrag (formalisierbar, p20_6-Praezedenz); S8 (Vor-/Ruecktrag § 10d-artig) = Nicht-Gegenstand/State.
  norm: § 23 Abs. 3 S. 1 EStG (Gewinn aus privaten Veraeusserungsgeschaeften)
  quellen:
  - typ: gesetz
    label: § 23 Abs. 3 S. 1 EStG (Gewinnermittlung)
    datei: sources/gesetze-im-internet/estg_p23_2026-07-13.txt
    zitatanker: Unterschied zwischen Veräußerungspreis
    auszug: Gewinn oder Verlust aus Veräußerungsgeschäften nach Absatz 1 ist der Unterschied zwischen Veräußerungspreis einerseits und den Anschaffungs- oder Herstellungskosten und den Werbungskosten andererseits.
  geltungsbedingungen:
  - bedingung: veraeusserung_innerhalb_frist
    deckt_ab: bei denen der Zeitraum zwischen Anschaffung und Veräußerung nicht mehr als zehn Jahre beträgt
    quelle: § 23 Abs. 1 Nr. 1-2 EStG
    beschreibung: 'Steuerbar nur innerhalb Frist: Grundstuecke 10 Jahre (Nr1), andere WG 1 Jahr (Nr2). Fristverlaengerung auf 10 Jahre bei Einkunftsquelle (Nr2 S4) = hier ausgeklammert.'
  - bedingung: nicht_ausschliesslich_eigene_wohnzwecke
    deckt_ab: ausschließlich zu eigenen Wohnzwecken oder im Jahr der Veräußerung und in den beiden vorangegangenen Jahren zu eigenen Wohnzwecken genutzt wurden
    quelle: § 23 Abs. 1 Nr. 1 S. 3 EStG
    beschreibung: Selbstgenutzte Objekte (ausschliesslich eigene Wohnzwecke oder Veraeusserungsjahr + 2 Vorjahre) sind ausgenommen - dann nicht steuerbar.
  - bedingung: kein_gegenstand_taeglichen_gebrauchs
