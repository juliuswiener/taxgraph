- rule_id: p32_6_kinderfreibetraege
  norm: § 32 Abs. 6 EStG
  quellen:
  - typ: gesetz
    label: "§ 32 Abs. 6 EStG (Kinderfreibetrag + BEA-Freibetrag)"
    datei: sources/gesetze-im-internet/estg_p32_2026-07-11.txt
    zitatanker: "für das sächliche Existenzminimum des Kindes (Kinderfreibetrag)"
    auszug: "Bei der Veranlagung zur Einkommensteuer wird für jedes zu berücksichtigende Kind des Steuerpflichtigen ein Freibetrag von 3 414 Euro für das sächliche Existenzminimum des Kindes (Kinderfreibetrag) sowie ein Freibetrag von 1 464 Euro für den Betreuungs- und Erziehungs- oder Ausbildungsbedarf des Kindes vom Einkommen abgezogen. 2 Bei Ehegatten, die nach den §§ 26, 26b zusammen zur Einkommensteuer veranlagt werden, verdoppeln sich die Beträge nach Satz 1, wenn das Kind zu beiden Ehegatten in einem Kindschaftsverhältnis steht."
  geltungsbedingungen:
  - bedingung: kinder_sind_zu_beruecksichtigen
    deckt_ab: "für jedes zu berücksichtigende Kind des Steuerpflichtigen ein Freibetrag"
    quelle: "§ 32 Abs. 6 Satz 1 EStG"
    beschreibung: "anzahl_kinder = nach § 32 Abs. 1-5 zu beruecksichtigende Kinder (Anspruch). Muster p24b/p33."
  - bedingung: kind_zu_beiden_ehegatten
    deckt_ab: "verdoppeln sich die Beträge nach Satz 1"
    quelle: "§ 32 Abs. 6 Satz 2 EStG"
    beschreibung: "Verdopplung bei Zusammenveranlagung nur, wenn Kind zu BEIDEN Ehegatten im Kindschaftsverhaeltnis. MVP-Annahme."
  - bedingung: keine_uebertragung_oder_sonderfaelle
    deckt_ab: "für das sächliche Existenzminimum des Kindes (Kinderfreibetrag)"
    quelle: "§ 32 Abs. 6 Satz 3-11 EStG"
    beschreibung: "Sonderfaelle (Elternteil verstorben/nicht unbeschr., Uebertragung, Kuerzung S. 4) MVP ausgeklammert."
  rundung: []
  signature:
    scope: Kinderfreibetraege
    inputs:
      anzahl_kinder: int
      zusammenveranlagung: bool
    output: kinderfreibetraege_gesamt
  test_seed:
  - quelle: reports/review/2026-07-11-charge2-teil2-p32.md
    zitatanker: "für das sächliche Existenzminimum des Kindes (Kinderfreibetrag)"
    herkunft: synthetisch
    rechenweg: "1 Kind, einfach: 3.414 + 1.464 = 4.878,00."
    inputs: {anzahl_kinder: 1, zusammenveranlagung: false}
    expected: 4878.00
  - quelle: reports/review/2026-07-11-charge2-teil2-p32.md
    zitatanker: "verdoppeln sich die Beträge nach Satz 1"
    herkunft: synthetisch
    rechenweg: "1 Kind, Zusammenveranlagung: (3.414 + 1.464) x 2 = 9.756,00."
    inputs: {anzahl_kinder: 1, zusammenveranlagung: true}
    expected: 9756.00
  - quelle: reports/review/2026-07-11-charge2-teil2-p32.md
    zitatanker: "verdoppeln sich die Beträge nach Satz 1"
    herkunft: synthetisch
    rechenweg: "2 Kinder, Zusammenveranlagung: 2 x 9.756 = 19.512,00."
    inputs: {anzahl_kinder: 2, zusammenveranlagung: true}
    expected: 19512.00
  - quelle: reports/review/2026-07-11-charge2-teil2-p32.md
    zitatanker: "für das sächliche Existenzminimum des Kindes (Kinderfreibetrag)"
    herkunft: synthetisch
    rechenweg: "0 Kinder -> 0,00."
    inputs: {anzahl_kinder: 0, zusammenveranlagung: false}
    expected: 0.00
  raster:
  - {anzahl_kinder: 0, zusammenveranlagung: false}
  - {anzahl_kinder: 1, zusammenveranlagung: false}
  - {anzahl_kinder: 1, zusammenveranlagung: true}
  - {anzahl_kinder: 2, zusammenveranlagung: true}
  - {anzahl_kinder: 3, zusammenveranlagung: false}
