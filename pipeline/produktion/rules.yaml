- rule_id: p8c_verlustuntergang
  norm: § 8c Abs. 1 KStG (Verlustuntergang bei schädlichem Beteiligungserwerb > 50 %)
  hinweis: 'EXAKTE FORMEL - EINE unbedingte Definition (Fallunterscheidung als totale if-then-else, KEINE catala-exception): (1) verlustbestand_nach_8c = if schaedlicher_erwerb then 0 else verlustvortrag_bestand. Das ist die vollstaendige Regel. § 8c Abs. 1 Satz 1: werden innerhalb von fuenf Jahren mehr als 50 % des gezeichneten Kapitals/der Stimmrechte an einen Erwerber uebertragen (schaedlicher Beteiligungserwerb), sind die bis dahin nicht genutzten Verluste VOLLSTAENDIG nicht mehr abziehbar -> verlustbestand_nach_8c = 0. Kein schaedlicher Erwerb -> Bestand unveraendert. schaedlicher_erwerb = bool-INPUT (Sachverhalts-Vorfrage: > 50-%-Schwelle in 5 Jahren, mittelbar/unmittelbar, Erwerber oder nahestehende Personen/Erwerbergruppe; die Konzernklausel Satz 4 = Vorfrage). verlustvortrag_bestand = money-Input (>= 0), der zum Erwerbszeitpunkt vorhandene nicht genutzte Verlust. WIRKPUNKT: verlustbestand_nach_8c wirkt VOR dem § 10d-Abzug (K5) auf den Verlustbestand (N6-Verdrahtung). NACHTRAEGE (nicht kodiert, benannt): (a) Stille-Reserven-Klausel Satz 5 - der Verlust bleibt abziehbar, SOWEIT er die stillen Reserven nicht uebersteigt (Teilerhalt); Stufe A ist ALLES-ODER-NICHTS (0 oder voll), der Teilerhalt via stille Reserven ist Nachtrag (braucht stille_reserven-Input). (b) Sanierungsklausel Abs. 1a - ein Sanierungserwerb ist unbeachtlich (dann schaedlicher_erwerb bereits als false qualifiziert). (c) Konzernklausel Satz 4 (100-%-Beteiligung) + § 3a-EStG-Sanierungsertrag Abs. 2 = Nachtrag. VERBOT: KEINE stille-Reserven-Teilrechnung, KEINE Quoten-Staffelung (die alte 25-50-%-Quotal-Stufe ist seit 2019 rueckwirkend gestrichen - nur noch > 50 % binaer). FORMALISIERUNG: EINE unbedingte Definition (if-then-else total), KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 8c Abs. 1 Satz 1 KStG (schädlicher Beteiligungserwerb > 50 % — Verluste vollständig nicht mehr abziehbar)
    datei: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    zitatanker: (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar
    auszug: Werden innerhalb von fünf Jahren mittelbar oder unmittelbar mehr als 50 Prozent des gezeichneten Kapitals, der Mitgliedschaftsrechte, der Beteiligungsrechte oder der Stimmrechte an einer Körperschaft an einen Erwerber oder diesem nahe stehende Personen übertragen oder liegt ein vergleichbarer Sachverhalt vor (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar.
  signature:
    scope: VerlustuntergangKoerperschaft
    inputs:
      verlustvortrag_bestand: money
      schaedlicher_erwerb: bool
    output: verlustbestand_nach_8c
  raster:
  - verlustvortrag_bestand: 5000000
    schaedlicher_erwerb: true
  - verlustvortrag_bestand: 5000000
    schaedlicher_erwerb: false
  - verlustvortrag_bestand: 100000
    schaedlicher_erwerb: true
  - verlustvortrag_bestand: 0
    schaedlicher_erwerb: false
  test_seed:
  - quelle: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    zitatanker: (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar
    herkunft: synthetisch
    rechenweg: 'Schädlicher Erwerb (> 50 %): Verlust vollständig nicht mehr abziehbar -> verlustbestand_nach_8c = 0,00 (Bestand 5.000.000 geht unter).'
    inputs:
      verlustvortrag_bestand: 5000000
      schaedlicher_erwerb: true
    expected: 0.0
  - quelle: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    zitatanker: (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar
    herkunft: synthetisch
    rechenweg: 'Kein schädlicher Erwerb: Bestand unverändert -> verlustbestand_nach_8c = 5.000.000,00.'
    inputs:
      verlustvortrag_bestand: 5000000
      schaedlicher_erwerb: false
    expected: 5000000.0
  - quelle: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    zitatanker: (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar
    herkunft: synthetisch
    rechenweg: 'Schädlicher Erwerb, kleiner Bestand: 100.000 geht ebenso vollständig unter -> 0,00 (Alles-oder-nichts).'
    inputs:
      verlustvortrag_bestand: 100000
      schaedlicher_erwerb: true
    expected: 0.0
  - quelle: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    zitatanker: (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar
    herkunft: synthetisch
    rechenweg: 'GRENZFALL kein Bestand, kein Erwerb: 0,00.'
    inputs:
      verlustvortrag_bestand: 0
      schaedlicher_erwerb: false
    expected: 0.0
  geltungsbedingungen:
  - bedingung: schaedlicher_erwerb_untergang_vollstaendig
    deckt_ab: (schädlicher Beteiligungserwerb), sind bis zum schädlichen Beteiligungserwerb nicht ausgeglichene oder abgezogene negative Einkünfte (nicht genutzte Verluste) vollständig nicht mehr abziehbar
    quelle: § 8c Abs. 1 Satz 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    beschreibung: 'Bei schädlichem Beteiligungserwerb gehen die nicht genutzten Verluste VOLLSTAENDIG unter (verlustbestand_nach_8c = 0). Alles-oder-nichts; kein Teilerhalt in Stufe A.'
  - bedingung: schaedlicher_erwerb_ueber_50_prozent_bool_vorfrage
    deckt_ab: mehr als 50 Prozent des gezeichneten Kapitals
    quelle: § 8c Abs. 1 Satz 1 KStG
    datei: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    beschreibung: 'schaedlicher_erwerb = bool-Input: > 50 % des gezeichneten Kapitals/der Stimmrechte innerhalb von 5 Jahren an einen Erwerber/nahestehende Personen/Erwerbergruppe (mittelbar/unmittelbar). Die Schwellen-Qualifikation (inkl. Konzernklausel Satz 4, 100-%-Beteiligung) ist Sachverhalts-Vorfrage, nicht modelliert. Die alte quotale 25-50-%-Stufe ist seit 2019 gestrichen.'
  - bedingung: stille_reserven_teilerhalt_nachtrag
    deckt_ab: kann abweichend von Satz 1 abgezogen werden, soweit er die gesamten zum Zeitpunkt des schädlichen Beteiligungserwerbs vorhandenen im Inland steuerpflichtigen stillen Reserven
    quelle: § 8c Abs. 1 Satz 5 KStG
    datei: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    beschreibung: 'Stille-Reserven-Klausel (Satz 5): der Verlust bleibt abziehbar, SOWEIT er die im Inland steuerpflichtigen stillen Reserven nicht uebersteigt (Teilerhalt). Benannter Nachtrag - Stufe A ist alles-oder-nichts; der Teilerhalt braucht einen stille_reserven-Input und ist nicht modelliert.'
  - bedingung: sanierungsklausel_abs1a_nachtrag
    deckt_ab: ist ein Beteiligungserwerb zum Zweck der Sanierung des Geschäftsbetriebs der Körperschaft unbeachtlich
    quelle: § 8c Abs. 1a KStG
    datei: sources/gesetze-im-internet/kstg_p8c_2026-07-16.txt
    beschreibung: 'Sanierungsklausel (Abs. 1a): ein Beteiligungserwerb zum Zweck der Sanierung ist unbeachtlich (kein Untergang). Benannter Nachtrag - im Modell schlaegt sich das in der Vorfrage nieder (ein Sanierungserwerb ist als schaedlicher_erwerb = false qualifiziert); die Sanierungs-Tatbestandspruefung (Lohnsummen, Betriebsvermoegenszufuehrung) ist nicht modelliert.'

- rule_id: p8d_fortfuehrungsgebundener_verlust
  norm: § 8d Abs. 1 KStG (fortführungsgebundener Verlustvortrag — Suspension des § 8c auf Antrag)
  hinweis: 'EXAKTE FORMEL - ZWEI unbedingte Definitionen (die zweite ein totales if-then-else, KEINE catala-exception): (1) suspension_greift = schaedlicher_erwerb and antrag_8d and fortfuehrungs_voraussetzungen [bool] ; (2) verlustbestand_nach_8d = if suspension_greift then verlustvortrag_bestand else verlustbestand_nach_8c. Das ist die vollstaendige Regel. § 8d Abs. 1 Satz 1: § 8c ist nach einem schaedlichen Beteiligungserwerb AUF ANTRAG NICHT anzuwenden, wenn die Koerperschaft seit ihrer Gruendung (oder seit Beginn des dritten dem Erwerbs-VZ vorausgehenden VZ) ausschliesslich denselben Geschaeftsbetrieb unterhaelt und kein Ereignis iSd Abs. 2 stattfand. Greift die Suspension, wird der § 8c-Untergang aufgehoben und der volle Verlust bleibt erhalten (= verlustvortrag_bestand, wird zum fortfuehrungsgebundenen Verlustvortrag, § 8d Abs. 1 Satz 6). Sonst gilt das § 8c-Ergebnis (verlustbestand_nach_8c aus N4). suspension_greift setzt schaedlicher_erwerb VORAUS (§ 8d wirkt nur NACH einem schaedlichen Erwerb; ohne schaedlichen Erwerb ist verlustbestand_nach_8c ohnehin = voller Bestand). antrag_8d = bool-Input (Antrag in der Steuererklaerung des Erwerbs-VZ, Satz 5); fortfuehrungs_voraussetzungen = bool-Input (seit Gruendung/3 VZ derselbe Geschaeftsbetrieb, kein Abs.-2-Ereignis; qualitative Gesamtbetrachtung = Sachverhalts-Vorfrage). verlustvortrag_bestand + verlustbestand_nach_8c = money-Inputs. WIRKPUNKT: verlustbestand_nach_8d wirkt VOR dem § 10d-Abzug (K5, N6). NACHTRAEGE (benannt, nicht kodiert): (a) fortfuehrungsgebunden-KENNZEICHNUNG + Mehrjahres-Feststellung/Tracking (Satz 6-8, § 10d Abs. 4) - Stufe A liefert nur den erhaltenen Betrag, KEIN separater Rechenpfad; (b) Untergang des fortfuehrungsgebundenen Verlusts bei Einstellung/Ereignis Abs. 2 (dann erneut 0) - eigener Nachtrag; (c) Vorrang-Reihenfolge Satz 8 (fortfuehrungsgebundener vor regulaerem § 10d-Verlust) = N6-Verdrahtungs-Vermerk. VERBOT: KEINE Abs.-2-Untergangs-Logik, KEINE Mehrjahres-Fortschreibung. FORMALISIERUNG: zwei unbedingte Definitionen, KEINE bedingten exceptions.'
  quellen:
  - typ: gesetz
    label: § 8d Abs. 1 Satz 1 KStG (§ 8c auf Antrag nicht anzuwenden — selber Geschäftsbetrieb)
    datei: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    zitatanker: § 8c ist nach einem schädlichen Beteiligungserwerb auf Antrag nicht anzuwenden, wenn die Körperschaft seit ihrer Gründung
    auszug: § 8c ist nach einem schädlichen Beteiligungserwerb auf Antrag nicht anzuwenden, wenn die Körperschaft seit ihrer Gründung oder zumindest seit dem Beginn des dritten Veranlagungszeitraums, der dem Veranlagungszeitraum nach Satz 5 vorausgeht, ausschließlich denselben Geschäftsbetrieb unterhält
  - typ: gesetz
    label: § 8d Abs. 1 Satz 6 KStG (verbleibender Verlust wird fortführungsgebundener Verlustvortrag)
    datei: sources/gesetze-im-internet/kstg_p8d_2026-07-16.txt
    zitatanker: wird zum fortführungsgebundenen Verlust (fortführungsgebundener Verlustvortrag)
    auszug: Der Verlustvortrag, der zum Schluss des Veranlagungszeitraums verbleibt, in den der schädliche Beteiligungserwerb fällt, wird zum fortführungsgebundenen Verlust (fortführungsgebundener Verlustvortrag).
  signature:
    scope: FortfuehrungsgebundenerVerlust
    inputs:
      verlustvortrag_bestand: money
      verlustbestand_nach_8c: money
      schaedlicher_erwerb: bool
      antrag_8d: bool
      fortfuehrungs_voraussetzungen: bool
    output: verlustbestand_nach_8d
  raster:
  - verlustvortrag_bestand: 5000000
    verlustbestand_nach_8c: 0
    schaedlicher_erwerb: true
    antrag_8d: true
    fortfuehrungs_voraussetzungen: true
  - verlustvortrag_bestand: 5000000
    verlustbestand_nach_8c: 0
    schaedlicher_erwerb: true
    antrag_8d: false
    fortfuehrungs_voraussetzungen: true
  - verlustvortrag_bestand: 5000000
    verlustbestand_nach_8c: 0
    schaedlicher_erwerb: true
    antrag_8d: true
    fortfuehrungs_voraussetzungen: false
