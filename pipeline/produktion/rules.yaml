- rule_id: p33_1_2_agb_abzug
  norm: § 33 Abs. 1, 2 EStG
  quellen:
  - typ: gesetz
    label: § 33 Abs. 1, 2 EStG (agB-Abzug, Zwangslaeufigkeit)
    datei: sources/gesetze-im-internet/estg_p33_2026-07-11.txt
    zitatanker: zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag der Einkünfte abgezogen
    auszug: Erwachsen einem Steuerpflichtigen zwangsläufig größere Aufwendungen als der überwiegenden Mehrzahl der Steuerpflichtigen gleicher Einkommensverhältnisse, gleicher Vermögensverhältnisse und gleichen Familienstands (außergewöhnliche Belastung), so wird auf Antrag die Einkommensteuer dadurch ermäßigt, dass der Teil der Aufwendungen, der die dem Steuerpflichtigen zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag der Einkünfte abgezogen wird.
  geltungsbedingungen:
  - bedingung: agb_ist_zwangslaeufig
    deckt_ab: wenn er sich ihnen aus rechtlichen, tatsächlichen oder sittlichen Gründen nicht entziehen kann
    quelle: § 33 Abs. 2 Satz 1 EStG
    beschreibung: agB zwangslaeufig i.S.d. Abs. 2 S. 1. Input-Semantik.
  - bedingung: agb_notwendig_und_angemessen
    deckt_ab: den Umständen nach notwendig sind und einen angemessenen Betrag nicht übersteigen
    quelle: § 33 Abs. 2 Satz 1 EStG
    beschreibung: Nur der notwendige und angemessene Teil. Input-Semantik.
  - bedingung: keine_ausgeschlossenen_aufwendungen
    deckt_ab: Aufwendungen, die zu den Betriebsausgaben, Werbungskosten oder Sonderausgaben gehören, bleiben dabei außer Betracht
    quelle: § 33 Abs. 2 Satz 2-4 EStG
    beschreibung: BA/WK/SA, Diaetverpflegung, Prozesskosten ausser Betracht. Input enthaelt sie nicht.
  - bedingung: keine_behinderungsbedingten_fahrtkosten
    deckt_ab: "keine weiteren behinderungsbedingten Fahrtkosten als außergewöhnliche Belastung nach Absatz 1 berücksichtigungsfähig"
    quelle: § 33 Abs. 2a Satz 6 EStG
    beschreibung: "Behinderungs-Fahrtkosten laufen ueber die Pauschale (900/4.500, bindung_p33_2a_fahrtkostenpauschale). Die alte Geltungsbedingung am p33_1_2_agb_abzug ist aufgeloest: die Pauschale geht IN den agb-Slot, nicht daneben."
  - bedingung: zumutbare_belastung_ist_p33_3_ergebnis
    deckt_ab: zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag der Einkünfte abgezogen
    quelle: § 33 Abs. 1 EStG
    beschreibung: zumutbare_belastung = Ergebnis von p33_3 (Abs. 3). Von der § 2-Integration.
  - bedingung: kein_uebertragener_behinderten_pb_fuer_dieselben_aufwendungen
    deckt_ab: "In diesen Fällen besteht für Aufwendungen, für die der Behinderten-Pauschbetrag gilt, kein Anspruch auf eine Steuerermäßigung nach § 33"
    quelle: § 33b Abs. 5 Satz 4 EStG
    datei: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    beschreibung: "Wird der Behinderten-Pauschbetrag eines Kindes auf den Steuerpflichtigen uebertragen (Abs. 5 S. 1), sind die davon abgegoltenen Aufwendungen nicht zusaetzlich als agB abziehbar. Der agb-Slot enthaelt sie nicht mehr: behinderungsbedingte_aufwendungen wird vor dem Ring von agb_aufwendungen abgezogen (api.py _shared_steuer_sonder_agb). Ohne Uebertragung greift die Bedingung nicht — der eigene Pauschbetrag des Steuerpflichtigen faellt unter das Wahlrecht in Abs. 1 S. 1 und ist offen."
  - bedingung: eigener_pauschbetrag_wahlrecht_nicht_zusaetzlich_zur_agb
    deckt_ab: "anstelle einer Steuerermäßigung nach § 33 einen Pauschbetrag nach Absatz 3 geltend machen (Behinderten-Pauschbetrag)"
    quelle: § 33b Abs. 1 Satz 1 EStG
    datei: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    beschreibung: "Wahlrecht (Stufe 2b): der Steuerpflichtige kann fuer seine EIGENEN behinderungsbedingten Aufwendungen ANSTELLE der agB-Ermaessigung seinen eigenen GdB-Pauschbetrag geltend machen (S.2: nur einheitlich ausuebbar, kein Nebeneinander). behinderungsbedingte_aufwendungen_wahlrecht_pb=true: behinderungsbedingte_aufwendungen wird von agb_aufwendungen abgezogen, der PB bleibt. =false: agb bleibt voll, der eigene PB wird stattdessen aus dem §33b-Betrag herausgerechnet (sonst waere jede Antwort ein Doppelabzug — api.py _shared_steuer_sonder_agb). Unbeantwortet bei vorhandenem eigenen PB (GdB>=20 oder hilflos/blind/taubblind) UND behinderungsbedingte_aufwendungen>0 UND ohne bereits greifende Kind-PB-Uebertragung (Abs.5 S.4 hat Vorrang) -> Sperrgrund behinderungsbedingte_aufwendungen_wahlrecht_offen. Kein over-tax-sicherer Default moeglich (BACKLOG p33b-stufe-2 kein_default_moeglich: kleiner Aufwand -> PB zu hoch, grosser Aufwand -> PB zu niedrig)."
  - bedingung: eigener_pauschbetrag_wahlrecht_nicht_zusaetzlich_zur_agb_partner
    deckt_ab: "anstelle einer Steuerermäßigung nach § 33 einen Pauschbetrag nach Absatz 3 geltend machen (Behinderten-Pauschbetrag)"
    quelle: § 33b Abs. 1 Satz 1 EStG
    datei: sources/gesetze-im-internet/estg_p33b_2026-07-13.txt
    beschreibung: "Partner-Spiegel von eigener_pauschbetrag_wahlrecht_nicht_zusaetzlich_zur_agb (BACKLOG p33b-partner-pb-doppelabzug: der Partner-Pauschbetrag lief bisher unconditional neben agb_aufwendungen, 1.168-1.234 EUR stiller Doppelabzug bei Zusammenveranlagung). § 33b Abs. 1 S. 1 gilt PRO PERSON (Subjekt individuell, Anspruch nach Abs. 2/3 individuell nach eigenem GdB) — Abs. 1 S. 2 'einheitlich' bindet die Wahl EINER Person ueber ihre Aufwandsarten hinweg, NICHT zwei Ehegatten aneinander (kein Textbefund fuer eine Kopplung). behinderungsbedingte_aufwendungen_wahlrecht_pb_partner=true: behinderungsbedingte_aufwendungen_partner wird von agb_aufwendungen abgezogen, der Partner-PB bleibt. =false: agb bleibt voll, der Partner-PB wird aus dem §33b-Betrag herausgerechnet. Unabhaengig von der Wahl der Person A. Unbeantwortet bei vorhandenem Partner-PB (GdB_partner>=20 oder hilflos/blind/taubblind_partner) UND behinderungsbedingte_aufwendungen_partner>0 -> Sperrgrund behinderungsbedingte_aufwendungen_wahlrecht_partner_offen."
