  - bedingung: vermindert_um_geleistete_betraege
    deckt_ab: vermindert um auf Grund der Haftung tatsächlich geleistete Beträge
    quelle: § 15a Abs. 3 S. 3 EStG
    beschreibung: 'Zurechnungsbetrag = Haftungsminderungsbetrag abzueglich der auf Grund der Haftung tatsaechlich geleisteten Betraege (Floor bei 0).'
  - bedingung: deckel_11j_abs1s2_sinngemaess
    deckt_ab: im Wirtschaftsjahr der Haftungsminderung und den zehn vorangegangenen Wirtschaftsjahren Verluste nach Absatz 1 Satz 2 ausgleichs- oder abzugsfähig gewesen
    quelle: § 15a Abs. 3 S. 3 EStG
    beschreibung: 'Deckel (Satz 2 sinngemaess) - Zurechnung hoechstens bis zu den im WJ der Haftungsminderung + 10 vorangeg. WJ nach Abs. 1 S. 2 ausgleichs-/abzugsfaehig gewesenen Verlusten (11-Jahres-Fenster, Abs.1-S.2-Verluste, NICHT Abs.1-S.1). 11-J-Aggregat als State-Input; mehrjaehrige Verfolgung + Abs. 3 S. 4 Folgeverrechnung = benannte Nachtraege.'
- rule_id: p15a_3_einlageminderung
  norm: § 15a Abs. 3 EStG (Einlageminderung-Gewinnhinzurechnung, 11-Jahres-Deckel)
  hinweis: gewinnhinzurechnung = min(einlageminderung, ausgleichsfaehige_verluste_11j_fenster). Wird das negative Kapitalkonto durch Entnahmen erhöht (Einlageminderung), ist der Betrag als Gewinn hinzuzurechnen (Abs. 3 S. 1), GEDECKELT (S. 2) auf die im Wirtschaftsjahr der Einlageminderung UND in den zehn vorangegangenen Wirtschaftsjahren ausgleichs-/abzugsfähig gewesenen Verlustanteile (11-Jahres-Fenster). Das 11-Jahres-Aggregat kommt als Sachverhalts-/State-Input herein; die mehrjährige Verfolgung selbst = benannter Nachtrag (§10d-Muster). Cent-genau, keine Norm-Konstante im Code.
  quellen:
  - typ: gesetz
    label: § 15a Abs. 3 S. 1/2 EStG (Einlageminderung + 11-J-Deckel)
    datei: sources/gesetze-im-internet/estg_p15a_2026-07-14.txt
    zitatanker: ist dem Kommanditisten der Betrag der Einlageminderung als Gewinn zuzurechnen
    auszug: Soweit ein negatives Kapitalkonto des Kommanditisten durch Entnahmen entsteht oder sich erhöht (Einlageminderung) und soweit nicht auf Grund der Entnahmen eine nach Absatz 1 Satz 2 zu berücksichtigende Haftung besteht oder entsteht, ist dem Kommanditisten der Betrag der Einlageminderung als Gewinn zuzurechnen. 2 Der nach Satz 1 zuzurechnende Betrag darf den Betrag der Anteile am Verlust der Kommanditgesellschaft nicht übersteigen, der im Wirtschaftsjahr der Einlageminderung und in den zehn vorangegangenen Wirtschaftsjahren ausgleichs- oder abzugsfähig gewesen ist
