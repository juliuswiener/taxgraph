    datei: sources/gesetze-im-internet/estg_p6_2026-07-14.txt
    zitatanker: höchstens mit den Anschaffungs- oder Herstellungskosten
    auszug: Einlagen sind mit dem Teilwert für den Zeitpunkt der Zuführung anzusetzen; sie sind jedoch höchstens mit den Anschaffungs- oder Herstellungskosten anzusetzen, wenn das zugeführte Wirtschaftsgut a) innerhalb der letzten drei Jahre vor dem Zeitpunkt der Zuführung aus dem Privatvermögen angeschafft oder hergestellt worden ist
