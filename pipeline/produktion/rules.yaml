    zitatanker: die Steuern vom Einkommen und sonstige Personensteuern
    herkunft: synthetisch
    rechenweg: 'Nur Personensteuern 100.000, keine Geldstrafe: 100.000 + 0 = 100.000,00.'
    inputs:
      personensteuern: 100000
