- rule_id: p10_1_5_kinderbetreuung
  norm: § 10 Abs. 1 Nr. 5 EStG (Kinderbetreuungskosten, 80 % / 4.800-Euro-Deckel)
  gueltig_ab_vz: 2025
  gueltig_hinweis: 'Diese Fassung (80 %/4.800) gilt ab VZ 2025 (JStG 2024, Art. 4, § 52 Abs. 1). VZ 2024 = eigene Regel p10_1_5_kinderbetreuung_vz2024 (zwei Drittel / 4.000).'
  quellen:
  - typ: gesetz
    label: § 10 Abs. 1 Nr. 5 S. 1 EStG (80 % der Aufwendungen, hoechstens 4.800 je Kind)
    datei: sources/gesetze-im-internet/estg_p10_2026-07-11.txt
    zitatanker: 80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind
    auszug: 80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung eines zum Haushalt des Steuerpflichtigen gehörenden Kindes im Sinne des § 32 Absatz 1, welches das 14. Lebensjahr noch nicht vollendet hat
  geltungsbedingungen:
  - bedingung: achtzig_prozent_deckel_4800_je_kind
    deckt_ab: 80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind
    quelle: § 10 Abs. 1 Nr. 5 S. 1 EStG
    beschreibung: Abzug = min(0,80 x aufwendungen, 4.800). Der 4.800-Deckel gilt JE KIND; die Regel rechnet je Kind, Aggregation ueber mehrere Kinder in der § 2-Integration. Altersgrenze (< 14 bzw. behindert) und Haushaltszugehoerigkeit sind Anwendbarkeit (§ 2-Integration).
  - bedingung: kind_unter_14_haushaltszugehoerig
    deckt_ab: welches das 14. Lebensjahr noch nicht vollendet hat
    quelle: § 10 Abs. 1 Nr. 5 S. 1 EStG
    beschreibung: 'Anwendbarkeitsvoraussetzung (binaer): das betreute Kind gehoert zum Haushalt des Steuerpflichtigen (§ 32 Abs. 1) und hat das 14. Lebensjahr noch nicht vollendet (oder ist wegen Behinderung ausserstande, sich selbst zu unterhalten). Auswahl in der § 2-Integration. Nachdeklariert nach mistral-Judge-Nachzug (Bucket B, Instructor-Adjudikation msg 1639: Anwendbarkeit = Geltungsbedingung, nicht nicht_material).'
