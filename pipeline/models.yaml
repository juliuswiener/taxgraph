# TaxGraph Formalisierungspipeline - Modell-Besetzung (Phase 2, Nachtrag 2026-07-09).
#
# ============================================================================
# EINGEFROREN nach Gate G2 (2026-07-09). Finale Besetzung:
#   A = anthropic/claude-sonnet-4.6
#   B = z-ai/glm-5.2
#   Judge = deepseek/deepseek-v4-pro
#   Worker = deepseek/deepseek-v4-flash
#
# Begruendung (Verdikt in reports/gate-g2.md):
#   - Die Eskalationsdifferenz zwischen den Paarungen betrug einen einzigen Task
#     (6/14 vs 7/14). Sie traegt keine Entscheidung ueber die Formalisierer.
#   - Handlungsleitend war stattdessen die Judge-Besetzung: DeepSeek V4 Pro als
#     Judge verpasste keine einzige stille Zusatzannahme (annahme_verpasst 0.000),
#     GLM 0.143, Sonnet 0.286. Das ist das einzige Signal mit klarem Abstand.
#   - Vorbehalt: n=14 Tasks je Paarung. Die Besetzung ist eine begruendete
#     Festlegung, kein statistisch abgesicherter Befund.
#
# Re-Evaluations-Trigger (keine weiteren Bake-offs auf Vorrat):
#   Die Paarung wird erst neu gemessen, wenn nach ~50 produktiven Regeln
#   (a) die rollende Eskalationsrate ueber 0.6 liegt, oder
#   (b) im Human-Review ein Judge-Miss auffaellt (Judge sagte treu, die Regel
#       war es nicht).
# ============================================================================
#
# Hartes Prinzip: Formalisierer A, Formalisierer B und der Judge stammen aus drei
# verschiedenen Modellfamilien/Labs (dekorrelierte Fehler -> Soundness des
# Aequivalenz-Gates). Provider-Pinning ist Pflicht: allow_fallbacks=false, nur
# westliche/EU-Hoster fuer GLM/DeepSeek (NIEMALS die offiziellen chinesischen
# Endpoints Z.AI / DeepSeek / Baidu / SiliconFlow / StreamLake / Alibaba /
# GMICloud fuer Legal-/Steuermaterial). Sonnet auf Provider "Anthropic" gepinnt
# (nicht Bedrock/Azure/Vertex), damit der Pfad im Provenienz-Metadatum eindeutig
# ist. Keine :floor/:nitro-Shortcuts, keine `latest`-Aliase.
#
# PRO ROLLE EXAKT EIN GEPINNTER PROVIDER. `provider.only` ist keine
# Praeferenzliste: OpenRouter waehlt frei aus der Liste. Im G2-Lauf routete es den
# Worker trotz ["morph", ...] auf Venice und lief in dessen 429. Ein Failover ist
# deshalb kein Listeneintrag, sondern eine eigene, geloggte Konfigurationsaenderung
# mit neuem models.yaml-Hash. Siehe docs/setup.md.
#
# Modell-Slugs gegen die OpenRouter-Modellliste verifiziert (/models, /endpoints):
# anthropic/claude-sonnet-4.6, z-ai/glm-5.2, deepseek/deepseek-v4-pro,
# deepseek/deepseek-v4-flash. providers = exakte OpenRouter-Provider-Tags;
# westliche Hoster, keine chinesischen Endpoints.

version: 1

roles:
  formalisierer_a:
    slug: "anthropic/claude-sonnet-4.6"
    providers: ["anthropic"]
    temperature: 0.0
    # max_tokens je Rolle explizit. Zu knapp bemessen liefert das Modell eine am
    # Limit abgeschnittene Antwort, die wie ein Modellfehler aussieht; siehe
    # docs/setup.md ("Ein zu knappes max_tokens sieht aus wie ein Modellfehler").
    max_tokens: 8192          # Formalisierung: Catala-Quelltext, gemessen < 3000
    prompt_template_id: "formalisierung@4"
    repair_template_id: "formalisierung_repair@2"
    fewshot_set_id: "formalisierung_base@1"

  formalisierer_b:
    # G2 abgeschlossen: GLM-5.2 (siehe Verdikt oben).
    slug: "z-ai/glm-5.2"
    # Together bediente im G2-Lauf alle 44 B-Calls. Genau ein Provider (s.o.).
    providers: ["together"]
    temperature: 0.0
    max_tokens: 8192          # identisch zu A, damit das Budget kein Faktor ist
    prompt_template_id: "formalisierung@4"   # identisches Template wie A
    repair_template_id: "formalisierung_repair@2"  # identische Reparaturrunde wie A
    fewshot_set_id: "formalisierung_base@1"   # identische Few-Shots wie A

  judge:
    # SIEGER-PIN 2026-07-13 (Judge-Modell-Bake-off, Instructor-Adjudikation msg 1631,
    # Rohdaten reports/review/judge-bakeoff-rohdaten/, Messplan 1dd44f2 + Addendum 6f43abb):
    # NEUE Judge-Besetzung = mistralai/mistral-medium-3-5 (dritte Familie ggue. A=Anthropic,
    # B=Z.AI/GLM; EU-Host). Anlass: deepseek-v4-pro chronisch schlecht ueber westliche Provider
    # (deepinfra timeout + together hang, beide an Regel 1). Bake-off (2 von 3 Kandidaten angetreten;
    # gemini-pro-latest invalid-slug, nicht angetreten): mistral schlug gpt-5.5 auf ZUVERLAESSIGKEIT
    # (mistral 36-147s vs gpt bis 1194s Hang-Territorium), bei vergleichbarem Recall (Delta +0,027
    # im Rauschband) - beide lasen den hilflos-"auch"-Vorrang KORREKT (deepseek-fp4-Blindfleck
    # ueberwunden). mistral: schnell, billig (~0,06/Regel), EU. Zuverlaessigkeit war vorregistrierte
    # Vorbedingung. A bleibt Sonnet, B bleibt GLM - Dekorrelation ueber alle drei Rollen intakt.
    # (Alt-Besetzung deepseek-v4-pro: in G2 annahme_verpasst 0.000, aber Provider-untragbar.)
    slug: "mistralai/mistral-medium-3-5"
    # Provider-Wechsel 2026-07-10 (geloggt, nicht stiller Retry-Ausweich):
    # Fireworks rate-limitet deepseek-v4-pro persistent mit 429 (drei
    # Replikationslaeufe abgebrochen). Zurueck auf Together, das im Provider-Probe
    # sauber liefert. Zuvor war Fireworks gewaehlt, weil Together im G2-Lauf die
    # Rate-Limits trug - inzwischen bedient Together nicht mehr gleichzeitig GLM
    # (Formalisierer B laeuft ueber together/fireworks-fast, der Judge exklusiv
    # ueber together). Dieser Wechsel aendert den models.yaml-Hash bewusst.
    #
    # Provider-Pin 2026-07-11 (Nachtsession, Instructor msg 1165 - NUR Provider,
    # KEIN Modellwechsel): Together fuer deepseek-v4-pro ist degradiert (OpenRouter
    # endpoint-status -2), die Judge-Calls hingen >300s in der Bounded-Retry-
    # Schleife (Charge-2-Stufe-B, nr6_7 + nr5a beide role_timeout). DeepInfra
    # (US/westlicher Hoster, NICHT auf der Chinesisch-Ausschlussliste) antwortete im
    # Probe-Call in 0.7s mit "OK". Deshalb hier gepinnt. Aendert den Hash bewusst.
    # Provider-SWAP 2026-07-13 (deepinfra -> together, doktrin-konformer Single-Swap, Instructor-
    # Freigabe): deepinfra-Judge chronisch instabil (5+ Ausfaelle diese Session: 2x429 + 2x timeout
    # Paket B + 1x timeout beim 9er-Judge-Nachzug, _inventar-Call judge.py:265). LEHRSTUECK: das
    # oeffentliche OpenRouter /endpoints-Signal (Status 0, 100% Uptime) ist als Go-Signal FALSIFIZIERT
    # - zeigte deepinfra gesund, der echte Call failte trotzdem; nur ein authentifizierter Probe-Call
    # taugt zum Timing. Together (US-Host, nicht-chinesisch, war 07-11 degradiert, beim Swap Online)
    # ist der einzige westliche Kandidat mit Historie. Eskalations-Regel: failt Together an der ersten
    # Nachzug-Regel -> STOPP, kein dritter Provider-Wurf; dann Judge-MODELL-Frage (Julius +
    # vorregistrierter Messplan, Kandidaten-Bake-off wie B-Rolle). Bewusster Hash-Bump.
    providers: ["mistral"]
    # QUANT-STATUS mistral-Endpoint: OpenRouter /endpoints meldet Quantisierung "unknown" (NICHT
    # fp4 - die fruehere fp4-Ausnahme-Notiz fuer deepinfra ist damit obsolet; mistral ist kein
    # sichtbar quantisierter Tier). Die frueheren Provider-Kommentare (fireworks/together/deepinfra
    # fuer deepseek-v4-pro) sind Historie der Alt-Besetzung und dokumentieren die Eskalationskette.
    # QUANT-AUSNAHMEN-DOKTRIN bleibt gueltig (Instructor-Delegation 2026-07-13, Julius-Widerruf
    # moeglich): auch ein quantisierter Judge waere zulaessig. Die Unquant-Doktrin
    # (fp4/fp8 ausgeschlossen) schuetzt die FORMALISIERER (deren Output wird Code, muss exakt
    # sein) - der Judge ist per Registry-Ratsche reiner DETEKTOR: seine Streuung ist konstruktiv
    # neutralisiert, die Gates haengen nie an seiner Wahrheit, Quantisierung ist nur Rauschen im
    # Rauschkanal. Daher fp4 fuer die Judge-Rolle ZULAESSIG; Formalisierer_a/b bleiben strikt
    # unquantisiert. Julius-Entscheidungsliste (Widerruf: falls Unquant-Judge gewuenscht ->
    # Messplan). Randnotiz: der konstante "auch"-Vorrang-Blindfleck + Streuung koennten
    # Quant-Artefakte sein - bei einem kuenftigen Judge-Messplan fp4 vs unquant als Arm mitmessen.
    # Failover-Backlog: client provider.order (statt provider.only) mit Messplan - zieht nur, wenn
    # deepinfra-Judge-Ausfaelle chronisch werden (2026-07-13: 2x429 + 2x timeout, bisher transient).
    temperature: 0.0
    # 4096 reichten nicht: der Judge lief bei der ersten Produktionsregel exakt
    # ins Limit (completion_tokens=4096) und lieferte abgeschnittenes JSON.
    # V4 Pro schreibt vor der Antwort ausfuehrlich Reasoning-Tokens.
    # 4096 reichten nicht: V4 Pro schreibt Reasoning-Tokens vor die Antwort und
    # lief bei der ersten Produktionsregel exakt ins Limit (completion=4096,
    # abgeschnittenes JSON). Mit roundtrip_diff@3 lag der Bedarf bei ~8000.
    #
    # 12288 reichten ebenfalls nicht: in der Stabilitaetsmessung (2026-07-10) lief
    # der Judge bei § 9 Abs. 4a - sechs Geltungsbedingungen im Prompt, zwoelf
    # scope_gaps in der Antwort - exakt in dieses Limit (completion=12288,
    # finish_reason=length). Je mehr Bedingungen eine Regel deklariert, desto
    # laenger das Verdikt. Das Budget waechst mit der Regel, nicht mit dem Modell.
    max_tokens: 24576         # Judge: Reasoning + JSON-Verdikt + Annahme-Mapping
    # Dekomponierter Judge (Protokolldekret 2026-07-10). Nicht mehr ein
    # monolithisches Verdikt je Regel, sondern:
    #   inventar@2        - listet die Pruef-Items mit stabilem Anker-Schluessel
    #                       (Signatur-Input bzw. Norm-Referenz + Kategorie-Enum),
    #                       kein Urteil (3 Laeufe, Vereinigung ueber den Schluessel)
    #   item_abweichung@1 - je Kandidat: echt oder nicht (3 Stimmen)
    #   item_annahme@1    - je Annahme: Mapping auf eine Bedingungs-ID (3 Stimmen)
    #   item_normteil@1   - je Norm-Teil: Klasse + abdeckende Bedingung (3 Stimmen)
    # Kurze schemagebundene Antworten statt 14k-Token-Freitext: das Budget waechst
    # mit der Zahl der Items, nicht mit der Prosa.
    prompt_template_id: "dekomponiert@2"
    fewshot_set_id: "roundtrip_base@1"

  worker:
    # Extraktion, Segmentierung, Zitatanker, Testfall-Generierung.
    slug: "deepseek/deepseek-v4-flash"
    # kein Together-Endpoint fuer v4-flash; nur unquantisierte westliche Hoster
    # (fp4/fp8-Varianten bewusst ausgeschlossen: Quantisierung bricht Determinismus).
    # Endpoints am 2026-07-09 einzeln geprobt (je ein Minimal-Call, provider.only):
    #   morph          -> OK
    #   fireworks      -> 429 "temporarily rate-limited"
    #   venice         -> 429 "temporarily rate-limited"
    #   digitalocean   -> 403
    # Mehrere Eintraege in `only` heissen nicht "erst morph": OpenRouter routete im
    # Lauf trotzdem auf Venice und lief in dessen 429. Deshalb hier genau ein
    # Provider. DigitalOcean ist ueberall raus - es antwortete auch fuer v4-pro
    # unter Last mit 403, obwohl der Einzel-Probe-Call durchging.
    providers: ["morph"]
    temperature: 0.0
    max_tokens: 4096          # Extraktion: Claims-JSON, gemessen < 1000
    prompt_template_id: "extraktion@1"
    fewshot_set_id: "extraktion_base@1"

# Orchestrator/Eskalation laeuft als Opus in Claude Code (bestehendes Setup),
# nicht ueber OpenRouter; hier nur zur Dokumentation.
orchestrator:
  slug: "claude-opus (Claude Code)"
  via: "claude-code"

# G2-Bake-off-Paarungen (Start gibt Julius separat frei).
#
# Judge-Rotation: der Judge ist in JEDER Paarung die dritte Modellfamilie, die im
# Formalisierer-Paar nicht vorkommt. Bei drei Familien (Anthropic, Z.AI, DeepSeek)
# ist er dadurch eindeutig bestimmt - es gibt keine Wahlfreiheit, die man
# zugunsten eines Modells ausnutzen koennte. Das haelt das harte Prinzip aus dem
# Nachtrag ein (dekorrelierte Fehler) und macht die Rotation pruefbar:
# check_pairings() in bakeoff/run.py bricht ab, wenn eine Paarung es verletzt.
# Few-Shot-Sets pro Task disjunkt (Leakage-Schutz, siehe bakeoff).
bakeoff:
  pairings:
    - name: "A-sonnet_B-glm"
      formalisierer_a: "anthropic/claude-sonnet-4.6"
      formalisierer_b: "z-ai/glm-5.2"
      judge: "deepseek/deepseek-v4-pro"
    - name: "A-sonnet_B-deepseek"
      formalisierer_a: "anthropic/claude-sonnet-4.6"
      formalisierer_b: "deepseek/deepseek-v4-pro"
      judge: "z-ai/glm-5.2"
    # Entscheidungsfrage der dritten Paarung: gehoert Sonnet ueberhaupt ins
    # Formalisierer-Paar? Ohne diese Paarung ist Sonnet in jedem Vergleich als
    # A gesetzt und die Frage nicht stellbar.
    - name: "A-glm_B-deepseek"
      formalisierer_a: "z-ai/glm-5.2"
      formalisierer_b: "deepseek/deepseek-v4-pro"
      judge: "anthropic/claude-sonnet-4.6"
  provider_allowlists:
    "anthropic/claude-sonnet-4.6": ["anthropic"]
    "z-ai/glm-5.2": ["together"]
    "deepseek/deepseek-v4-pro": ["together"]
    "deepseek/deepseek-v4-flash": ["morph"]
