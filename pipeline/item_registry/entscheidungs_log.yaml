  begruendung: 'Judge-False-Positive (aequivalente-Umformung, Beleg 5+6 nach C13/C16/C20x2). Instructor-Adjudikation 4620d012 msg 1934. Fall-Trichotomie punktweise deckungsgleich mit 199-Zeichen-Wortlaut ''...ausgeglichen werden, soweit ein negatives Kapitalkonto ... entsteht oder sich erhoeht'': KK>0 -> min(verlust,KK) (Rest erzeugt negatives KK = nicht ausgleichbar); KK=0 -> 0 (jeder Cent laesst neg. KK ENTSTEHEN); KK<0 -> 0 (jeder Cent ERHOEHT es). Floor+Cap-Encoding min(verlustanteil,max(kapitalkonto,0)) = if-Form des Formalisierers. Waechter-Seeds: (5000/KK0->0), (4000/KK-3000->0), (10000/KK10000->10000).'
