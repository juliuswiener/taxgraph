  begruendung: 'Judge-False-Positive (aequivalente-Umformung, Ueber-Flag Belege 7-11,
    nach C24-P2 5+6). Instructor-Adjudikation 4620d012 msg 1989. Fall-Trichotomie
    (kombinierte Form gegen S2-allein gelesen): (i) verlust<=max(KK,0) -> voll via
    S1, kein neg. KK, Formel gibt verlust; (ii) max(KK,0)<verlust<=max(KK,0)+haftung
    -> ueberschiessender Teil erzeugt neg. KK = exakt S2-Fall ''soweit ... entsteht
    oder sich erhoeht'', gedeckt bis haftungsbetrag; (iii) darueber verrechenbar.
    Die angeblich fehlende soweit-Bedingung ist in Zweig (ii) ENTHALTEN. Obergrenze=positives_KK+haftungsbetrag
    = min(verlust, max(KK,0)+max(0,eingetragene-geleistete)). Waechter: (5000,KK0,e8000,g5000)->3000,
    (15000,KK-3000,...)->3000, (15000,10000,e5000,g5000)->10000=P2. Subsumtion dokumentiert
    (Auflage 1a).'
  item_snapshot:
