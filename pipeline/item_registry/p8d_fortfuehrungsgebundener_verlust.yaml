rule_id: p8d_fortfuehrungsgebundener_verlust
version: 4
items:
- art: annahme
  anker:
  - betrifft_kat
  - fortfuehrungs_voraussetzungen
  - interpretation
  formulierungen:
  - Fortführungsvoraussetzungen umfassen den ausschließlichen gleichen Geschäftsbetrieb
    seit Gründung oder drittem Veranlagungszeitraum. | Die Voraussetzungen des § 8d
    Abs. 1 Satz 1 werden als boolean abstrahiert.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - verlustvortrag_bestand
  - interpretation
  formulierungen:
  - Der Verlustvortrag wird als Geldbetrag ohne weitere Differenzierung modelliert.
  triage: nicht_material
- art: norm_teil
  anker:
  - ref
  - § 8d abs. 1 satz 1 kstg
  formulierungen:
  - wenn die Körperschaft seit ihrer Gründung oder zumindest seit dem Beginn des dritten
    Veranlagungszeitraums, der dem Veranlagungszeitraum nach Satz 5 vorausgeht, ausschließlich
    denselben Geschäftsbetri
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: suspension_des_8c_auf_antrag
- art: norm_teil
  anker:
  - ref
  - § 8d abs. 1 satz 6 kstg
  formulierungen:
  - Der Verlustvortrag, der zum Schluss des Veranlagungszeitraums verbleibt, in den
    der schädliche Beteiligungserwerb fällt, wird zum fortführungsgebundenen Verlust
    (fortführungsgebundener Verlustvortrag)
  triage: bedingung_neu
  klasse: unabhaengig
  bedingung: fortfuehrungsgebundener_verlustvortrag_kennzeichnung
