# Item-Registry (Protokolldekret Stufe 4). Monoton wachsend.
# Nur Julius' Triage aendert diese Datei; nur diese Datei aendert Verdikte.

rule_id: p9_6_erstausbildung_abgrenzung
version: 1
items:
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 6 satz 1
  formulierungen:
  - Aufwendungen des Steuerpflichtigen für seine Berufsausbildung oder für sein Studium
  triage: nicht_echt
  klasse: wirkt_hinein
- art: annahme
  anker:
  - betrifft_kat
  - erstausbildung_abgeschlossen
  - interpretation
  formulierungen:
  - Die Eingabe 'erstausbildung_abgeschlossen' wird als zutreffende rechtliche Feststellung
    einer abgeschlossenen Erstausbildung vorausgesetzt.
  - Die Eingabe 'erstausbildung_abgeschlossen' wird als bereits gemäß § 9 Abs. 6 Sätze
    2-5 EStG geprüft vorausgesetzt.
  - The boolean input 'erstausbildung_abgeschlossen' is assumed to already reflect
    the legal definition of a completed first education as per §9 Abs. 6 Sätze 2-5.
  - The input 'erstausbildung_abgeschlossen' is assumed to correctly indicate a prior
    completed Erstausbildung.
  triage: bedingung_neu
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 6 satz 2
  formulierungen:
  - Eine Berufsausbildung als Erstausbildung nach Satz 1 liegt vor, wenn eine geordnete
    Ausbildung mit einer Mindestdauer von 12 Monaten bei vollzeitiger Ausbildung und
    mit einer Abschlussprüfung durchgef
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 6 satz 3
  formulierungen:
  - Eine geordnete Ausbildung liegt vor, wenn sie auf der Grundlage von Rechts- oder
    Verwaltungsvorschriften oder internen Vorschriften eines Bildungsträgers durchgeführt
    wird.
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 6 satz 4
  formulierungen:
  - Ist eine Abschlussprüfung nach dem Ausbildungsplan nicht vorgesehen, gilt die
    Ausbildung mit der tatsächlichen planmäßigen Beendigung als abgeschlossen.
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 6 satz 5
  formulierungen:
  - Eine Berufsausbildung als Erstausbildung hat auch abgeschlossen, wer die Abschlussprüfung
    einer durch Rechts- oder Verwaltungsvorschriften geregelten Berufsausbildung mit
    einer Mindestdauer von 12 Mon
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - satz 2
  formulierungen:
  - geordnete Ausbildung mit einer Mindestdauer von 12 Monaten
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - satz 4
  formulierungen:
  - Ist eine Abschlussprüfung nach dem Ausbildungsplan nicht vorgesehen
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: norm_teil
  anker:
  - ref
  - satz 5
  formulierungen:
  - wer die Abschlussprüfung einer durch Rechts- oder Verwaltungsvorschriften geregelten
    Berufsausbildung mit einer Mindestdauer von 12 Monaten bestanden hat
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: erstausbildung_nach_legaldefinition
- art: annahme
  anker:
  - betrifft_kat
  - im_dienstverhaeltnis
  - interpretation
  formulierungen:
  - Die Eingabe 'im_dienstverhaeltnis' wird als zutreffende Feststellung interpretiert,
    dass die Ausbildung im Dienstverhältnis stattfindet.
  - Die Eingabe 'im_dienstverhaeltnis' wird als zutreffende Prüfung des Dienstverhältnisses
    vorausgesetzt.
  - The input 'im_dienstverhaeltnis' is assumed to correctly indicate that the education
    occurs within a service relationship.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - aufwendungen
  - interpretation
  formulierungen:
  - Die Eingabe 'aufwendungen' wird als Aufwendungen für die eigene Berufsausbildung
    oder das Studium des Steuerpflichtigen interpretiert.
  - The input 'aufwendungen' is assumed to be the taxpayer's expenses for their own
    vocational training or studies.
  triage: nicht_material
- art: norm_teil
  anker:
  - ref
  - satz 3
  formulierungen:
  - auf der Grundlage von Rechts- oder Verwaltungsvorschriften
  triage: nicht_material_backlog
  klasse: unabhaengig
