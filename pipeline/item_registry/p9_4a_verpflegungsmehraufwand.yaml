  formulierungen:
  - Die Formalisierung setzt voraus, dass die Monatsangabe die Unterbrechungsregel
    von vier Wochen bereits berücksichtigt.
  - Die Formalisierung nimmt an, dass 'monate_am_ort' die Dauer ohne Unterbrechungen
    nach Satz 7 angibt.
  - Die Monatsangabe wird als ununterbrochene Dauer am selben Ort ohne Berücksichtigung
    von Unterbrechungen interpretiert.
  - Die Eingabe monate_am_ort wird als bereits um Unterbrechungen von mindestens vier
    Wochen bereinigte Dauer interpretiert.
  - Die Formalisierung interpretiert 'monate_am_ort' als die Anzahl der Monate einer
    längerfristigen Tätigkeit, ohne die Längerfristigkeit eigenständig zu prüfen.
  triage: bedingung_neu
