rule_id: p9_4a_verpflegungsmehraufwand
version: 2
items:
- art: annahme
  anker:
  - betrifft_kat
  - mit_uebernachtung
  - interpretation
  formulierungen:
  - Die Formalisierung interpretiert die Übernachtungsangabe als auf den jeweiligen
    Tag bezogen, ohne die Möglichkeit einer Übernachtung an angrenzenden Tagen zu
    berücksichtigen.
  - Die Formalisierung nimmt an, dass 'mit_uebernachtung' nur Übernachtung am selben
    Tag bedeutet, nicht an angrenzenden Tagen.
  - Die Eingabe mit_uebernachtung wird so interpretiert, dass sie auch Übernachtungen
    an angrenzenden Tagen umfasst, wie von der Norm für An- und Abreisetage gefordert.
  - Die Formalisierung interpretiert 'mit_uebernachtung' so, dass eine Übernachtung
    am An-/Abreisetag oder einem angrenzenden Tag stattfindet.
  triage: bedingung_neu
  bedingung: uebernachtung_oder_eintaegig_ueber_acht_stunden
- art: annahme
  anker:
  - betrifft_kat
  - ergebnis
  - geltungsvoraussetzung
  formulierungen:
  - Die Formalisierung geht davon aus, dass der Arbeitnehmer eine erste Tätigkeitsstätte
    hat.
  - Die Formalisierung setzt voraus, dass eine auswärtige berufliche Tätigkeit vorliegt,
    ohne dies zu prüfen.
  triage: bedingung_neu
  bedingung: auswaertige_berufliche_taetigkeit
- art: annahme
  anker:
  - betrifft_kat
  - abwesenheit_stunden
  - interpretation
  formulierungen:
  - Die Formalisierung nimmt an, dass die eingegebene Abwesenheit in Stunden 24 nicht
    übersteigt.
  - Die Stundenangabe wird als exakte Abwesenheitsdauer an einem Kalendertag interpretiert.
  - Die Formalisierung nimmt an, dass bei tagesübergreifender Tätigkeit ohne Übernachtung
    die Eingabe für den Tag mit dem überwiegenden Teil der Abwesenheit erfolgt.
  - Die Eingabe abwesenheit_stunden wird als die für den Tag maßgebliche Stundenzahl
    nach der Mehrheitsregel bei tagesübergreifender Abwesenheit interpretiert.
  - Die Formalisierung setzt voraus, dass die Stundenanzahl die Abwesenheit von Wohnung
    und erster Tätigkeitsstätte bereits beinhaltet.
  triage: bedingung_neu
  bedingung: uebernachtung_oder_eintaegig_ueber_acht_stunden
