  - § 33 abs. 3 satz 1 nr. 1 buchst. b
  formulierungen:
  - nach § 32a Absatz 5 oder 6 (Splitting-Verfahren) zu berechnen ist
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: splitting_ist_veranlagungsergebnis
