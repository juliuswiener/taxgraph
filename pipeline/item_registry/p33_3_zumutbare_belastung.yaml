- art: annahme
  anker:
  - betrifft_kat
  - gesamtbetrag_der_einkuenfte
  - interpretation
  formulierungen:
  - Der Gesamtbetrag der Einkünfte ist der steuerrechtlich definierte Gesamtbetrag
    der Einkünfte.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - ergebnis
  - rundung
  formulierungen:
  - Die Berechnung multipliziert Geldbeträge mit Prozentsätzen, ohne dass die Norm
    eine Rundungsregel vorschreibt.
  - Die Multiplikation von Geldbeträgen mit Prozentsätzen erfolgt ohne explizite Rundungsregel.
  - Das Ergebnis wird ohne Rundung als exakter Geldbetrag berechnet, obwohl die Norm
    keine Rundungsregel vorgibt.
  triage: nicht_material
- art: norm_teil
  anker:
  - ref
  - § 33 abs. 1 estg
  formulierungen:
  - so wird auf Antrag die Einkommensteuer dadurch ermäßigt, dass der Teil der Aufwendungen,
    der die dem Steuerpflichtigen zumutbare Belastung (Absatz 3) übersteigt, vom Gesamtbetrag
    der Einkünfte abgezog
  triage: nicht_material_backlog
  klasse: unabhaengig
