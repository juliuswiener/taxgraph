  - Die Formalisierung setzt voraus, dass die Aufwendungen zwangsläufig und größer
    als bei der Vergleichsgruppe sind, ohne dies zu modellieren.
  triage: bedingung_neu
  bedingung: agb_ist_zwangslaeufig
- art: norm_teil
  anker:
  - ref
  - § 33 abs. 1
  formulierungen:
  - vom Gesamtbetrag der Einkünfte abgezogen
  - Erwachsen einem Steuerpflichtigen zwangsläufig größere Aufwendungen als der überwiegenden
    Mehrzahl der Steuerpflichtigen gleicher Einkommensverhältnisse, gleicher Vermögensverhältnisse
    und gleichen Fa
  triage: bedingung_neu
  bedingung: agb_ist_zwangslaeufig
