  - einheitswert_grundbesitz
  - interpretation
  formulierungen:
  - Der Einheitswert bezieht sich nur auf nicht grundsteuerbefreiten Grundbesitz.
  - Der Einheitswert bezieht sich auf zum Betriebsvermögen gehörenden Grundbesitz.
  triage: bedingung_neu
  bedingung: kuerzung_1_2_prozent_einheitswert
- art: norm_teil
  anker:
  - ref
  - § 9 nr. 1 satz 1 gewstg a.f.
  formulierungen:
  - 1,2 Prozent des Einheitswerts des zum Betriebsvermögen des Unternehmers gehörenden
    und nicht von der Grundsteuer befreiten Grundbesitzes
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: kuerzung_1_2_prozent_einheitswert
