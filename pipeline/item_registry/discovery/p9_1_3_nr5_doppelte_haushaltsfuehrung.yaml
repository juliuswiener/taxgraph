rule_id: p9_1_3_nr5_doppelte_haushaltsfuehrung
hinweis: 'triage je Item setzen: bedingung_neu | grenzfall | nicht_material | nicht_echt; bei bedingung_neu die bedingung-ID
  eintragen. Dann: python pipeline/item_registry.py aufnehmen <datei>'
