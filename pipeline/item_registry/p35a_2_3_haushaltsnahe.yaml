# Item-Registry (Protokolldekret Stufe 4). Monoton wachsend.
# Nur Julius' Triage aendert diese Datei; nur diese Datei aendert Verdikte.

rule_id: p35a_2_3_haushaltsnahe
version: 1
items:
- art: annahme
  anker:
  - betrifft_kat
  - handwerker_arbeitskosten
  - interpretation
  formulierungen:
  - Die Handwerkerleistungen sind für Renovierungs-, Erhaltungs- und Modernisierungsmaßnahmen
    und nicht öffentlich gefördert.
  - Die handwerker_arbeitskosten umfassen ausschließlich Arbeitskosten.
  - Die Eingabe umfasst ausschließlich Arbeitskosten für Handwerkerleistungen im Sinne
    des § 35a Abs. 3 EStG.
  - Die Eingabe wird als Aufwendungen für nicht öffentlich geförderte Handwerkerleistungen
    interpretiert.
  triage: bedingung_neu
  bedingung: handwerkerbetrag_enthaelt_nur_arbeitskosten
- art: annahme
  anker:
  - betrifft_kat
  - minijob_aufwendungen
  - geltungsvoraussetzung
  formulierungen:
  - Die minijob_aufwendungen erfüllen die Voraussetzungen der Absätze 4 und 5 (keine
    Betriebsausgaben, EU/EWR-Haushalt).
  - Die Aufwendungen sind keine Betriebsausgaben oder Werbungskosten und nicht als
    Sonderausgaben oder außergewöhnliche Belastungen berücksichtigt.
  - Der Steuerpflichtige hat einen Antrag auf Steuerermäßigung gestellt.
  - Die Aufwendungen stammen aus einer geringfügigen Beschäftigung im Sinne des §
    8a SGB IV.
  - Es wird angenommen, dass das Beschäftigungsverhältnis im Haushalt in der EU oder
    dem EWR ausgeübt wird.
  triage: bedingung_neu
  bedingung: minijob_ist_geringfuegige_beschaeftigung_nach_8a_sgb4
- art: annahme
  anker:
  - betrifft_kat
  - haushaltsnahe_dienstleistungen
  - geltungsvoraussetzung
  formulierungen:
  - Die haushaltsnahe_dienstleistungen erfüllen die Voraussetzungen der Absätze 4
    und 5 (keine Betriebsausgaben, EU/EWR-Haushalt).
  - Der Steuerpflichtige hat eine Rechnung erhalten und die Zahlung auf das Konto
    des Leistungserbringers geleistet.
  - Die Dienstleistung wird in einem Haushalt in der EU oder dem EWR erbracht.
  - Es wird angenommen, dass die Aufwendungen keine Betriebsausgaben oder Werbungskosten
    sind und nicht anderweitig berücksichtigt wurden.
  - Es wird angenommen, dass eine Rechnung vorliegt und die Zahlung auf das Konto
    des Leistungserbringers erfolgt ist.
  triage: bedingung_neu
  bedingung: rechnung_und_unbare_zahlung
- art: annahme
  anker:
  - betrifft_kat
  - handwerker_arbeitskosten
  - geltungsvoraussetzung
  formulierungen:
  - Die handwerker_arbeitskosten sind nicht für öffentlich geförderte Maßnahmen und
    erfüllen die Voraussetzungen der Absätze 4 und 5.
  - Der Steuerpflichtige hat eine Rechnung erhalten und die Zahlung auf das Konto
    des Leistungserbringers geleistet.
  - Die Handwerkerleistungen sind nicht öffentlich gefördert im Sinne des § 35a Abs.
    3 Satz 2 EStG.
  - Es wird angenommen, dass die Aufwendungen keine Betriebsausgaben oder Werbungskosten
    sind und nicht anderweitig berücksichtigt wurden.
  - Es wird angenommen, dass eine Rechnung vorliegt und die Zahlung auf das Konto
    des Leistungserbringers erfolgt ist.
  - Es wird angenommen, dass die Handwerkerleistung im Haushalt in der EU oder dem
    EWR erbracht wird.
  triage: bedingung_neu
  bedingung: handwerker_keine_oeffentliche_foerderung
- art: annahme
  anker:
  - betrifft_kat
  - haushaltsnahe_dienstleistungen
  - interpretation
  formulierungen:
  - Die Eingabe umfasst ausschließlich Arbeitskosten im Sinne des § 35a Abs. 5 Satz
    2 EStG.
  - Die Eingabe umfasst nur die begünstigten Kosten für Pflege- und Betreuungsleistungen
    sowie Heimunterbringung, soweit sie mit haushaltsnahen Dienstleistungen vergleichbar
    sind.
  - Die Eingabe wird als ausschließlich Arbeitskosten interpretiert, obwohl die Norm
    dies nicht für den gesamten Betrag vorschreibt.
  - Die haushaltsnahen Dienstleistungen umfassen ausschließlich Arbeitskosten.
  - Die haushaltsnahe_dienstleistungen werden als Arbeitskosten für haushaltsnahe
    Dienstleistungen im Sinne des Absatzes 2 behandelt.
  - Die Eingabe betrifft nur haushaltsnahe Dienstleistungen oder Beschäftigungsverhältnisse,
    die nicht unter § 35a Abs. 3 EStG fallen.
  - Die haushaltsnahen Dienstleistungen sind keine Handwerkerleistungen und werden
    im Haushalt erbracht.
  triage: bedingung_neu
  bedingung: dienstleistungsbetrag_enthaelt_nur_arbeitskosten
- art: annahme
  anker:
  - betrifft_kat
  - ergebnis
  - geltungsvoraussetzung
  formulierungen:
  - Die Aufwendungen sind nicht als Betriebsausgaben, Werbungskosten oder Sonderausgaben
    berücksichtigt worden.
  - Es wird angenommen, dass die tarifliche Einkommensteuer nach anderen Ermäßigungen
    die Summe der Einzelermäßigungen nicht unterschreitet.
  - Es wird ein Antrag auf Steuerermäßigung gestellt.
  - Der Steuerpflichtige lebt nicht mit einem anderen Alleinstehenden in einem Haushalt
    zusammen, so dass die Höchstbeträge nur einmal in Anspruch genommen werden.
  - Die Leistungen werden im Haushalt des Steuerpflichtigen in der EU oder dem EWR
    erbracht.
  - Die Höchstbeträge werden nicht mit einer weiteren alleinstehenden Person im selben
    Haushalt geteilt.
  - Es wird angenommen, dass keine zwei Alleinstehenden im Haushalt zusammenleben
    und die Höchstbeträge nur einmal gelten.
  triage: bedingung_neu
  bedingung: kein_gemeinsamer_haushalt_zweier_alleinstehender
- art: annahme
  anker:
  - betrifft_kat
  - ergebnis
  - rundung
  formulierungen:
  - Die 20%-Berechnung der Aufwendungen erfolgt ohne gesetzliche Rundungsvorschrift,
    es wird standardmäßig gerundet.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - minijob_aufwendungen
  - zeitbezug
  formulierungen:
  - Es wird angenommen, dass die Aufwendungen im jeweiligen Veranlagungsjahr angefallen
    sind.
  triage: nicht_material
