- art: norm_teil
  anker:
  - ref
  - § 15a abs. 3 s. 3 estg
  formulierungen:
  - Wird der Haftungsbetrag im Sinne des Absatzes 1 Satz 2 gemindert
  - sind im Wirtschaftsjahr der Haftungsminderung und den zehn vorangegangenen Wirtschaftsjahren
    Verluste nach Absatz 1 Satz 2 ausgleichs- oder abzugsfähig gewesen
  - Satz 2 gilt sinngemäß
  - so ist dem Kommanditisten der Betrag der Haftungsminderung, vermindert um auf
    Grund der Haftung tatsächlich geleistete Beträge, als Gewinn zuzurechnen
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: vermindert_um_geleistete_betraege
