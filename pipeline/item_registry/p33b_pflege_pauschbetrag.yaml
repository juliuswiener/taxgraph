  anker:
  - betrifft_kat
  - pflegegrad
  - interpretation
  formulierungen:
  - Die Formalisierung behandelt Pflegegrade außerhalb von 2, 3, 4 und 5 einheitlich
    als nicht anspruchsbegründend, ohne dass die Norm dies explizit regelt.
  triage: bedingung_neu
  bedingung: pflegegrad_staffel
- art: norm_teil
  anker:
  - ref
  - satz 3
  formulierungen:
