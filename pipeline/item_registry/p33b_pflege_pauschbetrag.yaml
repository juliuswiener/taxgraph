rule_id: p33b_pflege_pauschbetrag
version: 1
items:
- art: abweichung
  anker:
  - abweichung_text
  - die formalisierung gewaehrt 1.800 euro bei hilflosigkeit unabhaengig vom pflegegrad,
    waehrend die norm dies nur zusaetzlich zu pflegegrad 4 oder 5 vorsieht.
  formulierungen:
  - 'Judge-Fehllesen des erweiternden ''auch'' (Abs. 6 S. 4): der 1.800-Betrag (Satz
    3 Nr. 3) wird auch bei hilflos gewaehrt, unabhaengig vom Pflegegrad; Formalisierung
    wortlautgetreu, per Wortlaut-Grep belegt.'
  triage: nicht_echt
