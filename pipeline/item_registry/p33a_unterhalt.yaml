  formulierungen:
  - Der Höchstbetrag nach Satz 1 erhöht sich um den Betrag der im jeweiligen Veranlagungszeitraum
    nach § 10 Absatz 1 Nummer 3 für die Absicherung der unterhaltsberechtigten Person
    aufgewandten Beiträge
  triage: nicht_material_backlog
  klasse: wirkt_hinein
