- art: norm_teil
  anker:
  - ref
  - § 33a abs. 1 s. 1 estg
  formulierungen:
  - Aufwendungen für den Unterhalt und eine etwaige Berufsausbildung einer dem Steuerpflichtigen
    oder seinem Ehegatten gegenüber gesetzlich unterhaltsberechtigten Person
  - einer dem Steuerpflichtigen oder seinem Ehegatten gegenüber gesetzlich unterhaltsberechtigten
    Person
  - auf Antrag die Einkommensteuer dadurch ermäßigt
  - vom Gesamtbetrag der Einkünfte abgezogen werden
  - bis zur Höhe des Grundfreibetrags nach § 32a Absatz 1 Satz 2 Nummer 1
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: grundfreibetrag_norm_konstante_nicht_input
- art: norm_teil
  anker:
