    übersteigen
  - Einkünfte und Bezüge der unterhaltsberechtigten Person
  - um den Betrag, um den diese Einkünfte und Bezüge den Betrag von 624 Euro im Kalenderjahr
    übersteigen
  triage: bedingung_neu
