items:
- art: annahme
  anker:
  - betrifft_kat
  - aufwendungen
  - interpretation
  formulierungen:
  - Aufwendungen werden als Bruttobetrag ohne weitere Differenzierung angenommen.
  - Aufwendungen umfassen nur Unterhalt und Berufsausbildungskosten.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - kv_pv_beitraege
  - interpretation
  formulierungen:
  - KV/PV-Beiträge werden als direkt abziehbarer Betrag interpretiert.
  - KV/PV-Beiträge gelten als direkt für die unterhaltsberechtigte Person geleistet.
  - KV/PV-Beiträge sind die nach § 10 Abs. 1 Nr. 3 aufgewandten Beiträge.
  triage: nicht_material
