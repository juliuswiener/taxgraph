- art: norm_teil
  anker:
  - ref
  - § 32d abs. 1 s. 5
  formulierungen:
  - Dabei sind „e“ die nach den Vorschriften des § 20 ermittelten Einkünfte, „q“ die
    nach Maßgabe des Absatzes 5 anrechenbare ausländische Steuer und „k“ der für die
    Kirchensteuer erhebende Religionsgesel
  triage: nicht_material_backlog
  klasse: unabhaengig
- art: norm_teil
  anker:
  - ref
  - § 32d abs. 1 s. 4 estg
  formulierungen:
  - Die Einkommensteuer beträgt damit e – 4 q 4 + k.
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: kirchensteuerpflicht_besteht
