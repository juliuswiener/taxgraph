  - Bewirkt der Anspruch auf Kindergeld für den gesamten Veranlagungszeitraum die
    nach Satz 1 gebotene steuerliche Freistellung nicht vollständig
  - bei nicht zusammenveranlagten Eltern wird der Kindergeldanspruch im Umfang des
