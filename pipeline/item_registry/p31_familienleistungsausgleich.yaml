- art: norm_teil
  anker:
  - ref
  - § 31 satz 1 estg
  formulierungen:
  - 'Die steuerliche Freistellung eines Einkommensbetrags in Höhe des Existenzminimums
    eines Kindes [...] wird im gesamten Veranlagungszeitraum entweder durch die Freibeträge
    nach § 32 Absatz 6 oder durch '
  triage: nicht_echt
