items:
- art: annahme
  anker:
  - betrifft_kat
  - ergebnis
  - rundung
  formulierungen:
  - Das Ergebnis der Berechnung wird kaufmännisch auf Cent gerundet, obwohl die Norm
    keine Rundung vorschreibt.
  - Die Formalisierung verwendet Dezimalarithmetik ohne explizite Rundungsregel, was
    implizit eine Rundung auf Cent oder ähnliches annimmt.
  - The computation uses decimal arithmetic without explicit rounding, assuming that
    the resulting money amount is rounded to cents in an unspecified manner.
  - Die Berechnung verwendet Gleitkommadivision ohne Rundungsregel, was zu Bruchteilen
    von Cent führen kann.
  - Die Formalisierung rundet das Ergebnis nicht, obwohl die Norm keine Rundungsregel
    enthält und Bruchteile von Cent entstehen können.
  triage: nicht_material
