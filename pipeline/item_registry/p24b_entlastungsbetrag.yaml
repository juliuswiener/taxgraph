- art: annahme
  anker:
  - betrifft_kat
  - anzahl_kinder
  - interpretation
  formulierungen:
  - Die Anzahl der Kinder wird als Anzahl der Kinder interpretiert, die die Voraussetzungen
    des § 24b Abs. 1 erfüllen.
  - Die Formalisierung nimmt an, dass anzahl_kinder ausschließlich Kinder zählt, für
    die ein Freibetrag nach §32 Abs. 6 oder Kindergeld zusteht.
  - The integer anzahl_kinder is assumed to count only children who meet the criteria
    of § 24b Abs. 1 EStG.
  triage: bedingung_neu
  bedingung: kinder_mit_freibetrag_oder_kindergeld_im_haushalt
- art: annahme
  anker:
  - betrifft_kat
  - alleinstehend
  - interpretation
  formulierungen:
  - Der boolesche Wert wird als Erfüllung der Definition des Alleinstehenden nach
    § 24b Abs. 3 interpretiert.
  - Der boolesche Wert 'alleinstehend' wird als korrekte Umsetzung der komplexen Definition
    in § 24b Abs. 3 EStG vorausgesetzt.
  - Die Formalisierung setzt voraus, dass alleinstehend bereits gemäß §24b Abs. 3
    EStG bestimmt wurde.
  - The boolean input alleinstehend is assumed to correctly reflect the legal definition
    of 'allein stehend' from § 24b Abs. 3 EStG.
  triage: bedingung_neu
  bedingung: alleinstehend_im_sinne_des_absatzes_3
- art: annahme
  anker:
  - betrifft_kat
  - monate_ohne_voraussetzung
  - zeitbezug
  formulierungen:
  - Die Anzahl wird als Anzahl der vollen Kalendermonate ohne Voraussetzungen des
    Abs. 1 gelesen, ohne Bereichsprüfung.
  triage: bedingung_neu
  bedingung: monate_ohne_voraussetzung_sind_volle_kalendermonate
- art: annahme
  anker:
  - betrifft_kat
  - monate_ohne_voraussetzung
  - interpretation
  formulierungen:
  - Die Anzahl der Monate ohne Voraussetzungen wird als korrekte Zählung voller Kalendermonate
    gemäß § 24b Abs. 4 EStG vorausgesetzt.
  - Die Formalisierung geht davon aus, dass monate_ohne_voraussetzung die Anzahl der
    vollen Kalendermonate ohne Voraussetzungen nach Abs. 1 korrekt angibt.
  - The integer monate_ohne_voraussetzung is assumed to correctly count the full calendar
    months without the conditions of § 24b Abs. 1.
  triage: bedingung_neu
  bedingung: monate_ohne_voraussetzung_sind_volle_kalendermonate
