rule_id: p9_spenden_hoechstbetrag
version: 3
items:
- art: annahme
  anker:
  - betrifft_kat
  - einkommen_vor_spenden
  - interpretation
  formulierungen:
  - Einkommen wird als das vor Spendenabzug und Verlustabzug verstanden.
  triage: nicht_material
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 2 satz 1 kstg
  formulierungen:
  - Als Einkommen im Sinne dieser Vorschrift gilt das Einkommen vor Abzug der in Absatz
    1 Nr. 2 bezeichneten Zuwendungen und vor dem Verlustabzug nach § 10d des Einkommensteuergesetzes.
  triage: bedingung_neu
  klasse: wirkt_hinein
  bedingung: einkommen_vor_spenden_und_verlustabzug
- art: norm_teil
  anker:
  - ref
  - § 9 abs. 1 nr. 2 kstg
  formulierungen:
  - vorbehaltlich des § 8 Absatz 3 Zuwendungen (Spenden und Mitgliedsbeiträge) zur
    Förderung steuerbegünstigter Zwecke im Sinne der §§ 52 bis 54 der Abgabenordnung
  triage: bedingung_neu
  klasse: unabhaengig
  bedingung: zuwendungen_steuerbeguenstigte_zwecke
