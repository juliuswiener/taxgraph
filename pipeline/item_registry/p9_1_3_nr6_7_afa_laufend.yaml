- art: annahme
  anker:
  - betrifft_kat
  - anschaffungsmonat
  - zeitbezug
  formulierungen:
  - Die Formalisierung nimmt an, dass der Anschaffungsmonat als Ganzes für die Nutzung
    zur Verfügung steht und nur volle Monate vor der Anschaffung kürzend wirken.
  - Die Formalisierung nimmt an, dass der Anschaffungsmonat als Ganzes für die AfA
    zählt, die Norm spricht von vollen Monaten vor der Anschaffung.
  - Die Formalisierung nimmt an, dass der Anschaffungsmonat als Ganzzahl von 1 bis
    12 vorliegt und der Monat der Anschaffung selbst nicht als voller Monat zählt.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - ergebnis
  - rundung
  formulierungen:
  - Die Formalisierung enthält keine Rundungsvorschrift für das Ergebnis der Division
    oder der Kürzungsberechnung.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - anschaffungsmonat
  - interpretation
  formulierungen:
  - Die Formalisierung interpretiert den Anschaffungsmonat als numerischen Wert von
    1 bis 12.
  triage: nicht_material
