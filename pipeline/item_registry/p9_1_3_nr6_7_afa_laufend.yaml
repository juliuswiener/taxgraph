  triage: bedingung_neu
  bedingung: anschaffungskosten_sind_massgebliche_ak
- art: annahme
  anker:
  - betrifft_kat
  - jahre_seit_anschaffung
  - interpretation
  formulierungen:
  - Die Formalisierung interpretiert jahre_seit_anschaffung als ganzzahlige Anzahl
