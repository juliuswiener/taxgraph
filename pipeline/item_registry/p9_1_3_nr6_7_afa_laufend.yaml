  - interpretation
  formulierungen:
  - Die Formalisierung behandelt die Anschaffungskosten als Nettobetrag ohne Umsatzsteuer,
    was die Norm nicht explizit festlegt.
  triage: bedingung_neu
  bedingung: anschaffungskosten_sind_massgebliche_ak
- art: annahme
