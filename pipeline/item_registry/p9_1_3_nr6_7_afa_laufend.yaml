  - nutzungsdauer_jahre
  - rundung
  formulierungen:
  - Die Formalisierung setzt eine ganzzahlige betriebsgewöhnliche Nutzungsdauer in
    Jahren voraus, die Norm enthält keine Rundungsregel.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - jahre_seit_anschaffung
  - zeitbezug
  formulierungen:
  - Die Formalisierung nimmt an, dass jahre_seit_anschaffung=0 das Anschaffungsjahr
    bezeichnet, ohne Berücksichtigung unterjähriger Anschaffungszeitpunkte.
  - Die Formalisierung nimmt an, dass 'jahre_seit_anschaffung' die Anzahl voller Kalenderjahre
    nach dem Jahr der Anschaffung angibt.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - nutzungsdauer_jahre
  - interpretation
  formulierungen:
  - Die Formalisierung nimmt an, dass die Nutzungsdauer in vollen Jahren angegeben
    wird und der betriebsgewöhnlichen Nutzungsdauer entspricht.
  - Die Formalisierung setzt voraus, dass die betriebsgewöhnliche Nutzungsdauer in
    ganzen Jahren angegeben und als Divisor verwendet werden kann.
  triage: nicht_material
- art: annahme
