  - 70% der angemessenen aufwendungen werden abgezogen, nicht der uebersteigende betrag.
  formulierungen:
  - '70% der angemessenen Aufwendungen werden abgezogen, nicht der übersteigende Betrag.
    nicht_echt (Instructor 2026-07-14): Komplement-Identitaet. Wortlaut ''soweit sie
    70 Prozent der Aufwendungen uebersteigen [= nicht abziehbar]'' definiert den NICHT-abziehbaren
    Teil (0,30 x angemessen); abziehbar = angemessen - 0,30 x angemessen = 0,70 x
    angemessen. Kodierung 0,70 x angemessen algebraisch identisch. Clerk-Seeds 1000->700,
    333,33->233,33 beweisen. Ueber-Flag-Typ-1-Variante (aequivalente Umformung).'
  triage: nicht_echt
- art: norm_teil
