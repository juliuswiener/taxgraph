rule_id: p6_2a_sammelposten_zufuehrung
version: 1
items:
- art: abweichung
  anker:
  - abweichung_text
  - der sammelposten wird nur bei ueberschreiten von 250 euro gebildet, nicht bei
    gleichheit.
  formulierungen:
  - 'Der Sammelposten wird nur bei Überschreiten von 250 Euro gebildet, nicht bei
    Gleichheit. nicht_echt (Instructor 2026-07-14): Wortlaut ''250 Euro, aber nicht
    1 000 Euro uebersteigen'' verlangt echtes Ueberschreiten; 250,00 uebersteigt 250
    NICHT -> nicht faehig. Kodierung netto > 250 wortlautkonform. Clerk-Seed 250,00->0
    beweist. Mistral-Ueber-Flag Typ 3 (Boundary-Richtung).'
  triage: nicht_echt
- art: abweichung
  anker:
  - abweichung_text
  - der sammelposten wird bei 1.000 euro inklusive gebildet, nicht nur unter 1.000
    euro.
  formulierungen:
  - 'Der Sammelposten wird bei 1.000 Euro inklusive gebildet, nicht nur unter 1.000
    Euro. nicht_echt (Instructor 2026-07-14): Wortlaut ''nicht 1 000 Euro uebersteigen'';
    1000,00 uebersteigt 1000 NICHT -> faehig. Kodierung netto <= 1000 wortlautkonform.
    Clerk-Seed 1000,00->1000,00 beweist. Mistral-Ueber-Flag Typ 3 (Boundary-Richtung).'
  triage: nicht_echt
