  - aufwendungen
  - geltungsvoraussetzung
  formulierungen:
  - Es wird vorausgesetzt, dass die Ehegattenregelung des Satzes 2 nicht anwendbar
    ist oder bereits eingerechnet wurde.
  triage: bedingung_neu
  bedingung: hoechstbetrag_gilt_je_person
- art: annahme
  anker:
  - betrifft_kat
  - aufwendungen
  - interpretation
  formulierungen:
  - Die Eingabe 'aufwendungen' entspricht den Aufwendungen im Sinne des § 10 Abs.
    1 Nr. 7 EStG.
  - Die Eingabe wird als Aufwendungen für die eigene Berufsausbildung verstanden,
    ohne dass dies geprüft wird.
  - Die Eingabe wird als bereits nach § 4 Abs. 5 und § 9 EStG ermittelte Aufwendungen
    behandelt.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - aufwendungen
  - zeitbezug
  formulierungen:
  - Die Eingabe bezieht sich auf ein Kalenderjahr.
  - Die Eingabe wird als die Aufwendungen eines Kalenderjahres behandelt, ohne dass
    ein Zeitraum geprüft wird.
  triage: nicht_material
- art: norm_teil
  anker:
  - ref
  - satz 2
  formulierungen:
  - Bei Ehegatten, die die Voraussetzungen des § 26 Absatz 1 Satz 1 erfüllen, gilt
    Satz 1 für jeden Ehegatten.
  triage: nicht_material_backlog
  klasse: unabhaengig
- art: norm_teil
