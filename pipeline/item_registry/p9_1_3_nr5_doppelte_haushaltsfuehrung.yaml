rule_id: p9_1_3_nr5_doppelte_haushaltsfuehrung
version: 1
items:
- art: annahme
  anker:
  - betrifft_kat
  - monate
  - interpretation
  formulierungen:
  - Die Formalisation legt die monatliche Höchstgrenze so aus, dass der Gesamtbetrag
    durch Multiplikation mit der Anzahl der Monate zu berechnen ist.
  - Die Formalisierung interpretiert die monatliche Höchstgrenze so, dass sie für
    jeden Monat einzeln gilt und die Beträge über die Anzahl der Monate aufsummiert
    werden.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - unterkunftskosten_monat
  - interpretation
  formulierungen:
  - Die Formalisierung unterstellt, dass der Steuerpflichtige stets die tatsächlichen
    Aufwendungen in voller Höhe bis zur Höchstgrenze geltend macht, obwohl die Norm
    ein Wahlrecht einräumt.
  - Die Formalisierung nimmt an, dass die monatlichen Unterkunftskosten über alle
    Monate konstant sind, obwohl die Norm keine solche Konstanz voraussetzt.
  triage: nicht_material
- art: annahme
  anker:
  - betrifft_kat
  - monate
  - zeitbezug
  formulierungen:
  - Die Norm nennt nur eine monatliche Höchstgrenze; die Formalisierung berechnet
    den Gesamtabzug durch Multiplikation mit der Monatsanzahl.
  - Die Formalisierung setzt voraus, dass die Unterkunft für eine ganzzahlige Anzahl
    von Monaten genutzt wurde.
  triage: nicht_material
