name: CI

"on":
  push:
  pull_request:

# Ein Commit auf einem Branch MIT offenem PR löste bisher zwei komplette Läufe aus (push- und
# pull_request-Ereignis), jeder mit vier Jobs und opam-Build. Und ein neuer Commit liess den
# alten Lauf weiterlaufen, obwohl sein Ergebnis niemanden mehr interessiert. Beides zusammen
# ist die Erklärung für einen guten Teil der verbrauchten Minuten (Audit
# no-concurrency-double-runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Das Standard-Token darf schreiben (Inhalte, Pakete, Aktionen). Kein Job hier braucht das —
# sie lesen den Code und führen Tests aus. Ein kompromittierter Schritt oder eine Action mit
# beweglichem Tag hätte damit Schreibzugriff auf das Repository (Audit
# actions-floating-tags-no-permissions).
permissions:
  contents: read

jobs:
  # Stufe-B-Tests (pipeline/tests/, Makefile-Ziel `unit-stufe-b`): ohne produkt/, ohne tests/conftest.py,
  # ohne Catala-Toolchain. Eigener Job, weil diese 247 Tests ihren Lauf behalten mussten, als `tests/` mit
  # dem Loeschplan (L2) entfiel. Sekunden, nur das Manifest. Die sechs fastapi-Tests aus
  # test_ui_backend.py und test_gettsim_crosscheck.py skippen sich hier selbst (kein fastapi, kein
  # gettsim im Manifest); den Crosscheck faehrt der Job gettsim-crosscheck unten echt.
  stufe-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      - name: pytest pipeline/tests (ohne Catala-Toolchain)
        run: python3 -m pytest pipeline/tests -q

  # Frischetor des Catala-Orakels als eigener Job (Vorarbeit zur Loeschstufe L2, Vault-Backlog
  # catala-orakel-frischetor-in-eigenen-ci-job). Derselbe Schritt stand im Job catala-toolchain, der
  # mit der pytest-Suite fiel (L2); hier hing er nicht in der Luft. Er braucht nur den
  # Catala-Interpreter (opam) und Rust: kein pip, kein `clerk build p32a-python`, kein
  # assemble_catala.sh, kein pytest, kein requirements-ci.txt (gemessen im frischen Worktree ohne
  # _build/ und oracle/gettsim/_catala, mit Attrappen statt python/pip: kein Aufruf). Der Rust-
  # Waechter rust/bindung/tests/ci_catala_orakel.rs haelt den Job fest.
  catala-orakel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System-Abhaengigkeiten (opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 build-essential pkg-config libgmp-dev

      - name: opam-Root cachen (gleicher Key wie die anderen Catala-Jobs)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      - name: Catala installieren
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          catala --version
          clerk --version

      # Das Orakel wird neu erzeugt und mit dem
      # eingecheckten Stand verglichen; eine Regel- oder Generatoraenderung ohne neu erzeugte Datei
      # macht den Schritt rot. `git ls-files --error-unmatch` steht davor, weil `git diff` fuer eine
      # Datei, die nicht im Index liegt, nichts meldet (ein stilles Gruen).
      - name: Catala-Orakel neu erzeugen, gegen den Stand im Repo pruefen
        run: |
          set -e
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
          eval $(opam env --switch=taxgraph --set-switch)
          git ls-files --error-unmatch rust/catala-sys/orakel/orakel.txt
          (cd rust && cargo run -p catala-sys --example orakel_erzeugen)
          git diff --exit-code -- rust/catala-sys/orakel/orakel.txt

  # Rust-Port (REWRITE_PLAN.md), Schritt 1 "Foundation". `rust/catala-sys/generated/` (der
  # Catala-C-Backend) ist COMMITTED -- dieser Job braucht deshalb weder den Opam-Switch noch
  # `clerk build` selbst, nur libgmp-dev zum Linken (`catala-sys/build.rs` bindet GMP dynamisch,
  # LGPL). ubuntu-latest bringt einen Rust-Toolchain per rustup mit, keine dritte Action noetig.
  #
  # poppler-utils: der Doctest `eingang::ocr::lies_kontoauszug_pdf` ruft `pdftotext` und erwartet
  # `NichtLesbar` (Exit 1 bei fehlender Datei). Das Runner-Image hat poppler nicht (Ubuntu2404-
  # Readme); ohne das Programm liefert derselbe Aufruf `Start` ("No such file or directory") und
  # der Doctest ist rot. Nachgemessen 2026-10-02 im Nachbau des Runners (ubuntu:24.04).
  #
  # Die Vergleichstests gegen Python (rust/parity, nur mit PARITY=1) sind seit L1 (2026-10-12)
  # geloescht; hier liefen sie ohnehin nur als No-op. Verlauf: `git show 37269912:rust/parity/`.
  #
  # DER ABGABEWEG IST HIER NICHT BEWIESEN. Der Weg, auf dem eine Erklaerung beim Finanzamt eingeht, braucht
  # das lizenzpflichtige ERiC-SDK und eine registrierte Herstellerkennung; beides fehlt auf oeffentlichen
  # Runnern. Die Tests gegen ERiC und checkESt sind `#[ignore]`; der Schritt "Was dieser Lauf nicht geprueft
  # hat" unten nennt ihre Zahl. Ein gruener Lauf ist KEIN Beleg fuer den Abgabeweg. Entschieden von Julius am 2026-09-12 (Vault
  # decisions/eric-abgabeweg-bleibt-lokaler-manueller-nachweis): der Nachweis bleibt lokal und manuell,
  # `make abgabeweg-freigabe-rust` (nicht `make eric-gate`: das zaehlt die GESPERRT-Grenze als Bestehen).
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Der ganze Verlauf, nicht der flache Klon: rust/bindung/tests/belege_aufloesbar.rs prueft, dass jeder
      # Commit-Hash und jede Verlaufsform (<commit>^:<pfad>) in rust/TESTMAP.tsv und rust/fixtures/README.md
      # in Git aufloest. Ohne den Verlauf wird der Test laut rot, ausser TAXGRAPH_OHNE_VERLAUF=1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System-Abhaengigkeiten (libgmp fuers Linken, poppler fuer den eingang-Doctest)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev poppler-utils

      # Rust ist gepinnt, nicht "stable": ubuntu-latest rollt Runner-Images mit verschiedenem Rust
      # gleichzeitig aus. clippy 1.99.0 (2026-09-28) bringt das Lint assert_is_empty; 557b7072 lief auf
      # dem Image 20261004 deshalb rot (3 Treffer in ring_scheiben.rs), 4ddc4f3f auf dem Image 20260927
      # gruen, bei gleichem Quelltext in diesen Zeilen. Seit 2026-10-10 sind alle 75 Treffer im Baum
      # behoben; 1.99.0 ist das Tor, lokal (rust/rust-toolchain.toml) und hier. Anheben: erst die
      # Treffer des neuen Lints im Baum beheben, dann die Zahl hier und in rust/rust-toolchain.toml
      # zugleich aendern.
      - name: Rust 1.99.0 festlegen
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          rustc --version
          cargo clippy --version

      # Der Schluessel haengt an Cargo.lock UND rust/Cargo.toml: dort steht `[profile.dev]
      # opt-level = 1`. Die Stufe steckt im Hash jedes gebauten Artefakts; mit dem alten Schluessel
      # (nur Cargo.lock) holte der Job nach der Umstellung den mit opt-level 0 gebauten Cache, baute
      # alles neu, und actions/cache schreibt bei einem Treffer nie neu -- der Cache waere fuer
      # immer wertlos geblieben (rust/bindung/tests/ci_konfiguration.rs haelt beides zusammen).
      - name: Cargo-Registry cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-taxgraph-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: cargo build
        run: cd rust && cargo build

      - name: cargo clippy (-D warnings)
        run: cd rust && cargo clippy --all-targets -- -D warnings

      # cargo-nextest (Julius 2026-10-15, d-1) statt `cargo test`: ein Prozess je Test, lokal auf 12 Kernen etwa 70 s gegen
      # 157 bis 180 s. Die Version ist fest (nicht "latest"), und die Pruefsumme steht hier: das Archiv kommt von der
      # Release-Seite des Projekts (SHA-256 der .tar.gz, von GitHub als Digest des Assets ausgewiesen und lokal nachgerechnet);
      # passt sie nicht, bricht der Schritt ab. `cargo install cargo-nextest` baut das Werkzeug auf dem Runner selbst (auf
      # 22 Kernen unter neun Minuten, auf 4 Kernen laenger) und liesse das Zeitlimit des Jobs reissen. Die Version steht an
      # drei Stellen dieses Schritts; rust/bindung/tests/ci_konfiguration.rs verlangt, dass es dieselbe ist.
      - name: cargo-nextest 0.9.146 installieren (Pruefsumme)
        run: |
          set -e
          archiv=cargo-nextest-0.9.146-x86_64-unknown-linux-gnu.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archiv" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/$archiv"
          echo "682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428  $RUNNER_TEMP/$archiv" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$HOME/.cargo/bin"
          cargo nextest --version

      # Kein ERiC-Schema auf dem Runner (Lizenz, s. oben). Jeder Test, der es braucht, fragt
      # elster::testhilfe::schemas_da und waere ohne Schema ROT; TAXGRAPH_OHNE_XSD=1 erlaubt das
      # Fehlen. einreichung_e2e prueft dann nur bis zum Writer, eigenschaften ueberspringt seine
      # zehn Schema-Tests, elster einen Unit-Test und fuenf Doctests. Byte-Vergleich mit Python
      # und XSD laufen lokal (ERIC_DIR).
      #
      # --no-fail-fast (und `fail-fast = false` im Profil ci, rust/.config/nextest.toml): ohne das Flag bricht der Lauf beim
      # ersten roten Test ab, und alles danach laeuft nie. So verdeckte `parity --lib` am 2026-10-02 den roten
      # eingang-Doctest (Lauf 36985004342: kein einziges "Doc-tests" im Log). Der Job-Status bleibt rot, sobald ein Test
      # rot ist; neu ist nur, dass ein Lauf ALLE roten Tests zeigt statt eines je Push.
      #
      # nextest fuehrt KEINE Doctests aus. Sie laufen im Schritt danach (`cargo test --doc`, `if: always()`, damit ein roter
      # Test sie nicht verdeckt) und schreiben ins selbe Log (`tee -a`). Die Testzahl eines Laufs ist die Zeile
      # `Summary ... N tests run` des ersten Schritts plus die `test result:`-Zeilen des zweiten.
      #
      # KEIN TAXGRAPH_OHNE_BROWSER (Nr. 72, E9; Julius 2026-10-15, d-8): die Browser-Tests der Oberflaeche
      # (rust/api/tests/oberflaeche) brauchen Chromium und chromedriver; ohne beides sind sie ROT. Das Flag
      # (=1 ueberspringt sie mit der Zeile UEBERSPRUNGEN) setzt die CI nicht mehr: GEMESSEN (Lauf 38459954734,
      # 2026-10-14) bringt der Runner Chrome und chromedriver mit, die 32 Oberflaechen-Tests liefen in 102,83 s
      # ohne eine Skip-Zeile. Ein Runner-Image ohne Browser macht den Lauf jetzt rot, statt 32 Tests still zu
      # uebergehen; rust/bindung/tests/ci_konfiguration.rs haelt das Flag aus allen Jobs heraus. Unter nextest laufen
      # diese Tests nacheinander (Gruppe oberflaeche-browser in rust/.config/nextest.toml).
      #
      # `tee` schreibt das Log fuer den Schritt unten. `shell: bash` ist Pflicht: ohne den Eintrag laeuft
      # der Schritt als `bash -e {0}` OHNE pipefail, `cargo nextest run | tee` lieferte dann den Exit von tee (0),
      # und ein roter Test machte den Job gruen (rust/bindung/tests/ci_nicht_geprueft.rs haelt das fest).
      # `--profile ci` (rust/.config/nextest.toml) zeigt die Ausgabe bestandener Tests einmal am Ende: nur dort stehen die
      # Verzichtszeilen (stderr), die der Zaehlschritt unten braucht.
      - name: cargo nextest
        shell: bash
        run: cd rust && cargo nextest run --profile ci --no-fail-fast 2>&1 | tee ../cargo-test.log
        env:
          TAXGRAPH_OHNE_XSD: "1"

      - name: cargo test --doc
        if: always()
        shell: bash
        run: cd rust && cargo test --doc --no-fail-fast 2>&1 | tee -a ../cargo-test.log
        env:
          TAXGRAPH_OHNE_XSD: "1"

      # Der gruene Haken sagt nicht, was uebersprungen wurde (ohne Schema, ohne Browser, ohne ERiC). Dieser
      # Schritt zaehlt es aus dem Log (Zeile NICHT GEPRUEFT, ::warning am Lauf, Tabelle in der Job-Zusammenfassung)
      # und laeuft auch bei rotem Test. Er macht den Lauf nicht rot, solange das Log Tests zeigt (Exit 2
      # nur bei fehlendem oder leerem Log): keine Ratsche, nur Sichtbarkeit.
      - name: Was dieser Lauf nicht geprueft hat
        if: always()
        run: bash scripts/ci-nicht-geprueft.sh cargo-test.log

  # Abhaengigkeiten auf bekannte Luecken (Julius 2026-10-15, d-12; Vault-Backlog anmeldung-drosseln-passwortlaenge-backup-rechte,
  # AK4): NUR EIN HINWEIS, die CI bleibt gruen. Der Schritt `cargo audit` hat `continue-on-error: true`: ein Treffer (Exit 1)
  # markiert den Schritt, nicht den Job und nicht den Lauf; der Befund steht als ::warning am Lauf, in der Job-Zusammenfassung
  # und im Log. IN VIER WOCHEN (ca. 2026-11-12) NEU ENTSCHEIDEN, ob ein Treffer den Lauf rot macht (dann das
  # `continue-on-error` streichen; rust/bindung/tests/ci_konfiguration.rs verlangt es heute).
  #
  # cargo-audit 0.22.2 mit Pruefsumme (musl-Build: statisch, laeuft auf jedem Runner-Image). Die Version ist Pflicht: 0.21.2 liest
  # die Advisory-Datenbank seit den Eintraegen mit CVSS 4.0 nicht mehr (lokal gemessen 2026-10-13: Abbruch). Die Datenbank holt
  # das Werkzeug frisch aus github.com/RustSec/advisory-db (kein `--no-fetch`, kein `--db`: eine alte Datenbank meldete
  # "keine Luecke" ueber Luecken, die es laengst gibt). Gelesen wird nur rust/Cargo.lock; eine Rust-Toolchain braucht der Job nicht.
  # Gemessen 2026-10-15 (lokal, Datenbank mit 1329 Eintraegen): 201 Pakete, 5 Meldungen (rkyv 0.7.46, 4 zu rustls 0.23.45),
  # 1 Warnung (unsafe-libyaml, nicht gepflegt), Exit 1.
  abhaengigkeiten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: cargo-audit 0.22.2 installieren (Pruefsumme)
        run: |
          set -e
          archiv=cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archiv" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/$archiv"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/$archiv" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-musl-v0.22.2" >> "$GITHUB_PATH"

      - name: cargo audit (frische Datenbank, nur Hinweis)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo-audit --version
          cargo-audit audit --file rust/Cargo.lock 2>&1 | tee audit.log
          rc=${PIPESTATUS[0]}
          luecken=$(sed -nE 's/^error: ([0-9]+) vulnerabilit.*/\1/p' audit.log | head -1)
          warnungen=$(sed -nE 's/^warning: ([0-9]+) allowed warning.*/\1/p' audit.log | head -1)
          case "$rc" in
            0|1) text="${luecken:-0} bekannte Luecke(n), ${warnungen:-0} Warnung(en)" ;;
            *) text="Werkzeug oder Datenbank nicht nutzbar (Exit ${rc}): die Pruefung hat nichts geprueft" ;;
          esac
          echo "::warning title=Abhaengigkeiten::cargo audit: ${text} (nur Hinweis, Entscheidung Julius d-12; neu entscheiden ca. 2026-11-12)"
          {
            echo "### Abhaengigkeiten auf bekannte Luecken (nur Hinweis)"
            echo
            echo "cargo audit: ${text}. Die CI bleibt gruen; ob ein Treffer sie rot macht, wird ca. 2026-11-12 neu entschieden."
            echo
            echo '```'
            grep -E '^(Crate|Version|Warning|Title|ID|Severity|Solution):' audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
