name: CI

"on":
  push:
  pull_request:

# Ein Commit auf einem Branch MIT offenem PR löste bisher zwei komplette Läufe aus (push- und
# pull_request-Ereignis), jeder mit vier Jobs und opam-Build. Und ein neuer Commit liess den
# alten Lauf weiterlaufen, obwohl sein Ergebnis niemanden mehr interessiert. Beides zusammen
# ist die Erklärung für einen guten Teil der verbrauchten Minuten (Audit
# no-concurrency-double-runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Das Standard-Token darf schreiben (Inhalte, Pakete, Aktionen). Kein Job hier braucht das —
# sie lesen den Code und führen Tests aus. Ein kompromittierter Schritt oder eine Action mit
# beweglichem Tag hätte damit Schreibzugriff auf das Repository (Audit
# actions-floating-tags-no-permissions).
permissions:
  contents: read

jobs:
  # Schnell-Gate: ist die Suite ueberhaupt SAMMELBAR, und stimmt die Konfiguration?
  # Sekunden statt Minuten, keine Toolchain. Laeuft dem vollen Gate unten voraus, ersetzt es
  # nicht.
  #
  # WARUM NICHT MEHR "pytest tests/", NACHGEMESSEN 2026-08-18. Hier stand ein Job, der die
  # ganze Suite ohne Catala fahren wollte, mit dem Kommentar: die catala-gebundenen Tests
  # skippen sich SELBST, PER DATEI, "verifiziert gegen ALLE tests/*.py, Stand 2026-07-21:
  # EINE Luecke gefunden". Aus dieser einen Luecke waren 23 geworden, ohne dass irgendetwas
  # es meldete -- in CI 27 Collection-Fehler und NULL gelaufene Tests. Der Job war seit
  # Monaten rot und hat nie etwas geprueft.
  #
  # Der Collection-Abbruch ist repariert (Guard in tests/conftest.py, misst per AST statt eine
  # Liste zu pflegen). Aber die Messung danach: ohne Toolchain laufen 1759 Tests gruen, 221
  # skippen -- und 30 SCHEITERN. Die scheitern NICHT an einem fehlenden Import (nur 2 von 30),
  # sondern mit AssertionError: der Code faengt das fehlende `runner` intern ab und antwortet
  # ehrlich "kein Wert", waehrend der Test einen Betrag erwartet. Das ist kein Mechanismus-
  # Problem, das ein Guard loesen koennte; jeder dieser 30 Tests behauptet inhaltlich etwas,
  # das nur MIT Catala gilt.
  #
  # Ein Job, der 30 Fehlschlaege produziert, die niemand beheben will, ist dauerhaft rot --
  # und dauerhaft rot sieht nach kurzer Zeit aus wie der Normalzustand. Genau das ist hier
  # passiert. Deshalb prueft dieser Job jetzt das, was er OHNE Toolchain ehrlich pruefen kann:
  # dass die Suite sammelbar ist. Ausgerechnet DAS war der Fehler, der die CI monatelang lahm
  # gelegt hat (ein fehlendes `requests`), und er kostet hier Sekunden.
  sammelbarkeit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      # --collect-only importiert JEDE Testdatei, fuehrt aber keinen Test aus. Genau die
      # Stufe, an der ein fehlendes Paket auffaellt -- und die einzige, die ohne Catala ein
      # verlaessliches Urteil erlaubt.
      - name: Suite ist sammelbar (ohne Catala-Toolchain)
        run: python3 -m pytest tests/ --collect-only -q

      # Die Konfigurations-Gates selbst brauchen weder Catala noch Netz und sind in
      # Sekunden durch. Sie pruefen u.a., dass jedes importierte Fremdpaket im Manifest
      # steht -- der Fehler, der diesen ganzen Job monatelang wertlos gemacht hat.
      - name: CI-Konfiguration und Dateirechte
        run: python3 -m pytest tests/test_ci_konfiguration.py tests/test_dateirechte.py -q

  # Stufe-B-Tests (pipeline/tests/, Makefile-Ziel `unit-stufe-b`): ohne produkt/, ohne tests/conftest.py,
  # ohne Catala-Toolchain. Eigener Job, weil `tests/` mit dem Loeschplan (L2) entfaellt und diese 247
  # Tests dann ihren Lauf behalten muessen. Sekunden, nur das Manifest. Die sechs fastapi-Tests aus
  # test_ui_backend.py und test_gettsim_crosscheck.py skippen sich hier selbst (kein fastapi, kein
  # gettsim im Manifest); den Crosscheck faehrt der Job gettsim-crosscheck unten echt.
  stufe-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      - name: pytest pipeline/tests (ohne Catala-Toolchain)
        run: python3 -m pytest pipeline/tests -q

  # Voller Gate: Catala/Clerk-Toolchain (docs/setup.md) dazu, damit die catala-gebundenen
  # Tests ECHT laufen statt zu skippen. `clerk test -W rules/` (Makefile-Ziel `tests`) ist
  # BEWUSST NICHT drin: Projekt-Fakt (Memory clerk-test-rules-preexisting-fails) — dieser
  # Flat-Glob-Aufruf hat ~16 PRE-EXISTING Fails (Sibling-Module loesen sich in der
  # Flat-Glob-Invocation nicht auf, "Could not resolve reference to ..."), kein echter
  # Regressions-Gate. Der echte Build-Gate ist `clerk build p32a-python` rc=0 (baut das
  # ganze Target inkl. aller Modul-Deps, wuerde bei echter Regression failen) + `pytest tests/`.
  # opam switch create kompiliert OCaml aus dem Quellcode -> erster Lauf langsam (~10-15min),
  # danach schnell ueber den ~/.opam-Cache. NICHT abgedeckt: das ERiC-XSD-Schema ist
  # lizenzpflichtig (ERIC_DIR, kein oeffentlicher Download) -> alle @requires_real_schema-
  # Tests in test_xsd_verify.py (inkl. test_voll_katalog_ist_gate_gruen) skippen hier
  # graceful weiter. Dieses Gate bleibt lokal (make eric-gate, ERIC_DIR gesetzt).
  #
  # DER ABGABEWEG IST HIER NICHT BEWIESEN — und dieser gruene Haken sagt das nicht. Der Weg,
  # auf dem eine Erklaerung offiziell beim Finanzamt eingeht, braucht das lizenzpflichtige
  # ERiC-SDK UND eine registrierte Herstellerkennung; beides fehlt auf oeffentlichen Runnern
  # aus Lizenz- und Geheimnisgruenden. tests/test_einreichen_durchstich.py laeuft deshalb mit
  # und ueberspringt seine beiden ERiC-bewehrten Faelle STILL: "1 passed, 2 skipped", exit 0.
  # Ein gruener CI-Lauf ist hier also KEIN Beleg fuer den Abgabeweg, sondern nur dafuer, dass
  # der Rest der Suite laeuft.
  #
  # Entschieden von Julius am 2026-09-12 (Vault decisions/eric-abgabeweg-bleibt-lokaler-
  # manueller-nachweis): der Abgabeweg bleibt ein lokaler, manueller Nachweis. ERiC und
  # Herstellerkennung werden NICHT als CI-Secrets hochgeladen, ein eigener geschuetzter Runner
  # erst, wenn automatische Releases einen maschinellen Beleg zwingend brauchen.
  #
  # Der lokale Nachweis ist `make abgabeweg-freigabe` — NICHT `make eric-gate`: eric-gate
  # prueft eine Minimal-XML und zaehlt die GESPERRT-Grenze als Bestehen, es laeuft also auch
  # gruen, wenn der Abgabeweg nie gerechnet hat. abgabeweg-freigabe faehrt den echten
  # HTTP-Endpunkt mit echtem checkESt und macht aus jedem Skip ein exit != 0. Ohne ERiC endet
  # das Ziel mit exit!=0 statt mit "1 passed, 2 skipped" — das ist der Unterschied.
  # Nachgemessen: mit ERiC gruen (3 passed), mit ERIC_DIR=/nonexistent-eric exit 1.
  catala-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System-Abhaengigkeiten (poppler, tesseract, img2pdf, opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-deu img2pdf \
            opam m4 build-essential pkg-config libgmp-dev

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      - name: opam-Root cachen (opam init + switch taxgraph 4.14.2 + catala 1.2.1)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      # docs/setup.md Abschnitt 1, ein Schritt (opam-Env muss im selben Shell-Prozess
      # geladen bleiben wie catala/clerk-Aufrufe). opam init/switch create sind bei
      # Cache-Hit no-ops (opam erkennt bestehenden Root/Switch).
      - name: Catala/Clerk installieren + bauen + testen
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          catala --version
          clerk --version
          clerk build p32a-python
          bash oracle/gettsim/assemble_catala.sh

      # -n 4: GitHub-Runner haben 4 Kerne, und der Catala-Build ist zu diesem Zeitpunkt
      # fertig — sie stehen frei. --dist loadfile haelt jede Testdatei auf EINEM Worker;
      # das ist Pflicht, nicht Kuer: test_bescheid_fn_collector und
      # test_datenwurzel_ausserhalb_repo schreiben feste /tmp-Pfade, dateiuebergreifend
      # verteilt gaebe das Kollisionen. Prozess-basiert, daher kein Konflikt mit der
      # Thread-Unsicherheit von catala_runtime.
      #
      # pytest-xdist kommt aus requirements-ci.txt (e1fb69a) und wird oben installiert —
      # ohne das Plugin braeche dieser Schritt mit "unrecognized arguments: -n".
      # Lokal gemessen (12 Kerne): sequenziell 343 s, -n 6 71,6 s, gleiche 2229/3.
      # TAXGRAPH_OHNE_XSD=1: der Runner hat kein ERiC-Schema (Lizenz, kein oeffentlicher
      # Download). Seit 2026-10-01 (Log #142) ist ein fehlendes Schema LAUT ROT; uebersprungen
      # wird nur, wenn dieser Aufrufer ausdruecklich sagt, dass hier kein ERiC liegen kann.
      # Dieselbe Regel wie beim cargo-test-Schritt unten. Fehlt das Flag, wird der Job rot —
      # das ist gewollt: die Entscheidung soll sichtbar sein, nicht still.
      - name: pytest tests/ (mit gebauter Catala-Toolchain)
        run: |
          eval $(opam env --switch=taxgraph --set-switch)
          python3 -m pytest tests/ -q -n 4 --dist loadfile
        env:
          TAXGRAPH_OHNE_XSD: "1"

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System-Abhaengigkeiten (opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 build-essential pkg-config libgmp-dev

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      - name: opam-Root cachen (gleicher Key wie catala-toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      - name: Catala bauen + assembliertes Package
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          clerk build p32a-python
          bash oracle/gettsim/assemble_catala.sh

      # Direkt `python golden/golden_lauf.py`, NICHT `make golden`. Grund: das
      # Makefile-Target sourcet venv312 (oracle/.venv312/bin/activate), das hier niemand
      # braucht — der Rechenkern (produkt/engine/runner.py, bis 2026-08-19 golden/runner.py)
      # importiert Catala-Compiler-Output aus oracle/gettsim/_catala/{pkg,rt} und legt sich
      # die Pfade selbst, kein GETTSIM. `pip install pyyaml jsonschema Pillow` oben reicht.
      # Venv312 im Makefile ist funktionsloser Nebeneffekt der build-python-Dep-Chain.
      #
      # Dass dieses Skript ueberhaupt startet, prueft seit dem Abnahme-Audit 2026-08-19
      # tests/test_ci_konfiguration.py::test_jedes_von_ci_gestartete_skript_ist_importierbar
      # — der Umzug des Kerns hatte genau hier den Pfad-Prolog zurueckgelassen.
      - name: golden (135 Faelle, direkt — venv312 nicht noetig)
        run: |
          eval $(opam env --switch=taxgraph --set-switch)
          python golden/golden_lauf.py

  # Differentielles Rechen-Oracle: unsere Catala-Werte gegen GETTSIM. Faengt Rechen-
  # Regressionen, die die Unit-Suite nicht sieht. Die bekannten Divergenzen stehen als
  # Allowlist in pipeline/tests/test_gettsim_crosscheck.py (KNOWN_DEVIATIONS, GETTSIM-Bug #1209
  # Splitting-Rundung) — eine NEUE Abweichung schlaegt rot, das ist der Zweck.
  # Braucht — anders als golden — die venv312: golden_crosscheck.py importiert GETTSIM.
  gettsim-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System-Abhaengigkeiten (opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 build-essential pkg-config libgmp-dev

      - name: opam-Root cachen (gleicher Key wie catala-toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      - name: Catala bauen + assembliertes Package
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          clerk build p32a-python
          bash oracle/gettsim/assemble_catala.sh

      # venv312 nach docs/setup.md: GETTSIM braucht Python 3.12.
      # bcrypt/PyJWT: seit tests/conftest.py `import server` (f0e1c71, 2026-08-10) zieht
      # jede Collection unter tests/ den vollen server->auth-Importpfad, unabhaengig vom
      # Testinhalt. Fehlen sie in diesem isolierten venv312, schlaegt schon die Collection
      # von test_gettsim_crosscheck.py fehl (ModuleNotFoundError), nicht erst ein Test.
      # Seit 2026-10-06 liegt die Datei unter pipeline/tests/, ohne conftest: dieser Grund
      # entfaellt. bcrypt/PyJWT bleiben installiert, bis ein CI-Lauf ohne sie gruen gesehen ist.
      - name: venv312 mit GETTSIM
        run: |
          set -e
          pip install uv
          uv venv oracle/.venv312 --python 3.12
          uv pip install --python oracle/.venv312/bin/python \
            -r requirements-oracle.txt

      - name: gettsim-crosscheck (Report + Gate)
        run: |
          set -e
          eval $(opam env --switch=taxgraph --set-switch)
          . oracle/.venv312/bin/activate
          python oracle/gettsim/golden_crosscheck.py
          python -m pytest pipeline/tests/test_gettsim_crosscheck.py -q

  # Rust-Port (REWRITE_PLAN.md), Schritt 1 "Foundation". `rust/catala-sys/generated/` (der
  # Catala-C-Backend) ist COMMITTED -- dieser Job braucht deshalb weder den Opam-Switch noch
  # `clerk build` selbst, nur libgmp-dev zum Linken (`catala-sys/build.rs` bindet GMP dynamisch,
  # LGPL). ubuntu-latest bringt einen Rust-Toolchain per rustup mit, keine dritte Action noetig.
  #
  # poppler-utils: der Doctest `eingang::ocr::lies_kontoauszug_pdf` ruft `pdftotext` und erwartet
  # `NichtLesbar` (Exit 1 bei fehlender Datei). Das Runner-Image hat poppler nicht (Ubuntu2404-
  # Readme); ohne das Programm liefert derselbe Aufruf `Start` ("No such file or directory") und
  # der Doctest ist rot. Nachgemessen 2026-10-02 im Nachbau des Runners (ubuntu:24.04).
  #
  # Die Tarif-Paritaet gegen tools/parity/oracle.py (rust/parity/tests/tarif_paritaet.rs)
  # BRAUCHT den Opam-Switch + `produkt/` + `oracle/gettsim/assemble_catala.sh` und ist deshalb
  # standardmaessig ein No-op (sie erkennt PARITY!=1 und skippt sich selbst, gruen). Lokal
  # erzwingen: `PARITY=1 make rust-test` bzw. `PARITY=1 cargo test -p parity`.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System-Abhaengigkeiten (libgmp fuers Linken, poppler fuer den eingang-Doctest)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev poppler-utils

      # Der Schluessel haengt an Cargo.lock UND rust/Cargo.toml: dort steht `[profile.dev]
      # opt-level = 1`. Die Stufe steckt im Hash jedes gebauten Artefakts; mit dem alten Schluessel
      # (nur Cargo.lock) holte der Job nach der Umstellung den mit opt-level 0 gebauten Cache, baute
      # alles neu, und actions/cache schreibt bei einem Treffer nie neu -- der Cache waere fuer
      # immer wertlos geblieben (tests/test_ci_konfiguration.py haelt beides zusammen).
      - name: Cargo-Registry cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-taxgraph-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: cargo build
        run: cd rust && cargo build

      - name: cargo clippy (-D warnings)
        run: cd rust && cargo clippy --all-targets -- -D warnings

      # Kein ERiC-Schema auf dem Runner (Lizenz, s. oben). Jeder Test, der es braucht, fragt
      # elster::testhilfe::schemas_da und waere ohne Schema ROT; TAXGRAPH_OHNE_XSD=1 erlaubt das
      # Fehlen. einreichung_e2e prueft dann nur bis zum Writer, eigenschaften ueberspringt seine
      # zehn Schema-Tests, elster einen Unit-Test und fuenf Doctests. Byte-Vergleich mit Python
      # und XSD laufen lokal (ERIC_DIR).
      #
      # --no-fail-fast: ohne das Flag bricht cargo beim ersten roten Ziel ab, und alles danach
      # laeuft nie -- spaetere Testziele UND die Doctests aller Crates, die cargo zuletzt faehrt.
      # So verdeckte `parity --lib` am 2026-10-02 den roten eingang-Doctest (Lauf 36985004342:
      # kein einziges "Doc-tests" im Log). Der Job-Status bleibt rot, sobald ein Ziel rot ist
      # (exit 101); neu ist nur, dass ein Lauf ALLE roten Ziele zeigt statt eines je Push.
      - name: cargo test (Tarif-Paritaet ohne PARITY=1 -- no-op, gruen)
        run: cd rust && cargo test --no-fail-fast
        env:
          TAXGRAPH_OHNE_XSD: "1"
