name: CI

"on":
  push:
  pull_request:

# Ein Commit auf einem Branch MIT offenem PR löste bisher zwei komplette Läufe aus (push- und
# pull_request-Ereignis), jeder mit vier Jobs und opam-Build. Und ein neuer Commit liess den
# alten Lauf weiterlaufen, obwohl sein Ergebnis niemanden mehr interessiert. Beides zusammen
# ist die Erklärung für einen guten Teil der verbrauchten Minuten (Audit
# no-concurrency-double-runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Das Standard-Token darf schreiben (Inhalte, Pakete, Aktionen). Kein Job hier braucht das —
# sie lesen den Code und führen Tests aus. Ein kompromittierter Schritt oder eine Action mit
# beweglichem Tag hätte damit Schreibzugriff auf das Repository (Audit
# actions-floating-tags-no-permissions).
permissions:
  contents: read

jobs:
  # Schnell-Gate: ist die Suite ueberhaupt SAMMELBAR, und stimmt die Konfiguration?
  # Sekunden statt Minuten, keine Toolchain. Laeuft dem vollen Gate unten voraus, ersetzt es
  # nicht.
  #
  # WARUM NICHT MEHR "pytest tests/", NACHGEMESSEN 2026-08-18. Hier stand ein Job, der die
  # ganze Suite ohne Catala fahren wollte, mit dem Kommentar: die catala-gebundenen Tests
  # skippen sich SELBST, PER DATEI, "verifiziert gegen ALLE tests/*.py, Stand 2026-07-21:
  # EINE Luecke gefunden". Aus dieser einen Luecke waren 23 geworden, ohne dass irgendetwas
  # es meldete -- in CI 27 Collection-Fehler und NULL gelaufene Tests. Der Job war seit
  # Monaten rot und hat nie etwas geprueft.
  #
  # Der Collection-Abbruch ist repariert (Guard in tests/conftest.py, misst per AST statt eine
  # Liste zu pflegen). Aber die Messung danach: ohne Toolchain laufen 1759 Tests gruen, 221
  # skippen -- und 30 SCHEITERN. Die scheitern NICHT an einem fehlenden Import (nur 2 von 30),
  # sondern mit AssertionError: der Code faengt das fehlende `runner` intern ab und antwortet
  # ehrlich "kein Wert", waehrend der Test einen Betrag erwartet. Das ist kein Mechanismus-
  # Problem, das ein Guard loesen koennte; jeder dieser 30 Tests behauptet inhaltlich etwas,
  # das nur MIT Catala gilt.
  #
  # Ein Job, der 30 Fehlschlaege produziert, die niemand beheben will, ist dauerhaft rot --
  # und dauerhaft rot sieht nach kurzer Zeit aus wie der Normalzustand. Genau das ist hier
  # passiert. Deshalb prueft dieser Job jetzt das, was er OHNE Toolchain ehrlich pruefen kann:
  # dass die Suite sammelbar ist. Ausgerechnet DAS war der Fehler, der die CI monatelang lahm
  # gelegt hat (ein fehlendes `requests`), und er kostet hier Sekunden.
  sammelbarkeit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      # --collect-only importiert JEDE Testdatei, fuehrt aber keinen Test aus. Genau die
      # Stufe, an der ein fehlendes Paket auffaellt -- und die einzige, die ohne Catala ein
      # verlaessliches Urteil erlaubt.
      - name: Suite ist sammelbar (ohne Catala-Toolchain)
        run: python3 -m pytest tests/ --collect-only -q

      # Die Konfigurations-Gates selbst brauchen weder Catala noch Netz und sind in
      # Sekunden durch. Sie pruefen u.a., dass jedes importierte Fremdpaket im Manifest
      # steht -- der Fehler, der diesen ganzen Job monatelang wertlos gemacht hat.
      - name: CI-Konfiguration und Dateirechte
        run: python3 -m pytest tests/test_ci_konfiguration.py tests/test_dateirechte.py -q

  # Voller Gate: Catala/Clerk-Toolchain (docs/setup.md) dazu, damit die catala-gebundenen
  # Tests ECHT laufen statt zu skippen. `clerk test -W rules/` (Makefile-Ziel `tests`) ist
  # BEWUSST NICHT drin: Projekt-Fakt (Memory clerk-test-rules-preexisting-fails) — dieser
  # Flat-Glob-Aufruf hat ~16 PRE-EXISTING Fails (Sibling-Module loesen sich in der
  # Flat-Glob-Invocation nicht auf, "Could not resolve reference to ..."), kein echter
  # Regressions-Gate. Der echte Build-Gate ist `clerk build p32a-python` rc=0 (baut das
  # ganze Target inkl. aller Modul-Deps, wuerde bei echter Regression failen) + `pytest tests/`.
  # opam switch create kompiliert OCaml aus dem Quellcode -> erster Lauf langsam (~10-15min),
  # danach schnell ueber den ~/.opam-Cache. NICHT abgedeckt: das ERiC-XSD-Schema ist
  # lizenzpflichtig (ERIC_DIR, kein oeffentlicher Download) -> alle @requires_real_schema-
  # Tests in test_xsd_verify.py (inkl. test_voll_katalog_ist_gate_gruen) skippen hier
  # graceful weiter. Dieses Gate bleibt lokal (make eric-gate, ERIC_DIR gesetzt).
  catala-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System-Abhaengigkeiten (poppler, tesseract, img2pdf, opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-deu img2pdf \
            opam m4 build-essential pkg-config libgmp-dev

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      - name: opam-Root cachen (opam init + switch taxgraph 4.14.2 + catala 1.2.1)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      # docs/setup.md Abschnitt 1, ein Schritt (opam-Env muss im selben Shell-Prozess
      # geladen bleiben wie catala/clerk-Aufrufe). opam init/switch create sind bei
      # Cache-Hit no-ops (opam erkennt bestehenden Root/Switch).
      - name: Catala/Clerk installieren + bauen + testen
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          catala --version
          clerk --version
          clerk build p32a-python
          bash oracle/gettsim/assemble_catala.sh

      - name: pytest tests/ (mit gebauter Catala-Toolchain)
        run: |
          eval $(opam env --switch=taxgraph --set-switch)
          python3 -m pytest tests/ -q

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System-Abhaengigkeiten (opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 build-essential pkg-config libgmp-dev

      - name: Python-Abhaengigkeiten
        run: pip install -r requirements-ci.txt

      - name: opam-Root cachen (gleicher Key wie catala-toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      - name: Catala bauen + assembliertes Package
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          clerk build p32a-python
          bash oracle/gettsim/assemble_catala.sh

      # Direkt `python golden/golden_lauf.py`, NICHT `make golden`. Grund: das
      # Makefile-Target sourcet venv312 (oracle/.venv312/bin/activate), das hier niemand
      # braucht — der Rechenkern (produkt/engine/runner.py, bis 2026-08-19 golden/runner.py)
      # importiert Catala-Compiler-Output aus oracle/gettsim/_catala/{pkg,rt} und legt sich
      # die Pfade selbst, kein GETTSIM. `pip install pyyaml jsonschema Pillow` oben reicht.
      # Venv312 im Makefile ist funktionsloser Nebeneffekt der build-python-Dep-Chain.
      #
      # Dass dieses Skript ueberhaupt startet, prueft seit dem Abnahme-Audit 2026-08-19
      # tests/test_ci_konfiguration.py::test_jedes_von_ci_gestartete_skript_ist_importierbar
      # — der Umzug des Kerns hatte genau hier den Pfad-Prolog zurueckgelassen.
      - name: golden (135 Faelle, direkt — venv312 nicht noetig)
        run: |
          eval $(opam env --switch=taxgraph --set-switch)
          python golden/golden_lauf.py

  # Differentielles Rechen-Oracle: unsere Catala-Werte gegen GETTSIM. Faengt Rechen-
  # Regressionen, die die Unit-Suite nicht sieht. Die bekannten Divergenzen stehen als
  # Allowlist in tests/test_gettsim_crosscheck.py (KNOWN_DEVIATIONS, GETTSIM-Bug #1209
  # Splitting-Rundung) — eine NEUE Abweichung schlaegt rot, das ist der Zweck.
  # Braucht — anders als golden — die venv312: golden_crosscheck.py importiert GETTSIM.
  gettsim-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System-Abhaengigkeiten (opam-Build-Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 build-essential pkg-config libgmp-dev

      - name: opam-Root cachen (gleicher Key wie catala-toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-taxgraph-catala-1.2.1-ocaml-4.14.2-${{ runner.os }}

      - name: Catala bauen + assembliertes Package
        run: |
          set -e
          export OPAMYES=1
          export OPAMCONFIRMLEVEL=unsafe-yes
          opam init --bare -y || true
          opam switch create taxgraph 4.14.2 || true
          eval $(opam env --switch=taxgraph --set-switch)
          opam install -y catala.1.2.1
          clerk build p32a-python
          bash oracle/gettsim/assemble_catala.sh

      # venv312 nach docs/setup.md: GETTSIM braucht Python 3.12.
      # bcrypt/PyJWT: seit tests/conftest.py `import server` (f0e1c71, 2026-08-10) zieht
      # jede Collection unter tests/ den vollen server->auth-Importpfad, unabhaengig vom
      # Testinhalt. Fehlen sie in diesem isolierten venv312, schlaegt schon die Collection
      # von test_gettsim_crosscheck.py fehl (ModuleNotFoundError), nicht erst ein Test.
      - name: venv312 mit GETTSIM
        run: |
          set -e
          pip install uv
          uv venv oracle/.venv312 --python 3.12
          uv pip install --python oracle/.venv312/bin/python \
            -r requirements-oracle.txt

      - name: gettsim-crosscheck (Report + Gate)
        run: |
          set -e
          eval $(opam env --switch=taxgraph --set-switch)
          . oracle/.venv312/bin/activate
          python oracle/gettsim/golden_crosscheck.py
          python -m pytest tests/test_gettsim_crosscheck.py -q
