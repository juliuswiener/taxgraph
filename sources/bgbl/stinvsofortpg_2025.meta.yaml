  hinweis: "AMTLICHE Quelle (recht.bund.de, kein Mirror noetig). Deckt: (1) B2-Kohorte Kfz-BLP
    70 000 -> 100 000 Euro (§6 Abs1 Nr4 S2 Nr3 + S3 Nr3), Anschaffung nach 30.06.2025;
