  hinweis: "buzer.de-Mirror des BGBl-Aenderungstextes. Belegt die VZ-2024-ALTFASSUNG von
    § 10 Abs 1 Nr 5 (Aenderungsbefehl: 'zwei Drittel' -> '80 Prozent', '4.000 Euro' ->
    '4.800 Euro'; wirksam ab VZ 2025) => Altfassung VZ 2024 = zwei Drittel / 4.000 Euro,
    sonst wortgleich. Grundlage fuer Regel-Version p10_1_5_kinderbetreuung_vz2024 (M5
    Stufe 4). Gemischte Anfuehrungszeichen wie wtchanceng-Freeze - Anker exakt."
  erwartete_anker:
    - "In Absatz 1 Nummer 5 werden die Wörter „zwei Drittel\" durch die Angabe „80 Prozent\" ersetzt und wird die Angabe „4.000 Euro\" durch die Angabe „4.800 Euro\" ersetzt"
