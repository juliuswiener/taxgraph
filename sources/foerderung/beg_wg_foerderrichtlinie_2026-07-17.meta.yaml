  hinweis: >
    Ergaenzende Richtlinie zur BEG EM (siehe beg_em_foerderrichtlinie_2026-07-17): regelt die
    Effizienzhaus-Sanierung (Gesamtgebaeude-Sanierungsfoerderung), NICHT die Einzelmassnahme
    Heizungstausch -- fuer den Foerderfinder-Anwendungsfall (Heizungsfoerderung) ist beg_em die
    einschlaegige Quelle, diese Datei dient nur zur Abgrenzung/Vollstaendigkeit. Gleiche
    BAnz-Fundstellen-Einschraenkung wie bei beg_em: Vorabfassung, Bundesanzeiger-Fundstelle
    im Dokument als Platzhalter ausgewiesen, nicht verifizierbar (Stand 2026-08-10).
    PDF via curl direkt von energiewechsel.de geladen, Text via pdftotext -layout extrahiert.
  erwartete_anker:
    - "Diese Förderrichtlinie ersetzt die Richtlinie für die Bundesförderung für effiziente Gebäude – Wohngebäude in der Fassung vom 9. Dezember 2022 (BAnz AT 30.12.2022 B2)."
  verwendet_in: ["BEG-Quellenbeschaffung 2026-08-10 (Team-Lead-Auftrag), Abgrenzung WG vs. EM"]
