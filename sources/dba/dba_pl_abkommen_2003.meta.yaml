  hinweis: "GRUNDABKOMMEN PL, einzige bilaterale Fassung im Fenster (Korpus: nur 2015-Verstaendigungsvereinbarung, kein Aenderungsprotokoll). LAYER-PROVENANCE: BGBl-Bildscan -> Spalten-Crop-OCR (tesseract-deu 300dpi, linke 52 % = deutsche Spalte; DK-Route). OCR-ARTEFAKT-CAVEAT (Kern-Anker S. 1318/1319 BILDVERIFIZIERT, links-seite-15/16): Spalten-Bleed-Einzelzeichen ('a','b','C)','d','si','P') am Zeilenende + '$'/' $&' statt 'Paragraph-Zeichen' in der AStG-Passage (Bild zeigt korrektes Zeichen) - Anker meiden diese Stellen. GUELTIGKEIT: einfassig VZ 2024-2026; MLI: PL NICHT in bmf_stand_dba_2026-I.2-Positivliste -> kein MLI-Overlay (Abwesenheits-Beleg TR-Muster). Methodenartikel Art. 24 Abs. 1: a Freistellung (vorbehaltlich b) + Schachtel 10 % + WIRTSCHAFTSZONEN-RUECKAUSNAHME (Gesetz v. 20.10.1994, PL-Spezifikum!), b Anrechnung Enum aa/bb, c Aktivitaetsklausel (Paragraph 8 Abs. 1 Nr. 1-6 + Abs. 2 AStG), d Progressionsvorbehalt. Anker nur deutsche OCR-Spalte, Silbentrennungs-Hyphene exakt wie OCR."
  erwartete_anker:
    - "Methoden zur Vermeidung der Doppelbesteuerung"
    - "werden vorbehaltlich des Buchstabens b die Einkünfte aus der Republik Polen sowie die in der Republik Polen gele- genen Vermögenswerte ausgenommen, die nach diesem Abkommen in der Republik Polen besteuert werden kön- nen"
    - "deren Kapital zu mindestens 10 vom Hundert unmittel- bar der deutschen Gesellschaft gehört"
    - "Anspruch auf die Steuervergünstigung nach dem Gesetz vom 20. Oktober 1994 über die besonderen Wirtschafts- zonen in der Republik Polen hat"
    - "Beachtung der Vorschriften des deutschen Steuerrechts über die Anrechnung ausländischer Steuern die polnische Steuer angerechnet"
    - "Einkünfte, die nach Artikel 11 Absatz 2, Artikel 12 Absatz 2, Artikel 13 Absatz 2, Artikel 15 Absatz 3, Arti- kel 16 Absatz 1 und Artikel 17 in der Republik Polen besteuert werden können"
    - "Statt der Bestimmungen des Buchstabens a sind die"
    - "nach diesem Abkommen von der deutschen Besteuerung ausgenommenen Einkünfte und Vermögenswerte bei der Festsetzung des Steuersatzes für andere Einkünfte und Vermögenswerte zu berücksichtigen"
