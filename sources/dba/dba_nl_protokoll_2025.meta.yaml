  hinweis: "ZWEITE NL-Quelle (VZ-2026-OVERLAY auf die noch zu freezende Fassung 2012 i.d.F.
    Protokolle 2016+2021 - direkte Parallele zum CH-2025-Protokoll-Muster): Anwendungsregel
    Art. VII Abs. 2 = in Kraft am letzten Tag des Folgemonats nach Ratifikationsaustausch
    (28.11.2025 -> 31.12.2025), anzuwenden ab 01.01. des Folgejahres = VZ 2026. VZ 2024/2025
    rechnen nach der 2021er-Fassung OHNE dieses Protokoll. Fuegt u.a. Art. 14 Abs. 1a ein
    (34-Tage-Bagatell 'an weniger als 35 Arbeitstagen im Kalenderjahr' - NL hatte vorher KEINE
    Bagatellregel) + Anpassungen oeff. Dienst/REIT/OGA. ACHTUNG Anker: Text ist ZWEISPRACHIG
    (deutsche und niederlaendische Spalten interleaved nach pdftotext ohne -layout) - Anker nur
    aus deutschen Passagen ziehen und Eindeutigkeit gegen NL-Spalten-Fragmente testen.
    Konsolidierte Neubekanntmachung 11.05.2026 (Sekundaerangabe dev-1) beim Katalog-Bau primaer
    verifizieren. dev-1-Recherche e0915d5, Instructor-BGBl-Verifikation 2026-07-16."
  erwartete_anker:
    - "an weniger als 35 Arbeitstagen im Kalenderjahr ganz oder teilweise im erstgenannten"
    - "Dieses Änderungsprotokoll tritt am letzten Tag des Monats"
