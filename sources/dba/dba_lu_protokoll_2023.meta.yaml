  hinweis: "ZWEITE LU-Quelle (Overlay auf das noch zu freezende Grundabkommen 2012, BGBl 2012 II
    S. 1402): Protokoll fuegt u.a. Art. 14 Abs. 1a ein (34-Tage-Bagatell, Wortlaut 'weniger als
    35 Arbeitstagen im Kalenderjahr', haelt Besteuerung beim Taetigkeitsstaat; analog oeff.
    Dienst Art. 18) und aendert Art. 22 Abs. 1 (Methodenartikel: Buchst. a neu gefasst, neuer
    Buchst. e eingefuegt, alt-e wird f) + Abs. 2. Einfassig fuer VZ 2024-2026 (kein VZ-Split;
    Anwendung ab 01.01.2024 durchgehend). Vorlaeufer der Bagatell-Regel: 19-Tage-
    Verstaendigungsvereinbarung 26.05.2011 (BStBl 2011 I S. 576), seit Protokoll rechtssicher
    im Abkommen. Konsultationsvereinbarung zur 34-Tage-Auslegung: BMF 11.01.2024 (BStBl 2024
    I S. 201). Deutschsprachiger Vertragstext (einspaltig, pdftotext ohne -layout); Anker
    voll-Laenge via _normalize. dev-1-Recherche e0915d5, Instructor-BGBl-Verifikation 2026-07-16."
  erwartete_anker:
    - "Nach Artikel 22 Absatz 1 Buchstabe d des Abkommens wird folgender Buchstabe e eingefügt"
    - "weniger als 35 Arbeitstagen im Kalenderjahr jeweils ganz oder teilweise im erstgenannten Staat"
  verwendet_in: ["Paket 3 DBA-Katalog LU (Overlay-Quelle fuer die effektive VZ-2024-26-Fassung)"]
