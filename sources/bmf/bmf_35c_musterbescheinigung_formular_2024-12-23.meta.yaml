  hinweis: >
    Standalone-Publikation der Anlage 1 (identischer Formular-Text wie eingebettet in
    bmf_35c_musterbescheinigung_2024-12-23, dort Zeilen 249-536), separat vom BMF als
    eigene PDF-Datei bereitgestellt. Enthaelt die vollstaendige Massnahmen-Checkliste
    (Waermedaemmung, Fenster, Heizungsanlagen inkl. Solarkollektor/Biomasse/Waermepumpe/
    Brennstoffzelle/Gebaeudenetz) mit Verweisen auf die jeweiligen Anlagen der ESanMV
    (Anlage 6.1-6.7 fuer Heizungsanlagen). Fuer den Foerderfinder relevant als
    Referenz-Katalog der ueber § 35c EStG bescheinigungsfaehigen Massnahmen-Kategorien,
    unabhaengig von den BEG-Foerdersaetzen. PDF via curl direkt vom BMF geladen,
    pdftotext -layout, unbereinigt.
  erwartete_anker:
    - "Bescheinigung energetischer Maßnahmen nach § 35c Einkommensteuergesetz"
    - "Elektrisch angetriebene Wärmepumpe (WP)"
    - "Diese Bescheinigung beruht auf dem Muster des BMF-Schreibens vom 23. Dezem- ber 2024."
  verwendet_in: ["Foerderfinder BEG-Heizungsfoerderung / § 35c Nachweis-Kette (nachrangig, optional)"]
