# Unterhaltsabzug § 33a Abs. 1 EStG: Hoechstbetrag + Anrechnungsfreibetrag.
# Veranlagungszeitraum 2026. Der Hoechstbetrag ist per Gesetz an den Grundfreibetrag
# (§ 32a Abs. 1 S. 2 Nr. 1 EStG) gekoppelt; VZ 2026 = 12.348 Euro (identisch mit
# params/2026/einkommensteuertarif_p32a.yaml -> grundfreibetrag, dort die primaere
# Quelle; auch im Regelwerk p33a_unterhalt gebunden). Anrechnungsfreibetrag 624 Euro.
#
# Gueltigkeit/Fassungsstand: Hoechstbetrag = GFB i.d.F. Art. 2 G. v. 30.12.2024
# BGBl. 2024 Nr. 449 (SteFeG, ab VZ 2026). Anrechnungsfreibetrag 624 Euro
# fassungskonstant (§ 33a Abs. 1 S. 5 EStG).

parameter: unterhalt_hoechstbetrag
veranlagungszeitraum: 2026
authority: gesetz
redistributable: true
gueltig_ab: "2026-01-01"

hoechstbetrag:
  wert: 12348
  einheit: euro
  veranlagungszeitraum: 2026
  rechtsquelle: {gesetz: EStG, paragraph: "33a", absatz: "1", satz: "1"}
  datenquelle: "§ 33a Abs. 1 S. 1 EStG (Hoechstbetrag = Grundfreibetrag nach § 32a Abs. 1 S. 2 Nr. 1); VZ-2026-GFB 12.348 Euro aus BGBl. 2024 Nr. 449 (SteFeG), deckungsgleich mit params/2026/einkommensteuertarif_p32a.yaml; Stand 2026-07-15"

anrechnungsfreibetrag_eigene_einkuenfte:
  wert: 624
  einheit: euro
  veranlagungszeitraum: 2026
  rechtsquelle: {gesetz: EStG, paragraph: "33a", absatz: "1", satz: "5"}
  datenquelle: "§ 33a Abs. 1 S. 5 EStG (anrechnungsfreier Betrag eigener Einkuenfte und Bezuege); fassungskonstant 624 Euro; Stand 2026-07-15"
