zone5_faktor: {wert: 0.45, veranlagungszeitraum: 2026, rechtsquelle: {gesetz: EStG, paragraph: "32a", absatz: "1", satz: "2 Nr. 5"}, datenquelle: "gesetze-im-internet.de, abgerufen 2026-07-09"}
