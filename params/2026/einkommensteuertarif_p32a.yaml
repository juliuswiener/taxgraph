zone3_b3: {wert: 2397,   veranlagungszeitraum: 2026, rechtsquelle: {gesetz: EStG, paragraph: "32a", absatz: "1", satz: "2 Nr. 3"}, datenquelle: "gesetze-im-internet.de, abgerufen 2026-07-09"}
