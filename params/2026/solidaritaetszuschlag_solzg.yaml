  rechtsquelle: {gesetz: SolzG 1995, paragraph: "4", satz: "1"}
  datenquelle: "§ 4 S. 1 SolzG 1995 (5,5 %); fassungskonstant; Stand 2026-07-15"

milderungssatz:
  wert: 11.9
