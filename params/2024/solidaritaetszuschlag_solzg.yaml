# Solidaritaetszuschlag: Freigrenzen + Saetze nach § 3 Abs. 3, § 4 SolzG 1995.
# Veranlagungszeitraum 2024. Freigrenze (Beginn der Milderungszone) 18.130 Euro
# (Einzel) bzw. 36.260 Euro (Splitting = das Doppelte). Gegengeprueft mit
# GETTSIM 1.2.1 (Prueinstanz).
#
# Nur die Freigrenze driftet per VZ; Zuschlagssatz (5,5 %) und Milderungssatz
# (11,9 %) sind fassungskonstant.
#
# Gueltigkeit/Fassungsstand: § 3 Abs. 3 SolzG 1995 i.d.F. Art. 5 G. v. 08.12.2022
# BGBl. I S. 2230 (Inflationsausgleichsgesetz; Freigrenze 18.130 fuer VZ 2024).
# Anstehende Aenderung: ab VZ 2025 19.950/39.900, ab VZ 2026 20.350/40.700
# (SteFeG, BGBl. 2024 Nr. 449) -> params/2025, params/2026.

