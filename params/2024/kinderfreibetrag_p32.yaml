# Kinderfreibetrag + BEA-Freibetrag nach § 32 Abs. 6 EStG (je Elternteil).
# Veranlagungszeitraum 2024. Werte aus der fuer VZ 2024 geltenden Endfassung;
# der saechliche Kinderfreibetrag wurde rueckwirkend angehoben (11.604 -> 11.784
# GFB-Logik; KFB 3.192 -> 3.306) durch das Gesetz zur steuerlichen Freistellung
# des Existenzminimums 2024. Gegengeprueft mit GETTSIM 1.2.1 (Prueinstanz).
#
# Gueltigkeit/Fassungsstand: § 32 Abs. 6 EStG i.d.F. Art. 1 G. v. 05.12.2024
# BGBl. 2024 I Nr. 386 (Endfassung VZ 2024). BEA-Freibetrag (1.464) seit VZ 2021
# unveraendert. Anstehende Aenderung: ab VZ 2025 KFB 3.336, ab VZ 2026 KFB 3.414
# (SteFeG, BGBl. 2024 Nr. 449) -> params/2025, params/2026.

parameter: kinderfreibetrag
veranlagungszeitraum: 2024
authority: gesetz
redistributable: true
gueltig_ab: "2024-01-01"

kinderfreibetrag_je_elternteil:
  wert: 3306
  einheit: euro
  veranlagungszeitraum: 2024
  rechtsquelle: {gesetz: EStG, paragraph: "32", absatz: "6", satz: "1"}
  datenquelle: "§ 32 Abs. 6 S. 1 EStG i.d.F. Art. 1 G. v. 05.12.2024 BGBl. 2024 I Nr. 386 (saechliches Existenzminimum); Wert bestaetigt durch GETTSIM 1.2.1 (germany/einkommensteuer/kinderfreibetrag.yaml, Eintrag 2024-01-01) als Prueinstanz; Stand 2026-07-15"

bea_freibetrag_je_elternteil:
  wert: 1464
  einheit: euro
  veranlagungszeitraum: 2024
  rechtsquelle: {gesetz: EStG, paragraph: "32", absatz: "6", satz: "1"}
  datenquelle: "§ 32 Abs. 6 S. 1 EStG (Betreuungs-, Erziehungs- oder Ausbildungsbedarf); seit VZ 2021 unveraendert 1.464 Euro je Elternteil; Stand 2026-07-15"
