# Steuerermäßigung für Zuwendungen an politische Parteien nach § 34g Satz 1 Nr. 1 und Satz 2 EStG (Abweichung Nr. 31 in
# rust/fixtures/README.md). Veranlagungszeitraum 2024.
# Wortlaut Satz 2 in der Fassung dieses Jahres: "Die Ermäßigung beträgt 50 Prozent der Ausgaben, höchstens jeweils 825 Euro
# für Ausgaben nach den Nummern 1 und 2, im Fall der Zusammenveranlagung von Ehegatten höchstens jeweils 1 650 Euro."
# Quelle: sources/gesetze-im-internet/estg_p34g_2024-12-18.txt. Archivkopie der amtlichen Seite vom 2024-12-18; wortgleich mit der Kopie vom 2025-12-18 (gemessen am 2026-10-07).
# Die Zahlen stammen aus diesem Wortlaut, nicht aus der Anleitung zum Vordruck und nicht aus dem Gedächtnis
# (Vault: decisions/parteispenden-deckel-kommt-je-jahr-aus-der-eingefrorenen-fassung). Dass die Datei den Wortlaut wiedergibt,
# prüft rust/bindung/tests/parteispenden_werte_gegen_gesetz.rs bei jedem Lauf gegen den Text.
# Der Deckel gilt je Nummer (Parteien, Wählervereinigungen) für sich. Gebaut ist nur Nummer 1 (Parteien, Zeile 7 der Anlage
# Sonderausgaben); der Teil einer Spende über dem Deckel wirkt nach § 10b Abs. 2 EStG als Sonderausgabe und ist NICHT gebaut.

