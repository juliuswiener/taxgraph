# Steuerermäßigung für Zuwendungen an politische Parteien nach § 34g Satz 1 Nr. 1 und Satz 2 EStG (Abweichung Nr. 31 in
# rust/fixtures/README.md). Veranlagungszeitraum 2025.
# Wortlaut Satz 2 in der Fassung dieses Jahres: "Die Ermäßigung beträgt 50 Prozent der Ausgaben, höchstens jeweils 825 Euro
# für Ausgaben nach den Nummern 1 und 2, im Fall der Zusammenveranlagung von Ehegatten höchstens jeweils 1 650 Euro."
# Quelle: sources/gesetze-im-internet/estg_p34g_2025-12-18.txt. Fassung bis 31.12.2025 (Archivkopie der amtlichen Seite vom 2025-12-18).
# Die Zahlen stammen aus diesem Wortlaut, nicht aus der Anleitung zum Vordruck und nicht aus dem Gedächtnis
# (Vault: decisions/parteispenden-deckel-kommt-je-jahr-aus-der-eingefrorenen-fassung). Dass die Datei den Wortlaut wiedergibt,
# prüft rust/bindung/tests/parteispenden_werte_gegen_gesetz.rs bei jedem Lauf gegen den Text.
# Der Deckel gilt je Nummer (Parteien, Wählervereinigungen) für sich. Gebaut ist Nummer 1 (Parteien, Zeile 7 der Anlage
# Sonderausgaben) samt dem Teil einer Spende über der Basis der Ermäßigung, der nach § 10b Abs. 2 EStG als Sonderausgabe wirkt
# (Abweichung Nr. 43). Nicht gebaut sind Nummer 2 (Wählervereinigungen) und die Ausschlussklausel (Partei von der staatlichen
# Teilfinanzierung ausgeschlossen).
# Sonderausgaben-Deckel: § 10b Abs. 2 Satz 1 EStG, Wortlaut "bis zur Höhe von insgesamt 1.650 Euro und im Fall(e) der
# Zusammenveranlagung von Ehegatten bis zur Höhe von insgesamt 3.300 Euro im Kalenderjahr abzugsfähig". Quelle:
# sources/gesetze-im-internet/estg_p10b_ab-2020-01-01.txt. Fassung ab 2020-01-01 (Wortlaut von Julius am 2026-10-08 eingefügt, Herkunftsseite nicht genannt). Dass sie für dieses
# Jahr gilt, ist abgeleitet (derived): bis zur Änderung zum 1.1.2026 nennt keine Quelle im Korpus eine andere Fassung.
# Basis der Ermäßigung = Höchstbetrag der Ermäßigung / Satz; nur der Teil der Spende darüber ist Sonderausgabe (Satz 2: "nur
# insoweit ..., als für sie nicht eine Steuerermäßigung nach § 34g gewährt worden ist"). Dass die Lesart "zusätzlich" gilt, sagt die
# Anleitung zur Anlage Sonderausgaben 2025 (sources/bfinv/anleitungen/anl_sonderausgaben_2025.txt:56-58); Julius lässt sie als
# Beleg gelten (Vault: decisions/antworten-auf-die-entscheidungsvorlage-2026-10-08).

