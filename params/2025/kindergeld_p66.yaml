# Kindergeld (Monatsbetrag je Kind) nach § 66 Abs. 1 EStG.
# Veranlagungszeitraum 2025. 255 Euro je Kind und Monat durch das
# Steuerfortentwicklungsgesetz (SteFeG). Gegengeprueft mit GETTSIM 1.2.1.
#
# Hinweis: Kindergeld ist im Regelwerk INPUT der Guenstigerpruefung
# (p31_familienleistungsausgleich), keine im auszug gebundene Konstante. Diese
# Datei stellt den kanonischen Jahreswert fuer die Integrationsschicht bereit.
#
# Gueltigkeit/Fassungsstand: § 66 Abs. 1 EStG i.d.F. Art. 5 G. v. 30.12.2024
# BGBl. 2024 Nr. 449 (SteFeG). Anstehende Aenderung: ab VZ 2026 259 Euro
# (Art. 6 SteFeG) -> params/2026.

parameter: kindergeld
veranlagungszeitraum: 2025
authority: gesetz
redistributable: true
gueltig_ab: "2025-01-01"

kindergeld_monatlich_je_kind:
  wert: 255
  einheit: euro
  veranlagungszeitraum: 2025
  rechtsquelle: {gesetz: EStG, paragraph: "66", absatz: "1", satz: "1"}
  datenquelle: "§ 66 Abs. 1 S. 1 EStG i.d.F. Art. 5 G. v. 30.12.2024 BGBl. 2024 Nr. 449 (SteFeG); Wert bestaetigt durch GETTSIM 1.2.1 (germany/kindergeld/kindergeld.yaml, satz, Eintrag 2025-01-01) als Prueinstanz; Stand 2026-07-15"
