# § 33 Abs. 2a EStG — Behinderungsbedingte Fahrtkostenpauschale. VZ 2025.
# S.3: 900 EUR bei GdB >= 80 ODER GdB >= 70 + Merkzeichen G.
# S.4: 4.500 EUR bei aG / Bl / TBl / H (Pflegegrad 4-5 explizit nicht im Wortlaut,
# aber die amtliche Anleitung Anlage Kind 2025 fasst sie mit aG/Bl/TBl/H zusammen).
# S.5: 4.500 schließt 900 aus (nicht additiv).
parameter: fahrtkostenpauschale_p33_2a
veranlagungszeitraum: 2025
authority: gesetz
redistributable: true
gueltig_ab: "2025-01-01"

# Satz 3 — 900 EUR für GdB >= 80 oder GdB >= 70 + Merkzeichen G.
pauschale_900: 900
