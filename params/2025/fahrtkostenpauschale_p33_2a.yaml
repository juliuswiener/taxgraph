  rechtsquelle: {gesetz: EStG, paragraph: '33', absatz: '2a', satz: '3'}
  zitatanker: "Bei Erfüllung der Anspruchsvoraussetzungen nach Satz 2 Nummer 1 beträgt die Pauschale 900 Euro"
  datei: "sources/gesetze-im-internet/estg_p33_2026-07-11.txt"

# Satz 4 — 4.500 EUR für aG / Bl / TBl / H.
pauschale_4500: 4500
