id: rentner_ehegatte_behinderung_2025_zusammen
beschreibung: "Rentner-Ehepaar § 22 + § 33b Ehegatte, Zusammenveranlagung: beide gesetzliche Rente Erstjahr (je einkuenfte_sonstige 14928, Summe 29856) + Behinderten-Pauschbetrag des Partners GdB 60 = 1440 (aussergewoehnliche_belastungen). Splittingtarif VZ 2025 → festzusetzende ESt 660. Der Fall, in dem der partner_check-Guard live durchlässt (Partner-Behinderung MIT Zusammenveranlagung = korrekt, kein Widerspruch)."

