id: gesamt_2025_einzel_24a_agb_gde_zwilling
beschreibung: "Engine-Komposition §24a-GdE-Zwilling: Senior § 19 35000 + § 21 15000 (SdE 50000), Altersentlastungsbetrag 665 (geburtsjahr 1958, Kohorte) mindert GdE auf 49335 -> § 33 agB 5000 minus zumutbare Belastung AUF DER GEMINDERTEN GdE (zumutbar 2806 statt 2846 ohne §24a) = 2193 -> Einkommen 47106 -> Grundtarif 9679. Beweist: §24a senkt GdE, das senkt die §33-zumutbar (GdE-Zwilling), höherer agB-Abzug. VZ 2025"

