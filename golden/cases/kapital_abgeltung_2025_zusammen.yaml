id: kapital_abgeltung_2025_zusammen
beschreibung: "§ 32d Abs. 1/3 Abgeltungsteuer bei Zusammenveranlagung: Ehepaar mit § 19-Einkünften 80000 (einkuenfte_nichtselbststaendig DIREKT auf Einkünfte-Ebene, NICHT Bruttolohn — Full-Pipeline wäre höherer Brutto nach § 9a je Person). Kapitalerträge mit gesonderter 25-%-Abgeltungsteuer 2500 (= 25 % auf 10000 = Kapitalerträge 12000 minus GEMEINSAMER Sparer-Pauschbetrag 2000, § 20 Abs. 9 S. 2). Prüft, dass catala_gesamt im Zusammenveranlagungs-Tarif (Splitting) die gesonderte Kapitalsteuer korrekt zur tariflichen ESt addiert (§ 32d Abs. 3 S. 2). Ergänzt den einzel-Fall um den 2000-Euro-Sparer-PB-Zweig + Splitting-Tarif. Testet die catala_gesamt-Integration accessor-unabhängig."

