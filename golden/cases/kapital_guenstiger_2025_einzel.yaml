id: kapital_guenstiger_2025_einzel
beschreibung: "§ 32d Abs. 6 Günstigerprüfung: geringes Einkommen (§ 19 Einkünfte 12000) plus tariflich hinzugerechnete Kapitaleinkünfte 5000. Weil der tarifliche Zuwachs (902) niedriger ist als die 25-%-Abgeltung-Alternative (25 % auf 4000 = 1000), wählt der Accessor (dev-1) den Günstiger-Pfad: die Kapitaleinkünfte laufen als einkuenfte_kapitalvermoegen in den Grundtarif (statt gesonderter Abgeltung). Prüft, dass catala_gesamt die tariflich hinzugerechneten Kapitaleinkünfte korrekt in die festzusetzende ESt einbezieht (§ 32d Abs. 6 Günstigerprüfung)."

