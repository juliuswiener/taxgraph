beschreibung: "NEGATIV-GOLDEN § 24-Freibetrag-Ausschluss: kleine KapGes, Einkommen 10.000. § 24 S.1 gewährt Körperschaften 5.000-Freibetrag, ABER S.2 Nr.1 schließt Kapitalgesellschaften AUS (deren Leistungen = § 20 Abs.1 Nr.1 EStG). Daher zvE = 10.000 (NICHT 10.000-5.000=5.000!); KSt 1.500 (NICHT 750), SolZ 82,50, GewSt 1.400; Nenner B = 2.982,50. Ein still angewandter Freibetrag würde KSt auf 750 senken = Testbruch."

