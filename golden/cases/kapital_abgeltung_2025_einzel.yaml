id: kapital_abgeltung_2025_einzel
beschreibung: "§ 32d Abs. 1/3 Abgeltungsteuer-Integration: Arbeitnehmer mit Einkünften aus § 19 in Höhe von 60000 (einkuenfte_nichtselbststaendig wird hier DIREKT auf Einkünfte-Ebene gesetzt = Bruttolohn ~61230 nach Abzug des Arbeitnehmer-Pauschbetrags § 9a; NICHT Bruttolohn 60000 — das ist die Full-Pipeline-Variante, siehe Layer-II-Draft K4=16174). Kapitalerträge mit gesonderter 25-%-Abgeltungsteuer 2250 (= 25 % auf 9000 = Kapitalerträge 10000 minus Sparer-Pauschbetrag 1000, § 20 Abs. 9). Prüft, dass catala_gesamt die gesonderte Kapitalsteuer (steuer_kapital_gesondert) zur tariflichen ESt ADDIERT (§ 32d Abs. 3 S. 2). Die Günstigerprüfung greift NICHT (Grenzsteuersatz auf 9000 ~ 3651 > 2250 Abgeltung). Der gesonderte Steuerbetrag käme aus dem § 32d-Accessor (dev-1); dieser Golden testet die catala_gesamt-Integration accessor-unabhängig."

