id: kst_nenner_b_p7_g2_freigrenze_auf_fallbeil
beschreibung: "Paket 7 / § 4h-Freigrenze ERREICHT + 30-%-Deckel bindet (FALLBEIL): gewinn_estg 5.000.000, Zinsaufwand 3.000.000 (Nettozins = 3 Mio, NICHT < 3 Mio) -> voller Mechanismus. ebitda_basis 8.000.000, verr. EBITDA 2.400.000 = Deckel; nichtabziehbar = 3.000.000 - 2.400.000 = 600.000 Add-back -> Slot 5.600.000 = zvE; KSt 840.000, SolZ 46.200, GewSt 784.000; Nenner B = 1.670.200,00. FALLBEIL: gegenueber G1 (Zins 2.999.999) steigt der Nenner B um 178.950,00 fuer 1 EUR mehr Zinsaufwand — die Freigrenze ist KEIN Freibetrag (alles-oder-nichts)."

