id: kst_nenner_b_c4_spenden_nicht_gewst
beschreibung: "PFLICHT-LEHR-GOLDEN: Spenden mindern zvE/KSt, NICHT den Gewerbeertrag. Einkommen_vor_spenden 2.000.000; §9-Höchstbetrag = max(20% von 2.000.000=400.000; 4 Promille von (500.000+300.000)=3.200) = 400.000; Spendenabzug = min(300.000, 400.000) = 300.000 -> zvE 1.700.000; KSt 255.000, SolZ 14.025. ABER GewSt-Slot = einkommen_vor_spenden 2.000.000 (NICHT 1.700.000!) -> GewSt 280.000. BEWUSSTE DIVERGENZ zum Vollrecht: § 9 Nr. 5 GewStG (Spendenkürzung im Gewerbeertrag) = benannter Nachtrag, hier NICHT modelliert; ebenso § 8 Nr. 9 GewStG. Nenner B = 549.025,00."

