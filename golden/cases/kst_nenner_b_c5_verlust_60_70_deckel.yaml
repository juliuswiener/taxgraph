id: kst_nenner_b_c5_verlust_60_70_deckel
beschreibung: "PFLICHT 60/70-KONTRAST-GOLDEN: § 10d-Deckel bindet. GdE 6.000.000, Verlustbestand 5.000.000. Mit 70% (§ 10d EStG, KSt-Verweis § 8 Abs.1): Höchstbetrag = 1.000.000 + 70%*(6.000.000-1.000.000) = 4.500.000; Verlustabzug 4.500.000 -> zvE 1.500.000; KSt 225.000; Nenner B = 107.737.500 ct = 1.077.375,00. KONTROLLWERT mit 60% (§ 10a GewStG, HIER NICHT): Höchstbetrag = 4.000.000; zvE 2.000.000; KSt 300.000; nenner_b = 115.650.000 ct = 1.156.500,00. GewSt (840.000) bewegt sich im Kontrast NICHT (Slot = einkommen_vor_spenden 6.000.000, verlust-unabhängig). 70 != 60 empirisch verankert."

