id: gesamt_2026_einzel_ermaessigung_floor
beschreibung: "Floor § 35a (nicht erstattungsfähig): § 19 20000 -> positive tarifliche ESt, aber steuerermaessigungen 50000 (weit über der Steuer) -> festzusetzende_est auf 0 gefloort, NICHT negativ (Anrechnungsüberhang verfällt). Ohne Floor ergäbe die ungefloorte Subtraktion einen negativen Bescheid. VZ 2026"

