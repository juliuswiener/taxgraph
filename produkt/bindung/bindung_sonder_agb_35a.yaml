# Bindungstabelle — Scheiben-Ausbau: Sonderausgaben/KiSt + agB §33 + §35a (Task #11).
# Validiert gegen schema.json (kein neues Schema). Quelle Kz: 2026-07-12-kz-kandidaten-weitere-anlagen.
# Signaturen/Bedingungen: pipeline/produktion/rules.yaml (signature/geltungsbedingungen).
version: 1
scheibe: "Sonderausgaben/KiSt (p10_1_4/p10_1_7) + agB §33 (p33_1_2) + §35a (p35a_2_3)"

bindungen:
  # ========================= Sonderausgaben — KiSt (p10_1_4_kirchensteuer) =========================
  - feld_id: kist_gezahlt
    quelle: {regel_id: p10_1_4_kirchensteuer, signatur_slot: gezahlte_kirchensteuer}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel Kirchensteuer hast du dieses Jahr gezahlt?"
    hilfe_kurz: "Steht auf deiner Lohnsteuerbescheinigung oder deinem Steuerbescheid."
    beispielwert: 60000
    herkunft_slots: null
    # E10/SA/KiSt/Gezahlt/Sum — Summen-Kz. Der Einzelposten (E0108004 + Art E0108003) liegt
    # unter Gezahlt/Einz; unser Feld ist die Jahressumme, also das Sum-Kz. Belegt 2026-08-05.
    elster_kz: E0107601
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 4 EStG"
      zitatanker: "gezahlte Kirchensteuer"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kist_erstattet
    quelle: {regel_id: p10_1_4_kirchensteuer, signatur_slot: erstattete_kirchensteuer}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wurde dir dieses Jahr Kirchensteuer erstattet (zurückgezahlt)? Wenn ja, wie viel?"
    hilfe_kurz: "Erstattete Kirchensteuer mindert, was du absetzen kannst. Wenn nichts, gib 0 ein."
    beispielwert: 0
    herkunft_slots: null
    # E10/SA/KiSt/Erstattet — eigener Zweig neben Gezahlt, kein Sum/Einz-Paar. Belegt 2026-08-05.
    elster_kz: E0107602
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 4b Satz 2 EStG"
      zitatanker: "erstatteten Aufwendungen"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

  # ========================= Sonderausgaben — Berufsausbildung (p10_1_7) =========================
  - feld_id: berufsausbildung_aufwendungen
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p10_1_7_berufsausbildung, signatur_slot: aufwendungen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Was hast du dieses Jahr für deine eigene erste Berufsausbildung oder ein Erststudium bezahlt?"
    hilfe_kurz: "Zum Beispiel Studiengebühren, Fachbücher, Fahrten. Bis 6.000 Euro im Jahr."
    beispielwert: 200000
    herkunft_slots: null
    # E10/SA/AW_eig_BAusb/Sum — Summen-Kz. Einzelposten liegen unter Einz (E0108002 Betrag +
    # E0108201 Bezeichnung); unser Feld ist die Jahressumme. xs:documentation ist nur
    # "Höhe der Aufwendungen" — der Kontext steckt im Element-Pfad. Belegt 2026-08-05.
    elster_kz: E0108202
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 7 EStG"
      zitatanker: "bis zu 6 000 Euro im Kalenderjahr"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

  # ========================= agB §33 (p33_1_2_agb_abzug) =========================
  - feld_id: agb_aufwendungen
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p33_1_2_agb_abzug, signatur_slot: aussergewoehnliche_belastungen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hattest du dieses Jahr größere außergewöhnliche Ausgaben, die du zwangsläufig tragen musstest (zum Beispiel Krankheitskosten)? Wenn ja, wie viel insgesamt?"
    hilfe_kurz: "Nach Abzug von Erstattungen (z. B. Krankenkasse). Ein zumutbarer Eigenanteil wird automatisch abgezogen."
    beispielwert: 300000
    herkunft_slots: null
    elster_kz: E0161804
    elster_kz_grund: "AgB/And_Aufw hat 3 Unterbuckets (Pflege E0161404/Beh_Aufw E0161504/Sonst E0161804); Fragetext ist generisch ('größere außergewöhnliche Ausgaben ... z.B. Krankheitskosten') und passt strukturell am ehesten auf den Sonst-Catch-all. Lead-Adjudikation (reports/review/2026-07-20-xsd-kz-section-sweep-findings.md Cluster A); Pflege/Beh_Aufw bleiben außerhalb des Feld-Katalogs (kein stiller Drop, Transparenz-Notiz)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33 Abs. 2 S. 1 EStG"
      zitatanker: "den Umständen nach notwendig sind und einen angemessenen Betrag nicht übersteigen"
      datei: "sources/gesetze-im-internet/estg_p33_2026-07-11.txt"
  # § 33b Abs. 5 S. 4: Wird der Behinderten-Pauschbetrag eines Kindes auf den
  # Steuerpflichtigen uebertragen, sind genau die Aufwendungen, die der Pauschbetrag
  # abgilt, nicht zusaetzlich als agB nach § 33 abziehbar. agb_aufwendungen ist nicht
  # nach Aufwandsart getrennt — deshalb dieses Feld: der behinderungsbedingte Anteil,
  # den der Ring bei Uebertragung herausrechnet. Fallweit wie agb_aufwendungen selbst
  # (die Uebertragung ist per Kind, die Aufwendungen sind die des Steuerpflichtigen).
  #
  # Gebunden als geltungsbedingung, NICHT an den agb-Slot. Grund: das Feld ist ein
  # Subtrahend, und slot_beitrag kennt nur exakt|summand. Als zweiter "summand" am
  # selben Slot deklariert wuerde intervall.py:188 es ADDIEREN — Vorzeichenfehler in
  # der Unsicherheitsrechnung. Praezedenz: p9_4a_kuerzung_nach_entgelt, ebenfalls ein
  # cent-Kuerzungsfeld an einer geltungsbedingung.
  - feld_id: behinderungsbedingte_aufwendungen
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p33_1_2_agb_abzug, geltungsbedingung: kein_uebertragener_behinderten_pb_fuer_dieselben_aufwendungen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel der oben genannten außergewöhnlichen Ausgaben entfiel auf die Behinderung — also auf Hilfe bei den täglichen Verrichtungen, auf Pflege oder auf erhöhten Wäschebedarf?"
    hilfe_kurz: "Nur wenn du den Pauschbetrag eines Kindes auf dich überträgst. Diese Aufwendungen deckt der Pauschbetrag bereits ab, sie können nicht zusätzlich abgesetzt werden."
    beispielwert: 100000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Reines Rechenfeld fuer die Kuerzung nach § 33b Abs. 5 S. 4. Der Wert wird nicht uebermittelt, sondern von agb_aufwendungen abgezogen; ELSTER erhaelt in E0161804 den bereits bereinigten Betrag. Ein eigenes Kz gibt es dafuer im XSD nicht."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 5 S. 4 EStG"
      zitatanker: "In diesen Fällen besteht für Aufwendungen, für die der Behinderten-Pauschbetrag gilt, kein Anspruch auf eine Steuerermäßigung nach § 33"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"
  # § 33b Abs. 1 S. 1: wer wegen eigener Behinderung einen GdB-Pauschbetrag hat, kann ihn
  # nur ANSTELLE der agB-Ermaessigung fuer dieselben Aufwendungen geltend machen (S.2: nur
  # einheitlich ausuebbar), nicht zusaetzlich. Anders als Abs. 5 S. 4 (Kind-PB-Uebertragung,
  # oben) ist das ein WAHLRECHT — kein Automatismus, der Ring darf nicht selbst entscheiden.
  # Reine Ja/Nein-Frage, kein Betragsfeld; die Kuerzung nutzt weiterhin
  # behinderungsbedingte_aufwendungen (oben), nur die Bedingung dafuer ist eine andere.
  #
  # Gebunden als geltungsbedingung (neue Bedingung an derselben Regel p33_1_2_agb_abzug),
  # nicht an einen Slot — reine Tatbestands-Voraussetzung wie agb_zwangslaeufig.
  - feld_id: behinderungsbedingte_aufwendungen_wahlrecht_pb
    quelle: {regel_id: p33_1_2_agb_abzug, geltungsbedingung: eigener_pauschbetrag_wahlrecht_nicht_zusaetzlich_zur_agb}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Möchtest du für deine behinderungsbedingten Aufwendungen deinen Behinderten-Pauschbetrag nutzen, statt sie einzeln als außergewöhnliche Belastung abzusetzen?"
    hilfe_kurz: "Beides zusammen geht nicht (§ 33b Abs. 1 Satz 2): entweder der Pauschbetrag oder der Einzelnachweis für dieselben Aufwendungen. Nur relevant, wenn du selbst einen Grad-der-Behinderung-Pauschbetrag hast."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein), kein Betragsfeld — reines Rechenfeld wie behinderungsbedingte_aufwendungen (oben), kein Weg ins XSD."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 1 Satz 1 EStG"
      zitatanker: "anstelle einer Steuerermäßigung nach § 33 einen Pauschbetrag nach Absatz 3 geltend machen (Behinderten-Pauschbetrag)"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"
  # § 33b Abs. 1 S. 1 gilt PRO PERSON (Subjekt "Menschen mit Behinderungen", Anspruch nach
  # Abs. 2/3 individuell nach eigenem GdB) — bei Zusammenveranlagung braucht der Partner
  # dieselbe Wahlrecht/Sperrgrund-Mechanik wie Person A, unabhaengig von deren Entscheidung
  # (BACKLOG p33b-partner-pb-doppelabzug: Partner-PB lief bisher unconditional neben
  # agb_aufwendungen, 1.168-1.234 EUR stiller Doppelabzug). "Davon"-Teilmenge auf derselben
  # Achse (fallweit) wie agb_aufwendungen selbst, wie behinderungsbedingte_aufwendungen oben.
  - feld_id: behinderungsbedingte_aufwendungen_partner
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p33_1_2_agb_abzug, geltungsbedingung: eigener_pauschbetrag_wahlrecht_nicht_zusaetzlich_zur_agb_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel der außergewöhnlichen Ausgaben eures Haushalts entfiel auf die Behinderung deines Partners/deiner Partnerin — also auf Hilfe bei den täglichen Verrichtungen, auf Pflege oder auf erhöhten Wäschebedarf?"
    hilfe_kurz: "Nur relevant, wenn dein Partner/deine Partnerin einen eigenen Grad-der-Behinderung-Pauschbetrag hat. Diese Aufwendungen deckt der Pauschbetrag ab, sie können nicht zusätzlich abgesetzt werden."
    beispielwert: 100000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Reines Rechenfeld fuer die Kuerzung nach § 33b Abs. 1 S. 1/2 auf Partner-Seite, spiegelt behinderungsbedingte_aufwendungen. Kein eigenes Kz im XSD."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 1 Satz 1 EStG"
      zitatanker: "anstelle einer Steuerermäßigung nach § 33 einen Pauschbetrag nach Absatz 3 geltend machen (Behinderten-Pauschbetrag)"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"
  - feld_id: behinderungsbedingte_aufwendungen_wahlrecht_pb_partner
    quelle: {regel_id: p33_1_2_agb_abzug, geltungsbedingung: eigener_pauschbetrag_wahlrecht_nicht_zusaetzlich_zur_agb_partner}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Möchte dein Partner/deine Partnerin für die eigenen behinderungsbedingten Aufwendungen seinen/ihren Behinderten-Pauschbetrag nutzen, statt sie einzeln als außergewöhnliche Belastung abzusetzen?"
    hilfe_kurz: "Beides zusammen geht nicht (§ 33b Abs. 1 Satz 2): entweder der Pauschbetrag oder der Einzelnachweis für dieselben Aufwendungen. Nur relevant, wenn dein Partner/deine Partnerin einen eigenen GdB-Pauschbetrag hat. Unabhängig von deiner eigenen Wahl."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein), kein Betragsfeld — spiegelt behinderungsbedingte_aufwendungen_wahlrecht_pb, kein Weg ins XSD."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 1 Satz 1 EStG"
      zitatanker: "anstelle einer Steuerermäßigung nach § 33 einen Pauschbetrag nach Absatz 3 geltend machen (Behinderten-Pauschbetrag)"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"
  - feld_id: agb_zwangslaeufig
    quelle: {regel_id: p33_1_2_agb_abzug, geltungsbedingung: agb_ist_zwangslaeufig}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Konntest du diese Ausgaben nicht vermeiden (aus rechtlichen, tatsächlichen oder sittlichen Gründen)?"
    hilfe_kurz: "Zum Beispiel Krankheitskosten kannst du nicht einfach weglassen."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein), kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33 Abs. 2 S. 1 EStG"
      zitatanker: "aus rechtlichen, tatsächlichen oder sittlichen Gründen nicht entziehen"
      datei: "sources/gesetze-im-internet/estg_p33_2026-07-11.txt"
  - feld_id: agb_notwendig_angemessen
    quelle: {regel_id: p33_1_2_agb_abzug, geltungsbedingung: agb_notwendig_und_angemessen}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Waren die Ausgaben notwendig und der Höhe nach angemessen?"
    hilfe_kurz: "Übermäßig teure oder unnötige Ausgaben zählen nicht."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein), kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33 Abs. 2 S. 1 EStG"
      zitatanker: "den Umständen nach notwendig sind und einen angemessenen Betrag nicht übersteigen"
      datei: "sources/gesetze-im-internet/estg_p33_2026-07-11.txt"

