luecken:
  # -- KiSt: beide Geltungsbedingungen sind MVP-Annahmen (kein Laien-Gate) --
  - regel_id: p10_1_4_kirchensteuer
    geltungsbedingung: keine_zuschlagsteuer_kappung
    grund: "MVP-Annahme: KiSt ist nicht als Zuschlag zur Abgeltungsteuer gezahlt (AN ohne KapErtr); keine Laien-Abfrage in dieser Scheibe."
  - regel_id: p10_1_4_kirchensteuer
    geltungsbedingung: kein_erstattungsueberhang
    grund: "Erstattungsüberhang (erstattet > gezahlt) wird nach § 10 Abs. 4b hinzugerechnet — außerhalb Scope, Null-Boden im Output; keine eigene Abfrage."
  # -- Berufsausbildung --
  - regel_id: p10_1_7_berufsausbildung
    geltungsbedingung: hoechstbetrag_gilt_je_person
    grund: "Modellierungs-Annahme: der 6.000-Euro-Höchstbetrag gilt je Person (Ehegatten-Verdopplung), keine Laien-Abfrage."
  # -- agB: zumutbare Belastung ist berechnete Zwischengröße (p33_3), nicht deklariert --
  - regel_id: p33_1_2_agb_abzug
    signatur_slot: zumutbare_belastung
    grund: "Berechnete Größe = Output von p33_3_zumutbare_belastung (aus Gesamtbetrag der Einkünfte/Kinder/Splitting); die Regel rechnet sie, keine Laien-Abfrage."
  - regel_id: p33_1_2_agb_abzug
    geltungsbedingung: keine_ausgeschlossenen_aufwendungen
    grund: "Annahme: die Aufwendungen sind nicht schon als Werbungskosten/Betriebsausgaben/Sonderausgaben berücksichtigt (Dedup, andere Scheiben)."
  # -- Spende §10b: der Höchstbetrag-Deckel rechnet mit dem GdE, keine Laien-Abfrage --
  - regel_id: p10b_spenden
    signatur_slot: gesamtbetrag_der_einkuenfte
    grund: "Berechnete §-2-Größe (Gesamtbetrag der Einkünfte) als Bemessung für den 20-%-Spenden-Höchstbetrag; die Regel/Integration liefert sie, kein Laien-Feld."
  - regel_id: p10b_spenden
    geltungsbedingung: gde_ist_p2_ergebnis
    grund: "Kopplung: der Gesamtbetrag der Einkünfte ist das §-2-Ergebnis; keine eigene Abfrage."
  - regel_id: p10b_spenden
    geltungsbedingung: nur_zwanzig_prozent_gde_deckel
    grund: "Der 20-%-GdE-Höchstbetrag (§ 10b Abs. 1 S. 1) ist Rechenlogik der Regel; keine Laien-Abfrage."
  - regel_id: p33_1_2_agb_abzug
    geltungsbedingung: zumutbare_belastung_ist_p33_3_ergebnis
    grund: "Modellierungs-Kopplung: die abgezogene zumutbare Belastung ist das p33_3-Ergebnis; keine eigene Abfrage."
  - regel_id: p33_1_2_agb_abzug
    geltungsbedingung: keine_behinderungsbedingten_fahrtkosten
    grund: "AUFGELÖST: Fahrtkostenpauschale jetzt in eigener Scheibe (p33_2a) und IN den agb-Slot von catala_p33_agb integriert. Die alte Abgrenzung 'außerhalb dieser Scheibe' gilt nicht mehr — die Pauschale ist Teil der agB-Bemessung."
  # -- §35a: die übrigen 6 Geltungsbedingungen sind Qualifikationen/Annahmen ohne eigene Laien-Abfrage.
  # Die 3 topf-identifizierenden Bedingungen (minijob_ist_.../dienstleistungen_sind_.../handwerker_nur_...)
  # stehen NICHT mehr hier -- seit der Einzelaufstellung sind sie echt gebunden (Art- UND Betrag-Feld
  # jedes Topfs, quelle.geltungsbedingung), nicht mehr bloß Fragetext-Annahme. Siehe Bindungen oben. --
  - regel_id: p35a_2_3_haushaltsnahe
    geltungsbedingung: keine_beruecksichtigung_als_wk_sa_agb
    grund: "Annahme: die Beträge sind nicht schon als Betriebsausgaben/Werbungskosten berücksichtigt (Dedup)."
  - regel_id: p35a_2_3_haushaltsnahe
    geltungsbedingung: handwerkerbetrag_enthaelt_nur_arbeitskosten
    grund: "Die Abfrage hh_handwerker_betrag fragt bereits nur die Arbeitskosten (Fragetext + Hilfe, 'ohne Material'); Annahme im Feld materialisiert."
  - regel_id: p35a_2_3_haushaltsnahe
    geltungsbedingung: dienstleistungsbetrag_enthaelt_nur_arbeitskosten
    grund: "Die Abfrage hh_dienstleistung_betrag fragt bereits nur die Arbeitskosten (Fragetext 'ohne Material'); Annahme im Feld materialisiert."
  - regel_id: p35a_2_3_haushaltsnahe
    geltungsbedingung: kein_gemeinsamer_haushalt_zweier_alleinstehender
    grund: "Sonderfall gemeinsamer Haushalt zweier Alleinstehender (Höchstbeträge nur einmal) — außerhalb dieser Scheibe."
  - regel_id: p35a_2_3_haushaltsnahe
    geltungsbedingung: antrag_gestellt
    grund: "Der Abzug wird durch die Angabe in der Erklärung beantragt; die Eingabe der Beträge IST der Antrag, keine separate Abfrage."
  - regel_id: p35a_2_3_haushaltsnahe
    geltungsbedingung: keine_pflege_oder_heimkosten
    grund: "Pflege-/Heimkosten sind ein eigener § 35a-Zweig (Abs. 2 S. 2) außerhalb dieser Erst-Scheibe."
