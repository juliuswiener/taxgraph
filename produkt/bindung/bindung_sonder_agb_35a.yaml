    askable: false
    fragetext_laie: null
    hilfe_kurz: "Summe der Minijob-Aufwendungen (berechnet aus den Einzelposten unten)."
    beispielwert: null
    herkunft_slots: null
    elster_kz: E0104109
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
