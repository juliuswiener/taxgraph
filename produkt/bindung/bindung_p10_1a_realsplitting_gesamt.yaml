# Bindungstabelle — §10 Abs.1a Nr.1 EStG Realsplitting (Unterhalt Ex-Ehegatte, Stufe-1, Tier-0).
# MVP: Kz null (XSD-Sektion unklar — Sonderausgaben Cross-Ref mit Ehegatten-Slots nötig).
# Accessor: catala_p10_1a_realsplitting (pure-python, min(unterhaltsleistungen, 13.805 + kv_pv_beitraege)).
version: 1
scheibe: "Realsplitting Unterhalt (p10_1a_realsplitting)"

bindungen:
  # ========================= Realsplitting: Unterhaltsleistungen (p10_1a_realsplitting) =========================
  - feld_id: realsplitting_unterhaltsleistungen
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p10_1a_realsplitting, signatur_slot: unterhaltsleistungen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hast du deinem geschiedenen oder dauernd getrennt lebenden Ex-Ehepartner Unterhalt gezahlt? Falls ja, wie viel im Jahr?"
    hilfe_kurz: "Unterhaltsleistungen werden bis 13.805 Euro pro Jahr abgezogen, erhöht um KV/PV-Beiträge für den Ex-Ehegatten."
    beispielwert: 1200000
    herkunft_slots: null
    # E10/SO/Unt_Leist — "Unterhaltsleistungen, soweit sie vom Geber als Sonderausgaben
    # abgezogen werden können, laut Anlage U". NICHT E0120103: das ist § 33a (Unterhalt an
    # bedürftige Personen, Sektion ESt1A_U). Realsplitting ist die Geberseite der Anlage U
    # und liegt unter SO/Unt_Leist. Die frühere Notiz hatte beide verwechselt — das Kürzel
    # "ESt1A_U" legt "Anlage U" nahe, meint aber § 33a. Belegt 2026-08-05.
    elster_kz: E0304601
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1a Nr. 1 S. 1 EStG"
      zitatanker: "Unterhaltsleistungen an den geschiedenen oder dauernd getrennt lebenden unbeschränkt einkommensteuerpflichtigen Ehegatten, wenn der Geber dies mit Zustimmung des Empfängers beantragt, bis zu 13 805 Euro im Kalenderjahr"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

  - feld_id: realsplitting_empfaenger_kv_pv
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p10_1a_realsplitting, signatur_slot: kv_pv_beitraege}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hast du Kranken- und Pflegeversicherungsbeiträge für deinen Ex-Ehepartner bezahlt? Falls ja, wie viel im Jahr? Diese erhöhen den absetzbaren Höchstbetrag."
    hilfe_kurz: "Nur die KV/PV-Beiträge nach § 10 Abs. 1 Nr. 3 zählen; sie erhöhen den Deckel von 13.805 Euro."
    beispielwert: 400000
    herkunft_slots: null
    # E10/SO/Unt_Leist — "In Zeile E0304601 enthaltene Beiträge (abzüglich Erstattungen und
    # Zuschüsse) zur Basis-Kranken- und Pflegeversicherung". Teilmenge von E0304601, nicht
    # additiv. NICHT E0124401 (das ist die § 33a-Entsprechung). Belegt 2026-08-05.
    #
    # AB VZ 2025: das Kz existiert im E10-2024 NICHT (dort trägt SO/Unt_Leist nur E0304601).
    # Vom xsd_verify-Gate gefangen, als vz_gueltigkeit noch [2024,2025,2026] stand. Für 2024
    # bleibt der Betrag undeklariert — materiell unschädlich, weil er ohnehin nur den
    # Höchstbetrag des Gebers erhöht (§ 10 Abs. 1a Nr. 1 S. 2) und in E0304601 enthalten ist.
    elster_kz: E0300717
    vz_gueltigkeit: [2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1a Nr. 1 S. 2 EStG"
      zitatanker: "Der Höchstbetrag nach Satz 1 erhöht sich um den Betrag der im jeweiligen Veranlagungszeitraum nach Absatz 1 Nummer 3 für die Absicherung des geschiedenen oder dauernd getrennt lebenden unbeschränkt einkommensteuerpflichtigen Ehegatten aufgewandten Beiträge"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

  - feld_id: realsplitting_empfaenger_kv_krankengeld
    vorschlagbar_von: [beleg]
    # Seit dem Hand-Fix der Regel (2026-08-16) ein echter Rechen-Eingang: die 4-Prozent-Kürzung
    # nach § 10 Abs. 1 Nr. 3 Buchst. a S. 4 steht jetzt in catala_a/b und in der Signatur.
    # Der Slot heißt kv_krankengeld und ist eine TEILMENGE von kv_pv_beitraege, kein zweiter
    # Summand — deshalb ist `slot_beitrag` bewusst NICHT auf summand gesetzt.
    quelle: {regel_id: p10_1a_realsplitting, signatur_slot: kv_krankengeld}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel von diesen Kranken- und Pflegeversicherungsbeiträgen entfällt auf eine Krankenversicherung mit Anspruch auf Krankengeld?"
    hilfe_kurz: "Teilbetrag der Zeile davor, nicht zusätzlich. Bei gesetzlich Versicherten mit Krankengeldanspruch ist das meist der volle Krankenversicherungsanteil (ohne Pflegeversicherung); steht auf der Beitragsbescheinigung der Kasse. Kein Anspruch auf Krankengeld: 0."
    beispielwert: 300000
    herkunft_slots: null
    # E10/SO/Unt_Leist — "Davon entfallen auf Krankenversicherungsbeiträge mit Anspruch auf
    # Krankengeld laut Anlage U" (Wortlaut aus E10-2025.xsd, gelesen 2026-08-14). Dritte und
    # letzte Kz dieses Containers; die anderen beiden (E0304601, E0300717) waren gebunden, diese
    # nicht — deshalb beanstandete checkESt "Zeile 7", obwohl Zeile 5 gefüllt war
    # (reports/adjudikation/feldmatrix_vollklassifikation_2026-08-12.md, Abschnitt 4).
    #
    # Wie E0300717 erst ab VZ 2025 im Schema: der Container trug 2024 nur E0304601.
    elster_kz: E0300829
    vz_gueltigkeit: [2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 3 Buchst. a S. 4 EStG"
      zitatanker: "Wenn sich aus den Krankenversicherungsbeiträgen nach Satz 2 ein Anspruch auf Krankengeld oder ein Anspruch auf eine Leistung, die anstelle von Krankengeld gewährt wird, ergeben kann, ist der jeweilige Beitrag um 4 Prozent zu vermindern"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

  - feld_id: realsplitting_zustimmung
    vorschlagbar_von: []
    quelle: {regel_id: p10_1a_realsplitting, geltungsbedingung: antrag_mit_zustimmung}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Hat dein Ex-Ehepartner der steuerlichen Geltendmachung dieser Unterhaltszahlungen zugestimmt (z.B. per Anlage U)?"
    hilfe_kurz: "Ohne ausdrückliche Zustimmung des Ex-Partners ist der Abzug nicht möglich. Beide Ehegatten müssen dies beantragen oder schriftlich bestätigen."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "MVP (Klasse-g): Zustimmungs-Checkbox für Ehegatten-Slots; XSD-Integration mit E-Nr/Person-Slots unklar. Mapping deferred (Folge-Gate)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1a Nr. 1 S. 1 EStG"
      zitatanker: "wenn der Geber dies mit Zustimmung des Empfängers beantragt"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

luecken:
  # -- Realsplitting: Ex-Ehegatte Statusprüfung ist externe Gatekeeping (§ 10 Abs.1a S.1 + Registerabfrage) --
  - regel_id: p10_1a_realsplitting
    geltungsbedingung: empfaenger_geschieden_getrennt_unbeschraenkt
    grund: "Ex-Ehegatte-Qualifikation (§ 10 Abs. 1a Nr. 1 S. 1: 'geschieden oder dauernd getrennt lebend' + 'unbeschränkt einkommensteuerpflichtig') wird vorgelagert via Register/eDaten überprüft oder via Partnerschafts-Steuererklärung bestätigt; keine separate Laien-Abfrage hier."

  - regel_id: p10_1a_realsplitting
    geltungsbedingung: deckel_13805_plus_kv_pv
    grund: "13.805€-Höchstbetrag + KV/PV-Erhöhung (§ 10 Abs. 1a Nr. 1 S. 1-2) sind im pure-python Accessor catala_p10_1a_realsplitting materialisiert (Rechenlogik: min(unterhaltsleistungen, 13.805 + kv_pv_beitraege))."

  - regel_id: p10_1a_realsplitting
    geltungsbedingung: kuerzung_krankengeld_4_prozent
    grund: "Die 4-Prozent-Kürzung (§ 10 Abs. 1 Nr. 3 Buchst. a S. 4, über die Verweisung in Abs. 1a Nr. 1 S. 2) ist Rechenlogik der Regel und im Accessor materialisiert — genau wie der Deckel darüber. Das ERFASSTE Feld realsplitting_empfaenger_kv_krankengeld hängt nicht an dieser Bedingung, sondern am Rechen-Slot kv_krankengeld: es liefert den Anteil, die Kürzung selbst rechnet die Regel."
