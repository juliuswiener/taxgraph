    vorjahr: uebernehmbar
    fragetext_laie: "Wann hast du gezahlt? (Von der ersten bis zur letzten Zahlung, z. B. 01.01-31.12)"
    hilfe_kurz: "Der Zeitraum der Zahlungen selbst — bei monatlichen Überweisungen das ganze Jahr, bei einer Einmalzahlung derselbe Tag zweimal."
    beispielwert: "01.01-31.12"
    herkunft_slots: null
    elster_kz: E0120104
    elster_kz_grund: "E0120104 [.../AW_U/U_Ztr], XSD-Label 'Zeitraum, in dem die Zahlungen fuer den Unterhalt geleistet wurden (Tag der ersten Zahlung bis Tag der letzten Zahlung)'. ERiC verlangt ihn GEMEINSAM mit der Hoehe (E0120103, oben)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33a Abs. 1 S. 1 EStG"
      zitatanker: "gesetzlich unterhaltsberechtigten Person"
      datei: "sources/gesetze-im-internet/estg_p33a_2026-07-13.txt"
  - feld_id: p33a_unterhalt_kv_pv
