  # Luecken — vierzehn neue Fragen fuer eine Anlage, die vorher nur einen Betrag trug.
  #
  # Fuenf davon sind Ja/Nein (JaNein12, zwei echte Werte — "Nein" ist eine ANTWORT und wird als
