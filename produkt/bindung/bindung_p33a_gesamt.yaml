    beispielwert: false
    herkunft_slots: null
    elster_kz: E0123313
    elster_kz_grund: "E0123313 [.../Ang_Unt_Pers/Ek_Bez_u_P/Allg], XSD-Label 'Die unterstuetzte Person hat Einkuenfte, Bezuege und / oder oeffentliche Ausbildungshilfen im Kalenderjahr erzielt'. Der Betrag selbst steht in p33a_andere_einkuenfte_bezuege; dies ist die vorgelagerte Ja/Nein-Aussage, ohne die ERiC 'Zu den Einkuenften ... wurde keine Aussage getroffen' meldet."
