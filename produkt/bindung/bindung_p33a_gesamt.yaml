# Bindungstabelle — §33a EStG (Unterhalt Abs.1 + Ausbildungsfreibetrag Abs.2).
# §33a mindert GdE ("vom Gesamtbetrag der Einkünfte abgezogen" — KEIN §33-Agb,
# keine zumutbare Eigenbelastung → sonstige_abzuege_vom_einkommen, wie §10d).
# 4 Felder, OPTIONAL (absent→0→over-tax-safe). Kz null+MVP.
# Task §33a-Stufe-1, Stand 2026-07-21.
version: 1
scheibe: "§33a EStG Unterhalt + Ausbildungsfreibetrag (gesamt + rentner)"

bindungen:
  - feld_id: p33a_unterhalt_aufwendungen
    quelle: {regel_id: p33a_unterhalt, signatur_slot: aufwendungen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie viel hast du im vergangenen Jahr für Unterhalt und Berufsausbildung der unterhaltsberechtigten Person tatsächlich gezahlt?"
    hilfe_kurz: "Nur tatsächlich geleistete Zahlungen an die unterhaltsberechtigte Person (z. B. monatliche Überweisungen, Mietzahlungen direkt). Maximal abziehbar ist der Grundfreibetrag (~12.348€, plus KV/PV-Beiträge)."
    beispielwert: 1000000
    herkunft_slots: null
    # E10/ESt1A_U/Ang_HH_unt_P_Unt_Leist/AW_U/U_Ztr — "Höhe der Unterhaltszahlung
    # – ohne Bargeldzahlung – (einschließlich Beiträge zu Basis-Kranken- und
    # Pflegeversicherungen laut Zeile E0124401)". ESt1A_U ist § 33a (unterstützte Person,
    # Kindergeld-Anspruch, Haushaltszugehörigkeit) — NICHT Realsplitting/Anlage U, das liegt
    # unter SO/Unt_Leist. Belegt 2026-08-05.
    elster_kz: E0120103
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33a Abs. 1 S. 1 EStG"
      zitatanker: "Aufwendungen fuer den Unterhalt und eine etwaige Berufsausbildung"
      datei: "sources/gesetze-im-internet/estg_p33a_2026-07-13.txt"

  # ================= Angaben zur unterstuetzten Person und ihrem Haushalt =================
  # Bis 2026-08-19 trug die Bindung NUR die Betraege. Gemessen mit p33a_unterhalt_aufwendungen
  # allein: rc=610001002 mit FUENF Beanstandungen auf einmal — mehr als jede andere Luecke:
  #   "Es muss mindestens eine unterstuetzte Person ... erklaert werden"
  #   "... ist bei jedem Haushalt die Adresse des Haushalts ... zu erklaeren"
  #   "... muss die Anzahl der Personen, die zum Haushalt gehoeren, erklaert werden"
  #   "Bitte geben Sie auch den Unterhaltszeitraum ... an"
  #   "... sind die Hoehe der Unterhaltszahlung und der Zeitraum ... gemeinsam anzugeben"
  #
  # SIEBEN NEUE FRAGEN, und keine einzige davon ableitbar: wen jemand unterstuetzt, wo diese
  # Person lebt, wie viele im Haushalt sind und in welchem Zeitraum gezahlt wurde, weiss nur der
  # Nutzer. Das ist der Preis dafuer, dass Unterhalt an Angehoerige ueberhaupt einreichbar wird —
  # ohne sie kommt die Erklaerung zurueck, egal wie richtig der Betrag ist.
  #
  # Sie erscheinen nur, wenn die Regel relevant ist, also wenn ueberhaupt Unterhalt eingetragen
  # wurde. Wer keinen zahlt, sieht keine davon.
  #
  # MVP-GRENZE: EINE unterstuetzte Person, EIN Haushalt. Das Schema erlaubt mehr
  # (Ang_HH_unt_P_Unt_Leist maxOccurs=99, darunter U_Ztr maxOccurs=12 und Ang_Unt_Pers
  # maxOccurs=9). Fuer eine Instanz reicht der gewoehnliche Schreibpfad: _einhaengen() laeuft den
  # Pfad segmentweise und legt fehlende Container schlicht an, unabhaengig von der Tiefe. Die
  # kz_path[:2]-Ableitung in elster_xml.py:532 greift nur fuer echte Mehrfach-Gruppen ab Index 2
  # und bleibt hier unberuehrt — geprueft, nicht vermutet.
  #
  # signatur_slot zeigt bei allen sieben ins Leere: p33a_unterhalt fuehrt zwar drei
  # Geltungsbedingungen, aber alle drei betreffen die Rechenmechanik (Grundfreibetrag als
  # Norm-Konstante, Schonbetrag 624, Netto-Einkuenfte). An einer Haushaltsadresse behauptete
  # jede davon einen Zusammenhang, den es nicht gibt.
  - feld_id: p33a_person_name
    quelle: {regel_id: p33a_unterhalt, signatur_slot: unterstuetzte_person_name}
    typ: text
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wen hast du unterstützt? (Vor- und Nachname)"
    hilfe_kurz: "Die Person, für die du Unterhalt gezahlt hast — zum Beispiel ein Elternteil oder ein Kind ohne Kindergeldanspruch."
    beispielwert: "Maier, Erika"
    herkunft_slots: null
    elster_kz: E0120201
    elster_kz_grund: "E0120201 [ESt1A_U/Ang_HH_unt_P_Unt_Leist/Ang_Unt_Pers/Allg/Persoenl], XSD-Label 'Name, Vorname'."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33a Abs. 1 S. 1 EStG"
      zitatanker: "gesetzlich unterhaltsberechtigten Person"
      datei: "sources/gesetze-im-internet/estg_p33a_2026-07-13.txt"
