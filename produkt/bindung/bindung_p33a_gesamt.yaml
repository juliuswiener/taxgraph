  # DIE IDENTIFIKATIONSNUMMER EINER DRITTEN PERSON. § 33a Abs. 1 S. 9 macht sie zur
  # Abzugsvoraussetzung, ERiC sagt es im Klartext: "Die Angabe der erteilten steuerlichen
  # Identifikationsnummer (§ 139b der Abgabenordnung) ist Voraussetzung fuer den Abzug von
  # Unterhaltsleistungen". Ohne sie gibt es den Abzug nicht — das Feld ist also nicht
  # ersetzbar, sondern der Preis dieser Anlage.
  #
  # Es ist damit die erste Stelle, an der das Produkt eine IdNr erhebt, die NICHT dem Nutzer
  # oder seinem Ehegatten gehoert. Der Nutzer muss sie bei der unterstuetzten Person erfragen;
  # der Hilfetext sagt das, damit niemand sie raet. Eine erfundene Nummer faellt ohnehin auf:
  # sie traegt eine Pruefziffer nach § 139b AO, und ERiC prueft sie.
  - feld_id: p33a_person_idnr
    quelle: {regel_id: p33a_unterhalt, signatur_slot: unterstuetzte_person_idnr}
    typ: text
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie lautet die Steuer-Identifikationsnummer dieser Person? (elf Ziffern)"
    hilfe_kurz: "Die Person findet sie auf ihrem eigenen Steuerbescheid oder ihrer Lohnsteuerbescheinigung — frag sie danach. Ohne diese Nummer erkennt das Finanzamt den Unterhalt nicht an (§ 33a Abs. 1 S. 9 EStG)."
    beispielwert: "86095742719"
    herkunft_slots: null
    elster_kz: E0120211
    elster_kz_grund: "E0120211 [.../Ang_Unt_Pers/Allg/Persoenl], XSD-Label 'Identifikationsnummer', Typ IDNrBaseCType. Der Beispielwert braucht MEHR als eine gueltige Pruefziffer: eine erste Fassung (03165413965) hatte eine korrekte Pruefziffer nach § 139b AO und wurde von ERiC trotzdem abgelehnt ('Ungueltige Identifikationsnummer'). Die IdNr fordert zusaetzlich, dass die erste Ziffer nicht 0 ist und unter den ersten zehn Ziffern GENAU EINE doppelt oder dreifach vorkommt. 86095742719 erfuellt beides (scripts/idnr_pruefziffer.py::strukturell_gueltig)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33a Abs. 1 S. 9 EStG"
      zitatanker: "Voraussetzung für den Abzug der Aufwendungen ist die Angabe der erteilten Identifikationsnummer"
      datei: "sources/gesetze-im-internet/estg_p33a_2026-07-13.txt"
  - feld_id: p33a_zahlungszeitraum
