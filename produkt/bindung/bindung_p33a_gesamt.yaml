  # Beide Zeitraum-Felder sind typ text, NICHT datum: der XSD-Typ ist
  # DatumBereichTTpMMbTTpMM (E10-2025.xsd:58-64) mit dem Muster TT.MM-TT.MM — zwei Teildaten
  # ohne Jahr, durch Bindestrich verbunden. Der Store prueft typ "datum" fail-closed gegen
  # ^\d{2}\.\d{2}\.\d{4}$ (store.py:190) und wiese "01.01-31.12" ab. Dieselbe Entscheidung wie
  # bei dhf_bestanden_bis.
  - feld_id: p33a_unterstuetzungszeitraum
    quelle: {regel_id: p33a_unterhalt, signatur_slot: unterstuetzungszeitraum}
    standardwert: "01.01-31.12"   # der Normalfall: das ganze Jahr. Ohne Vorgabe muss der Nutzer das Format raten (2026-08-26)
    typ: text
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "In welchem Zeitraum hast du diese Person unterstützt? (Tag und Monat, z. B. 01.01-31.12)"
    hilfe_kurz: "Das ganze Jahr über? Dann 01.01-31.12. Sonst der tatsächliche Zeitraum. Das Jahr brauchst du nicht."
    beispielwert: "01.01-31.12"
    herkunft_slots: null
    elster_kz: E0120109
    elster_kz_grund: "E0120109 [.../AW_U/U_Ztr], XSD-Label 'Unterstuetzungszeitraum, fuer den Unterhalt geleistet wurde', Typ DatumBereichTTpMMbTTpMM."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33a Abs. 1 S. 1 EStG"
      zitatanker: "gesetzlich unterhaltsberechtigten Person"
      datei: "sources/gesetze-im-internet/estg_p33a_2026-07-13.txt"
