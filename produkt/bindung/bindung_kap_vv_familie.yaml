# Bindungstabelle — Scheibe 3: Kapital §20 + V+V §21 + Familie (§24b/§31/§32) (Task #11).
# Validiert gegen schema.json (kein neues Schema). Signaturen/Bedingungen: rules.yaml.
# §20/§21/Kind-E-Nr: im 2026-07-12-Katalog konzeptbelegt, XSD-E-Nr Sektions-Lookup-Nachtrag -> null+grund.
version: 1
scheibe: "Kapital §20 (p20_6/p20_9) + V+V §21 (p21/p21_2) + Familie (p24b/p31/p32_6)"

bindungen:
  # ========================= Kapital §20 — Sparer-Pauschbetrag (p20_9) =========================
  - feld_id: kap_kapitalertraege
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p20_9_sparer_pauschbetrag, signatur_slot: kapitalertraege}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Kapitalerträge hattest du dieses Jahr (Zinsen, Dividenden, Gewinne aus Verkäufen)?"
    hilfe_kurz: "Steht in deiner Steuerbescheinigung von Bank oder Broker. Die ersten 1.000 Euro sind steuerfrei."
    beispielwert: 300000
    herkunft_slots: null
    elster_kz: E1900701
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 9 S. 1 EStG"
      zitatanker: "als Werbungskosten ein Betrag von 1 000 Euro abzuziehen"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  # ========================= Kapital §20 — Verlustverrechnung (p20_6) =========================
  - feld_id: kap_gewinn_aktien
    quelle: {regel_id: p20_6_verlustverrechnung, signatur_slot: gewinn_aktien}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Gewinne aus dem Verkauf von Aktien hattest du dieses Jahr?"
    hilfe_kurz: "Nur die Gewinne aus verkauften Aktien (ein Teil deiner gesamten Kapitalerträge). Wichtig, weil Aktienverluste steuerlich nur mit Aktiengewinnen verrechnet werden dürfen."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: E1900901
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 4 EStG"
      zitatanker: "aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_verlust_aktien
    quelle: {regel_id: p20_6_verlustverrechnung, signatur_slot: verlust_aktien}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Verluste aus dem Verkauf von Aktien hattest du dieses Jahr?"
    hilfe_kurz: "Aktienverluste können nur mit Aktiengewinnen verrechnet werden (eigener Topf)."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: E1901301
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 4 EStG"
      zitatanker: "aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_gewinn_sonstige
    quelle: {regel_id: p20_6_verlustverrechnung, signatur_slot: gewinn_sonstige}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe sonstige Kapitalgewinne (außer Aktien) hattest du dieses Jahr?"
    hilfe_kurz: "Zum Beispiel Gewinne aus Fonds oder Zertifikaten."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: Modell-Mismatch. Wert in E1900701. E1900904 enger als unser Feld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 1 EStG"
      zitatanker: "nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_verlust_sonstige
    quelle: {regel_id: p20_6_verlustverrechnung, signatur_slot: verlust_sonstige}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe sonstige Kapitalverluste (außer Aktien) hattest du dieses Jahr?"
    hilfe_kurz: "Sonstige Verluste werden in ihrem eigenen Topf verrechnet."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: E1901201
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 1 EStG"
      zitatanker: "nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"

  # ===== §20 Kapital Person-B (Zusammenveranlagung): Klasse-g-Zwillinge, Anlage-KAP-Instanz B =====
  # Anlage KAP wird PER PERSON gefüllt (jeder Ehegatte eigener Sparer-Pauschbetrag § 20 Abs. 9 S. 3);
  # KEIN distinkter Person-B-Kz (Schema-Recon 2026-07-18: E1900701/E19009xx = per-Person-Instanz, kein
  # Ehegatte-Kz) → est_mapping Klasse g mappt _partner auf DENSELBEN Person-A-Kz im person_b-Bucket, kein
  # neuer Kz. K2-Guard partner_check: nur bei veranlagung==zusammen. Accessor summiert A+B (dev-1-Nachtrag).
  - feld_id: kap_kapitalertraege_partner
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: kap_kapitalertraege_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Kapitalerträge hatte dein zusammen veranlagter Ehe-/Lebenspartner dieses Jahr (Zinsen, Dividenden, Gewinne)?"
    hilfe_kurz: "Nur bei Zusammenveranlagung: jeder Ehegatte hat einen eigenen Sparer-Pauschbetrag (1.000 Euro), deshalb person-individuell aus der Steuerbescheinigung des Partners."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-KAP-Instanz B (Klasse g): derselbe Kz E1900701 wie Person A, zweites Sub-Dokument — kein distinktes Partner-Kz (Schema-Recon: keine Ehegatte-Kapitalerträge-Kz). herkunft_slots=null (Beleg füllt nur Person A)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 9 S. 3 EStG"
      zitatanker: "gemeinsamer Sparer-Pauschbetrag von 2 000 Euro"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_gewinn_aktien_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: kap_gewinn_aktien_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Gewinne aus dem Verkauf von Aktien hatte dein Ehe-/Lebenspartner dieses Jahr?"
    hilfe_kurz: "Nur bei Zusammenveranlagung, person-individuell: Aktienverluste des Partners verrechnen sich nur mit seinen eigenen Aktiengewinnen."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-KAP-Instanz B (Klasse g): derselbe Kz E1900901 wie Person A, kein distinktes Partner-Kz."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 4 EStG"
      zitatanker: "aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_verlust_aktien_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: kap_verlust_aktien_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Verluste aus dem Verkauf von Aktien hatte dein Ehe-/Lebenspartner dieses Jahr?"
    hilfe_kurz: "Nur bei Zusammenveranlagung, person-individuell (eigener Aktien-Verlusttopf des Partners)."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-KAP-Instanz B (Klasse g): derselbe Kz E1901301 wie Person A, kein distinktes Partner-Kz."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 4 EStG"
      zitatanker: "aus der Veräußerung von Aktien entstehen, dürfen nur mit Gewinnen aus Kapitalvermögen"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_verlust_sonstige_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: kap_verlust_sonstige_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe sonstige Kapitalverluste (außer Aktien) hatte dein Ehe-/Lebenspartner dieses Jahr?"
    hilfe_kurz: "Nur bei Zusammenveranlagung, person-individuell (eigener sonstiger Verlusttopf des Partners)."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-KAP-Instanz B (Klasse g): derselbe Kz E1901201 wie Person A, kein distinktes Partner-Kz."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 1 EStG"
      zitatanker: "nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  # Register-B K2-Fix (2026-07-19): sonstiger Kapital-GEWINN Person-B — spiegelbildlich zu kap_gewinn_sonstige
  # (Person A). VORHER hart 0 in api.py (stiller Under-tax, Ehegatte-Gewinn nie besteuert); jetzt symmetrisch
  # deklariert -> dev-1s Fold liest den Read-Key, kein stiller Falschwert.
  - feld_id: kap_gewinn_sonstige_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: kap_gewinn_sonstige_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe sonstige Kapitalgewinne (außer Aktien) hatte dein Ehe-/Lebenspartner dieses Jahr?"
    hilfe_kurz: "Nur bei Zusammenveranlagung, person-individuell (z. B. Gewinne aus Fonds oder Zertifikaten des Partners)."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: derselbe Status wie Person A. Wert in E1900701 (person_b)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 6 S. 1 EStG"
      zitatanker: "nicht mit Einkünften aus anderen Einkunftsarten ausgeglichen werden"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"

  # ========================= V+V §21 — laufende Einkünfte (p21) =========================
  - feld_id: vv_einnahmen
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_vermietung_einkuenfte, signatur_slot: einnahmen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hohe Mieteinnahmen hattest du dieses Jahr (Kaltmiete plus umgelegte Nebenkosten)?"
    hilfe_kurz: "Alles, was der Mieter dir gezahlt hat."
    beispielwert: 1200000
    herkunft_slots: null
    elster_kz: E0700201
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 1 S. 1 Nr. 1 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_gebaeude_afa
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_vermietung_einkuenfte, signatur_slot: gebaeude_afa}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch ist die jährliche Abschreibung (AfA) für das vermietete Gebäude?"
    hilfe_kurz: "Meist ein fester Prozentsatz der Anschaffungskosten des Gebäudes (ohne Grundstück)."
    beispielwert: 300000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-V-Cross-Check 2026-07-17: kein einzelner Gebäude-AfA-Summen-Kz — die AfA wird über Art-Flag (E0703302) + Detail-Betrag (E0703304 je Zuordnung Direkt/Verhaelt, § 7 Abs. 4/5/5a) deklariert; 1:1-Eintrag wäre semantisch schief. Bleibt Lücke."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 1 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_schuldzinsen
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_vermietung_einkuenfte, signatur_slot: schuldzinsen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viele Zinsen hast du dieses Jahr für den Kredit auf die vermietete Immobilie gezahlt?"
    hilfe_kurz: "Nur die Zinsen, nicht die Tilgung."
    beispielwert: 200000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-V-Cross-Check 2026-07-17: die E10-Submission deklariert KEIN eigenes Schuldzinsen-Betrags-Kz — der Vordruck-Detailbetrag aggregiert in die WK-Summe (E0703838). Bleibt Lücke (Modell feiner als Submission)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 1 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_erhaltungsaufwand
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_vermietung_einkuenfte, signatur_slot: erhaltungsaufwand}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Was hast du dieses Jahr für Reparaturen und Instandhaltung der vermieteten Immobilie ausgegeben?"
    hilfe_kurz: "Zum Beispiel neue Heizung, Malerarbeiten, Reparaturen."
    beispielwert: 100000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-V-Cross-Check 2026-07-17: kein eigenes Erhaltungsaufwand-Betrags-Kz in der E10-Submission — aggregiert in die WK-Summe (E0703838). Bleibt Lücke."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 1 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_sonstige_wk
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_vermietung_einkuenfte, signatur_slot: sonstige_werbungskosten}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Welche sonstigen Kosten hattest du dieses Jahr rund um die Vermietung (Hausgeld, Versicherung, Fahrten)?"
    hilfe_kurz: "Alle weiteren Ausgaben, die mit der Vermietung zusammenhängen."
    beispielwert: 50000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-V-Cross-Check 2026-07-17: kein eigenes Betrags-Kz — aggregiert in die WK-Summe (E0703838). Bleibt Lücke."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 1 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung von unbeweglichem Vermögen"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"

  # ========================= V+V §21 — verbilligte Vermietung (p21_2, 66/50%-Gate) =========================
  - feld_id: vv_werbungskosten
    quelle: {regel_id: p21_2_verbilligte_vermietung_wk, signatur_slot: werbungskosten}
    typ: cent
    einheit: EUR
    askable: false
    fragetext_laie: "Wie hoch waren deine gesamten Kosten für die vermietete Wohnung (Abschreibung, Zinsen, Reparaturen, Sonstiges zusammen)?"
    hilfe_kurz: "Bei verbilligter Vermietung an Angehörige können die Kosten anteilig gekürzt werden."
    beispielwert: 800000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-V-Cross-Check 2026-07-17: unser Modell ist feiner als die Submission — die WK-Summe entsteht deterministisch in der est_mapping-Schicht aus den Detail-Slots (afa/schuldzinsen/erhaltung/sonstige). AGGREGATIONS-ZIEL-Kz = E0703838 (Abzugsfähige Werbungskosten), mit Zuordnungsart-Vorbehalt ([Einz]/[Sum]/[Direkt]/[Verhaelt], Mehrfachzeilen je Objekt). Kein Direkt-Eintrag."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 2 EStG"
      zitatanker: "weniger als 50 Prozent der ortsüblichen Marktmiete"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_entgelt_quote_prozent
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_2_verbilligte_vermietung_wk, signatur_slot: entgelt_quote_prozent}
    typ: int
    einheit: "%"
    bereich: {min: 0, max: 100, grund: "Prozentsatz der ortsüblichen Marktmiete (Miete/Marktmiete), physikalisch 0..100"}
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel Prozent der ortsüblichen Miete verlangst du (falls du verbilligt vermietest, z. B. an Angehörige)?"
    hilfe_kurz: "Ab 66 % kannst du die Kosten voll absetzen, unter 50 % nur anteilig."
    beispielwert: 100
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: Semantik-Unterschied. E0708601 = Kürzungs-%, Entgelt-Quote nicht deckungsgleich."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 2 S. 1 EStG"
      zitatanker: "weniger als 50 Prozent der ortsüblichen Marktmiete"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_wohnzwecke
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_2_verbilligte_vermietung_wk, geltungsbedingung: wohnung_zu_wohnzwecken_ueberlassen}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wird die Wohnung zum Wohnen vermietet (nicht gewerblich)?"
    hilfe_kurz: "Die verbilligte-Vermietung-Regel gilt nur für Wohnungen zu Wohnzwecken."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein), kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 2 S. 1 EStG"
      zitatanker: "Überlassung einer Wohnung zu Wohnzwecken"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"
  - feld_id: vv_auf_dauer
    instanz_gruppe: vv_objekt
    quelle: {regel_id: p21_2_verbilligte_vermietung_wk, geltungsbedingung: auf_dauer_angelegte_wohnungsvermietung}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Vermietest du die Wohnung dauerhaft (nicht nur vorübergehend)?"
    hilfe_kurz: "Bei nur kurzzeitiger Vermietung gelten andere Regeln."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein), kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 21 Abs. 2 S. 2 EStG"
      zitatanker: "bei auf Dauer angelegter Wohnungsvermietung"
      datei: "sources/gesetze-im-internet/estg_p21_2026-07-13.txt"

  # ========================= Familie — Entlastungsbetrag Alleinerziehende (p24b) =========================
  - feld_id: fam_alleinstehend
    quelle: {regel_id: p24b_entlastungsbetrag, signatur_slot: alleinstehend}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Bist du alleinerziehend (du wohnst mit deinem Kind zusammen, aber ohne einen anderen Erwachsenen im Haushalt)?"
    hilfe_kurz: "Es darf keine andere erwachsene Person mit im Haushalt leben (außer eigene Kinder)."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
