  # Antrag Günstigerprüfung (§ 32d Abs. 6): Ring-berechnet, kein Nutzer-Opt-in fuer DIESEN
  # Antrag. NICHT an den vom Ring beim Rechnen gewaehlten Zweig gekoppelt (kap_st < abgeltung)
  # — das war der urspruengliche Entwurf und blockierte genau den HAEUFIGEREN Fall (Abgeltung
  # guenstiger bleibt uneinreichbar, rc=610001002, gemessen 2026-08-10). § 32d Abs. 6 S. 1: die
  # Hinzurechnung zur tariflichen ESt erfolgt nur, "wenn dies zu einer niedrigeren
  # Einkommensteuer ... führt" — der Antrag löst eine PRÜFUNG aus und kann strukturell nicht
  # schlechterstellen. Jetzt gesetzt, sobald irgendein KAP-Betragsfeld erklärt wird (eigen ODER
  # — bei Zusammenveranlagung — Partner). S.3/S.4: EIN Antrag je Erklaerung (auch bei
  # Zusammenveranlagung fuer saemtliche Kapitalertraege beider Ehegatten) — kein Partner-
  # Zwilling, kein eigenes distinktes Kz je Person (XSD: E1900401 erscheint schemaweit genau
  # einmal). Injektion in _mit_ring_werten (produkt/haut/api.py).
  # Anlage KAP Zeile 16 (Kz 217/417): der IN ANSPRUCH GENOMMENE Sparer-Pauschbetrag. Ohne dieses
  # Feld bleibt die Erklaerung uneinreichbar, auch MIT Antrag — gemessen 2026-08-10, Kz direkt in
  # die Deklaration injiziert, Basisfall + kap_kapitalertraege=5.000:
  #   ohne beides            rc=610001002  "...einen Grund fuer die Angabe ... angeben"
  #   nur E1901401           rc=610001002  derselbe Blocker
  #   nur E1900401           rc=610001002  "...keine Angabe zum in Anspruch genommenen
  #                                          Sparer-Pauschbetrag"
  #   E1900401 + E1901401    rc=0          einreichbar
  # Abgeleitet, nicht gefragt: catala_sparer_pb liefert die Kapitaleinkuenfte NACH Abzug, der
  # genutzte Pauschbetrag ist die Differenz zum verrechneten Rohbetrag. Der Vordruck vermerkt bei
  # dieser Zeile ausdruecklich "(ggf. 0)" — 0 ist ein zulaessiger Wert, kein fehlender.
  - feld_id: kap_sparer_pauschbetrag_genutzt
    quelle: {regel_id: p20_9_sparer_pauschbetrag, geltungsbedingung: sparer_pb_1000_2000_konstante}
    typ: cent
    einheit: EUR
    askable: false
    fragetext_laie: null
    hilfe_kurz: "In Anspruch genommener Sparer-Pauschbetrag (berechnet, ggf. 0)"
    beispielwert: null
    herkunft_slots: null
    elster_kz: E1901401
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 20 Abs. 9 S. 1 EStG"
      zitatanker: "als Werbungskosten ein Betrag von 1 000 Euro abzuziehen"
      datei: "sources/gesetze-im-internet/estg_p20_2026-07-13.txt"
  - feld_id: kap_antrag_guenstigerpruefung
    quelle: {regel_id: p32d_1_abgeltung, geltungsbedingung: guenstigerpruefung_beantragt}
    typ: bool
    einheit: null
    askable: false
    fragetext_laie: null
    hilfe_kurz: "Automatisch gestellt, wenn die tarifliche Besteuerung günstiger ist als die 25 %-Abgeltungsteuer."
    beispielwert: true
    herkunft_slots: null
    elster_kz: E1900401
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 32d Abs. 6 S. 1 EStG"
      zitatanker: "wenn dies zu einer niedrigeren Einkommensteuer einschließlich Zuschlagsteuern führt"
      datei: "sources/gesetze-im-internet/estg_p32d_2026-07-13.txt"
  # KAP Stufe 3 (Zeile 41, Kz 284/484): noch nicht angerechnete auslaendische Quellensteuer (q).
  # Kz belegt in reports/adjudikation/anlage-kap-kz-zuordnung-2026-08-10.md. ABGRENZUNG: Zeile 40
  # (E1905001, von der Bank bereits angerechnet) und Zeile 42 (E1905201, fiktive Quellensteuer)
  # sind eigene Konzepte, NICHT dieses Feld. Formel (e-4q)/(4+k) nur im kirchensteuerpflichtigen
  # Fall (p32d_1_kirchensteuer); ohne Kirchensteuerpflicht reduziert q die Abgeltungsteuer direkt
  # nach § 32d Abs. 1 S. 1+2 (Ring-Logik, api.py, kein eigener rule_id-Zweig fuer den k=0-Fall).
  # Deckel: nur Jahres-Summe (Abs. 5 S. 3, q <= kap_st) gebaut. Der engere Pro-Kapitalertrag-
  # 25 %-Deckel (Abs. 5 S. 1) ist NICHT pruefbar (kein Einzelposten-Datenmodell) — offene Frage.
  - feld_id: kap_q_auslaendische_steuer
    quelle: {regel_id: p32d_1_kirchensteuer, signatur_slot: anrechenbare_auslaendische_steuer}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel ausländische Quellensteuer auf deine Kapitalerträge wurde noch nicht angerechnet (z. B. von deiner Bank)?"
    hilfe_kurz: "Anlage KAP Zeile 41. Nur die noch nicht angerechnete ausländische Steuer — bereits von der Bank angerechnete Beträge (Zeile 40) hier nicht nochmal eintragen."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: E1905101
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 32d Abs. 1 S. 2 EStG"
      zitatanker: "die nach Maßgabe des Absatzes 5 anrechenbaren ausländischen Steuern"
      datei: "sources/gesetze-im-internet/estg_p32d_2026-07-13.txt"

  # ===== §20 Kapital Person-B (Zusammenveranlagung): Klasse-g-Zwillinge, Anlage-KAP-Instanz B =====
  # Anlage KAP wird PER PERSON gefüllt (jeder Ehegatte eigener Sparer-Pauschbetrag § 20 Abs. 9 S. 3);
  # KEIN distinkter Person-B-Kz (Schema-Recon 2026-07-18: E1900701/E19009xx = per-Person-Instanz, kein
  # Ehegatte-Kz) → est_mapping Klasse g mappt _partner auf DENSELBEN Person-A-Kz im person_b-Bucket, kein
  # neuer Kz. K2-Guard partner_check: nur bei veranlagung==zusammen. Accessor summiert A+B (dev-1-Nachtrag).
  - feld_id: kap_kapitalertraege_partner
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: kap_kapitalertraege_partner}
