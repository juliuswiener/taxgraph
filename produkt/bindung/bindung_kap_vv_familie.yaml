luecken:
  # -- §20 Annahmen --
  - regel_id: p20_9_sparer_pauschbetrag
    signatur_slot: zusammenveranlagung
    grund: "Geteiltes Laien-Feld = veranlagung (Mantelbogen, § 26). Das frühere eigene Feld kap_zusammenveranlagung stellte dieselbe Frage ein zweites Mal und konnte ihr widersprechen: bei veranlagung=einzel + Flag=true wurde der Sparer-Pauschbetrag verdoppelt, ohne das Partner-Kapital zu addieren (250 € zu wenig Steuer, gemessen 2026-07-30). Ein Mischzustand aus Einzel- und gemeinsamer Kapital-Veranlagung existiert in § 26 EStG nicht — der Ring liest die Veranlagungsart jetzt nur noch aus veranlagung."
  - regel_id: p20_9_sparer_pauschbetrag
    geltungsbedingung: sparer_pb_1000_2000_konstante
    grund: "Konstante 1.000/2.000 Euro (Parameter), keine Laien-Abfrage. Seit 2026-08-10 haengt an derselben Bedingung zusaetzlich das NICHT-askable Feld kap_sparer_pauschbetrag_genutzt (Kz E1901401, Anlage KAP Zeile 16): der in Anspruch genommene Betrag ist deklarationspflichtig, bleibt aber berechnet — die Konstante wird weiterhin nicht gefragt."
  # -- §32d Abs. 6 Guenstigerpruefung: Rechen-Slots, keine Laien-Fragen --
  # Seit 2026-08-10 bindet kap_antrag_guenstigerpruefung (Kz E1900401) an diese Regel. Damit
  # verlangt test_b_vollstaendigkeit, dass ALLE askable Slots der Regel gebunden oder als Luecke
  # dokumentiert sind. Die drei hier sind Ring-Ergebnisse und koennen es nicht sein.
  - regel_id: p32d_1_abgeltung
    signatur_slot: kapitaleinkuenfte
    grund: "Ring-Ergebnis, keine Laien-Abfrage: die nach § 20 ermittelten Kapitaleinkuenfte entstehen aus kap_kapitalertraege und der Verlustverrechnung (p20_6) nach Abzug des Sparer-Pauschbetrags (catala_sparer_pb). Der Nutzer nennt die Rohbetraege, nicht das Zwischenergebnis."
  - regel_id: p32d_1_abgeltung
    signatur_slot: est_regulaer_mit_kap
    grund: "Tarifergebnis aus der § 2-Integration (p32a), nicht abfragbar. rules.yaml sagt es selbst unter der Bedingung tarifwerte_sind_p2_ergebnis: 'est_regulaer_mit_kap / est_regulaer_ohne_kap sind p32a-Tarifergebnisse (mit/ohne Hinzurechnung der Kapitaleinkuenfte)'. Andockung wie § 31, kein Selbst-Tarif."
  - regel_id: p32d_1_abgeltung
    signatur_slot: est_regulaer_ohne_kap
    grund: "Gegenstueck zu est_regulaer_mit_kap, dieselbe Herkunft (p32a-Tarif ohne Hinzurechnung). Die Differenz beider ist die Guenstiger-Entscheidung selbst — ein Rechenergebnis, das der Nutzer nicht liefern kann."
  - regel_id: p32d_1_abgeltung
    geltungsbedingung: tarifwerte_sind_p2_ergebnis
    grund: "Beschreibt die HERKUNFT der Tarifwerte (p32a-Ergebnisse aus der § 2-Integration, Andockung wie § 31), nicht einen Sachverhalt des Nutzers. Nichts daran ist abfragbar — die Bedingung dokumentiert, dass der Ring die Werte nicht selbst tarifiert."
  - regel_id: p32d_1_abgeltung
    geltungsbedingung: keine_kirchensteuer_auf_kapitalertraege
    grund: "Verzweigung zwischen glattem 25-%-Satz und der KiSt-ermaessigten Formel (e-4q)/(4+k), s. rules.yaml Z.4143f. Der Sachverhalt dahinter wird bereits ueber kist_konfession erfragt (bindung_kist.yaml) und vom Ring ausgewertet — ein zweites Feld waere dieselbe Frage ein zweites Mal, mit der Moeglichkeit zu widersprechen. Praezedenz: kap_zusammenveranlagung, gestrichen aus genau diesem Grund (250 EUR Under-tax, gemessen 2026-07-30, s. Luecke p20_9/zusammenveranlagung oben)."
  # -- §32d Abs. 1 S. 3-5 KiSt-ermaessigte Formel (p32d_1_kirchensteuer), seit KAP Stufe 3 --
  - regel_id: p32d_1_kirchensteuer
    signatur_slot: kapitaleinkuenfte
    grund: "Dieselbe Herkunft wie bei p32d_1_abgeltung/kapitaleinkuenfte (oben): Ring-Ergebnis aus kap_kapitalertraege nach Verlustverrechnung (p20_6) und Sparer-Pauschbetrag (catala_sparer_pb), keine eigene Abfrage."
  - regel_id: p32d_1_kirchensteuer
    signatur_slot: kirchensteuersatz
    grund: "Abgeleitet aus kist_bundesland (bindung_p51a_kirchensteuer.yaml, 8 % Bayern/Baden-Wuerttemberg, 9 % uebrige Laender laut dortigem anker_ref) — derselbe Hebesatz wie bei der § 51a-Kirchensteuer-Festsetzung, keine zweite Abfrage."
  - regel_id: p32d_1_kirchensteuer
    geltungsbedingung: kirchensteuerpflicht_besteht
    grund: "Derselbe Sachverhalt wie keine_kirchensteuer_auf_kapitalertraege bei p32d_1_abgeltung (oben): ueber kist_konfession erfragt (bindung_p51a_kirchensteuer.yaml) und vom Ring ausgewertet, keine zweite Abfrage."
  - regel_id: p32d_1_kirchensteuer
    geltungsbedingung: keine_guenstigerpruefung_beantragt
    grund: "Deckt sich mit kap_antrag_guenstigerpruefung (oben, E1900401): der Ring wendet die Abgeltung-Formel nur an, wenn kap_st == abgeltung, sonst laeuft der Guenstiger-Zweig — kein eigenes Feld noetig."
  - regel_id: p32d_1_kirchensteuer
    geltungsbedingung: kapitaleinkuenfte_nicht_negativ
    grund: "Guard-Bedingung der Regel, im Ring als fruehe Rueckgabe bei kapitaleinkuenfte <= 0 materialisiert (produkt/haut/api.py), kein eigenes Feld."
  - regel_id: p20_6_verlustverrechnung
    geltungsbedingung: aktienverlust_nur_gegen_aktiengewinn
    grund: "Topf-Trennung Aktien ist Rechenlogik der Regel (eigene Verrechnung), im Feld-Zuschnitt (getrennte Aktien-/Sonstige-Felder) materialisiert."
  - regel_id: p20_6_verlustverrechnung
    geltungsbedingung: verlustvortrag_ist_10d_grenze
    grund: "Verlustvortrag folgt § 10d-Grenze (andere Regel/Scheibe), keine eigene Abfrage."
  # -- §21 Annahmen --
  - regel_id: p21_vermietung_einkuenfte
    geltungsbedingung: einkuenfte_ueberschuss_einnahmen_ueber_wk
    grund: "Einkünfte = Einnahmen − Werbungskosten (Überschussrechnung); Struktur, kein eigenes Ja/Nein-Feld."
  - regel_id: p21_2_verbilligte_vermietung_wk
    geltungsbedingung: entgelt_quote_ausserhalb_prognosekorridor
    grund: "Die 50/66-%-Schwelle rechnet die Regel aus der eingegebenen Entgelt-Quote (vv_entgelt_quote_prozent); keine eigene Abfrage."
  # -- Familie p24b --
  - regel_id: p24b_entlastungsbetrag
    geltungsbedingung: alleinstehend_im_sinne_des_absatzes_3
    grund: "Materialisiert im Feld fam_alleinstehend (Slot alleinstehend)."
  - regel_id: p24b_entlastungsbetrag
    geltungsbedingung: monate_ohne_voraussetzung_sind_volle_kalendermonate
    grund: "Konvention: volle Kalendermonate (ganzzahl_monate); im Feld fam_monate_ohne_voraussetzung materialisiert."
  - regel_id: p24b_entlastungsbetrag
    geltungsbedingung: kinder_mit_freibetrag_oder_kindergeld_im_haushalt
    grund: "War fam_kinder_im_haushalt, geloescht 2026-08-12 (reports/adjudikation/tote-gate-felder-unfallkosten-analyse-2026-08-12.md): dritte Achse tot — kein Accessor in api.py/golden/runner.py, elster_kz: null, scheiben-unerreichbar. fam_anzahl_kinder ist seit 92cdca69 per geschaerfter Selbstdeklaration bereits die anspruchsberechtigte Kinderzahl."
  # -- Familie p32_6 (geteilte Slots + Annahmen) --
  - regel_id: p32_6_kinderfreibetraege
    signatur_slot: anzahl_kinder
    grund: "Geteiltes Laien-Feld = fam_anzahl_kinder (Slot anzahl_kinder in p24b); im UI einmalige Abfrage, intern auf beide Regeln verteilt."
  - regel_id: p32_6_kinderfreibetraege
    signatur_slot: zusammenveranlagung
    grund: "Geteiltes Laien-Feld = veranlagung (Mantelbogen, § 26); einmalige Abfrage."
  - regel_id: p32_6_kinderfreibetraege
    geltungsbedingung: kind_zu_beiden_ehegatten
    grund: "Verdopplung der Freibeträge bei Zusammenveranlagung ist Rechenlogik der Regel; keine eigene Abfrage."
  - regel_id: p32_6_kinderfreibetraege
    geltungsbedingung: keine_uebertragung_oder_sonderfaelle
    grund: "Übertragung des Kinderfreibetrags / Sonderfälle (Anlage Kind) außerhalb dieser Erst-Scheibe."
  - regel_id: p32_6_kinderfreibetraege
    geltungsbedingung: kinder_sind_zu_beruecksichtigen
    grund: "War fam_kinder_beruecksichtigt, geloescht 2026-08-12 (reports/adjudikation/tote-gate-felder-unfallkosten-analyse-2026-08-12.md): die Regel wird im Ring gar nicht aufgerufen, der Kinderfreibetrag laeuft direkt ueber runner._kinderfreibetrag(vz, veranlagung) * fam_anzahl_kinder (api.py:876). fam_anzahl_kinder ist seit 92cdca69 per geschaerfter Selbstdeklaration bereits die anspruchsberechtigte Kinderzahl."
  # -- Familie p31 (Günstiger-Knoten; alle Inputs berechnet, keine askable Slots) --
  - regel_id: p31_familienleistungsausgleich
    signatur_slot: est_ohne_freibetraege
    grund: "Berechnete Tarifgröße (Kindergeld-Zweig: tarifl. ESt ohne Kinderfreibeträge + Kindergeld); kein Laien-Feld."
  - regel_id: p31_familienleistungsausgleich
    signatur_slot: est_mit_freibetraegen
    grund: "Berechnete Tarifgröße (Freibetrag-Zweig: tarifl. ESt mit Kinderfreibeträgen); kein Laien-Feld."
  - regel_id: p31_familienleistungsausgleich
    signatur_slot: kindergeld
    grund: "Berechneter Kindergeld-Anspruchsbetrag (§ 66, je Kind × Monate); ergibt sich aus fam_anzahl_kinder, kein eigenes Feld."
  - regel_id: p31_familienleistungsausgleich
    geltungsbedingung: tarifwerte_sind_p32a_ergebnis
    grund: "Modellierungs-Kopplung: die beiden Tarifwerte sind § 32a-Ergebnisse; keine Abfrage."
  - regel_id: p31_familienleistungsausgleich
    geltungsbedingung: kindergeld_ist_anspruchsbetrag
    grund: "Der Kindergeld-Zweig rechnet mit dem ANSPRUCH (nicht dem Ausgezahlten); Rechenlogik, keine Abfrage."
  - regel_id: p31_familienleistungsausgleich
    geltungsbedingung: zusammenveranlagte_eltern
    grund: "Veranlagungsart (veranlagung) steuert die Freibeträge; keine eigene Abfrage."
  - regel_id: p31_familienleistungsausgleich
    geltungsbedingung: keine_kindergeld_sonderfaelle
    grund: "Kindergeld-Sonderfälle (Zählkinder, Auslandskinder) außerhalb dieser Scheibe."
