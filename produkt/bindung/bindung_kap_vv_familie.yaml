    askable: true
    vorjahr: vorschlag
    fragetext_laie: "In wie vielen Monaten dieses Jahr warst du NICHT alleinerziehend (z. B. weil ein Partner mit im Haushalt lebte)?"
    hilfe_kurz: "Für jeden vollen Monat ohne die Voraussetzungen wird der Entlastungsbetrag anteilig gekürzt."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Aus dem EfA-Zeitraum (E0503801 'im Zeitraum') abgeleitet; die Regel rechnet die vollen Kalendermonate ohne Voraussetzung, kein direkter Monats-Kz."
