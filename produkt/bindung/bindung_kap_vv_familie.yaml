  # Anderer Elternteil bei NICHT zusammen veranlagten Eltern (K_Verh_and_P/Ang_Pers im XSD,
  # neben K_Verh_A/K_Verh_B). Gemessen 2026-08-12: kind_kindschaftsverhaeltnis_b/E0500808 ist
  # bei veranlagung=einzel checkESt zufolge UNZULAESSIG ("Es handelt sich um eine
  # Einzelveranlagung, daher sind Angaben zum Kindschaftsverhaeltnis zur Ehefrau nicht
  # zulaessig") — K_Verh_B bildet den MITERKLAERENDEN Ehegatten ab, nicht den anderen
  # Elternteil allgemein. Fuer Einzelveranlagung verlangt checkESt stattdessen diese
  # Personenangaben zum anderen Elternteil als Drittperson (E0501103/104/106/903). Die
