luecken:
  # -- §24a Altersentlastungsbetrag: Bemessungs-Inputs + Kohorten-Parameter (gesamt-Kontext, §24a gesamt-only) --
  - regel_id: p24a_altersentlastungsbetrag
    signatur_slot: arbeitslohn
    grund: "Bemessungs-Input = Bruttoarbeitslohn (§19, bereits im gesamt-Ring erfasst); §24a rechnet aus dem Gesamteinkommen, keine eigene Abfrage."
  - regel_id: p24a_altersentlastungsbetrag
    signatur_slot: positive_andere_einkuenfte
    grund: "Abgeleitet = Summe der positiven anderen Einkünfte (nicht aus nichtselbständiger Arbeit; §22-Leibrenten §24a-S.2-ausgeschlossen); dev-1s slot_fn leitet je Ring aus den Einkunftsarten ab, keine eigene Abfrage."
  - regel_id: p24a_altersentlastungsbetrag
    signatur_slot: prozentsatz
    grund: "Kohorten-Parameter (maßgebender Prozentsatz), abgeleitet über das Feld geburtsjahr -> §24a-Tabelle (params/kohorten/altersentlastungsbetrag_p24a.yaml); kein Laien-Feld. (Höchstbetrag = params-Key, auto-exempt.)"
  - regel_id: p24a_altersentlastungsbetrag
    geltungsbedingung: alter_64_vor_bezugsjahr_vollendet
    grund: "Im gesamt-Ring aus dem Feld geburtsjahr abgeleitet (§24a greift ab dem Jahr, das der Vollendung des 64. Lebensjahres folgt: VZ >= geburtsjahr + 65); keine eigene Ja/Nein-Abfrage nötig."
  - regel_id: p24a_altersentlastungsbetrag
    geltungsbedingung: bemessung_netto_nach_ausschluessen
    grund: "Bemessung nach Ausschluss bestimmter Einkünfte (u. a. §22-Leibrenten, §24a S.2); Rechenlogik der Regel auf den bereits erfassten Einkünften, keine eigene Abfrage."

  # -- § 34 Abs. 3 Ermäßigter Durchschnittssatz (p34_3, Stufe-2a): die 3 Modul-Inputs sind RING-DERIVED --
  # (Antrag/Eligibility sind eigene Flag-Felder; die Bemessungs-Inputs berechnet die Ring-Naht, keine Abfrage).
  - regel_id: p34_3_ermaessigter_durchschnittssatz
    signatur_slot: ao_einkuenfte
    grund: "= rentner_veraeusserungsgewinn (§16-vg, bereits gebunden); die Ring-Naht reicht den netto-vg (nach §16 Abs.4-Freibetrag) durch, keine eigene Abfrage. Fail-closed auf ao > 5 Mio (Überschuss = §34 Abs.1-Fünftel, Stufe-2b)."
  - regel_id: p34_3_ermaessigter_durchschnittssatz
    signatur_slot: est_gesamt_zzgl_progression
    grund: "Abgeleitet = tarifliche ESt auf das volle zvE (Ring-berechnet, catala_gesamt_tarifliche); §32b-Progressionsvorbehalt-Addend=0 solange kein §32b-Input ring-verdrahtet (grep-belegt 2026-07-19, system-weite Lücke base+Fünftel+Abs.3); kein Laien-Feld."
  - regel_id: p34_3_ermaessigter_durchschnittssatz
    signatur_slot: bemessungsgrundlage_durchschnitt
    grund: "Abgeleitet = volles zvE zzgl Progressionsvorbehalt (Ring-berechnet, catala_gesamt_zve; §34 Abs.3 S.2 „gesamten zvE zzgl Progression“, NICHT 5Mio-gekappt); Progressions-Addend=0 (s. est_gesamt_zzgl_progression); kein Laien-Feld."
  - regel_id: p34_3_ermaessigter_durchschnittssatz
    geltungsbedingung: ao_einkuenfte_abs2_nr1
    grund: "Definitorisch = die außerordentlichen Einkünfte sind Veräußerungsgewinne iSd §34 Abs.2 Nr.1 (§16-vg, rentner_veraeusserungsgewinn); die Ring-Naht speist genau diese als ao, keine eigene Abfrage."
  - regel_id: p34_3_ermaessigter_durchschnittssatz
    geltungsbedingung: tarifwerte_sind_p2_ergebnis
    grund: "Kontrakt: est_gesamt_zzgl_progression + bemessungsgrundlage_durchschnitt sind Ergebnisse des §2-Tarifs (Ring-berechnet, catala_gesamt_tarifliche/_zve), keine Laien-Eingabe. Die Dekomposition boundary-reviewt der Instructor bei der Ring-Naht."
  - regel_id: p34_3_ermaessigter_durchschnittssatz
    geltungsbedingung: bemessungsgrundlage_positiv
    grund: "Ring-Guard: bemessungsgrundlage_durchschnitt > 0 (Div-by-Zero-Schutz; ao>0 ⟹ zvE>0). Kein Laien-Feld; die Ring-Naht ruft das Modul nur bei positiver Basis."

  # -- EÜR § 4 Abs. 3 (p4_3_gewinn, Stufe 2-II): Geltungsbedingungen des Gewinn-Kerns --
  # Die vorberechneten net-Komponenten (betriebseinnahmen/-ausgaben) erfüllen die BE/BA-Reinheits-
  # Bedingungen (§ 4 Abs. 3 S. 2 durchlaufende Posten, § 12 Nr. 1/3 nicht-abziehbar) definitorisch; die
  # Einkunftsart-Weiche (§ 15 Abs. 2 / § 18 Abs. 1) läuft über gewinn_betriebsart (Klasse-f: gewerbe/
  # selbständig; land_forst ausgeschlossen via dev-1s luf_euer_offen-Guard). Kein eigenes Laien-Feld.
  - regel_id: p4_3_gewinn
    geltungsbedingung: nicht_buchfuehrungspflichtig_und_keine_buecher
    grund: "§ 4 Abs. 3 S. 1 Voraussetzung (keine Buchführungspflicht + keine freiwilligen Bücher): Annahme des EÜR-MVP — wer die Einnahmenüberschussrechnung wählt, erfüllt sie. Die Bilanzierungs-Abgrenzung (§ 4 Abs. 1/§ 5) ist benannter Nachtrag."
  - regel_id: p4_3_gewinn
    geltungsbedingung: durchlaufende_posten_ausgeschieden
    grund: "§ 4 Abs. 3 S. 2: die betriebseinnahmen/-ausgaben sind als net-Eingabe bereits um durchlaufende Posten bereinigt (definitorisch, kein eigenes Feld)."
  - regel_id: p4_3_gewinn
    geltungsbedingung: keine_lebensfuehrungskosten_p12_nr1
    grund: "§ 12 Nr. 1 S. 1: die sonstige_betriebsausgaben-Eingabe ist betrieblich veranlasst (§ 4 Abs. 4); Lebensführungs-/Haushaltskosten sind ausgeschieden (net-Eingabe)."
  - regel_id: p4_3_gewinn
    geltungsbedingung: keine_repraesentation_gemischt_p12_nr1s2
    grund: "§ 12 Nr. 1 S. 2: gemischte Repräsentationsaufwendungen sind aus der Betriebsausgaben-Eingabe ausgeschieden (net-Eingabe)."
  - regel_id: p4_3_gewinn
    geltungsbedingung: keine_personensteuern_p12_nr3
    grund: "§ 12 Nr. 3: Personensteuern (Einkommensteuer u. Ä.) sind keine Betriebsausgabe und in der Eingabe nicht enthalten (net-Eingabe)."
  - regel_id: p4_3_gewinn
    geltungsbedingung: einkunftsart_gewerbe_p15_abs2
    grund: "§ 15 Abs. 2 (Einkunftsart Gewerbe): über gewinn_betriebsart='gewerbe' (Klasse-f) abgebildet; der EÜR-Gewinn wird nur für gewerbe/selbständig gerechnet. § 15 Abs. 3 Abfärbung = benannter Nachtrag."
  - regel_id: p4_3_gewinn
    geltungsbedingung: einkunftsart_selbstaendige_arbeit_p18_abs1
    grund: "§ 18 Abs. 1 (Einkunftsart selbständige Arbeit): über gewinn_betriebsart='selbstaendig' (Klasse-f); dieselbe EÜR-Grundmechanik. land_forst (§ 13) ausgeschlossen via luf_euer_offen-Guard (dev-1)."

  # -- § 10d Verlustvortrag (p10d_2): abgeleitete Slots + Festgestellt-GB --
  - regel_id: p10d_2_verlustvortrag_abzug
    signatur_slot: gesamtbetrag_einkuenfte
    grund: "Abgeleitet = der Gesamtbetrag der Einkünfte (§ 2 Abs. 3), im Ring bereits berechnet (GdE-Zwilling); keine eigene Abfrage."
  - regel_id: p10d_2_verlustvortrag_abzug
    signatur_slot: zusammenveranlagung
    grund: "Abgeleitet aus veranlagung=='zusammen' (§ 26b) → Sockel 2 Mio statt 1 Mio; keine eigene Abfrage (veranlagung ist schon gebunden)."
  - regel_id: p10d_2_verlustvortrag_abzug
    geltungsbedingung: verlustvortrag_bestand_festgestellt
    grund: "verlustvortrag_bestand ist der zum Vorjahresschluss gesondert festgestellte verbleibende Verlustvortrag (§ 10d Abs. 4, State-Input); die Fortschreibung selbst ist nicht Gegenstand der Regel. deckt_ab „Nicht ausgeglichene negative Einkünfte, die nicht nach Absatz 1 abgezogen worden sind“ (§ 10d Abs. 2 S. 1)."
