# Bindungstabelle — Scheibe an_gesamt: Gesamtsteuer-Ring Arbeitnehmerfall (Task #11, Stufe 1).
# Validiert gegen schema.json. Slots exakt gegen catala_est-Inputs (bruttoarbeitslohn/veranlagung),
# Zuschnitt 19d1686. regel_id p2_festzusetzung_einzel = Catala-Scope-Andockung (kein rules/estg-Dir,
# wie EP; Slot-Korrektheit über Abgleich mit dev-1s slot_fn). §19/§26 gefreezt 7248bae.
# HINWEIS Kinderzahl: KEINE eigene Bindung hier — der Ring nutzt fam_anzahl_kinder aus Scheibe 3
# (bindung_kap_vv_familie, Multiplikations-Feld); feld_id global eindeutig (Drift-Wächter Assertion 5).
# Stufe 2. werbungskosten/sonderausgaben sind interne est-Modul-Inputs (EP-/VOR-Felder existieren).
version: 1
scheibe: "Gesamtsteuer-Ring Arbeitnehmer: bruttoarbeitslohn (§19) + veranlagung (§26) [p2_festzusetzung_einzel] + 4 Abwesenheits-Flags kein_gewinn/kap/vuv/sonstige (§2 Abs.1) [p2_einkunftsarten]"

bindungen:
  # ========================= Bruttoarbeitslohn (§ 19) =========================
  - feld_id: bruttoarbeitslohn
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: bruttoarbeitslohn}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch war dein Bruttoarbeitslohn dieses Jahr? (steht auf der Lohnsteuerbescheinigung)"
    hilfe_kurz: "Der Bruttoarbeitslohn einschließlich Sachbezüge steht unter Nummer 3 der Lohnsteuerbescheinigung."
    beispielwert: 4000000
    herkunft_slots: ["Lohnsteuerbescheinigung Nr. 3"]
    elster_kz: E0200201
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 1 S. 1 Nr. 1 EStG"
      zitatanker: "Gehälter, Löhne, Gratifikationen, Tantiemen und andere Bezüge und Vorteile für eine Beschäftigung"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  # ========================= Versorgungsbezüge (§ 19 Abs. 2, p19_2) =========================
  - feld_id: versorgung_jahresrente
    quelle: {regel_id: p19_2_versorgungsfreibetrag, signatur_slot: jahresrente}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel Versorgung hast du dieses Jahr insgesamt bekommen (Ruhegehalt, Betriebsrente, Witwen-/Waisengeld)?"
    hilfe_kurz: "Der Jahresbetrag deiner Pension, Betriebsrente oder Versorgung, bevor etwas abgezogen wird. Steht in der Versorgungsmitteilung."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kz abhängig von Versorgungsart und Form (Anlage N oder R); Kz-Wahl in est_mapping nach versorgung_art-Weiche."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 2 S. 1 EStG"
      zitatanker: "bleiben ein nach einem Prozentsatz ermittelter, auf einen Höchstbetrag begrenzter Betrag"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  - feld_id: versorgung_bemessungsgrundlage
    quelle: {regel_id: p19_2_versorgungsfreibetrag, signatur_slot: bemessungsgrundlage}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie lautet deine Bemessungsgrundlage laut Steuerbescheid (in Euro)?"
    hilfe_kurz: "Das Zwölffache des Monatsbezugs bei Versorgungsbeginn, plus anrechenbare Sonderzahlungen. Dieser Wert ändert sich nie — auch Rentensteigerungen ändern ihn nicht. Der Betrag steht im Steuerbescheid."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Keine Anlage-Kz (Bemessungsgrundlage ist interne Heuristik, kein Deklarationsfeld). Laienfeld für den fixierten Betrag aus dem Bescheid; nur Folgejahr."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 2 S. 4 EStG"
      zitatanker: "das Zwölffache des Versorgungsbezugs für den ersten vollen Monat, jeweils zuzüglich voraussichtlicher Sonderzahlungen"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  - feld_id: versorgung_beginn_jahr
    quelle: {regel_id: p19_2_versorgungsfreibetrag, geltungsbedingung: versorgungsbeginn_kohorte}
    typ: int
    einheit: Jahr
    bereich: {min: 1955, max: 2060, grund: "Jahr des Versorgungsbeginns; Kohorten-Staffel nach dem Jahr bestimmt den Freibetrag lebenslang."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "In welchem Jahr hast du die Versorgung zum ersten Mal bekommen?"
    hilfe_kurz: "Das Jahr der Pensionierung oder des Betriebsrenten-Starts. Dieses Jahrgang bestimmt deinen Steuerfreibetrag für immer."
    beispielwert: 2020
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kohorten-Schlüssel für die Kz-Wahl in est_mapping (Jahr-Granularität). Kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 2 S. 3 EStG"
      zitatanker: "Jahr des Versorgungsbeginns"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  - feld_id: versorgung_art
    quelle: {regel_id: p19_2_versorgungsfreibetrag, geltungsbedingung: art_beamtenrechtlich_oder_nicht}
    typ: enum
    einheit: null
    enum_werte: ["beamtenrechtlich", "hinterbliebene", "erwerbsminderung", "altersgrenze_sonstige"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Welche Art von Versorgung bekommst du?"
    hilfe_kurz: "Beamtenrechtlich: Ruhegehalt eines Beamten oder öffentlichen Körperschaft. Hinterbliebene: Witwen-, Waisengeld. Erwerbsminderung: Rente wegen Behinderung. Altersgrenze: Betriebsrente, Direktversicherung."
    beispielwert: "beamtenrechtlich"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Art-Weiche nach dem Alters-Gate in der Haut-Logik. Steuert Kz-Verzweigung in est_mapping. Kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 2 S. 2 Nr. 1-2 EStG"
      zitatanker: "auf Grund beamtenrechtlicher oder entsprechender gesetzlicher Vorschriften"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  - feld_id: versorgung_alter_bei_beginn
    quelle: {regel_id: p19_2_versorgungsfreibetrag, geltungsbedingung: altersgrenze_sonstige_alter}
    typ: int
    einheit: null
    bereich: {min: 18, max: 100, grund: "Vollendetes Lebensjahr bei Versorgungsbeginn; Alters-Gate nach dem Jahr (63 Lj, 60 Lj bei Schwerbehinderung)."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie alt warst du (vollendetes Lebensjahr), als die Versorgung begonnen hat?"
    hilfe_kurz: "Nur bei nicht-beamtenrechtlichen Versorgungen nötig. Der Freibetrag wird nur gewährt, wenn du mindestens 63 Jahre alt warst (oder 60, falls schwerbehindert)."
    beispielwert: 63
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Alters-Gate für die Haut-Logik; nur bei versorgung_art=altersgrenze_sonstige abgefragt. Kein Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 2 S. 2 Nr. 2 EStG"
      zitatanker: "das 63. Lebensjahr oder, wenn er schwerbehindert ist, das 60. Lebensjahr vollendet hat"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  # ========================= Altersentlastungsbetrag §24a — Kohorten-Schlüssel (Stage-2-Faltung) =========================
  # §24a GESAMT-ONLY (Instructor Q2, §22-Leibrente §24a-S.2-ausgeschlossen). geburtsjahr -> dev-1s slot_fn
  # leitet massgebendes_folgejahr = geburtsjahr + 65 ab -> Prozentsatz/Höchstbetrag-Lookup in
  # params/kohorten/altersentlastungsbetrag_p24a.yaml. Optional (Feld-Präsenz, absent -> §24a 0).
  - feld_id: geburtsjahr
    quelle: {regel_id: p24a_altersentlastungsbetrag, geltungsbedingung: prozentsatz_hoechstbetrag_aus_kohortentabelle}
    typ: int
    einheit: null
    bereich: {min: 1900, max: 2010, grund: "Geburtsjahr, plausibler Bereich für erwerbstätige/rentennahe Steuerpflichtige."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "In welchem Jahr bist du geboren?"
    hilfe_kurz: "Bestimmt Prozentsatz und Höchstbetrag des Altersentlastungsbetrags (Kohorte nach dem Jahr, das der Vollendung des 64. Lebensjahres folgt)."
    beispielwert: 1958
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kohorten-Schlüssel für den maßgebenden Prozentsatz/Höchstbetrag (abgeleitet über die Tabelle); das vollständige Geburtsdatum steht im Mantelbogen (eigener Kz), dies ist kein eigenes Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 24a S. 5 EStG"
      zitatanker: "maßgebende Prozentsatz und der Höchstbetrag"
      datei: "sources/gesetze-im-internet/estg_p24a_2026-07-13.txt"

  # ========================= Veranlagungsart (§ 26) =========================
  - feld_id: veranlagung
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: veranlagung}
    typ: enum
    einheit: null
    enum_werte: ["einzel", "zusammen"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Gibst du die Erklärung allein oder gemeinsam mit Ehe-/Lebenspartner ab?"
    hilfe_kurz: "Gemeinsam = Zusammenveranlagung (oft günstiger bei unterschiedlichen Einkommen); allein = Einzelveranlagung."
    beispielwert: "einzel"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Veranlagungsart-Weiche (Mantelbogen); global, kein eigenes Betrags-Kz — die Wahl steuert den Tarif (Grund- vs. Splittingtarif), sie wird nicht als Betrag deklariert."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 26 Abs. 1 S. 1 EStG"
      zitatanker: "Ehegatten können zwischen der Einzelveranlagung (§ 26a) und der Zusammenveranlagung (§ 26b) wählen"
      datei: "sources/gesetze-im-internet/estg_p26_2026-07-17.txt"

  # ===== Abwesenheits-Flags (§ 2 Abs. 1 Einkunftsarten): bestätigte-Null-Blöcke =====
  # Anwendbarkeits-VORAUSSETZUNG des reinen Arbeitnehmerfalls (kein Festsetzungs-Input) → eigener
  # Pseudoregel-Scope p2_einkunftsarten. Positive Frage in der Haut ("Hattest du X?"), Antwort "nein"
  # → die Haut speichert kein_X=true (bestätigte Null der Einkunftsart) — Invertierung liegt in der Haut
  # (dev-1), hier nur das bool-Feld. Kein Kz (Anwendbarkeits-Flag, kein Deklarationsfeld).
  # beispielwert=false: Normalfall Privatnutzer 'Nein, hatte kein X' (Haut-Inversion !ja -> kein_X=true=abwesend,
  # fail-closed-sicher). UI-PREFILL-Effekt hängt an dev-1s bool-select-Prefill (app.js liest beispielwert noch
  # nicht, defaultet 'Ja') = dev-1 UI-Politur; beispielwert ist forward-ready (Instructor-Ruling 2026-07-18).
  - feld_id: kein_gewinn
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_gewinneinkuenfte}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hattest du dieses Jahr Einkünfte aus einem Gewerbe, aus Land-/Forstwirtschaft oder aus selbständiger/freiberuflicher Arbeit?"
    hilfe_kurz: "Wenn du nur Arbeitslohn beziehst, antworte mit Nein — dann liegen keine Gewinneinkünfte vor."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld — es steuert nur, ob der vereinfachte Ring greift."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 1-3 EStG"
      zitatanker: "Einkünfte aus Land- und Forstwirtschaft, 2. Einkünfte aus Gewerbebetrieb, 3. Einkünfte aus selbständiger Arbeit"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: kein_kap
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_kapitaleinkuenfte}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hattest du dieses Jahr Kapitalerträge (Zinsen, Dividenden, Kursgewinne)?"
    hilfe_kurz: "Steht i. d. R. in der Steuerbescheinigung von Bank oder Broker. Nur Arbeitslohn → Nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 5 EStG"
      zitatanker: "Einkünfte aus Kapitalvermögen"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: kein_vuv
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_vermietungseinkuenfte}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hattest du dieses Jahr Einnahmen aus Vermietung oder Verpachtung?"
    hilfe_kurz: "Zum Beispiel Miete für eine vermietete Wohnung. Nur Arbeitslohn → Nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 6 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: kein_sonstige
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_sonstigen_einkuenfte}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Hattest du dieses Jahr sonstige Einkünfte (z. B. Renten, private Veräußerungsgeschäfte)?"
    hilfe_kurz: "Sonstige Einkünfte sind z. B. Renten oder Gewinne aus privaten Verkäufen. Nur Arbeitslohn → Nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 7 EStG"
      zitatanker: "sonstige Einkünfte im Sinne des § 22"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"

  # ===== Gewinneinkünfte §§ 13-18 (Stufe 1): vorberechneter § 2-Gewinn + Betriebsart-Weiche =====
  # Der bereits ermittelte Gewinn (EÜR § 4 Abs. 3 / Betriebsvermögensvergleich) fließt DIREKT als
  # einkuenfte_gewinn-Summand in die § 2-Stufenfolge (Engine-Slot LIVE, p32a Z.464/559; dev-1s slot_fn
  # liest die feld_id 1:1 als CENT→EURO). Optional (absent → 0, over-tax-safe). gewinn_betriebsart =
  # Klasse-f-Weiche (Anlage G/S/L), spiegelt § 16 rentner_veraeusserungs_betriebsart (dieselben Enum-Werte).
  # Kz=null VORERST: die Anlage-G/S/L-Kz-Zuordnung ist eine eigene Kz-Review-Runde (Instructor-Adjudikation);
  # sie blockiert die BERECHNUNG nicht (der Ring rechnet nur aus dem Betrag, die Weiche steuert nur den Kz).
  - feld_id: einkuenfte_gewinn
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: einkuenfte_gewinn}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch war dein Gewinn aus Gewerbebetrieb, Land-/Forstwirtschaft oder selbständiger/freiberuflicher Arbeit dieses Jahr?"
    hilfe_kurz: "Der bereits ermittelte Gewinn (Einnahmen minus Betriebsausgaben, z. B. aus deiner Einnahmenüberschussrechnung). Einen Verlust trägst du als negativen Betrag ein."
    beispielwert: 3000000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kz E0800502 (E10/G/Gew/Ges_Fest/Sum/E0800502) belegt 2026-08-05 am amtlichen E10-2025.xsd. Anlage G/S/L haben Gewinn-Kz je Betriebsart. VERZWEIGUNG je gewinn_betriebsart noetig (est_mapping leeres kz-dict). Bindung noch offen."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 2 S. 1 Nr. 1 EStG"
      zitatanker: "bei Land- und Forstwirtschaft, Gewerbebetrieb und selbständiger Arbeit der Gewinn"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: gewinn_betriebsart
    quelle: {regel_id: p2_festzusetzung_einzel, geltungsbedingung: gewinn_betriebsart_weiche}
    typ: enum
    einheit: null
    enum_werte: ["gewerbe", "selbstaendig", "land_forst"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Aus welcher Art von Tätigkeit stammt dieser Gewinn?"
    hilfe_kurz: "Gewerbebetrieb (Anlage G), selbständige/freiberufliche Tätigkeit (Anlage S) oder Land- und Forstwirtschaft (Anlage L). Die Auswahl steuert nur, in welche Anlage der Gewinn eingetragen wird; die Steuer ist für alle drei gleich."
    beispielwert: "gewerbe"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Art-Weiche (steuert die Klasse-f-Kz-Verzweigung des Gewinns nach Anlage G/S/L), kein eigenes Betragsfeld/Kz. § 2-Gewinn ist anlage-agnostisch (der Ring rechnet gleich); die Weiche wählt nur den Deklarations-Kz. Die konkreten Anlage-Kz = eigene Kz-Review-Runde (null-Kz-MVP), gleiche Enum-Werte wie § 16 rentner_veraeusserungs_betriebsart."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 1-3 EStG"
      zitatanker: "Einkünfte aus Land- und Forstwirtschaft, 2. Einkünfte aus Gewerbebetrieb, 3. Einkünfte aus selbständiger Arbeit"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"

  # ===== EÜR-Komponenten §§ 13-18 (Stufe 2-I EÜR-Kern): Gewinn = Einnahmen − Ausgaben (§ 4 Abs. 3) =====
  # Der laufende Gewinn wird komponentenweise ermittelt: betriebseinnahmen − (sonstige_betriebsausgaben +
  # afa_jahresbetrag). regel p4_3_gewinn (EuerGewinn, materialisiert) rechnet einnahmen − ausgaben; die zwei
  # Ausgaben-Felder speisen den EINEN betriebsausgaben-Slot als SUMMANDEN (slot_beitrag, dev-1-Accessor
  # summiert). Der Gewinn fließt additiv in einkuenfte_gewinn (§ 2-Ring). EÜR nur gewerbe/selbständig
  # (§ 15 Abs. 2 / § 18 Abs. 1, NICHT § 13-LuF → dev-1s luf_euer_offen-Guard). Kz=null VORERST (Anlage-EÜR-Kz
  # = eigene Kz-Review-Runde, wie Anlage-G/S/L); der Gewinn-Kz läuft über gewinn_betriebsart (Klasse-f).
  - feld_id: betriebseinnahmen
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p4_3_gewinn, signatur_slot: betriebseinnahmen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch waren deine Betriebseinnahmen (Umsätze/Einnahmen aus dem Betrieb) dieses Jahr?"
    hilfe_kurz: "Alle Einnahmen aus deiner gewerblichen oder selbständigen Tätigkeit (Einnahmenüberschussrechnung). Ohne Umsatzsteuer, falls du sie gesondert ausweist. Dieser EÜR-Weg (Einnahmen minus Ausgaben) setzt voraus, dass du NICHT buchführungspflichtig bist (§ 4 Abs. 3). Bist du bilanzierungs-/buchführungspflichtig, trage stattdessen deinen fertigen Bilanz-Gewinn direkt im Gewinn-Feld ein — nicht hier."
    beispielwert: 8000000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "EÜR-Komponente (§ 4 Abs. 3): Rechen-Input für den Gewinn, kein eigenes Deklarations-Kz — der Gewinn-Kz läuft über gewinn_betriebsart (Klasse-f, Anlage G/S). Die Anlage-EÜR-Zeilen-Kz sind eine eigene Kz-Review-Runde (null-Kz-MVP, wie der ganze §§ 13-18-Bogen)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 4 Abs. 3 S. 1 EStG"
      zitatanker: "Überschuss der Betriebseinnahmen über die Betriebsausgaben"
      datei: "sources/gesetze-im-internet/estg_p4_2026-07-14.txt"
  - feld_id: sonstige_betriebsausgaben
    vorschlagbar_von: [beleg]
