    hilfe_kurz: "Die Ermäßigung gibt es nur EINMAL im Leben (§ 34 Abs. 3 S. 4). Wenn du sie früher schon genutzt hast, ist ein erneuter Antrag ausgeschlossen — dann gilt die Fünftelregelung."
    beispielwert: false
    herkunft_slots: null
