# Bindungstabelle — Scheibe an_gesamt: Gesamtsteuer-Ring Arbeitnehmerfall (Task #11, Stufe 1).
# Validiert gegen schema.json. Slots exakt gegen catala_est-Inputs (bruttoarbeitslohn/veranlagung),
# Zuschnitt 19d1686. regel_id p2_festzusetzung_einzel = Catala-Scope-Andockung (kein rules/estg-Dir,
# wie EP; Slot-Korrektheit über Abgleich mit dev-1s slot_fn). §19/§26 gefreezt 7248bae.
# HINWEIS Kinderzahl: KEINE eigene Bindung hier — der Ring nutzt fam_anzahl_kinder aus Scheibe 3
# (bindung_kap_vv_familie, Multiplikations-Feld); feld_id global eindeutig (Drift-Wächter Assertion 5).
# Stufe 2. werbungskosten/sonderausgaben sind interne est-Modul-Inputs (EP-/VOR-Felder existieren).
version: 1
scheibe: "Gesamtsteuer-Ring Arbeitnehmer: bruttoarbeitslohn (§19) + veranlagung (§26) [p2_festzusetzung_einzel] + 4 Abwesenheits-Flags kein_gewinn/kap/vuv/sonstige (§2 Abs.1) [p2_einkunftsarten]"

bindungen:
  # ========================= Bruttoarbeitslohn (§ 19) =========================
  - feld_id: bruttoarbeitslohn
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: bruttoarbeitslohn}
    typ: cent
    einheit: EUR
    askable: true
    fragetext_laie: "Wie hoch war dein Bruttoarbeitslohn dieses Jahr? (steht auf der Lohnsteuerbescheinigung)"
    hilfe_kurz: "Der Bruttoarbeitslohn einschließlich Sachbezüge steht unter Nummer 3 der Lohnsteuerbescheinigung."
    beispielwert: 4000000
    herkunft_slots: ["Lohnsteuerbescheinigung Nr. 3"]
    elster_kz: E0200201
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 1 S. 1 Nr. 1 EStG"
      zitatanker: "Gehälter, Löhne, Gratifikationen, Tantiemen und andere Bezüge und Vorteile für eine Beschäftigung"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"

  # ========================= Veranlagungsart (§ 26) =========================
  - feld_id: veranlagung
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: veranlagung}
    typ: enum
    einheit: null
    enum_werte: ["einzel", "zusammen"]
    askable: true
    fragetext_laie: "Gibst du die Erklärung allein oder gemeinsam mit Ehe-/Lebenspartner ab?"
    hilfe_kurz: "Gemeinsam = Zusammenveranlagung (oft günstiger bei unterschiedlichen Einkommen); allein = Einzelveranlagung."
    beispielwert: "einzel"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Veranlagungsart-Weiche (Mantelbogen); global, kein eigenes Betrags-Kz — die Wahl steuert den Tarif (Grund- vs. Splittingtarif), sie wird nicht als Betrag deklariert."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 26 Abs. 1 S. 1 EStG"
      zitatanker: "Ehegatten können zwischen der Einzelveranlagung (§ 26a) und der Zusammenveranlagung (§ 26b) wählen"
      datei: "sources/gesetze-im-internet/estg_p26_2026-07-17.txt"

  # ===== Abwesenheits-Flags (§ 2 Abs. 1 Einkunftsarten): bestätigte-Null-Blöcke =====
  # Anwendbarkeits-VORAUSSETZUNG des reinen Arbeitnehmerfalls (kein Festsetzungs-Input) → eigener
  # Pseudoregel-Scope p2_einkunftsarten. Positive Frage in der Haut ("Hattest du X?"), Antwort "nein"
  # → die Haut speichert kein_X=true (bestätigte Null der Einkunftsart) — Invertierung liegt in der Haut
  # (dev-1), hier nur das bool-Feld. Kein Kz (Anwendbarkeits-Flag, kein Deklarationsfeld).
  - feld_id: kein_gewinn
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_gewinneinkuenfte}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hattest du dieses Jahr Einkünfte aus einem Gewerbe, aus Land-/Forstwirtschaft oder aus selbständiger/freiberuflicher Arbeit?"
    hilfe_kurz: "Wenn du nur Arbeitslohn beziehst, antworte mit Nein — dann liegen keine Gewinneinkünfte vor."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld — es steuert nur, ob der vereinfachte Ring greift."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 1-3 EStG"
      zitatanker: "Einkünfte aus Land- und Forstwirtschaft, 2. Einkünfte aus Gewerbebetrieb, 3. Einkünfte aus selbständiger Arbeit"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: kein_kap
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_kapitaleinkuenfte}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hattest du dieses Jahr Kapitalerträge (Zinsen, Dividenden, Kursgewinne)?"
    hilfe_kurz: "Steht i. d. R. in der Steuerbescheinigung von Bank oder Broker. Nur Arbeitslohn → Nein."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 5 EStG"
      zitatanker: "Einkünfte aus Kapitalvermögen"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: kein_vuv
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_vermietungseinkuenfte}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hattest du dieses Jahr Einnahmen aus Vermietung oder Verpachtung?"
    hilfe_kurz: "Zum Beispiel Miete für eine vermietete Wohnung. Nur Arbeitslohn → Nein."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 6 EStG"
      zitatanker: "Einkünfte aus Vermietung und Verpachtung"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
  - feld_id: kein_sonstige
    quelle: {regel_id: p2_einkunftsarten, geltungsbedingung: keine_sonstigen_einkuenfte}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hattest du dieses Jahr sonstige Einkünfte (z. B. Renten, private Veräußerungsgeschäfte)?"
    hilfe_kurz: "Sonstige Einkünfte sind z. B. Renten oder Gewinne aus privaten Verkäufen. Nur Arbeitslohn → Nein."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 2 Abs. 1 S. 1 Nr. 7 EStG"
      zitatanker: "sonstige Einkünfte im Sinne des § 22"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"
