      zitatanker: "Einkünfte aus Land- und Forstwirtschaft, 2. Einkünfte aus Gewerbebetrieb, 3. Einkünfte aus selbständiger Arbeit"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"

  # ===== EÜR-Komponenten §§ 13-18 (Stufe 2-I EÜR-Kern): Gewinn = Einnahmen − Ausgaben (§ 4 Abs. 3) =====
  # Der laufende Gewinn wird komponentenweise ermittelt: betriebseinnahmen − (sonstige_betriebsausgaben +
  # afa_jahresbetrag). regel p4_3_gewinn (EuerGewinn, materialisiert) rechnet einnahmen − ausgaben; die zwei
  # Ausgaben-Felder speisen den EINEN betriebsausgaben-Slot als SUMMANDEN (slot_beitrag, dev-1-Accessor
  # summiert). Der Gewinn fließt additiv in einkuenfte_gewinn (§ 2-Ring). EÜR nur gewerbe/selbständig
  # (§ 15 Abs. 2 / § 18 Abs. 1, NICHT § 13-LuF → dev-1s luf_euer_offen-Guard). Kz=null VORERST (Anlage-EÜR-Kz
  # = eigene Kz-Review-Runde, wie Anlage-G/S/L); der Gewinn-Kz läuft über gewinn_betriebsart (Klasse-f).
  - feld_id: betriebseinnahmen
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p4_3_gewinn, signatur_slot: betriebseinnahmen}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch waren deine Betriebseinnahmen (Umsätze/Einnahmen aus dem Betrieb) dieses Jahr?"
    hilfe_kurz: "Alle Einnahmen aus deiner gewerblichen oder selbständigen Tätigkeit (Einnahmenüberschussrechnung). Ohne Umsatzsteuer, falls du sie gesondert ausweist. Dieser EÜR-Weg (Einnahmen minus Ausgaben) setzt voraus, dass du NICHT buchführungspflichtig bist (§ 4 Abs. 3). Bist du bilanzierungs-/buchführungspflichtig, trage stattdessen deinen fertigen Bilanz-Gewinn direkt im Gewinn-Feld ein — nicht hier."
    beispielwert: 8000000
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: EÜR-Komponente (Datenart E77, nicht E10). Wert geht in betriebsausgaben-Slot -> EÜR-Gewinn (E0800502)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 4 Abs. 3 S. 1 EStG"
      zitatanker: "Überschuss der Betriebseinnahmen über die Betriebsausgaben"
      datei: "sources/gesetze-im-internet/estg_p4_2026-07-14.txt"
  - feld_id: sonstige_betriebsausgaben
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p4_3_gewinn, signatur_slot: betriebsausgaben}
    slot_beitrag: summand
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch waren deine Betriebsausgaben (ohne Abschreibungen) dieses Jahr?"
    hilfe_kurz: "Alle durch den Betrieb veranlassten Ausgaben außer den Abschreibungen (die AfA erfasst das nächste Feld). Wareneinkauf, Miete, Personal, Fahrtkosten usw. NUR abzugsfähige Betriebsausgaben: OHNE Kosten der privaten Lebensführung/Repräsentation (§ 12 Nr. 1), OHNE Personensteuern wie die Einkommensteuer (§ 12 Nr. 3), OHNE durchlaufende Posten (§ 4 Abs. 3 S. 2)."
    beispielwert: 3000000
    herkunft_slots: null
    elster_kz: E6004901
    elster_kz_grund: "Anlage-EÜR Kz E6004901 „Übrige unbeschränkt abziehbare Betriebsausgaben“ (Datenart EUER/E77, E77-2025.xsd:2015). Speist zugleich den betriebsausgaben-Ring-Slot (slot_beitrag:summand) — Deklaration + Rechnung getrennt. Kz-Review 2026-07-19 (dev-2 kz_extract + Instructor-Verify)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 4 Abs. 3 S. 1 EStG"
      zitatanker: "Überschuss der Betriebseinnahmen über die Betriebsausgaben"
      datei: "sources/gesetze-im-internet/estg_p4_2026-07-14.txt"
  - feld_id: afa_jahresbetrag
    quelle: {regel_id: p4_3_gewinn, signatur_slot: betriebsausgaben}
    slot_beitrag: summand
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel hast du dieses Jahr für Anschaffungen deines Betriebs abgeschrieben (Fachwort: AfA)?"
    hilfe_kurz: "Der jährliche Abschreibungsbetrag für abnutzbare Wirtschaftsgüter deines Betriebs (z. B. Maschinen, Fahrzeuge, Geräte). Betriebs-AfA — NICHT die AfA einer vermieteten Immobilie (die läuft über die Anlage V)."
    beispielwert: 500000
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: EÜR-Ausgaben-Summand (Datenart E77, nicht E10). Wert geht in betriebsausgaben-Slot für den EÜR-Gewinn (E0800502)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 7 Abs. 1 S. 1 EStG"
      zitatanker: "Absetzung für Abnutzung in gleichen Jahresbeträgen"
      datei: "sources/gesetze-im-internet/estg_p7_2026-07-14.txt"

  # ===== Mitunternehmer § 15 Abs. 1 S. 1 Nr. 2 (Gewinnanteil + 3 Sondervergütungen) =====
  # regel p15_1_2_mitunternehmer (MitunternehmerEinkuenfte, materialisiert): einkuenfte_mitunternehmer =
  # gewinnanteil + verguetung_taetigkeit + verguetung_darlehen + verguetung_ueberlassung. Der Output fließt
  # additiv in einkuenfte_gewinn (betriebsart=gewerbe; § 15 = gewerblich, Anlage G — dev-1-Ring-Naht).
  # ⚠ § 15a-ANNAHME (Mitigation A, instructor-adjudiziert): gewinnanteil = der AUSGLEICHSFÄHIGE Anteil nach
  # § 15a (FA-festgestellt, Feststellungsbescheid) — die Verlust-Ausgleichsbeschränkung ist schon im Input,
  # der nicht-ausgleichsfähige Kommanditist-Verlust (neg. Kapitalkonto) gehört NICHT hierher (§ 15a Abs. 2
  # gesondert festgestellt/vorgetragen). FA-Input-Muster wie gewst_messbetrag. Kz=null VORERST (Anlage-G-
  # Mitunternehmer-Kz = eigene Kz-Review-Runde). Alle 4 optional (absent → 0).
  - feld_id: gewinnanteil
    quelle: {regel_id: p15_1_2_mitunternehmer, signatur_slot: gewinnanteil}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch ist dein Anteil am Gewinn oder Verlust einer Personengesellschaft (OHG, KG oder GbR)?"
    hilfe_kurz: "Der ausgleichsfähige Gewinn-/Verlustanteil aus deinem Feststellungsbescheid (nach § 15a). Bei Kommanditist mit negativem Kapitalkonto: der nicht-ausgleichsfähige Verlust gehört NICHT hierher — er wird gesondert festgestellt/vorgetragen (§ 15a Abs. 2). Einen Verlust trägst du als negativen Betrag ein."
    beispielwert: 4000000
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: §15-Mitu-Gewinnanteil, in E0800502 (Anlage G) aufgegangen. Schema E0800602 = ein Betrag je Beteiligung (G/Gew/M_Unt/Beteil), keine Sonderverg.-Trennung. Modell feiner als Formular."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 15 Abs. 1 S. 1 Nr. 2 S. 1 EStG"
      zitatanker: "die Gewinnanteile der Gesellschafter einer Offenen Handelsgesellschaft, einer Kommanditgesellschaft und einer anderen Gesellschaft, bei der der Gesellschafter als Unternehmer (Mitunternehmer) des Betriebs anzusehen ist"
      datei: "sources/gesetze-im-internet/estg_p15_2026-07-14.txt"
