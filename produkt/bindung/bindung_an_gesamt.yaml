    elster_kz_grund: "Einmal-im-Leben-Sperre (§ 34 Abs. 3 S. 4), Selbst-Bestätigung (FA-tracked); kein Betragsfeld. Ein True SPERRT den Abs.3-Zweig (fail-closed → Abs.1). null-Kz-MVP."
