  # ===== GewSt § 35-Anrechnung S1 (Gewerbesteuer auf ESt): Messbetrag-Input-Pfad =====
  # § 35 EStG: die tarifliche ESt ermäßigt sich um min(4× Messbetrag [„das Vierfache", geltende Fassung 2026 —
  # NICHT 3,8×, angehoben VZ 2020], tatsächlich zu zahlende GewSt = Messbetrag × Hebesatz; Ermäßigungshöchstbetrag).
  # S1 = Messbetrag-INPUT (vorberechnet aus dem GewSt-Bescheid, umgeht §7/§8/§9/§10a-Kette = S2). Nur gewerbe
  # (§18/§13 nicht gewerbesteuerpflichtig; dev-1s Zähler-Gating). dev-1s slot_fn liest die feld_ids 1:1.
  - feld_id: gewst_hebesatz
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: gewst_hebesatz}
    typ: int
    einheit: null
    bereich: {min: 1, max: 999, grund: "Reine Sanity-Bound (Hebesatz-Prozentzahl > 0). KEIN gesetzlicher Mindesthebesatz-Anker — § 16 Abs. 4 S. 2 GewStG (200 %) ist source-pending (GewStG-§ 16-Quelle nicht lokal); übliche Hebesätze 200-900 % sind nur Hinweis, keine harte Grenze."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie hoch ist der Gewerbesteuer-Hebesatz deiner Gemeinde (in Prozent)?"
    hilfe_kurz: "Steht auf deinem Gewerbesteuer-Bescheid oder bei der Gemeinde (übliche Werte 200-900 %, z. B. 450). Bestimmt die tatsächlich gezahlte Gewerbesteuer für die Anrechnung auf die Einkommensteuer (§ 35)."
    beispielwert: 450
    herkunft_slots: null
    elster_kz: null
    # E10/G/St_Erm_P35/Ang_GSt_GMB/Einz_Betr/Zu_zah_GSt_VZ — "Hebesatz in Prozent",
    # Ganzzahl wie unser typ:int. Erster Betrieb (s. gewst_messbetrag). Belegt 2026-08-05.
    elster_kz: E0801705
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 35 Abs. 1 S. 1 EStG"
      zitatanker: "tatsächlich zu zahlende Gewerbesteuer"
      datei: "sources/gesetze-im-internet/estg_p35_2026-07-14.txt"
  - feld_id: gewst_messbetrag
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: gewst_messbetrag}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch ist dein Gewerbesteuer-Messbetrag?"
    hilfe_kurz: "Aus deinem Gewerbesteuer-Messbescheid. Trag ihn ein, wenn du die Anrechnung der Gewerbesteuer auf die Einkommensteuer (§ 35) willst — das ist freiwillig; ohne Eintrag entfällt die Anrechnung."
    beispielwert: 2024750
    herkunft_slots: null
    elster_kz: null
    # E10/G/St_Erm_P35/Ang_GSt_GMB/Einz_Betr/Festzus_GMB_VZ — erster Betrieb. Die früher als
    # offen notierte "Disambiguierung E0801606 vs E0802009" löst der Pfad auf: E0802009 liegt
    # unter Weit_Betr/Einz (weitere Betriebe), also dieselbe Instanz-Achse wie Person B.
    # Mehrbetriebs-Fall ist heute nicht erfassbar (kein instanz_gruppe) — dann greift die
    # Instanz-Achse, sobald es ein Feld dafür gibt. Belegt 2026-08-05.
    elster_kz: E0801606
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 11 Abs. 1 S. 1 GewStG"
      zitatanker: "von einem Steuermessbetrag auszugehen"
      datei: "sources/gesetze-im-internet/gewstg_p11_2026-07-16.txt"

  # ===== § 10d Verlustvortrag (Mindestbesteuerung): GdE-Abzug vorrangig vor Sonderausgaben =====
  # § 10d Abs. 2: der festgestellte Verlustvortrag (Abs. 4) mindert den GdE, begrenzt auf
  # min(GdE, sockel + 70 %·(GdE−sockel)); sockel 1 Mio einzel / 2 Mio zusammen; Rest wird vorgetragen. regel
  # p10d_2_verlustvortrag_abzug (materialisiert, fix-geregatet 294cdd6a — min(GdE)-Cap + Floor). dev-1s Ring
  # zieht § 10d VORRANGIG vor Sonderausgaben/agB vom GdE ab (§ 2-Reihenfolge); greift in BEIDEN Ringen.
  - feld_id: verlustvortrag_bestand
    quelle: {regel_id: p10d_2_verlustvortrag_abzug, signatur_slot: verlustvortrag_bestand}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch ist dein festgestellter verbleibender Verlustvortrag zum 31.12. des Vorjahres?"
    hilfe_kurz: "Aus deinem Verlustfeststellungs-Bescheid (§ 10d Abs. 4). Trag ihn ein, wenn du Verluste aus Vorjahren mit diesem Jahr verrechnen willst; ohne Eintrag entfällt der Verlustabzug."
    beispielwert: 6000000
    herkunft_slots: null
    elster_kz: null
    kz_status: offen
    elster_kz_grund: "NICHT 1:1 bindbar — Typ-Unterschied, 2026-08-05 am E10-2025.xsd geprüft. E0190701 (E10/Sonst/Verl_Abz/Vortrag) ist ein JA-FELD (xs:type Ja1BaseCType_RABE): 'Es wurde ein verbleibender Verlustvortrag nach § 10d EStG zum 31.12. festgestellt.' — es erklärt nur DASS ein Vortrag besteht, nicht dessen HÖHE. Unser Feld ist ein cent-Betrag. Den Betrag kennt das FA aus dem eigenen Feststellungsbescheid (§ 10d Abs. 4); das E10 fragt ihn nicht ab. Ein Betrag in ein Ja-Feld geschrieben wäre schema-invalid. Offen bleibt, ob wir E0190701 als abgeleitetes Ja/Nein (bestand > 0) mitgeben sollten — das ist eine Deklarations-Entscheidung, kein Kz-Mapping."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10d Abs. 2 S. 1 EStG"
      zitatanker: "bis zu einem Gesamtbetrag der Einkünfte von 1 Million Euro unbeschränkt"
      datei: "sources/gesetze-im-internet/estg_p10d_2026-07-13.txt"

  # ===== Zusammenveranlagung (§ 26b): person-INDIVIDUELLE _partner-Zwillinge (Store-Modell A) =====
