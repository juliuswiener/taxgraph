    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: bruttoarbeitslohn_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch war der Bruttoarbeitslohn deines Ehe-/Lebenspartners dieses Jahr?"
    hilfe_kurz: "Person-individuell, weil jeder Ehegatte einen EIGENEN Arbeitnehmer-Pauschbetrag hat; steht auf der Lohnsteuerbescheinigung des Partners (Nummer 3)."
    beispielwert: 3800000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-N-Instanz B (Person-Multiplikation): derselbe Kz E0200201 wie Person A, zweites Sub-Dokument — kein distinktes Partner-Kz (E0220201 existiert nicht). herkunft_slots=null: die Beleg-Extraktion füllt nur Person A (ein LStB füllt nicht beide); Person-B-Beleg = person-scoped Nachtrag."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 1 S. 1 Nr. 1 EStG"
      zitatanker: "Gehälter, Löhne, Gratifikationen, Tantiemen und andere Bezüge und Vorteile für eine Beschäftigung"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"
  - feld_id: vor_an_anteil_rv_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: vor_gesamtbeitraege_partner}
    slot_beitrag: summand
    typ: cent
    einheit: EUR
