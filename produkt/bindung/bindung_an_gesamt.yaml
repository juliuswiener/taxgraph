  # ===== § 34 Abs. 3 Ermäßigter Durchschnittssatz (Stufe-2a) — Eligibility/Antrags-Flags =====
  # 3 bool-Flags, KEINE Modul-Inputs (regel p34_3_ermaessigter_durchschnittssatz nimmt ao/est_gesamt/bemessung).
  # Sie steuern den Abs.1-vs-Abs.3-Chooser im Ring (dev-1-Naht): abs3_pfad = antrag_ermaessigter_satz ∧
  # (Alter≥55 [DERIVE aus geburtsjahr] ∨ dauernd_berufsunfaehig) ∧ ¬ermaessigung_einmal_genutzt. Sonst
  # Abs.1-Fünftel-Default (von Amts wegen). ao_einkuenfte = REUSE rentner_veraeusserungsgewinn (§16-vg).
  # Alle Kz=null-MVP (Antrags-/Eligibility-Tatbestände, keine Betragsfelder). ⚠ Ring fail-closed auf ao>5Mio
  # (Überschuss = Abs.1-Fünftel-Nachtrag Stufe-2b). NICHT in flag_check kein_gewinn (keine Einkunfts-Indikatoren).
  - feld_id: antrag_ermaessigter_satz
    quelle: {regel_id: p34_3_ermaessigter_durchschnittssatz, geltungsbedingung: antrag_gestellt}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Möchtest du für deinen Veräußerungsgewinn den ermäßigten Steuersatz beantragen? (nur einmal im Leben möglich, ab 55 oder bei dauernder Berufsunfähigkeit)"
    hilfe_kurz: "Alternative zur Fünftelregelung (§ 34 Abs. 1): 56 % deines durchschnittlichen Steuersatzes (mind. 14 %) auf bis zu 5 Mio Euro Veräußerungsgewinn. Nur EINMAL im Leben, nur ab dem 55. Lebensjahr oder bei dauernder Berufsunfähigkeit. Ohne Antrag gilt die Fünftelregelung."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Antrags-Tatbestand (§ 34 Abs. 3 S. 1 „auf Antrag“), kein Betragsfeld; steuert Abs.1-vs-Abs.3-Chooser im Ring. Anlage-G-Antragszeile = eigene Kz-Review-Runde (null-Kz-MVP)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 1 EStG"
      zitatanker: "so kann auf Antrag abweichend von Absatz 1 die auf den Teil dieser außerordentlichen Einkünfte, der den Betrag von insgesamt 5 Millionen Euro nicht übersteigt, entfallende Einkommensteuer nach einem ermäßigten Steuersatz bemessen werden"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"
