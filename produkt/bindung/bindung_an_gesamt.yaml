  # Die dritte Zahl, die ERiC verlangt (gemessen 2026-08-19): mit Messbetrag und Hebesatz allein
  # antwortet checkESt rc=610001002 zweimal — "Messbetrag ... und die darauf entfallende ...
  # tatsaechlich zu zahlende Gewerbesteuer sind GEMEINSAM anzugeben" und "Der Hebesatz wurde
  # angegeben, die zu zahlende Gewerbesteuer jedoch nicht".
  #
  # BERECHNET, NICHT GEFRAGT — und das ist hier etwas anderes als bei § 22 Nr. 3 daneben. Dort
  # war der fehlende Wert eine Angabe, die nur der Nutzer kennt; hier ist er das Ergebnis einer
  # gesetzlichen Formel: § 16 Abs. 1 GewStG, Steuermessbetrag mal Hebesatz. Beide Faktoren hat
  # der Nutzer selbst aus seinen Bescheiden eingetragen. Wir raten also nicht, wir rechnen.
  #
  # NICHT ZU VERWECHSELN mit dem 4-fachen Messbetrag aus § 35 Abs. 1 S. 2 EStG
  # (_gewst_p35_anrechnung_cent in produkt/engine/runner.py): das ist die Obergrenze der
  # ANRECHNUNG auf die Einkommensteuer, eine andere Norm und eine andere Zahl. Hier steht die
  # Schuld gegenueber der Gemeinde, ungedeckelt.
  #
  # Grenze, benannt: bei einem Erlass oder abweichender Festsetzung durch die Gemeinde weicht die
  # wirklich gezahlte Steuer von der Formel ab. Das Finanzamt prueft die § 35-Anrechnung ohnehin
  # gegen den Gewerbesteuerbescheid. Ein vom Nutzer ueberschreibbarer Vorschlag waere der
  # sauberere Zuschnitt, waere aber die erste Anwendung von zustand:vorlaeufig auf einen
  # Engine-Wert — eigener Bau, bewusst nicht hier.
  - feld_id: gewst_zu_zahlen
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: gewst_zu_zahlen}
    typ: cent
    einheit: EUR
    askable: false
    vorjahr: uebernehmbar
    fragetext_laie: null
    hilfe_kurz: "Berechnet: Messbetrag mal Hebesatz (§ 16 Abs. 1 GewStG)."
    beispielwert: null
    herkunft_slots: null
    elster_kz: E0801704
    elster_kz_grund: "E0801704 [G/St_Erm_P35/Ang_GSt_GMB/Einz_Betr/Zu_zah_GSt_VZ], XSD-Label 'Gewerbesteuer' — direktes Geschwister von E0801705 (Hebesatz) im selben Container. Erster Betrieb, wie E0801606/E0801705."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 35 Abs. 1 S. 1 EStG"
      zitatanker: "tatsächlich zu zahlende Gewerbesteuer"
      datei: "sources/gesetze-im-internet/estg_p35_2026-07-14.txt"

  # ===== § 10d Verlustvortrag (Mindestbesteuerung): GdE-Abzug vorrangig vor Sonderausgaben =====
  # § 10d Abs. 2: der festgestellte Verlustvortrag (Abs. 4) mindert den GdE, begrenzt auf
  # min(GdE, sockel + 70 %·(GdE−sockel)); sockel 1 Mio einzel / 2 Mio zusammen; Rest wird vorgetragen. regel
  # p10d_2_verlustvortrag_abzug (materialisiert, fix-geregatet 294cdd6a — min(GdE)-Cap + Floor). dev-1s Ring
  # zieht § 10d VORRANGIG vor Sonderausgaben/agB vom GdE ab (§ 2-Reihenfolge); greift in BEIDEN Ringen.
  - feld_id: verlustvortrag_bestand
    quelle: {regel_id: p10d_2_verlustvortrag_abzug, signatur_slot: verlustvortrag_bestand}
    typ: cent
    einheit: EUR
    askable: true
    # KEIN vorjahr-Flag (bewusst, s. tests/test_vorjahr_writer.py): der Bestand aendert sich durch
    # Verrechnung im Vorjahr, vorjahr_writer.py kopiert den alten Wert aber wortwoertlich weiter.
    fragetext_laie: "Welchen Verlust aus früheren Jahren hat dir das Finanzamt zum 31.12. des Vorjahres bescheinigt?"
    hilfe_kurz: "Aus deinem Verlustfeststellungs-Bescheid (§ 10d Abs. 4). Trag ihn ein, wenn du Verluste aus Vorjahren mit diesem Jahr verrechnen willst; ohne Eintrag entfällt der Verlustabzug."
    beispielwert: 6000000
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: Typ-Unterschied. E0190701 ist Ja/Nein-Feld (RABE), unser Feld cent (Betrag). FA kennt Betrag aus Feststellungsbescheid. E10 fragt ihn nicht ab."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10d Abs. 2 S. 1 EStG"
      zitatanker: "bis zu einem Gesamtbetrag der Einkünfte von 1 Million Euro unbeschränkt"
      datei: "sources/gesetze-im-internet/estg_p10d_2026-07-13.txt"

