    hilfe_kurz: "Sondervergütung nach § 15 Abs. 1 Nr. 2: was du von der Gesellschaft für deine Mitarbeit (Geschäftsführung, Dienstleistung) erhalten hast — steuerlich Teil deiner gewerblichen Einkünfte, nicht Arbeitslohn."
