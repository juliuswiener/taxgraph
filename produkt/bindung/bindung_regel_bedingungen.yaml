# Cross-cutting Regel-Bedingungen (kein eigener Feld-Bestand, keine bindungen[]).
#
# Hintergrund: relevanz() (produkt/traverser/traverser.py) konnte bisher nur EIGENE Gate-Felder
# einer Regel als Ausschlussgrund heranziehen (askable bool-Geltungsbedingung, bestätigt False).
# p2_festzusetzung_zusammen trägt aber NUR nicht-bool Gates (text/enum/datum) — strukturell konnte
# die Regel nie ausgeschlossen werden, egal was der Nutzer antwortet. Folge: bei
# veranlagung="einzel" blieben alle Partner-Felder (Stammdaten, KV/PV, Vorsorge, Renten) im
# Dialog-Angebot, obwohl die Regel de facto nie zutrifft (gemessen:
# reports/adjudikation/relevanz_nicht_bool_blast_radius_2026-08-10.md).
#
# regel_bedingungen (schema.json $defs/regel_bedingung) schließt genau diese Lücke: EIN
# strukturiertes Feld+Wert-Paar pro Regel, ausgewertet regel-weit (nicht je Gate-Feld). Bestätigt
# UND abweichend -> ausgeschlossen; unbeantwortet/vorläufig schließt NICHT aus (fail-closed).
#
# Nur p2_festzusetzung_zusammen: die einzige der fünf strukturell gefangenen Regeln mit einer
# echten Ob-Bedingung. Die anderen vier (p10_1_3_3a_kv_pv, p19_2_versorgungsfreibetrag,
# p22_1_leibrente_besteuerungsanteil, p23_veraeusserungsgewinn) sind Rechen-Weichen ohne
# Eligibility-Charakter (Kz-Verzweigung/Kohortentabelle/Alter-Parameter/Opt-in-Instanz) — laut
# Blast-Radius-Bericht bewusst unangetastet.
version: 1
scheibe: "regel_bedingungen"
bindungen: []
regel_bedingungen:
  - regel_id: p2_festzusetzung_zusammen
    feld: veranlagung
    wert: zusammen
    grund: "§ 26 Abs. 2 S. 2 EStG: Ehegatten werden zusammen veranlagt, wenn beide Ehegatten die Zusammenveranlagung wählen — bei veranlagung=einzel (bestätigt) sind alle Partner-Angaben der Regel gegenstandslos."

  # ---------------------------------------------------------------------------------------------
  # Screening-Gruppe B (2026-08-14, reports/adjudikation/screening_vorsortierung_2026-08-14.md).
  #
  # Die vier Abwesenheits-Fragen aus p2_einkunftsart_* existierten längst und wurden auch gestellt
  # — nur hing keine einzige Folge-Regel daran. Wer "nein, keine Vermietung" antwortete, bekam
  # trotzdem jede Vermietungs-Frage. 28 Felder, kein neues Feld, kein Code: nur die Verbindung
  # zwischen der Frage und dem, was sie abschalten soll.
  #
  # Lesart der Bedingung: `wert` ist der Wert, bei dem die Regel GILT. Die kein_-Felder behaupten
  # die ABWESENHEIT, die Regeln behandeln die ANWESENHEIT — deshalb steht hier durchgehend
  # `wert: false`. Ausgeschlossen wird nur bei BESTÄTIGT abweichendem Wert; unbeantwortet oder
  # vorläufig schließt nie aus (fail-closed, siehe test_s8 in test_ui_zwei_signal_sicherheit).
  #
  # p22_1_leibrente steht auch im rentner-Kegel. Das ist unbedenklich: ein Rentner antwortet auf
  # "Hattest du sonstige Einkünfte (z.B. Rente)?" mit ja, also kein_sonstige=False — der Wert, bei
  # dem die Regel gilt. Gegengemessen am Ehrlich-Lauf beider Scheiben.

  - regel_id: p21_vermietung_einkuenfte
    feld: kein_vuv
    wert: false
    grund: "§ 21 Abs. 1 EStG setzt Einkünfte aus Vermietung und Verpachtung voraus — wer bestätigt, keine zu haben, hat keinen Tatbestand, zu dem Miete, Werbungskosten oder AfA zu erklären wären."

  - regel_id: p20_6_verlustverrechnung
    feld: kein_kap
    wert: false
    grund: "§ 20 Abs. 6 EStG verrechnet Verluste aus Kapitalvermögen — ohne Kapitaleinkünfte gibt es weder Verluste noch eine Verrechnung."

  - regel_id: p20_9_sparer_pauschbetrag
    feld: kein_kap
    wert: false
    grund: "§ 20 Abs. 9 EStG gewährt den Sparer-Pauschbetrag von den Einnahmen aus Kapitalvermögen — ohne solche Einnahmen ist nichts abzuziehen."

  - regel_id: p32d_1_kirchensteuer
    feld: kein_kap
    wert: false
    grund: "§ 32d Abs. 1 S. 3 EStG mindert die Abgeltungsteuer um die darauf entfallende Kirchensteuer — ohne Kapitalerträge fällt keine Abgeltungsteuer an, auf die sich das beziehen könnte."

  - regel_id: p15_1_2_mitunternehmer
    feld: kein_gewinn
    wert: false
    grund: "§ 15 Abs. 1 S. 1 Nr. 2 EStG erfasst Gewinnanteile von Mitunternehmern — wer bestätigt, keine Gewinneinkünfte zu haben, ist an keiner Mitunternehmerschaft beteiligt."

  - regel_id: p4_3_gewinn
    feld: kein_gewinn
    wert: false
    grund: "§ 4 Abs. 3 EStG ist die Gewinnermittlung durch Einnahmen-Überschuss-Rechnung — ohne Gewinneinkünfte gibt es keinen Gewinn zu ermitteln."

  - regel_id: p22_1_leibrente_besteuerungsanteil
    feld: kein_sonstige
    wert: false
    grund: "§ 22 Nr. 1 S. 3 Buchst. a EStG besteuert Leibrenten mit ihrem Ertragsanteil — Renten sind sonstige Einkünfte; wer bestätigt, keine zu haben, hat keine Rente zu erklären."

  - regel_id: p23_veraeusserungsgewinn
    feld: kein_sonstige
    wert: false
    grund: "§ 23 EStG erfasst private Veräußerungsgeschäfte als sonstige Einkünfte (§ 22 Nr. 2 EStG) — ohne sonstige Einkünfte liegt kein solches Geschäft vor."

  - regel_id: p22_3_leistungen
    feld: kein_sonstige
    wert: false
    grund: "§ 22 Nr. 3 EStG erfasst Einkünfte aus Leistungen als sonstige Einkünfte — wer bestätigt, keine sonstigen Einkünfte zu haben, hat auch keine solchen Leistungen."

  # ---------------------------------------------------------------------------------------------
  # Screening C1: "Hast du Kinder?" — der größte Einzelhebel des Fragebogens (22 Felder).
  #
  # Dieselbe Lesart wie oben: `wert` ist der Wert, bei dem die Regel GILT. `kein_kind` behauptet
  # die Abwesenheit, die Regeln setzen ein Kind voraus — daher durchgehend `wert: false`.
  #
  # p24b (Entlastungsbetrag für Alleinerziehende) steht bewusst mit in der Liste: er setzt ein
  # haushaltszugehöriges Kind mit Kindergeldanspruch voraus (§ 24b Abs. 1 S. 1), hängt also
  # sachlich unter derselben Frage — auch wenn sein Name das nicht sagt.

  - regel_id: p32_6_kinderfreibetraege
    feld: kein_kind
    wert: false
    grund: "§ 32 Abs. 6 S. 1 EStG gewährt den Freibetrag für jedes zu berücksichtigende Kind — ohne Kind gibt es keinen Freibetrag und keine der 13 Angaben dazu."

  - regel_id: p24b_entlastungsbetrag
    feld: kein_kind
    wert: false
    grund: "§ 24b Abs. 1 S. 1 EStG setzt ein zum Haushalt gehörendes Kind voraus, für das Kindergeld oder ein Freibetrag nach § 32 Abs. 6 zusteht — ohne Kind kein Entlastungsbetrag."

  - regel_id: p10_1_3_kv_pv_kind
    feld: kein_kind
    wert: false
    grund: "§ 10 Abs. 1 Nr. 3 S. 2 EStG lässt Kranken-/Pflegeversicherungsbeiträge eines Kindes als eigene Beiträge zu — ohne Kind gibt es keine solchen Beiträge zu übernehmen."

  - regel_id: p33b_abs5_kind_uebertragung
    feld: kein_kind
    wert: false
    grund: "§ 33b Abs. 5 S. 1 EStG überträgt den Behinderten-Pauschbetrag EINES KINDES auf die Eltern — ohne Kind gibt es nichts zu übertragen."

  - regel_id: p10_1_9_schulgeld
    feld: kein_kind
    wert: false
    grund: "§ 10 Abs. 1 Nr. 9 EStG betrifft das Entgelt für den Schulbesuch eines Kindes, für das ein Freibetrag oder Kindergeld zusteht — ohne Kind kein Schulgeldabzug."

  - regel_id: p33a_ausbildungsfreibetrag
    feld: kein_kind
    wert: false
    grund: "§ 33a Abs. 2 S. 1 EStG gewährt den Ausbildungsfreibetrag für ein auswärtig untergebrachtes Kind, für das ein Freibetrag oder Kindergeld zusteht — ohne Kind kein Freibetrag."
