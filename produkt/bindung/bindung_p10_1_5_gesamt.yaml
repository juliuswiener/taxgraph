    hilfe_kurz: "Das Finanzamt erkennt nur Betreuungskosten an, die du per Rechnung erhalten und auf das Konto des Betreuers überwiesen hast. Eine Barzahlung ohne Überweisung zählt nicht — hast du teils bar und teils überwiesen gezahlt, trage bitte nur den überwiesenen Teil ein."
