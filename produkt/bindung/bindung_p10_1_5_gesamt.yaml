# Bindungstabelle — §10 Abs.1 Nr.5 EStG Kinderbetreuungskosten (Stufe-1, Tier-0).
# PER-KIND (2026-08-06 Fix): Kz sitzt im Kind-Container, Ring liest per EM.instanzen.
# KEINE Gleichverteilung mehr — vorher: 2 Kinder/10000€ → 8000€ Abzug, korrekt: 6400€.
# kinderbetreuung_anzahl_kinder entfernt (Anzahl = len(EM.instanzen(store, bindung, "kind"))).
version: 1
scheibe: "Kinderbetreuungskosten (p10_1_5_kinderbetreuung)"

bindungen:
  # ========================= Kinderbetreuungskosten (p10_1_5_kinderbetreuung) =========================
  # 2026-08-11 Fix: Kind-Qualifikation war bislang UNGEWACHT — rules.yaml registriert
  # kind_unter_14_haushaltszugehoerig als Geltungsbedingung (Anwendbarkeitsvoraussetzung), aber
  # kein Feld fragte sie ab; _kinderbetreuung_summe summierte jedes Kind ungeprueft. Dieses Feld
  # schliesst die Luecke direkt am Accessor (Python-Gate wie kind_idnr bei §10 Abs.1 Nr.3 S.2).
  - feld_id: kind_unter_14_haushaltszugehoerig
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_unter_14_haushaltszugehoerig}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "War dein Kind während der Betreuung unter 14 Jahre alt und gehört zu deinem Haushalt — oder ist es wegen einer vor dem 25. Lebensjahr eingetretenen Behinderung außerstande, sich selbst zu unterhalten?"
    hilfe_kurz: "Betreuungskosten sind nur für Kinder unter 14 absetzbar, außer bei Behinderung (Eintritt vor dem 25. Geburtstag)."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: reine Anwendbarkeits-Voraussetzung (§ 10 Abs. 1 Nr. 5 S. 1), kein eigener Vordruck-Kz — steuert nur, ob E0506105 gezaehlt wird."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "welches das 14. Lebensjahr noch nicht vollendet hat oder wegen einer vor Vollendung des 25. Lebensjahres eingetretenen körperlichen, geistigen oder seelischen Behinderung außerstande ist, sich selbst zu unterhalten"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kinderbetreuungskosten
    instanz_gruppe: kind
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p10_1_5_kinderbetreuung, signatur_slot: aufwendungen}
    # Eingangsfrage (2026-08-26, E2E-Durchgang auf Julius' Bitte). Stand als LETZTE der zehn Betreuungsfragen. „Wie viel hast du fuer die Betreuung gezahlt?" ist die Existenzfrage des Themas; davor liefen neun Fragen nach Zeitraeumen, Dienstleistern und Eigenanteilen einer Betreuung, nach der nie gefragt war.
    eingangsfrage: true
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel hast du für die Betreuung deines Kindes gezahlt (Kindergarten, Tagesmutter, Babysitter)? Bitte nur Betreuungskosten, keine Verpflegung oder Unterricht."
    hilfe_kurz: "Du kannst 80% der Kosten absetzen, höchstens 4.800 Euro pro Kind."
    beispielwert: 600000
    herkunft_slots: ["Betreuungsrechnung: Kosten"]
    elster_kz: E0506105
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  # Formalien der Anlage Kind, Zeile Kinderbetreuungskosten (KBK_72569777_CType im XSD),
  # gemessen 2026-08-12. E0506105 (Gesamtsumme) allein reicht checkESt nicht: drei weitere
  # Beanstandungen kommen nach — Dienstleister-Einzelposten, Eigenanteil-Angabe und
  # Haushaltszugehoerigkeit. Alle fuenf Formalien, keine Rechenlogik — wie kind_vorname in
  # bindung_kap_vv_familie.yaml zeigt geltungsbedingung bewusst ins Leere (siehe
  # GELTUNGSBEDINGUNG_ZEIGT_INS_LEERE in test_bindungstabelle.py), statt signatur_slot: aufwendungen
  # mit kinderbetreuungskosten zu teilen — das waere nur fuer typ-homogene Summanden zulaessig.
  - feld_id: kind_betreuung_dienstleister
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: text
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wer hat dein Kind betreut? Bitte Art der Dienstleistung, Name und Anschrift des Dienstleisters angeben."
    hilfe_kurz: "Z.B. 'Kindertagesstätte Sonnenschein, Musterstr. 1, 12345 Musterstadt'."
    beispielwert: "Kindertagesstätte Sonnenschein, Musterstr. 1, 12345 Musterstadt"
    herkunft_slots: ["Betreuungsrechnung: Dienstleister"]
    elster_kz: E0506101
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kind_betreuung_zeitraum
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: text
    muster: '^\d{2}\.\d{2}-\d{2}\.\d{2}$'
    standardwert: "01.01-31.12"
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "In welchem Zeitraum wurde dein Kind betreut?"
    hilfe_kurz: "Meist das ganze Jahr. Format: TT.MM-TT.MM (z.B. 01.01-31.12)"
    beispielwert: "01.01-31.12"
    herkunft_slots: ["Betreuungsrechnung: Zeitraum"]
    elster_kz: E0506103
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kind_betreuung_eigenanteil
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Welchen Anteil der Betreuungskosten hast du (nicht der andere Elternteil) selbst getragen?"
    hilfe_kurz: "Nur nötig, wenn ihr nicht zusammen veranlagt werdet. Falls du nichts selbst getragen hast, '0' eingeben."
    beispielwert: 600000
    herkunft_slots: ["Betreuungsrechnung: Eigenanteil"]
    elster_kz: E0506604
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  # E0506104 (Einz/Betrag im Art_143900963_CType) ist der Einzelbetrag-Bruder von E0506101/
  # E0506103 oben — checkESt verlangt alle drei zusammen ("gemeinsam anzugeben"), gemessen
  # 2026-08-12: E0506105 (Gesamtsumme) allein reicht nicht, wenn Einz-Angaben vorhanden sind.
  - feld_id: kind_betreuung_einzelbetrag
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch war der Rechnungsbetrag der Betreuung?"
    hilfe_kurz: "Der Einzelbetrag zu Dienstleister und Zeitraum oben."
    beispielwert: 600000
    herkunft_slots: ["Betreuungsrechnung: Kosten"]
    elster_kz: E0506104
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  # E0506605/E0506606 (Einz/Betrag+Zeitraum im Kosten_m1203388157_CType) sind die Einzelposten-
  # Bruederpaar von E0506604 (Sum) oben — gemessen 2026-08-12: Summe allein wird beanstandet
  # ("die einzelnen Aufwendungen wurden jedoch nicht angegeben"), wenn keine Einz-Eintraege da sind.
  - feld_id: kind_betreuung_eigenanteil_betrag
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Welchen Betrag hast du selbst getragen (nicht der andere Elternteil)?"
    hilfe_kurz: "Der Einzelposten zur Eigenanteil-Summe oben."
    beispielwert: 600000
    herkunft_slots: ["Betreuungsrechnung: Eigenanteil"]
    elster_kz: E0506605
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kind_betreuung_eigenanteil_zeitraum
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: text
    muster: '^\d{2}\.\d{2}-\d{2}\.\d{2}$'
    standardwert: "01.01-31.12"
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "In welchem Zeitraum hast du deinen Anteil an den Betreuungskosten getragen?"
    hilfe_kurz: "Meist das ganze Jahr. Format: TT.MM-TT.MM (z.B. 01.01-31.12)"
    beispielwert: "01.01-31.12"
    herkunft_slots: null
    elster_kz: E0506606
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kind_betreuung_kein_gemeinsamer_haushalt_zeitraum
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: text
    muster: '^\d{2}\.\d{2}-\d{2}\.\d{2}$'
    standardwert: "01.01-31.12"
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "In welchem Zeitraum habt ihr getrennt gelebt — du und der andere Elternteil?"
    hilfe_kurz: "Wenn ihr das ganze Jahr getrennt gelebt habt — oder nie zusammen —, gib 01.01-31.12 an. Nur nötig, wenn ihr nicht zusammen veranlagt werdet. Format: TT.MM-TT.MM"
    beispielwert: "01.01-31.12"
    herkunft_slots: null
    elster_kz: E0505201
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kind_betreuung_haushaltszugehoerigkeit_zeitraum
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_betreuung_formalien_erklaert}
    typ: text
    muster: '^\d{2}\.\d{2}-\d{2}\.\d{2}$'
    standardwert: "01.01-31.12"
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "In welchem Zeitraum gehörte dein Kind zu deinem Haushalt?"
    hilfe_kurz: "Meist das ganze Jahr. Format: TT.MM-TT.MM (z.B. 01.01-31.12)"
    beispielwert: "01.01-31.12"
    herkunft_slots: null
    elster_kz: E0505202
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

luecken:
  # -- Kind-Qualifikation (unter 14 / Behinderung) ist seit 2026-08-11 GEBUNDEN, s.o.
  #    kind_unter_14_haushaltszugehoerig. Vorher stand hier faelschlich "wird vorgelagert
  #    ueberprueft" — es gab keine solche Pruefung, weder im Ring noch im Accessor.
  - regel_id: p10_1_5_kinderbetreuung
    geltungsbedingung: achtzig_prozent_deckel_4800_je_kind
    grund: "80%-Quote + 4.800€-je-Kind-Deckel (§ 10 Abs. 1 Nr. 5 S. 1) sind im pure-python Accessor catala_p10_1_5_kinderbetreuung materialisiert (Rechenlogik, keine Laien-Abfrage)."
