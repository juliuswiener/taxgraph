# Bindungstabelle — §10 Abs.1 Nr.5 EStG Kinderbetreuungskosten (Stufe-1, Tier-0).
# PER-KIND (2026-08-06 Fix): Kz sitzt im Kind-Container, Ring liest per EM.instanzen.
# KEINE Gleichverteilung mehr — vorher: 2 Kinder/10000€ → 8000€ Abzug, korrekt: 6400€.
# kinderbetreuung_anzahl_kinder entfernt (Anzahl = len(EM.instanzen(store, bindung, "kind"))).
version: 1
scheibe: "Kinderbetreuungskosten (p10_1_5_kinderbetreuung)"

bindungen:
  # ========================= Kinderbetreuungskosten (p10_1_5_kinderbetreuung) =========================
  # 2026-08-11 Fix: Kind-Qualifikation war bislang UNGEWACHT — rules.yaml registriert
  # kind_unter_14_haushaltszugehoerig als Geltungsbedingung (Anwendbarkeitsvoraussetzung), aber
  # kein Feld fragte sie ab; _kinderbetreuung_summe summierte jedes Kind ungeprueft. Dieses Feld
  # schliesst die Luecke direkt am Accessor (Python-Gate wie kind_idnr bei §10 Abs.1 Nr.3 S.2).
  - feld_id: kind_unter_14_haushaltszugehoerig
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: kind_unter_14_haushaltszugehoerig}
    ableitung: {aus: kind_geburtsdatum, art: alter_unter_am_jahresende, schwelle: 14, und_feld: kind_betreuung_haushaltszugehoerigkeit_zeitraum, grund: "§ 10 Abs. 1 Nr. 5 S. 1 EStG qualifiziert ein Kind, das das 14. Lebensjahr noch nicht vollendet hat ODER wegen einer vor dem 25. Lebensjahr eingetretenen Behinderung ausserstande ist, sich selbst zu unterhalten — und das zum Haushalt gehoert. Das Alter steht im Geburtsdatum, die Haushaltszugehoerigkeit im erhobenen Zeitraum. Ist das Kind juenger als 14 und der Haushaltszeitraum angegeben, steht die Qualifikation fest und die Frage entfaellt. Ist es aelter, wird weiter gefragt: dann kann die Behinderungs-Ausnahme greifen, und ein abgeleitetes Nein naehme dem Nutzer den Abzug ungefragt. Dieselbe Gefahr besteht in die andere Richtung, und sie war bis 2026-08-27 offen: ein WAHRHEITSGEMAESSES Nein des Nutzers nimmt ihm den Abzug genauso, wenn die Frage nur nach der Behinderung fragt und das Kind in Wahrheit ueber das Alter qualifiziert. Deshalb nennt der Fragetext seit dem beide Wege."}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    # Der Fragetext deckte bis 2026-08-27 nur EINEN der beiden Qualifikationswege ab (Behinderung),
    # das Feld und der Rechenkern meinen aber beide. Wer ein fünfjähriges Kind hat und wahrheits-
    # gemäss „nein" antwortete, bekam `false` gespeichert — und bescheid_abzuege._kinderbetreuung_
    # summe lässt bei allem ausser `True` das Kind aus der Summe fallen. Gemessen an einem Kind von
    # fünf Jahren mit 6.000 € Betreuungskosten: 4.800 € Abzug weg, je nach Einkommen 1.460 bis
    # 1.965 € zu viel Steuer.
    #
    # Die Frage nennt jetzt beide Wege und die gemeinsame Voraussetzung (Haushalt). Sie ist damit
    # länger — der Preis ist bewusst gewählt: sie wird nur noch gestellt, wenn Geburtsdatum oder
    # Haushaltszeitraum fehlen, die Ableitung also nichts weiss. Wer beides angegeben hat, sieht
    # sie gar nicht.
    #
    # NICHT über eine `feld_bedingung` gelöst („nur fragen, wenn das Kind 14 oder älter ist"):
    # `feld_bedingung` vergleicht nur auf Gleichheit gegen den Wert eines anderen Feldes
    # (schema.json: `wert`/`wert_nicht`, traverser._feld_ausgeschlossen: `==`/`!=`), und
    # `kind_geburtsdatum` ist ein Datum — ein Altersvergleich lässt sich dort nicht ausdrücken.
    # Er würde ausserdem nicht reichen: fehlt der Haushaltszeitraum, feuert die Ableitung nie, und
    # das Kind fiele dann ohne jede Frage still aus der Summe (gemessen: 0 € Abzug).
    fragetext_laie: "Gehört dein Kind zu deinem Haushalt — und ist es entweder jünger als 14 oder wegen einer Behinderung außerstande, für sich selbst zu sorgen?"
    hilfe_kurz: "Bis 14 zählt allein das Alter; danach nur noch eine Behinderung, die vor dem 25. Geburtstag eingetreten ist. In beiden Fällen muss das Kind zu deinem Haushalt gehören. Hast du Geburtsdatum und Haushaltszeitraum bereits angegeben, beantwortet sich die Frage von selbst und wird dir gar nicht gestellt."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: reine Anwendbarkeits-Voraussetzung (§ 10 Abs. 1 Nr. 5 S. 1), kein eigener Vordruck-Kz — steuert nur, ob E0506105 gezaehlt wird."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "welches das 14. Lebensjahr noch nicht vollendet hat oder wegen einer vor Vollendung des 25. Lebensjahres eingetretenen körperlichen, geistigen oder seelischen Behinderung außerstande ist, sich selbst zu unterhalten"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kinderbetreuungskosten
    instanz_gruppe: kind
    vorschlagbar_von: [beleg, llm]
    quelle: {regel_id: p10_1_5_kinderbetreuung, signatur_slot: aufwendungen}
    # Eingangsfrage (2026-08-26, E2E-Durchgang auf Julius' Bitte). Stand als LETZTE der zehn Betreuungsfragen. „Wie viel hast du fuer die Betreuung gezahlt?" ist die Existenzfrage des Themas; davor liefen neun Fragen nach Zeitraeumen, Dienstleistern und Eigenanteilen einer Betreuung, nach der nie gefragt war.
    eingangsfrage: true
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel hast du für die Betreuung deines Kindes gezahlt (Kindergarten, Tagesmutter, Babysitter)? Bitte nur Betreuungskosten, keine Verpflegung oder Unterricht."
    hilfe_kurz: "Du kannst 80% der Kosten absetzen, höchstens 4.800 Euro pro Kind."
    beispielwert: 600000
    herkunft_slots: ["Betreuungsrechnung: Kosten"]
    elster_kz: E0506105
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 1 EStG"
      zitatanker: "80 Prozent der Aufwendungen, höchstens 4 800 Euro je Kind, für Dienstleistungen zur Betreuung"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  # ============ Die beiden Abzugsvoraussetzungen aus S. 2 und S. 4 (2026-09-26) ============
  # Bis heute warnt der Fragetext oben („keine Verpflegung oder Unterricht"), GEFRAGT wurde
  # nichts: 6.000 EUR Nachhilfe und 6.000 EUR bar bezahlte Betreuung lieferten beide den
  # vollen Abzug von 4.800 EUR (Defer-Sweep Fund 4). Eine Warnung im Fliesstext ist keine
  # Voraussetzung — sie wird beim Ausfuellen ueberlesen und von keiner Stelle geprueft.
  #
  # `gate: false` auf BEIDEN Feldern, und zwar aus einem gemessenen Grund: als echtes Gate
  # schloss ein bestaetigtes `false` auf Instanz 1 die GANZE Regel aus (relevanz(), bis
  # feld-bedingung-liest-nur-instanz-1 am 2026-09-26), und damit verschwand auch die Frage des
  # ZWEITEN Kindes, dessen eigener Betrag einwandfrei ist. Beide Antworten muessen die Regel
  # stehen lassen; die Sperre sitzt in bescheid_deklaration._an_gesamt_sperrgrund und laeuft
  # je Kind-Instanz.
  #
  # KEINE `feld_bedingung` („nur fragen, wenn kinderbetreuungskosten > 0"): sie las bis zum
  # selben Tag nur Instanz 1 (traverser._feld_ausgeschlossen), ein zweites Kind fiel aus der
  # Frage. Heute liest sie jede Instanz; nachgezogen ist sie hier nicht.
  - feld_id: kind_betreuung_reine_betreuung
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: nur_betreuung_kein_unterricht}
    gate: false
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Ist der Betrag reine Betreuung — ohne Nachhilfe, Unterricht, Sport- oder Freizeitkurse?"
    hilfe_kurz: "Nur reine Betreuung zählt: Kindergarten, Tagesmutter, Babysitter, Hort. Nachhilfe, Musikunterricht, Sportkurse und Freizeitangebote sind keine Betreuung und werden nicht abgezogen. Bei einem gemischten Betrag trage bitte nur den Betreuungsteil ein."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: reine Anwendbarkeits-Voraussetzung (§ 10 Abs. 1 Nr. 5 S. 2), kein eigener Vordruck-Kz — steuert nur, ob E0506105 gezaehlt wird."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1 Nr. 5 S. 2 EStG"
      zitatanker: "Dies gilt nicht für Aufwendungen für Unterricht, die Vermittlung besonderer Fähigkeiten sowie für sportliche und andere Freizeitbetätigungen"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
  - feld_id: kind_betreuung_rechnung_ueberweisung
    instanz_gruppe: kind
    quelle: {regel_id: p10_1_5_kinderbetreuung, geltungsbedingung: rechnung_und_unbare_zahlung}
    gate: false
    typ: bool
    einheit: null
    askable: true
