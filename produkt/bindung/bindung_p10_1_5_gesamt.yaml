      zitatanker: "Voraussetzung für den Abzug der Aufwendungen nach Satz 1 ist, dass der Steuerpflichtige für die Aufwendungen eine Rechnung erhalten hat und die Zahlung auf das Konto des Erbringers der Leistung erfolgt ist"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"
