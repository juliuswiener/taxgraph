    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Klasse-f VERZWEIGUNG je rentner_veraeusserungs_betriebsart (kein fixes Feld-Kz; Kz-Wahl in est_mapping): gewerbe -> E0801301 [VAe_G_FB_Antr] 'Veräußerungsgewinn vor Abzug des Freibetrags nach § 16 Abs. 4 EStG' (Anlage G, Hash 592812681); selbstaendig -> E0901201 [VAe_G_FB_Antr] (Anlage S, Hash 163190041); land_forst -> KEIN Kz (proven-absent = benannte GAP). NICHT E0804501 [Vor_FB] (=Beteiligungsquoten-Anteil-Sub, Folge-Nachtrag)."
