    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: ist_hilflos_blind_taubblind_partner}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Ist dein zusammen veranlagter Ehe-/Lebenspartner hilflos, blind oder taubblind (Merkzeichen H, Bl oder TBl)?"
    hilfe_kurz: "Mit einem dieser Merkzeichen bekommt der Partner den höchsten Pauschbetrag, unabhängig vom Grad der Behinderung."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Klasse g (Instanz-Reuse): derselbe Kz E0109706 wie Person A, zweite AgB_67907_CType.Beh-Block-Instanz (maxOccurs=2, Person A/B) — kein distinktes Ehegatte-Kz. E0505807 (Ueb_PB_Beh_Hbl/Beh) ist §33b Abs.5-Kind-Übertragungsmechanismus, strukturell fremd (XSD-Kz-Section-Sweep Cluster C)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 3 S. 3 EStG"
