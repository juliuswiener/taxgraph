# Bindungstabelle — Scheibe 4: Rentner-Familie (§22/§24a/§33b/§16 Abs. 4/§34) (Task #11).
# Validiert gegen schema.json (kein neues Schema). Signaturen/Bedingungen: rules.yaml.
# Kohorten-Parameter (besteuerungsanteil_prozent/prozentsatz) sind aus dem Jahr-Feld abgeleitet ->
# Lücke; der Renten-Beginn-Jahr treibt die Kohortentabelle (askable). Pauschbeträge = Enum-Staffel,
# askable grad/pflegegrad/Flags. E-Nr Rentner-Anlagen (R/Behinderung) -> XSD-Nachtrag -> null+grund.
version: 1
scheibe: "Rente §22 (p22_1) + Altersentlastung §24a (p24a) + Pauschbeträge §33b (Behinderten/Hinterbliebenen/Pflege) + Veräußerungsfreibetrag §16 Abs. 4 (p16_4) + Fünftel §34 (p34_fuenftel_ao_est, nur Lücken)"

bindungen:
  # ========================= Rente §22 Nr. 1 — Besteuerungsanteil (p22_1) =========================
  - feld_id: rentner_jahresrente
    instanz_gruppe: rente
    quelle: {regel_id: p22_1_leibrente_besteuerungsanteil, signatur_slot: jahresrente}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel Rente hast du dieses Jahr insgesamt bekommen (der volle Jahresbetrag, bevor etwas abgezogen wird)?"
    hilfe_kurz: "Der gesamte Jahresbetrag deiner Rente. Steht in der Mitteilung deines Rentenversicherungsträgers."
    beispielwert: 1800000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kein festes 1:1-Kz: die Anlage-R-Zeile hängt an rentner_renten_art (Klasse-f-Verzweigung in est_mapping): gesetzl/berufsst/basisrente → E1800301, private Leibrente → E1801601, sonstige → E1803102."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa EStG"
      zitatanker: "Bemessungsgrundlage für den der Besteuerung unterliegenden Anteil ist der Jahresbetrag der Rente"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  - feld_id: rentner_renten_beginn_jahr
    instanz_gruppe: rente
    quelle: {regel_id: p22_1_leibrente_besteuerungsanteil, geltungsbedingung: besteuerungsanteil_aus_kohortentabelle}
    typ: int
    einheit: Jahr
    bereich: {min: 1955, max: 2060, grund: "Renten-Beginn-Jahr; Kohorten-Besteuerung ab 2005 (AltEinkG), davor 50 %; untere/obere Grenze deckt realistische Rentenbeginne."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Seit welchem Jahr bekommst du deine Rente?"
    hilfe_kurz: "Das Jahr, in dem deine Rente zum ersten Mal gezahlt wurde. Danach richtet sich, welcher Anteil der Rente steuerpflichtig ist."
    beispielwert: 2015
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kein festes 1:1-Kz: Anlage-R-Zeile hängt an rentner_renten_art (Klasse-f-Verzweigung): gesetzl/berufsst/basisrente → E1800501, private Leibrente → E1801701, sonstige → E1803202. Jahr-Granularität; ERiC-Datum-Format = Submission-Layer."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa EStG"
      zitatanker: "maßgebenden Prozentsatz aus der nachstehenden Tabelle"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  # renten_art_basis_oder_ertragsanteil = gb-Weiche aa/bb. Die bb-Berechnung braucht KEINE eigene Regel
  # (Instructor-Entscheid 2026-07-18): die Arithmetik (jahresrente x prozent/100) ist identisch zu
  # p22_1_leibrente_besteuerungsanteil, nur die %-Quelle unterscheidet (Ertragsanteil-Params statt
  # Besteuerungsanteil-Kohorten). Der Accessor gated die bb-Multiplikation gegen dieselben p22_1-test_seeds;
  # die bb-Werte + Rechtsgrundlage liegen in params/kohorten/rente_ertragsanteil_p22.yaml (§ 22 Nr. 1 S. 3
  # lit. a bb). Der Gate validiert gb-Existenz für Pseudoregel-Scopes nicht, die Abdeckung ist über die
  # Kz-Verzweigung + den Drift-Wächter gesichert.
  - feld_id: rentner_renten_art
    quelle: {regel_id: p22_1_leibrente_besteuerungsanteil, geltungsbedingung: renten_art_basis_oder_ertragsanteil}
    typ: enum
    einheit: null
    enum_werte: ["gesetzliche_rente", "berufsstaendische_versorgung", "private_basisrente", "private_leibrente", "sonstige_leibrente"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Um welche Art von Rente geht es hauptsächlich?"
    hilfe_kurz: "Gesetzliche Rente, berufsständisches Versorgungswerk (z. B. für Ärzte oder Anwälte) und Rürup-Rente werden gleich besteuert (nach dem Jahr des Rentenbeginns). Eine private Rentenversicherung wird niedriger besteuert — dann zählt dein Alter bei Rentenbeginn."
    beispielwert: "gesetzliche_rente"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Art-Weiche (steuert die Kz-Verzweigung Klasse f + den Rechenpfad aa/bb), kein eigenes Betragsfeld. bb (private/sonstige Leibrente) rechnet mit der p22_1-Arithmetik (jahresrente x prozent/100), Prozentsatz aus den Ertragsanteil-Params (§ 22 Nr. 1 S. 3 lit. a bb, params/kohorten/rente_ertragsanteil_p22.yaml) — KEINE eigene Regel (Instructor-Entscheid 2026-07-18); die aa-Werte rechnet p22_1 aus der Besteuerungsanteil-Kohorte."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa EStG"
      zitatanker: "aus den gesetzlichen Rentenversicherungen, der landwirtschaftlichen Alterskasse, den berufsständischen Versorgungseinrichtungen"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"

  # ===== §22 bb-Ertragsanteil-Key (Alter) + aa-Rentenfreibetrag-Fixierung (K2, Instructor-Ruling 2026-07-18) =====
  - feld_id: rentner_alter_bei_rentenbeginn
    instanz_gruppe: rente
    quelle: {regel_id: p22_1_leibrente_besteuerungsanteil, geltungsbedingung: ertragsanteil_alter_bei_rentenbeginn}
    typ: int
    einheit: null
    bereich: {min: 0, max: 100, grund: "Bei Rentenbeginn vollendetes Lebensjahr; die Ertragsanteil-Tabelle § 22 Nr. 1 S. 3 a bb schlüsselt nach diesem Alter (Werte 0..97, darüber gedeckelt auf 97)."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie alt warst du (vollendetes Lebensjahr), als deine private Rente zu laufen begann?"
    hilfe_kurz: "Nur bei einer privaten Leibrente: der steuerpflichtige Ertragsanteil richtet sich nach deinem Alter bei Rentenbeginn (z. B. mit 65 sind es 18 %)."
    beispielwert: 65
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kein eigenes Kz: das Alter wird aus dem Rentenbeginn (E1801701 'Beginn der Rente') minus Geburtsdatum (Mantelbogen) DERIVED (wie die Jahr↔Datum-Brücke). Lookup-Key der bb-Ertragsanteil-Tabelle params/kohorten/rente_ertragsanteil_p22.yaml, kein Deklarationsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. bb EStG"
      zitatanker: "Bei Beginn der Rente vollendetes Lebensjahr"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  - feld_id: rentner_rentenfreibetrag
    instanz_gruppe: rente
    quelle: {regel_id: p22_1_leibrente_besteuerungsanteil, geltungsbedingung: rentenfreibetrag_fixierung_folgejahr}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Falls deine gesetzliche Rente NICHT in diesem Jahr zum ersten Mal gezahlt wurde: wie hoch ist dein steuerfreier Renten-Freibetrag laut deinem letzten Steuerbescheid (in Euro)?"
    hilfe_kurz: "Ab dem zweiten Rentenjahr ist der steuerfreie Teil in Euro festgeschrieben (Rentenerhöhungen sind dann voll steuerpflichtig). Der Betrag steht in deinem Vorjahres-Bescheid. Im ersten Rentenjahr leer lassen."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kein Anlage-R-Kz (das Finanzamt errechnet + fixiert den steuerfreien Teil, der Steuerpflichtige deklariert ihn nicht als Kz). Laienfeld für den fixierten Euro-Betrag aus dem Vorjahres-Bescheid; nur aa-Folgejahr. Der Accessor rechnet damit exakt (jahresrente − rentenfreibetrag) statt %×aktuelle-Rente (K2, sonst Untersteuerung der Rentenerhöhungen)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa S. 4 EStG"
      zitatanker: "der steuerfreie Teil der Rente"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"

  # ===== §22 Rente Person-B (Zusammenveranlagung): Anlage-R-Instanz B, Klasse-g×f. Jeder Ehegatte hat
  # EIGENEN Besteuerungsanteil (eigene Kohorte/eigenes Alter) + EIGENE Rentenfreibetrag-Fixierung. KEIN
  # distinkter Ehegatte-Kz (Schema-Recon) → Reuse Person-A-Kz im person_b-Bucket (aa/bb je renten_art_partner,
  # est_mapping PARTNER_VERZWEIGUNG). K2 partner_check: nur bei veranlagung==zusammen. Accessor je Person (dev-1). =====
  - feld_id: rentner_renten_art_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, geltungsbedingung: partner_renten_art_weiche}
    typ: enum
    einheit: null
    enum_werte: ["gesetzliche_rente", "berufsstaendische_versorgung", "private_basisrente", "private_leibrente", "sonstige_leibrente"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Um welche Art von Rente geht es bei deinem zusammen veranlagten Ehe-/Lebenspartner hauptsächlich?"
    hilfe_kurz: "Nur bei Zusammenveranlagung: der Partner hat einen eigenen Besteuerungs-/Ertragsanteil je nach Rentenart (gesetzlich/Versorgungswerk/Rürup nach Beginn-Jahr, private Rente nach Alter bei Beginn)."
    beispielwert: "gesetzliche_rente"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Partner-Art-Weiche (steuert die Klasse-g×f-Kz-Verzweigung von rentner_jahresrente_partner aa/bb im person_b-Bucket), kein eigenes Betragsfeld/Kz."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa EStG"
      zitatanker: "aus den gesetzlichen Rentenversicherungen, der landwirtschaftlichen Alterskasse, den berufsständischen Versorgungseinrichtungen"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  - feld_id: rentner_jahresrente_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: rentner_jahresrente_partner}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Wie viel Rente hat dein zusammen veranlagter Ehe-/Lebenspartner dieses Jahr insgesamt bekommen (voller Jahresbetrag)?"
    hilfe_kurz: "Der gesamte Jahresbetrag der Rente des Partners, aus der Mitteilung seines Rentenversicherungsträgers."
    beispielwert: 1800000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-R-Instanz B (Klasse g×f): aa/bb-Kz je rentner_renten_art_partner im person_b-Bucket (gesetzl/berufsst/basis → E1800301, priv → E1801601, sonst → E1803102), DIESELBEN Person-A-Kz — kein distinktes Ehegatte-Kz. Kz-Wahl in est_mapping."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa EStG"
      zitatanker: "aus den gesetzlichen Rentenversicherungen, der landwirtschaftlichen Alterskasse, den berufsständischen Versorgungseinrichtungen"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  - feld_id: rentner_renten_beginn_jahr_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, geltungsbedingung: partner_besteuerungsanteil_aus_kohortentabelle}
    typ: int
    einheit: Jahr
    bereich: {min: 1955, max: 2060, grund: "Renten-Beginn-Jahr des Partners (Kohorten-Besteuerung, eigene Kohorte je Ehegatte)."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Seit welchem Jahr bekommt dein Ehe-/Lebenspartner seine Rente?"
    hilfe_kurz: "Das Jahr des ersten Rentenbezugs des Partners; bestimmt seinen eigenen Besteuerungsanteil (gesetzliche Rente)."
    beispielwert: 2015
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-R-Instanz B (Klasse g×f): aa → E1800501 / bb-priv → E1801701 / sonst → E1803202 im person_b-Bucket je rentner_renten_art_partner, DIESELBEN Person-A-Kz."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa EStG"
      zitatanker: "maßgebenden Prozentsatz aus der nachstehenden Tabelle"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  - feld_id: rentner_alter_bei_rentenbeginn_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, geltungsbedingung: partner_ertragsanteil_alter}
    typ: int
    einheit: null
    bereich: {min: 0, max: 100, grund: "Bei Rentenbeginn vollendetes Lebensjahr des Partners; bb-Ertragsanteil-Lookup (private Leibrente)."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie alt war dein Ehe-/Lebenspartner (vollendetes Lebensjahr), als seine private Rente zu laufen begann?"
    hilfe_kurz: "Nur bei einer privaten Leibrente des Partners: der steuerpflichtige Ertragsanteil richtet sich nach seinem Alter bei Rentenbeginn."
    beispielwert: 65
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kein eigenes Kz: DERIVED aus Partner-Rentenbeginn − Geburtsdatum. bb-Lookup-Key der Ertragsanteil-Tabelle (params/kohorten/rente_ertragsanteil_p22.yaml) für Person B."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. bb EStG"
      zitatanker: "Bei Beginn der Rente vollendetes Lebensjahr"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"
  - feld_id: rentner_rentenfreibetrag_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, geltungsbedingung: partner_rentenfreibetrag_fixierung_folgejahr}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    fragetext_laie: "Falls die gesetzliche Rente deines Partners NICHT in diesem Jahr zum ersten Mal gezahlt wurde: wie hoch ist sein steuerfreier Renten-Freibetrag laut letztem Bescheid (in Euro)?"
    hilfe_kurz: "Ab dem zweiten Rentenjahr des Partners ist sein steuerfreier Teil in Euro festgeschrieben. Steht im Vorjahres-Bescheid. Im ersten Rentenjahr des Partners leer lassen."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kein Anlage-R-Kz (Laienfeld für den fixierten Euro-Betrag des Partners, aa-Folgejahr). Der Accessor rechnet je Person exakt (jahresrente_partner − rentenfreibetrag_partner) statt %×aktuelle-Rente (K2 per Person)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa S. 4 EStG"
      zitatanker: "der steuerfreie Teil der Rente"
      datei: "sources/gesetze-im-internet/estg_p22_2026-07-13.txt"

  # ========================= Altersentlastungsbetrag §24a (p24a) =========================
  - feld_id: rentner_alter_64_erfuellt
    quelle: {regel_id: p24a_altersentlastungsbetrag, geltungsbedingung: alter_64_vor_bezugsjahr_vollendet}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Hattest du vor Beginn dieses Jahres schon deinen 64. Geburtstag?"
    hilfe_kurz: "Der Altersentlastungsbetrag steht dir zu, wenn du zu Beginn des Jahres bereits 64 Jahre alt warst."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Alters-Voraussetzung (Ja/Nein), ergibt sich aus dem Geburtsdatum im Mantelbogen; kein eigenes Betragsfeld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 24a S. 3 EStG"
      zitatanker: "das 64. Lebensjahr vollendet hatte"
      datei: "sources/gesetze-im-internet/estg_p24a_2026-07-13.txt"

  # ========================= Behinderten-Pauschbetrag §33b Abs. 1-3 =========================
  - feld_id: rentner_grad_der_behinderung
    quelle: {regel_id: p33b_behinderten_pauschbetrag, signatur_slot: grad_der_behinderung}
    typ: int
    einheit: null
    bereich: {min: 20, max: 100, grund: "Grad der Behinderung (GdB) amtlich 20..100 in 10er-Schritten; ab 20 wird ein Pauschbetrag gewährt."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Welchen Grad der Behinderung hat dein Schwerbehindertenausweis (eine Zahl zwischen 20 und 100)?"
    hilfe_kurz: "Steht in deinem Feststellungsbescheid oder Schwerbehindertenausweis. Je höher der Grad, desto höher der Pauschbetrag."
    beispielwert: 50
    herkunft_slots: null
    elster_kz: E0109708
    elster_kz_grund: "E0109708 [Ausw_Rentb_Besch], XSD-Label 'Grad der Behinderung' — stpfl. Person (Block 66196332, E01097); Vordruck Anlage Außergewöhnliche Belastungen agb_2025 erster GdB-Block (kurz-Kz 105). Sektions-Pfad-belegt (Hash-Gruppierung + Dok-Order + Vordruck-Header, Instructor msg 2719)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 3 S. 2 EStG"
      zitatanker: "Als Pauschbetrag werden gewährt bei einem Grad der Behinderung von mindestens"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"
  - feld_id: rentner_hilflos_blind_taubblind
    quelle: {regel_id: p33b_behinderten_pauschbetrag, signatur_slot: ist_hilflos_blind_taubblind}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Bist du hilflos, blind oder taubblind (Merkzeichen H, Bl oder TBl im Ausweis)?"
    hilfe_kurz: "Mit einem dieser Merkzeichen bekommst du den höchsten Pauschbetrag, unabhängig vom Grad der Behinderung."
    beispielwert: false
    herkunft_slots: null
    elster_kz: E0109706
    elster_kz_grund: "E0109706 [Geh_Steh_Blind_Hilfl], XSD-Label 'blind / taubblind / ständig hilflos (Merkzeichen Bl, TBl und/oder H)' — stpfl. Person (Block 66196332, E01097); Vordruck agb_2025 kurz-Kz 103. NICHT E0505807 (=Person B/Ehegatte). Sektions-Pfad-belegt (Instructor msg 2719)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 3 S. 3 EStG"
      zitatanker: "Blinde und Taubblinde erhalten einen Pauschbetrag von 7 400 Euro"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"

  # ========================= Hinterbliebenen-Pauschbetrag §33b Abs. 4 =========================
  - feld_id: rentner_hinterbliebenenbezuege
    quelle: {regel_id: p33b_hinterbliebenen_pauschbetrag, signatur_slot: hat_hinterbliebenenbezuege}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Bekommst du Hinterbliebenenbezüge (z. B. Witwen-, Witwer- oder Waisenrente nach gesetzlichen Vorschriften)?"
    hilfe_kurz: "Wenn dir laufende Hinterbliebenenbezüge bewilligt sind, steht dir ein Pauschbetrag von 370 Euro zu."
    beispielwert: false
    herkunft_slots: null
    elster_kz: E0109704
    elster_kz_grund: "E0109704 [Hinterbl], XSD-Label 'Ich beantrage den Hinterbliebenen-Pauschbetrag' — Person-A-eigen; Vordruck agb_2025 Hinterbliebenen-Pauschbetrag. NICHT E0505805 (=Übertragung/Kind-Transfer §33b Abs.5). Sektions-Pfad-belegt (Instructor msg 2719)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 33b Abs. 4 EStG"
      zitatanker: "einen Pauschbetrag von 370 Euro"
      datei: "sources/gesetze-im-internet/estg_p33b_2026-07-13.txt"

  # ========================= Pflege-Pauschbetrag §33b Abs. 6 =========================
  - feld_id: rentner_pflegegrad
    quelle: {regel_id: p33b_pflege_pauschbetrag, signatur_slot: pflegegrad}
    typ: int
    einheit: null
    bereich: {min: 1, max: 5, grund: "Pflegegrade 1..5 (SGB XI); Pflege-Pauschbetrag wird ab Pflegegrad 2 gewährt (gestaffelt bis 5)."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Welchen Pflegegrad hat die Person, die du zu Hause unentgeltlich pflegst (eine Zahl zwischen 1 und 5)?"
    hilfe_kurz: "Den Pflege-Pauschbetrag gibt es, wenn du jemanden mit Pflegegrad 2 bis 5 ohne Bezahlung pflegst."
    beispielwert: 3
    herkunft_slots: null
