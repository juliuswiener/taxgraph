luecken:
  # -- §22 Nr. 1 — Kohorten-Parameter + State-Annahme --
  - regel_id: p22_1_leibrente_besteuerungsanteil
    signatur_slot: besteuerungsanteil_prozent
    grund: "Abgeleitet aus rentner_renten_beginn_jahr via Kohortentabelle (§ 22 Nr. 1 S. 3 Buchst. a Doppelbuchst. aa); der Prozentsatz ist kein Laien-Feld, er ergibt sich aus dem Renten-Beginn-Jahr."
  - regel_id: p22_1_leibrente_besteuerungsanteil
    geltungsbedingung: rentenfreibetrag_fixierung_ist_folgejahr_state
    grund: "Der steuerfreie Teil der Rente wird im Jahr NACH dem Rentenbeginn festgeschrieben (State/Kohorten-Konvention); Rechenlogik der Regel, keine eigene Abfrage."
  # -- §24a — geteilte/berechnete Bemessung + Kohorten-Parameter --
  - regel_id: p24a_altersentlastungsbetrag
    signatur_slot: arbeitslohn
    grund: "Bemessungs-Input = Bruttoarbeitslohn (Anlage N), bereits in der N-Scheibe erfasst; für den Altersentlastungsbetrag keine eigene Abfrage, gespeist aus dem Gesamteinkommen."
  - regel_id: p24a_altersentlastungsbetrag
    signatur_slot: positive_andere_einkuenfte
    grund: "Abgeleitet = Summe der positiven anderen Einkünfte (die nicht aus nichtselbständiger Arbeit sind); rechnet die Regel aus den übrigen Einkünften, keine eigene Abfrage."
  - regel_id: p24a_altersentlastungsbetrag
    signatur_slot: prozentsatz
    grund: "Kohorten-Parameter (maßgebender Prozentsatz), abgeleitet aus dem Jahr nach Vollendung des 64. Lebensjahres via § 24a-Tabelle; kein Laien-Feld. (Höchstbetrag = params-Key, auto-exempt.)"
  - regel_id: p24a_altersentlastungsbetrag
    geltungsbedingung: prozentsatz_hoechstbetrag_aus_kohortentabelle
    grund: "Prozentsatz und Höchstbetrag stammen aus der Kohortentabelle (§ 24a); Parameter-Lookup, keine Abfrage. Künftige Verfeinerung: Geburtsjahr-Feld als Kohorten-Schlüssel (analog rentner_renten_beginn_jahr)."
  - regel_id: p24a_altersentlastungsbetrag
    geltungsbedingung: bemessung_netto_nach_ausschluessen
    grund: "Bemessung nach Ausschluss bestimmter Einkünfte (u. a. nicht solche aus nichtselbständiger Arbeit); Rechenlogik der Regel auf den bereits erfassten Einkünften, keine eigene Abfrage."
  # -- §33b — Staffel-/Override-Rechenlogik (in den Feldern materialisiert) --
  - regel_id: p33b_behinderten_pauschbetrag
    geltungsbedingung: gdb_stufenfunktion_von_mindestens
    grund: "Die Stufenfunktion (Pauschbetrag je GdB-Stufe) ist Rechenlogik der Regel; im Feld rentner_grad_der_behinderung materialisiert."
  - regel_id: p33b_behinderten_pauschbetrag
    geltungsbedingung: hilflos_blind_taubblind_override
    grund: "Der Höchst-Pauschbetrag bei H/Bl/TBl überschreibt die GdB-Staffel; im Feld rentner_hilflos_blind_taubblind materialisiert."
  - regel_id: p33b_hinterbliebenen_pauschbetrag
    geltungsbedingung: hinterbliebenenbezuege_bewilligt
    grund: "Voraussetzung 'laufende Hinterbliebenenbezüge bewilligt'; im Feld rentner_hinterbliebenenbezuege materialisiert."
  - regel_id: p33b_pflege_pauschbetrag
    geltungsbedingung: pflegegrad_staffel
    grund: "Die Pflegegrad-Staffel (Betrag je Pflegegrad 2..5 bzw. hilflos) ist Rechenlogik der Regel; in den Feldern rentner_pflegegrad + rentner_gepflegter_hilflos materialisiert."
  # -- §16 Abs. 4 — Antrag (Geltendmachung selbst) --
  - regel_id: p16_4_freibetrag
    geltungsbedingung: auf_antrag
    grund: "Der Antrag ist die Geltendmachung selbst (Eintrag in der Anlage); kein eigenes Ja/Nein-Feld neben rentner_veraeusserungsgewinn."
  # -- §34 Abs. 1 Fünftelregelung — berechnete Tarif-Inputs + §2-Integrations-Qualifikation --
  - regel_id: p34_fuenftel_ao_est
    signatur_slot: est_verbleibendes_zve
    grund: "Berechnete Tarifgröße (ESt für das um die ao-Einkünfte verminderte zvE); Tarif-Andockung, kein Laien-Feld."
  - regel_id: p34_fuenftel_ao_est
    signatur_slot: est_verbleibendes_zve_plus_fuenftel_ao
    grund: "Berechnete Tarifgröße (ESt für verbleibendes zvE zzgl. eines Fünftels der ao-Einkünfte); Tarif-Andockung, kein Laien-Feld."
  - regel_id: p34_fuenftel_ao_est
    geltungsbedingung: ao_einkuenfte_zusammengeballt
    grund: "Ao-Qualifikation/Zusammenballung (§ 34 Abs. 2: Abfindung Nr. 2, mehrjährige Vergütung Nr. 4 usw.) erfolgt in der § 2-Integration; hier sind beide ESt-Vergleichswerte bereits Inputs. Der ao-Einkünfte-BETRAG hat keinen rules.yaml-Input-Slot (nur der golden-Accessor 'ausserordentliche_einkuenfte') -> askable ao-Feld braucht Integrations-Andock-Entscheid (offene Frage an Instructor)."
  - regel_id: p34_fuenftel_ao_est
    geltungsbedingung: verbleibendes_zve_nicht_negativ
    grund: "Fallweiche zum Sonderpfad § 34 Abs. 1 S. 3 (negatives verbleibendes zvE); berechnet in der § 2-Integration, keine Abfrage."
