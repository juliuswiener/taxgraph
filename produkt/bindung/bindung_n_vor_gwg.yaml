  - feld_id: dhf_keine_pflicht_dienstwohnung
    quelle: {regel_id: p9_1_3_nr5_doppelte_haushaltsfuehrung, geltungsbedingung: keine_verpflichtende_dienst_oder_werkswohnung}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    # Wie vpf_keine_mahlzeitengestellung: Verneinung in der Mitte des Namens, Frage positiv.
    frage_invertiert: true
    # KEIN Gate (2026-08-20). § 9 Abs. 1 S. 3 Nr. 5 S. 4 Hs. 2 sagt über die Dienstwohnung genau
    # eines: "die Grenze von 2 000 Euro bei einer Unterkunft im AUSLAND gilt nicht, wenn eine
    # Dienst- oder Werkswohnung verpflichtend und zweckgebunden genutzt werden muss". Sie hebt eine
    # Obergrenze auf — sie ist für den Steuerpflichtigen GÜNSTIG und schließt den Abzug nirgends
    # dem Grunde nach aus. Als Gate tat sie das Gegenteil, und zwar im falschen Fall: das Feld steht
    # in DHF_BEDINGUNGEN und wirkte deshalb auch im INLAND, wo die Norm es gar nicht erwähnt. Wer im
    # Inland eine Werkswohnung hat und wahrheitsgemäß "ja" antwortete, verlor den kompletten
    # dHf-Abzug — gemessen 3.178,00 EUR zu viel Steuer bei 1.000 EUR Miete über 12 Monate.
    gate: false
    fragetext_laie: "Ist deine Zweitwohnung im Ausland eine Dienst- oder Werkswohnung, die du verpflichtend nutzen musst?"
    hilfe_kurz: "Nur wichtig, wenn deine Zweitwohnung im Ausland liegt."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Tatbestands-Voraussetzung (Ja/Nein) zur 2.000-Euro-Auslandsgrenze, kein Betragsfeld."
