  # ===== Dreimonatsfrist-Bestätigung: Unterbrechung oder Ausnahmesituation =====
  # S. 7: Unterbrechung ≥4 Wochen setzt Frist zurück. Der Ring kann das nicht automatisch erkennen.
  # Plausibilitäts-Frage: monate > 3 + Tage insgesamt > 0 + alle NACH_FRIST = 0 → unplausibel,
  # aber nicht unmöglich (legitimer Fall: nur in der 1. Woche gefahren, dann Unterbrechung).
  # Diese Bool-Frage bestätigt, dass die 0 Tage nach Frist tatsächlich stimmt.
  #
  # POLARITAET — bitte vor dem Umformulieren lesen. Das Feld ist ein GATE: traverser.py:96 setzt
  # `ausgeschlossen`, sobald ein askable bool-Geltungsbedingungsfeld `false` ist. Es kommt also
  # darauf an, welche Antwort der NORMALFALL gibt.
  # Das Feld hiess bis 2026-08-07 vpf_frist_unterbrochen und fragte "War die Taetigkeit
  # unterbrochen?". Der Normalfall — durchgehend am selben Ort — antwortete wahrheitsgemaess
  # `false` und verlor damit den GESAMTEN Verpflegungsmehraufwand. Gemessen: status
  # ausgeschlossen, 0 statt 16 offene vpf-Fragen. Genau verkehrt herum, denn S. 7 ist eine
  # Ausnahme ZUGUNSTEN des Steuerpflichtigen: ohne Unterbrechung laeuft die Frist weiter, die
  # Regel gilt.
  # Jetzt nach dem Muster von uebernachtung_keine_lange_unterbrechung (§ 9 Abs. 1 S. 3 Nr. 5a
  # S. 5, dort sechs Monate): Feldname und Frage zielen beide auf das NICHT-Unterbrochensein,
  # Normalfall antwortet "ja", Gate bleibt offen.
  # askable MUSS true bleiben. Der Guard in _dhf_vpf_grund (api.py:1721) sperrt mit
  # verpflegung_dreimonatsfrist_unterbrechung_offen, solange das Feld unbeantwortet ist — als
  # nicht-askable verschwaende die Frage aus /fragen, waehrend der Guard weiter sperrt:
  # gemessen 2026-08-07 ein echter Deadlock, der Fall waere nicht mehr aufloesbar.
  # Die Bindung zeigt jetzt auf keine_unterbrechung_mit_neubeginn — die Bedingung, die es in
  # p9_4a wirklich gibt. Vorher stand hier vpf_frist_unterbrochen_erklaert, eine Bedingung, die
  # in keiner Regel existiert (das war der Fund, aus dem test_n entstanden ist).
  - feld_id: vpf_frist_nicht_unterbrochen
    quelle: {regel_id: p9_4a_verpflegungsmehraufwand, geltungsbedingung: keine_unterbrechung_mit_neubeginn}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    # FRAGETEXT 2026-08-21 entschärft. Vorher stand hier: "Du warst mehr als 3 Monate am selben
    # Ort, hast aber keine Reisetage nach Ablauf der 3 Monate angegeben. Lief die Tätigkeit dort
    # durchgehend …" — zwei BEHAUPTUNGEN über den Nutzer als Einleitung.
    #
    # Für den Rechenpfad ist das richtig: bescheid_deklaration.py:388-405 stellt die Rückfrage NUR,
    # wenn vpf_monate_am_ort > 3 UND Tage gesamt > 0 UND alle Tage nach Frist == 0. Dort sind beide
    # Behauptungen belegt.
    #
    # Der DIALOG kennt diese Bedingung aber nicht: traverser.naechste_fragen filtert allein nach
    # askable / unbeantwortet / Regel nicht ausgeschlossen, es gibt keine feldbezogene
    # Sichtbarkeitsbedingung. Die Frage erscheint deshalb JEDEM — auch dem, der nie an einem Ort
    # war. Zwei Repräsentationen derselben Fachfrage, die nicht miteinander reden.
    #
    # GEMESSEN 2026-08-21 im echten Nutzerlauf (Julius, Fall demo-1787301323980): die Frage kam
    # ungefragt, wurde mit "ja" beantwortet, und liegt seither als BESTÄTIGTE Angabe im Fall —
    # ein Sachverhalt, den es nicht gibt. Nicht hypothetisch, ein Datensatz.
    #
    # Behoben wird der TEXT, nicht die Sichtbarkeit: `askable: true` MUSS bleiben (s. Kommentar
    # oben, sonst Deadlock), und eine feldbezogene Sichtbarkeitsbedingung wäre ein Eingriff in den
    # Traverser, der alle 316 Fragen beträfe — das ist eine eigene Entscheidung, kein Nebenfix.
    # Die POLARITÄT bleibt unverändert (true = nicht unterbrochen, Normalfall antwortet ja):
    # eine Umformulierung, die "ja" umdeutet, wäre genau die Falle, die hier schon dreimal Geld
    # gekostet hat.
    fragetext_laie: "Lief deine Tätigkeit am selben Ort durchgehend, ohne eine Pause von 4 Wochen oder mehr?"
    hilfe_kurz: "Diese Frage zählt nur, wenn du länger als 3 Monate am selben Ort tätig warst und für die Zeit danach keine Reisetage angegeben hast. Trifft das auf dich nicht zu, antworte mit Ja — die Angabe bleibt dann ohne Wirkung auf deine Steuer. Antworte mit Nein, wenn du mindestens 4 Wochen am Stück pausiert hast: dann beginnt die Dreimonatsfrist neu und 0 Tage nach Fristablauf sind korrekt."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Bestätigungsfrage (Tatbestand); kein Betragsfeld, nicht deklariert."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 9 Abs. 4a S. 7 EStG"
      zitatanker: "Eine Unterbrechung der beruflichen Tätigkeit an derselben Tätigkeitsstätte führt zu einem Neubeginn, wenn sie mindestens vier Wochen dauert"
      datei: "sources/gesetze-im-internet/estg_p9_abs4a_2026-07-09.txt"

