      zitatanker: "die Grenze von 2 000 Euro bei einer Unterkunft im Ausland gilt nicht, wenn eine Dienst- oder Werkswohnung verpflichtend"
      datei: "sources/gesetze-im-internet/estg_p9_abs1nr5_2026-07-09.txt"

