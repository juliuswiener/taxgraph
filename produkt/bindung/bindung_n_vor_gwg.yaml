  # EP-Parameter satz_bis_20_km/satz_ab_21_km/staffelgrenze_km/hoechstbetrag: auto-exempt (Namen in params/<vz>/-Keys).
  - regel_id: p10_1_2_altersvorsorge
    signatur_slot: hoechstbeitrag_knappschaft
    grund: "Parameter (params/<vz>/vorsorge_hoechstbetrag_p10.yaml, Value-Key 'hoechstbeitrag' — Input-Name weicht ab, daher explizite Lücke statt Auto-Exemption). Keine Laien-Abfrage."
  - regel_id: p10_1_2_altersvorsorge
    signatur_slot: ag_anteil_steuerfrei
    grund: "Speist sich aus demselben Laien-Feld wie vor_ag_anteil_rv (LStB Nr. 22, E2000801); im UI einmalige Abfrage, intern auf beide Slots (gesamtbeitraege_inkl_ag als Summand + ag_anteil_steuerfrei exakt) verteilt."
  - regel_id: p10_1_2_altersvorsorge
    geltungsbedingung: hoechstbeitrag_ist_parameter
    grund: "Deklariert den Höchstbeitrag-Parameter (params/<vz>/vorsorge_hoechstbetrag_p10.yaml); keine Laien-Abfrage, korrespondiert zum Parameter-Slot hoechstbeitrag_knappschaft."
  - regel_id: p9_4a_verpflegungsmehraufwand
    geltungsbedingung: taetigkeit_im_inland
    grund: "Nur Inlandspauschalen modelliert; Ausland (BMF-Ländersätze) außerhalb dieser Scheibe."
  - regel_id: p9_4a_verpflegungsmehraufwand
    geltungsbedingung: uebernachtung_oder_eintaegig_ueber_acht_stunden
    grund: "Wird durch die Kombination der Felder vpf_mit_uebernachtung + vpf_abwesenheit_stunden abgedeckt; keine eigene Abfrage (Mitternachtsregel rechnet die Regel)."
  - regel_id: p9_4a_verpflegungsmehraufwand
    geltungsbedingung: keine_steuerfreien_verpflegungserstattungen
    grund: "Satz 11 schließt den Abzug insoweit aus (§ 9 Abs. 4a S. 11 EStG). Das Bindungsfeld vpf_steuerfreie_erstattung_betrag erfasst den Betrag und der Accessor (_verpflegung_abzug) rechnet den Abzug anteilig. Die Bedingung ist durch den Input-Betrag selbst implizit erfüllt (wenn > 0, dann keine WK-Erstattung für diesen Betrag; wenn = 0, dann keine Minderung). Keine separate bool-Abfrage nötig."
  - regel_id: p9_1_3_nr5a_uebernachtung_nach_48
    geltungsbedingung: zeitraum_vollstaendig_nach_48_monate
    grund: "Binäre Zeitraum-Auswahl vor/nach 48 Monaten; der Ring (runner._uebernachtung_abzug) materialisiert sie deterministisch aus monate_bisher_am_ort (>= 48 → Kappung auf den Nr.-5-Betrag, sonst ungekappt). Keine eigene Laien-Abfrage; überspannende Zeiträume (bisher<48<bisher+monate) sperrt der Guard fail-closed (uebernachtung_zeitraum_offen)."
  - regel_id: p9_1_3_nr6_7_arbeitsmittel_afa
    signatur_slot: nutzungsdauer_jahre
    grund: "AfA-Zweig (§ 7, Verteilung über die Nutzungsdauer > 800 Euro); Anker liegt im §7-AfA-Freeze, Bindung im AfA-Scheiben-Nachtrag."
  - regel_id: p9_1_3_nr6_7_arbeitsmittel_afa
    signatur_slot: anschaffungsmonat
    grund: "AfA-Zweig (§ 7, zeitanteilige AfA im Anschaffungsjahr); Bindung im AfA-Scheiben-Nachtrag."
  - regel_id: p9_1_3_nr6_7_arbeitsmittel_afa
    signatur_slot: jahre_seit_anschaffung
    grund: "AfA-Zweig (§ 7, laufende AfA in Folgejahren); Bindung im AfA-Scheiben-Nachtrag."
  - regel_id: p7_1_lineare_afa
    signatur_slot: anzurechnende_monate
    grund: "Lineare AfA: Berechnungsintervall; vom Ring bestimmt, kein externer Laien-Input."
  - regel_id: p7_1_lineare_afa
    signatur_slot: anschaffungs_herstellungskosten
    grund: "Lineare AfA-Input-Parameter; intern aus am_anschaffungskosten gemappt."
  - regel_id: p7_1_lineare_afa
    signatur_slot: nutzungsdauer_jahre
    grund: "Lineare AfA: Nutzungsdauer; intern aus arbeitsmittel_nutzungsdauer gemappt."
  - regel_id: p7_1_lineare_afa
    geltungsbedingung: zwoelftelung_volle_monate
    grund: "Zwölftelungsregel für zeitanteilige AfA; intern errechnet."
  - regel_id: p7_1_lineare_afa
    geltungsbedingung: abnutzbares_wg_ueber_ein_jahr
    grund: "Nur abnutzbare Wirtschaftsgüter > 1 Jahr; Standardannahme."
  - regel_id: p7_1_lineare_afa
    geltungsbedingung: lineare_methode_keine_leistungs_afa
