  # --- keine_zweitwohnung: die Existenzfrage der doppelten Haushaltsführung ------------------
  # Am 2026-08-25 stand hier `dhf_eigener_hausstand` als Eingangsfrage („Hast du an deinem
  # Hauptwohnort einen eigenen Haushalt, der außerhalb des Arbeitsorts liegt?"). Das ist ein
  # Tatbestandsmerkmal der Norm, aber keine Existenzfrage: § 9 Abs. 1 S. 3 Nr. 5 S. 2 EStG
  # verlangt einen eigenen Hausstand ausserhalb des Arbeitsorts UND eine Wohnung AM Arbeitsort.
  # Nur das ZWEITE ist ungewoehnlich. Julius, 2026-08-26: „die meisten menschen wohnen nicht
  # unmittelbar am ort ihrer arbeit, aber hier geht es um 2. wohnsitz" — wer die alte Frage
  # bejahte (also fast jeder), bekam alle zwoelf Detailfragen.
  - feld_id: keine_zweitwohnung
    quelle: {regel_id: p9_1_3_nr5_zweitwohnung_vorhanden, geltungsbedingung: keine_zweitwohnung_am_arbeitsort}
    typ: bool
    screening: true
    einheit: null
    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    fragetext_laie: "Hast du am Arbeitsort eine ZWEITE Wohnung, zusätzlich zu deinem Zuhause?"
    hilfe_kurz: "Gemeint ist eine zweite Unterkunft, weil dein Arbeitsort zu weit von deinem Zuhause entfernt ist — Wohnung, Zimmer, Hotel oder Monteurunterkunft. Wer nur eine Wohnung hat und von dort zur Arbeit pendelt, antwortet mit Nein, auch wenn der Weg weit ist."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Flag, kein Deklarationsfeld — die doppelte Haushaltsführung selbst wird in Anlage N erklärt."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 9 Abs. 1 S. 3 Nr. 5 Satz 2 EStG"
      zitatanker: "Eine doppelte Haushaltsführung liegt nur vor, wenn der Arbeitnehmer außerhalb des Ortes seiner ersten Tätigkeitsstätte einen eigenen Hausstand unterhält"
      datei: "sources/gesetze-im-internet/estg_p9_abs1nr5_2026-07-09.txt"
