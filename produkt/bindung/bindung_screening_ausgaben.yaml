    screening: true
    einheit: null
    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    fragetext_laie: "Zahlst du Unterhalt an einen geschiedenen oder dauernd getrennt lebenden Ehe-/Lebenspartner?"
    hilfe_kurz: "Gemeint ist nur Unterhalt an den früheren Partner, nicht an Kinder oder andere Angehörige. Der Abzug setzt dessen Zustimmung voraus (Anlage U). Bei Nein entfallen vier Fragen."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Flag, kein Deklarationsfeld — die Unterhaltsleistungen selbst stehen in Anlage U."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10 Abs. 1a Nr. 1 S. 1 EStG"
      zitatanker: "Unterhaltsleistungen an den geschiedenen oder dauernd getrennt lebenden unbeschränkt einkommensteuerpflichtigen Ehegatten, wenn der Geber dies mit Zustimmung des Empfängers beantragt, bis zu 13 805 Euro im Kalenderjahr"
      datei: "sources/gesetze-im-internet/estg_p10_2026-07-11.txt"

  # --- keine_spenden: bis 2026-08-26 hatte dieses Thema KEINE einzige Eingangsfrage ------------------
  - feld_id: keine_spenden
    quelle: {regel_id: p10b_spenden_vorhanden, geltungsbedingung: keine_spenden_geleistet}
    typ: bool
    screening: true
    einheit: null
    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    fragetext_laie: "Hast du dieses Jahr an gemeinnützige Vereine, Stiftungen, Kirchen oder Parteien gespendet?"
    hilfe_kurz: "Zum Beispiel eine Dauerspende, eine Fluthilfe oder der Mitgliedsbeitrag an einen gemeinnützigen Verein. Ohne Spendenquittung geht es meist nicht."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Flag, kein Deklarationsfeld — die Spenden selbst stehen in der Anlage Sonderausgaben."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10b Abs. 1 S. 1 EStG"
      zitatanker: "Zuwendungen (Spenden und Mitgliedsbeiträge) zur Förderung steuerbegünstigter Zwecke"
      datei: "sources/gesetze-im-internet/estg_p10b_2026-07-13.txt"

  # --- keine_berufsausbildung: bis 2026-08-26 hatte dieses Thema KEINE einzige Eingangsfrage ------------------
  - feld_id: keine_berufsausbildung
    quelle: {regel_id: p10_1_7_berufsausbildung_vorhanden, geltungsbedingung: keine_berufsausbildung_kosten}
    typ: bool
    screening: true
    einheit: null
    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    fragetext_laie: "Hattest du dieses Jahr Kosten für deine eigene erste Berufsausbildung oder ein Erststudium?"
    hilfe_kurz: "Gemeint ist die ERSTE Ausbildung oder das erste Studium — zum Beispiel Studiengebühren, Fachbücher, Fahrten zur Hochschule. Eine Fortbildung im schon erlernten Beruf gehört nicht hierher, sie zählt als Werbungskosten."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Flag, kein Deklarationsfeld — die Aufwendungen selbst stehen in der Anlage Sonderausgaben."
