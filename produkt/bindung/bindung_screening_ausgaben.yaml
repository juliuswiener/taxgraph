    hilfe_kurz: "Das steht in einem eigenen Bescheid über die „gesonderte Feststellung des verbleibenden Verlustvortrags“. Wer so einen Bescheid nicht hat, antwortet mit Nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Flag, kein Deklarationsfeld — der Verlustvortrag wird vom Finanzamt gesondert festgestellt."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10d Abs. 2 S. 1 EStG"
