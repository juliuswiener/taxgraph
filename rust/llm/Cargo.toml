[package]
name = "llm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
store = { path = "../store" }
serde = { workspace = true }
# `float_roundtrip`: ohne das Feature liest `serde_json` Floats nicht immer korrekt gerundet
# (1 ULP daneben), Pythons `json.loads` schon — `str(wert)` im Prompt wiche dann ab.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
domain = { path = "../domain", features = ["testhilfe"] }
proptest = { workspace = true }
