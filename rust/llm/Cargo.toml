[package]
autotests = false
name = "llm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
store = { path = "../store" }
serde = { workspace = true }
# `float_roundtrip`: ohne das Feature liest `serde_json` Floats nicht immer korrekt gerundet
# (1 ULP daneben), Pythons `json.loads` schon — `str(wert)` im Prompt wiche dann ab.
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex = { workspace = true }
fancy-regex = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
domain = { path = "../domain", features = ["testhilfe"] }
proptest = { workspace = true }

# Testdateien liegen in tests/it.rs zu EINEM Test-Binary zusammen (weniger Links nach einer Aenderung der Bibliothek). Eigene Ziele:
# Dateien, die Umgebung oder Arbeitsverzeichnis des Prozesses aendern, und Dateien, die per `--test <name>` aufgerufen werden.
# rust/bindung/tests/testbinaries_vollstaendig.rs haelt fest, dass jede Datei in it.rs ODER hier steht.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "client_env"
path = "tests/client_env.rs"

[[test]]
name = "kontoauszug_entscheidungen"
path = "tests/kontoauszug_entscheidungen.rs"

[[test]]
name = "ors_env"
path = "tests/ors_env.rs"
