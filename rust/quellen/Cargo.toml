[package]
autotests = false
name = "quellen"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "quellen"
path = "src/lib.rs"

[[bin]]
name = "taxgraph-quellen"
path = "src/main.rs"

# Bewusst klein: `make sources-check` soll wie das Python-Skript davor ohne C-Werkzeugkette laufen. `llm` (rustls, ring) und
# `tempfile` stehen darum nur unter `[dev-dependencies]`; Begruendung der drei Hilfen in `src/py.rs`.
[dependencies]
sha2 = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
wait-timeout = { workspace = true }

[dev-dependencies]
llm = { path = "../llm" }
tempfile = { workspace = true }

# Testdateien liegen in tests/it.rs zu EINEM Test-Binary zusammen (weniger Links nach einer Aenderung der Bibliothek).
# rust/bindung/tests/testbinaries_vollstaendig.rs haelt fest, dass jede Datei in it.rs ODER hier steht.
[[test]]
name = "it"
path = "tests/it.rs"
