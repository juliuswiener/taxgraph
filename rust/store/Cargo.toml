[package]
autotests = false
name = "store"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
bindung = { path = "../bindung" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
domain = { path = "../domain", features = ["testhilfe"] }
proptest = { workspace = true }

# Testdateien liegen in tests/it.rs zu EINEM Test-Binary zusammen (weniger Links nach einer Aenderung der Bibliothek). Eigene Ziele:
# Dateien, die Umgebung oder Arbeitsverzeichnis des Prozesses aendern, und Dateien, die per `--test <name>` aufgerufen werden.
# rust/bindung/tests/testbinaries_vollstaendig.rs haelt fest, dass jede Datei in it.rs ODER hier steht.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "relative_pfade"
path = "tests/relative_pfade.rs"

[[test]]
name = "zeitstempel_utc"
path = "tests/zeitstempel_utc.rs"
