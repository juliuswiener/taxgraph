[workspace]
resolver = "2"
members = ["catala-sys", "domain", "parity"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
too_many_lines = "deny"
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
rust_decimal = "=1.36.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=1.0.69"
proptest = "=1.9.0"
cc = "=1.4.4"
