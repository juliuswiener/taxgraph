[workspace]
resolver = "2"
members = ["catala-sys", "domain", "bindung", "parity", "store", "engine", "elster", "interview", "konsistenz", "intervall"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
too_many_lines = "deny"
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
rust_decimal = "=1.36.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml_ng = "=0.10.0"
thiserror = "=1.0.69"
proptest = "=1.9.0"
cc = "=1.4.4"
sha2 = "=0.10.9"
regex = "=1.11.1"
chrono = "=0.4.41"
quick-xml = "=0.41.0"
roxmltree = "=0.21.1"
libloading = "=0.8.9"
