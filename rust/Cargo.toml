[workspace]
resolver = "2"
members = ["catala-sys", "domain", "bindung", "parity", "store", "engine", "elster", "interview", "konsistenz", "intervall", "auth", "llm", "eingang", "bescheid", "api"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
too_many_lines = "deny"
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
rust_decimal = "=1.36.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml_ng = "=0.10.0"
thiserror = "=1.0.69"
proptest = "=1.9.0"
cc = "=1.4.4"
sha2 = "=0.10.9"
regex = "=1.11.1"
chrono = "=0.4.41"
quick-xml = "=0.41.0"
roxmltree = "=0.21.1"
libloading = "=0.8.9"
bcrypt = "=0.19.3"
jsonwebtoken = { version = "=9.3.1", default-features = false }
getrandom = "=0.3.4"
fancy-regex = "=0.16.2"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
wait-timeout = "=0.2.1"
tempfile = "=3.27.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "service", "tokio"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
http-body-util = "=0.1.5"
utoipa = "=6.0.0"

[profile.dev]
debug = "line-tables-only"
# Stufe 1 statt 0: die Vergleichslaeufe gegen Python (rust/parity) und die Tests rechnen
# Dezimalarithmetik und die Catala-Regeln; unoptimiert braucht der Rust-Teil dafuer 3- bis 5-mal so
# viel Rechenzeit. Gemessen 2026-10-02 (12 Kerne, Rechenzeit des Rust-Prozesses, Stufe 0 -> 1):
# bescheid_deklaration_paritaet 116-135 s -> 24-29 s und bescheid_zweige_paritaet 357-413 s ->
# 50-55 s (je 2 Laeufe); die 15 uebrigen Suiten zusammen 232 s -> 67 s (je 1 Lauf). Die Wanduhrzeit
# sinkt weniger, weil viele Suiten am Python-Orakel haengen. Kosten: ein Kaltbau des Workspace
# braucht 2,6-mal so viel Rechenzeit (user 182 s -> 478 s), target/ waechst von 2,9 auf 3,3 GB; ein
# Bau nach einer Aenderung kostet etwa gleich viel.
# Warum hier und nicht nur unter [profile.test]: api_http_paritaet baut den Dienst selbst mit
# `cargo build` (also im dev-Profil); mit [profile.test] allein blieb er auf Stufe 0 und die Suite
# brauchte 25,5 s Rechenzeit statt 9,6 s.
# debug-assertions und overflow-checks bleiben an: Cargo reicht bei Stufe 1 `-C debug-assertions=on`
# ausdruecklich durch, und ein `= false` hier wuerde tests/test_ci_konfiguration.py rot machen.
# Die Stufe steckt im Hash jedes Artefakts; darum haengt der Cache-Schluessel des rust-Jobs in
# .github/workflows/ci.yml an dieser Datei.
opt-level = 1
