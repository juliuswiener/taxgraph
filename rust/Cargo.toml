[workspace]
resolver = "2"
members = ["catala-sys", "domain", "bindung", "parity", "store", "engine", "elster", "interview", "konsistenz", "intervall", "auth", "llm", "eingang", "bescheid", "api"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
too_many_lines = "deny"
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
rust_decimal = "=1.36.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml_ng = "=0.10.0"
thiserror = "=1.0.69"
proptest = "=1.9.0"
cc = "=1.4.4"
sha2 = "=0.10.9"
regex = "=1.11.1"
chrono = "=0.4.41"
quick-xml = "=0.41.0"
roxmltree = "=0.21.1"
libloading = "=0.8.9"
bcrypt = "=0.19.3"
jsonwebtoken = { version = "=9.3.1", default-features = false }
getrandom = "=0.3.4"
fancy-regex = "=0.16.2"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
wait-timeout = "=0.2.1"
tempfile = "=3.27.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
http-body-util = "=0.1.5"
utoipa = "=6.0.0"

[profile.dev]
debug = "line-tables-only"
