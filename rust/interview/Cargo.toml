[package]
autotests = false
name = "interview"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
bindung = { path = "../bindung" }
store = { path = "../store" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
domain = { path = "../domain", features = ["testhilfe"] }
proptest = { workspace = true }
serde_json = { workspace = true }

# Testdateien liegen in tests/it.rs zu EINEM Test-Binary zusammen (weniger Links nach einer Aenderung der Bibliothek). Eigene Ziele:
# Dateien, die Umgebung oder Arbeitsverzeichnis des Prozesses aendern, und Dateien, die per `--test <name>` aufgerufen werden.
# rust/bindung/tests/testbinaries_vollstaendig.rs haelt fest, dass jede Datei in it.rs ODER hier steht.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "orakel_werte"
path = "tests/orakel_werte.rs"
