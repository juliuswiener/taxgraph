    fragetext_laie: "Nur bei einem Grundstück: Hast du darauf in den letzten zehn Jahren vor dem Verkauf ein Gebäude gebaut, ausgebaut oder erweitert?"
    hilfe_kurz: "Ja bei zum Beispiel einem Neubau, einem Anbau, einem Dachgeschossausbau oder einer neuen Außenanlage. Dieser Teil ist auch nach Ablauf der Frist steuerpflichtig. Die Software rechnet die Aufteilung zwischen Boden und Gebäude nicht und sperrt dann mit einer Erklärung. Bei anderen Gegenständen wähle Nein."
