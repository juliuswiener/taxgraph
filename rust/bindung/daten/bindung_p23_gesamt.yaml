    hilfe_kurz: "Ja verlängert die Frist von einem Jahr auf zehn Jahre. Zum Beispiel ein vermietetes Wohnmobil oder eine verpachtete Maschine. Bei einem Grundstück wähle Nein."
    beispielwert: false
