  # ===== Lücken + Geltungsbedingungen =====
luecken:
  - regel_id: p23_veraeusserungsgewinn
    geltungsbedingung: veraeusserung_innerhalb_frist
    grund: "Seit Nr. 54 keine Selbstauskunft mehr: TaxGraph rechnet die Frist (Grundstück 10J, andere Wirtschaftsgüter 1J, mit Einkunftsquelle 10J) aus p23_anschaffungsdatum und p23_veraeusserungsdatum (engine::zugriff::teil2::privatverkauf::p23_befreiung)."
  - regel_id: p23_veraeusserungsgewinn
    geltungsbedingung: nicht_ausschliesslich_eigene_wohnzwecke
    grund: "Seit Nr. 54 das Feld p23_eigennutzung (beide Varianten des Gesetzes steuerfrei, Teilnutzung sperrt mit p23_verkauf_nicht_gerechnet), gelesen von p23_befreiung."
  - regel_id: p23_veraeusserungsgewinn
    geltungsbedingung: kein_gegenstand_taeglichen_gebrauchs
    grund: "Seit Nr. 54 das Feld p23_taeglicher_gebrauch (nur andere Wirtschaftsgüter, §23 Abs.1 Nr.2 S.2), gelesen von p23_befreiung."
  - regel_id: p23_veraeusserungsgewinn
    geltungsbedingung: anschaffung_veraeusserung_originaerer_erwerb
    grund: "Die alte Lesart (nur originärer Erwerb, kein Erbe/Schenkung) war falsch: bei unentgeltlichem Erwerb rechnet §23 Abs.1 S.3 dem Einzelrechtsnachfolger die Anschaffung des Rechtsvorgängers zu. Es gibt keine Frage 'originärer Erwerb'; der Nutzer nennt in p23_anschaffungsdatum das Datum des Rechtsvorgängers (Nr. 54)."
  - regel_id: p23_freigrenze
    signatur_slot: gesamtgewinn
    grund: "Berechnete Größe (Σ der Einzelgewinne aller Instanzen). Ring-Aggregator, kein Laien-Feld."
  - regel_id: p23_freigrenze
    geltungsbedingung: gesamtgewinn_nicht_negativ
    grund: "Gesamtgewinn ≥ 0 (die Freigrenze 1000€ gilt auf POSITIVEN Gesamtgewinn). Bei negativem Gesamtgewinn = 0 (Verlustfall → kein steuerpflichtiger Gewinn). Im Ring: gesamtgewinn = max(0, Σgewinne − Σverluste) VOR Freigrenze."
  - regel_id: p23_3_verlusttopf
    signatur_slot: gewinn_pvg
    grund: "Berechnete Größe (Summe positiver Gewinne). Ring-Aggregator, kein Laien-Feld."
  - regel_id: p23_3_verlusttopf
    signatur_slot: verlust_pvg
    grund: "Berechnete Größe (Summe negativer Gewinne als Betrag). Ring-Aggregator, kein Laien-Feld."
  - regel_id: p23_3_verlusttopf
    geltungsbedingung: kein_verlustvor_ruecktrag_s8
    grund: "Mehrjahr-Verlustvor-/rücktrag (§23 Abs.3 S.8) = Stufe-2-Backlog. Stufe-1: nur same-year VTOP."
  - regel_id: p23_3_verlusttopf
    geltungsbedingung: verlust_nur_gleichjaehriger_pvg_gewinn
    grund: "Nur Verluste aus §23-Geschäften verrechenbar, NICHT mit anderen Einkunftsarten. Im Ring: gewinn_pvg/verlust_pvg = §23-instanz-summen, kein Cross-Einkunftsarten-Mix."
  - regel_id: p23_3_verlusttopf
    geltungsbedingung: kein_ausgleich_mit_anderen_einkunftsarten
    grund: "§23 Abs.3 S.7: Verluste nur mit §23-Gewinnen verrechenbar, kein Ausgleich mit §19/§21. Im Ring: einkuenfte_sonstige += max(0, gew_pvg−verlust_pvg), nie negativ."
