# Bindungstabelle — §23 EStG private Veräußerungsgeschäfte (Stufe-1).
# Multi-Instanz (wie §21-Multi-Objekt): pro Veräußerung ein Satz von Angaben
# (Art, Bezeichnung, zwei Daten, Preis, Anschaffungskosten, AfA, Werbungskosten,
# Eigennutzung samt Wohnfläche und Zeitraum, täglicher Gebrauch, Einkunftsquelle, Gebäude der letzten zehn Jahre).
# instanz_gruppe: "p23_veraeusserung".
# Abweichung Nr. 54 (2026-10-10): TaxGraph rechnet die Frist selbst aus den zwei Daten
# (Grundstück 10 Jahre, andere Wirtschaftsgüter 1 Jahr, mit Einkunftsquelle 10 Jahre) und
# wendet Eigennutzung und täglichen Gebrauch an; die Angabe "innerhalb der Frist" ist keine
# Selbstauskunft mehr. Unentgeltlicher Erwerb ist eine Fristzurechnung (Abs. 1 Satz 3 nach
# Nr. 3): der Nutzer nennt das Anschaffungsdatum des Rechtsvorgängers.
# Kz: Gewinn je Verkauf (E0306801 / E0307701) und die Pflichtangaben je Art (Bezeichnung,
# zwei Daten) aus dem checkESt-Spike AK0; Preis, Kosten und AfA stehen nur im Gewinn.
# Task §23-Stufe-1, Stand 2026-10-10.
version: 1
scheibe: "§23 EStG Private Veräußerungsgeschäfte (gesamt + rentner)"

bindungen:
  - feld_id: p23_veraeusserungspreis
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: veraeusserungspreis}
    typ: cent
    # Kein Minus: ein negativer Preis liesse den Gewinn sinken und machte aus einem Gewinn einen Verlust. Kein eigenes Kz, die Meldung des
    # Stores nennt darum das Schema (wie bei `p23_afa`). Zweite Sicherung: `lese()` in `bescheid/src/privatverkauf.rs` sperrt geladene Akten.
    nicht_negativ: true
    einheit: EUR
    askable: true
    vorjahr: uebernehmbar
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Wie hoch war der Veräußerungspreis (Verkaufserlös) für dieses Wirtschaftsgut?"
    hilfe_kurz: "Der Brutto-Verkaufspreis vor Abzug von Nebenkosten (die unter Werbungskosten fallen). Ob die Frist abgelaufen ist, rechnet TaxGraph aus den zwei Daten."
    beispielwert: 20000000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "ENDGUELTIG: Ring-Input (§ 23 Abs. 3 S. 1). Der per-Instanz-Gewinn traegt das Kz (E0306801 Grundstueck / E0307701 anderes WG via est_mapping P23_GEWINN-Verzweigung). E0318902 (Ant_Ek, Beteiligungen) gehoert NICHT hierher."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 3 S. 1 EStG"
      zitatanker: "Gewinn oder Verlust aus Veraeusserungsgeschaeften nach Absatz 1 ist der Unterschied zwischen Veraeusserungspreis"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_anschaffung_herstellungskosten
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: anschaffungs_herstellungskosten}
    typ: cent
    # Kein Minus: negative Kosten liessen den Gewinn steigen. Zweite Sicherung: `lese()` sperrt geladene Akten ueber `afa > kosten`
    # (die Abschreibung ist nie negativ, liegt also bei negativen Kosten immer darueber).
    nicht_negativ: true
    einheit: EUR
    askable: true
    vorjahr: uebernehmbar
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Wie hoch waren die Anschaffungs- oder Herstellungskosten für dieses Wirtschaftsgut?"
    hilfe_kurz: "Der Kaufpreis, den du selbst ursprünglich bezahlt hast. Plus nachträgliche Herstellungskosten (z. B. Renovierung vor Verkauf)."
    beispielwert: 15000000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "ENDGUELTIG: Ring-Input (§ 23 Abs. 3 S. 1). Kz E0306801/E0307701 am berechneten per-Instanz-Gewinn. E0318902 (Ant_Ek) nicht hier."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 3 S. 1 EStG"
      zitatanker: "Anschaffungs- oder Herstellungskosten"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_werbungskosten
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: werbungskosten}
    typ: cent
    # Kein Minus: negative Werbungskosten liessen den Gewinn steigen. Zweite Sicherung: `lese()` sperrt geladene Akten.
    nicht_negativ: true
    einheit: EUR
    askable: true
    vorjahr: uebernehmbar
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Hattest du Kosten rund um diesen Verkauf (z. B. Makler, Notar, Inserat)?"
    hilfe_kurz: "Kosten, die direkt mit dem Verkauf zusammenhängen — aber NUR Kosten, die nicht schon zuvor absetzbar waren."
    beispielwert: 500000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "ENDGUELTIG: Ring-Input (§ 23 Abs. 3 S. 1). Kz E0306801/E0307701 am berechneten per-Instanz-Gewinn. E0318902 (Ant_Ek) nicht hier."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 3 S. 1 EStG"
      zitatanker: "Werbungskosten"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_veraeusserungs_typ
    quelle: {regel_id: p23_veraeusserungsgewinn, geltungsbedingung: veraeusserung_innerhalb_frist}
    typ: enum
    einheit: null
    enum_werte: ["grundstueck", "anderes_wg", "kryptowert", "beteiligung"]
    askable: true
    vorjahr: uebernehmbar
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Um welche Art von Verkauf handelt es sich?"
    hilfe_kurz: "Grundstück oder Immobilie (Frist 10 Jahre), anderer Gegenstand wie Gold, Kunst, Schmuck oder ein Oldtimer (Frist 1 Jahr), Kryptowert wie Bitcoin oder der Anteil an einer Beteiligung. Kryptowerte und Beteiligungen rechnet die Software noch nicht und sperrt mit einer Erklärung."
    beispielwert: grundstueck
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Art-Feld der Instanz: steuert das Kz von Gewinn, Bezeichnung und Daten (est_mapping P23_GEWINN-Verzweigung, E0306801 Grundstueck / E0307701 anderes WG). Kryptowert (Virt_Waehr) und Beteiligung (Ant_Ek) haben keinen Kz-Zweig: die Berechnung sperrt vorher (Sperrgrund p23_verkauf_nicht_gerechnet)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 1 EStG"
      zitatanker: "Veraeusserungsgeschaefte bei Grundstuecken und Rechten, die den Vorschriften des buergerlichen Rechts ueber Grundstuecke"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"

  # ===== Abweichung Nr. 54: die Angaben, aus denen TaxGraph Frist und Befreiung rechnet =====
  # ponytail: alle Fragen erscheinen bei jedem Verkauf, auch die, die nur für Grundstücke (Eigennutzung) oder nur für andere
  # Gegenstände (täglicher Gebrauch, Einkunftsquelle) gelten, Wohnfläche und Zeitraum nur für ein selbst bewohntes Grundstück
  # innerhalb der Frist; der Hilfetext sagt es, die Rechnung liest nur die passende.
  # Eine Bedingung je Instanz (`feld_bedingung` auf `p23_veraeusserungs_typ__<n>`) ist nicht gebaut.
  - feld_id: p23_bezeichnung
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: bezeichnung}
    typ: text
    muster: '^(?:[^\n\r]{1,999})$'   # E10-2025.xsd E0306111 / E0307101: String_MinL1_MaxL999
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Was hast du verkauft? Nenne das Grundstück (zum Beispiel mit Straße und Ort) oder den Gegenstand."
    hilfe_kurz: "Ein paar Worte genügen, zum Beispiel: Eigentumswohnung Musterstraße 1, Berlin, oder: Goldbarren. Die Angabe steht in der Erklärung."
    beispielwert: "Eigentumswohnung Musterstraße 1, Berlin"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kz haengt an der Art: Grundstueck E0306111 (Bezeichnung des Grundstuecks/Rechts), anderes WG E0307101 (Art des Wirtschaftsguts); beide Pflicht (checkESt-Spike AK0, Abweichung Nr. 54). Der Schreiber waehlt es ueber P23_ARTFELDER."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 1 EStG"
      zitatanker: "Veräußerungsgeschäfte bei Grundstücken und Rechten, die den Vorschriften des bürgerlichen Rechts über Grundstücke unterliegen"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_anschaffungsdatum
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: anschaffungsdatum}
    typ: datum
    muster: '^\d{2}\.\d{2}\.\d{4}$'
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Wann hast du es gekauft (Tag des Kaufvertrags)? Hast du es geerbt oder geschenkt bekommen, nenne den Tag, an dem der frühere Eigentümer es gekauft hat."
    hilfe_kurz: "Format TT.MM.JJJJ. Bei Erbe oder Schenkung rechnet das Gesetz dir die Anschaffung des früheren Eigentümers zu (§ 23 Abs. 1): seine Frist läuft weiter. Das Datum steht in der Erklärung."
    beispielwert: "15.06.2020"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kz haengt an der Art: Grundstueck E0306201, anderes WG E0307201 (beim WG keine Pflicht, TaxGraph schreibt es trotzdem; checkESt-Spike AK0). Bei unentgeltlichem Erwerb das Datum des Rechtsvorgaengers (Abs. 1 Satz 3 nach Nr. 3)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 S. 3 nach Nr. 3 EStG (unentgeltlicher Erwerb)"
      zitatanker: "Bei unentgeltlichem Erwerb ist dem Einzelrechtsnachfolger für Zwecke dieser Vorschrift die Anschaffung"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_veraeusserungsdatum
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: veraeusserungsdatum}
    typ: datum
    muster: '^\d{2}\.\d{2}\.\d{4}$'
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Wann hast du es verkauft (Tag des Kaufvertrags)?"
    hilfe_kurz: "Format TT.MM.JJJJ. Das Datum muss im Steuerjahr liegen und nach dem Kaufdatum. Aus beiden Daten rechnet TaxGraph, ob die Frist abgelaufen ist."
    beispielwert: "10.03.2025"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kz haengt an der Art: Grundstueck E0306202, anderes WG E0307202 (beim WG keine Pflicht, TaxGraph schreibt es trotzdem; checkESt-Spike AK0)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 1 EStG"
      zitatanker: "bei denen der Zeitraum zwischen Anschaffung und Veräußerung nicht mehr als zehn Jahre beträgt"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_afa
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: afa}
    typ: cent
    # Kein Minus: eine negative Abschreibung liesse die Anschaffungskosten steigen und den Gewinn sinken (Abs. 3 S. 4 kennt nur Absetzungen).
    # Das Feld hat kein eigenes Kz (wie `ep_unfallkosten`, `dba_abzug_zeile_cent`); die Meldung des Stores nennt darum das Schema, ohne dass
    # es hier ein Kz gibt. Zweite Sicherung: `lese()` in `bescheid/src/privatverkauf.rs` sperrt auch geladene Akten mit `afa < 0`.
    nicht_negativ: true
    einheit: EUR
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Hast du für den Verkauf eine Abschreibung (AfA) bei deinen Einkünften abgezogen? Wenn ja, wie viel in Summe?"
    hilfe_kurz: "Zum Beispiel bei einer vermieteten Wohnung die Abschreibung auf das Gebäude, die du in der Anlage V abgezogen hast. Gemeint ist alles, was du als Arbeitnehmer, bei Kapitalerträgen oder bei Vermietung und Verpachtung abgezogen hast, auch erhöhte Abschreibung und Sonderabschreibung. Hast du das Gut nach dem 31.12.2008 gekauft, zählt auch, was das Finanzamt bei den sonstigen Einkünften berücksichtigt hat. Die Abschreibung senkt die Anschaffungskosten und erhöht so den Gewinn. Hast du nichts abgezogen, trage 0 ein."
    beispielwert: 0
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "ENDGUELTIG: Ring-Input (§ 23 Abs. 3 S. 4). Grundstueck: E0306601 stuende fuer die AfA, TaxGraph schreibt nur den berechneten Gewinn (checkESt rechnet den Gewinn nur nach, wenn Einzelbetraege stehen; Spike AK0). Beim WG gibt es kein AfA-Kz, die AfA steckt im Gewinn."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 3 S. 4 EStG"
      zitatanker: "Die Anschaffungs- oder Herstellungskosten mindern sich um Absetzungen für Abnutzung"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_eigennutzung
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: eigennutzung}
    typ: enum
    enum_werte: ["nein", "ausschliesslich", "letzte_drei_jahre", "teilweise"]
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Nur bei einem Grundstück: Hast du es selbst bewohnt?"
    hilfe_kurz: "Nein; ausschließlich selbst bewohnt, vom Kauf bis zum Verkauf; im Jahr des Verkaufs und in den zwei Jahren davor selbst bewohnt; oder nur zum Teil selbst bewohnt (zum Beispiel eine Wohnung im Haus vermietet). Der letzte Fall wird nicht gerechnet. Bei den ersten beiden Fällen brauchst du Wohnfläche und Zeitraum der Nutzung (nächste Fragen), sofern die Frist noch läuft. Bei anderen Gegenständen wähle Nein."
    beispielwert: nein
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Ring-Input (§ 23 Abs. 1 Nr. 1 S. 3), kein eigenes Kz. Ein Verkauf mit Eigennutzung ist steuerfrei. Er steht innerhalb der Frist in der Grundstueckszeile: Haken E0306301, Zeitraum E0306302, Flaeche E0306303 (aus den drei Feldern darunter) und der Gewinn 0, ohne Einzelbetraege (checkESt-Fall Gx7, Abweichung Nr. 54). Nach Ablauf der Frist steht er nicht in der Erklaerung. Teilnutzung sperrt (p23_verkauf_nicht_gerechnet)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 3 EStG"
      zitatanker: "ausschließlich zu eigenen Wohnzwecken oder im Jahr der Veräußerung und in den beiden vorangegangenen Jahren zu eigenen Wohnzwecken genutzt wurden"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_wohnflaeche
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: wohnflaeche}
    typ: int
    einheit: null
    # 0 bleibt beim Speichern zulaessig ("nichts anzugeben"); `lese()` in `bescheid/src/privatverkauf.rs` verlangt bei Eigennutzung innerhalb der Frist mindestens 1.
    bereich: {min: 1, max: 100000, grund: "Wohnfläche in m²; positiv, Obergrenze großzügig (wie p35c_gesamtflaeche_qm)."}
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Nur bei einem selbst bewohnten Grundstück: Wie viele Quadratmeter Wohnfläche hat es?"
    hilfe_kurz: "Ganze Quadratmeter, zum Beispiel 120. Die Angabe steht in der Erklärung (Anlage SO, Zeile 36). Bei allen anderen Verkäufen trage 0 ein."
    beispielwert: 120
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kz E0306303 (Anlage SO Zeile 36, Flaeche zu eigenen Wohnzwecken) nur bei Art Grundstueck mit Eigennutzung ausschliesslich oder letzte_drei_jahre; der Schreiber setzt es in p23_gewinn (P23_EIGENNUTZUNG_KZ), nicht ueber die Bindung."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 3 EStG"
      zitatanker: "ausschließlich zu eigenen Wohnzwecken oder im Jahr der Veräußerung und in den beiden vorangegangenen Jahren zu eigenen Wohnzwecken genutzt wurden"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_eigennutzung_von
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: eigennutzung_von}
    typ: datum
    muster: '^\d{2}\.\d{2}\.\d{4}$'
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Nur bei einem selbst bewohnten Grundstück: Seit wann hast du es selbst bewohnt?"
    hilfe_kurz: "Format TT.MM.JJJJ. Der erste Tag, an dem du dort gewohnt hast. Bei Erbe oder Schenkung zählt dein Einzug, nicht das Datum des früheren Eigentümers. Die Angabe steht in der Erklärung (Anlage SO, Zeile 36). Bei allen anderen Verkäufen lass das Feld leer."
    beispielwert: "15.06.2020"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anfang des Zeitraums in Kz E0306302 (Format TT.MM.JJJJ-TT.MM.JJJJ, checkESt-Fall Gx7), nur bei Art Grundstueck mit Eigennutzung ausschliesslich oder letzte_drei_jahre; der Schreiber setzt es in p23_gewinn. Die Software prueft nicht, ob der Zeitraum zur Dreijahresregel passt."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 3 EStG"
      zitatanker: "ausschließlich zu eigenen Wohnzwecken oder im Jahr der Veräußerung und in den beiden vorangegangenen Jahren zu eigenen Wohnzwecken genutzt wurden"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_eigennutzung_bis
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: eigennutzung_bis}
    typ: datum
    muster: '^\d{2}\.\d{2}\.\d{4}$'
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Nur bei einem selbst bewohnten Grundstück: Bis wann hast du es selbst bewohnt?"
    hilfe_kurz: "Format TT.MM.JJJJ. Der letzte Tag, an dem du dort gewohnt hast; er darf nach dem Verkaufsvertrag liegen, wenn du erst bei der Übergabe ausgezogen bist. Die Angabe steht in der Erklärung (Anlage SO, Zeile 36). Bei allen anderen Verkäufen lass das Feld leer."
    beispielwert: "10.03.2025"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Ende des Zeitraums in Kz E0306302 (Format TT.MM.JJJJ-TT.MM.JJJJ, checkESt-Fall Gx7), nur bei Art Grundstueck mit Eigennutzung ausschliesslich oder letzte_drei_jahre; der Schreiber setzt es in p23_gewinn. Die Software prueft nicht, ob der Zeitraum zur Dreijahresregel passt."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 1 S. 3 EStG"
      zitatanker: "ausschließlich zu eigenen Wohnzwecken oder im Jahr der Veräußerung und in den beiden vorangegangenen Jahren zu eigenen Wohnzwecken genutzt wurden"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_taeglicher_gebrauch
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: taeglicher_gebrauch}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
    fragetext_laie: "Nur bei einem anderen Gegenstand: War es ein Gegenstand des täglichen Gebrauchs?"
    hilfe_kurz: "Ja bei zum Beispiel Auto, Möbeln oder Kleidung. Solche Verkäufe sind steuerfrei. Bei einem Grundstück wähle Nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "ENDGUELTIG: Ring-Input (§ 23 Abs. 1 Nr. 2 S. 2), kein Deklarationsfeld. Ein Verkauf des taeglichen Gebrauchs ist steuerfrei und steht nicht in der Erklaerung: die Anleitung zur Anlage SO nennt ihn \"muessen Sie hier nicht angeben\" (Abweichung Nr. 54), die Abgabe sperrt nicht."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 Nr. 2 S. 2 EStG"
      zitatanker: "Ausgenommen sind Veräußerungen von Gegenständen des täglichen Gebrauchs"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"
  - feld_id: p23_einkunftsquelle
    quelle: {regel_id: p23_veraeusserungsgewinn, signatur_slot: einkunftsquelle}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    instanz_gruppe: p23_veraeusserung
