    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    # Ein falsches „Nein" nimmt Rente und gelegentliche Leistungen still aus der Rechnung. Deshalb nennt der Text je Regel an
    # diesem Kreuz einen Alltagsfall. Der private Verkauf steht seit Abweichung Nr. 54 NICHT mehr hier: er hat sein eigenes Kreuz
    # `kein_p23_verkauf` und wird gerechnet. Stünde er hier, sperrte jedes "Ja" die Scheibe `gesamt` mit
    # `einkunftsart_nicht_ring_faehig`, bevor die Frage zum Verkauf kommt. Aktien fehlen mit Absicht: § 23 Abs. 2 EStG ordnet sie
    # den Kapitalerträgen zu, die `kein_kap` erhebt.
