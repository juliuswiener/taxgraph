  # Die dritte Zahl, die ERiC verlangt (gemessen 2026-08-19): mit Messbetrag und Hebesatz allein
  # antwortet checkESt rc=610001002 zweimal — "Messbetrag ... und die darauf entfallende ...
  # tatsaechlich zu zahlende Gewerbesteuer sind GEMEINSAM anzugeben" und "Der Hebesatz wurde
  # angegeben, die zu zahlende Gewerbesteuer jedoch nicht".
  #
  # BERECHNET, NICHT GEFRAGT — und das ist hier etwas anderes als bei § 22 Nr. 3 daneben. Dort
  # war der fehlende Wert eine Angabe, die nur der Nutzer kennt; hier ist er das Ergebnis einer
  # gesetzlichen Formel: § 16 Abs. 1 GewStG, Steuermessbetrag mal Hebesatz. Beide Faktoren hat
  # der Nutzer selbst aus seinen Bescheiden eingetragen. Wir raten also nicht, wir rechnen.
  #
  # NICHT ZU VERWECHSELN mit dem 4-fachen Messbetrag aus § 35 Abs. 1 S. 2 EStG
  # (_gewst_p35_anrechnung_cent in produkt/engine/runner.py): das ist die Obergrenze der
  # ANRECHNUNG auf die Einkommensteuer, eine andere Norm und eine andere Zahl. Hier steht die
  # Schuld gegenueber der Gemeinde, ungedeckelt.
  #
  # Grenze, benannt: bei einem Erlass oder abweichender Festsetzung durch die Gemeinde weicht die
  # wirklich gezahlte Steuer von der Formel ab. Das Finanzamt prueft die § 35-Anrechnung ohnehin
  # gegen den Gewerbesteuerbescheid. Ein vom Nutzer ueberschreibbarer Vorschlag waere der
  # sauberere Zuschnitt, waere aber die erste Anwendung von zustand:vorlaeufig auf einen
  # Engine-Wert — eigener Bau, bewusst nicht hier.
  - feld_id: gewst_zu_zahlen
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: gewst_zu_zahlen}
    typ: cent
    nicht_negativ: true
    einheit: EUR
    askable: false
    vorjahr: uebernehmbar
    fragetext_laie: null
    hilfe_kurz: "Berechnet: Messbetrag mal Hebesatz (§ 16 Abs. 1 GewStG)."
    beispielwert: null
    herkunft_slots: null
    elster_kz: E0801704
    elster_kz_grund: "E0801704 [G/St_Erm_P35/Ang_GSt_GMB/Einz_Betr/Zu_zah_GSt_VZ], XSD-Label 'Gewerbesteuer' — direktes Geschwister von E0801705 (Hebesatz) im selben Container. Erster Betrieb, wie E0801606/E0801705."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 35 Abs. 1 S. 1 EStG"
      zitatanker: "tatsächlich zu zahlende Gewerbesteuer"
      datei: "sources/gesetze-im-internet/estg_p35_2026-07-14.txt"

  # ===== § 10d Verlustvortrag (Mindestbesteuerung): GdE-Abzug vorrangig vor Sonderausgaben =====
  # § 10d Abs. 2: der festgestellte Verlustvortrag (Abs. 4) mindert den GdE, begrenzt auf
  # min(GdE, sockel + 70 %·(GdE−sockel)); sockel 1 Mio einzel / 2 Mio zusammen; Rest wird vorgetragen. regel
  # p10d_2_verlustvortrag_abzug (materialisiert, fix-geregatet 294cdd6a — min(GdE)-Cap + Floor). dev-1s Ring
  # zieht § 10d VORRANGIG vor Sonderausgaben/agB vom GdE ab (§ 2-Reihenfolge); greift in BEIDEN Ringen.
  - feld_id: verlustvortrag_bestand
    quelle: {regel_id: p10d_2_verlustvortrag_abzug, signatur_slot: verlustvortrag_bestand}
    typ: cent
    einheit: EUR
    askable: true
    # KEIN vorjahr-Flag (bewusst, s. tests/test_vorjahr_writer.py): der Bestand aendert sich durch
    # Verrechnung im Vorjahr, vorjahr_writer.py kopiert den alten Wert aber wortwoertlich weiter.
    fragetext_laie: "Welchen Verlust aus früheren Jahren hat dir das Finanzamt zum 31.12. des Vorjahres bescheinigt?"
    hilfe_kurz: "Aus deinem Verlustfeststellungs-Bescheid (§ 10d Abs. 4). Trag ihn ein, wenn du Verluste aus Vorjahren mit diesem Jahr verrechnen willst; ohne Eintrag entfällt der Verlustabzug."
    beispielwert: 6000000
    herkunft_slots: null
    elster_kz: null
    kz_status: endgueltig
    elster_kz_grund: "ENDGUELTIG: Typ-Unterschied. E0190701 ist Ja/Nein-Feld (RABE), unser Feld cent (Betrag). FA kennt Betrag aus Feststellungsbescheid. E10 fragt ihn nicht ab."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 10d Abs. 2 S. 1 EStG"
      zitatanker: "bis zu einem Gesamtbetrag der Einkünfte von 1 Million Euro unbeschränkt"
      datei: "sources/gesetze-im-internet/estg_p10d_2026-07-13.txt"

  # ===== Zusammenveranlagung (§ 26b): person-INDIVIDUELLE _partner-Zwillinge (Store-Modell A) =====
  # STRENG nur die steuerlich getrennten Person-B-Einkommensfelder (eigener § 9a-Pauschbetrag / eigene
  # LStB je Ehegatte). Globale Felder (veranlagung/Kinder/agB/Spende/Abwesenheits-Flags) bleiben GETEILT.
  # est_mapping-Klasse Person-Multiplikation: _partner -> Anlage-N-INSTANZ B (dieselben Kz wie Person A,
  # person_b-Bucket), KEINE neuen Kz. EP_partner (Person-B-Pendler-WK) = dokumentierter Folge-Nachtrag.
  - feld_id: bruttoarbeitslohn_partner
    vorschlagbar_von: [beleg]
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: bruttoarbeitslohn_partner}
    feld_bedingung: {feld: kein_lohn_pension_partner, wert: false, grund: "Wer bestaetigt, dass der Ehe-/Lebenspartner weder Arbeitslohn noch eine Pension (Versorgungsbezug) hatte, hat keine Lohnsteuerbescheinigung und keine Versorgungsmitteilung, aus der etwas abzulesen waere. `kein_lohn_pension_partner` erhebt genau diese Existenz. Fail-closed: nur eine BESTAETIGTE Antwort schliesst aus."}
    typ: cent
    einheit: EUR
    askable: true
    # Diese Frage erhebt, ob der Partner ueberhaupt Arbeitslohn hatte — und daran haengen vier
    # weitere Fragen, die alle aus SEINER Lohnsteuerbescheinigung ablesen (Steuerklasse, Lohnsteuer,
    # Arbeitnehmer- und Arbeitgeberanteil zur Rentenversicherung, s. deren `feld_bedingung`).
    # Ohne Arbeitslohn gibt es keine Lohnsteuerbescheinigung, aus der sie abzulesen waeren.
    #
    # OHNE diese Zeile wirkt die Bedingung fuer drei der vier Felder gar nicht: gemessen am
    # 2026-08-27 stand diese Frage auf Platz 112 der Queue, `p36_lohnsteuer_partner` aber auf 99
    # und `steuerklasse_partner` auf 108. Beide tragen eine `geltungsbedingung` und sortieren
    # deshalb in den Gate-Block, waehrend diese Betragsfrage ein Slot ist und dahinter faellt —
    # die Torfrage kaeme also NACH den Fragen, die sie erspart. `_nach_themen` zieht eine
    # Eingangsfrage in ihrem Thema nach vorn, auch ein Betragsfeld (seit 2026-08-26);
    # `_nach_vordruck` fasst sie nicht an. Genau derselbe Zuschnitt wie bei `kinderbetreuungskosten`
    # und `agb_aufwendungen`: ein Betragsfeld, dessen Frage zugleich die Existenzfrage ist.
    #
    # Ein eigenes bool-Flag daneben („Hatte dein Partner Arbeitslohn?") waere sprachlich sauberer,
    # kostete aber eine Frage MEHR fuer jeden — und diese hier steht ohnehin in der Queue.
    eingangsfrage: true
    vorjahr: vorschlag
    fragetext_laie: "Wie hoch war der Bruttoarbeitslohn deines Ehe-/Lebenspartners dieses Jahr? (Nummer 3 seiner Lohnsteuerbescheinigung)"
    hilfe_kurz: "Person-individuell, weil jeder Ehegatte einen EIGENEN Arbeitnehmer-Pauschbetrag hat; steht auf der Lohnsteuerbescheinigung des Partners (Nummer 3). Versorgungsbezüge deines Partners (Nummer 8) sind darin schon enthalten."
    beispielwert: 3800000
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-N-Instanz B (Person-Multiplikation): derselbe Kz E0200201 wie Person A, zweites Sub-Dokument — kein distinktes Partner-Kz (E0220201 existiert nicht). herkunft_slots=null: die Beleg-Extraktion füllt nur Person A (ein LStB füllt nicht beide); Person-B-Beleg = person-scoped Nachtrag."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 19 Abs. 1 S. 1 Nr. 1 EStG"
      zitatanker: "Gehälter, Löhne, Gratifikationen, Tantiemen und andere Bezüge und Vorteile für eine Beschäftigung"
      datei: "sources/gesetze-im-internet/estg_p19_2026-07-17.txt"
