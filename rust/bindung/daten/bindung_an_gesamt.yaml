    vorjahr: vorschlag
    fragetext_laie: "Wie viel hat dein Ehe-/Lebenspartner dieses Jahr an Beiträgen für eine Gewerkschaft oder einen Berufsverband gezahlt?"
    hilfe_kurz: "Alle Beiträge des Jahres zusammen, die dein Partner an eine Gewerkschaft oder einen Berufsverband gezahlt hat. Das Gesetz nennt Beiträge zu Berufsständen und sonstigen Berufsverbänden, deren Zweck nicht auf einen wirtschaftlichen Geschäftsbetrieb gerichtet ist. Beiträge an politische Parteien gehören nicht hierher: Dafür gibt es die Frage zu Spenden an Parteien. Die Software zählt den Betrag zu den übrigen Werbungskosten deines Partners. Die Steuer sinkt nur, wenn alle Werbungskosten deines Partners zusammen den Arbeitnehmer-Pauschbetrag übersteigen; der Pauschbetrag gilt für jeden von euch einzeln. Die Erklärung trägt den Betrag in Zeile 53 der Anlage N deines Partners ein, auf volle Euro aufgerundet. Wenn nichts: leer lassen oder 0."
