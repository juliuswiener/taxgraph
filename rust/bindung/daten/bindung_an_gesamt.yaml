  # ========================= Steuerklasse/Lohnsteuer/Kirchensteuer Person B (Anlage N) =========
  # Reine Deklarations-Stammdaten, kein Ring-Input (kein Catala-Slot); anders als kist_konfession_partner, das die Rust-Rechnung liest (Nr. 94).
  # PARTNER_INSTANZ in est_mapping.py routet auf DIESELBEN Person-A-Kz (kein eigenes Ehegatte-Kz).
  - feld_id: steuerklasse_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, geltungsbedingung: beide_ehegatten_zusammen_veranlagt}
    feld_bedingung: {feld: bruttoarbeitslohn_partner, wert_nicht: 0, grund: "§ 41b EStG: die Steuerklasse steht unter Nummer 1 der Lohnsteuerbescheinigung, die der Arbeitgeber ausstellt. Ohne Arbeitslohn des Partners (§ 19 Abs. 1 S. 1 Nr. 1 EStG) gibt es keinen Arbeitgeber, der eine Lohnsteuerklasse anwendet, und keine Bescheinigung, auf der sie stuende. `bruttoarbeitslohn_partner` erhebt genau diese Existenz. Fail-closed ueber `wert_nicht`: nur eine BESTAETIGTE Null schliesst aus — unbeantwortet und ein vorlaeufiger Beleg-Vorschlag lassen die Frage stehen. Das Feld traegt kein elster_kz, entfaellt also aus der Frageliste, ohne der Deklaration etwas zu nehmen.", und: {feld: kein_lohn_pension_partner, wert: false, grund: "Wer bestaetigt, dass der Ehe-/Lebenspartner weder Arbeitslohn noch eine Pension (Versorgungsbezug) hatte, hat keine Lohnsteuerbescheinigung und keine Versorgungsmitteilung, aus der etwas abzulesen waere. `kein_lohn_pension_partner` erhebt genau diese Existenz. Fail-closed: nur eine BESTAETIGTE Antwort schliesst aus."}}
    typ: enum
    enum_werte: ["1", "2", "3", "4", "5", "6"]
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Welche Steuerklasse hat dein Ehe-/Lebenspartner (steht auf seiner/ihrer Lohnsteuerbescheinigung)?"
    hilfe_kurz: "Steuerklasse I bis VI des Ehe-/Lebenspartners, unter Nummer 1 der Lohnsteuerbescheinigung."
    beispielwert: "1"
    herkunft_slots: ["Lohnsteuerbescheinigung Nr. 1"]
    elster_kz: null
    elster_kz_grund: "Anlage-N-Instanz B (Person-Multiplikation): derselbe Kz E0200002 wie Person A, zweites Sub-Dokument — kein distinktes Partner-Kz. PARTNER_INSTANZ (est_mapping.py) routet den Wert in den person_b-Bucket."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 38b Abs. 1 EStG"
      zitatanker: "Für die Durchführung des Lohnsteuerabzugs werden Arbeitnehmer in Steuerklassen eingereiht."
      datei: "sources/gesetze-im-internet/estg_p38b_2026-08-10.txt"

  # ========================= Versorgungsbezüge Person B (§ 19 Abs. 2) — Abweichung Nr. 33 ==============
  # Rust-eigen (Python kennt diese fünf Felder nicht): die Rentner-Scheibe fragt Lohn, Steuerklasse und Versorgung des
  # Ehegatten bei Zusammenveranlagung, analog zu Person A (Entscheidung `rentner-ehegatte-lohn-und-versorgung-wird-gefragt-
  # nicht-gesperrt`). Der Rentner-Ring liest sie in `zweige/gesamt.rs::einkuenfte_ns_aus_lohn` (Person B). Seit Abweichung Nr. 87
  # (Julius, 2026-10-19, d-28) fuehrt auch die Scheibe `gesamt` die fuenf Versorgungsfelder; derselbe Ring rechnet sie dort.
  # Die Bedingung `kein_lohn_pension_partner` gilt nur in `rentner_gesamt`; in `gesamt` fehlt dieses Kreuz, die Felder stehen dort
  # (fail-closed) bei jeder Zusammenveranlagung, wie die von Person A (`kein_lohn_pension` fehlt dort ebenso).
  #
  # Die Bedingung "nur bei Zusammenveranlagung" kommt wie bei `bruttoarbeitslohn_partner` aus der Regel
  # `p2_festzusetzung_zusammen` (regel_bedingungen: bei bestaetigtem `einzel` faellt die ganze Regel weg). KEINE
  # `geltungsbedingung`: ein Betragsfeld ist kein Gate (Entscheidung `ein-neues-betragsfeld-haengt-an-feld-bedingung-nie-an-
  # geltungsbedingung`). `signatur_slot` ist ein Etikett, der Ring liest beim Feldnamen.
  - feld_id: versorgung_jahresrente_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: versorgung_jahresrente_partner}
    feld_bedingung: {feld: kein_lohn_pension_partner, wert: false, grund: "Wer bestaetigt, dass der Ehe-/Lebenspartner weder Arbeitslohn noch eine Pension (Versorgungsbezug) hatte, hat keine Lohnsteuerbescheinigung und keine Versorgungsmitteilung, aus der etwas abzulesen waere. `kein_lohn_pension_partner` erhebt genau diese Existenz. Fail-closed: nur eine BESTAETIGTE Antwort schliesst aus."}
    typ: cent
    einheit: EUR
    askable: true
