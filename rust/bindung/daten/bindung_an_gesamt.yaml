  # ===== § 34 Abs. 3 Ermäßigter Durchschnittssatz fuer den PARTNER (B Option 1, 2026-10-06) =====
  # Zwillinge der Person-A-Felder weiter oben (antrag_ermaessigter_satz, dauernd_berufsunfaehig,
  # ermaessigung_einmal_genutzt, p34_abs3_antragsbetrag). § 34 Abs. 3 S. 1 stellt auf DEN
  # Steuerpflichtigen ab, der das 55. Lebensjahr vollendet hat oder dauernd berufsunfaehig ist; bei
  # Zusammenveranlagung ist das je Ehegatte zu pruefen (S. 4: einmal im Leben, je Person). Die Rechnung des
  # Satzes fuer den Gewinn des Partners steht in bescheid/src/zweige/tarif.rs (p34_chooser), und zwar nur,
  # wenn NUR der Partner einen Veraeusserungsgewinn hat: bei Gewinn auch bei Person A sperrt
  # abs3_partner_antrag_gewinn_offen (S. 5 laesst die Ermaessigung nur fuer EINEN Gewinn zu, und wie der
  # Chooser beide Gewinne gegeneinander setzt, ist offen). Das Alter 55 liest der Rechner aus
  # geburtsjahr_partner (abgeleitet aus dem Geburtsdatum des Partners), wie bei Person A aus geburtsjahr.
  # signatur_slot auf p2_festzusetzung_zusammen (wie geburtsjahr_partner), KEIN geltungsbedingung: ein
  # fragbares bool-Gate auf diesem Sammel-Scope schliesst bei bestaetigtem false die ganze Regel aus
  # (registry_quer::kein_fragbares_bool_gate_auf_einem_sammel_scope). KEIN feld_bedingung: bei bestaetigter
  # Einzelveranlagung faellt die ganze Regel p2_festzusetzung_zusammen weg (bindung_regel_bedingungen.yaml,
  # veranlagung = zusammen), solange die Veranlagung offen ist, bleiben die Fragen stehen (fail-closed). Anders als die
  # Felder unter p16_4_freibetrag (rentner_alter_55_oder_berufsunfaehig_partner), die diesen Schutz nicht erben.
  # Preis: ein Ehepaar ohne Gewinn des Partners bekommt die drei Fragen weiterhin.
  - feld_id: antrag_ermaessigter_satz_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: antrag_ermaessigter_satz_partner}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Möchte dein Ehe-/Lebenspartner für seinen Veräußerungsgewinn den ermäßigten Steuersatz beantragen? (nur einmal im Leben möglich, ab 55 oder bei dauernder Berufsunfähigkeit)"
    hilfe_kurz: "Alternative zur Fünftelregelung (§ 34 Abs. 1): 56 % des durchschnittlichen Steuersatzes deines Partners (mind. 14 %) auf bis zu 5 Mio Euro seines Veräußerungsgewinns. Nur EINMAL im Leben, nur ab dem 55. Lebensjahr oder bei dauernder Berufsunfähigkeit. Ohne Antrag gilt die Fünftelregelung. Die Software rechnet den Antrag nur, wenn nur dein Partner einen Veräußerungsgewinn hat."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Antrags-Tatbestand (§ 34 Abs. 3 S. 1 „auf Antrag“) des Partners, kein Betragsfeld; steuert den Abs.1-vs-Abs.3-Chooser fuer den Gewinn des Partners. Die Antragszeile der Anlage steht an p34_abs3_antragsbetrag_partner."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 1 EStG"
      zitatanker: "so kann auf Antrag abweichend von Absatz 1 die auf den Teil dieser außerordentlichen Einkünfte, der den Betrag von insgesamt 5 Millionen Euro nicht übersteigt, entfallende Einkommensteuer nach einem ermäßigten Steuersatz bemessen werden"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"
