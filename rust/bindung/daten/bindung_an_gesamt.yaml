    hilfe_kurz: "Rente: gesetzliche, Versorgungswerk, Rürup oder private Rentenversicherung. Eine Rente aus Pensionskasse, Pensionsfonds oder Direktversicherung mit Leistungsmitteilung zählst du hier nicht mit: danach fragen wir getrennt. Vermieten: z. B. Wohnmobil oder Werkzeug, auch gelegentliche Vermittlungen gegen Provision. Einen privaten Verkauf (Wohnung, Haus, Gold, Kunst, Kryptowährung) zählst du hier nicht mit: danach fragen wir getrennt. Nur Arbeitslohn → Nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag (Voraussetzung des reinen AN-Falls), kein Deklarationsfeld."
