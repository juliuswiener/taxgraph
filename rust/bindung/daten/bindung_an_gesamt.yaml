  # ===== § 34 Abs. 3 Ermäßigter Durchschnittssatz (Stufe-2a) — Eligibility/Antrags-Flags =====
  # 3 bool-Flags, KEINE Modul-Inputs (regel p34_3_ermaessigter_durchschnittssatz nimmt ao/est_gesamt/bemessung).
  # Sie steuern den Abs.1-vs-Abs.3-Chooser im Ring (dev-1-Naht): abs3_pfad = antrag_ermaessigter_satz ∧
  # (Alter≥55 [DERIVE aus geburtsjahr] ∨ dauernd_berufsunfaehig) ∧ ¬ermaessigung_einmal_genutzt. Sonst
  # Abs.1-Fünftel-Default (von Amts wegen). ao_einkuenfte = REUSE rentner_veraeusserungsgewinn (§16-vg).
  # Alle Kz=null-MVP (Antrags-/Eligibility-Tatbestände, keine Betragsfelder). ⚠ Ring fail-closed auf ao>5Mio
  # (Überschuss = Abs.1-Fünftel-Nachtrag Stufe-2b). NICHT in flag_check kein_gewinn (keine Einkunfts-Indikatoren).
  - feld_id: antrag_ermaessigter_satz
    quelle: {regel_id: p34_3_ermaessigter_durchschnittssatz, geltungsbedingung: antrag_gestellt}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Möchtest du für deinen Veräußerungsgewinn den ermäßigten Steuersatz beantragen? (nur einmal im Leben möglich, ab 55 oder bei dauernder Berufsunfähigkeit)"
    hilfe_kurz: "Alternative zur Fünftelregelung (§ 34 Abs. 1): 56 % deines durchschnittlichen Steuersatzes (mind. 14 %) auf bis zu 5 Mio Euro Veräußerungsgewinn. Nur EINMAL im Leben, nur ab dem 55. Lebensjahr oder bei dauernder Berufsunfähigkeit. Ohne Antrag gilt die Fünftelregelung."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Antrags-Tatbestand (§ 34 Abs. 3 S. 1 „auf Antrag“), kein Betragsfeld; steuert Abs.1-vs-Abs.3-Chooser im Ring. Anlage-G-Antragszeile = eigene Kz-Review-Runde (null-Kz-MVP)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 1 EStG"
      zitatanker: "so kann auf Antrag abweichend von Absatz 1 die auf den Teil dieser außerordentlichen Einkünfte, der den Betrag von insgesamt 5 Millionen Euro nicht übersteigt, entfallende Einkommensteuer nach einem ermäßigten Steuersatz bemessen werden"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"
  - feld_id: dauernd_berufsunfaehig
    quelle: {regel_id: p34_3_ermaessigter_durchschnittssatz, signatur_slot: berufsunfaehig}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Bist du im sozialversicherungsrechtlichen Sinne dauernd berufsunfähig?"
    hilfe_kurz: "Alternative zur Altersgrenze (55): wer dauernd berufsunfähig ist, kann den ermäßigten Satz (§ 34 Abs. 3) auch vor 55 beantragen. Nachweis über den Rentenversicherungsträger."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Eligibility-Alternative zu Alter≥55 (§ 34 Abs. 3 S. 1 „oder wenn er im sozialversicherungsrechtlichen Sinne dauernd berufsunfähig ist“), kein Betragsfeld. null-Kz-MVP."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 1 EStG"
      zitatanker: "oder wenn er im sozialversicherungsrechtlichen Sinne dauernd berufsunfähig ist"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"
  - feld_id: ermaessigung_einmal_genutzt
    quelle: {regel_id: p34_3_ermaessigter_durchschnittssatz, signatur_slot: bereits_genutzt}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hast du den ermäßigten Steuersatz für Veräußerungsgewinne in einem früheren Jahr schon einmal in Anspruch genommen?"
    hilfe_kurz: "Die Ermäßigung gibt es nur EINMAL im Leben (§ 34 Abs. 3 S. 4). Wenn du sie früher schon genutzt hast, ist ein erneuter Antrag ausgeschlossen — dann gilt die Fünftelregelung."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Einmal-im-Leben-Sperre (§ 34 Abs. 3 S. 4), Selbst-Bestätigung (FA-tracked); kein Betragsfeld. Ein True SPERRT den Abs.3-Zweig (fail-closed → Abs.1). null-Kz-MVP."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 4 EStG"
      zitatanker: "Die Ermäßigung nach den Sätzen 1 bis 3 kann der Steuerpflichtige nur einmal im Leben in Anspruch nehmen"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"
  # 55. Geburtstag im Jahr der Vollendung (Julius 2026-10-07, Vault decisions/ermaessigter-satz-fragt-im-jahr-der-
  # vollendung-nach-dem-55-geburtstag, Abweichung Nr. 32). Das Geburtsjahr allein sagt nicht, ob der Geburtstag VOR dem
  # Verkauf lag; im Jahr, in dem VZ − geburtsjahr genau 55 ergibt, fragt die Software nach. "nein" macht die Person ueber das
  # Alter nicht berechtigt (dauernde Berufsunfaehigkeit bleibt), "ja" und keine Antwort berechtigen wie bisher. Die Frage
  # steht NUR in diesem Jahr: feld_bedingung alter_im_vz auf geburtsjahr (ein Altersvergleich, den wert/wert_nicht nicht
  # koennen); ein fehlendes Geburtsjahr schliesst sie nicht aus (fail-closed). KEIN geltungsbedingung (ein fragbares
  # bool-Gate auf dem Sammel-Scope schluesse bei bestaetigtem false die ganze Regel aus).
  - feld_id: alter_55_vor_verkauf
    quelle: {regel_id: p34_3_ermaessigter_durchschnittssatz, signatur_slot: alter_55_vor_verkauf}
    feld_bedingung: {feld: geburtsjahr, alter_im_vz: 55, grund: "Die Frage gilt nur im Jahr, in dem die Person nach ihrem Geburtsjahr 55 wird: davor und danach beantwortet das Geburtsjahr, ob das 55. Lebensjahr vollendet ist (§ 34 Abs. 3 S. 1 EStG)."}
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hattest du deinen 55. Geburtstag schon, bevor du deinen Betrieb verkauft oder aufgegeben hast?"
    hilfe_kurz: "Du wirst in diesem Jahr 55. Für den ermäßigten Steuersatz zählt, dass du das 55. Lebensjahr vollendet hattest, als der Gewinn entstand. Dein Geburtsjahr allein zeigt das nicht. Ohne Antwort rechnet das Programm, als wärst du schon 55 gewesen."
    beispielwert: true
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Eligibility-Auskunft zur Altersgrenze (§ 34 Abs. 3 S. 1 „das 55. Lebensjahr vollendet hat“), kein Betragsfeld; die Antragszeile steht an p34_abs3_antragsbetrag."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 1 EStG"
      zitatanker: "das 55. Lebensjahr vollendet hat"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"
  # Berechnete Antragszeile (Vault backlog p34-antrag-ohne-kennzahl-erreicht-elster-nicht, AK1/AK3): der Gewinn der
  # Basiszeile, für den der ermäßigte Satz beantragt wird. Entsteht in _mit_ring_werten nur, wenn der Chooser
  # Abs. 3 auch rechnet (Antrag UND _abs3_eligible UND 0 < netto_vg <= 5 Mio) und wird über
  # est_mapping.VERZWEIGUNG nach rentner_veraeusserungs_betriebsart auf die Antrags-Kz der Anlage gelenkt.
  # antrag_ermaessigter_satz selbst bleibt ohne Kz: er ist ein Tatbestand, kein Betrag.
  - feld_id: p34_abs3_antragsbetrag
    quelle: {regel_id: p34_3_ermaessigter_durchschnittssatz, geltungsbedingung: antrag_gestellt}
    typ: cent
    einheit: EUR
    askable: false
    vorjahr: uebernehmbar
    fragetext_laie: null
    hilfe_kurz: "Berechnet: der Veräußerungsgewinn, für den der ermäßigte Steuersatz beantragt wird."
    beispielwert: null
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Verzweigt: das Kz haengt an rentner_veraeusserungs_betriebsart (est_mapping VERZWEIGUNG, Klasse f) — gewerbe E0801602 [G/VAe_G_v_FB/Betr_TBetr_MUAnt/VAe_G_FB_Antr] / selbstaendig E0805003 [S/VAe_Gew/Vor_FB] / land_forst E0901704 [L/VAe_G_v_FB/VAe_G_FB_Antr], je im Container der Basiszeile (E0801301 / E0804501 / E0901201), Schema E10-2024 und E10-2025 (E10-2026 liegt im ERiC-Paket 44.2.4.0 nicht vor). Der kein-FB-Zweig (E0801903 / E0805305 / E0902002) bleibt unbeschrieben: seine Basiszeilen (E0801401 / E0804601 / E0901302) schreibt TaxGraph nicht."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34 Abs. 3 S. 1 EStG"
      zitatanker: "so kann auf Antrag abweichend von Absatz 1 die auf den Teil dieser außerordentlichen Einkünfte, der den Betrag von insgesamt 5 Millionen Euro nicht übersteigt, entfallende Einkommensteuer nach einem ermäßigten Steuersatz bemessen werden"
      datei: "sources/gesetze-im-internet/estg_p34_2026-07-13.txt"

  # ===== GewSt § 35-Anrechnung S1 (Gewerbesteuer auf ESt): Messbetrag-Input-Pfad =====
  # § 35 EStG: die tarifliche ESt ermäßigt sich um min(4× Messbetrag [„das Vierfache", geltende Fassung 2026 —
  # NICHT 3,8×, angehoben VZ 2020], tatsächlich zu zahlende GewSt = Messbetrag × Hebesatz; Ermäßigungshöchstbetrag).
  # S1 = Messbetrag-INPUT (vorberechnet aus dem GewSt-Bescheid, umgeht §7/§8/§9/§10a-Kette = S2). Nur gewerbe
  # (§18/§13 nicht gewerbesteuerpflichtig; dev-1s Zähler-Gating). dev-1s slot_fn liest die feld_ids 1:1.
  - feld_id: gewst_hebesatz
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: gewst_hebesatz}
    feld_bedingung: {feld: kein_gewinn, wert: false, grund: "§ 15/§ 13/§ 18 EStG setzen Gewinneinkuenfte voraus. `kein_gewinn` erhebt genau das; wer bestaetigt, keine zu haben, hat keinen Betrieb, zu dem Art, Bezeichnung, Hoehe oder Gewerbesteuer zu erklaeren waeren. Das Feld sitzt in der Basisregel p2_festzusetzung_*, die nie entfallen darf — deshalb auf Feldebene und nicht ueber regel_bedingungen."}
    typ: int
    einheit: null
    bereich: {min: 1, max: 999, grund: "Reine Sanity-Bound (Hebesatz-Prozentzahl > 0). KEIN gesetzlicher Mindesthebesatz-Anker — § 16 Abs. 4 S. 2 GewStG (200 %) ist source-pending (GewStG-§ 16-Quelle nicht lokal); übliche Hebesätze 200-900 % sind nur Hinweis, keine harte Grenze."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie hoch ist der Gewerbesteuer-Hebesatz deiner Gemeinde (in Prozent)?"
    hilfe_kurz: "Steht auf deinem Gewerbesteuer-Bescheid oder bei der Gemeinde (übliche Werte 200-900 %, z. B. 450). Bestimmt die tatsächlich gezahlte Gewerbesteuer für die Anrechnung auf die Einkommensteuer (§ 35)."
    beispielwert: 450
    herkunft_slots: null
    # E10/G/St_Erm_P35/Ang_GSt_GMB/Einz_Betr/Zu_zah_GSt_VZ — "Hebesatz in Prozent",
    # Ganzzahl wie unser typ:int. Erster Betrieb (s. gewst_messbetrag). Belegt 2026-08-05.
    elster_kz: E0801705
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 35 Abs. 1 S. 1 EStG"
      zitatanker: "tatsächlich zu zahlende Gewerbesteuer"
      datei: "sources/gesetze-im-internet/estg_p35_2026-07-14.txt"
  - feld_id: gewst_messbetrag
    vorschlagbar_von: [beleg]
