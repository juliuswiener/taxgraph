  # ========================= Veranlagungsart (§ 26) =========================
  - feld_id: veranlagung
    quelle: {regel_id: p2_festzusetzung_einzel, signatur_slot: veranlagung}
    typ: enum
    einheit: null
    enum_werte: ["einzel", "zusammen"]
    askable: true
    vorjahr: uebernehmbar
    # Julius-Entscheid 2026-08-12: die KI DARF die Veranlagungsart vorschlagen. Sie war bis dahin
    # human-only (Default fail-closed), weil der Katalog Wahlrechte grundsätzlich ausschließt
    # (§ 26 Abs. 1 S. 1 EStG ist ein Wahlrecht). Begründung der Öffnung: das LLM liest hier einen
    # FAKT aus dem Freitext ("verheiratet, geben zusammen ab") und übt kein Wahlrecht aus — die
    # Ausübung bleibt beim Menschen, weil der Vorschlag nur zustand=vorlaeufig erzeugt und ein
    # signal_2 braucht (store.py Auflage A + Typ-Zwang). Steht bereits ein Wert des Nutzers, wird
    # daraus KEIN stiller Ersatz, sondern ein Konflikt: veranlagung ist das einzige Feld in
    # bindung_regel_bedingungen.yaml und damit ein "großer" Konflikt, der zurückfragt statt zu
    # überschreiben. Gate dazu: tests/test_veranlagung_llm_freigabe.py.
    # Gilt NUR für dieses Feld — kein Präzedenzfall für andere Wahlrechte.
    vorschlagbar_von: [llm]
    fragetext_laie: "Gibst du die Erklärung allein oder gemeinsam mit Ehe-/Lebenspartner ab?"
    hilfe_kurz: "Gemeinsam = Zusammenveranlagung (oft günstiger bei unterschiedlichen Einkommen); allein = Einzelveranlagung."
    beispielwert: "einzel"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Veranlagungsart-Weiche (Mantelbogen); global, kein eigenes Betrags-Kz — die Wahl steuert den Tarif (Grund- vs. Splittingtarif), sie wird nicht als Betrag deklariert."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 26 Abs. 1 S. 1 EStG"
      zitatanker: "Ehegatten können zwischen der Einzelveranlagung (§ 26a) und der Zusammenveranlagung (§ 26b) wählen"
      datei: "sources/gesetze-im-internet/estg_p26_2026-07-17.txt"

  # ===== Abwesenheits-Flags (§ 2 Abs. 1 Einkunftsarten): bestätigte-Null-Blöcke =====
  # Anwendbarkeits-VORAUSSETZUNG des reinen Arbeitnehmerfalls (kein Festsetzungs-Input) → JE FRAGE
  # ein eigener Pseudoregel-Scope (p2_einkunftsart_gewinn/_kap/_vuv/_sonstige).
  # 2026-08-14: die vier Flags hingen vorher an EINER Regel p2_einkunftsarten. relevanz() wertet die
  # Gates einer Regel konjunktiv aus und bricht beim ersten bestätigten False ab (traverser.py:118-124)
  # — wer eine Einkunftsart BEJAHTE (Haut-Inversion: kein_X=false), schloss damit die ganze Regel aus
  # und bekam die anderen drei Fragen nie gestellt. Konjunktive Gates sind für Tatbestandsmerkmale
  # richtig (§ 35a: bar bezahlt → kein Abzug, alle Detailfragen entfallen zu Recht) und für
  # UNABHÄNGIGE Screeningfragen falsch. Deshalb je Frage eine eigene regel_id, in der sie das
  # einzige Gate ist. Gate: tests/test_screening_fragen_unabhaengig.py. Positive Frage in der Haut ("Hattest du X?"), Antwort "nein"
  # → die Haut speichert kein_X=true (bestätigte Null der Einkunftsart) — Invertierung liegt in der Haut
  # (dev-1), hier nur das bool-Feld. Kein Kz (Anwendbarkeits-Flag, kein Deklarationsfeld).
  # beispielwert=false: Normalfall Privatnutzer 'Nein, hatte kein X' (Haut-Inversion !ja -> kein_X=true=abwesend,
  # fail-closed-sicher). UI-PREFILL-Effekt hängt an dev-1s bool-select-Prefill (app.js liest beispielwert noch
  # nicht, defaultet 'Ja') = dev-1 UI-Politur; beispielwert ist forward-ready (Instructor-Ruling 2026-07-18).
  - feld_id: kein_gewinn
    quelle: {regel_id: p2_einkunftsart_gewinn, geltungsbedingung: keine_gewinneinkuenfte}
