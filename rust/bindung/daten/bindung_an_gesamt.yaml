    elster_kz_grund: "ENDGUELTIG: §15-Sondervergütung, in E0800502 aufgegangen. Schema E0800602 (ein Betrag), keine Sondervergütungs-Trennung."
    vz_gueltigkeit: [2024, 2025, 2026]
