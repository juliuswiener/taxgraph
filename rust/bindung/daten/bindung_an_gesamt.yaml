    fragetext_laie: "Wie viel steuerfreien Zuschuss zu seiner gesetzlichen Krankenversicherung hat der Arbeitgeber deines Ehe-/Lebenspartners dieses Jahr gezahlt?"
    hilfe_kurz: "Person-individuell: steht in der Lohnsteuerbescheinigung deines Partners unter Nr. 24 a. Das ist der steuerfreie Zuschuss, den der Arbeitgeber zusätzlich zahlt, zum Beispiel wenn dein Partner freiwillig gesetzlich versichert ist. Bei Pflichtversicherten bleibt Nr. 24 a leer: dann trage 0 ein. Den Beitrag trägst du oben ohne Abzug des Zuschusses ein, die Software zieht ihn ab."
