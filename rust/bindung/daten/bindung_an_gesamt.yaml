      grund: "§ 26b EStG: nur bei Zusammenveranlagung ist der Lohn des Partners ueberhaupt zu erklaeren. Wer allein veranlagt wird, hat keinen Partner-Zweig und darf diese Frage nicht sehen."
      und:
        feld: bruttoarbeitslohn_partner
        groesser_als: 0
        grund: "Leistungen des Arbeitgebers stehen in der Lohnsteuerbescheinigung des Partners zum Arbeitslohn: ohne bestaetigten Lohn ueber 0 Euro gibt es keine Bescheinigung, auf der sie stuenden."
    typ: bool
    einheit: null
    askable: true
    fragetext_laie: "Hat der Arbeitgeber deines Ehe-/Lebenspartners ihm Fahrtkosten oder Kosten einer doppelten Haushaltsführung steuerfrei oder pauschal besteuert erstattet oder bezuschusst, zum Beispiel ein Job-Ticket, eine Fahrtkostenerstattung bei einer Auswärtstätigkeit oder eine Trennungsentschädigung, oder hat er ihn unentgeltlich oder verbilligt zur Arbeit befördert (Sammelbeförderung)?"
    hilfe_kurz: "Das steht in der Lohnsteuerbescheinigung deines Partners: die steuerfreien und die pauschal besteuerten Arbeitgeberleistungen für Fahrten zwischen Wohnung und Arbeitsstätte (Nummer 17 und 18), die steuerfreien Leistungen für Fahrtkosten bei einer Auswärtstätigkeit und bei einer doppelten Haushaltsführung und der Großbuchstabe F bei steuerfreier Sammelbeförderung. Der Vordruck verlangt dafür die Zeile 51, die Zeile 71, die Zeile 34 der Anlage N-DHF und die Angabe zur Sammelbeförderung (Zeilen 32, 40 und 48); die Erklärung trägt diese Angaben nicht. Antwortest du Ja, ist die Abgabe gesperrt, und du trägst die Angaben im amtlichen Formular selbst ein. Der Normalfall ist Nein. Beantworte die Frage trotzdem, denn ohne Antwort ist die Abgabe gesperrt."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Wie `lohn_erstattungen` von Person A: Rueckfrage, kein Deklarationsfeld. Bei Ja (und bestaetigter Zusammenveranlagung) sperrt `Bau::lohn_rueckfragen` die Abgabe, ohne Antwort ebenso mit eigenem Text (Abweichung Nr. 86)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "Anlage N, Zeile 51"
      zitatanker: "Arbeitgeberleistungen laut Nr. 17"
      datei: "sources/bfinv/anlage_n_2025.txt"

