      zitatanker: "sonstige Einkünfte im Sinne des § 22"
      datei: "sources/gesetze-im-internet/estg_p2_2026-07-14.txt"

  # Screening-Flag "Privater Verkauf" (§ 23 EStG, 2026-08-30): eigene Pseudoregel, gleiche Bauart
  # wie die vier Einkunftsart-Flags darueber -- kein Gate an der echten Regel
  # p23_veraeusserungsgewinn, sonst waere es an deren vier ECHTE Befreiungs-geltungsbedingungen
  # gekoppelt (relevanz() wertet je regel_id konjunktiv aus). Seit Abweichung Nr. 54 (2026-10-10)
  # rechnet die Software die Befreiungen (Frist, Eigennutzung, taeglicher Gebrauch, Erbe) und die
  # Freigrenze; dieses Kreuz schaltet die Fragen zum Verkauf frei (Regel p23_veraeusserungsgewinn,
  # bindung_regel_bedingungen.yaml). Was sie nicht rechnet, sperrt mit Klartext (p23_sperrgrund).
  - feld_id: kein_p23_verkauf
    quelle: {regel_id: p23_verkauf_vorhanden, geltungsbedingung: veraeusserung_erklaert}
    typ: bool
    screening: true
    einheit: null
    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    fragetext_laie: "Hast du dieses Jahr ein Grundstück, eine Wohnung oder einen anderen Vermögensgegenstand (z. B. Aktien außerhalb des Depots, Kryptowährung, Kunst) privat verkauft?"
    hilfe_kurz: "Gemeint sind Verkäufe innerhalb der gesetzlichen Frist (Grundstücke: 10 Jahre, andere Gegenstände: 1 Jahr seit dem Kauf). Gegenstände des täglichen Gebrauchs wie dein Auto oder deine Möbel zählen nicht."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag, kein Deklarationsfeld — bestätigt der Nutzer einen Verkauf, rechnet die Software ihn (Abweichung Nr. 54); was sie nicht rechnet (Krypto, Beteiligung, Ehegatte, Teilnutzung) und unvollständige Angaben sperren mit Klartext (p23_sperrgrund), statt eine ungeprüfte Zahl auszugeben."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 23 Abs. 1 S. 1 EStG"
      zitatanker: "Private Veräußerungsgeschäfte (§ 22 Nummer 2) sind 1. Veräußerungsgeschäfte bei Grundstücken und Rechten, die den Vorschriften des bürgerlichen Rechts über Grundstücke unterliegen"
      datei: "sources/gesetze-im-internet/estg_p23_2026-07-13.txt"

  # Screening-Flag "Rente mit Leistungsmitteilung" (§ 22 Nr. 5 EStG, Abweichung Nr. 55, 2026-10-10): eigene Pseudoregel, gleiche
  # Bauart wie kein_p23_verkauf. Die Rente aus Riester-Vertrag, Pensionskasse, Pensionsfonds oder Direktversicherung steht NICHT
  # unter kein_sonstige: Stünde sie dort, sperrte jedes "Ja" die Scheibe `gesamt` mit `einkunftsart_nicht_ring_faehig`, bevor die
  # Frage zu den Beträgen kommt. Dieses Kreuz schaltet die Fragen der Gruppe rente_av_bav frei (Regel p22_nr5_rav_bav_leistung,
  # bindung_regel_bedingungen.yaml). Was die Software nicht rechnet, sperrt mit Klartext (rav_bav_sperrgrund).
  - feld_id: kein_rav_bav
    quelle: {regel_id: p22_nr5_rav_bav_vorhanden, geltungsbedingung: rav_bav_erklaert}
