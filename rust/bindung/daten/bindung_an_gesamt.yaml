  - feld_id: geburtsjahr_partner
    quelle: {regel_id: p2_festzusetzung_zusammen, signatur_slot: geburtsjahr_partner}
    # Dieselbe Ableitung, die `geburtsjahr` fuer die eigene Person schon hat — sie fehlte nur auf
    # der Partner-Seite. Gemessen im Durchgang vom 2026-08-27: „In welchem Jahr bist du geboren?"
    # stand im Verlauf als ABLEITUNG und wurde nie gefragt, „In welchem Jahr ist dein
    # Ehe-/Lebenspartner geboren?" wurde gestellt — unmittelbar nachdem das Geburtsdatum des
    # Partners erhoben worden war. Die Angabe lag also schon vor.
    # Systematisch nachgesehen (alle 49 Partner-Felder gegen ihr Nutzer-Gegenstueck): das hier war
    # die EINZIGE Ableitung, die nur auf einer Seite deklariert war.
    ableitung: {aus: stammdaten_geburtsdatum_partner, art: jahr_aus_datum, grund: "Das Geburtsjahr des Partners steht in dessen Geburtsdatum, das die Stammdaten ohnehin erheben (§ 25 EStG i.V.m. § 149 AO, Angaben zur Person). Zweimal danach zu fragen ist eine Frage zu viel — fuer die eigene Person wird sie seit der Ableitung an `geburtsjahr` nicht mehr gestellt, fuer den Partner stand sie weiter in der Queue."}
    typ: int
    einheit: null
    bereich: {min: 1900, max: 2010, grund: "Geburtsjahr Ehe-/Lebenspartner, plausibler Bereich für erwerbstätige/rentennahe Steuerpflichtige."}
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "In welchem Jahr ist dein Ehe-/Lebenspartner geboren?"
    hilfe_kurz: "Person-individuell: bestimmt Prozentsatz und Höchstbetrag des Altersentlastungsbetrags deines Partners (eigene Kohorte nach dem Jahr, das der Vollendung des 64. Lebensjahres folgt)."
    beispielwert: 1958
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Kohorten-Schlüssel Person B (abgeleitet über die Tabelle), kein eigenes Betragsfeld; Person-Multiplikation, vollständiges Geburtsdatum im Mantelbogen."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 24a S. 5 EStG"
      zitatanker: "maßgebende Prozentsatz und der Höchstbetrag"
      datei: "sources/gesetze-im-internet/estg_p24a_2026-07-13.txt"
  - feld_id: person_b_idnr
    quelle: {regel_id: p2_festzusetzung_zusammen, geltungsbedingung: beide_ehegatten_zusammen_veranlagt}
    typ: text
    einheit: null
    # askable: false (2026-08-12): ERiC lehnt E0100082 amtlich ab, egal welcher Wert (s. elster_kz_grund
    # unten) — das Feld wird nicht mehr deklariert und darf keinen Bescheid mehr sperren
    # (AN_GESAMT_PARTNER/GESAMT_PARTNER_19 in api_constants.py). Damit ist es in keiner Scheibe mehr
    # erreichbar (SCHEIBEN[...]["felder"]) — es weiter askable zu lassen waere eine tote Frage.
    askable: false
    vorjahr: uebernehmbar
    fragetext_laie: "Wie lautet die steuerliche Identifikationsnummer deines Ehe-/Lebenspartners (11 Ziffern)?"
    hilfe_kurz: "Bei gemeinsamer Erklärung braucht das Finanzamt die Identifikationsnummer beider Personen. Steht auf dem Steuerbescheid oder dem Schreiben des Bundeszentralamts."
    beispielwert: "02476291358"
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "E0100082 (IDNrBaseCType_RABE) lehnt ERiC amtlich ab: 'Nutzdaten enthalten das Feld ... mit dem Eingefuegt-Kennzeichen J oder P' (rc=610301106), egal welcher Wert gesendet wird — gemessen 2026-08-12, scripts/measure_person_b_idnr.py. Das Kennzeichen kommt in E10-2025.xsd KEIN einziges Mal vor (reine ERiC-interne Laufzeitregel, dem Schema unsichtbar) — Person A's eigene IdNr (E0100081) erscheint aus demselben Grund auch nie im amtlichen Beispiel-XML. Beste Evidenz: beide Felder sind fuer einen ELSTER-internen Identitaets-/Zertifikatsfeed reserviert, kein vom Steuerpflichtigen zu deklarierendes Datum. Sweep (BACKLOG person-b-idnr-wird-abgelehnt) bestaetigt: von 10 Elementen mit demselben XSD-Typ ist nur dieses betroffen, kind_idnr (E0500406, gleicher Typ) ist sauber."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 26 Abs. 2 S. 2 EStG"
      zitatanker: "Ehegatten werden zusammen veranlagt, wenn beide Ehegatten die Zusammenveranlagung wählen"
      datei: "sources/gesetze-im-internet/estg_p26_2026-07-17.txt"
