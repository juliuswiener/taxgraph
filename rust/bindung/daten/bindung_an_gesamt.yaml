    screening: true
    einheit: null
    askable: true
    vorjahr: vorschlag
    frage_invertiert: true   # Feld benennt die Abwesenheit, die Frage fragt nach der Anwesenheit
    fragetext_laie: "Hast du dieses Jahr eine Rente oder eine Auszahlung aus einem Riester-Vertrag, einer Pensionskasse, einem Pensionsfonds oder einer Direktversicherung bekommen (mit einer Leistungsmitteilung deines Anbieters)?"
    hilfe_kurz: "Gemeint ist die Mitteilung über steuerpflichtige Leistungen, die dein Anbieter dir schickt. Eine gesetzliche Rente, eine Rente aus dem Versorgungswerk und eine Rürup-Rente zählst du hier nicht mit: danach fragen wir getrennt. Eine Werkspension mit Lohnsteuerbescheinigung gehört zum Arbeitslohn. Bei Zusammenveranlagung rechnet die Software diese Rente noch nicht und sperrt dann mit einer Erklärung. Die Frage gilt für dich, nicht für deinen Ehe- oder Lebenspartner."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anwendbarkeits-Flag, kein Deklarationsfeld — bestätigt der Nutzer eine solche Rente, rechnet die Software sie (Abweichung Nr. 55); was sie nicht rechnet (andere Nummern der Mitteilung, Basisrente) und unvollständige Angaben sperren mit Klartext (rav_bav_sperrgrund), statt eine ungeprüfte Zahl auszugeben."
    vz_gueltigkeit: [2024, 2025, 2026]
