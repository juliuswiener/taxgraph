# Bindungstabelle — §34c Abs.1 EStG DBA-Anrechnung ausländischer Steuer (Stufe-1).
# Single-Country-Nicht-DBA / DBA-Anrechnungsmethode. Fail-closed: multi-country, §32d-Kapital → sperr.
# Freistellungs-DBA (Abweichung Nr. 40, Julius 2026-10-08): der Bescheid rechnet den Progressionsvorbehalt (§32b), die
# Abgabe sperrt, bis die Erklaerung die Einkuenfte traegt; neben §34/§35 sperrt der Bescheid (dba_freistellung_offen).
# Muster: felder OPTIONAL (absent→0→safe).
# Kz: null+MVP (Anlage-AUS-Kz = dev-2-Folgeticket, XSD-recon nicht rushed).
# dba_auslaendische_einkuenfte hat ZWEI Bedeutungen je Methode:
#  - Anrechnung / kein Abkommen (Teilmenge-Invariant Q1): ⊆ Welteinkommen, NIE additiv zur GdE.
#  - Freistellung (Abweichung Nr. 40): ZUSAETZLICH zum uebrigen Einkommen (steht nicht darin), nach deutschem Recht ermittelt
#    (Einnahmen minus anteilige Werbungskosten, nicht der Bruttolohn); es hebt nur den Steuersatz (§32b Abs. 2 Nr. 2).
# Task §34c-Stufe-1, Stand 2026-07-21.
version: 1
scheibe: "§34c Abs.1 DBA-Anrechnung ausländischer Steuer (gesamt + rentner)"

bindungen:
  # ========================= Staat + Methode (Screening) =========================
  - feld_id: dba_staat
    quelle: {regel_id: p34c_1_anrechnung_hoechstbetrag, geltungsbedingung: per_country_ein_staat}
    typ: enum
    einheit: null
    enum_werte: ["Deutschland", "Frankreich", "Italien", "Oesterreich", "Schweiz", "Niederlande", "Polen", "Tschechien",
                 "Dänemark", "Luxemburg", "Türkei", "Grossbritannien", "Spanien", "USA", "Kanada", "sonstiger_staat"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Aus welchem Staat stammen deine ausländischen Einkünfte?"
    hilfe_kurz: "Das Land, in dem du die Einkünfte erzielt hast und in dem ausländische Steuer einbehalten wurde."
    beispielwert: Frankreich
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Anlage-AUS-Staatenschlüssel — Kz-Recon = dev-2-Folgeticket (null-MVP). Single-Country Stufe-1; multi-country (>1 Staat) sperrt dba_multi_country_offen."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 1 S. 1 EStG"
      zitatanker: "die Einkünfte aus diesem Staat entfällt"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"
  - feld_id: dba_methode
    quelle: {regel_id: p34c_1_anrechnung_hoechstbetrag, geltungsbedingung: kein_dba_mit_quellenstaat}
    typ: enum
    einheit: null
    enum_werte: ["kein_dba", "dba_anrechnung", "dba_freistellung"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Welche Methode gilt im Doppelbesteuerungsabkommen mit diesem Staat für deine Einkünfte?"
    hilfe_kurz: "Die meisten DBA sehen Freistellung vor (dann kein §34c); bei Anrechnungs-DBA oder ohne DBA greift §34c. Bei Freistellung bleiben die Einkünfte in Deutschland steuerfrei, erhöhen aber den Steuersatz auf dein übriges Einkommen (Progressionsvorbehalt). Frag deinen Steuerberater oder lies dein DBA nach."
    beispielwert: kein_dba
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "DBA-Methoden-Marker — kein direkter Kz (reine Ring-Logik, nicht deklariert). Freistellung: der Bescheid rechnet den Progressionsvorbehalt (§32b, Abweichung Nr. 40); die Abgabe sperrt (bescheid::deklaration::einreichung), neben §34/§35 sperrt der Bescheid mit dba_freistellung_offen."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 6 S. 1 EStG"
      zitatanker: "nicht anzuwenden, wenn die Einkünfte aus einem ausländischen Staat stammen, mit dem ein Abkommen zur Vermeidung der Doppelbesteuerung besteht"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"
  - feld_id: dba_einkunftsart
    quelle: {regel_id: p34c_1_anrechnung_hoechstbetrag, geltungsbedingung: methode_je_einkunftsart}
    typ: enum
    einheit: null
    enum_werte: ["unbewegliches_vermoegen", "unternehmensgewinne", "dividenden", "zinsen",
                 "lizenzgebuehren", "veraeusserungsgewinne", "unselbstaendige_arbeit",
                 "aufsichtsratsverguetungen", "kuenstler_sportler", "ruhegehaelter"]
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Um welche Art von ausländischen Einkünften handelt es sich?"
    hilfe_kurz: "Doppelbesteuerungsabkommen behandeln Einkunftsarten unterschiedlich: Arbeitslohn wird oft freigestellt, Zinsen und Lizenzgebühren dagegen angerechnet. Ohne Angabe rechnet TaxGraph mit der pauschalen Methode des Staates."
    beispielwert: unselbstaendige_arbeit
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Reiner Routing-Parameter für die Methodenwahl; kein Vordruck-Feld."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "Art. 24 Abs. 1 DBA-Polen 2003"
      zitatanker: "Einkünfte, die nach Artikel 11 Absatz 2, Artikel 12"
      datei: "sources/dba/dba_pl_abkommen_2003.txt"
  - feld_id: dba_mehrere_staaten
    quelle: {regel_id: p34c_1_anrechnung_hoechstbetrag, signatur_slot: mehrere_staaten}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Hast du ausländische Einkünfte aus mehr als einem Staat?"
    hilfe_kurz: "Die DBA-Anrechnung ist in Stufe-1 auf EINEN Staat beschränkt. Bei mehreren Staaten brauchst du eine Steuerberatung."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Feld (reine Ring-Logik, nicht deklariert). Bestätigt true → dba_multi_country_offen (fail-closed)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 1 S. 1 EStG"
      zitatanker: "die auf die Einkünfte aus diesem Staat entfällt"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"

  # ========================= Beträge (EURO) =========================
  - feld_id: dba_gezahlte_auslaendische_steuer
    quelle: {regel_id: p34c_1_anrechnung_hoechstbetrag, signatur_slot: gezahlte_auslaendische_steuer}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie viel ausländische Steuer wurde in diesem Staat tatsächlich einbehalten (um Ermäßigungen gekürzt)?"
    hilfe_kurz: "Betrag aus deiner ausländischen Steuerbescheinigung. Abzüglich etwaiger Erstattungen oder Ermäßigungsansprüche (§34c Abs.1 S.1)."
    beispielwert: 300000
    herkunft_slots: null
    # E10/AUS/Staat_Spez_InvFonds/Anzur_ausl_St — "für alle Einkunftsarten".
    # Ein-Staat-Fall: dba_mehrere_staaten=true ist fail-closed gesperrt (Stufe-1), es gibt
    # also genau einen Staat-Container. Belegt 2026-08-05.
    elster_kz: E0601901
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 1 S. 1 EStG"
      zitatanker: "gezahlte und um einen entstandenen Ermäßigungsanspruch gekürzte ausländische Steuer"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"
  - feld_id: dba_auslaendische_einkuenfte
    quelle: {regel_id: p34c_1_anrechnung_hoechstbetrag, signatur_slot: auslaendische_einkuenfte_staat}
    typ: cent
    einheit: EUR
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Wie hoch sind deine Einkünfte aus diesem Staat, nach Abzug der Werbungskosten (nicht der Bruttolohn)? Bei Freistellung zählt der Betrag zusätzlich zu deinen übrigen Einkünften, bei Anrechnung nur der Teil, der schon darin steht."
    hilfe_kurz: "⚠ Wichtig, je nach Methode. Freistellung (die Einkünfte sind in Deutschland steuerfrei): der Betrag steht NICHT in deinen übrigen Einkünften, trage ihn zusätzlich ein, ermittelt nach deutschem Recht (Einnahmen minus anteilige Werbungskosten, nicht der Bruttolohn). Er erhöht nur den Steuersatz auf dein übriges Einkommen. Anrechnung oder kein Abkommen: nur der ANTEIL deiner bereits deklarierten Einkünfte, der aus dem Ausland stammt — keine zusätzlichen Beträge. Er dient nur zur Berechnung des Höchstbetrags der Anrechnung."
    beispielwert: 4000000
    herkunft_slots: null
    # E10/AUS/Staat_Spez_InvFonds/Ek — "Einkünfte (einschließlich der gemäß § 3 Nr. 40 und
    # § 3c Abs. 2 EStG steuerfreien Teile ...)". Ein-Staat-Fall, s.o. Belegt 2026-08-05.
    elster_kz: E0601401
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 1 S. 2 EStG"
      zitatanker: "der sich bei der Veranlagung des zu versteuernden Einkommens, einschließlich der ausländischen Einkünfte"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"

  # ========================= §34c Abs.2 Abzug-Wahlrecht (Antrag) =========================
  - feld_id: dba_abzug_statt_anrechnung
    quelle: {regel_id: p34c_2_abzug_statt_anrechnung, geltungsbedingung: antrag_abzug_statt_anrechnung}
    typ: bool
    einheit: null
    askable: true
    vorjahr: uebernehmbar
    fragetext_laie: "Möchtest du die im Ausland gezahlte Steuer von deinen Einkünften abziehen, statt sie auf die deutsche Steuer anrechnen zu lassen (nur auf Antrag)?"
    hilfe_kurz: "Standard ist die Anrechnung (§34c Abs.1, meist günstiger). Der Abzug (Abs.2) lohnt nur in Sonderfällen — z.B. wenn keine deutsche Steuer da ist, auf die angerechnet werden könnte. Ohne Antrag wird angerechnet."
    beispielwert: false
    herkunft_slots: null
    # ponytail: kein Kz, die Abgabe sperrt (rust/elster/src/deklaration.rs, DBA_ABZUG_SPERRE), wenn der Marker true und die
    # gezahlte Steuer ueber 0 ist. Grenze: die Erklaerung kann den Abzug nicht tragen. Upgrade-Pfad: die Anleitung zur
    # Anlage AUS lesen (liegt lokal nicht), dann den Betrag unter E0600920 (Staat_Spez_InvFonds/Ek, "in Zeile 7 abgezogene
    # auslaendische Steuern nach § 34c Abs. 2", ein Betrag, KEIN Marker) statt unter E0601901 schreiben und die Einkuenfte
    # der Quell-Anlage kuerzen; dann die Sperre streichen. Je Ehegatte eine eigene Anlage AUS, je Staat ein Block: nicht gebaut.
    elster_kz: null
    elster_kz_grund: "Antrags-/Wahlrechts-Marker (Anlage-AUS) — reine Ring-Weiche (Abzug statt Anrechnung), Kz-Recon = dev-2-Folgeticket (null-MVP)."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 2 EStG"
      zitatanker: "auf Antrag bei der Ermittlung der Einkünfte abzuziehen"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"
  # Folgefrage zum Abzug (gebaut 2026-10-08, Abweichung Nr. 41 in rust/fixtures/README.md). Der Abzug gilt nur fuer die
  # tatsaechlich gezahlte Steuer; eine nach dem Abkommen als gezahlt geltende (fiktive) Steuer wird nur angerechnet, nie
  # abgezogen (§ 34c Abs. 6 S. 2 EStG; Anleitung Anlage AUS 2025, Zeile 13). Der Bescheid rechnet den Abzug darum nur ohne
  # fiktive Steuer: "ja" sperrt mit `dba_abzug_offen`. Normalfall ist "nein"; "nein" und keine Antwort rechnen den Abzug (wie
  # `dba_mehrere_staaten`). Kein Gate (keine `geltungsbedingung`): die Frage haelt die Regel nicht auf `unentschieden`
  # (Vault: decisions/ein-neues-betragsfeld-haengt-an-feld-bedingung-nie-an-geltungsbedingung).
  - feld_id: dba_fiktive_steuer_vorhanden
    quelle: {regel_id: p34c_2_abzug_statt_anrechnung, signatur_slot: fiktive_steuer_vorhanden}
    typ: bool
    einheit: null
    askable: true
    vorjahr: vorschlag
    # Zwei Bedingungen, beide muessen gelten: der Abzug ist nicht mit "nein" abgewaehlt (`wert: true`: nur ein bestaetigtes
    # "nein" streicht die Frage, Schweigen laesst sie stehen) UND eine bestaetigte gezahlte Steuer ueber 0 (`und` mit
    # `groesser_als`, positiver Beweis). Ohne gezahlte Steuer gibt es keinen Abzug, dessen Betrag zu kuerzen waere.
    feld_bedingung:
      feld: dba_abzug_statt_anrechnung
      wert: true
      grund: "§ 34c Abs. 2 EStG erlaubt den Abzug nur für die tatsächlich gezahlte Steuer. Wer den Abzug nicht gewählt hat, rechnet die Anrechnung, und die Frage nach einer fiktiven Steuer ändert dort nichts. Schweigen auf die Abzugsfrage lässt die Folgefrage stehen, damit niemand den Abzug rechnen lässt, ohne sie gesehen zu haben."
      und:
        feld: dba_gezahlte_auslaendische_steuer
        groesser_als: 0
        grund: "Ohne bestätigte gezahlte Steuer über 0 Euro gibt es keinen Abzug und damit keinen Betrag, den eine fiktive Steuer kürzen könnte. Die Frage verlängerte nur das Interview."
    fragetext_laie: "Ist ein Teil der Steuer „fiktiv“, hat Deutschland sie also laut Abkommen als gezahlt anzusehen, obwohl der andere Staat sie dir erlassen hat?"
    hilfe_kurz: "Das ist selten. Fiktive Steuer gibt es nur, wenn ein Abkommen eine Steuer ausdrücklich als gezahlt gelten lässt. Man kann diese Steuer anrechnen, aber nicht abziehen. Antwortest du mit ja, rechnet die Software den Abzug nicht und sperrt die Berechnung; wähle dann die Anrechnung. Im Zweifel antworte mit nein."
    beispielwert: false
    herkunft_slots: null
    elster_kz: null
    elster_kz_grund: "Screening-Feld (reine Ring-Logik, nicht deklariert). Bestätigt oder vorläufig true bei gewähltem Abzug → dba_abzug_offen (fail-closed). Anlage AUS Zeile 13 (E0602001) trägt die fiktive Steuer selbst; die Software meldet sie nicht."
    vz_gueltigkeit: [2024, 2025, 2026]
    anker_ref:
      quelle: "§ 34c Abs. 6 S. 2 EStG"
      zitatanker: "bei nach dem Abkommen als gezahlt geltenden ausländischen Steuerbeträgen sind Absatz 1 Satz 3 und Absatz 2 nicht anzuwenden"
      datei: "sources/gesetze-im-internet/estg_p34c_2026-07-14.txt"

# ===== Lücken + Geltungsbedingungen (Nicht-Feld-Logik) =====
luecken:
  # -- p34c_1: Geltungsbedingungen, die keine Felder sind --
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    geltungsbedingung: methode_je_einkunftsart
    grund: "Per-Einkunftsart-Routing (P7.1) in DBA_METHOD_MAP_ART (api_constants.py), belegt am Methodenartikel des jeweiligen Abkommens. STAND: nur Polen (Art. 24 Abs. 1 DBA-PL 2003) ausgearbeitet; die übrigen zehn Länder laufen weiter über die pauschale DBA_METHOD_MAP, bis ihr Methodenartikel adjudiziert ist. Nicht abgebildet: Dividenden-Schachtelprivileg (Art. 24 Abs. 1 a S. 2), Aktivitätsvorbehalt (Buchst. c) und Teil-Absatz-Verweise (13 Abs. 2, 15 Abs. 3) — je Stufe 2."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    geltungsbedingung: keine_kapitalertraege_p32d
    grund: "§32d-Kapital-ESt-Ausnahme (§34c Abs.1 S.1 Hs.2). MVP: Guard dba_kapital_offen im Ring; echtes Routing = eigene Kz-Runde."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    geltungsbedingung: andockung_est_zve_p2
    grund: "deutsche_est_inkl_ausl + zvE = §2-Integrations-Andockung. Im Ring via catala_gesamt_tarifliche + catala_gesamt_zve bezogen."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    geltungsbedingung: steuer_festgesetzt_gezahlt_gekuerzt
    grund: "Input-Sachverhaltsannahme: ausl. Steuer = festgesetzt + gezahlt + um Ermäßigungsanspruch gekürzt. Im Feld dba_gezahlte_auslaendische_steuer materialisiert."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    geltungsbedingung: auslaendische_einkuenfte_p34d_katalog
    grund: "§34d-Katalog-Einkunfts-Qualifikation. MVP: Nutzer klassifiziert selbst (Teilmenge der deklarierten Einkünfte); Katalog-Check = eigene Runde."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    geltungsbedingung: zve_positiv
    grund: "Division definiert: zvE > 0. Accessor (catala_p34c_1) rechnet bei zvE≤0 → 0 (fail-closed)."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    signatur_slot: deutsche_est_inkl_ausl
    grund: "Berechnete Größe (deutsche ESt inkl. ausl. Einkünfte = catala_gesamt_tarifliche PRE-§34c); Ring-Andockung, kein Laien-Feld."
  - regel_id: p34c_1_anrechnung_hoechstbetrag
    signatur_slot: zu_versteuerndes_einkommen
    grund: "Berechnete Größe (zvE = catala_gesamt_zve); Ring-Andockung, kein Laien-Feld."
  # -- p34c_2: Stufe-2-Backlog --
  - regel_id: p34c_2_abzug_statt_anrechnung
    geltungsbedingung: kein_dba_mit_quellenstaat
    grund: "DBA-Vorrang (identisch p34c_1). Stufe-2: Abzug-Wahlrecht greift nur, wenn kein DBA-Freistellungs-Vorrang (§34c Abs.6)."
  - regel_id: p34c_2_abzug_statt_anrechnung
    geltungsbedingung: antrag_abzug_statt_anrechnung
    grund: "§34c Abs.2 Abzug-Wahlrecht auf Antrag — Stufe-2. Fail-closed in Stufe-1: ohne Antrag gilt die Anrechnung."
  - regel_id: p34c_2_abzug_statt_anrechnung
    geltungsbedingung: nur_nicht_steuerfreie_ausl_einkuenfte
    grund: "Nur nicht-steuerfreie ausl. Einkünfte rechenbar (§34c Abs.2 S.2). Stufe-2: Materialisierung der Einkunfts-Qualifikation."
  - regel_id: p34c_2_abzug_statt_anrechnung
    geltungsbedingung: steuer_soweit_auf_ausl_einkuenfte
    grund: "Steuer soweit auf ausl. Einkünfte entfallend (§34c Abs.2 S.1). Stufe-2: Abzug-Rechnung."
  - regel_id: p34c_2_abzug_statt_anrechnung
    signatur_slot: auslaendische_steuer_auf_ausl_einkuenfte
    grund: "Abzug – Betrag der auf ausl. Einkünfte entfallenden deutschen Steuer. Berechnete Größe, kein Laien-Feld. Stufe-2-Backlog."
