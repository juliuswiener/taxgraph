# Feld-Bestand der Bindungstabelle — Ratsche gegen stillen Verlust von Nutzerangaben
#
# ERZEUGT 2026-08-19 aus produkt/bindung/ (307 Felder). Diese Datei ist KEINE zweite Wahrheit
# ueber die Bindung: sie sagt nur, welche feld_ids es EINMAL GAB. Neue Felder muessen hier
# nicht eingetragen werden — die Ratsche kennt nur eine Richtung.
#
# WOZU: verschwindet eine feld_id aus der Bindung, verschwinden damit die Angaben, die Nutzer
# zu diesem Feld gemacht haben — aus der Oberflaeche, aus der Deklaration, aus dem Ergebnis.
# Die Events bleiben im Store liegen und materialisieren weiter zu einem Wert, den niemand mehr
# ansieht. Kein Absturz, keine Fehlermeldung: eine Angabe ist einfach weg.
#
# BELEGT, nicht ausgedacht: bb76dea hat Partner-Felder umgehaengt und dabei 15+ vorbestehende
# Tests umgerissen; aufgefallen ist es nur, weil Tests darauf zeigten. Haette es damals echte
# Faelle gegeben, waeren deren Angaben still verschwunden.
#
# WER EIN FELD ENTFERNT, traegt es in `entfernt:` ein — mit Grund und mit dem, was aus
# vorhandenen Angaben werden soll. Das ist der "paired Migration-Eintrag" aus dem Refactor-Plan
# (Phase 5, Punkt 5). tests/test_feld_bestand_ratsche.py haelt beides zusammen.

