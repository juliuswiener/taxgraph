# Bereichs-Bestand: Ratsche gegen den stillen Verlust und das stille Aufweichen eines Wertebereichs.
#
# WORUM ES GEHT: Bei der Erfassung trugen 42 Felder der Bindung `bereich: {min, max}`. Der Dienst weist beim Speichern jede
# Zahl ausserhalb von min..max ab (HTTP 422), nur die 0 bleibt zulaessig. Verschwindet `bereich` bei einem
# Feld, oder wird er weiter, nimmt der Dienst danach Werte an, die vorher abgewiesen wurden (z. B. -1 Kinder
# oder 367 Arbeitstage), und der Ring rechnet still damit. Kein Absturz, keine Meldung. Der Rand-Test in
# rust/api/tests/bereich_rand_hermetisch.rs liest die Felder live aus der Registry: faellt ein Feld heraus,
# faellt es dort einfach aus der Pruefung.
#
# WAS DIESE DATEI HAELT (Pruefung: rust/bindung/tests/bereich_bestand.rs):
#   felder:   feld_id -> min, max, so wie sie bei der Erfassung (2026-10-06) in rust/bindung/daten standen.
#             Ein Feld, das hier steht, muss noch einen `bereich` tragen, und zwar GENAU diesen.
#             Neue Felder mit `bereich` brauchen keinen Eintrag (Einbahn: es kann nichts verlieren).
#   entfernt: feld_id -> Begruendung (mehr als 30 Zeichen: warum der Bereich wegfaellt UND was aus
#             Angaben wird, die ausserhalb des alten Bereichs liegen). Ein Eintrag hier nimmt das Feld aus
#             `felder` heraus; er gilt nur, solange das Feld wirklich keinen `bereich` mehr traegt.
#
# WARUM GENAU UND NICHT NUR "NICHT WEITER": wuerde die Pruefung nur ein Weiterwerden melden, koennte jemand
# den Bereich zuerst enger machen (ohne Meldung) und spaeter wieder auf den alten Wert weiten (ohne Meldung).
# Beides aendert, was Nutzer eingeben duerfen. Jede Aenderung von min oder max ist ein Entscheid: eine Zeile
# hier und der Grund im Commit (welches Feld, welche Grenze, warum). Das kostet eine Zeile je Aenderung.
#
# Diese Datei ist keine zweite Wahrheit ueber den Bereich: sie haelt nur fest, was ohne Entscheid nicht
# wandern darf. Ob ein Bereich fachlich stimmt, belegen `anker_ref` und der Rand-Test, nicht diese Datei.

