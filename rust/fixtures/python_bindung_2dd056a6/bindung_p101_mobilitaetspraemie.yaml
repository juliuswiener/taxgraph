    geltungsbedingung: entfernung_ab_21_km
    grund: "Accessor-interner Gate: Entfernungspauschale ab 21 km vorhanden (entfernungspauschale_ab_21km > 0). Tarif-Seite prüft POST-Engine."

  - regel_id: p101_mobilitaetspraemie
    geltungsbedingung: ep_ueber_arbeitnehmer_pauschbetrag
