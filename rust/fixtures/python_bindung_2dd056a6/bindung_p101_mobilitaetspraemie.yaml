# Bindungstabelle § 101 Mobilitätsprämie — Geringverdiener-Förderung
# Prämie für Arbeitnehmer, deren Entfernungspauschale nicht zur Steuerminderung führt (zvE < Grundfreibetrag).
# Post-Engine-Wrapper (KEIN Input-Kegel, reine Tarifberechnung).
# Geltungsbedingungen aus Snapshot bedingungen[].

version: 1
scheibe: "§101 Mobilitätsprämie (Post-Engine-Wrapper)"

bindungen: []

luecken:
