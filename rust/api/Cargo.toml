[package]
name = "api"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "taxgraph-api"
path = "src/main.rs"

[features]
# Testbau fuer den Differenz-Harness: feste Uhr im Store (`store/festzeit`).
festzeit = ["store/festzeit"]

[dependencies]
bescheid = { path = "../bescheid" }
bindung = { path = "../bindung" }
interview = { path = "../interview" }
intervall = { path = "../intervall" }
konsistenz = { path = "../konsistenz" }
store = { path = "../store" }
auth = { path = "../auth" }
domain = { path = "../domain" }
eingang = { path = "../eingang" }
elster = { path = "../elster" }
engine = { path = "../engine" }
llm = { path = "../llm" }
axum = { workspace = true }
tokio = { workspace = true }
hyper-util = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
tower = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
domain = { path = "../domain", features = ["testhilfe"] }
http-body-util = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
