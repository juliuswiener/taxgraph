[package]
name = "api"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "taxgraph-api"
path = "src/main.rs"

[dependencies]
bescheid = { path = "../bescheid" }
bindung = { path = "../bindung" }
interview = { path = "../interview" }
intervall = { path = "../intervall" }
konsistenz = { path = "../konsistenz" }
store = { path = "../store" }
auth = { path = "../auth" }
domain = { path = "../domain" }
engine = { path = "../engine" }
axum = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
domain = { path = "../domain", features = ["testhilfe"] }
http-body-util = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
