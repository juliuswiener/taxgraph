[package]
autotests = false
name = "eingang"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
bindung = { path = "../bindung" }
store = { path = "../store" }
llm = { path = "../llm" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
wait-timeout = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# Testdateien liegen in tests/it.rs zu EINEM Test-Binary zusammen (weniger Links nach einer Aenderung der Bibliothek). Eigene Ziele:
# Dateien, die Umgebung oder Arbeitsverzeichnis des Prozesses aendern, und Dateien, die per `--test <name>` aufgerufen werden.
# rust/bindung/tests/testbinaries_vollstaendig.rs haelt fest, dass jede Datei in it.rs ODER hier steht.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "entscheidungen"
path = "tests/entscheidungen.rs"

[[test]]
